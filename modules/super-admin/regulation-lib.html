<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法规库管理 - 超管端</title>
  
  <style>
        /* ========== 按钮样式 ========== */

    .btn-default:hover{color:var(--primary);border-color:var(--primary)}
    
    .btn-primary:hover{background:var(--primary-hover)}
    
    .btn-link:hover{color:var(--primary-hover)}
    .btn-link.btn-sm{font-size: var(--font-size-xs);padding: 1px var(--spacing-xs)}
    
    .btn-danger:hover{background:var(--danger-light);border-color:var(--danger)}
/* 页面容器使用 flex 布局（覆盖 framework 默认 block） */
    .page-container {
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* 面包屑由 framework.css 提供，无需额外样式 */
    /* ========== 主内容区 ========== */
    .main-content { 
      flex: 1; 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }
    
    /* ========== 统计卡片区 ========== */
    .stats-cards {
      display: flex;
      gap: var(--spacing-md);
      padding: var(--spacing-md) 20px;
      background: var(--bg-section);
      border-bottom: 1px solid var(--border-section);
      flex-shrink: 0;
    }
    
    .stat-card.blue { background: var(--primary-light); }
    .stat-card.green { background: var(--success-light); }
    .stat-card.gray { background: var(--bg-secondary); }
    .stat-label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .stat-card.blue .stat-value { color: var(--primary); }
    .stat-card.green .stat-value { color: var(--success); }
    .stat-card.gray .stat-value { color: var(--text-tertiary); }
    
    /* ========== 筛选栏 ========== */
    
    .filter-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    .filter-item label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .filter-item select,
    .filter-item input {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      outline: none;
      min-width: 120px;
    }
    .filter-item input {
      min-width: 180px;
    }
    .filter-item select:focus,
    .filter-item input:focus {
      border-color: var(--primary);
    }
    
    /* ========== 操作栏 ========== */
    .action-bar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .action-left {
      display: flex;
      gap: var(--spacing-sm);
    }
    .action-right {
      display: flex;
      gap: var(--spacing-sm);
    }
    
    /* ========== 批量操作栏 ========== */
    .batch-bar {
      padding: 10px 20px;
      background: var(--primary-light);
      border-bottom: 1px solid var(--primary-light);
      display: none;
      align-items: center;
      gap: var(--spacing-md);
      flex-shrink: 0;
    }
    .batch-bar.show {
      display: flex;
    }
    .batch-info {
      font-size: var(--font-size-sm);
      color: var(--primary);
    }
    .batch-actions {
      display: flex;
      gap: var(--spacing-sm);
    }
    
    /* ========== 数据表格 ========== */
    .table-container {
      flex: 1;
      overflow: auto;
      padding: 0;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-size-sm);
    }
    .data-table th {
      background: var(--bg-section);
      padding: 12px var(--spacing-md);
      text-align: left;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-section);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .data-table td {
      padding: 12px var(--spacing-md);
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
    }
    .data-table tr:hover td {
      background: var(--bg-page-solid);
    }
    .data-table .checkbox-col {
      width: 40px;
      text-align: center;
    }
    .data-table .action-col {
      width: 200px;
      box-shadow: -2px 0 8px rgba(0,0,0,0.05);
    }
    .data-table td.action-col .btn-link:last-child { margin-right: 0; }
    
    /* ========== 状态标签 ========== */
    .status-tag {
      display: inline-block;
      padding: 2px var(--spacing-sm);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      font-weight: 500;
    }
    .status-tag.active {
      background: var(--success-light);
      color: var(--success);
    }
    .status-tag.repealed {
      background: var(--bg-secondary);
      color: var(--text-tertiary);
    }

    /* ========== 法规类型标签 ========== */
    .type-tag {
      display: inline-block;
      padding: 2px var(--spacing-sm);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      background: var(--primary-light);
      color: var(--primary);
    }
    
    /* 分页 - .pagination 由 framework.css 提供, JS 分页由 pagination.js 驱动 */
    
    /* ========== 弹窗样式 ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      width: 640px;
      max-width: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .modal-header {
      padding: var(--spacing-md) 20px;
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--text-primary);
    }
    .modal-close {
      font-size: var(--font-size-xxl);
      color: var(--text-tertiary);
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover {
      color: var(--text-primary);
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: var(--spacing-md) 20px;
      border-top: 1px solid var(--border-section);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    
    /* ========== Tab切换 ========== */
    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-section);
      margin-bottom: 20px;
    }
    .modal-tab {
      padding: 12px 20px;
      cursor: pointer;
      font-size: var(--font-size-md);
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .modal-tab:hover {
      color: var(--primary);
    }
    .modal-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 500;
    }
    
    /* ========== 表单样式 ========== */
    .form-row {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    .form-item {
      flex: 1;
    }
    .form-item.full-width {
      width: 100%;
    }
    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-label .required {
      color: var(--danger);
      margin-left: 2px;
    }
    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: var(--spacing-sm) 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      outline: none;
      box-sizing: border-box;
    }
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--primary);
    }
    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* ========== 领域选择器 ========== */
    .domain-selector {
      width: 100%;
      padding: var(--spacing-sm) 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-primary);
      box-sizing: border-box;
    }
    .domain-selector:hover {
      border-color: var(--primary);
    }
    .domain-placeholder {
      color: var(--text-tertiary);
    }
    .domain-selector.has-value .domain-placeholder {
      color: var(--text-primary);
    }
    .domain-arrow {
      color: var(--text-tertiary);
      font-size: var(--font-size-xs);
    }
    .domain-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: var(--spacing-sm);
    }
    .domain-tag {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-xs) var(--spacing-sm);
      background: var(--primary-light);
      color: var(--primary);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
    }
    .domain-tag-remove {
      cursor: pointer;
      color: var(--primary);
      font-weight: bold;
    }
    .domain-tag-remove:hover {
      color: var(--danger);
    }

    /* ========== 领域树弹窗 ========== */
    .domain-tree-modal .modal-content {
      width: 480px;
    }
    .domain-tree-search {
      padding: 12px var(--spacing-md);
      border-bottom: 1px solid var(--border-section);
    }
    .domain-tree-search input {
      width: 100%;
      padding: var(--spacing-sm) 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
    }
    .domain-tree-content {
      max-height: 400px;
      overflow-y: auto;
      padding: 12px var(--spacing-md);
    }
    .domain-tree-category {
      margin-bottom: var(--spacing-sm);
    }
    .domain-tree-category-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-weight: 500;
      color: var(--text-primary);
    }
    .domain-tree-category-header:hover {
      background: var(--bg-page-solid);
    }
    .domain-tree-toggle {
      font-size: 10px;
      color: var(--text-tertiary);
      transition: transform var(--duration-normal);
    }
    .domain-tree-toggle.expanded {
      transform: rotate(90deg);
    }
    .domain-tree-children {
      padding-left: var(--spacing-lg);
    }
    .domain-tree-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: 6px var(--spacing-sm);
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .domain-tree-item:hover {
      background: var(--bg-page-solid);
    }
    .domain-tree-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .domain-tree-label {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
    }
    .domain-tree-empty {
      text-align: center;
      padding: 40px;
      color: var(--text-tertiary);
    }

    /* ========== 附件上传 ========== */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      text-align: center;
      cursor: pointer;
      transition: border-color var(--duration-normal);
    }
    .upload-area:hover {
      border-color: var(--primary);
    }
    .upload-icon {
      font-size: 32px;
      color: var(--text-tertiary);
      margin-bottom: var(--spacing-sm);
    }
    .upload-text {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }
    .upload-hint {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      margin-top: var(--spacing-xs);
    }
    
    /* ========== 条款列表 ========== */
    .clause-section {
      margin-top: 20px;
    }
    .clause-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .clause-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--text-primary);
    }
    .clause-list {
      border: 1px solid var(--border-section);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .clause-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
      align-items: flex-start;
    }
    .clause-item:last-child {
      border-bottom: none;
    }
    .clause-num {
      width: 40px;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      flex-shrink: 0;
      padding-top: var(--spacing-sm);
    }
    .clause-fields {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    .clause-row {
      display: flex;
      gap: 12px;
    }
    .clause-input {
      flex: 1;
    }
    .clause-input.number {
      flex: 0 0 100px;
    }
    .clause-input.title {
      flex: 1;
    }
    .clause-input.content {
      flex: 1;
    }
    .clause-delete {
      color: var(--danger);
      cursor: pointer;
      font-size: var(--font-size-lg);
      padding: 6px;
      flex-shrink: 0;
    }
    .clause-delete:hover {
      background: var(--danger-light);
      border-radius: var(--radius-sm);
    }
    
    /* ========== 详情弹窗特殊样式 ========== */
    .detail-section {
      margin-bottom: 20px;
    }
    .detail-section-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      padding-bottom: var(--spacing-sm);
      border-bottom: 1px solid var(--border-section);
    }
    .detail-item {
      display: flex;
      margin-bottom: 10px;
    }
    .detail-label {
      width: 100px;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .detail-value {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
    }
    .clause-collapse {
      border: 1px solid var(--border-section);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .clause-collapse-header {
      padding: 12px var(--spacing-md);
      background: var(--bg-section);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clause-collapse-content {
      padding: 12px var(--spacing-md);
      display: none;
    }
    .clause-collapse-content.show {
      display: block;
    }
    .clause-collapse-item {
      padding: var(--spacing-sm) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .clause-collapse-item:last-child {
      border-bottom: none;
    }
    
    /* ========== 按钮样式 ========== */

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    
    .btn-default:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .btn-danger:hover {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
    }
    
    .btn-link:hover {
      background: var(--primary-light);
    }
    .btn-sm {
      padding: var(--spacing-xs) 12px;
      font-size: var(--font-size-xs);
    }
    
    /* ========== 空状态 ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: var(--spacing-md);
    }
    .empty-text {
      font-size: var(--font-size-md);
    }
  </style>
</head>
<body>
  <!-- ========== 页面容器 ========== -->
  <div class="page-container" data-module="sa-regulation-lib">
    <!-- 面包屑 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">超管端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">法规库管理</span>
    </div>
    
    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 统计卡片区 -->
      <div class="stats-cards">
        <div class="stat-card blue">
          <div class="stat-label">法规总数</div>
          <div class="stat-value" id="statTotal">156</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">现行法规</div>
          <div class="stat-value" id="statActive">142</div>
        </div>
        <div class="stat-card gray">
          <div class="stat-label">废止法规</div>
          <div class="stat-value" id="statRepealed">14</div>
        </div>
      </div>
      
      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-item">
          <label>法规类型</label>
          <select id="filterType">
            <option value="">全部</option>
            <option value="law">法律</option>
            <option value="admin_regulation">行政法规</option>
            <option value="dept_rule">部门规章</option>
            <option value="local_regulation">地方性法规</option>
            <option value="national_standard">国家标准</option>
            <option value="industry_standard">行业标准</option>
          </select>
        </div>
        <div class="filter-item">
          <label>关键词</label>
          <input type="text" id="filterKeyword" placeholder="搜索法规名称">
        </div>
        <div class="filter-item">
          <label>状态</label>
          <select id="filterStatus">
            <option value="">全部</option>
            <option value="active">现行</option>
            <option value="repealed">废止</option>
            
          </select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="searchRegulations()">搜索</button>
        <button class="btn btn-default btn-sm" onclick="resetFilters()">重置</button>
      </div>
      
      <!-- 批量操作栏 -->
      <div class="batch-bar" id="batchBar">
        <span class="batch-info">已选择 <strong id="batchCount">0</strong> 项</span>
        <div class="batch-actions">
          <button class="btn btn-danger btn-sm" onclick="batchDelete()">批量删除</button>
          <button class="btn btn-default btn-sm" onclick="clearSelection()">取消选择</button>
        </div>
      </div>
      
      <!-- 操作栏 -->
      <div class="action-bar">
        <div class="action-left">
          <button class="btn btn-primary" onclick="openAddModal()">
            <span>+</span> 新增法规文件
          </button>
        </div>
        <div class="action-right">
          <button class="btn btn-default" onclick="batchImport()">批量导入</button>
          <button class="btn btn-default" onclick="batchExport()">批量导出</button>
        </div>
      </div>
      
      <!-- 数据表格 -->
      <div class="table-container table-scroll">
        <table class="data-table" id="regulationTable">
          <thead>
            <tr>
              <th class="checkbox-col">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
              </th>
              <th style="width:60px">序号</th>
              <th>法规名称</th>
              <th>法规类型</th>
              <th>发布日期</th>
              <th>生效日期</th>
              <th>状态</th>
              <th>条款数量</th>
              <th class="action-col">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- 动态渲染 -->
          </tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon">📋</div>
          <div class="empty-text">暂无数据</div>
        </div>
      </div>
      
      <!-- 分页 -->
      <div class="pagination" id="paginationBar"></div>
    </div>
  </div>
  
  <!-- ========== 新增/编辑弹窗 ========== -->
  <div class="modal-overlay" id="regulationModal">
    <div class="modal-content" style="width:900px;max-width:90vw">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">新增法规文件</span>
        <span class="modal-close" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-item">
            <label class="form-label">法规名称<span class="required">*</span></label>
            <input type="text" class="form-input" id="regulationName" placeholder="请输入法规名称">
          </div>
          <div class="form-item">
            <label class="form-label">法规类型<span class="required">*</span></label>
            <select class="form-select" id="regulationType" onchange="handleRegulationTypeChange()">
              <option value="">请选择</option>
              <option value="law">法律</option>
              <option value="admin_regulation">行政法规</option>
              <option value="dept_rule">部门规章</option>
              <option value="local_regulation">地方性法规</option>
              <option value="national_standard">国家标准</option>

    container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:10000;';
    document.body.appendChild(container);
  }
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.style.cssText = 'padding:10px 20px;margin-bottom: var(--spacing-sm);border-radius: var(--radius-sm);background:var(--primary);color:var(--bg-primary);font-size: var(--font-size-md);box-shadow: var(--shadow-md);';
  if (type === 'success') toast.style.background = 'var(--success)';
  if (type === 'warning') toast.style.background = 'var(--warning)';
  if (type === 'error') toast.style.background = 'var(--danger)';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

    function updateStats() {
      const total = regulationData.length;
      const active = regulationData.filter(r => r.status === 'active').length;
      const repealed = regulationData.filter(r => r.status === 'repealed').length;
      
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statRepealed').textContent = repealed;
    }
    
    // ========== 表格渲染 ==========
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const filteredData = getFilteredData();
      
      if (filteredData.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('regulationTable').style.display = 'none';
        return;
      }
      
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('regulationTable').style.display = 'table';
      
      // 分页计算
      pgState.total = filteredData.length;
      const start = (pgState.page - 1) * pgState.size;
      const end = start + pgState.size;
      const pageData = filteredData.slice(start, end);
      
      tbody.innerHTML = pageData.map((item, idx) => `
        <tr>
          <td class="checkbox-col">
            <input type="checkbox" ${selectedIds.has(item.id) ? 'checked' : ''} onchange="toggleSelect('${item.id}')">
          </td>
          <td>${start + idx + 1}</td>
          <td title="${item.name}">${item.name}</td>
          <td><span class="type-tag">${regulationTypes[item.type]}</span></td>
          <td>${item.publishDate}</td>
          <td>${item.effectiveDate || '—'}</td>
          <td><span class="status-tag ${statusMap[item.status].class}">${statusMap[item.status].text}</span></td>
          <td>${item.clauseCount}</td>
          <td class="action-col">
            <button class="btn btn-link" onclick="openEditModal('${item.id}')">编辑</button>
            <button class="btn btn-link" onclick="openDeleteModal('${item.id}')">删除</button>
            <button class="btn btn-link" onclick="openDetailModal('${item.id}')">详情</button>
          </td>
        </tr>
      `).join('');
      
      pg.setTotal(pgState.total);
    }
    
    // ========== 筛选逻辑 ==========
    function getFilteredData() {
      const type = document.getElementById('filterType').value;
      const keyword = document.getElementById('filterKeyword').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      
      return regulationData.filter(item => {
        if (type && item.type !== type) return false;
        if (status && item.status !== status) return false;
        if (keyword && !item.name.toLowerCase().includes(keyword)) return false;
        return true;
      });
    }
    
    function searchRegulations() {
      pgState.page = 1;
      pg.setPage(1);
      renderTable();
    }
    
    function resetFilters() {
      document.getElementById('filterType').value = '';
      document.getElementById('filterKeyword').value = '';
      document.getElementById('filterStatus').value = '';
      pgState.page = 1;
      pg.setPage(1);
      renderTable();
    }

    // ========== 分页逻辑已由 pagination.js 组件接管 ==========

    // ========== 选择功能 ==========
    function toggleSelectAll() {
      const checked = document.getElementById('selectAll').checked;
      const filteredData = getFilteredData();
      
      if (checked) {
        filteredData.forEach(item => selectedIds.add(item.id));
      } else {
        filteredData.forEach(item => selectedIds.delete(item.id));
      }
      
      updateBatchBar();
      renderTable();
    }
    
    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateBatchBar();
    }
    
    function updateBatchBar() {
      const count = selectedIds.size;
      document.getElementById('batchCount').textContent = count;
      document.getElementById('batchBar').classList.toggle('show', count > 0);
    }
    
    function clearSelection() {
      selectedIds.clear();
      document.getElementById('selectAll').checked = false;
      updateBatchBar();
      renderTable();
    }
    
    // ========== 批量操作 ==========
    function batchDelete() {
      if (selectedIds.size === 0) return;
      
      if (confirm(`确定要删除选中的 ${selectedIds.size} 个法规文件吗？`)) {
        regulationData = regulationData.filter(item => !selectedIds.has(item.id));
        selectedIds.clear();
        updateBatchBar();
        updateStats();
        renderTable();
      }
    }
    
    function batchImport() {
      showToast('批量导入功能开发中...', 'info');
    }
    
    function batchExport() {
      showToast('批量导出功能开发中...', 'info');
    }
    
    // ========== 法规附件必填控制 ==========
    const STANDARD_TYPES = ['national_standard', 'industry_standard']; // 标准库类型

    function resetAttachmentArea() {
      const uploaded = document.getElementById('uploadedFile');
      if (uploaded) {
        uploaded.style.display = 'none';
        uploaded.innerHTML = '';
      }
      const uploadArea = document.querySelector('#regulationModal .upload-area');
      if (uploadArea) uploadArea.style.display = '';
      document.getElementById('fileInput').value = '';
    }

    function handleRegulationTypeChange() {
      const type = document.getElementById('regulationType').value;
      const label = document.getElementById('attachmentLabel');
      const uploadHint = document.getElementById('uploadHint');
      const isStandard = STANDARD_TYPES.includes(type);

      if (isStandard) {
        label.innerHTML = '全文内容（附件）<span style="color:var(--danger);margin-left:2px;">*</span>';
        uploadHint.textContent = '国家标准/行业标准必填；支持PDF、Word，最大20MB';
      } else {
        label.innerHTML = '全文内容（附件）';
        uploadHint.textContent = '支持PDF、Word格式，最大20MB';
      }
    }

    function handleFileSelect(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const uploaded = document.getElementById('uploadedFile');
      const uploadArea = document.querySelector('#regulationModal .upload-area');
      uploaded.style.display = 'flex';
      uploaded.innerHTML = `
        <span>📄 <strong>${file.name}</strong></span>
        <button onclick="removeAttachment()" style="color:var(--danger);padding:0;border:none;background:none;cursor:pointer;font-size: var(--font-size-sm);">删除</button>
      `;
      uploadArea.style.display = 'none';
    }

    function removeAttachment() {
      resetAttachmentArea();
      handleRegulationTypeChange();
    }

    // ========== 弹窗控制 ==========
    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '新增法规文件';
      document.getElementById('regulationName').value = '';
      document.getElementById('regulationType').value = '';
      document.getElementById('publishDate').value = '';
      document.getElementById('effectiveDate').value = '';
      document.getElementById('regulationStatus').value = 'active';
      initDomainTags([]);
      currentClauses = [];
      renderClauseList();
      // 重置附件
      resetAttachmentArea();
      handleRegulationTypeChange();
      document.getElementById('regulationModal').classList.add('active');
    }

    function openEditModal(id) {
      const item = regulationData.find(r => r.id === id);
      if (!item) return;

      editingId = id;
      document.getElementById('modalTitle').textContent = '编辑法规文件';
      document.getElementById('regulationName').value = item.name;
      document.getElementById('regulationType').value = item.type;
      document.getElementById('publishDate').value = item.publishDate;
      document.getElementById('effectiveDate').value = item.effectiveDate || '';
      document.getElementById('regulationStatus').value = item.status;

      // 设置适用领域（从领域小类中选择）
      initDomainTags(item.domains);

      currentClauses = item.clauses.map((c, i) => ({ ...c, id: i + 1 }));
      renderClauseList();
      // 重置附件并根据类型更新UI
      resetAttachmentArea();
      handleRegulationTypeChange();
      // 编辑时回显已有附件
      if (item.attachment) {
        const uploaded = document.getElementById('uploadedFile');
        uploaded.style.display = 'flex';
        uploaded.innerHTML = `<span>📄 <strong>${item.attachment.name}</strong></span><button class="btn btn-link btn-sm" onclick="removeAttachment()" style="color:var(--danger);padding:0;border:none;background:none;cursor:pointer;">删除</button>`;
        document.querySelector('.upload-area').style.display = 'none';
      }
      document.getElementById('regulationModal').classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('regulationModal').classList.remove('active');
    }
    
    // ========== 条款管理 ==========
    function renderClauseList() {
      const container = document.getElementById('clauseList');
      
      if (currentClauses.length === 0) {
        container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-tertiary);">暂无条款，点击"新增条款"添加</div>';
        return;
      }
      
      container.innerHTML = currentClauses.map((clause, index) => `
        <div class="clause-item" data-id="${clause.id}">
          <div class="clause-num">${index + 1}</div>
          <div class="clause-fields">
            <div class="clause-row">
              <input type="text" class="form-input clause-input number" placeholder="条款编号" value="${clause.number}" onchange="updateClause(${clause.id}, 'number', this.value)">
              <input type="text" class="form-input clause-input title" placeholder="条款标题" value="${clause.title}" onchange="updateClause(${clause.id}, 'title', this.value)">
            </div>
            <textarea class="form-input clause-input content" placeholder="条款内容" rows="2" onchange="updateClause(${clause.id}, 'content', this.value)">${clause.content}</textarea>
          </div>
          <span class="clause-delete" onclick="deleteClause(${clause.id})">&times;</span>
        </div>
      `).join('');
    }
    
    function addClauseRow() {
      const newId = currentClauses.length > 0 ? Math.max(...currentClauses.map(c => c.id)) + 1 : 1;
      currentClauses.push({ id: newId, number: '', title: '', content: '' });
      renderClauseList();
    }
    
    function updateClause(id, field, value) {
      const clause = currentClauses.find(c => c.id === id);
      if (clause) {
        clause[field] = value;
      }
    }
    
    function deleteClause(id) {
      currentClauses = currentClauses.filter(c => c.id !== id);
      renderClauseList();
    }
    
    // ========== 保存 ==========
    function saveRegulation() {
      const name = document.getElementById('regulationName').value.trim();
      const type = document.getElementById('regulationType').value;
      const publishDate = document.getElementById('publishDate').value;
      const effectiveDate = document.getElementById('effectiveDate').value;
      const status = document.getElementById('regulationStatus').value;
      
      // 校验
      if (!name) {
        showToast('请输入法规名称', 'warning');
        return;
      }
      if (!type) {
        showToast('请选择法规类型', 'warning');
        return;
      }
      if (!publishDate) {
        showToast('请选择发布日期', 'warning');
        return;
      }
      // 标准库附件必填校验
      if (STANDARD_TYPES.includes(type)) {
        const hasNewFile = document.getElementById('uploadedFile').style.display !== 'none' &&
                          document.getElementById('uploadedFile').innerHTML.trim() !== '';
        let hasExistingFile = false;
        if (editingId) {
          const item = regulationData.find(r => r.id === editingId);
          hasExistingFile = !!(item && item.attachment);
        }
        if (!hasNewFile && !hasExistingFile) {
          showToast('国家标准/行业标准必须上传全文附件', 'warning');
          return;
        }
      }
      // 获取适用领域（从领域小类中选择）
      const domains = Array.from(selectedDomainIds);
      
      // 过滤空条款
      const validClauses = currentClauses.filter(c => c.number.trim() || c.title.trim());
      
      if (editingId) {
        // 编辑
        const index = regulationData.findIndex(r => r.id === editingId);
        if (index !== -1) {
          regulationData[index] = {
            ...regulationData[index],
            name,
            type,
            publishDate,
            effectiveDate,
            status,
            domains,
            clauseCount: validClauses.length,
            clauses: validClauses,
            updateTime: new Date().toLocaleString('zh-CN')
          };
        }
      } else {
        // 新增
        const newId = String(regulationData.length + 1);
        regulationData.unshift({
          id: newId,
          name,
          type,
          publishDate,
          effectiveDate,
          status,
          domains,
          clauseCount: validClauses.length,
          clauses: validClauses,
          attachment: null,
          updateTime: new Date().toLocaleString('zh-CN')
        });
      }
      
      closeModal();
      updateStats();
      renderTable();
      showToast('保存成功', 'success');
    }
    
    // ========== 详情弹窗 ==========
    function openDetailModal(id) {
      const item = regulationData.find(r => r.id === id);
      if (!item) return;
      
      document.getElementById('detailName').textContent = item.name;
      document.getElementById('detailType').textContent = regulationTypes[item.type];
      document.getElementById('detailPublishDate').textContent = item.publishDate;
      document.getElementById('detailEffectiveDate').textContent = item.effectiveDate || '—';
      document.getElementById('detailStatus').innerHTML = `<span class="status-tag ${statusMap[item.status].class}">${statusMap[item.status].text}</span>`;

      const domainNames = {
        industrial: '工业制造',
        energy: '能源电力',
        transport: '交通运输',
        construction: '建设工程',
        public: '公共场所',
        environment: '生态环境'
      };
      // 详情展示：优先用领域小类名称，找不到则用领域大类名称
      const detailDomainNames = item.domains.map(d => {
        for (const cat of domainCategoryData) {
          const child = cat.children.find(c => c.id === d);
          if (child) return child.name;
        }
        return domainNames[d] || d;
      });
      document.getElementById('detailDomains').textContent = detailDomainNames.join('、') || '—';
      document.getElementById('detailUpdateTime').textContent = item.updateTime;
      document.getElementById('detailClauseCount').textContent = item.clauseCount;
      
      // 渲染条款列表
      const clauseContent = document.getElementById('clauseCollapseContent');
      if (item.clauses.length === 0) {
        clauseContent.innerHTML = '<div style="color: var(--text-tertiary);">暂无条款</div>';
      } else {
        clauseContent.innerHTML = item.clauses.map((c, i) => `
          <div class="clause-collapse-item">
            <strong>${c.number} ${c.title}</strong>
            <div style="color: var(--text-secondary); margin-top: var(--spacing-xs);">${c.content}</div>
          </div>
        `).join('');
      }
      
      // 附件
      const attachmentDiv = document.getElementById('detailAttachment');
      if (item.attachment) {
        attachmentDiv.innerHTML = `
          <div class="detail-value">
            📄 ${item.attachment.name}
          </div>
          <div class="detail-value" style="margin-top: var(--spacing-sm);">
            <button class="btn btn-default btn-sm" onclick="toggleAttachmentPreview()">
              <span id="previewBtnText">📖 预览附件</span>
            </button>
          </div>
          <div id="attachmentPreviewArea" style="display:none; margin-top:10px;">
            <iframe id="attachmentPdfFrame" src="${item.attachment.url || ''}" 
              style="width:100%;height:500px;border:1px solid var(--border-section);border-radius: var(--radius-md);"
              onerror="this.outerHTML='<div style=&quot;color:var(--text-tertiary);padding:20px;text-align:center;&quot;>⚠️ 预览加载失败，请确认文件存在或下载后查看</div>'">
            </iframe>
          </div>
        `;
      } else {
        attachmentDiv.innerHTML = '<div class="detail-value">暂无附件</div>';
      }
      
      document.getElementById('detailModal').classList.add('active');
    }
    
    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('active');
      // 关闭详情时重置预览区域状态，避免下次打开残留显示
      const previewArea = document.getElementById('attachmentPreviewArea');
      if (previewArea) previewArea.style.display = 'none';
      const previewBtn = document.getElementById('previewBtnText');
      if (previewBtn) previewBtn.textContent = '📖 预览附件';
    }
    
    function toggleAttachmentPreview() {
      const previewArea = document.getElementById('attachmentPreviewArea');
      const previewBtn = document.getElementById('previewBtnText');
      if (!previewArea) return;
      const isVisible = previewArea.style.display !== 'none';
      previewArea.style.display = isVisible ? 'none' : 'block';
      if (previewBtn) previewBtn.textContent = isVisible ? '📖 预览附件' : '🔽 收起预览';
    }
    
    function toggleClauses() {
      const content = document.getElementById('clauseCollapseContent');
      const icon = document.getElementById('clauseToggleIcon');
      content.classList.toggle('show');
      icon.textContent = content.classList.contains('show') ? '▲' : '▼';
    }
    
    // ========== 删除 ==========
    function openDeleteModal(id) {
      deleteTargetId = id;
      const item = regulationData.find(r => r.id === id);
      document.getElementById('deleteMessage').textContent = `确定要删除《${item.name}》吗？`;
      
      // 模拟关联提示
      const hasRelations = Math.random() > 0.5;
      const warningEl = document.getElementById('deleteWarning');
      if (hasRelations) {
        warningEl.textContent = `⚠️ 该法规包含 ${item.clauseCount} 条条款，部分条款已被引用，删除后将自动解除关联关系。`;
      } else {
        warningEl.textContent = '';
      }
      
      document.getElementById('deleteModal').classList.add('active');
    }
    
    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      deleteTargetId = null;
    }
    
    function confirmDelete() {
      if (deleteTargetId) {
        regulationData = regulationData.filter(r => r.id !== deleteTargetId);
        updateStats();
        renderTable();
        closeDeleteModal();
        showToast('删除成功', 'success');
      }
    }
  </script>

</body>
