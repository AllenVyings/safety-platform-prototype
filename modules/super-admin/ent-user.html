<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>企业用户管理 - 超管端</title>

<style>
.breadcrumb-item:hover{color:var(--primary)}
.page-container{padding:20px}
.main-layout{display:flex;flex-direction:row;gap:var(--spacing-md);height:calc(100vh - 40px)}
.tree-panel{width:260px;flex-shrink:0;background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md);display:flex;flex-direction:column;overflow:hidden}
.tree-panel-title{font-size: var(--font-size-sm);font-weight:600;color:var(--text-primary);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-light)}
.tree-tabs{display:flex;border-bottom:1px solid var(--border-light);margin-bottom:12px}
.tree-tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size: var(--font-size-sm);color:var(--text-secondary);border-bottom:2px solid transparent}
.tree-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tree-search{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);margin-bottom:10px;outline:none;transition:border-color .2s}
.tree-search:focus{border-color:var(--primary)}
.tree-node{padding: 7px var(--spacing-sm);border-radius: var(--radius-md);cursor:pointer;font-size: var(--font-size-sm);color:var(--text-primary);display:flex;align-items:center;gap:5px;transition:background .15s;user-select:none}
.tree-node:hover{background:var(--bg-secondary)}
.tree-node.active{background:var(--primary-light);color:var(--primary);font-weight:500}
.tree-node .toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-tertiary);transition:transform .2s;flex-shrink:0}
.tree-node .toggle.open{transform:rotate(90deg)}
.tree-children{padding-left:18px;display:none}
.tree-children.show{display:block}
.tree-node-icon{margin-right: var(--spacing-xs)}
.tree-node-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node-count{font-size:11px;color:var(--text-tertiary);background:var(--border-light);padding:2px 6px;border-radius:10px}
#orgTree{flex:1;overflow-y:auto;min-height:0}
.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap: var(--spacing-md)}
.right-panel > .stats-row{flex-shrink:0;gap:var(--spacing-md)}

.filter-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md) 20px;border:1px solid var(--border-section);flex-shrink:0}
.filter-card .filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;width:100%;background:transparent;padding:0;margin-bottom:0;border:none;border-radius:0}
.filter-card .filter-item{display:flex;align-items:center;gap:6px}
.filter-card label{font-size:var(--font-size-sm);color:var(--text-secondary);white-space:nowrap}
.filter-card select,.filter-card input{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;transition:border-color .2s;width:240px;height:32px;box-sizing:border-box}
.filter-card select:focus,.filter-card input:focus{border-color:var(--primary)}

.btn-default:hover{color:var(--primary);border-color:var(--primary)}

.btn-primary:hover{background:var(--primary-hover)}

.btn-link:hover{color:var(--primary-hover)}
.btn-link.btn-sm{font-size: var(--font-size-xs);padding: 1px var(--spacing-xs)}

.btn-danger:hover{background:var(--danger-light);border-color:var(--danger)}
.table-card{background:var(--bg-primary);border-radius: var(--radius-lg);padding: var(--spacing-md);flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--spacing-md);flex-shrink:0}
.table-toolbar-title{font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary)}
.table-toolbar-actions{display:flex;gap:8px}
.table-container{overflow-x:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size: var(--font-size-sm);min-width:900px}
thead th{background:var(--bg-tertiary);padding:10px 12px;text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-light);white-space:nowrap;position:relative}
tbody td{padding:10px 12px;border-bottom:1px solid var(--bg-secondary);color:var(--text-primary);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover{background:var(--bg-section)}
tbody tr:last-child td{border-bottom:none}
/* 列宽固定 */
thead th:nth-child(1),tbody td:nth-child(1){width:40px;max-width:40px}   /* 复选框 */
thead th:nth-child(2),tbody td:nth-child(2){width:60px;max-width:60px}   /* 序号 */
thead th:nth-child(3),tbody td:nth-child(3){width:100px;max-width:100px}  /* 用户姓名 */
thead th:nth-child(4),tbody td:nth-child(4){width:120px;max-width:120px}  /* 账号 */
thead th:nth-child(5),tbody td:nth-child(5){width:120px;max-width:120px}  /* 联系电话 */
thead th:nth-child(6),tbody td:nth-child(6){width:80px;max-width:80px}    /* 职务 */
thead th:nth-child(7),tbody td:nth-child(7){width:90px;max-width:90px}    /* 管控层级 */
thead th:nth-child(8),tbody td:nth-child(8){width:80px;max-width:80px;text-align:center}  /* 安全码 */
thead th:nth-child(9),tbody td:nth-child(9){width:80px;max-width:80px}    /* 启用状态 */
thead th:nth-child(10),tbody td:nth-child(10){width:140px;max-width:140px}  /* 创建时间 */
    /* 操作列固定在右侧 */
.action-col{box-shadow:-2px 0 4px rgba(0,0,0,.04);max-width:none;overflow:visible}
.action-col:hover{background:var(--bg-primary)}
.action-col .btn-link{margin-right:30px}
.action-col .btn-link:last-child{margin-right:0}

.batch-bar{display:none;align-items:center;gap:10px;padding:8px 0;font-size:var(--font-size-sm);color:var(--text-secondary);flex-shrink:0}
.batch-bar.show{display:flex}

.tag-green{background:var(--success-light);color:var(--success)}
.tag-red{background:var(--danger-light);color:var(--danger)}
.tag-gray{background:var(--bg-secondary);color:var(--text-tertiary)}

/* 安全码列样式 */
.code-cell{display:inline-flex;align-items:center;cursor:help}
.qrcode-icon{width:20px;height:20px;color:var(--text-secondary)}
.code-cell.red .qrcode-icon{color:var(--danger)}
.code-cell.yellow .qrcode-icon{color:var(--warning)}
.code-cell.green .qrcode-icon{color:var(--success)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-dialog{background:var(--bg-primary);border-radius:var(--radius-lg);width:900px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding: var(--spacing-md) 20px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.modal-title{font-size: var(--font-size-lg);font-weight:600;color:var(--text-primary)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius: var(--radius-md);cursor:pointer;font-size: var(--font-size-md);color:var(--text-tertiary);transition:all .2s}
.modal-close:hover{background:var(--bg-secondary);color:var(--text-secondary)}
.modal-body{padding: 20px var(--spacing-lg);overflow-y:auto;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-light);flex-shrink:0}
.form-section{margin-bottom: var(--spacing-md)}
.form-section-title{font-size: var(--font-size-sm);font-weight:600;color:var(--text-primary);padding:0 0 10px;margin-bottom:10px;border-bottom:2px solid var(--primary)}
.form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:row;align-items:center;flex:1;min-width:0;max-width:calc(50% - 6px)}
.form-group.full-width{max-width:100%;flex-basis:100%}
.form-label{flex-shrink:0;width:80px;margin-right:10px;text-align:right;font-size:var(--font-size-sm);color:var(--text-primary);font-weight:500}
.form-label .required{color:var(--danger);margin-right:2px}
.form-input,.form-select{flex:1;height:36px;padding:var(--spacing-sm) 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;transition:border-color .2s;width:100%;box-sizing:border-box}
.form-input:focus,.form-select:focus{border-color:var(--primary)}
.form-group.full-width textarea.form-input{min-height:60px;resize:vertical}
.no-data td{text-align:center;color:var(--border);padding:40px 0}
/* 分页 - .pagination 由 framework.css 提供, JS 分页由 pagination.js 驱动 */
.table-card > .pagination{flex-shrink:0;padding:var(--spacing-sm) 0 0}

/* 多选下拉框样式 */
.multi-select{position:relative;flex:1;min-width:0}
.multi-select-input{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid var(--border);border-radius: var(--radius-md);cursor:pointer;background:var(--bg-primary);transition:border-color .2s}
.multi-select-input:hover{border-color:var(--primary)}
.multi-select-placeholder{color:var(--text-tertiary);font-size: var(--font-size-sm)}
.multi-select-arrow{width:0;height:0;border-left: var(--spacing-xs) solid transparent;border-right: var(--spacing-xs) solid transparent;border-top: var(--spacing-xs) solid var(--text-tertiary);margin-left: var(--spacing-sm)}
.multi-select-dropdown{display:none;position:absolute;top:100%;left:0;right:0;margin-top: var(--spacing-xs);background:var(--bg-primary);border:1px solid var(--border);border-radius: var(--radius-md);box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100;max-height:200px;overflow-y:auto}
.multi-select-dropdown.show{display:block}
.multi-select-actions{display:flex;justify-content:space-between;padding: var(--spacing-sm) 12px;border-bottom:1px solid var(--border-light);font-size: var(--font-size-xs);color:var(--primary);cursor:pointer}
.multi-select-actions span:hover{color:var(--primary-hover)}
.multi-select-actions i{margin-right: var(--spacing-xs)}
.multi-select-options{padding: var(--spacing-xs) 0}
.multi-select-option{padding:6px 12px;cursor:pointer;font-size: var(--font-size-sm);display:flex;align-items:center}
.multi-select-option:hover{background:var(--bg-secondary)}
.multi-select-option input{margin-right: var(--spacing-sm)}
.multi-select-option.disabled{color:var(--text-tertiary);cursor:not-allowed}
.multi-select-tags{display:flex;flex-wrap:wrap;gap: var(--spacing-xs);padding:2px 0}
.multi-select-tag{display:flex;align-items:center;padding:2px 6px;background:var(--primary-light);color:var(--primary);border-radius: var(--radius-sm);font-size: var(--font-size-xs)}
.multi-select-tag-close{margin-left: var(--spacing-xs);cursor:pointer;font-size:10px}
</style>
</head>
  <link rel="stylesheet" href="../../css/annotations.css">
<body>
<div class="page-container" data-module="super-admin/ent-user">
  <div class="main-layout">
    <!-- 左侧：企业树 -->
    <div class="tree-panel">
      <div class="tree-panel-title">企业组织架构</div>
      <div class="tree-tabs">
        <div class="tree-tab active" onclick="switchTab('district')" id="tabDistrict">区划</div>
        <div class="tree-tab" onclick="switchTab('industry')" id="tabIndustry">领域</div>
      </div>
      <input class="tree-search" id="treeSearch" placeholder="搜索企业..." oninput="searchTree()">
      <div id="orgTree"></div>
    </div>
    <!-- 右侧：四区 -->
    <div class="right-panel">
      <!-- 统计卡片 -->
      <div class="stats-row">
        <div class="stat-card"><div class="stat-card-body"><div class="stat-label">用户总数</div><div class="stat-value" id="statTotal">0</div></div><div class="stat-indicator" style="background:var(--primary)"></div></div>
        <div class="stat-card"><div class="stat-card-body"><div class="stat-label">红码<span style="font-weight:400;color:var(--text-tertiary);margin-left:4px;font-size:11px">高风险</span></div><div class="stat-value" id="statRed">0</div></div><div class="stat-indicator" style="background:var(--danger)"></div></div>
        <div class="stat-card"><div class="stat-card-body"><div class="stat-label">黄码<span style="font-weight:400;color:var(--text-tertiary);margin-left:4px;font-size:11px">中风险</span></div><div class="stat-value" id="statYellow">0</div></div><div class="stat-indicator" style="background:var(--warning)"></div></div>
        <div class="stat-card"><div class="stat-card-body"><div class="stat-label">绿码<span style="font-weight:400;color:var(--text-tertiary);margin-left:4px;font-size:11px">正常</span></div><div class="stat-value" id="statGreen">0</div></div><div class="stat-indicator" style="background:var(--success)"></div></div>
      </div>
      <!-- 查询条件 -->
      <div class="filter-card">
        <div class="filter-bar">
        <div class="filter-item"><label>姓名：</label>
          <input id="filterName" placeholder="请输入姓名">
        </div>
        <div class="filter-item"><label>账号：</label>
          <input id="filterAccount" placeholder="请输入账号">
        </div>
        <div class="filter-item"><label>管控层级：</label>
          <select id="filterLevel"><option value="">全部</option><option>领导层</option><option>管理层</option><option>员工层</option></select>
        </div>
        <div class="filter-item"><label>启用状态：</label>
          <select id="filterStatus"><option value="">全部</option><option>启用</option><option>停用</option></select>
        </div>
        <button class="btn btn-primary" onclick="renderTable()">查询</button>
        <button class="btn btn-default" onclick="resetFilter()">重置</button>
        </div>
      </div>
      <!-- 用户列表 -->
      <div class="table-card">
        <div class="table-toolbar">
          <span class="table-toolbar-title">用户列表</span>
          <div class="table-toolbar-actions">
            <button class="btn btn-default" onclick="batchDelete()">批量删除</button>
            <button class="btn btn-default" onclick="batchEnable()">批量启用</button>
            <button class="btn btn-default" onclick="batchDisable()">批量停用</button>
            <button class="btn btn-primary" onclick="openAddModal()">+ 新增用户</button>
          </div>
        </div>
        <div class="batch-bar" id="batchBar">
          <span>已选 <strong id="batchCount">0</strong> 项</span>
          <button class="btn btn-link" onclick="clearSelection()">取消选择</button>
        </div>
        <div class="table-container table-wrap">
          <table>
            <thead><tr>
              <th class="col-check"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"></th>
              <th>序号</th><th>用户姓名</th><th>账号</th><th>联系电话</th><th>职务</th>
              <th>管控层级</th><th>安全码</th><th>启用状态</th><th>创建时间</th><th class="action-col">操作</th>
            </tr></thead>
            <tbody id="userTableBody"><tr><td colspan="11" class="no-data">加载中...</td></tr></tbody>
          </table>
        </div>
        <!-- 分页 -->
        <div class="pagination" id="paginationBar"></div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增用户</span>
      <div class="modal-close" onclick="closeModal('editModal')">&#x2715;</div>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <div class="form-section">
          <div class="form-section-title">基本信息</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>用户姓名</label>
              <input class="form-input" name="userName" id="editUserName" required>
            </div>
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>联系电话</label>
              <input class="form-input" name="userPhone" id="editUserPhone" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">邮箱</label>
              <input class="form-input" name="userEmail" id="editUserEmail" type="email">
            </div>
            <div class="form-group">
              <label class="form-label">职务</label>
              <input class="form-input" name="userPosition" id="editUserPosition">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>所属部门</label>
              <select class="form-select" name="userDept" id="editUserDept" required>
                <option value="">请选择</option>
                <option>安全部</option><option>技术部</option><option>生产部</option>
                <option>质检部</option><option>运营部</option><option>风控部</option>
                <option>人力资源部</option><option>财务部</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>员工层级</label>
              <select class="form-select" name="userLevel" id="editUserLevel" required onchange="onLevelChange()">
                <option value="">请选择</option>
                <option>领导层</option>
                <option>管理层</option>
                <option>员工层</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">分管领导</label>
              <select class="form-select" name="superiorId" id="editSuperiorId">
                <option value="">请选择</option>
              </select>
            </div>
            <div class="form-group" id="manageDeptsGroup" style="display:none">
              <label class="form-label">管辖部门</label>
              <div class="multi-select" id="manageDeptsWrap">
                <div class="multi-select-input" onclick="toggleMultiDropdown()">
                  <span class="multi-select-placeholder" id="manageDeptsText">请选择管辖部门</span>
                  <i class="multi-select-arrow"></i>
                </div>
                <div class="multi-select-dropdown" id="manageDeptsDropdown">
                  <div class="multi-select-actions">
                    <span onclick="selectAllManageDepts()"><i>&#x2713;</i>全选</span>
                    <span onclick="clearManageDepts()"><i>&#x2715;</i>清空</span>
                  </div>
                  <div class="multi-select-options" id="manageDeptsOptions"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>角色类型</label>
              <select class="form-select" name="userRole" id="editUserRole" required>
                <option value="">请选择</option>
                <option>企业管理员</option>
                <option>普通用户</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>启用状态</label>
              <select class="form-select" name="userStatus" id="editUserStatus" required>
                <option value="启用">启用</option>
                <option value="停用">停用</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full-width">
              <label class="form-label">备注</label>
              <textarea class="form-input" name="remark" id="editRemark" placeholder="请输入备注信息（200字以内）"></textarea>
            </div>
          </div>
        </div>
        <div class="form-section">
          <div class="form-section-title">账号信息</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>账号</label>
              <input class="form-input" name="userAccount" id="editUserAccount" required placeholder="4-20位字母或数字">
            </div>
            <div class="form-group">
              <label class="form-label" id="pwdLabel"><span class="required">*</span>密码</label>
              <input class="form-input" name="userPassword" id="editUserPassword" type="password" placeholder="默认Abc@123456">
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-primary" onclick="saveUser()">保存</button>
    </div>
  </div>
</div>

<!-- 删除弹窗 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-dialog" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">确认删除</span>
      <div class="modal-close" onclick="closeModal('deleteModal')">&#x2715;</div>
    </div>
    <div class="modal-body" style="text-align:center;padding:30px">
      <p>确定要删除用户 <strong id="deleteUserName"></strong> 吗？</p>
      <p style="color:var(--text-tertiary);font-size: var(--font-size-sm);margin-top:10px">此操作不可恢复</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- 重置密码弹窗 -->
<div class="modal-overlay" id="resetPwdModal">
  <div class="modal-dialog" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">重置密码</span>
      <div class="modal-close" onclick="closeModal('resetPwdModal')">&#x2715;</div>
    </div>
    <div class="modal-body" style="padding:20px">
      <p>为用户 <strong id="resetPwdUserName"></strong> 重置密码</p>
      <div class="form-group" style="margin-top:15px">
        <label class="form-label">新密码</label>

    document.body.appendChild(el);

// 企业按确定性分布挂载到社区下
function buildEntUserDistrictTree() {
  var root = { id: 'nanshan', name: REGION_ROOT.name, type: 'district', count: 0, children: [] };
  var allEnts = entUserEnterprisePool;
  var entIdx = 0;
  STREETS.forEach((st, stIdx) => {
    var streetNode = { id: 'st_' + stIdx, name: st.name, type: 'street', count: 0, children: [] };
    st.communities.forEach((comm, commIdx) => {
      var commNode = { id: 'comm_' + stIdx + '_' + commIdx, name: comm.name, type: 'community', count: 0, children: [] };
      // 每3个社区放1家企业（确定性分布）
      if ((stIdx * 7 + commIdx * 3) % 5 === 0 && entIdx < allEnts.length) {
        var ent = allEnts[entIdx];
        commNode.children.push({ id: ent.id, name: ent.name, type: 'enterprise', isEnterprise: true, count: 0 });
        entIdx++;
      }
      // 确保所有企业都有归属：最后一个社区兜底剩余企业
      if (stIdx === STREETS.length - 1 && commIdx === st.communities.length - 1) {
        while (entIdx < allEnts.length) {
          var ent = allEnts[entIdx];
          commNode.children.push({ id: ent.id, name: ent.name, type: 'enterprise', isEnterprise: true, count: 0 });
          entIdx++;
        }
      }
      streetNode.children.push(commNode);
    });
    root.children.push(streetNode);
  });
  return root;
}

// 递归计算节点用户数（叶子企业节点从 allUsers 统计，上级节点为子节点之和）
function computeNodeCounts(node) {
  if (!node.children || node.children.length === 0) {
    if (node.isEnterprise && typeof allUsers !== 'undefined') {
      node.count = allUsers.filter(u => u.enterpriseId === node.id).length;
    } else {
      node.count = 0;
    }
    return node.count;
  }
  var sum = 0;
  for (const child of node.children) {
    sum += computeNodeCounts(child);
  }
  node.count = sum;
  return sum;
}

// 动态构建领域树（按行业大类分组）
function buildIndustryTree(){
  var tree=[];
  var categoryMap={};
  // 先创建所有大类节点
  for(const[code,cat]of Object.entries(industryCategoryMap)){
    categoryMap[code]={
      id:cat.id,
      name:cat.name,
      type:'category',
      icon:cat.icon,
      count:0,
      children:[]
    };
  }
  // 再将领域小类挂载到对应大类下
  for(const sub of domainSubcategories){
    var cat=categoryMap[sub.industry];
    if(cat){
      // mock 数据仅关联到大类，小类级别无法细分统计，count 显示 0
      cat.children.push({
        id:sub.id,
        name:sub.name,
        type:'subcategory',
        industry:sub.industry,
        count:0
      });
    }
  }
  // 转为数组，并从 allUsers 计算大类用户数
  for(const cat of Object.values(categoryMap)){
    if(cat.children.length>0){
      cat.count = typeof allUsers !== 'undefined' ? allUsers.filter(u => u.industry === cat.id).length : 0;
      tree.push(cat);
    }
  }
  return tree;
}

function renderTree(){

function renderNodes(nodes,level){
  if(!nodes||nodes.length===0)return'';
  // 区划Tab 默认展开到街道（level 0=区, level 1=街道）
  var autoExpand = currentTab==='district' && level < 2;
  return nodes.map(node=>{
    var hasChildren=node.children&&node.children.length>0;
    var isEnterprise=node.isEnterprise;
    var isSelected=selectedNode&&selectedNode.id===node.id;
    // 根据节点类型显示不同图标
    var icon=node.icon||'&#128196;';
    if(!node.icon){
      if(isEnterprise){
        icon='&#127970;';
      }else if(hasChildren){
        icon='&#128193;';
      }
    }
    var toggleClass = hasChildren ? (autoExpand ? 'toggle open' : 'toggle collapsed') : 'toggle';
    var childrenClass = hasChildren ? (autoExpand ? 'tree-children show' : 'tree-children') : '';
    var toggleVisibility = hasChildren ? '' : ' style="visibility:hidden"';
    return`<div class="tree-node-wrapper">
      <div class="tree-node ${isSelected?'active':''}" data-id="${node.id}" data-enterprise="${isEnterprise||false}" data-type="${node.type||''}" onclick="selectTreeNode(${JSON.stringify(node).replace(/"/g,'&quot;')})" style="padding-left:${12+level*16}px">
        <span class="${toggleClass}"${toggleVisibility} onclick="toggleNode(this,event)">&#9654;</span>
        <span class="tree-node-icon">${icon}</span>
        <span class="tree-node-label">${node.name}</span>
        <span class="tree-node-count">${node.count||0}${isEnterprise?'人':''}</span>
      </div>
      ${hasChildren?`<div class="${childrenClass}">${renderNodes(node.children,level+1)}</div>`:''}
    </div>`;
  }).join('');
}

function toggleNode(el,e){
  e.stopPropagation();
  var children=el.closest('.tree-node-wrapper').querySelector('.tree-children');
  if(children){
    children.classList.toggle('show');
    el.classList.toggle('open');
  }
}

function searchTree(){
  var keyword=document.getElementById('treeSearch').value.toLowerCase();
  document.querySelectorAll('.tree-node').forEach(node=>{
    var name=node.querySelector('.tree-node-label').textContent.toLowerCase();
    node.style.display=name.includes(keyword)?'flex':'none';
  });
}

function selectTreeNode(node){
  selectedNode=node;

  document.querySelectorAll('.tree-node').forEach(el=>{
    el.classList.remove('active');
    if(el.dataset.id==node.id)el.classList.add('active');
  });
  currentPage=1;
  pg.setPage(1);
  updateStats();
  renderTable();

  // 更新顶部提示栏
  updateBreadcrumb(node);
}

  }
  
  // 领域Tab：按行业大类过滤
  if(currentTab==='industry'){
    // 如果选中的是大类节点
    if(selectedNode.type==='category'){
      // 从节点ID映射到行业代码（cat_ind -> IND）
      var industryCode=Object.entries(industryCategoryMap).find(([code,cat])=>cat.id===selectedNode.id)?.[0];
      if(industryCode){
        return allUsers.filter(u=>u.industry===industryCode);
      }
    }
    // 如果选中的是小类节点
    if(selectedNode.type==='subcategory'&&selectedNode.industry){
      return allUsers.filter(u=>u.industry===selectedNode.industry);
    }
  }
  
  return allUsers;
}

// 递归获取节点下所有企业ID
function getEnterpriseIdsInNode(node,data){
  var ids=[];
  function traverse(nodes){
    for(const n of nodes){
      if(n.id===node.id){
        // 找到目标节点，收集其下所有企业ID
        collectEnterpriseIds(n,ids);
        return true;
      }
      if(n.children&&n.children.length>0){
        if(traverse(n.children))return true;
      }
    }
    return false;
  }
  traverse(data);
  return ids;
}

// 收集节点下所有企业ID
function collectEnterpriseIds(node,ids){
  if(node.isEnterprise){
    ids.push(node.id);
  }
  if(node.children&&node.children.length>0){
    for(const child of node.children){
      collectEnterpriseIds(child,ids);
    }
  }
}

// 更新顶部提示栏显示当前选中路径
function updateBreadcrumb(node){
  var breadcrumbEl=document.querySelector('.breadcrumb');
  if(!node){
    breadcrumbEl.innerHTML='<span class="breadcrumb-item">全部企业</span>';
    return;
  }
  
  // 区划Tab
  if(currentTab==='district'){
    if(node.isEnterprise){
      var path=findNodePath(districtData,node.id);
      if(path.length>0){
        breadcrumbEl.innerHTML=path.map(n=>`<span class="breadcrumb-item">${n.name}</span>`).join('<span class="breadcrumb-separator">&gt;</span>');
      }
    }else{
      // 区划/街道/社区节点
      breadcrumbEl.innerHTML=`<span class="breadcrumb-item">${node.name}</span>`;
    }
    return;
  }
  
  // 领域Tab
  if(currentTab==='industry'){
    if(node.type==='category'){
      breadcrumbEl.innerHTML=`<span class="breadcrumb-item">${node.name}</span>`;
    }else if(node.type==='subcategory'){
      // 找到父级大类
      var cat=industryCategoryMap[node.industry];
      if(cat){
        breadcrumbEl.innerHTML=`<span class="breadcrumb-item">${cat.name}</span><span class="breadcrumb-separator">&gt;</span><span class="breadcrumb-item">${node.name}</span>`;
      }
    }
  }
}

// 在树中查找节点路径
function findNodePath(nodes,targetId,currentPath=[]){
  for(let node of nodes){
    var newPath=[...currentPath,node];
    if(node.id==targetId)return newPath;
    if(node.children&&node.children.length>0){
      var found=findNodePath(node.children,targetId,newPath);
      if(found)return found;
    }
  }
  return[];
}

// ========== 用户列表 ==========
function renderTable(){
  var name=document.getElementById('filterName').value.toLowerCase();
  var account=document.getElementById('filterAccount').value.toLowerCase();
  var level=document.getElementById('filterLevel').value;
  var status=document.getElementById('filterStatus').value;

  // 先根据树节点过滤
  var nodeFiltered=getFilteredUsersByNode();
  
  filteredUsers=nodeFiltered.filter(user=>{
    if(name&&!user.userName.toLowerCase().includes(name))return false;
    if(account&&!user.userAccount.toLowerCase().includes(account))return false;
    if(level&&user.userLevel!==level)return false;
    if(status&&user.userStatus!==status)return false;
    return true;
  });

  // 更新统计卡片
  updateStats();

  // 分页计算
  var totalCount=filteredUsers.length;
  var totalPages=Math.ceil(totalCount/pageSize)||1;
  if(currentPage>totalPages)currentPage=totalPages;
  if(currentPage<1)currentPage=1;

  var startIndex=(currentPage-1)*pageSize;
  var pageData=filteredUsers.slice(startIndex,startIndex+pageSize);

  // 更新分页组件
  pg.setTotal(totalCount);

  var tbody=document.getElementById('userTableBody');
  if(pageData.length===0){
    tbody.innerHTML='<tr><td colspan="11" class="no-data">暂无数据</td></tr>';
    return;
  }

  tbody.innerHTML=pageData.map((user,index)=>`<tr>
    <td class="col-check"><input type="checkbox" class="row-checkbox" data-id="${user.id}" onchange="syncSelectAllState()"></td>
    <td>${startIndex+index+1}</td>
    <td title="${user.userName}">${user.userName}</td>
    <td title="${user.userAccount}">${user.userAccount}</td>
    <td title="${user.userPhone}">${user.userPhone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')}</td>
    <td title="${user.userPosition||''}">${user.userPosition||'-'}</td>
    <td title="${user.userLevel}">${user.userLevel}</td>
    <td style="text-align:center"><span class="code-cell ${getCodeStateClass(user.safetyCode)}" title="${getCodeLabel(user.safetyCode)}">${QR_ICON_SVG}</span></td>
    <td title="${user.userStatus}"><span class="tag ${user.userStatus==='启用'?'tag-green':'tag-gray'}">${user.userStatus}</span></td>
    <td title="${user.createTime}">${user.createTime}</td>
    <td class="action-col">
      <button class="btn-link" onclick="openEditModal(${user.id})">编辑</button>
      <button class="btn-link" onclick="openDeleteModal(${user.id})">删除</button>
      <button class="btn-link" onclick="openDetailModal(${user.id})">详情</button>
      <button class="btn-link" onclick="openResetPwdModal(${user.id})">重置密码</button>
    </td>
  </tr>`).join('');
}

function batchDelete(){
  var ids=getSelectedUserIds();
  if(ids.length===0){showToast('请先选择用户','warning');return;}
  if(!confirm('确定要删除选中的 '+ids.length+' 个用户吗？此操作不可恢复'))return;
  // 检查待办任务
  var blocked=ids.filter(function(id){var u=allUsers.find(function(x){return x.id===id;});return u&&u.pendingTasks>0;});
  if(blocked.length>0){showToast('选中用户中有 '+blocked.length+' 个存在待办任务，无法删除','error');return;}
  allUsers=allUsers.filter(function(u){return ids.indexOf(u.id)===-1;});
  renderTable();updateStats();showToast('已删除 '+ids.length+' 个用户','success');
}

  var ids=getSelectedUserIds();
  if(ids.length===0){showToast('请先选择用户','warning');return;}

  var ids=getSelectedUserIds();

    userAccount:document.getElementById('editUserAccount').value,

  };

  // 补充管辖部门和分管领导数据
  data.manageDepts=selectedManageDepts;
  data.superiorId=data.superiorId||null;

  // 新增时设置默认安全码
  if(!editingId){
    data.safetyCode='绿';
  }

  if(editingId){
    var idx=allUsers.findIndex(function(u){return u.id===editingId;});
    if(idx!==-1){
      var original=allUsers[idx];
      for(var k in data){if(data[k]!==undefined&&data[k]!=='')original[k]=data[k];}
    }
  }else{
    var newId=allUsers.length>0?Math.max.apply(null,allUsers.map(function(u){return u.id;}))+1:1;
    data.id=newId;
    data.createTime=new Date().toISOString().split('T')[0]+' '+new Date().toTimeString().slice(0,5);
    allUsers.push(data);
  }

  closeModal('editModal');
  renderTable();
  updateStats();
  if(editingId){
    showToast('修改成功', 'success');
  }else{
    showToast('账号已创建，初始密码为Abc@123456', 'success');

function onLevelChange(){

  // 显示/隐藏管辖部门

    manageDeptsGroup.style.display='block';
  }else{
    manageDeptsGroup.style.display='none';
    clearManageDepts();
  }
  
  // 更新分管领导可选范围
  updateSuperiorOptions(level);
}

// 更新分管领导下拉选项（按员工层级 + 当前企业过滤）
function updateSuperiorOptions(currentLevel){
  var superiorSelect=document.getElementById('editSuperiorId');
  var allowedLevels=[];

  if(currentLevel==='员工层'){
    allowedLevels=['领导层','管理层'];
  }else if(currentLevel==='管理层'){
    allowedLevels=['领导层','管理层'];
  }else if(currentLevel==='领导层'){
    allowedLevels=['领导层'];
  }

  // 按当前选中企业过滤（PRD §6.1.3.2.3.2.2：当前企业下所有用户）
  var candidates=allUsers;
  var selectedEntId=null;
  if(selectedNode){
    if(selectedNode.isEnterprise){
      selectedEntId=selectedNode.id;
    }else if(selectedNode.type==='community'||selectedNode.type==='street'||selectedNode.type==='district'){
      // 选中的是区划节点，收集其下所有企业ID
      var entIds=getEnterpriseIdsInNode(selectedNode,districtData);
      if(entIds.length===1) selectedEntId=entIds[0];
    }
  }
  if(selectedEntId){
    candidates=candidates.filter(function(u){return u.enterpriseId===selectedEntId;});
  }

  // 按员工层级过滤
  candidates=candidates.filter(function(u){return allowedLevels.indexOf(u.userLevel)>-1;});

  var options=candidates
    .map(function(u){return '<option value="'+u.id+'">'+u.userName+'（'+u.userLevel+'）</option>';})
    .join('');

  superiorSelect.innerHTML='<option value="">请选择</option>'+(options||'<option disabled>暂无数据</option>');
}
