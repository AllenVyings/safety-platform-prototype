<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域管理 - 超管端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ========== 主体布局 ========== */
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; }
    .page-container[data-module="super-admin/area-manage"] {
      height: 100vh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* ========== 右侧列容器 ========== */
    .right-column {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      overflow: hidden;
    }

    /* ========== 筛选区 ========== */
    .filter-card {
      flex-shrink: 0;
    }
    .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-md); }
    .filter-item { display: flex; align-items: center; gap: var(--spacing-sm); }
    .filter-item label { font-size: var(--font-size-sm); color: var(--text-secondary); white-space: nowrap; }
    .filter-item select,
    .filter-item input[type="text"] {
      width: 240px;
      height: 32px;
      padding: 0 var(--spacing-sm);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      background: var(--bg-primary);
    }
    .filter-item select:focus,
    .filter-item input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* ========== 左右分栏 ========== */
    .main-layout {
      display: flex;
      gap: var(--spacing-md);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ========== 左侧树面板 ========== */
    .tree-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tree-header {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-section);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    .tree-title { font-size: var(--font-size-md); font-weight: 600; color: var(--text-primary); }
    .tree-search {
      width: 100%;
      padding: var(--spacing-sm) 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      background: var(--bg-primary);
      box-sizing: border-box;
    }
    .tree-search:focus { outline: none; border-color: var(--primary); }
    .tree-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: var(--spacing-sm);
    }
    .tree-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-sm) 0;
    }

    /* 树节点 */
    .tree-node {
      display: flex;
      align-items: center;
      padding: 8px 12px 8px calc(12px + var(--level, 0) * 20px);
      cursor: pointer;
      transition: all var(--duration-fast);
      user-select: none;
      min-width: 0;
      position: relative;
    }
    .tree-node:hover { background: var(--bg-secondary); }
    .tree-node.active { background: var(--primary-light); }
    .tree-toggle {
      width: 16px; height: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-right: 4px;
      cursor: pointer;
      transition: transform var(--duration-fast);
      flex-shrink: 0;
      border-radius: 3px;
      color: var(--text-tertiary);
      font-size: 9px; line-height: 1;
    }
    .tree-toggle:hover { background: var(--bg-hover); }
    .tree-toggle.expanded { transform: rotate(90deg); }
    .tree-toggle.leaf { visibility: hidden; pointer-events: none; }
    .tree-node-icon {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      margin-right: var(--spacing-sm);
      font-size: var(--font-size-md);
      flex-shrink: 0;
    }
    .tree-node-label {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .tree-node-count {
      font-size: var(--font-size-xs);
      color: var(--primary);
      margin-left: var(--spacing-xs);
      flex-shrink: 0;
    }
    .tree-node-status {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-left: var(--spacing-sm);
      flex-shrink: 0;
    }
    .tree-node-status.enabled { background: var(--success); }
    .tree-node-status.disabled { background: var(--text-tertiary); }

    .tree-children { display: none; }
    .tree-children.show { display: block; }

    /* 右键菜单 */
    .context-menu {
      position: fixed;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 4px 0;
      z-index: 2000;
      min-width: 140px;
      display: none;
    }
    .context-menu-item {
      padding: 8px 16px;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      cursor: pointer;
      transition: background var(--duration-fast);
      white-space: nowrap;
    }
    .context-menu-item:hover { background: var(--bg-secondary); }
    .context-menu-item.danger { color: var(--danger); }
    .context-menu-item.disabled {
      color: var(--text-tertiary);
      cursor: not-allowed;
    }
    .context-menu-item.disabled:hover { background: transparent; }
    .context-menu-divider {
      height: 1px;
      background: var(--border-light);
      margin: 4px 0;
    }

    /* ========== 右侧内容区 ========== */
    .right-content {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .content-header {
      padding: var(--spacing-md) 20px;
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--spacing-md);
      background: var(--bg-section);
      flex-shrink: 0;
    }
    .content-heading { min-width: 0; }
    .content-title { font-size: var(--font-size-lg); font-weight: 600; }
    .content-subtitle { margin-top: 4px; font-size: var(--font-size-xs); color: var(--text-secondary); }
    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* 表格列覆盖（表格本体由 framework.css 提供） */
    .table .action-col {
      position: sticky; right: 0; z-index: 8; background: var(--bg-primary);
      white-space: nowrap; padding-left: 30px; padding-right: 30px;
    }
    .table thead th.action-col { z-index: 12; background: var(--bg-section); }
    .table tbody tr:nth-child(even) td.action-col { background: var(--bg-secondary); }
    .table tbody tr:hover td.action-col { background: var(--bg-hover); }
    .table .ellipsis-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; text-align: left; }
    .table .seq-col { width: 60px; }

    /* 标签 */
    .tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 500; }
    .tag-success { background: var(--success-light); color: var(--success); }
    .tag-disabled { background: var(--bg-section); color: var(--text-tertiary); }
    .tag-level-1 { background: var(--info-light); color: var(--primary); }
    .tag-level-2 { background: var(--success-light); color: var(--success); }
    .tag-level-3 { background: var(--warning-light); color: var(--warning); }
    .tag-level-4 { background: #f9f0ff; color: #722ed1; }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state .empty-text { font-size: var(--font-size-md); }

    /* 表单（水平布局） */
    .form-group { display: flex; align-items: flex-start; margin-bottom: var(--spacing-md); }
    .form-label { width: 80px; flex-shrink: 0; font-size: var(--font-size-sm); color: var(--text-secondary); padding-top: 8px; }
    .form-label .required { color: var(--danger); margin-left: 2px; }
    .form-input,
    .form-select,
    .form-textarea {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      background: var(--bg-primary);
      box-sizing: border-box;
    }
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus { outline: none; border-color: var(--primary); }
    .form-input:read-only { background: var(--bg-section); color: var(--text-secondary); }
    .form-textarea { resize: vertical; min-height: 80px; }

    /* 确认弹窗（页面特有） */
    .confirm-dialog { width: 400px; }
    .confirm-body { text-align: center; padding: 32px 24px; }
    .confirm-icon { font-size: 48px; margin-bottom: 16px; }
    .confirm-title { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: 8px; }
    .confirm-text { font-size: var(--font-size-sm); color: var(--text-secondary); line-height: 1.6; }
    .confirm-detail { margin-top: 12px; padding: 12px; background: var(--bg-section); border-radius: var(--radius-md); font-size: var(--font-size-sm); text-align: left; }

    /* 分页（覆盖 framework 默认布局以适配页面） */
    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-md) 0 0 0;
      border-top: 1px solid var(--border-light);
      margin-top: var(--spacing-md);
    }
  </style>
</head>
<body>
  <div class="page-container" data-module="super-admin/area-manage">
    <!-- 左右分栏 -->
    <div class="main-layout">
      <!-- 左侧区划树 -->
      <div class="tree-panel">
        <div class="tree-header">
          <div class="tree-title">行政区划</div>
          <input type="text" class="tree-search" id="treeSearch" placeholder="搜索区划名称" oninput="searchTree(this.value)">
          <div class="tree-toolbar">
            <button class="btn btn-link" onclick="expandAll()">展开全部</button>
            <button class="btn btn-link" onclick="collapseAll()">收起全部</button>
          </div>
        </div>
        <div class="tree-body" id="treeBody"></div>
      </div>

      <!-- 右侧列容器 -->
      <div class="right-column">
        <!-- 筛选卡片（在列表卡片外部） -->
        <div class="filter-card">
          <div class="filter-bar">
            <div class="filter-item">
              <label>层级：</label>
              <select id="filterLevel"><option value="">全部</option><option value="1">区</option><option value="2">街道</option><option value="3">社区</option><option value="4">网格</option></select>
            </div>
            <div class="filter-item">
              <label>状态：</label>
              <select id="filterStatus"><option value="">全部</option><option value="ENABLED">启用</option><option value="DISABLED">停用</option></select>
            </div>
            <div class="filter-item">
              <label>关键词：</label>
              <input type="text" id="filterKeyword" placeholder="搜索名称、编码">
            </div>
            <button class="btn btn-primary" onclick="doFilter()">查询</button>
            <button class="btn btn-default" onclick="resetFilter()">重置</button>
          </div>
        </div>

        <!-- 右侧列表卡片 -->
        <div class="right-content">
          <div class="content-header">
            <div class="content-heading">
              <div class="content-title" id="listTitle">区划列表</div>
              <div class="content-subtitle" id="listSubtitle">请从左侧选择区划节点</div>
            </div>
            <div class="action-bar">
              <button class="btn btn-primary" id="btnAddChild" onclick="openAddModal()" disabled>新增区划</button>
            </div>
          </div>
          <div class="content-body">
          <div class="table-wrap">
            <table class="table" id="dataTable">
              <thead>
                <tr>
                  <th class="seq-col">序号</th>
                  <th>区划编码</th>
                  <th>区划名称</th>
                  <th>层级</th>
                  <th>全路径</th>
                  <th>排序</th>
                  <th>状态</th>
                  <th class="action-col">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" style="display:none">
            <div class="empty-icon">📂</div>
            <div class="empty-text">暂无数据</div>
          </div>
          <div class="pagination" id="paginationWrap"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="ctxAdd" onclick="ctxAddChild()">新增子节点</div>
    <div class="context-menu-item" id="ctxEdit" onclick="ctxEdit()">编辑</div>
    <div class="context-menu-item" id="ctxToggle" onclick="ctxToggleStatus()">停用</div>
    <div class="context-menu-divider" id="ctxDivider"></div>
    <div class="context-menu-item danger" id="ctxDelete" onclick="ctxDelete()">删除</div>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-overlay" id="areaModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title" id="areaModalTitle">新增区划</div>
        <button class="modal-close" onclick="closeAreaModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">上级区划</label>
          <input type="text" class="form-input" id="modalParentName" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">区划名称<span class="required">*</span></label>
          <input type="text" class="form-input" id="modalAreaName" placeholder="请输入区划名称" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">区划编码</label>
          <input type="text" class="form-input" id="modalAreaCode" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">层级</label>
          <select class="form-select" id="modalAreaLevel"></select>
        </div>
        <div class="form-group">
          <label class="form-label">排序号</label>
          <input type="number" class="form-input" id="modalSortOrder" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="modalRemark" placeholder="请输入备注（最长200字符）" maxlength="200"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeAreaModal()">取消</button>
        <button class="btn btn-primary" onclick="saveArea()">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-dialog confirm-dialog">
      <div class="modal-body confirm-body">
        <div class="confirm-icon" id="confirmIcon">⚠️</div>
        <div class="confirm-title" id="confirmTitle">确认操作</div>
        <div class="confirm-text" id="confirmText"></div>
        <div class="confirm-detail" id="confirmDetail" style="display:none"></div>
      </div>
      <div class="modal-footer" style="justify-content:center">
        <button class="btn btn-default" onclick="closeConfirmModal()">取消</button>
        <button class="btn btn-primary" id="confirmBtn" onclick="doConfirm()">确认</button>
      </div>
    </div>
  </div>

  <script src="../../js/pagination.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/annotations.js"></script>
  <script src="../../js/shared/district-data.js"></script>
  <script>
      var CONFIG = { moduleId: 'sa-area-manage', moduleName: '区域管理' };

      // ========== 初始数据 ==========
      var nextId = 1000;
      var areaData = [];
      var selectedNodeId = null;
      var contextNodeId = null;
      var modalMode = 'add';
      var modalNodeId = null;
      var confirmCallback = null;

      var LEVEL_TAGS = { 1: 'tag-level-1', 2: 'tag-level-2', 3: 'tag-level-3', 4: 'tag-level-4' };

      // ========== 区划树 ==========
      function getChildren(parentId) {
        return areaData.filter(function(a) { return a.parentId === parentId; }).sort(function(a, b) { return a.sortOrder - b.sortOrder; });
      }

      function renderTree() {
        var container = document.getElementById('treeBody');
        container.innerHTML = '';
        renderTreeNode(container, 0, 0);
      }

      function renderTreeNode(container, parentId, level) {
        var children = getChildren(parentId);
        children.forEach(function(node) {
          var hasChildren = getChildren(node.id).length > 0;
          var isActive = selectedNodeId === node.id;
          var el = document.createElement('div');
          el.className = 'tree-node' + (isActive ? ' active' : '');
          el.style.setProperty('--level', level);
          el.dataset.id = node.id;
          el.onclick = function(e) { e.stopPropagation(); selectNode(node.id); };
          el.oncontextmenu = function(e) { e.preventDefault(); e.stopPropagation(); showContextMenu(e, node.id); };

          var toggleClass = 'tree-toggle' + (!hasChildren ? ' leaf' : '') + (node.expanded ? ' expanded' : '');
          var toggleIcon = hasChildren ? '▶' : '';
          var icon = node.level === 1 ? '🏙️' : node.level === 2 ? '🏘️' : node.level === 3 ? '📍' : '▦';
          var statusClass = node.status === 'ENABLED' ? 'enabled' : 'disabled';
          var childCount = getChildren(node.id).length;
          var countHtml = childCount > 0 ? '<span class="tree-node-count">(' + childCount + ')</span>' : '';

          el.innerHTML = `
            <span class="${toggleClass}" onclick="toggleNode(event, ${node.id})">${toggleIcon}</span>
            <span class="tree-node-icon">${icon}</span>
            <span class="tree-node-label">${Utils.escapeHtml(node.name)}</span>
            ${countHtml}
            <span class="tree-node-status ${statusClass}"></span>
          `;
          container.appendChild(el);

          if (hasChildren && node.expanded) {
            var childWrap = document.createElement('div');
            childWrap.className = 'tree-children show';
            childWrap.dataset.parent = node.id;
            renderTreeNode(childWrap, node.id, level + 1);
            container.appendChild(childWrap);
          } else if (hasChildren) {
            var childWrap2 = document.createElement('div');
            childWrap2.className = 'tree-children';
            childWrap2.dataset.parent = node.id;
            renderTreeNode(childWrap2, node.id, level + 1);
            container.appendChild(childWrap2);
          }
        });
      }

      function toggleNode(e, id) {
        e.stopPropagation();
        var node = areaData.find(function(a) { return a.id === id; });
        if (!node) return;
        var hasChildren = getChildren(id).length > 0;
        if (!hasChildren) return;
        node.expanded = !node.expanded;
        renderTree();
      }

      function selectNode(id) {
        selectedNodeId = id;
        renderTree();
        var node = areaData.find(function(a) { return a.id === id; });
        var btnAdd = document.getElementById('btnAddChild');
        if (node) {
          if (node.level >= 4) {
            document.getElementById('listTitle').textContent = node.name + ' — 网格信息';
            document.getElementById('listSubtitle').textContent = '全路径：' + node.fullPath;
            btnAdd.style.display = 'none';
          } else {
            var childLevelName = LEVEL_NAMES[node.level + 1] || '区划';
            document.getElementById('listTitle').textContent = node.name + ' — 下属' + childLevelName + '列表';
            document.getElementById('listSubtitle').textContent = '全路径：' + node.fullPath;
            btnAdd.style.display = '';
            btnAdd.disabled = false;
            btnAdd.textContent = '新增区划';
          }
        } else {
          document.getElementById('listTitle').textContent = '区划列表';
          document.getElementById('listSubtitle').textContent = '请从左侧选择区划节点';
          btnAdd.disabled = true;
          btnAdd.textContent = '新增区划';
        }
        doFilter();
      }

      function expandAll() {
        areaData.forEach(function(a) { if (getChildren(a.id).length > 0) a.expanded = true; });
        renderTree();
      }

      function restoreDefaultExpand() {
        areaData.forEach(function(a) { a.expanded = a.level <= 1; });
      }

      function collapseAll() {
        restoreDefaultExpand();
        renderTree();
      }

      function searchTree(keyword) {
        if (!keyword.trim()) {
          restoreDefaultExpand();
          renderTree();
          return;
        }
        var kw = keyword.trim().toLowerCase();
        // 找到匹配的节点及其祖先，展开祖先
        var matched = areaData.filter(function(a) { return a.name.toLowerCase().includes(kw) || a.code.includes(kw); });
        var expandSet = new Set();
        matched.forEach(function(m) {
          var pid = m.parentId;
          while (pid !== 0) {
            expandSet.add(pid);
            var p = areaData.find(function(a) { return a.id === pid; });
            pid = p ? p.parentId : 0;
          }
        });
        areaData.forEach(function(a) { a.expanded = expandSet.has(a.id) || a.level === 1; });
        renderTree();
      }

      // ========== 右键菜单 ==========
      function showContextMenu(e, nodeId) {
        contextNodeId = nodeId;
        var node = areaData.find(function(a) { return a.id === nodeId; });
        if (!node) return;
        var menu = document.getElementById('contextMenu');

        // 根据层级控制菜单项
        var isRoot = node.level === 1;
        var hasChildren = getChildren(node.id).length > 0;

        document.getElementById('ctxAdd').classList.toggle('disabled', false);
        document.getElementById('ctxAdd').textContent = node.level >= 4 ? '新增同级' : '新增子节点';
        document.getElementById('ctxEdit').classList.toggle('disabled', false);
        document.getElementById('ctxToggle').textContent = node.status === 'ENABLED' ? '停用' : '启用';
        document.getElementById('ctxDelete').classList.toggle('disabled', isRoot || hasChildren);
        document.getElementById('ctxDivider').style.display = isRoot ? 'none' : 'block';
        document.getElementById('ctxDelete').style.display = isRoot ? 'none' : 'block';

        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';
        menu.style.display = 'block';
      }

      function hideContextMenu() {
        document.getElementById('contextMenu').style.display = 'none';
        contextNodeId = null;
      }

      function onDocumentClick() { hideContextMenu(); }
      function onDocumentScroll() { hideContextMenu(); }
      function onKeydown(e) {
        if (e.key === 'Escape') {
          if (document.getElementById('confirmModal').classList.contains('show')) {
            closeConfirmModal();
          } else if (document.getElementById('areaModal').classList.contains('show')) {
            closeAreaModal();
          }
        }
      }
      document.addEventListener('click', onDocumentClick);
      document.addEventListener('scroll', onDocumentScroll, true);
      document.addEventListener('keydown', onKeydown);

      function ctxAddChild() {
        if (!contextNodeId) return;
        var node = areaData.find(function(a) { return a.id === contextNodeId; });
        if (!node) return;
        selectedNodeId = contextNodeId;
        renderTree();
        openAddModal();
      }

      function ctxEdit() {
        if (!contextNodeId) return;
        openEditModal(contextNodeId);
      }

      function ctxToggleStatus() {
        if (!contextNodeId) return;
        var node = areaData.find(function(a) { return a.id === contextNodeId; });
        if (!node) return;
        if (node.status === 'ENABLED') {
          // 停用：级联停用子节点
          var cascadeIds = getCascadeIds(node.id);
          var cascadeNames = cascadeIds.map(function(id) { return areaData.find(function(a) { return a.id === id; }); }).filter(Boolean).map(function(a) { return a.name; });
          showConfirm('停用确认', '确定停用「' + node.name + '」吗？', '将同时停用 ' + cascadeNames.length + ' 个区划（含自身）：' + cascadeNames.join('、'), function() {
            cascadeIds.forEach(function(id) {
              var n = areaData.find(function(a) { return a.id === id; });
              if (n) n.status = 'DISABLED';
            });
            renderTree();
            selectNode(selectedNodeId);
          });
        } else {
          // 启用：仅启用自身
          showConfirm('启用确认', '确定启用「' + node.name + '」吗？', null, function() {
            node.status = 'ENABLED';
            renderTree();
            selectNode(selectedNodeId);
          });
        }
      }

      function ctxDelete() {
        if (!contextNodeId) return;
        var node = areaData.find(function(a) { return a.id === contextNodeId; });
        if (!node || node.isSystem) return;
        var hasChildren = getChildren(node.id).length > 0;
        if (hasChildren) {
          alert('该区划存在子节点，请先处理子节点后再删除。');
          return;
        }
        showConfirm('删除确认', '确定删除「' + node.name + '」吗？', '删除后不可恢复，请谨慎操作。', function() {
          areaData = areaData.filter(function(a) { return a.id !== node.id; });
          if (selectedNodeId === node.id) selectedNodeId = node.parentId;
          renderTree();
          selectNode(selectedNodeId);
        });
      }

      function getCascadeIds(parentId) {
        var result = [parentId];
        var children = getChildren(parentId);
        children.forEach(function(c) {
          result.push.apply(result, getCascadeIds(c.id));
        });
        return result;
      }

      function getDescendantIds(parentId) {
        var result = [];
        var children = getChildren(parentId);
        children.forEach(function(c) {
          result.push(c.id);
          result.push.apply(result, getDescendantIds(c.id));
        });
        return result;
      }

      // ========== 列表与筛选 ==========
      var pg = null;
      var currentListData = [];

      function getFilteredData() {
        var data = areaData;
        // 如果选中了节点，显示其直接子级；选中网格则显示自身
        if (selectedNodeId) {
          var selectedNode = areaData.find(function(a) { return a.id === selectedNodeId; });
          if (selectedNode && selectedNode.level >= 4) {
            // 网格级：显示自身
            data = data.filter(function(a) { return a.id === selectedNodeId; });
          } else {
            // 区/街道/社区：显示直接子级
            data = data.filter(function(a) { return a.parentId === selectedNodeId; });
          }
        } else {
          data = [];
        }
        // 层级筛选
        var level = document.getElementById('filterLevel').value;
        if (level) data = data.filter(function(a) { return a.level === parseInt(level); });
        // 状态筛选
        var status = document.getElementById('filterStatus').value;
        if (status) data = data.filter(function(a) { return a.status === status; });
        // 关键词
        var kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
        if (kw) data = data.filter(function(a) { return a.name.toLowerCase().includes(kw) || a.code.includes(kw); });
        return data;
      }

      function refreshTable() {
        if (!pg) return;
        var state = pg.getState();
        var start = (state.page - 1) * state.size;
        var pageData = currentListData.slice(start, start + state.size);
        renderTable(pageData, start);
      }

      function doFilter() {
        currentListData = getFilteredData();
        if (!pg) {
          pg = new Pagination('paginationWrap', {
            size: 10,
            onChange: function() { refreshTable(); }
          });
        }
        pg.setTotal(currentListData.length);
        pg.setPage(1);
        refreshTable();
      }

      function resetFilter() {
        document.getElementById('filterLevel').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterKeyword').value = '';
        doFilter();
      }

      function renderTable(pageData, startIdx) {
        var tbody = document.getElementById('tableBody');
        var empty = document.getElementById('emptyState');
        if (!pageData || pageData.length === 0) {
          tbody.innerHTML = '';
          empty.style.display = 'flex';
          return;
        }
        empty.style.display = 'none';
        var offset = startIdx || 0;
        tbody.innerHTML = pageData.map(function(row, i) {
          var seq = offset + i + 1;
          var statusTag = row.status === 'ENABLED'
            ? '<span class="tag tag-success">启用</span>'
            : '<span class="tag tag-disabled">停用</span>';
          var levelTagClass = LEVEL_TAGS[row.level] || '';
          var levelName = LEVEL_NAMES[row.level] || '';
          var canDelete = !row.isSystem;
          var canToggle = !row.isSystem;
          var toggleText = row.status === 'ENABLED' ? '停用' : '启用';
          var toggleClass = row.status === 'ENABLED' ? '' : 'danger';
          return `
            <tr>
              <td class="seq-col">${seq}</td>
              <td>${row.code}</td>
              <td>${Utils.escapeHtml(row.name)}</td>
              <td><span class="tag ${levelTagClass}">${levelName}</span></td>
              <td class="ellipsis-col" title="${Utils.escapeHtml(row.fullPath)}">${Utils.escapeHtml(row.fullPath)}</td>
              <td>${row.sortOrder}</td>
              <td>${statusTag}</td>
              <td class="action-col">
                <button class="btn-link" onclick="openEditModal(${row.id})">编辑</button>
                ${canToggle ? '<button class="btn-link ' + toggleClass + '" onclick="toggleRowStatus(' + row.id + ')">' + toggleText + '</button>' : ''}
                ${canDelete ? '<button class="btn-link danger" onclick="deleteRow(' + row.id + ')">删除</button>' : ''}
              </td>
            </tr>
          `;
        }).join('');
      }

      function toggleRowStatus(id) {
        var node = areaData.find(function(a) { return a.id === id; });
        if (!node) return;
        if (node.status === 'ENABLED') {
          var cascadeIds = getCascadeIds(node.id);
          var cascadeNames = cascadeIds.map(function(cid) { return areaData.find(function(a) { return a.id === cid; }); }).filter(Boolean).map(function(a) { return a.name; });
          showConfirm('停用确认', '确定停用「' + node.name + '」吗？', '将同时停用 ' + cascadeNames.length + ' 个区划（含自身）：' + cascadeNames.join('、'), function() {
            cascadeIds.forEach(function(cid) {
              var n = areaData.find(function(a) { return a.id === cid; });
              if (n) n.status = 'DISABLED';
            });
            renderTree();
            doFilter();
          });
        } else {
          showConfirm('启用确认', '确定启用「' + node.name + '」吗？', null, function() {
            node.status = 'ENABLED';
            renderTree();
            doFilter();
          });
        }
      }

      function deleteRow(id) {
        var node = areaData.find(function(a) { return a.id === id; });
        if (!node || node.isSystem) return;
        var hasChildren = getChildren(node.id).length > 0;
        if (hasChildren) {
          alert('该区划存在子节点，请先处理子节点后再删除。');
          return;
        }
        showConfirm('删除确认', '确定删除「' + node.name + '」吗？', '删除后不可恢复，请谨慎操作。', function() {
          areaData = areaData.filter(function(a) { return a.id !== id; });
          renderTree();
          doFilter();
        });
      }

      // ========== 弹窗 ==========
      function openAddModal() {
        if (!selectedNodeId) return;
        var node = areaData.find(function(a) { return a.id === selectedNodeId; });
        if (!node || node.level >= 4) return;
        var parent = node;
        modalMode = 'add';
        modalNodeId = null;
        document.getElementById('areaModalTitle').textContent = '新增区划';
        document.getElementById('modalParentName').value = parent.name;
        document.getElementById('modalAreaName').value = '';
        document.getElementById('modalAreaCode').value = generateCode(parent);
        // 层级下拉：只允许 parent.level + 1
        var childLevel = parent.level + 1;
        var levelSelect = document.getElementById('modalAreaLevel');
        levelSelect.innerHTML = '<option value="' + childLevel + '">' + LEVEL_NAMES[childLevel] + '</option>';
        document.getElementById('modalSortOrder').value = '0';
        document.getElementById('modalRemark').value = '';
        document.getElementById('areaModal').classList.add('show');
      }

      function openEditModal(id) {
        var node = areaData.find(function(a) { return a.id === id; });
        if (!node) return;
        var parent = areaData.find(function(a) { return a.id === node.parentId; });
        modalMode = 'edit';
        modalNodeId = id;
        document.getElementById('areaModalTitle').textContent = '编辑区划';
        document.getElementById('modalParentName').value = parent ? parent.name : '无';
        document.getElementById('modalAreaName').value = node.name;
        document.getElementById('modalAreaCode').value = node.code;
        // 编辑时层级只读，显示当前层级
        var levelSelect = document.getElementById('modalAreaLevel');
        levelSelect.innerHTML = '<option value="' + node.level + '">' + LEVEL_NAMES[node.level] + '</option>';
        document.getElementById('modalSortOrder').value = node.sortOrder;
        document.getElementById('modalRemark').value = node.remark || '';
        document.getElementById('areaModal').classList.add('show');
      }

      function closeAreaModal() {
        document.getElementById('areaModal').classList.remove('show');
      }

      function saveArea() {
        var name = document.getElementById('modalAreaName').value.trim();
        if (!name) { alert('请输入区划名称'); return; }
        if (name.length > 100) { alert('区划名称最长100字符'); return; }

        var sortOrder = parseInt(document.getElementById('modalSortOrder').value) || 0;
        var remark = document.getElementById('modalRemark').value.trim();

        if (modalMode === 'add') {
          var parent = areaData.find(function(a) { return a.id === selectedNodeId; });
          if (!parent) return;
          var newId = nextId++;
          var newLevel = parseInt(document.getElementById('modalAreaLevel').value);
          var newCode = generateCode(parent);
          var newNode = {
            id: newId,
            code: newCode,
            name: name,
            level: newLevel,
            parentId: parent.id,
            fullPath: parent.fullPath + '/' + name,
            sortOrder: sortOrder,
            status: 'ENABLED',
            isSystem: false,
            remark: remark,
            expanded: false
          };
          areaData.push(newNode);
          // 展开父节点
          parent.expanded = true;
          renderTree();
          selectNode(selectedNodeId);
        } else {
          var node = areaData.find(function(a) { return a.id === modalNodeId; });
          if (!node) return;
          // 更新名称时同步更新全路径
          var oldName = node.name;
          node.name = name;
          node.sortOrder = sortOrder;
          node.remark = remark;
          if (oldName !== name) {
            rebuildFullPath(node);
          }
          renderTree();
          doFilter();
        }
        closeAreaModal();
      }

      function generateCode(parent) {
        var siblings = getChildren(parent.id);
        var seq = siblings.length + 1;
        return parent.code + String(seq).padStart(3, '0');
      }

      function rebuildFullPath(node) {
        var parent = areaData.find(function(a) { return a.id === node.parentId; });
        node.fullPath = parent ? parent.fullPath + '/' + node.name : node.name;
        // 级联更新子节点
        getChildren(node.id).forEach(function(child) { rebuildFullPath(child); });
      }

      // ========== 确认弹窗 ==========
      function showConfirm(title, text, detail, callback) {
        confirmCallback = callback;
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmText').textContent = text;
        var detailEl = document.getElementById('confirmDetail');
        if (detail) {
          detailEl.textContent = detail;
          detailEl.style.display = 'block';
        } else {
          detailEl.style.display = 'none';
        }
        document.getElementById('confirmModal').classList.add('show');
      }

      function closeConfirmModal() {
        document.getElementById('confirmModal').classList.remove('show');
        confirmCallback = null;
      }

      function doConfirm() {
        if (confirmCallback) confirmCallback();
        closeConfirmModal();
      }

      // ========== 初始化 ==========
      function init() {
        areaData = buildFlatAreaData();
        nextId = 100000;
        renderTree();
        // 默认选中根节点
        var root = areaData.find(function(a) { return a.parentId === 0; });
        if (root) selectNode(root.id);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      function destroyModule() {
        console.log('[' + CONFIG.moduleId + '] 模块销毁');
        if (pg && typeof pg.destroy === 'function') { pg.destroy(); }
        pg = null;
        document.removeEventListener('click', onDocumentClick);
        document.removeEventListener('scroll', onDocumentScroll, true);
        document.removeEventListener('keydown', onKeydown);
      }
  </script>
</body>
</html>
