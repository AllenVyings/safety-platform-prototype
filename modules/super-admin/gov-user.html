<!DOCTYPE html>
<html lang="zh-CN">
<head>  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>人员账号管理 - 超管端</title>

<style>
.breadcrumb-item:hover{color:var(--primary)}
.page-container{height:100%;display:flex;flex-direction:column}
.main-layout{display:flex;gap: var(--spacing-md);margin-top: var(--spacing-md);flex:1;min-height:0}
.tree-panel{width:280px;flex-shrink:0;background:var(--bg-primary);border-radius: var(--radius-lg);padding: var(--spacing-md);height:fit-content;position:sticky;top:20px;max-height:100%;overflow-y:auto}
.tree-panel-title{font-size: var(--font-size-sm);font-weight:600;color:var(--text-primary);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0}
.tree-search{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);margin-bottom:10px;outline:none;transition:border-color .2s}
.tree-search:focus{border-color:var(--primary)}
.tree-node{padding: 7px var(--spacing-sm);border-radius: var(--radius-md);cursor:pointer;font-size: var(--font-size-sm);color:var(--text-primary);display:flex;align-items:center;gap:5px;transition:background .15s;user-select:none}
.tree-node:hover{background:var(--bg-secondary)}
.tree-node.active{background:var(--primary-light);color:var(--primary);font-weight:500}
.tree-node .toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-tertiary);transition:transform .2s;flex-shrink:0}
.tree-node .toggle.open{transform:rotate(90deg)}
.tree-children{padding-left:18px;display:none}
.tree-children.show{display:block}
.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap: var(--spacing-md);min-height:0}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.stat-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:16px 20px;border:1px solid var(--border-section)}
.stat-card-label{font-size: var(--font-size-xs);color:var(--text-tertiary);margin-bottom:6px}
.stat-card-value{font-size:22px;font-weight:700;color:var(--text-primary)}
.stat-card-sub{font-size:11px;color:var(--border);margin-top:2px}
.query-bar{background:var(--bg-primary);border-radius: var(--radius-lg);padding: var(--spacing-md) 20px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;border:1px solid var(--border-section)}
.query-bar .q-item{display:flex;align-items:center;gap:6px}
.query-bar label{font-size: var(--font-size-sm);color:var(--text-secondary);white-space:nowrap}
.query-bar select,.query-bar input{width:240px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);outline:none;transition:border-color .2s;box-sizing:border-box}
.query-bar select:focus,.query-bar input:focus{border-color:var(--primary)}

.btn-default:hover{color:var(--primary);border-color:var(--primary)}

.btn-primary:hover{background:var(--primary-hover)}

.btn-link:hover{color:var(--primary-hover)}
.btn-link.btn-sm{font-size: var(--font-size-xs);padding: 1px var(--spacing-xs)}

.btn-danger:hover{background:var(--danger-light);border-color:var(--danger)}
.table-card{background:var(--bg-primary);border-radius: var(--radius-lg);padding: var(--spacing-md);flex:1;overflow:hidden;border:1px solid var(--border-section);display:flex;flex-direction:column;min-height:0}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--spacing-md)}
/* 内容列自适应 + 长文本截断（复选框/序号/操作列使用框架固定列规则） */
.table-wrap td:not(.col-check):not(.col-index):not(.action-col){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table-wrap{flex:1;overflow:auto;min-height:0}
/* 分页 - .pagination 由 framework.css 提供, JS 分页由 pagination.js 驱动 */

.tag-success{background:var(--success-light);color:var(--success)}
.tag-error{background:var(--danger-light);color:var(--danger)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-primary);border-radius:10px;width:640px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding: var(--spacing-md) 20px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.modal-title{font-size: var(--font-size-lg);font-weight:600;color:var(--text-primary)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius: var(--radius-md);cursor:pointer;font-size: var(--font-size-md);color:var(--text-tertiary);transition:all .2s}
.modal-close:hover{background:var(--bg-secondary);color:var(--text-secondary)}
.modal-body{padding: 20px var(--spacing-lg);overflow-y:auto;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-light);flex-shrink:0}
.form-section{margin-bottom: var(--spacing-md)}
.form-section-title{font-size: var(--font-size-sm);font-weight:600;color:var(--text-primary);padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--border-light)}
.form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;flex:1;min-width:160px}
.form-label{font-size: var(--font-size-sm);color:var(--text-primary);margin-bottom:5px;font-weight:500}
.form-label .required{color:var(--danger);margin-right:2px}
.form-control{padding:6px 10px;border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);outline:none;transition:border-color .2s;width:100%;box-sizing:border-box}
.form-control:focus{border-color:var(--primary)}
/* 自定义多选下拉组件 */
.multi-select{position:relative;width:100%}
.multi-select-input{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid var(--border);border-radius: var(--radius-md);background:var(--bg-primary);cursor:pointer;transition:border-color .2s;min-height:34px}
.multi-select-input:hover{border-color:var(--primary-hover)}
.multi-select-input.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.multi-select-placeholder{color:var(--text-tertiary);font-size: var(--font-size-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.multi-select-value{color:var(--text-primary);font-size: var(--font-size-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.multi-select-arrow{width:0;height:0;margin-left:6px;border-left: var(--spacing-xs) solid transparent;border-right: var(--spacing-xs) solid transparent;border-top:5px solid var(--text-tertiary);transition:transform .2s;flex-shrink:0}
.multi-select-input.active .multi-select-arrow{transform:rotate(180deg)}
.multi-select-dropdown{display:none;position:absolute;top:100%;left:0;right:0;margin-top: var(--spacing-xs);background:var(--bg-primary);border:1px solid var(--border);border-radius: var(--radius-md);box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:1000;max-height:280px;overflow:hidden}
.multi-select-dropdown.show{display:block}
.multi-select-actions{display:flex;justify-content:space-between;padding: var(--spacing-sm) 12px;border-bottom:1px solid var(--border-light);background:var(--bg-tertiary)}
.multi-select-actions span{display:flex;align-items:center;font-size: var(--font-size-xs);color:var(--primary);cursor:pointer;padding: 2px var(--spacing-xs);border-radius: var(--radius-sm);transition:color .2s}
.multi-select-actions span:hover{color:var(--primary-hover)}
.multi-select-actions span i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right: var(--spacing-xs);font-style:normal;font-size:11px;border:1px solid currentColor;border-radius:3px}
.multi-select-options{max-height:200px;overflow-y:auto;padding: var(--spacing-xs) 0}
.multi-select-option{display:flex;align-items:center;padding: var(--spacing-sm) 12px;cursor:pointer;transition:background .15s;font-size: var(--font-size-sm)}
.multi-select-option:hover{background:var(--bg-secondary)}
.multi-select-option.selected{background:var(--primary-light)}
.multi-select-option.disabled{color:var(--text-tertiary);cursor:not-allowed}
.multi-select-option .cb{width:14px;height:14px;margin-right: var(--spacing-sm);border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg-primary);background:var(--bg-primary);transition:all .2s;flex-shrink:0}
.multi-select-option.selected .cb{background:var(--primary);border-color:var(--primary)}
.multi-select-option.selected .cb::after{content:"\2713"}
/* 详情弹窗字段行 */
.detail-row{display:flex;border-bottom:1px solid var(--border-light);line-height:44px}
.detail-row:last-child{border-bottom:none}
.detail-label{width:90px;flex-shrink:0;color:var(--text-tertiary);font-size: var(--font-size-sm);padding-left: var(--spacing-xs)}
.detail-value{flex:1;color:var(--text-primary);font-size: var(--font-size-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right: var(--spacing-sm)}
.detail-value 
.detail-section-title{padding: 0 var(--spacing-xs) 10px;margin-bottom: var(--spacing-xs);border-bottom:1px solid var(--border-light);font-size: var(--font-size-sm);font-weight:600;color:var(--text-primary)}
.detail-section{margin-bottom:14px}
#_toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding: 10px var(--spacing-lg);background:var(--text-primary);color:var(--bg-primary);border-radius: var(--radius-md);font-size: var(--font-size-md);z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}
.no-data td{text-align:center;color:var(--border);padding:40px 0}
</style>
</head>
<body>
<script src="../../js/pagination.js"></script>
<div class="page-container" data-module="super-admin/gov-user">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">超管端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">人员账号管理</span>
  </div>
  <div class="main-layout">
    <!-- 左侧：政府组织树 -->
    <div class="tree-panel">
      <div class="tree-panel-title">政府组织架构</div>
      <input class="tree-search" id="treeSearch" placeholder="搜索单位或科室..." oninput="filterTree()">
      <div id="orgTree"></div>
    </div>
    <!-- 右侧：四区 -->
    <div class="right-panel">
      <!-- 统计卡片 -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-card-label">用户总数</div><div class="stat-card-value" id="statTotal" style="color:var(--primary)">42</div><div class="stat-card-sub">政府用户</div></div>
        <div class="stat-card"><div class="stat-card-label">启用中</div><div class="stat-card-value" id="statNormal" style="color:var(--success)">38</div><div class="stat-card-sub">已启用</div></div>
        <div class="stat-card"><div class="stat-card-label">停用中</div><div class="stat-card-value" id="statDisabled" style="color:var(--text-tertiary)">4</div><div class="stat-card-sub">已停用</div></div>
        <div class="stat-card"><div class="stat-card-label">领导层</div><div class="stat-card-value" id="statLeader" style="color:var(--warning)">0</div><div class="stat-card-sub">领导层用户</div></div>
      </div>
      <!-- 查询条件 -->
      <div class="query-bar">
        <div class="q-item"><label>姓名：</label>
          <input id="filterName" placeholder="搜索姓名">
        </div>
        <div class="q-item"><label>手机号：</label>
          <input id="filterPhone" placeholder="搜索手机号">
        </div>
        <div class="q-item"><label>状态：</label>
          <select id="filterStatus"><option value="">全部</option><option>启用</option><option>停用</option></select>
        </div>
        <button class="btn btn-primary" onclick="renderTable()">查询</button>
        <button class="btn btn-default" onclick="document.getElementById('filterName').value='';document.getElementById('filterPhone').value='';document.getElementById('filterStatus').value='';renderTable()">重置</button>
      </div>
      <!-- 用户列表 -->
      <div class="table-card">
        <div class="table-toolbar">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary)">用户列表</span>
            <div id="batchBar" style="display:none;align-items:center;gap:8px;padding:4px 10px;background:var(--primary-light);border-radius:var(--radius-md);font-size:var(--font-size-xs);color:var(--primary)">
              已选 <span class="batch-count">0</span> 项
              <button class="btn btn-link btn-sm" style="color:var(--danger);padding:0 4px" onclick="batchDelete()">批量删除</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增用户</button>
            <button class="btn btn-default btn-sm" onclick="downloadTemplate()">下载模板</button>
            <button class="btn btn-default btn-sm" onclick="openBatchImport()">批量导入</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="col-check"><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
              <th class="col-index">序号</th>
              <th>姓名</th><th>手机号</th><th>所属单位</th><th>所属科室</th>
              <th>职务</th><th>用户层级</th>
              <th>状态</th><th class="action-col">操作</th>
            </tr></thead>
            <tbody id="userTableBody"><tr><td colspan="10" class="no-data">加载中...</td></tr></tbody>
          </table>
        </div>
        <!-- 分页 -->
        <div class="pagination" id="paginationBar"></div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增用户</span>
      <div class="modal-close" onclick="closeModal('editModal')">&#x2715;</div>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <div class="form-section-title">基本信息</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>用户姓名</label><input class="form-control" id="fName" type="text" placeholder="请输入用户姓名"></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>手机号码</label><input class="form-control" id="fMobile" type="text" placeholder="请输入手机号码" oninput="syncAccountFromMobile()"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属单位</label>
            <select class="form-control" id="fOrg" onchange="onOrgChange()">
              <option value="">请选择所属单位</option>
            </select></div>
          <div class="form-group"><label class="form-label">所属科室</label>
            <select class="form-control" id="fDept" onchange="onDeptChange()"><option value="">请先选择所属单位</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>职务</label><input class="form-control" id="fTitle" type="text" placeholder="请输入职务"></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>用户层级</label>
            <select class="form-control" id="fUserType">
              <option value="">请选择用户层级</option><option>领导层</option><option>监管层</option><option>巡查层</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">管理部门</label>
            <div class="multi-select" id="fManageDeptsWrap">
              <div class="multi-select-input" onclick="toggleMultiDropdown()">
                <span class="multi-select-placeholder" id="fManageDeptsText">请先选择所属单位</span>
                <i class="multi-select-arrow"></i>
              </div>
              <div class="multi-select-dropdown" id="fManageDeptsDropdown">
                <div class="multi-select-actions">
                  <span onclick="selectAllManageDepts()"><i>&#x2713;</i>全选</span>
                  <span onclick="clearManageDepts()"><i>&#x2715;</i>清空</span>
                </div>
                <div class="multi-select-options" id="fManageDeptsOptions">
                  <div class="multi-select-option disabled">请先选择所属单位</div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group"><label class="form-label">上级领导</label>
            <select class="form-control" id="fLeader"><option value="">请选择上级领导（选填）</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>状态</label>
            <select class="form-control" id="fStatus">
              <option value="启用" selected>启用</option><option value="停用">停用</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">邮箱</label><input class="form-control" id="fEmail" type="email" placeholder="请输入邮箱（选填）"></div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1 0 100%"><label class="form-label">备注</label><textarea class="form-control" id="fRemark" placeholder="请输入备注（选填，200字以内）" style="min-height:60px;resize:vertical"></textarea></div>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">账号信息</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>账号（手机号）</label><input class="form-control" id="fAccount" type="text" placeholder="自动填充手机号" disabled style="background:var(--bg-secondary);cursor:not-allowed;"></div>
          <div class="form-group"><label class="form-label" id="pwdLabel"><span class="required">*</span>用户密码</label><input class="form-control" id="fPwd" type="password" placeholder="默认Abc@123456"></input></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-primary" onclick="saveUser()">确定</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">确认删除</span>
      <div class="modal-close" onclick="closeModal('deleteModal')">&#x2715;</div>
    </div>
    <div class="modal-body" style="padding:28px 24px;text-align:center">
      <div style="width:48px;height:48px;margin:0 auto 16px;background:var(--danger-light);border-radius:50%;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="var(--danger)"/></svg>
      </div>
      <p style="font-size:15px;color:var(--text-primary);margin:0 0 6px;font-weight:500" id="deleteMsg">确定要删除该用户吗？</p>
      <p style="font-size: var(--font-size-sm);color:var(--text-tertiary);margin:0">删除后数据无法恢复，请谨慎操作</p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-default" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="width:560px">
    <div class="modal-header">
      <span class="modal-title">用户详情</span>
      <div class="modal-close" onclick="closeModal('detailModal')">&#x2715;</div>
    </div>
    <div class="modal-body" style="padding:20px 24px" id="detailBody"></div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-default" onclick="closeModal('detailModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 重置密码确认弹窗 -->
<div class="modal-overlay" id="resetPwdModal">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">重置密码</span>
      <div class="modal-close" onclick="closeModal('resetPwdModal')">&#x2715;</div>
    </div>
    <div class="modal-body" style="padding:28px 24px;text-align:center">
      <div style="width:48px;height:48px;margin:0 auto 16px;background:var(--warning-light);border-radius:50%;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="var(--warning)"/></svg>
      </div>
      <p style="font-size:15px;color:var(--text-primary);margin:0 0 6px;font-weight:500" id="resetPwdMsg">确定要重置该用户密码吗？</p>
      <p style="font-size: var(--font-size-sm);color:var(--text-tertiary);margin:0">密码将重置为默认密码：<strong style="color:var(--primary)">Abc@123456</strong></p>
    </div>
    <div class="modal-footer" style="justify-content:center">

// ==================== 渲染组织树 ====================
function _getChildDepts(pid){
  var nodes = [];
  if(pid === 'root'){
    // 根节点：南山区（含全部21个单位作为子节点）
    var nanshan = {id:'nanshan', name:'南山区', type:'district', children:[]};
    govOrgData.orgs.forEach(function(org){
      nanshan.children.push({id:org.id, name:org.name, type:'org', children:org.depts || []});
    });
    return [nanshan];
  }
  if(pid === 'nanshan'){
    govOrgData.orgs.forEach(function(org){
      nodes.push({id:org.id, name:org.name, type:'org', children:org.depts || []});
    });
    return nodes;
  }
  govOrgData.orgs.forEach(function(org){
    var d = org.depts.find(function(dd){return dd.id === pid;});
    if(d && d.children) d.children.forEach(function(c){nodes.push({id:c.id,name:c.name,type:'dept'});});
  });
  return nodes;
}

function _updateStats(orgId){
  var filtered = (orgId && orgId !== 'nanshan') ? allUsers.filter(function(u){return u.orgId === orgId;}) : allUsers;
  document.getElementById('statTotal').textContent = filtered.length;
  document.getElementById('statNormal').textContent = filtered.filter(function(u){return u.status==='启用';}).length;
  document.getElementById('statDisabled').textContent = filtered.filter(function(u){return u.status==='停用';}).length;
  document.getElementById('statLeader').textContent = filtered.filter(function(u){return u.userType==='领导层';}).length;
}

function filterTree(){
  var kw = document.getElementById('treeSearch').value.trim().toLowerCase();
  document.querySelectorAll('#orgTree .tree-node').forEach(function(n){
    var name = n.textContent.toLowerCase();
    n.style.display = (!kw || name.includes(kw)) ? 'flex' : 'none';
  });
}

function renderOrgTree(){
  var tree = document.getElementById('orgTree');
  function _renderNode(n){
    var childNodes = _getChildDepts(n.id);
    var hasChildren = childNodes.length > 0;
    var isActive = window._activeOrg === n.id || (n.id === 'nanshan' && !window._activeOrg);
    var cls = 'tree-node' + (isActive ? ' active' : '');
    var toggleHtml = hasChildren
      ? '<span class="toggle' + (window._openNodes && window._openNodes[n.id] ? ' open' : '') + '" onclick="event.stopPropagation();toggleNode(\'' + n.id + '\')">&#9654;</span>'
      : '<span class="toggle"></span>';
    var childrenHtml = hasChildren
      ? '<div class="tree-children' + (window._openNodes && window._openNodes[n.id] ? ' show' : '') + '" id="ch_' + n.id + '">' +
        childNodes.map(function(c){ return _renderNode(c); }).join('') + '</div>'
      : '';
    return '<div class="' + cls + '" id="tog_' + n.id + '" data-id="' + n.id + '" onclick="selectOrg(\'' + n.id + '\',this)">' +
      toggleHtml + '<span>' + n.name + '</span></div>' + childrenHtml;
  }
  // 默认展开全部层级（必须在 _renderNode 之前设置）
  if(!window._openNodes) window._openNodes = {};
  window._openNodes['nanshan'] = true;
  govOrgData.orgs.forEach(function(o){ window._openNodes[o.id] = true; });
  var root = _getChildDepts('root')[0]; // 南山区
  tree.innerHTML = _renderNode(root);
}

function toggleNode(id){
  if(!window._openNodes) window._openNodes = {};
  window._openNodes[id] = !window._openNodes[id];
  var tog = document.getElementById('tog_' + id);
  var ch = document.getElementById('ch_' + id);
  if(tog) tog.querySelector('.toggle').classList.toggle('open', window._openNodes[id]);
  if(ch) ch.classList.toggle('show', window._openNodes[id]);
}

function selectOrg(id, el){
  window._activeOrg = (id && id !== 'nanshan') ? id : null;
  window._activeOrgType = null;
  if(id && id !== 'nanshan'){
    // 检查是否是科室ID（在orgs的depts中）
    govOrgData.orgs.forEach(function(org){
      if(org.depts){
        org.depts.forEach(function(dept){
          if(dept.id === id) window._activeOrgType = 'dept';
        });
      }
    });
    // 如果不是科室，则是单位
    if(!window._activeOrgType) window._activeOrgType = 'org';
  }
  _updateStats(id);
  renderTable();
  document.querySelectorAll('#orgTree .tree-node').forEach(function(n){n.classList.remove('active');});
  if(el) el.classList.add('active');
}

// ==================== 渲染用户列表 ====================
// ==================== 分页状态 ====================
var currentPage = 1;
var pageSize = 10;
var pg = null;
var filteredRows = [];

function renderTable(){
  var nameVal = document.getElementById('filterName').value.trim().toLowerCase();
  var phoneVal = document.getElementById('filterPhone').value.trim();
  var statusVal = document.getElementById('filterStatus').value;
  var activeId = window._activeOrg;
  var activeType = window._activeOrgType;
  filteredRows = allUsers.filter(function(u){
    if(activeId){
      if(activeType === 'dept'){
        if(u.deptId !== activeId) return false;
      }else{
        if(u.orgId !== activeId) return false;
      }
    }
    if(nameVal && !u.name.toLowerCase().includes(nameVal)) return false;
    if(phoneVal && u.mobile !== phoneVal) return false;
    if(statusVal && u.status !== statusVal) return false;
    return true;
  });
  var start = (currentPage - 1) * pageSize;
  var pageRows = filteredRows.slice(start, start + pageSize);
  var tbody = document.getElementById('userTableBody');
  if(pageRows.length === 0){
    tbody.innerHTML = '<tr><td colspan="10" class="no-data">暂无数据</td></tr>';
    if(pg) pg.setTotal(filteredRows.length);
    return;
  }
  tbody.innerHTML = pageRows.map(function(u, idx){
    var org = govOrgData.orgs.find(function(o){return o.id === u.orgId;});
    var dept = org ? org.depts.find(function(d){return d.id === u.deptId;}) : null;
    var statusLabel = u.status === '启用' ? '启用' : '停用';
    var statusCls = u.status === '启用' ? 'tag-success' : 'tag-error';
    return '<tr>' +
      '<td class="col-check"><input type="checkbox" class="row-check" value="' + u.id + '" onchange="toggleRow()"></td>' +
      '<td class="col-index">' + (start + idx + 1) + '</td>' +
      '<td title="' + u.name + '">' + u.name + '</td>' +
      '<td title="' + u.mobile + '">' + (u.mobile||'—') + '</td>' +
      '<td title="' + (org?org.name:'') + '">' + (org?org.name:'') + '</td>' +
      '<td title="' + (dept?dept.name:'—') + '">' + (dept?dept.name:'—') + '</td>' +
      '<td title="' + u.title + '">' + (u.title||'') + '</td>' +
      '<td>' + (u.userType||'') + '</td>' +
      '<td><span class="tag ' + statusCls + '">' + statusLabel + '</span></td>' +
      '<td class="action-col"><div class="table-action-group"><button class="btn btn-link" onclick="openEditModal(\'' + u.id + '\')">编辑</button><button class="btn btn-link" onclick="deleteUser(\'' + u.id + '\')">删除</button><button class="btn btn-link" onclick="viewDetail(\'' + u.id + '\')">详情</button><button class="btn btn-link" onclick="resetPwd(\'' + u.id + '\')">重置密码</button></div></td>' +
      '</tr>';
  }).join('');
  if(pg) pg.setTotal(filteredRows.length);
}

function toggleRow(){
  var all = document.querySelectorAll('.row-check');

  if(checkAll) checkAll.checked = all.length > 0 && all.length === checked.length;

}
function updateBatchBar(){
  var bar = document.getElementById('batchBar');
  if(!bar) return;
  var count = getSelectedIds().length;
  bar.style.display = count > 0 ? 'flex' : 'none';

  if(span) span.textContent = count;
}
function batchDelete(){
  var ids = getSelectedIds();
  if(ids.length === 0){ showToast('请先选择要删除的用户'); return; }
  // BR-GOV-12 待办任务校验
  var blockedUsers = allUsers.filter(function(u){
    return ids.indexOf(u.id) !== -1 && u.pendingTasks && u.pendingTasks > 0;
  });
  if(blockedUsers.length > 0){
    var msg = '以下 ' + blockedUsers.length + ' 个用户存在未完成的待办任务，无法删除（BR-GOV-12）：\n\n';
    blockedUsers.forEach(function(u){
      msg += '· ' + u.name + '（' + u.title + '）— 待办 ' + u.pendingTasks + ' 项\n';
    });
    msg += '\n请先转交或完成上述用户的待办任务后再执行删除。';
    alert(msg);
    return;
  }
  if(!confirm('确认删除选中的 ' + ids.length + ' 个用户？')) return;
  allUsers = allUsers.filter(function(u){ return ids.indexOf(u.id) === -1; });
  renderTable();
  _updateStats(null);
  showToast('已删除 ' + ids.length + ' 个用户');
}

function openAddModal(){
  currentEditUser = null;
  document.getElementById('modalTitle').textContent = '新增用户';
  ['fName','fMobile','fEmail','fTitle','fPwd','fRemark'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('fAccount').value = '';
  document.getElementById('fOrg').value = '';
  document.getElementById('fDept').innerHTML = '<option value="">请先选择所属单位</option>';
  renderManageDeptsOptions([]);
  document.getElementById('fUserType').value = '';
  document.getElementById('fLeader').innerHTML = '<option value="">请选择上级领导（选填）</option>';
  document.getElementById('fStatus').value = '启用';
  document.getElementById('fAccount').disabled = true;
  document.getElementById('fPwd').value = 'Abc@123456';
  document.getElementById('pwdLabel').innerHTML = '<span class="required">*</span>用户密码 <span style="color:var(--text-tertiary);font-weight:normal">（默认Abc@123456）</span>';
  // 自动带出组织树选中的单位/科室
  var activeOrg = window._activeOrg;
  var activeType = window._activeOrgType;
  if(activeOrg && activeOrg !== 'nanshan'){
    if(activeType === 'dept'){
      var parentOrg = null;
      govOrgData.orgs.forEach(function(o){
        if(o.depts && o.depts.some(function(d){return d.id === activeOrg;})) parentOrg = o;
      });
      if(parentOrg){
        document.getElementById('fOrg').value = parentOrg.id;
        onOrgChange();
        document.getElementById('fDept').value = activeOrg;
        // 管理部门也默认勾选该科室
        var deptOpt = document.querySelector('#fManageDeptsOptions .multi-select-option[data-value="'+activeOrg+'"]');
        if(deptOpt) deptOpt.classList.add('selected');
        updateManageDeptsDisplay();
      }
    }else{
      document.getElementById('fOrg').value = activeOrg;
      onOrgChange();
    }
  }
  document.getElementById('editModal').classList.add('show');
}

function openEditModal(id){
  var u = allUsers.find(function(x){return x.id === id;});
  if(!u) return;
  currentEditUser = u;
  document.getElementById('modalTitle').textContent = '编辑用户';
  document.getElementById('fName').value = u.name;
  document.getElementById('fMobile').value = u.mobile;
  document.getElementById('fEmail').value = u.email || '';
  document.getElementById('fTitle').value = u.title;
  document.getElementById('fOrg').value = u.orgId;
  var org = govOrgData.orgs.find(function(o){return o.id === u.orgId;});
  var deptSel = document.getElementById('fDept');
  deptSel.innerHTML = '<option value="">请选择所属科室</option>' + (org ? org.depts.map(function(d){return '<option value="' + d.id + '">' + d.name + '</option>';}).join('') : '');
  deptSel.value = u.deptId;
  renderManageDeptsOptions(org ? org.depts : []);
  if(u.manageDeptIds){
    u.manageDeptIds.forEach(function(id){
      var opt = document.querySelector('#fManageDeptsOptions .multi-select-option[data-value="'+id+'"]');
      if(opt) opt.classList.add('selected');
    });
  }
  updateManageDeptsDisplay();
  document.getElementById('fUserType').value = u.userType;
  document.getElementById('fStatus').value = u.status;
  document.getElementById('fRemark').value = u.remark || '';
  // BR-GOV-10：回填上级领导
  var sameOrgUsers = allUsers.filter(function(x){return x.orgId === u.orgId && x.id !== u.id;});
  document.getElementById('fLeader').innerHTML = '<option value="">请选择上级领导（选填）</option>' + sameOrgUsers.map(function(x){return '<option value="' + x.id + '">' + x.name + '（' + x.title + '）</option>';}).join('');
  if(u.leaderId) document.getElementById('fLeader').value = u.leaderId;
  document.getElementById('fAccount').value = u.account;
  document.getElementById('fAccount').disabled = true;
  document.getElementById('fPwd').value = '';
  document.getElementById('pwdLabel').innerHTML = '<span class="required">*</span>用户密码 <span style="color:var(--text-tertiary);font-weight:normal">（留空则不修改）</span>';
  document.getElementById('editModal').classList.add('show');
}

function onOrgChange(){
  var orgId = document.getElementById('fOrg').value;
  var org = govOrgData.orgs.find(function(o){return o.id === orgId;});
  var deptSel = document.getElementById('fDept');
  deptSel.innerHTML = '<option value="">请选择所属科室</option>' + (org ? org.depts.map(function(d){return '<option value="' + d.id + '">' + d.name + '</option>';}).join('') : '');
  var sameOrgUsers = allUsers.filter(function(u){return u.orgId === orgId;});

  var deptId = document.getElementById('fDept').value;

function saveUser(){
  var name = document.getElementById('fName').value.trim();
  var mobile = document.getElementById('fMobile').value.trim();
  if(!name || !mobile){ showToast('请填写必填项'); return; }
  if(currentEditUser){
    currentEditUser.name = name;
    currentEditUser.mobile = mobile;
    currentEditUser.email = document.getElementById('fEmail').value.trim();
    currentEditUser.title = document.getElementById('fTitle').value.trim();
    currentEditUser.orgId = document.getElementById('fOrg').value;
    currentEditUser.deptId = document.getElementById('fDept').value;
    currentEditUser.manageDeptIds = getSelectedManageDepts();
    currentEditUser.leaderId = document.getElementById('fLeader').value;
    currentEditUser.userType = document.getElementById('fUserType').value;
    currentEditUser.status = document.getElementById('fStatus').value;
    currentEditUser.remark = document.getElementById('fRemark').value;
    showToast('用户信息已更新');
  }else{
    var newUser = {
      id: _uidGen(),
      name: name,
      account: document.getElementById('fAccount').value.trim() || document.getElementById('fMobile').value.trim() || 'u' + Date.now(),
      mobile: mobile,
      email: document.getElementById('fEmail').value.trim(),
      title: document.getElementById('fTitle').value.trim(),
      orgId: document.getElementById('fOrg').value,
      deptId: document.getElementById('fDept').value,
      manageDeptIds: getSelectedManageDepts(),
      leaderId: document.getElementById('fLeader').value,
      userType: document.getElementById('fUserType').value,
      status: document.getElementById('fStatus').value,
      remark: document.getElementById('fRemark').value,
      lastLogin: '—'
    };
    allUsers.unshift(newUser);
    showToast('用户新增成功');
  }
  closeModal('editModal');
  renderTable();
  _updateStats(window._activeOrg);
}

// ==================== 管理部门多选下拉 ====================
function toggleMultiDropdown(){
  var wrap = document.getElementById('fManageDeptsWrap');
  var drop = document.getElementById('fManageDeptsDropdown');
  var input = wrap.querySelector('.multi-select-input');
  var isOpen = drop.classList.contains('show');
  if(isOpen){
    drop.classList.remove('show');
    input.classList.remove('active');
    document.removeEventListener('click', closeMultiOnClickOutside);
  }else{
    drop.classList.add('show');
    input.classList.add('active');
    setTimeout(function(){document.addEventListener('click', closeMultiOnClickOutside);},0);
  }
}
function closeMultiOnClickOutside(e){
  var wrap = document.getElementById('fManageDeptsWrap');
  if(!wrap) return;
  if(!wrap.contains(e.target)){
    var drop = document.getElementById('fManageDeptsDropdown');
    var input = wrap.querySelector('.multi-select-input');
    drop.classList.remove('show');
    input.classList.remove('active');
    document.removeEventListener('click', closeMultiOnClickOutside);
  }
}
function updateManageDeptsDisplay(){
  var opts = document.querySelectorAll('#fManageDeptsOptions .multi-select-option.selected');
  var textEl = document.getElementById('fManageDeptsText');
  if(opts.length === 0){
    textEl.textContent = '请选择管理部门';
    textEl.className = 'multi-select-placeholder';
  }else if(opts.length <= 2){
    textEl.textContent = Array.from(opts).map(function(o){return o.dataset.label;}).join('、');
    textEl.className = 'multi-select-value';
  }else{
    textEl.textContent = '已选择 ' + opts.length + ' 项';
    textEl.className = 'multi-select-value';
  }
}
function renderManageDeptsOptions(depts){
  var container = document.getElementById('fManageDeptsOptions');
  if(!depts || depts.length === 0){
    container.innerHTML = '<div class="multi-select-option disabled">请先选择所属单位</div>';
    return;
  }
  container.innerHTML = depts.map(function(d){
    return '<div class="multi-select-option" data-value="' + d.id + '" data-label="' + d.name + '" onclick="toggleManageDept(this)"><span class="cb"></span><span>' + d.name + '</span></div>';
  }).join('');
  updateManageDeptsDisplay();
}
function toggleManageDept(el){
  if(el.classList.contains('disabled')) return;
  el.classList.toggle('selected');
  updateManageDeptsDisplay();
}
function selectAllManageDepts(){
  var opts = document.querySelectorAll('#fManageDeptsOptions .multi-select-option:not(.disabled)');
  var allSelected = Array.from(opts).every(function(o){return o.classList.contains('selected');});
  opts.forEach(function(o){o.classList.toggle('selected', !allSelected);});
  updateManageDeptsDisplay();
}
function clearManageDepts(){
  document.querySelectorAll('#fManageDeptsOptions .multi-select-option.selected').forEach(function(o){o.classList.remove('selected');});
  updateManageDeptsDisplay();
}
function getSelectedManageDepts(){
  return Array.from(document.querySelectorAll('#fManageDeptsOptions .multi-select-option.selected')).map(function(o){return o.dataset.value;});
}

function viewDetail(id){
  var u = allUsers.find(function(x){return x.id === id;});
  if(!u) return;
  var org = govOrgData.orgs.find(function(o){return o.id === u.orgId;});
  var dept = org ? org.depts.find(function(d){return d.id === u.deptId;}) : null;
  var manageDepts = [];
  if(org && u.manageDeptIds){
    manageDepts = org.depts.filter(function(d){return u.manageDeptIds.indexOf(d.id) > -1;}).map(function(d){return d.name;});
  }
  var statusCls = u.status === '启用' ? 'tag-success' : 'tag-error';
  var html = '<div class="detail-section">';
  html += '<div class="detail-section-title">基本信息</div>';
  html += '<div class="detail-row"><div class="detail-label">用户姓名</div><div class="detail-value">' + u.name + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">手机号码</div><div class="detail-value">' + u.mobile + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">邮箱</div><div class="detail-value">' + (u.email||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">职务</div><div class="detail-value">' + (u.title||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">所属单位</div><div class="detail-value">' + (org?org.name:'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">所属科室</div><div class="detail-value">' + (dept?dept.name:'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">管理部门</div><div class="detail-value">' + (manageDepts.length?manageDepts.join('、'):'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">用户层级</div><div class="detail-value">' + (u.userType||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">状态</div><div class="detail-value"><span class="tag ' + statusCls + '">' + u.status + '</span></div></div>';
  html += '</div>';
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">账号信息</div>';
  html += '<div class="detail-row"><div class="detail-label">账号</div><div class="detail-value">' + u.account + '</div></div>';
  html += '</div>';
  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}

// ==================== Toast ====================
function showToast(msg){
  var t = document.getElementById('_toast');
  if(!t){ t = document.createElement('div'); t.id = '_toast'; document.body.appendChild(t); }
  Object.assign(t.style, {position:'fixed',top:'20px',left:'50%',transform:'translateX(-50%)',padding:'10px 24px',background:'var(--text-primary)',color:'var(--bg-primary)',borderRadius: 'var(--radius-md)',fontSize: 'var(--font-size-md)',zIndex:99999,opacity:0,transition:'opacity .3s'});
  t.textContent = msg;
  setTimeout(function(){ t.style.opacity = 1; }, 10);
  setTimeout(function(){ t.style.opacity = 0; }, 2000);
}
