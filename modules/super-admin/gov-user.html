<!DOCTYPE html>
<html lang="zh-CN">
<head>  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>政府用户管理 - 超管端</title>

<style>
.page-container{padding:20px;background:linear-gradient(180deg,#f0f2f5 0%,#f5f7fa 100%);min-height:100vh}

.breadcrumb-item:hover{color:#1677ff}
.main-layout{display:flex;gap:16px;margin-top:16px;min-height:calc(100vh - 100px)}
.tree-panel{width:220px;flex-shrink:0;background:#fff;border-radius:8px;padding:16px;height:fit-content;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}
.tree-panel-title{font-size:13px;font-weight:600;color:#1f1f1f;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0}
.tree-search{width:100%;padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;margin-bottom:10px;outline:none;transition:border-color .2s}
.tree-search:focus{border-color:#1677ff}
.tree-node{padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:#1f1f1f;display:flex;align-items:center;gap:5px;transition:background .15s;user-select:none}
.tree-node:hover{background:#f5f5f5}
.tree-node.active{background:#e6f7ff;color:#1677ff;font-weight:500}
.tree-node .toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;transition:transform .2s;flex-shrink:0}
.tree-node .toggle.open{transform:rotate(90deg)}
.tree-children{padding-left:18px;display:none}
.tree-children.show{display:block}
.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card-label{font-size:12px;color:#888;margin-bottom:6px}
.stat-card-value{font-size:22px;font-weight:700;color:#1f1f1f}
.stat-card-sub{font-size:11px;color:#bbb;margin-top:2px}
.query-bar{background:#fff;border-radius:8px;padding:16px 20px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.query-bar .q-item{display:flex;align-items:center;gap:6px}
.query-bar label{font-size:13px;color:#666;white-space:nowrap}
.query-bar select,.query-bar input{padding:5px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none;transition:border-color .2s}
.query-bar select:focus,.query-bar input:focus{border-color:#1677ff}
.btn{padding:5px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff}
.btn-link{background:none;border:none;padding:2px 6px;color:#1677ff;cursor:pointer;font-size:13px}
.btn-link:hover{color:#4096ff}
.btn-link.btn-sm{font-size:12px;padding:1px 4px}
.btn-danger{padding:4px 15px;border:1px solid #ffccc7;color:#ff4d4f;background:#fff;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
.btn-danger:hover{background:#fff2f0;border-color:#ff4d4f}
.table-card{background:#fff;border-radius:8px;padding:16px;flex:1;overflow:hidden}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
thead th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;color:#555;border-bottom:1px solid #f0f0f0;white-space:nowrap;position:relative}
tbody td{padding:10px 12px;border-bottom:1px solid #f5f5f5;color:#333;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
/* 列宽固定 */
thead th:nth-child(1),tbody td:nth-child(1){width:80px;max-width:80px}   /* 姓名 */
thead th:nth-child(2),tbody td:nth-child(2){width:120px;max-width:120px}  /* 手机号 */
thead th:nth-child(3),tbody td:nth-child(3){width:150px;max-width:150px}  /* 所属单位 */
thead th:nth-child(4),tbody td:nth-child(4){width:120px;max-width:120px}  /* 所属科室 */
thead th:nth-child(5),tbody td:nth-child(5){width:90px;max-width:90px}    /* 职务 */
thead th:nth-child(6),tbody td:nth-child(6){width:90px;max-width:90px}    /* 层级 */
thead th:nth-child(7),tbody td:nth-child(7){width:70px;max-width:70px}  /* 状态 */
/* 操作列固定在右侧，表头居中 */
thead th:nth-child(8){text-align:center;width:280px;max-width:280px;position:sticky;right:0;background:#fafafa;box-shadow:-2px 0 4px rgba(0,0,0,.04);z-index:10}/* 操作 */
tbody td:nth-child(8){width:280px;max-width:280px;position:sticky;right:0;background:#fff;box-shadow:-2px 0 4px rgba(0,0,0,.04);z-index:10;white-space:nowrap}
tbody td:nth-child(8) .btn-link{margin-right:8px}
tbody td:nth-child(8) .btn-link:last-child{margin-right:0}
/* 分页样式 */
.pagination-wrap{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:12px 16px;border-top:1px solid #f0f0f0;background:#fafafa}
.pagination-info{font-size:13px;color:#666}
.pagination-size select{padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none}
.pagination-btns{display:flex;gap:4px}
.pagination-btns button{min-width:28px;height:28px;padding:0 8px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;font-size:13px;cursor:pointer;transition:all .2s}
.pagination-btns button:hover:not(:disabled){border-color:#1677ff;color:#1677ff}
.pagination-btns button.active{background:#1677ff;color:#fff;border-color:#1677ff}
.pagination-btns button:disabled{cursor:not-allowed;color:#bbb;background:#f5f5f5}
.pagination-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#666}
.pagination-jump input{width:40px;height:28px;padding:0 6px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;text-align:center;outline:none}
.pagination-jump input:focus{border-color:#1677ff}
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:12px}
.tag-success{background:#f6ffed;color:#52c41a}
.tag-error{background:#fff2f0;color:#ff4d4f}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:10px;width:640px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.modal-title{font-size:16px;font-weight:600;color:#1e293b}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:14px;color:#999;transition:all .2s}
.modal-close:hover{background:#f5f5f5;color:#666}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #f0f0f0;flex-shrink:0}
.form-section{margin-bottom:16px}
.form-section-title{font-size:13px;font-weight:600;color:#1f1f1f;padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid #f0f0f0}
.form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;flex:1;min-width:160px}
.form-label{font-size:13px;color:#333;margin-bottom:5px;font-weight:500}
.form-label .required{color:#ff4d4f;margin-right:2px}
.form-control{padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none;transition:border-color .2s;width:100%;box-sizing:border-box}
.form-control:focus{border-color:#1677ff}
/* 自定义多选下拉组件 */
.multi-select{position:relative;width:100%}
.multi-select-input{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;transition:border-color .2s;min-height:34px}
.multi-select-input:hover{border-color:#40a9ff}
.multi-select-input.active{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.multi-select-placeholder{color:#999;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.multi-select-value{color:#1f1f1f;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.multi-select-arrow{width:0;height:0;margin-left:6px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #999;transition:transform .2s;flex-shrink:0}
.multi-select-input.active .multi-select-arrow{transform:rotate(180deg)}
.multi-select-dropdown{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid #d9d9d9;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:1000;max-height:280px;overflow:hidden}
.multi-select-dropdown.show{display:block}
.multi-select-actions{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fafafa}
.multi-select-actions span{display:flex;align-items:center;font-size:12px;color:#1677ff;cursor:pointer;padding:2px 4px;border-radius:4px;transition:color .2s}
.multi-select-actions span:hover{color:#4096ff}
.multi-select-actions span i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right:4px;font-style:normal;font-size:11px;border:1px solid currentColor;border-radius:3px}
.multi-select-options{max-height:200px;overflow-y:auto;padding:4px 0}
.multi-select-option{display:flex;align-items:center;padding:8px 12px;cursor:pointer;transition:background .15s;font-size:13px}
.multi-select-option:hover{background:#f5f5f5}
.multi-select-option.selected{background:#e6f7ff}
.multi-select-option.disabled{color:#999;cursor:not-allowed}
.multi-select-option .cb{width:14px;height:14px;margin-right:8px;border:1px solid #d9d9d9;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:#fff;transition:all .2s;flex-shrink:0}
.multi-select-option.selected .cb{background:#1677ff;border-color:#1677ff}
.multi-select-option.selected .cb::after{content:"\2713"}
/* 详情弹窗字段行 */
.detail-row{display:flex;border-bottom:1px solid #f0f0f0;line-height:44px}
.detail-row:last-child{border-bottom:none}
.detail-label{width:90px;flex-shrink:0;color:#888;font-size:13px;padding-left:4px}
.detail-value{flex:1;color:#1f1f1f;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.detail-value .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px}
.detail-section-title{padding:0 4px 10px;margin-bottom:4px;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:600;color:#1f1f1f}
.detail-section{margin-bottom:14px}
#_toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;background:#1f1f1f;color:#fff;border-radius:6px;font-size:14px;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}
.no-data td{text-align:center;color:#bbb;padding:40px 0}
</style>
</head>
<body>
<div class="page-container" data-module="sa-gov-user">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">超管端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">政府用户管理</span>
  </div>
  <div class="main-layout">
    <!-- 左侧：政府组织树 -->
    <div class="tree-panel">
      <div class="tree-panel-title">政府组织架构</div>
      <input class="tree-search" id="treeSearch" placeholder="搜索单位或科室..." oninput="filterTree()">
      <div id="orgTree"></div>
    </div>
    <!-- 右侧：四区 -->
    <div class="right-panel">
      <!-- 统计卡片 -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-card-label">用户总数</div><div class="stat-card-value" id="statTotal" style="color:#1677ff">42</div><div class="stat-card-sub">政府用户</div></div>
        <div class="stat-card"><div class="stat-card-label">启用中</div><div class="stat-card-value" id="statNormal" style="color:#52c41a">38</div><div class="stat-card-sub">已启用</div></div>
        <div class="stat-card"><div class="stat-card-label">停用中</div><div class="stat-card-value" id="statDisabled" style="color:#999">4</div><div class="stat-card-sub">已停用</div></div>
        <div class="stat-card"><div class="stat-card-label">领导层</div><div class="stat-card-value" id="statLeader" style="color:#fa8c16">0</div><div class="stat-card-sub">领导层用户</div></div>
      </div>
      <!-- 查询条件 -->
      <div class="query-bar">
        <div class="q-item"><label>姓名</label>
          <input id="filterName" placeholder="请输入姓名" style="width:140px">
        </div>
        <div class="q-item"><label>手机号</label>
          <input id="filterPhone" placeholder="请输入手机号" style="width:140px">
        </div>
        <div class="q-item"><label>状态</label>
          <select id="filterStatus"><option value="">全部</option><option>启用</option><option>停用</option></select>
        </div>
        <button class="btn btn-default" onclick="renderTable()">搜索</button>
        <button class="btn btn-default" onclick="document.getElementById('filterName').value='';document.getElementById('filterPhone').value='';document.getElementById('filterStatus').value='';renderTable()">重置</button>
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="openAddModal()">+ 新增用户</button>
      </div>
      <!-- 用户列表 -->
      <div class="table-card">
        <div class="table-container">
          <table>
            <thead><tr>
              <th>姓名</th><th>手机号</th><th>所属单位</th><th>所属科室</th>
              <th>职务</th><th>层级</th>
              <th>状态</th><th>操作</th>
            </tr></thead>
            <tbody id="userTableBody"><tr><td colspan="8" class="no-data">加载中...</td></tr></tbody>
          </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-wrap" id="paginationWrap">
          <span class="pagination-info">共 <span id="pgTotal">0</span> 条，第 <span id="pgCurrentPage">1</span> 页/共 <span id="pgTotalPages">1</span> 页</span>
          <div class="pagination-size">
            <select id="pgSize" onchange="changePageSize()">
              <option value="10">10条/页</option>
              <option value="20">20条/页</option>
              <option value="50">50条/页</option>
            </select>
          </div>
          <div class="pagination-btns" id="pgBtns"></div>
          <div class="pagination-jump">
            跳至 <input type="number" id="pgJump" min="1"> 页 <button class="btn btn-default" onclick="jumpToPage()">确定</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增用户</span>
      <div class="modal-close" onclick="closeModal('editModal')">&#x2715;</div>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <div class="form-section-title">基本信息</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>用户姓名</label><input class="form-control" id="fName" type="text" placeholder="请输入用户姓名"></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>手机号码</label><input class="form-control" id="fMobile" type="text" placeholder="请输入手机号码" oninput="syncAccountFromMobile()"></div>
          <div class="form-group"><label class="form-label">邮箱</label><input class="form-control" id="fEmail" type="email" placeholder="请输入邮箱（选填）"></div><!-- 扩展字段：PRD未要求，保留 -->
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>职务</label><input class="form-control" id="fTitle" type="text" placeholder="请输入职务"></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属单位</label>
            <select class="form-control" id="fOrg" onchange="onOrgChange()">
              <option value="">请选择所属单位</option>
              <option value="org1">区应急管理局</option>
              <option value="org2">区住建局</option>
              <option value="org3">区消防救援大队</option>
              <option value="org4">街道安监办</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属科室</label>
            <select class="form-control" id="fDept"><option value="">请先选择所属单位</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">管理部门</label><!-- 扩展字段：PRD未要求，保留 -->
            <div class="multi-select" id="fManageDeptsWrap">
              <div class="multi-select-input" onclick="toggleMultiDropdown()">
                <span class="multi-select-placeholder" id="fManageDeptsText">请先选择所属单位</span>
                <i class="multi-select-arrow"></i>
              </div>
              <div class="multi-select-dropdown" id="fManageDeptsDropdown">
                <div class="multi-select-actions">
                  <span onclick="selectAllManageDepts()"><i>&#x2713;</i>全选</span>
                  <span onclick="clearManageDepts()"><i>&#x2715;</i>清空</span>
                </div>
                <div class="multi-select-options" id="fManageDeptsOptions">
                  <div class="multi-select-option disabled">请先选择所属单位</div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>用户层级</label>
            <select class="form-control" id="fUserType">
              <option value="">请选择用户层级</option><option>领导层</option><option>监管层</option><option>巡查层</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">上级领导</label><!-- 扩展字段：PRD未要求，保留 -->
            <select class="form-control" id="fLeader"><option value="">请选择上级领导（选填）</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>角色类型</label><!-- 扩展字段：PRD未要求，保留 -->
            <select class="form-control" id="fRole">
              <option value="">请选择角色类型</option><option>单位管理员</option><option>普通用户</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>状态</label>
            <select class="form-control" id="fStatus">
              <option value="启用" selected>启用</option><option value="停用">停用</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1 0 100%"><label class="form-label">备注</label><!-- 扩展字段：PRD未要求，保留 --><textarea class="form-control" id="fRemark" placeholder="请输入备注（选填，200字以内）" style="min-height:60px;resize:vertical"></textarea></div>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">账号信息</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>账号（手机号）</label><input class="form-control" id="fAccount" type="text" placeholder="自动填充手机号" disabled style="background:#f5f5f5;cursor:not-allowed;"></div>
          <div class="form-group"><label class="form-label" id="pwdLabel"><span class="required">*</span>用户密码</label><input class="form-control" id="fPwd" type="password" placeholder="默认Abc@123456"></input></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-primary" onclick="saveUser()">确定</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">确认删除</span>
      <div class="modal-close" onclick="closeModal('deleteModal')">&#x2715;</div>
    </div>
    <div class="modal-body" style="padding:28px 24px;text-align:center">
      <div style="width:48px;height:48px;margin:0 auto 16px;background:#fff2f0;border-radius:50%;display:flex;align-items:center;justify-content:center">

// ==================== 渲染组织树 ====================
function _getChildDepts(pid){
  var nodes = [];
  govOrgData.orgs.forEach(function(org){
    if(pid === 'root'){
      nodes.push({id:org.id,name:org.name,type:'org',children:org.depts});
    }else{
      var d = org.depts.find(function(dd){return dd.id === pid;});
      if(d && d.children) d.children.forEach(function(c){nodes.push({id:c.id,name:c.name,type:'dept'});});
    }
  });
  return nodes;
}

function _updateStats(orgId){
  var filtered = orgId ? allUsers.filter(function(u){return u.orgId === orgId;}) : allUsers;
  document.getElementById('statTotal').textContent = filtered.length;
  document.getElementById('statNormal').textContent = filtered.filter(function(u){return u.status==='启用';}).length;
  document.getElementById('statDisabled').textContent = filtered.filter(function(u){return u.status==='停用';}).length;
  document.getElementById('statLeader').textContent = filtered.filter(function(u){return u.userType==='领导层';}).length;
}

function filterTree(){
  var kw = document.getElementById('treeSearch').value.trim().toLowerCase();
  document.querySelectorAll('#orgTree .tree-node').forEach(function(n){
    var name = n.textContent.toLowerCase();
    n.style.display = (!kw || name.includes(kw)) ? 'flex' : 'none';
  });
}

function renderOrgTree(){
  var tree = document.getElementById('orgTree');
  var nodes = _getChildDepts('root');
  tree.innerHTML = '<div class="tree-node' + (window._activeOrg ? '' : ' active') + '" onclick="selectOrg(null,this)" data-id=""><span class="toggle"></span><span>全部单位</span></div>' +
    nodes.map(function(n){
      var hasChildren = n.children && n.children.length > 0;
      return '<div class="tree-node' + (window._activeOrg === n.id ? ' active' : '') + '" id="tog_' + n.id + '" data-id="' + n.id + '" onclick="selectOrg(&#39;' + n.id + '&#39;,this)">' +
        '<span class="toggle' + (window._openNodes && window._openNodes[n.id] ? ' open' : '') + '" onclick="event.stopPropagation();toggleNode(&#39;' + n.id + '&#39;)">&#9654;</span><span>' + n.name + '</span></div>' +
        (hasChildren ? '<div class="tree-children' + (window._openNodes && window._openNodes[n.id] ? ' show' : '') + '" id="ch_' + n.id + '">' +
          n.children.map(function(c){
            return '<div class="tree-node' + (window._activeOrg === c.id ? ' active' : '') + '" onclick="selectOrg(&#39;' + c.id + '&#39;,this)" data-id="' + c.id + '"><span class="toggle"></span><span>' + c.name + '</span></div>';
          }).join('') + '</div>' : '');
    }).join('');
}

function toggleNode(id){
  if(!window._openNodes) window._openNodes = {};
  window._openNodes[id] = !window._openNodes[id];
  var tog = document.getElementById('tog_' + id);
  var ch = document.getElementById('ch_' + id);
  if(tog) tog.querySelector('.toggle').classList.toggle('open', window._openNodes[id]);
  if(ch) ch.classList.toggle('show', window._openNodes[id]);
}

function selectOrg(id, el){
  window._activeOrg = id || null;
  // 判断是单位ID还是科室ID
  window._activeOrgType = null;
  if(id){
    // 检查是否是科室ID（在orgs的depts中）
    govOrgData.orgs.forEach(function(org){
      if(org.depts){
        org.depts.forEach(function(dept){
          if(dept.id === id) window._activeOrgType = 'dept';
        });
      }
    });
    // 如果不是科室，则是单位
    if(!window._activeOrgType) window._activeOrgType = 'org';
  }
  _updateStats(id);
  renderTable();
  document.querySelectorAll('#orgTree .tree-node').forEach(function(n){n.classList.remove('active');});
  if(el) el.classList.add('active');
}

// ==================== 渲染用户列表 ====================
// ==================== 分页状态 ====================
var pgState = { page: 1, size: 10, total: 0 };

function renderTable(){
  var nameVal = document.getElementById('filterName').value.trim().toLowerCase();
  var phoneVal = document.getElementById('filterPhone').value.trim();
  var statusVal = document.getElementById('filterStatus').value;
  var activeId = window._activeOrg;
  var activeType = window._activeOrgType;
  var rows = allUsers.filter(function(u){
    if(activeId){
      if(activeType === 'dept'){
        if(u.deptId !== activeId) return false;
      }else{
        if(u.orgId !== activeId) return false;
      }
    }
    if(nameVal && !u.name.toLowerCase().includes(nameVal)) return false;
    if(phoneVal && u.mobile !== phoneVal) return false;
    if(statusVal && u.status !== statusVal) return false;
    return true;
  });
  pgState.total = rows.length;
  var start = (pgState.page - 1) * pgState.size;
  var pageRows = rows.slice(start, start + pgState.size);
  var tbody = document.getElementById('userTableBody');
  if(pageRows.length === 0){
    tbody.innerHTML = '<tr><td colspan="8" class="no-data">暂无数据</td></tr>';
    renderPagination(0);
    return;
  }
  tbody.innerHTML = pageRows.map(function(u, idx){
    var org = govOrgData.orgs.find(function(o){return o.id === u.orgId;});
    var dept = org ? org.depts.find(function(d){return d.id === u.deptId;}) : null;
    var statusLabel = u.status === '启用' ? '启用' : '停用';
    var statusCls = u.status === '启用' ? 'tag-success' : 'tag-error';
    return '<tr>' +
      '<td title="' + u.name + '">' + u.name + '</td>' +
      '<td title="' + u.mobile + '">' + (u.mobile||'—') + '</td>' +
      '<td title="' + (org?org.name:'') + '">' + (org?org.name:'') + '</td>' +
      '<td title="' + (dept?dept.name:'') + '">' + (dept?dept.name:'') + '</td>' +
      '<td title="' + u.title + '">' + (u.title||'') + '</td>' +
      '<td>' + (u.userType||'') + '</td>' +
      '<td><span class="tag ' + statusCls + '">' + statusLabel + '</span></td>' +
      '<td style="white-space:nowrap"><button class="btn btn-link" onclick="openEditModal(\'' + u.id + '\')">编辑</button> <button class="btn btn-link" onclick="deleteUser(\'' + u.id + '\')">删除</button> <button class="btn btn-link" onclick="viewDetail(\'' + u.id + '\')">详情</button> <button class="btn btn-link" onclick="resetPwd(\'' + u.id + '\')">重置密码</button></td>' +
      '</tr>';
  }).join('');
  renderPagination(Math.ceil(pgState.total / pgState.size));
}

function renderPagination(totalPages){
  document.getElementById('pgTotal').textContent = pgState.total;
  document.getElementById('pgCurrentPage').textContent = pgState.page;
  document.getElementById('pgTotalPages').textContent = totalPages || 1;
  var btns = document.getElementById('pgBtns');
  if(totalPages <= 1){ btns.innerHTML = ''; return; }
  var html = '';
  html += '<button onclick="goPage(' + (pgState.page - 1) + ')" ' + (pgState.page === 1 ? 'disabled' : '') + '>&lt;</button>';
  for(var i = 1; i <= totalPages; i++){
    if(i === 1 || i === totalPages || (i >= pgState.page - 2 && i <= pgState.page + 2)){
      html += '<button class="' + (i === pgState.page ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }else if(i === pgState.page - 3 || i === pgState.page + 3){
      html += '<span>...</span>';
    }
  }
  html += '<button onclick="goPage(' + (pgState.page + 1) + ')" ' + (pgState.page === totalPages ? 'disabled' : '') + '>&gt;</button>';
  btns.innerHTML = html;
  document.getElementById('pgJump').max = totalPages;
}

function goPage(p){
  var totalPages = Math.ceil(pgState.total / pgState.size);
  if(p < 1 || p > totalPages) return;
  pgState.page = p;
  renderTable();
}

function changePageSize(){
  pgState.size = parseInt(document.getElementById('pgSize').value);
  pgState.page = 1;
  renderTable();
}

function jumpToPage(){
  var p = parseInt(document.getElementById('pgJump').value);
  if(p) goPage(p);
}

    currentEditUser.roleType = document.getElementById('fRole').value;
    currentEditUser.status = document.getElementById('fStatus').value;
    currentEditUser.remark = document.getElementById('fRemark').value;
    showToast('用户信息已更新');
  }else{
    var newUser = {
      id: _uidGen(),
      name: name,
      account: document.getElementById('fAccount').value.trim() || document.getElementById('fMobile').value.trim() || 'u' + Date.now(),
      mobile: mobile,
      email: document.getElementById('fEmail').value.trim(),
      title: document.getElementById('fTitle').value.trim(),
      orgId: document.getElementById('fOrg').value,
      deptId: document.getElementById('fDept').value,
      manageDeptIds: getSelectedManageDepts(),
      userType: document.getElementById('fUserType').value,
      roleType: document.getElementById('fRole').value,
      status: document.getElementById('fStatus').value,
      remark: document.getElementById('fRemark').value,
      lastLogin: '—'
    };
    allUsers.unshift(newUser);
    showToast('用户新增成功');
  }
  closeModal('editModal');
  renderTable();
  _updateStats(window._activeOrg);
}

// ==================== 管理部门多选下拉 ====================
function toggleMultiDropdown(){
  var wrap = document.getElementById('fManageDeptsWrap');
  var drop = document.getElementById('fManageDeptsDropdown');
  var input = wrap.querySelector('.multi-select-input');
  var isOpen = drop.classList.contains('show');
  if(isOpen){
    drop.classList.remove('show');
    input.classList.remove('active');
    document.removeEventListener('click', closeMultiOnClickOutside);
  }else{
    drop.classList.add('show');
    input.classList.add('active');
    setTimeout(function(){document.addEventListener('click', closeMultiOnClickOutside);},0);
  }
}
function closeMultiOnClickOutside(e){
  var wrap = document.getElementById('fManageDeptsWrap');
  if(!wrap) return;
  if(!wrap.contains(e.target)){
    var drop = document.getElementById('fManageDeptsDropdown');
    var input = wrap.querySelector('.multi-select-input');
    drop.classList.remove('show');
    input.classList.remove('active');
    document.removeEventListener('click', closeMultiOnClickOutside);
  }
}
function updateManageDeptsDisplay(){
  var opts = document.querySelectorAll('#fManageDeptsOptions .multi-select-option.selected');
  var textEl = document.getElementById('fManageDeptsText');
  if(opts.length === 0){
    textEl.textContent = '请选择管理部门';
    textEl.className = 'multi-select-placeholder';
  }else if(opts.length <= 2){
    textEl.textContent = Array.from(opts).map(function(o){return o.dataset.label;}).join('、');
    textEl.className = 'multi-select-value';
  }else{
    textEl.textContent = '已选择 ' + opts.length + ' 项';
    textEl.className = 'multi-select-value';
  }
}
function renderManageDeptsOptions(depts){
  var container = document.getElementById('fManageDeptsOptions');
  if(!depts || depts.length === 0){
    container.innerHTML = '<div class="multi-select-option disabled">请先选择所属单位</div>';
    return;
  }
  container.innerHTML = depts.map(function(d){
    return '<div class="multi-select-option" data-value="' + d.id + '" data-label="' + d.name + '" onclick="toggleManageDept(this)"><span class="cb"></span><span>' + d.name + '</span></div>';
  }).join('');
  updateManageDeptsDisplay();
}
function toggleManageDept(el){
  if(el.classList.contains('disabled')) return;
  el.classList.toggle('selected');
  updateManageDeptsDisplay();
}
function selectAllManageDepts(){
  var opts = document.querySelectorAll('#fManageDeptsOptions .multi-select-option:not(.disabled)');
  var allSelected = Array.from(opts).every(function(o){return o.classList.contains('selected');});
  opts.forEach(function(o){o.classList.toggle('selected', !allSelected);});
  updateManageDeptsDisplay();
}
function clearManageDepts(){
  document.querySelectorAll('#fManageDeptsOptions .multi-select-option.selected').forEach(function(o){o.classList.remove('selected');});
  updateManageDeptsDisplay();
}
function getSelectedManageDepts(){
  return Array.from(document.querySelectorAll('#fManageDeptsOptions .multi-select-option.selected')).map(function(o){return o.dataset.value;});
}

// ==================== 删除确认 ====================
var _pendingDeleteId = null;
function deleteUser(id){
  _pendingDeleteId = id;
  var u = allUsers.find(function(x){return x.id === id;});
  document.getElementById('deleteMsg').textContent = '确定要删除用户「' + (u ? u.name : '') + '」吗？';
  document.getElementById('deleteModal').classList.add('show');
}
function confirmDelete(){
  var id = _pendingDeleteId;
  _pendingDeleteId = null;
  if(!id) return;
  allUsers = allUsers.filter(function(u){return u.id !== id;});
  closeModal('deleteModal');
  renderTable();
  _updateStats(window._activeOrg);
  showToast('用户已删除');
}

// ==================== 用户详情 ====================
function viewDetail(id){
  var u = allUsers.find(function(x){return x.id === id;});
  if(!u) return;
  var org = govOrgData.orgs.find(function(o){return o.id === u.orgId;});
  var dept = org ? org.depts.find(function(d){return d.id === u.deptId;}) : null;
  var manageDepts = [];
  if(org && u.manageDeptIds){
    manageDepts = org.depts.filter(function(d){return u.manageDeptIds.indexOf(d.id) > -1;}).map(function(d){return d.name;});
  }
  var statusCls = u.status === '启用' ? 'tag-success' : 'tag-error';
  var html = '<div class="detail-section">';
  html += '<div class="detail-section-title">基本信息</div>';
  html += '<div class="detail-row"><div class="detail-label">用户姓名</div><div class="detail-value">' + u.name + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">手机号码</div><div class="detail-value">' + u.mobile + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">邮箱</div><div class="detail-value">' + (u.email||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">职务</div><div class="detail-value">' + (u.title||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">所属单位</div><div class="detail-value">' + (org?org.name:'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">所属科室</div><div class="detail-value">' + (dept?dept.name:'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">管理部门</div><div class="detail-value">' + (manageDepts.length?manageDepts.join('、'):'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">用户层级</div><div class="detail-value">' + (u.userType||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">角色类型</div><div class="detail-value">' + (u.roleType||'—') + '</div></div>';
  html += '<div class="detail-row"><div class="detail-label">状态</div><div class="detail-value"><span class="tag ' + statusCls + '">' + u.status + '</span></div></div>';
  html += '</div>';
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">账号信息</div>';
  html += '<div class="detail-row"><div class="detail-label">账号</div><div class="detail-value">' + u.account + '</div></div>';
  html += '</div>';
  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}

// ==================== Toast ====================
function showToast(msg){
  var t = document.getElementById('_toast');
  if(!t){ t = document.createElement('div'); t.id = '_toast'; document.body.appendChild(t); }
  Object.assign(t.style, {position:'fixed',top:'20px',left:'50%',transform:'translateX(-50%)',padding:'10px 24px',background:'#1f1f1f',color:'#fff',borderRadius:'6px',fontSize:'14px',zIndex:99999,opacity:0,transition:'opacity .3s'});
  t.textContent = msg;
  setTimeout(function(){ t.style.opacity = 1; }, 10);
  setTimeout(function(){ t.style.opacity = 0; }, 2000);
}
