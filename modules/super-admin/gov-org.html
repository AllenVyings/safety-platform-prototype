<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组织架构管理 - 超管端</title>
  
    <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; }
    .page-container[data-module="super-admin/gov-org"] { height: 100vh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
    .page-container[data-module="super-admin/gov-org"] .stats-row { grid-template-columns: repeat(3, 1fr); }

    /* 统计卡片 - .stats-row, .stat-card, .stat-card-body, .stat-label, .stat-value, .stat-indicator 由 framework.css 提供 */
    
    /* 分屏视图 */
    .split-view { display: flex; gap: 20px; flex: 1; min-height: 0; overflow: hidden; }
    
    /* 左侧树形面板 */
    .tree-panel { 
      width: 320px; 
      flex-shrink: 0; 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }
    .tree-header { padding: var(--spacing-md); border-bottom: 1px solid var(--border-section); display: flex; flex-direction: column; gap: var(--spacing-sm); align-items: stretch; background: var(--bg-section); }
    .tree-title { font-size: var(--font-size-md); font-weight: 600; color: var(--text-primary); }
    .tree-search { width: 100%; padding: var(--spacing-sm) 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--font-size-sm); background: var(--bg-primary); }
    .tree-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
    .tree-toolbar { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--spacing-sm); align-items: center; }
    .tree-toolbar .btn { flex: 0 0 auto; }
    .tree-body { flex: 1; overflow-y: auto; padding: var(--spacing-sm) 0; }
    
    /* 右侧详情面板 */
    .detail-panel { 
      flex: 1; 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }
    .detail-header { padding: var(--spacing-md) 20px; border-bottom: 1px solid var(--border-section); display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); background: var(--bg-section); }
    .detail-heading { min-width: 0; }
    .detail-title { display: block; font-size: var(--font-size-lg); font-weight: 600; }
    .detail-path { margin-top: 4px; font-size: var(--font-size-xs); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-body { flex: 1; overflow-y: auto; padding: 20px; }
    
    /* 树节点样式 */
    .tree-node { display: flex; align-items: center; padding: 8px 12px 8px calc(12px + var(--level, 0) * 20px); cursor: pointer; transition: all var(--duration-fast); user-select: none; min-width: 0; }
    .tree-node:hover { background: var(--bg-secondary); }
    .tree-node.active { background: var(--primary-light); }
    .tree-toggle { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; margin-right: 4px; cursor: pointer; transition: transform var(--duration-fast); flex-shrink: 0; border-radius: 3px; color: var(--text-tertiary); font-size: 9px; line-height: 1; }
    .tree-toggle:hover { background: var(--bg-hover); }
    .tree-toggle.expanded { transform: rotate(90deg); }
    .tree-toggle.leaf { visibility: hidden; pointer-events: none; }
    .tree-node-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; margin-right: var(--spacing-sm); font-size: var(--font-size-md); flex-shrink: 0; }
    .tree-node-label { flex: 1; font-size: var(--font-size-sm); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .tree-node-status { width: 8px; height: 8px; border-radius: 50%; margin-left: var(--spacing-sm); flex-shrink: 0; }
    .tree-node-status.enabled { background: var(--success); }
    .tree-node-status.disabled { background: var(--text3); }

    .tree-children { display: none; }
    .tree-children.show { display: block; }
    
    /* 详情区域信息板块 */
    .info-section { margin-bottom: var(--spacing-lg); background: var(--bg-section); border-radius: var(--radius-lg); padding: var(--spacing-md); border: 1px solid var(--border-section); }
    .info-section-title { font-size: var(--font-size-md); font-weight: 600; color: var(--text); margin-bottom: 12px; padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--border-section); }
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); }
    .info-item { display: flex; flex-direction: column; gap: var(--spacing-xs); }
    .info-item.full { grid-column: span 2; }
    .info-label { font-size: var(--font-size-xs); color: var(--text-secondary); }
    .info-value { font-size: var(--font-size-md); color: var(--text); }
    
    /* 账号信息卡片 */
    .account-card { background: var(--bg-primary); border: 1px solid var(--border-section); border-radius: var(--radius-lg); padding: var(--spacing-md); margin-top: 12px; }
    .account-card-title { font-size: var(--font-size-sm); font-weight: 600; margin-bottom: 12px; }
    .account-info { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-md); }
    .account-detail { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-lg); min-width: 0; }
    .account-field { display: inline-flex; align-items: center; gap: var(--spacing-xs); white-space: nowrap; }
    .account-status-switch { position: relative; gap: 0; }
    .account-status-switch .switch-track { width: 64px; }
    .form-switch.account-status-switch input:checked + .switch-track::after { transform: translateX(42px); }
    .account-status-switch .switch-text { position: absolute; top: 0; left: 22px; z-index: 1; width: 36px; text-align: center; color: #fff; font-size: var(--font-size-xs); line-height: 22px; pointer-events: none; }
    .account-status-switch input:checked ~ .switch-text { left: 4px; }
    .account-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--spacing-sm); }

    /* 操作栏 */
    .action-bar { display: flex; gap: 12px; }

    /* 空状态 */
    .empty-detail { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* 表格容器滚动 */
    .table-scroll { overflow-x: auto; }
    .table-scroll table { min-width: 1000px; }

    /* 操作列固定 */
    .action-col { white-space: nowrap; }

    /* 字段列省略 */
    .ellipsis-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .modal-dialog { background: var(--bg-primary); border-radius: var(--radius-lg); width: 520px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); }
    .modal-header { padding: var(--spacing-md) 20px; border-bottom: 1px solid var(--border-section); display: flex; justify-content: space-between; align-items: center; background: var(--bg-section); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .modal-title { font-size: var(--font-size-lg); font-weight: 600; }
    .modal-close { width: 32px; height: 32px; border: none; background: none; font-size: var(--font-size-xxl); cursor: pointer; color: var(--text3); border-radius: var(--radius-sm); transition: all var(--duration-normal); }
    .modal-close:hover { background: var(--border-light); color: var(--text); }
    .modal-body { padding: 20px; background: var(--bg-primary); }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border-section); display: flex; justify-content: flex-end; gap: 12px; background: var(--bg-section); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    
    /* 表单样式 */
    .form-group { margin-bottom: var(--spacing-md); }
    .form-group:last-child { margin-bottom: 0; }
    .form-row { display: flex; gap: var(--spacing-md); }
    .form-row .form-group { flex: 1; }
    .form-label { display: block; font-size: var(--font-size-sm); color: var(--text); margin-bottom: 6px; }
    .form-label .required { color: var(--danger); margin-left: 2px; }
    .form-input, .form-select { width: 100%; padding: var(--spacing-sm) 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--font-size-sm); background: var(--bg-primary); transition: all var(--duration-normal); }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
    .form-input:disabled, .form-select:disabled { background: #f1f3f5; border-color: #d9d9d9; color: #8c8c8c; cursor: not-allowed; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03); opacity: 1; }
    .form-checkbox { display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer; }
    .form-checkbox input { width: 16px; height: 16px; }
    .form-switch { display: inline-flex; align-items: center; gap: var(--spacing-sm); cursor: pointer; }
    .form-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-track { width: 40px; height: 22px; border-radius: 999px; background: var(--border); position: relative; transition: background var(--duration-normal); }
    .switch-track::after { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform var(--duration-normal); }
    .form-switch input:checked + .switch-track { background: var(--primary); }
    .form-switch input:checked + .switch-track::after { transform: translateX(18px); }
    .switch-text { font-size: var(--font-size-sm); color: var(--text); }
    .form-hint { font-size: var(--font-size-xs); color: var(--text3); margin-top: var(--spacing-xs); }
    
    /* 标签样式 */
    .tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 500; }
    .tag-green { background: var(--success-light); color: var(--success); }
    .tag-gray { background: var(--bg-section); color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="page-container" data-module="super-admin/gov-org">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">超管端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">组织架构管理</span>
    </div>
    
    <div class="split-view">
      <!-- 左侧树形面板 -->
      <div class="tree-panel">
        <div class="tree-header">
          <span class="tree-title">组织架构树</span>
          <input type="search" class="tree-search" id="treeSearch" placeholder="搜索区划、单位、科室" oninput="handleTreeSearch()">
          <div class="tree-toolbar">
            <button class="btn btn-link" onclick="expandAll()">展开全部</button>
            <button class="btn btn-link" onclick="collapseAll()">收起全部</button>
          </div>
        </div>
        <div class="tree-body" id="orgTree"></div>
      </div>
      
      <!-- 右侧详情面板 -->
      <div class="detail-panel">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">单位总数</div>
              <div class="stat-value" id="unitCount">0</div>
            </div>
            <div class="stat-indicator" style="background: var(--primary);"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">科室总数</div>
              <div class="stat-value" id="deptCount">0</div>
            </div>
            <div class="stat-indicator" style="background: var(--success);"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">超管账号数</div>
              <div class="stat-value" id="accountCount">0</div>
            </div>
            <div class="stat-indicator" style="background: var(--warning);"></div>
          </div>
        </div>
        <div class="detail-header">
          <div class="detail-heading">
            <span class="detail-title" id="detailTitle">详情信息</span>
            <div class="detail-path" id="detailPath">请在左侧选择组织节点</div>
          </div>
          <div class="action-bar" id="detailActions" style="display: none;">
            <button class="btn-link" data-action="edit" onclick="showEditModal()">编辑</button>
            <button class="btn-link" data-action="delete" onclick="deleteNode()">删除</button>
            <button class="btn-link" data-action="add-child" onclick="showAddChildModal()">新增</button>
          </div>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </div>
  </div>
  
  <!-- 新增/编辑弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">新增</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <form id="orgForm">
          <div class="form-row">
            <div class="form-group" id="formDistrictGroup">
              <label class="form-label">所属区划<span class="required">*</span></label>
              <select class="form-select" id="formDistrict">
                <option value="">请选择所属区划</option>
                <option value="NS">南山区</option>
              </select>
            </div>
            <div class="form-group" id="formBelongUnitGroup" style="display: none;">
              <label class="form-label" id="formBelongUnitLabel">所属单位<span class="required">*</span></label>
              <select class="form-select" id="formBelongUnit">
                <option value="">请选择所属单位</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">组织类型<span class="required">*</span></label>
              <select class="form-select" id="formType" onchange="onTypeChange()">
                <option value="unit">单位</option>
                <option value="dept">科室</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">名称<span class="required">*</span></label>
              <input type="text" class="form-input" id="formName" placeholder="请输入名称">
            </div>
            <div class="form-group">
              <label class="form-label">负责人</label>
              <input type="text" class="form-input" id="formResponsiblePerson" placeholder="请输入负责人">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">联系电话</label>
              <input type="tel" class="form-input" id="formContactPhone" placeholder="请输入联系电话">
            </div>
            <div class="form-group">
              <label class="form-label">邮箱</label>
              <input type="email" class="form-input" id="formEmail" placeholder="请输入邮箱">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">排序<span class="required">*</span></label>
              <input type="number" class="form-input" id="formSort" value="1" min="1">
            </div>
            <div class="form-group">
              <label class="form-label">状态<span class="required">*</span></label>
              <label class="form-switch">
                <input type="checkbox" id="formStatus" onchange="updateStatusSwitchText()" checked>
                <span class="switch-track"></span>
                <span class="switch-text" id="formStatusText">启用</span>
              </label>
            </div>
          </div>
          <input type="hidden" id="formParent">
          <div class="form-hint" id="parentHint" style="display: none;">单位可挂在区或单位下；科室只能挂在单位下</div>
          <div class="form-group" id="formUnitTypeGroup">
            <label class="form-label">单位类型<span class="required">*</span></label>
            <select class="form-select" id="formUnitType">
              <option value="委办局">委办局</option>
              <option value="街道办">街道办</option>
              <option value="督导组">督导组</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <!-- 单位特有：生成账号选项 -->
          <div class="form-group" id="accountOption" style="background: var(--bg-secondary); padding: 12px; border-radius: var(--radius-md);">
            <label class="form-checkbox">
              <input type="checkbox" id="formCreateAccount" checked>
              <span>生成该单位超管账号</span>
            </label>
            <div class="form-hint">勾选后将自动生成该单位的超管账号，账号密码将通过短信发送给联系人</div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveForm()">保存</button>
      </div>
    </div>
  </div>

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch];
      });
    }

    function renderTree() {
      const keyword = document.getElementById('treeSearch') ? document.getElementById('treeSearch').value.trim() : '';
      const treeContainer = document.getElementById('orgTree');
      const visibleData = keyword ? filterTree(orgData, keyword) : orgData;
      treeContainer.innerHTML = visibleData.length ? renderNodes(visibleData, 0, Boolean(keyword)) : '<div style="padding:20px;text-align:center;color:var(--text-tertiary);">未找到匹配组织</div>';
      bindTreeEvents();
      if (keyword) expandAll();
      updateStats();
    }

    function renderNodes(nodes, level, expandByDefault) {
      let html = '';
      nodes.forEach(node => {
        const hasChildren = node.children && node.children.length > 0;
        const icon = getNodeIcon(node.type);
        const statusClass = node.status === 'enabled' ? 'enabled' : 'disabled';
        const isActive = selectedNode && selectedNode.id === node.id ? 'active' : '';
        const expandedClass = expandByDefault && hasChildren ? 'expanded' : '';
        const showClass = expandByDefault ? 'show' : '';

        html += `
          <div class="tree-node ${isActive}" data-id="${node.id}" style="--level:${level}">
            <span class="tree-toggle ${hasChildren ? expandedClass : 'leaf'}" data-id="${node.id}">▶</span>
            <span class="tree-node-icon">${icon}</span>
            <span class="tree-node-label">${escapeHtml(node.name)}</span>
            <span class="tree-node-status ${statusClass}"></span>
          </div>
        `;

        if (hasChildren) {
          html += `<div class="tree-children ${showClass}" data-parent="${node.id}">${renderNodes(node.children, level + 1, expandByDefault)}</div>`;
        }
      });
      return html;
    }

    function filterTree(nodes, keyword) {
      const lowerKeyword = keyword.toLowerCase();
      return nodes.reduce(function(result, node) {
        const children = node.children ? filterTree(node.children, keyword) : [];
        const matched = node.name.toLowerCase().includes(lowerKeyword);
        if (matched || children.length) {
          result.push(Object.assign({}, node, { children: children }));
        }
        return result;
      }, []);
    }

      renderTree();

    function getNodeIcon(type) {
      const icons = {
        'district': '🏛️',

      return icons[type] || '📁';
    }
    
    function bindTreeEvents() {
      // 点击节点选中
      document.querySelectorAll('.tree-node').forEach(node => {
        node.addEventListener('click', function(e) {
          if (!e.target.classList.contains('tree-toggle')) {
            selectNode(this.dataset.id);
          }
        });
      });
      
      // 点击展开/收起
      document.querySelectorAll('.tree-toggle:not(.leaf)').forEach(toggle => {
        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleNode(this.dataset.id);
        });
      });
    }
    
    function toggleNode(nodeId) {
      const toggle = document.querySelector(`.tree-toggle[data-id="${nodeId}"]`);
      const children = document.querySelector(`.tree-children[data-parent="${nodeId}"]`);
      
      if (toggle && children) {
        toggle.classList.toggle('expanded');
        children.classList.toggle('show');
      }
    }
    
    function selectNode(nodeId) {
      document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
      const nodeEl = document.querySelector(`.tree-node[data-id="${nodeId}"]`);
      if (nodeEl) nodeEl.classList.add('active');
      
      selectedNode = findNode(orgData, nodeId);
      renderDetail();
    }
    
    function findNode(nodes, id) {
      for (const node of nodes) {
        if (node.id === id) return node;
        if (node.children) {
          const found = findNode(node.children, id);
          if (found) return found;
        }
      }
      return null;
    }
    
    function findParentNode(nodes, id, parent = null) {
      for (const node of nodes) {
        if (node.id === id) return parent;
        if (node.children) {
          const found = findParentNode(node.children, id, node);
          if (found !== undefined) return found;
        }
      }
      return undefined;
    }

    function getNodePath(nodeId) {
      const path = [];
      function walk(nodes) {
        for (const node of nodes) {
          path.push(node.name);
          if (node.id === nodeId) return true;
          if (node.children && walk(node.children)) return true;
          path.pop();
        }
        return false;
      }
      walk(orgData);
      return path;
    }

    function expandPathToNode(nodeId) {
      const ids = [nodeId];
      let parent = findParentNode(orgData, nodeId);
      while (parent) {
        ids.push(parent.id);
        parent = findParentNode(orgData, parent.id);
      }
      ids.forEach(function(id) {
        const toggle = document.querySelector(`.tree-toggle[data-id="${id}"]`);
        const children = document.querySelector(`.tree-children[data-parent="${id}"]`);
        if (toggle) toggle.classList.add('expanded');
        if (children) children.classList.add('show');
      });
    }

    function getNodeDistrictId(node) {
      let current = node;
      while (current) {
        if (current.type === 'district') return current.id;
        current = findParentNode(orgData, current.id);
      }
      return '';
    }

    function getDeptLevel(node) {
      if (!node || node.type !== 'dept') return '-';
      let level = 1;
      let parent = findParentNode(orgData, node.id);
      while (parent && parent.type === 'dept') {
        level += 1;
        parent = findParentNode(orgData, parent.id);
      }
      return level;
    }

    function canAddChild(node) {
      if (!node) return false;
      if (node.type === 'district' || node.type === 'unit') return true;
      return node.type === 'dept' && getDeptLevel(node) < 3;
    }

    function countNodes(nodes) {
      return nodes.reduce(function(acc, node) {
        const childStats = node.children ? countNodes(node.children) : { units: 0, depts: 0, accounts: 0 };
        return {
          units: acc.units + childStats.units + (node.type === 'unit' ? 1 : 0),
          depts: acc.depts + childStats.depts + (node.type === 'dept' ? 1 : 0),
          accounts: acc.accounts + childStats.accounts + (node.type === 'unit' && node.account ? 1 : 0)
        };
      }, { units: 0, depts: 0, accounts: 0 });
    }

    function updateStats(scopeNode = selectedNode) {
      const stats = scopeNode ? countNodes([scopeNode]) : countNodes(orgData);
      document.getElementById('unitCount').textContent = stats.units;
      document.getElementById('deptCount').textContent = stats.depts;
      document.getElementById('accountCount').textContent = stats.accounts;
    }

    function buildParentOptions(excludeId = null) {
      const type = document.getElementById('formType') ? document.getElementById('formType').value : 'unit';
      let options = '<option value="">无（作为根节点）</option>';

      function addOptions(nodes, level = 0) {
        nodes.forEach(node => {
          const canUseAsParent = type === 'unit'
            ? (node.type === 'district' || node.type === 'unit')
            : (node.type === 'unit' || (node.type === 'dept' && getDeptLevel(node) < 3));
          if (node.id !== excludeId && !isNodeInSubtree(findNode(orgData, excludeId), node.id) && canUseAsParent) {
            const prefix = '　'.repeat(level);
            const typeLabel = node.type === 'district' ? '[区]' : node.type === 'unit' ? '[单位]' : '[科室]';
            options += `<option value="${node.id}">${prefix}${typeLabel} ${escapeHtml(node.name)}</option>`;
          }
          if (node.children && node.children.length > 0) {
            addOptions(node.children, level + 1);
          }
        });
      }

      addOptions(orgData);
      return options;
    }

    function findBelongUnit(node) {
      let current = node;
      while (current) {
        const parent = findParentNode(orgData, current.id);
        if (parent && parent.type === 'unit') return parent;
        current = parent;
      }
      return null;
    }

      unitTypeGroup.style.display = type === 'unit' ? '' : 'none';

      // 只有新增单位类型才显示生成账号选项
      accountOption.style.display = !isEditing && type === 'unit' ? 'block' : 'none';

      if (belongUnitLabel) {
        belongUnitLabel.innerHTML = !isEditing && (addFromNodeType === 'unit' || addFromNodeType === 'dept')
          ? '上级组织<span class="required">*</span>'
          : '所属单位<span class="required">*</span>';
      }

      if (belongUnitGroup) {
        belongUnitGroup.style.display = type === 'dept' || isAddFromOrgNode ? '' : 'none';
        if (type === 'dept' || isAddFromOrgNode) {
          populateBelongUnits();
        }
      }

      if (type === 'unit') {
        parentHint.textContent = '单位可挂在区划、上级单位或科室下';
      } else {
        parentHint.textContent = '科室可挂在单位或 1-2 级科室下，最多 3 级';
      }
    }

    function populateBelongUnits() {
      const select = document.getElementById('formBelongUnit');
      if (!select) return;
      select.innerHTML = '<option value="">请选择上级组织</option>';

      function appendOption(node, level) {
        const prefix = '　'.repeat(level);
        const typeLabel = node.type === 'unit' ? '[单位]' : '[科室]';
        const opt = document.createElement('option');
        opt.value = node.id;
        opt.textContent = prefix + typeLabel + ' ' + node.name;
        select.appendChild(opt);
      }

      function collectDeptOptions(node, level) {
        const type = document.getElementById('formType').value;
        if (!node.children) return;
        node.children.forEach(function(child) {
          if (child.type === 'dept') {
            if (type !== 'dept' || getDeptLevel(child) < 3) {
              appendOption(child, level);
            }
            collectDeptOptions(child, level + 1);
          }
        });
      }

      if (!isEditing && selectedNode && (addFromNodeType === 'unit' || addFromNodeType === 'dept')) {
        const unit = selectedNode.type === 'unit' ? selectedNode : findBelongUnit(selectedNode);
        if (unit) {
          appendOption(unit, 0);
          collectDeptOptions(unit, 1);
        }
        return;
      }

      function collectUnits(nodes, level) {
        nodes.forEach(function(n) {
          if (n.type === 'unit') appendOption(n, level);
          if (n.children && n.children.length > 0) {
            collectUnits(n.children, n.type === 'unit' ? level + 1 : level);
          }
        });
      }
      collectUnits(orgData, 0);
    }
    
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      resetModalState();
    }
    
    function saveForm() {
      const type = document.getElementById('formType').value;
      const name = document.getElementById('formName').value.trim();
      const responsiblePerson = document.getElementById('formResponsiblePerson').value.trim();
      const contactPhone = document.getElementById('formContactPhone').value.trim();
      const email = document.getElementById('formEmail').value.trim();
      const hiddenParentId = document.getElementById('formParent').value;
      const belongUnitGroup = document.getElementById('formBelongUnitGroup');
      const selectedUnitId = belongUnitGroup.style.display === 'none' ? '' : document.getElementById('formBelongUnit').value;
      const selectedDistrictId = document.getElementById('formDistrict').value;
      const parentId = isEditing
        ? hiddenParentId
        : (selectedUnitId || hiddenParentId || selectedDistrictId);
      const status = document.getElementById('formStatus').checked ? 'enabled' : 'disabled';
      const sort = parseInt(document.getElementById('formSort').value) || 1;
      const unitType = type === 'unit' ? document.getElementById('formUnitType').value : '';
      const createAccount = document.getElementById('formCreateAccount').checked;

      if (!name) {
        showToast('请输入名称', 'warning');
        return;
      }

      const parentNode = parentId ? findNode(orgData, parentId) : null;
      if (type === 'unit' && (!parentNode || (parentNode.type !== 'district' && parentNode.type !== 'unit' && parentNode.type !== 'dept'))) {
        showToast('单位必须挂在区划、上级单位或科室下', 'warning');
        return;
      }
      if (type === 'dept' && (!parentNode || (parentNode.type !== 'unit' && parentNode.type !== 'dept'))) {
        showToast('科室必须挂在单位或上级科室下', 'warning');
        return;
      }
      if (type === 'dept' && parentNode && parentNode.type === 'dept' && getDeptLevel(parentNode) >= 3) {
        showToast('科室层级最多 3 级', 'warning');
        return;
      }
      if (isEditing && parentId !== (selectedNode.parentId || '')) {
        showToast('本页面不支持调整组织层级', 'warning');
        return;
      }
      if (hasSiblingName(parentNode ? parentNode.children : orgData, name, isEditing ? selectedNode.id : null)) {
        showToast('同级组织名称已存在', 'warning');
        return;
      }

      if (isEditing && selectedNode) {
        selectedNode.name = name;
        selectedNode.responsiblePerson = responsiblePerson;
        selectedNode.contactPhone = contactPhone;
        selectedNode.email = email;
        selectedNode.unitType = unitType;
        selectedNode.status = status;
        selectedNode.sort = sort;
        showToast('编辑成功', 'success');
      } else {
        const id = (parentId || 'ROOT') + '-' + Date.now().toString().slice(-5);
        const newNode = {
          id: id,
          name: name,
          type: type,
          responsiblePerson: responsiblePerson,
          contactPhone: contactPhone,
          email: email,
          unitType: unitType,
          status: status,
          sort: sort,
          parentId: parentId || null,
          sourceType: 'manual',
          extensionFields: '平台手工维护',
          account: type === 'unit' && createAccount ? {
            username: id.toLowerCase().replace(/-/g, '') + '-admin',
            status: 'enabled',
            lastLogin: '从未登录',
            contact: '待维护',
            mobile: ''
          } : null,
          children: []
        };
        if (parentNode) {
          parentNode.children = parentNode.children || [];
          parentNode.children.push(newNode);
        } else {
          orgData.push(newNode);
        }
        selectedNode = newNode;
        showToast(type === 'unit' && createAccount ? '新增成功，已生成单位超管账号' : '新增成功', 'success');
      }

      closeModal();
      renderTree();
      renderDetail();
    }

    function hasSiblingName(nodes, name, excludeId) {
      return (nodes || []).some(function(node) {
        return node.id !== excludeId && node.name === name;
      });
    }

    function isNodeInSubtree(root, nodeId) {
      if (!root || !root.children) return false;
      return root.children.some(function(child) {
        return child.id === nodeId || isNodeInSubtree(child, nodeId);
      });
    }
    
    function deleteNode() {
      if (!selectedNode) return;

      if (selectedNode.children && selectedNode.children.length > 0) {
        showToast('该组织下有子组织，请先处理子组织', 'warning');
        return;
      }
      if (selectedNode.userCount && selectedNode.userCount > 0) {
        showToast('该组织下有用户，请先移除用户', 'warning');
        return;
      }
      if (selectedNode.businessRefs && selectedNode.businessRefs > 0) {
        showToast('该组织存在业务引用，建议停用后保留历史数据', 'warning');
        return;
      }
      if (selectedNode.type === 'unit' && selectedNode.account) {
        showToast('该单位已生成超管账号，不允许删除，请停用组织节点', 'warning');
        return;
      }

      if (confirm(`确定要删除"${selectedNode.name}"吗？`)) {
        removeNode(orgData, selectedNode.id);
        selectedNode = null;
        renderTree();
        renderDetail();
        showToast('删除成功', 'success');
      }
    }

    function removeNode(nodes, id) {
      const index = nodes.findIndex(function(node) { return node.id === id; });
      if (index >= 0) {
        nodes.splice(index, 1);
        return true;
      }
      return nodes.some(function(node) {
        return node.children && removeNode(node.children, id);
      });
    }

    function generateAccount() {
      if (!selectedNode || selectedNode.type !== 'unit') return;
      if (selectedNode.account) {
        showToast('该单位已生成超管账号', 'warning');
        return;
      }
      const username = selectedNode.id.toLowerCase().replace(/-/g, '') + '-admin';
      selectedNode.account = {
        username: username,
        status: 'enabled',
        lastLogin: '从未登录',
        contact: '待维护',
        mobile: ''
      };
      renderDetail();
      updateStats();
      showToast('账号生成成功！账号：' + username + '，密码将通过短信发送给联系人', 'success');
    }


    function resetPassword() {
      if (!selectedNode || !selectedNode.account) return;
      showToast('密码已重置，请通过安全渠道通知用户', 'success');
    }

    function toggleAccountStatus() {
      if (!selectedNode || !selectedNode.account) return;
      selectedNode.account.status = selectedNode.account.status === 'enabled' ? 'disabled' : 'enabled';
      renderDetail();
      showToast('账号已' + (selectedNode.account.status === 'enabled' ? '启用' : '停用'), 'success');
    }

    function showToast(msg, type) {
      type = type || 'info';
      var container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:10000;';
        document.body.appendChild(container);
      }
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.style.cssText = 'padding:10px 20px;margin-bottom: var(--spacing-sm);border-radius: var(--radius-sm);background:var(--primary);color:var(--bg-primary);font-size: var(--font-size-md);animation:fadeIn 0.3s;';
      if (type === 'success') toast.style.background = 'var(--success)';
      if (type === 'warning') toast.style.background = 'var(--warning)';
      if (type === 'error') toast.style.background = 'var(--danger)';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);
    }

    // 初始化
    renderTree();
    setTimeout(() => {
      expandPathToNode('NS');
      selectNode('NS');
    }, 100);
  </script>
