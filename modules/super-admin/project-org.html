<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目组织架构 - 超管端</title>

<style>
.breadcrumb-item:hover{color:var(--primary)}
.main-layout{display:flex;gap: var(--spacing-md);margin-top: var(--spacing-md)}

/* 左侧树 */
.tree-panel{width:280px;background:var(--bg-primary);border-radius: var(--radius-lg);box-shadow: var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden}
.tree-header{padding: 14px var(--spacing-md);border-bottom:1px solid var(--border-light);font-size: var(--font-size-md);font-weight:600;color:var(--text-primary)}
.tree-search{padding:10px 14px;border-bottom:1px solid var(--border-light)}
.tree-search input{width:100%;padding:7px 12px;border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);outline:none}
.tree-search input:focus{border-color:var(--primary)}
.tree-body{flex:1;overflow-y:auto;padding: var(--spacing-sm) 0}
.tree-node{display:flex;align-items:center;padding: 7px var(--spacing-md);cursor:pointer;transition:background .2s;gap:6px}
.tree-node:hover{background: var(--bg-page-solid)}
.tree-node.active{background:var(--primary-light);color:var(--primary)}
.tree-toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-tertiary);cursor:pointer;flex-shrink:0}
.tree-node-label{font-size: var(--font-size-sm);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node-icon{font-size: var(--font-size-md);margin-right:2px}
.tree-children{padding-left:20px;display:block}

/* 右侧内容 */
.content-panel{flex:1;background:var(--bg-primary);border-radius: var(--radius-lg);box-shadow: var(--shadow-sm);padding:20px;overflow:auto}
.content-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.content-title{font-size: var(--font-size-lg);font-weight:600;color:var(--text-primary)}
.content-subtitle{font-size: var(--font-size-xs);color:var(--text-tertiary);margin-top: var(--spacing-xs)}

/* 单位信息卡片 */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap: var(--spacing-md);margin-bottom:20px}
.info-card{background:var(--bg-tertiary);border-radius: var(--radius-lg);padding: var(--spacing-md)}
.info-card-title{font-size: var(--font-size-sm);font-weight:600;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.info-row{display:flex;margin-bottom: var(--spacing-sm);font-size: var(--font-size-sm)}
.info-label{color:var(--text-tertiary);width:90px;flex-shrink:0}
.info-value{color:var(--text-primary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 人员列表 */
.table-scroll{overflow-x:auto}
.table-basic{width:100%;border-collapse:collapse;font-size: var(--font-size-sm);min-width:700px}
.table-basic th{background:var(--bg-tertiary);padding:10px 12px;text-align:left;font-weight:600;color:var(--text-primary);border-bottom:1px solid var(--border-light);white-space:nowrap}
.table-basic td{padding:10px 12px;border-bottom:1px solid var(--bg-secondary);color:var(--text-primary)}
.table-basic tr:hover td{background:var(--bg-tertiary)}
.ellipsis-col{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.action-col{white-space:nowrap}
.action-col

/* 按钮 */

.btn-default:hover{color:var(--primary);border-color:var(--primary)}

.btn-primary:hover{background:var(--primary-hover)}

.btn-danger:hover{background:var(--danger-hover)}
.btn-sm{padding: var(--spacing-xs) 10px;font-size: var(--font-size-xs)}

.btn-link:hover{color:var(--primary-hover)}
.btn-link.danger{color:var(--danger)}
.btn-link.danger:hover{color:var(--danger-hover)}

/* 标签 */

.tag-success{background:var(--success-light);color:var(--success)}
.tag-warning{background:var(--warning-light);color:var(--warning)}
.tag-error{background:var(--danger-light);color:var(--danger)}
.tag-info{background:var(--primary-light);color:var(--primary)}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-dialog{background:var(--bg-primary);border-radius: var(--radius-lg);width:560px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.modal-header{padding:14px 20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.modal-close{font-size: var(--font-size-xl);color:var(--text-tertiary);cursor:pointer;background:none;border:none}
.modal-close:hover{color:var(--text-primary)}
.modal-body{padding: var(--spacing-md) 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap: var(--spacing-sm)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-group{flex:1}
.form-group label{display:block;font-size: var(--font-size-sm);color:var(--text-primary);margin-bottom:5px}
.form-group label .required{color:var(--danger);margin-left:2px}
.form-group input,.form-group select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);outline:none;box-sizing:border-box}
.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.form-group input:disabled{background:var(--bg-secondary);color:var(--text-tertiary)}

/* Toast */
#_toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding: 10px var(--spacing-lg);background:var(--text-primary);color:var(--bg-primary);border-radius: var(--radius-md);font-size: var(--font-size-md);z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div class="page-container" data-module="super-admin/project-org">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">超管端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">项目组织架构</span>
  </div>

  <!-- 统计概览 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-card-body">
        <div class="stat-label">项目总数</div>
        <div class="stat-value">47</div>
      </div>
      <div class="stat-indicator" style="background: var(--primary);"></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-body">
        <div class="stat-label">参建单位</div>
        <div class="stat-value">128</div>
      </div>
      <div class="stat-indicator" style="background: var(--success);"></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-body">
        <div class="stat-label">项目人员</div>
        <div class="stat-value">562</div>
      </div>
      <div class="stat-indicator" style="background: var(--warning);"></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-body">
        <div class="stat-label">在建项目</div>
        <div class="stat-value">32</div>
      </div>
      <div class="stat-indicator" style="background: var(--text-tertiary);"></div>
    </div>
  </div>

  <div class="main-layout">
    <!-- 左侧组织树 -->
    <div class="tree-panel">
      <div class="tree-header">📋 项目组织架构</div>
      <div class="tree-search">
        <input type="text" placeholder="搜索单位/部门..." id="treeSearchInput">
      </div>
      <div class="tree-body" id="orgTree"></div>
    </div>

    <!-- 右侧内容 -->
    <div class="content-panel">
      <div class="content-header">
        <div>
          <div class="content-title" id="selectedNodeName">XX大厦建设工程</div>
          <div class="content-subtitle" id="selectedNodePath">项目根节点</div>
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="openAddCategoryModal()">+ 新增分类</button>
          <button class="btn btn-primary btn-sm" onclick="openAddUnitModal()">+ 新增企业</button>
          <button class="btn btn-default btn-sm" onclick="openAddDeptModal()">+ 新增部门</button>
        </div>
      </div>

      <!-- 单位信息 -->
      <div class="info-grid" id="unitInfo">
        <div class="info-card">
          <div class="info-card-title">🏢 单位信息</div>
          <div class="info-row"><span class="info-label">单位名称</span><span class="info-value">XX建筑工程有限公司</span></div>
          <div class="info-row"><span class="info-label">单位类型</span><span class="info-value">施工单位（总包）</span></div>
          <div class="info-row"><span class="info-label">主要负责人</span><span class="info-value">李四</span></div>
          <div class="info-row"><span class="info-label">联系电话</span><span class="info-value">13900139001</span></div>
        </div>
        <div class="info-card">
          <div class="info-card-title">📊 项目统计</div>
          <div class="info-row"><span class="info-label">项目编号</span><span class="info-value">2024-001</span></div>
          <div class="info-row"><span class="info-label">项目状态</span><span class="info-value"><span class="tag tag-success">在建</span></span></div>
          <div class="info-row"><span class="info-label">所属区域</span><span class="info-value">南山区</span></div>
          <div class="info-row"><span class="info-label">安全码</span><span class="info-value" style="font-family:monospace;color:var(--success)">P202401001</span></div>
        </div>
      </div>

      <!-- 人员列表 -->
      <div class="content-title" style="font-size: var(--font-size-md);margin-bottom:12px">👥 项目人员</div>
      <div class="table-scroll">
        <table class="table-basic">
          <thead>
            <tr>
              <th>姓名</th>
              <th>职务</th>
              <th>联系电话</th>
              <th>账号状态</th>
              <th class="action-col">操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr>
              <td>李四</td>
              <td>项目经理</td>
              <td>13900139001</td>
              <td><span class="tag tag-success">正常</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="showToast('编辑人员')">编辑</button>
                <button class="btn-link danger" onclick="showToast('删除人员')">删除</button>
              </td>
            </tr>
            <tr>
              <td>王五</td>
              <td>安全员</td>
              <td>13900139002</td>
              <td><span class="tag tag-success">正常</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="showToast('编辑人员')">编辑</button>
                <button class="btn-link danger" onclick="showToast('删除人员')">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新增企业弹窗 -->
<div class="modal-overlay" id="addUnitModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="modal-title">新增企业</span>
      <button class="modal-close" onclick="closeModal('addUnitModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>单位名称 <span class="required">*</span></label>
          <input type="text" placeholder="请输入单位名称">
        </div>
        <div class="form-group">
          <label>单位类型 <span class="required">*</span></label>
          <select>
            <option value="">请选择</option>
            <option value="build">建设单位</option>
            <option value="construct">施工单位</option>
            <option value="supervise">监理单位</option>
            <option value="subcontract">分包单位</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>主要负责人 <span class="required">*</span></label>
          <input type="text" placeholder="请输入负责人姓名">
        </div>
        <div class="form-group">
          <label>联系电话 <span class="required">*</span></label>
          <input type="text" placeholder="请输入联系电话">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('addUnitModal')">取消</button>
      <button class="btn btn-primary" onclick="showToast('新增企业成功');closeModal('addUnitModal')">确定</button>
    </div>
  </div>
</div>

<script>
// 模拟组织架构数据
const orgData = [
  {
    id: 'proj-1',
    name: 'XX大厦建设工程',
    type: 'project',
    expanded: true,
    children: [
      {
        id: 'cat-1',
        name: '建设单位',
        type: 'category',
        expanded: true,
        children: [
          {
            id: 'unit-1',
            name: 'XX建设集团',
            type: 'unit',
            unitType: '建设单位',
            expanded: false,
            children: [
              { id: 'dept-1', name: '工程部', type: 'dept' },
              { id: 'dept-2', name: '安全部', type: 'dept' }
            ]
          }
        ]
      },
      {
        id: 'cat-2',
        name: '施工单位',
        type: 'category',
        expanded: true,
        children: [
          {
            id: 'unit-2',
            name: 'XX建筑工程有限公司',
            type: 'unit',
            unitType: '施工单位',
            expanded: true,
            children: [
              { id: 'dept-3', name: '项目部', type: 'dept' },
              { id: 'dept-4', name: '技术部', type: 'dept' },
              { id: 'dept-5', name: '安全部', type: 'dept' }
            ]
          }
        ]
      },
      {
        id: 'cat-3',
        name: '监理单位',
        type: 'category',
        expanded: false,
        children: [
          {
            id: 'unit-3',
            name: 'XX监理咨询有限公司',
            type: 'unit',
            unitType: '监理单位',
            expanded: false,
            children: [
              { id: 'dept-6', name: '监理部', type: 'dept' }
            ]
          }
        ]
      },
      {
        id: 'cat-4',
        name: '分包单位',
        type: 'category',
        expanded: false,
        children: [
          {
            id: 'unit-4',
            name: 'XX装饰工程有限公司',
            type: 'unit',
            unitType: '分包单位',
            expanded: false,
            children: [
              { id: 'dept-7', name: '施工队', type: 'dept' }
            ]
          }
        ]
      }
    ]
  }
];

let selectedNodeId = 'proj-1';

function renderOrgTree() {
  const container = document.getElementById('orgTree');
  container.innerHTML = orgData.map(node => renderTreeNode(node, 0)).join('');
}

function renderTreeNode(node, level) {
  const isSelected = node.id === selectedNodeId;
  const hasChildren = node.children && node.children.length > 0;
  const indent = level * 16;
  
  let icon = '🏗️';
  if (node.type === 'unit') icon = '🏢';
  if (node.type === 'category') icon = '📂';
  if (node.type === 'dept') icon = '📁';
  
  let html = '<div class="tree-node ' + (isSelected ? 'active' : '') + '" style="padding-left:' + (16 + indent) + 'px" onclick="selectNode(\'' + node.id + '\')">';
  if (hasChildren) {
    html += '<span class="tree-toggle" onclick="event.stopPropagation();toggleNode(\'' + node.id + '\')">' + (node.expanded ? '▼' : '▶') + '</span>';
  } else {
    html += '<span class="tree-toggle"></span>';
  }
  html += '<span class="tree-node-icon">' + icon + '</span>';
  html += '<span class="tree-node-label">' + node.name + '</span>';
  html += '</div>';
  
  if (hasChildren && node.expanded) {
    html += '<div class="tree-children">';
    html += node.children.map(child => renderTreeNode(child, level + 1)).join('');
    html += '</div>';
  }
  
  return html;
}

function toggleNode(nodeId) {
  function toggle(nodes) {
    for (const node of nodes) {
      if (node.id === nodeId) {
        node.expanded = !node.expanded;
        return true;
      }
      if (node.children && toggle(node.children)) return true;
    }
    return false;
  }
  toggle(orgData);
  renderOrgTree();
}

function selectNode(nodeId) {
  selectedNodeId = nodeId;
  renderOrgTree();
  updateContentPanel(nodeId);
}

function updateContentPanel(nodeId) {
  // 简化处理：始终显示项目根节点信息
  document.getElementById('selectedNodeName').textContent = 'XX大厦建设工程';
  document.getElementById('selectedNodePath').textContent = '项目根节点 > 施工单位 > 项目部';
}

function openAddUnitModal() {
  document.getElementById('addUnitModal').style.display = 'flex';
}

function openAddCategoryModal() {
  showToast('新增分类节点（功能待实现）');
}

function openAddDeptModal() {
  showToast('新增部门节点（功能待实现）');
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function showToast(msg) {
  var el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(function() { el.style.opacity = '0'; }, 2500);
}

// 初始化
renderOrgTree();
</script>
<script>
(function() { 'use strict'; var CONFIG = { moduleId: 'sa-project-org', moduleName: '项目组织架构' }; var state = { initialized: false }; function init() { if (state.initialized) return; console.log('[' + CONFIG.moduleId + '] 模块初始化'); state.initialized = true; } if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); } window.destroyModule = function() { console.log('[' + CONFIG.moduleId + '] 模块销毁'); state.initialized = false; }; })();
</script>
<script src="../../js/annotations.js"></script>
</body>
</html>
