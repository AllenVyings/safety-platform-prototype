<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目组织架构 - 超管端</title>

<style>
.page-container{padding:20px;background:linear-gradient(180deg,#f0f2f5 0%,#f5f7fa 100%);min-height:100vh}
.breadcrumb-item:hover{color:#1677ff}
.main-layout{display:flex;gap:16px;margin-top:16px}

/* 左侧树 */
.tree-panel{width:320px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
.tree-header{padding:14px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:600;color:#1f1f1f}
.tree-search{padding:10px 14px;border-bottom:1px solid #f0f0f0}
.tree-search input{width:100%;padding:7px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none}
.tree-search input:focus{border-color:#1677ff}
.tree-body{flex:1;overflow-y:auto;padding:8px 0}
.tree-node{display:flex;align-items:center;padding:7px 16px;cursor:pointer;transition:background .2s;gap:6px}
.tree-node:hover{background:#f5f7fa}
.tree-node.active{background:#e6f4ff;color:#1677ff}
.tree-toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;cursor:pointer;flex-shrink:0}
.tree-node-label{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node-icon{font-size:14px;margin-right:2px}
.tree-children{padding-left:20px;display:block}

/* 右侧内容 */
.content-panel{flex:1;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;overflow:auto}
.content-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.content-title{font-size:16px;font-weight:600;color:#1f1f1f}
.content-subtitle{font-size:12px;color:#999;margin-top:4px}

/* 单位信息卡片 */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.info-card{background:#fafafa;border-radius:8px;padding:16px}
.info-card-title{font-size:13px;font-weight:600;color:#1f1f1f;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.info-row{display:flex;margin-bottom:8px;font-size:13px}
.info-label{color:#999;width:90px;flex-shrink:0}
.info-value{color:#333;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 人员列表 */
.table-scroll{overflow-x:auto}
.table-basic{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.table-basic th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;color:#1f1f1f;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.table-basic td{padding:10px 12px;border-bottom:1px solid #f5f5f5;color:#333}
.table-basic tr:hover td{background:#fafafa}
.ellipsis-col{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.action-col{position:sticky;right:0;background:#fff;white-space:nowrap}
.action-col .btn-link{margin-right:8px}

/* 按钮 */
.btn{padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff}
.btn-danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f}
.btn-danger:hover{background:#ff7875}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-link{background:none;border:none;padding:2px 6px;color:#1677ff;cursor:pointer;font-size:13px}
.btn-link:hover{color:#4096ff}
.btn-link.danger{color:#ff4d4f}
.btn-link.danger:hover{color:#ff7875}

/* 标签 */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:12px}
.tag-success{background:#f6ffed;color:#52c41a}
.tag-warning{background:#fffbe6;color:#faad14}
.tag-error{background:#fff2f0;color:#ff4d4f}
.tag-info{background:#e6f4ff;color:#52c41a}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:8px;width:560px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.modal-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:600;color:#1f1f1f}
.modal-close{font-size:18px;color:#999;cursor:pointer;background:none;border:none}
.modal-close:hover{color:#333}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-group{flex:1}
.form-group label{display:block;font-size:13px;color:#333;margin-bottom:5px}
.form-group label .required{color:#ff4d4f;margin-left:2px}
.form-group input,.form-group select{width:100%;padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none;box-sizing:border-box}
.form-group input:focus,.form-group select:focus{border-color:#1677ff}
.form-group input:disabled{background:#f5f5f5;color:#999}

/* Toast */
#_toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;background:#1f1f1f;color:#fff;border-radius:6px;font-size:14px;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div class="page-container" data-module="sa-project-org">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">超管端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item">项目组织架构</span>
  </div>

  <!-- 统计概览 -->
  <div style="display:flex;gap:12px;margin-bottom:16px;">
    <div class="stat-card" style="flex:1;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:8px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:18px;">🏗️</div>
      <div><div style="font-size:13px;color:#64748b;">项目总数</div><div style="font-size:22px;font-weight:600;color:#1e293b;">47</div></div>
    </div>
    <div class="stat-card" style="flex:1;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:8px;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:18px;">🏢</div>
      <div><div style="font-size:13px;color:#64748b;">参建单位</div><div style="font-size:22px;font-weight:600;color:#1e293b;">128</div></div>
    </div>
    <div class="stat-card" style="flex:1;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:8px;background:#fed7aa;display:flex;align-items:center;justify-content:center;font-size:18px;">👥</div>
      <div><div style="font-size:13px;color:#64748b;">项目人员</div><div style="font-size:22px;font-weight:600;color:#1e293b;">562</div></div>
    </div>
    <div class="stat-card" style="flex:1;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:18px;">📊</div>
      <div><div style="font-size:13px;color:#64748b;">在建项目</div><div style="font-size:22px;font-weight:600;color:#1e293b;">32</div></div>
    </div>
  </div>

  <div class="main-layout">
    <!-- 左侧组织树 -->
    <div class="tree-panel">
      <div class="tree-header">📋 项目组织架构</div>
      <div class="tree-search">
        <input type="text" placeholder="搜索单位/部门..." id="treeSearchInput">
      </div>
      <div class="tree-body" id="orgTree"></div>
    </div>

    <!-- 右侧内容 -->
    <div class="content-panel">
      <div class="content-header">
        <div>
          <div class="content-title" id="selectedNodeName">XX大厦建设工程</div>
          <div class="content-subtitle" id="selectedNodePath">项目根节点</div>
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="openAddUnitModal()">+ 新增单位</button>
        </div>
      </div>

      <!-- 单位信息 -->
      <div class="info-grid" id="unitInfo">
        <div class="info-card">
          <div class="info-card-title">🏢 单位信息</div>
          <div class="info-row"><span class="info-label">单位名称</span><span class="info-value">XX建筑工程有限公司</span></div>
          <div class="info-row"><span class="info-label">单位类型</span><span class="info-value">施工单位（总包）</span></div>
          <div class="info-row"><span class="info-label">主要负责人</span><span class="info-value">李四</span></div>
          <div class="info-row"><span class="info-label">联系电话</span><span class="info-value">13900139001</span></div>
        </div>
        <div class="info-card">
          <div class="info-card-title">📊 项目统计</div>
          <div class="info-row"><span class="info-label">项目编号</span><span class="info-value">2024-001</span></div>
          <div class="info-row"><span class="info-label">项目状态</span><span class="info-value"><span class="tag tag-success">在建</span></span></div>
          <div class="info-row"><span class="info-label">所属区域</span><span class="info-value">南山区</span></div>
          <div class="info-row"><span class="info-label">安全码</span><span class="info-value" style="font-family:monospace;color:#52c41a">P202401001</span></div>
        </div>
      </div>

      <!-- 人员列表 -->
      <div class="content-title" style="font-size:14px;margin-bottom:12px">👥 项目人员</div>
      <div class="table-scroll">
        <table class="table-basic">
          <thead>
            <tr>
              <th>姓名</th>
              <th>职务</th>
              <th>联系电话</th>
              <th>账号状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr>
              <td>李四</td>
              <td>项目经理</td>
              <td>13900139001</td>
              <td><span class="tag tag-success">正常</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="showToast('编辑人员')">编辑</button>
                <button class="btn-link danger" onclick="showToast('删除人员')">删除</button>
              </td>
            </tr>
            <tr>
              <td>王五</td>
              <td>安全员</td>
              <td>13900139002</td>
              <td><span class="tag tag-success">正常</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="showToast('编辑人员')">编辑</button>
                <button class="btn-link danger" onclick="showToast('删除人员')">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新增单位弹窗 -->
<div class="modal-overlay" id="addUnitModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">新增单位</span>
      <button class="modal-close" onclick="closeModal('addUnitModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>单位名称 <span class="required">*</span></label>
          <input type="text" placeholder="请输入单位名称">
        </div>
        <div class="form-group">
          <label>单位类型 <span class="required">*</span></label>
          <select>
            <option value="">请选择</option>
            <option value="build">建设单位</option>
            <option value="construct">施工单位</option>
            <option value="supervise">监理单位</option>
            <option value="subcontract">分包单位</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>主要负责人 <span class="required">*</span></label>
          <input type="text" placeholder="请输入负责人姓名">
        </div>
        <div class="form-group">
          <label>联系电话 <span class="required">*</span></label>
          <input type="text" placeholder="请输入联系电话">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('addUnitModal')">取消</button>
      <button class="btn btn-primary" onclick="showToast('新增单位成功');closeModal('addUnitModal')">确定</button>
    </div>
  </div>
</div>

<script>
// 模拟组织架构数据
const orgData = [
  {
    id: 'proj-1',
    name: 'XX大厦建设工程',
    type: 'project',
    expanded: true,
    children: [
      {
        id: 'unit-1',
        name: 'XX建设集团',
        type: 'unit',
        unitType: '建设单位',
        expanded: false,
        children: [
          { id: 'dept-1', name: '工程部', type: 'dept' },
          { id: 'dept-2', name: '安全部', type: 'dept' }
        ]
      },
      {
        id: 'unit-2',
        name: 'XX建筑工程有限公司',
        type: 'unit',
        unitType: '施工单位',
        expanded: true,
        children: [
          { id: 'dept-3', name: '项目部', type: 'dept' },
          { id: 'dept-4', name: '技术部', type: 'dept' },
          { id: 'dept-5', name: '安全部', type: 'dept' }
        ]
      },
      {
        id: 'unit-3',
        name: 'XX监理咨询有限公司',
        type: 'unit',
        unitType: '监理单位',
        expanded: false,
        children: [
          { id: 'dept-6', name: '监理部', type: 'dept' }
        ]
      },
      {
        id: 'unit-4',
        name: 'XX装饰工程有限公司',
        type: 'unit',
        unitType: '分包单位',
        expanded: false,
        children: [
          { id: 'dept-7', name: '施工队', type: 'dept' }
        ]
      }
    ]
  }
];

let selectedNodeId = 'proj-1';

function renderOrgTree() {
  const container = document.getElementById('orgTree');
  container.innerHTML = orgData.map(node => renderTreeNode(node, 0)).join('');
}

function renderTreeNode(node, level) {
  const isSelected = node.id === selectedNodeId;
  const hasChildren = node.children && node.children.length > 0;
  const indent = level * 16;
  
  let icon = '🏗️';
  if (node.type === 'unit') icon = '🏢';
  if (node.type === 'dept') icon = '📁';
  
  let html = '<div class="tree-node ' + (isSelected ? 'active' : '') + '" style="padding-left:' + (16 + indent) + 'px" onclick="selectNode(\'' + node.id + '\')">';
  if (hasChildren) {
    html += '<span class="tree-toggle" onclick="event.stopPropagation();toggleNode(\'' + node.id + '\')">' + (node.expanded ? '▼' : '▶') + '</span>';
  } else {
    html += '<span class="tree-toggle"></span>';
  }
  html += '<span class="tree-node-icon">' + icon + '</span>';
  html += '<span class="tree-node-label">' + node.name + '</span>';
  html += '</div>';
  
  if (hasChildren && node.expanded) {
    html += '<div class="tree-children">';
    html += node.children.map(child => renderTreeNode(child, level + 1)).join('');
    html += '</div>';
  }
  
  return html;
}

function toggleNode(nodeId) {
  function toggle(nodes) {
    for (const node of nodes) {
      if (node.id === nodeId) {
        node.expanded = !node.expanded;
        return true;
      }
      if (node.children && toggle(node.children)) return true;
    }
    return false;
  }
  toggle(orgData);
  renderOrgTree();
}

function selectNode(nodeId) {
  selectedNodeId = nodeId;
  renderOrgTree();
  updateContentPanel(nodeId);
}

function updateContentPanel(nodeId) {
  // 简化处理：始终显示项目根节点信息
  document.getElementById('selectedNodeName').textContent = 'XX大厦建设工程';
  document.getElementById('selectedNodePath').textContent = '项目根节点 > 施工单位 > 项目部';
}

function openAddUnitModal() {
  document.getElementById('addUnitModal').style.display = 'flex';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function showToast(msg) {
  var el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(function() { el.style.opacity = '0'; }, 2500);
}

// 初始化
renderOrgTree();
</script>
<script>

</script>
<script src="../../js/annotations.js"></script>
</body>
</html>
