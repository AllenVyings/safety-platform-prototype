<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台</title>
  
    <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
.workbench-page {
      padding: var(--spacing-lg);
      background: var(--bg-page);
      min-height: 100vh;
    }

    /* ========== 统计卡片 ========== */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }
  </style>
</head>
<body>
  <div class="module-page workbench-page" data-module="sa-workbench">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item" onclick="goToHome()">首页</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item">超管端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">工作台</span>
    </div>
    
    <!-- 页面标题 -->
    <header class="page-header">
      <h1 class="page-title">工作台</h1>
    </header>
    
    <!-- 统计卡片 -->
    <section class="stat-cards">
      <div class="stat-card">
        <div class="stat-icon blue">🏢</div>
        <div class="stat-content">
          <div class="stat-label">企业总数</div>
          <div class="stat-value">128</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">🏛️</div>
        <div class="stat-content">
          <div class="stat-label">政府单位数</div>
          <div class="stat-value">35</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">👥</div>
        <div class="stat-content">
          <div class="stat-label">用户总数</div>
          <div class="stat-value">1,562</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon gray">📋</div>
        <div class="stat-content">
          <div class="stat-label">项目总数</div>
          <div class="stat-value">47</div>
        </div>
      </div>
    </section>
    
    <!-- 快捷操作 -->
    <section class="quick-actions">
      <h2 class="quick-actions-title">快捷操作</h2>
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="goToModule('sa-gov-org')">
          🏛️ 政府组织架构
        </button>
        <button class="btn btn-primary" onclick="goToModule('sa-ent-manage')">
          🏢 企业注册管理
        </button>
        <button class="btn btn-primary" onclick="goToModule('sa-domain-manage')">
          🏷️ 领域小类管理
        </button>
      </div>
    </section>
  </div>
  
  <script>
    (function() {
      'use strict';
      
      const CONFIG = {
        moduleId: 'sa-workbench',
        moduleName: '工作台'
      };
      
      let state = {
        initialized: false
      };
      
      function init() {
        if (state.initialized) return;
        
        console.log(`[${CONFIG.moduleId}] 模块初始化`);
        state.initialized = true;
      }
      
      // Toast 提示
      function showToast(msg) {
        var t = document.getElementById('_toast');
        if (!t) { t = document.createElement('div'); t.id = '_toast'; document.body.appendChild(t); }
        Object.assign(t.style, {position:'fixed',top:'20px',left:'50%',transform:'translateX(-50%)',padding:'10px 24px',background:'var(--text-primary)',color:'var(--bg-primary)',borderRadius:'var(--radius-md)',fontSize:'var(--font-size-md)',zIndex:99999,opacity:0,transition:'opacity var(--duration-normal)',pointerEvents:'none'});
        t.textContent = msg;
        setTimeout(function() { t.style.opacity = 1; }, 10);
        setTimeout(function() { t.style.opacity = 0; }, 2000);
      }

      // 面包屑导航函数
      window.goToHome = function() {
        console.log('导航到首页');
        if (window.parent && window.parent.goToModule) {
          window.parent.goToModule('sa-workbench');
        } else {
          showToast('导航到：首页');
        }
      };

      window.goToModule = function(moduleId) {
        console.log('导航到模块：' + moduleId);
        if (window.parent && window.parent.goToModule) {
          window.parent.goToModule(moduleId);
        } else {
          showToast('导航到：' + moduleId);
        }
      };
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      window.destroyModule = function() {
        console.log(`[${CONFIG.moduleId}] 模块销毁`);
        state.initialized = false;
      };
    })();
  </script>
<script src="../../js/annotations.js"></script>
</body>
</html>
