<!DOCTYPE html>
<!-- 注意：超管端项目信息管理为原型扩展页面，PRD中暂无独立章节，功能参考企业端项目信息管理 -->
<html lang="zh-CN">
<head>  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目信息管理 - 超管端</title>

<style>
.drill-body{display:flex;gap:var(--spacing-md);align-items:stretch}
.drill-main{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--spacing-md)}
.drill-main .table-card{flex:1;display:flex;flex-direction:column;min-height:0}
.drill-main .table-container{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.drill-main .table-container .table-wrap{flex:1;overflow-x:auto;min-height:0}
.tree-panel{width:280px;flex-shrink:0;background:var(--bg-primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden}
.tree-search{position:relative;padding:12px;border-bottom:1px solid var(--border-light)}
.tree-search input{width:100%;height:32px;padding:var(--spacing-sm) 28px var(--spacing-sm) 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;box-sizing:border-box}
.tree-search input:focus{border-color:var(--primary)}
.tree-search .search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:var(--font-size-md);color:var(--text-tertiary);pointer-events:none}
.tree-tabs{display:flex;border-bottom:1px solid var(--border-light)}
.tree-tab{flex:1;padding:10px 0;text-align:center;font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;background:none;border:none}
.tree-tab:hover{color:var(--primary)}
.tree-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tree-content{flex:1;overflow-y:auto;padding:12px}
.tree-node{display:flex;align-items:center;padding:6px var(--spacing-sm);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;font-size:var(--font-size-sm);color:var(--text-primary)}
.tree-node:hover{background:var(--bg-page-solid)}
.tree-node.active{background:var(--primary-light);color:var(--primary)}
.tree-node .arrow{margin-right:var(--spacing-xs);font-size:10px;color:var(--text-tertiary);transition:transform .2s;width:12px;text-align:center}
.tree-node .arrow.expanded{transform:rotate(90deg)}
.tree-node .node-icon{margin-right:6px;font-size:var(--font-size-md);display:inline-flex;align-items:center}
.tree-node .node-icon svg{display:block}
.tree-node .node-count{margin-left:auto;font-size:11px;color:var(--text-tertiary);background:var(--bg-secondary);padding:1px 6px;border-radius:10px}
.tree-node.active .node-count{background:var(--primary);color:var(--bg-primary)}
.tree-children{padding-left:20px;display:block}

/* 筛选栏 */
.filter-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:var(--spacing-md) var(--spacing-lg);box-shadow:var(--shadow-sm);flex-shrink:0}
.filter-card .filter-bar{margin-bottom:0;background:transparent;padding:0;border:none;border-radius:0;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.filter-item{display:flex;align-items:center;gap:6px}
.filter-item label{font-size:var(--font-size-sm);color:var(--text-secondary);white-space:nowrap}
.filter-bar select,.filter-bar input[type="text"]{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);background:var(--bg-primary);color:var(--text-primary);outline:none;transition:border-color var(--duration-fast)}
.filter-bar select:focus,.filter-bar input[type="text"]:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,0.1)}
.filter-bar select{width:240px;padding-right:24px}
.filter-bar input[type="text"]{width:240px}
.filter-actions{display:flex;gap:20px}

/* 表格工具栏 */
.table-toolbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:var(--spacing-md)}
.table-toolbar-actions{display:flex;gap:8px}

.table-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md);flex:1;overflow:hidden}
.btn-link.btn-sm{font-size:var(--font-size-xs);padding:1px var(--spacing-xs)}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);min-width:1100px}
thead th{background:var(--bg-tertiary);padding:10px 12px;text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-light);white-space:nowrap;position:relative}
tbody td{padding:10px 12px;border-bottom:1px solid var(--bg-secondary);color:var(--text-primary);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover{background:var(--bg-section)}
tbody tr:last-child td{border-bottom:none}
/* 列宽固定 */
thead th:nth-child(1),tbody td:nth-child(1){width:40px;max-width:40px;text-align:center} /* col-check */
thead th:nth-child(2),tbody td:nth-child(2){width:40px;max-width:40px;text-align:center} /* col-index */
thead th:nth-child(3),tbody td:nth-child(3){width:180px;max-width:180px}
thead th:nth-child(4),tbody td:nth-child(4){width:120px;max-width:120px}
thead th:nth-child(5),tbody td:nth-child(5){width:120px;max-width:120px}
thead th:nth-child(6),tbody td:nth-child(6){width:100px;max-width:100px}
thead th:nth-child(7),tbody td:nth-child(7){width:100px;max-width:100px;text-align:center}
thead th:nth-child(8),tbody td:nth-child(8){width:240px;max-width:240px}
thead th:nth-child(9),tbody td:nth-child(9){width:80px;max-width:80px;text-align:center}
thead th:nth-child(10),tbody td:nth-child(10){width:120px;max-width:120px}
thead th:nth-child(11),tbody td:nth-child(11){width:260px;min-width:260px;max-width:none;overflow:visible;position:sticky;right:0;background:var(--bg-tertiary);z-index:1;box-shadow:-2px 0 4px rgba(0,0,0,0.06)}
tbody td:nth-child(11){background:var(--bg-primary)}
tbody tr:hover td:nth-child(11){background:var(--bg-section)}

/* 页面私有标签变体（framework.css 未提供） */
.tag-success{background:var(--success-light);color:var(--success)}
.tag-warning{background:var(--warning-light);color:var(--warning)}
.tag-error{background:var(--danger-light);color:var(--danger)}
.tag-info{background:var(--primary-light);color:var(--primary)}
.tag-default{background:var(--bg-secondary);color:var(--text-tertiary)}
.tag-yellow{background:#fef3cd;color:#b7791f}

/* 表单（卡片式分区） */
.form-section{margin-bottom:var(--spacing-md);background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md);box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.form-section-title{font-size:var(--font-size-md);font-weight:600;color:var(--text-primary);padding:0 0 12px;margin-bottom:12px;border-bottom:2px solid var(--primary)}
.form-row{display:flex;flex-wrap:wrap;gap:var(--spacing-md);margin-bottom:14px}
.form-row:last-child{margin-bottom:0}
.form-group{display:flex!important;flex-direction:row!important;align-items:center!important;flex:1;min-width:0;max-width:calc(50% - 8px)}
.form-group .form-label{flex-shrink:0;width:80px;margin-bottom:0!important;margin-right:10px;text-align:right;font-size:var(--font-size-sm);color:var(--text-primary)}
.form-label .required{color:var(--danger);margin-right:2px}
.form-group .form-input,.form-group .form-select{flex:1;height:36px;padding:var(--spacing-sm) 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box}
.form-group textarea.form-input{height:auto;min-height:80px;padding:10px 12px}
.form-group select.form-select{cursor:pointer;background:var(--bg-primary)}
.form-group[style*="flex:2"]{max-width:420px}

/* 详情 */
.detail-row{display:flex;border-bottom:1px solid var(--border-light);line-height:44px;align-items:flex-start}
.detail-row:last-child{border-bottom:none}
.detail-label{width:120px;flex-shrink:0;color:var(--text-secondary);font-size:var(--font-size-sm);padding-left:var(--spacing-xs);line-height:44px;font-weight:500}
.detail-value{flex:1;color:var(--text-primary);font-size:var(--font-size-md);padding-right:var(--spacing-sm);word-break:break-all;line-height:22px;padding-top:11px;padding-bottom:11px;white-space:normal}
.detail-section-title{padding:0 var(--spacing-xs) 12px;margin-bottom:12px;border-bottom:2px solid var(--primary);font-size:var(--font-size-md);font-weight:600;color:var(--text-primary)}
.detail-section{margin-bottom:20px;background:var(--bg-section);border-radius:var(--radius-lg);padding:var(--spacing-md)}
.detail-section:last-child{margin-bottom:0}

/* 四方责任体 */
.party-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg-secondary)}
.party-row:last-child{border-bottom:none}
.party-label{width:80px;flex-shrink:0;font-size:var(--font-size-sm);color:var(--text-primary);font-weight:500}
.input-suffix-btn{position:absolute;right:var(--spacing-sm);top:50%;transform:translateY(-50%);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--font-size-md);color:var(--primary);transition:all .2s;background:var(--bg-primary)}
.input-suffix-btn:hover{background:var(--primary-light)}
.party-inputs{display:flex;gap:12px;flex:1}
.party-inputs .form-group{flex:1;min-width:120px;margin-bottom:0;flex-direction:column;align-items:stretch}
.party-inputs .form-group .form-label{width:auto;text-align:left;margin-bottom:5px;margin-right:0}
.party-inputs .form-group .form-input,.party-inputs .form-group .form-select{width:100%}
.subcontract-btns{display:flex;gap:var(--spacing-sm);margin-top:var(--spacing-sm)}

/* Toast */
#_toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px var(--spacing-lg);background:var(--text-primary);color:var(--bg-primary);border-radius:var(--radius-md);font-size:var(--font-size-md);z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}
.no-data td{text-align:center;color:var(--border);padding:40px 0}
/* 安全码图标 — SKILL.md §4.23 */
.code-cell{display:inline-flex;align-items:center;cursor:help}
.qrcode-icon{width:20px;height:20px;color:var(--text-secondary)}
.code-cell.red .qrcode-icon{color:var(--danger)}
.code-cell.yellow .qrcode-icon{color:var(--warning)}
.code-cell.green .qrcode-icon{color:var(--success)}
</style>
</head>
<body>
<div class="page-container" data-module="super-admin/project-manage">
  <div class="breadcrumb" id="breadcrumb" style="display:flex;align-items:center;margin-bottom:var(--spacing-md);">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">超管端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">项目信息管理</span>
    <span class="region-tag" style="margin-left:8px;background:var(--info-light,#e8f4fd);color:var(--info,var(--primary));border-radius:4px;padding:2px 8px;font-size:12px;">角色：<select id="roleSwitch" onchange="switchRole(this.value)" style="border:none;background:transparent;font-size:12px;color:inherit;cursor:pointer"><option value="领导">领导</option><option value="监管人员">监管人员</option></select></span>
    <span class="jurisdiction-tag" style="margin-left:auto;background:var(--primary-light);color:var(--primary);border-radius:4px;padding:2px 8px;font-size:12px;">辖区：南山区</span>
  </div>
  <div class="drill-body">
    <!-- 左侧树形区域 -->
    <div class="tree-panel">
      <div class="tree-search">
        <input type="text" id="treeSearchInput" placeholder="搜索街道/领域" onkeyup="filterTree()">
        <span class="search-icon">&#128269;</span>
      </div>
      <div class="tree-tabs">
        <button class="tree-tab active" id="tabStreet" onclick="switchTreeTab('street')">按街道筛选</button>
        <button class="tree-tab" id="tabDomain" onclick="switchTreeTab('domain')">按领域筛选</button>
      </div>
      <div class="tree-content" id="treeContent">
        <!-- 树形内容由JS渲染 -->
      </div>
    </div>
    <!-- 右侧内容区 -->
    <div class="drill-main">
    <!-- 统计卡片 -->
    <div class="stats-row" id="statsRow" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">辖区项目总数</div><div class="stat-value" id="statTotal">0</div></div><div class="stat-indicator" style="background:var(--primary)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">在建项目</div><div class="stat-value" id="statBuilding">0</div></div><div class="stat-indicator" style="background:var(--success)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">停工项目</div><div class="stat-value" id="statStopped">0</div></div><div class="stat-indicator" style="background:var(--warning)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">竣工项目</div><div class="stat-value" id="statCompleted">0</div></div><div class="stat-indicator" style="background:var(--text-tertiary)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">运营项目</div><div class="stat-value" id="statOperation">0</div></div><div class="stat-indicator" style="background:#722ed1"></div></div>
    </div>
    <!-- 筛选栏 -->
    <div class="filter-card">
      <div class="filter-bar">
        <div class="filter-item"><label>项目类型：</label>
          <select id="filterType"><option value="">全部</option><option value="1">在建项目</option><option value="2">运营项目</option></select>
        </div>
        <div class="filter-item"><label>项目状态：</label>
          <select id="filterStatus"><option value="">全部</option><option value="1">未开工</option><option value="2">在建</option><option value="3">停工</option><option value="4">竣工</option></select>
        </div>
        <div class="filter-item"><label>领域小类：</label>
          <select id="filterDomain"><option value="">全部</option></select>
        </div>
        <div class="filter-item"><label>所属区划：</label>
          <select id="filterRegion"><option value="">全部</option></select>
        </div>
        <div class="filter-item"><label>关键词：</label>
          <input id="filterKeyword" type="text" placeholder="搜索项目名称/编号...">
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="renderTable()">查询</button>
          <button class="btn btn-default" onclick="resetFilters()">重置</button>
        </div>
      </div>
    </div>
    <!-- 项目列表 -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="table-toolbar-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增项目</button>
        </div>
      </div>
      <div class="table-container">
        <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="col-check"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"></th>
            <th class="col-index">序号</th>
            <th>项目名称</th><th>项目编号</th><th>领域小类</th><th>项目小类</th>
            <th>项目状态</th><th>所属区域</th><th>安全码</th><th>创建时间</th><th class="action-col">操作</th>
          </tr></thead>
          <tbody id="projectTableBody"><tr><td colspan="11" class="no-data">加载中...</td></tr></tbody>
        </table>
        </div>
      </div>
      <!-- 分页 -->
      <div class="pagination" id="paginationBar"></div>
    </div>
    </div><!-- /drill-main -->
  </div>
</div>

<!-- 新增/编辑项目弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增项目</span>
      <div class="modal-close" onclick="closeModal('editModal')">&times;</div>
    </div>
    <div class="modal-body">
      <!-- 基础信息 -->
      <div class="form-section">
        <div class="form-section-title">基础信息</div>
        <!-- 第1行：项目名称 + 项目编号 -->
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目名称</label><input class="form-input" id="fProjectName" type="text" placeholder="请输入项目全称"></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目编号</label><input class="form-input" id="fProjectNo" type="text" placeholder="施工许可证号/统一社会信用代码"></div>
        </div>
        <!-- 第2行：项目类型 + 领域小类 -->
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目类型</label>
            <select class="form-select" id="fProjectCategory" onchange="onProjectCategoryChange()">
              <option value="">请选择项目类型</option>
              <option value="1">在建项目</option>
              <option value="2">运营项目</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>领域小类</label>
            <select class="form-select" id="fDomain" onchange="onDomainChange()"><option value="">请选择领域小类</option></select>
          </div>
        </div>
        <!-- 第3行：项目小类 + 项目状态 -->
        <div class="form-row" id="projectTypeRow">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目小类</label>
            <select class="form-select" id="fProjectType"><option value="">请先选择领域小类</option></select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目状态</label>
            <select class="form-select" id="fProjectStatus">
              <option value="">请选择项目状态</option>
              <option value="1">未开工</option>
              <option value="2">在建</option>
              <option value="3">停工</option>
              <option value="4">竣工</option>
            </select>
          </div>
        </div>
        <div class="form-row" id="operationStatusRow" style="display:none">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目状态</label>
            <select class="form-select" id="fOperationStatus">
              <option value="">请选择项目状态</option>
              <option value="1">正常运营</option>
              <option value="2">暂停运营</option>
              <option value="3">关闭</option>
            </select>
          </div>
          <div class="form-group"></div>
        </div>
        <!-- 四级区划 -->
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属区</label>
            <select class="form-select" id="fDistrict" onchange="onDistrictChange()"><option value="">请选择区</option></select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属街道</label>
            <select class="form-select" id="fStreet" onchange="onStreetChange()"><option value="">请选择街道</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属社区</label>
            <select class="form-select" id="fCommunity" onchange="onCommunityChange()"><option value="">请选择社区</option></select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属网格</label>
            <select class="form-select" id="fGrid"><option value="">请选择网格</option></select>
          </div>
        </div>
        <!-- 第6行：详细地址 + 所属督导组 -->
        <div class="form-row" id="supervisionGroupRow">
          <div class="form-group"><label class="form-label"><span class="required">*</span>详细地址</label><input class="form-input" id="fAddress" type="text" placeholder="请输入具体地址"></div>
          <div class="form-group"><label class="form-label">所属督导组</label>
            <select class="form-select" id="fSupervisionGroup"><option value="">请选择督导组（选填）</option>
              <option value="1">第一督导组</option><option value="2">第二督导组</option><option value="3">第三督导组</option>
            </select>
          </div>
        </div>
        <!-- 第7行：项目描述（独占一行，标签在上） -->
        <div class="form-row">
          <div class="form-group" style="flex:1;max-width:100%;flex-direction:column;align-items:flex-start"><label class="form-label" style="width:auto;margin-bottom:5px">项目描述</label><textarea class="form-input" id="fDescription" placeholder="请输入项目概况说明（选填）" style="height:80px;resize:vertical;width:100%"></textarea></div>
        </div>
      </div>
      <!-- 四方责任体/运营单位 -->
      <div class="form-section" id="partySection">
        <div class="form-section-title">四方责任体</div>
        <div class="party-row">
          <div class="party-label"><span class="required">*</span>建设单位</div>
          <div class="party-inputs">
            <div class="form-group" style="flex:2;position:relative"><input class="form-input" id="fParty1Name" placeholder="输入或点击右侧图标选择企业"><span class="input-suffix-btn" onclick="openEnterpriseSelect(1)" title="选择企业">&#128269;</span></div>
            <div class="form-group"><input class="form-input" id="fParty1Credit" placeholder="统一社会信用代码"></div>
            <div class="form-group"><input class="form-input" id="fParty1Contact" placeholder="负责人姓名"></div>

// ==================== 分页组件 ====================
var pg = new Pagination('paginationBar', {
  total: 0,
  onChange: function(page, size) {
    pgState.page = page;
    pgState.size = size;
    renderTable();
  }
});
var pgState = { page: 1, size: 10, total: 0 };

function renderTable(){
  var typeVal = document.getElementById('filterType').value;
  var statusVal = document.getElementById('filterStatus').value;
  var domainVal = document.getElementById('filterDomain').value;
  var regionVal = document.getElementById('filterRegion').value;
  var kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
  var rows = filteredProjects.filter(function(p){
    if(typeVal && p.projectCategory !== typeVal) return false;
    if(statusVal && p.projectStatus !== statusVal) return false;
    if(domainVal && p.domainId !== domainVal) return false;
    if(regionVal && p.regionCode !== regionVal) return false;
    if(kw && !(p.projectName.toLowerCase().includes(kw) || p.projectNo.toLowerCase().includes(kw))) return false;
    return true;
  });
  pgState.total = rows.length;
  var start = (pgState.page - 1) * pgState.size;
  var pageRows = rows.slice(start, start + pgState.size);
  var tbody = document.getElementById('projectTableBody');
  if(pageRows.length === 0){
    tbody.innerHTML = '<tr><td colspan="11" class="no-data">暂无数据</td></tr>';
    pg.setTotal(0);
    return;
  }
  tbody.innerHTML = pageRows.map(function(p, idx){
    var statusCls, statusName;
    if(p.projectCategory === '2'){
      statusCls = operationStatusTagMap[p.projectStatus] || 'tag-default';
      statusName = operationStatusMap[p.projectStatus] || '—';
    }else{
      statusCls = statusTagMap[p.projectStatus] || 'tag-default';
      statusName = statusMap[p.projectStatus] || '—';
    }
    // 码色：从 mock 数据 codeColor 字段读取
    var codeColor = p.codeColor || 'green';
    var codeLabel = codeColor === 'red' ? '红码' : codeColor === 'yellow' ? '黄码' : '绿码';
    var codeColorHex = codeColor === 'red' ? '#ff4d4f' : codeColor === 'yellow' ? '#faad14' : '#52c41a';
    var seq = start + idx + 1;
    return '<tr>' +
      '<td class="col-check"><input type="checkbox" class="row-checkbox" data-id="' + p.id + '" onchange="syncSelectAllState()"></td>' +
      '<td class="col-index">' + seq + '</td>' +
      '<td title="' + p.projectName + '">' + p.projectName + '</td>' +
      '<td title="' + p.projectNo + '">' + p.projectNo + '</td>' +
      '<td>' + (p.domainName||'') + '</td>' +
      '<td>' + (p.projectType||'') + '</td>' +
      '<td><span class="tag ' + statusCls + '">' + statusName + '</span></td>' +
      '<td title="' + (p.regionName||'') + ' / ' + (p.streetName||'') + ' / ' + (p.communityName||'') + ' / ' + (p.gridName||'') + '">' + (p.regionName||'') + ' / ' + (p.streetName||'') + (p.gridName ? ' / ' + p.gridName : '') + '</td>' +
      '<td><span class="code-cell ' + codeColor + '" title="安全码：' + p.safetyCode + '（' + codeLabel + '）" onclick="showToast(\'安全码：' + p.safetyCode + '（' + codeLabel + '）\')">' + QR_ICON_SVG + '</span></td>' +
      '<td>' + (p.createTime||'') + '</td>' +
      '<td class="action-col"><div class="table-action-group"><button class="btn-link" onclick="openEditModal(\'' + p.id + '\')">编辑</button><button class="btn-link" onclick="deleteProject(\'' + p.id + '\')">删除</button><button class="btn-link" onclick="viewDetail(\'' + p.id + '\')">查看</button><button class="btn-link" onclick="resetPwd(\'' + p.id + '\')">重置密码</button></div></td>' +
      '</tr>';
  }).join('');
  pg.setTotal(pgState.total);
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.row-checkbox').forEach(function(cb) { cb.checked = checked; });

function syncSelectAllState() {
  var all = document.querySelectorAll('.row-checkbox');
  var checked = document.querySelectorAll('.row-checkbox:checked');
  var selectAllEl = document.getElementById('selectAll');
  if (selectAllEl) selectAllEl.checked = all.length > 0 && all.length === checked.length;
}

function openEditModal(id){

  _subcontractCount = 0;
  document.getElementById('modalTitle').textContent = '编辑项目';

  document.getElementById('fProjectCategory').value = p.projectCategory || '1';
  onProjectCategoryChange();
  document.getElementById('fProjectNo').value = p.projectNo;
  document.getElementById('fProjectName').value = p.projectName;
  document.getElementById('fDomain').value = p.domainId;
  onDomainChange();
  setTimeout(function(){document.getElementById('fProjectType').value = p.projectType || '';},0);
  // 状态
  if(p.projectCategory === '2'){
    document.getElementById('fOperationStatus').value = p.projectStatus || '';
  }else{
    document.getElementById('fProjectStatus').value = p.projectStatus || '';
  }
  // 四级区划
  document.getElementById('fDistrict').value = p.regionCode || '';
  onDistrictChange();
  setTimeout(function(){
    document.getElementById('fStreet').value = p.streetCode || '';
    onStreetChange();
    setTimeout(function(){
      document.getElementById('fCommunity').value = p.communityCode || '';
      onCommunityChange();
      setTimeout(function(){
        document.getElementById('fGrid').value = p.gridCode || '';
      },0);
    },0);
  },0);
  document.getElementById('fAddress').value = p.address || '';
  document.getElementById('fSupervisionGroup').value = p.supervisionGroupId || '';
  document.getElementById('fDescription').value = p.description || '';
  // 四方责任体
  var parties = p.parties || [];
  var p1 = parties.find(function(x){return x.partyType===1;})||{};
  var p2 = parties.find(function(x){return x.partyType===2;})||{};
  var p3 = parties.find(function(x){return x.partyType===3;})||{};
  var subs = parties.filter(function(x){return x.partyType===4;});

  document.getElementById('fParty1Credit').value = p1.creditCode||'';
  document.getElementById('fParty1Contact').value = p1.contactName||'';

  document.getElementById('fParty3Contact').value = p3.contactName||'';
  document.getElementById('fParty3Phone').value = p3.contactPhone||'';
  // 分包
  document.getElementById('subcontractRows').innerHTML = '';
  subs.forEach(function(s, idx){
    addSubcontractor(s.partyName||'', s.creditCode||'', s.contactName||'', s.contactPhone||'');

function saveProject(){
  var projectCategory = document.getElementById('fProjectCategory').value;
  var projectNo = document.getElementById('fProjectNo').value.trim();
  var projectName = document.getElementById('fProjectName').value.trim();
  var domainId = document.getElementById('fDomain').value;
  var projectType = document.getElementById('fProjectType').value;
  var projectStatus = projectCategory === '2' ? document.getElementById('fOperationStatus').value : document.getElementById('fProjectStatus').value;
  var districtCode = document.getElementById('fDistrict').value;
  var streetCode = document.getElementById('fStreet').value;
  var communityCode = document.getElementById('fCommunity').value;
  var gridCode = document.getElementById('fGrid').value;
  var address = document.getElementById('fAddress').value.trim();
  var loginAccount = document.getElementById('fLoginAccount').value.trim();
  if(!projectCategory || !projectNo || !projectName || !domainId || !projectStatus || !districtCode || !streetCode || !communityCode || !gridCode || !address || !loginAccount){
    showToast('请填写所有必填项'); return;
  }
  // BR-08: 项目编号唯一性校验
  var dupNo = allProjects.find(function(x){return x.projectNo === projectNo && (!currentEditProject || x.id !== currentEditProject.id);});
  if(dupNo){ showToast('项目编号已存在，请勿重复'); return; }
  // BR-09: 登录账号唯一性校验（仅新增时）
  if(!currentEditProject){
    var dupAcc = allProjects.find(function(x){return x.loginAccount === loginAccount;});
    if(dupAcc){ showToast('登录账号已存在，请更换'); return; }
  }
  if(projectCategory !== '2' && !projectType){
    showToast('请选择项目小类'); return;
  }
  var domain = domainList.find(function(d){return d.id === domainId;});
  var districtName = districtData[districtCode] ? districtData[districtCode].name : '';
  var streetName = districtData[districtCode] && districtData[districtCode].streets[streetCode] ? districtData[districtCode].streets[streetCode] : '';
  var communityName = streetCommunityData[streetCode] && streetCommunityData[streetCode][communityCode] ? streetCommunityData[streetCode][communityCode] : '';
  var gridName = communityGridData[communityCode] && communityGridData[communityCode][gridCode] ? communityGridData[communityCode][gridCode] : '';
  var parties = [
    {partyType:1,partyTypeName:'建设单位',partyName:document.getElementById('fParty1Name').value.trim(),contactName:document.getElementById('fParty1Contact').value.trim(),contactPhone:document.getElementById('fParty1Phone').value.trim()},

    {partyType:3,partyTypeName:'监理单位',partyName:document.getElementById('fParty3Name').value.trim(),contactName:document.getElementById('fParty3Contact').value.trim(),contactPhone:document.getElementById('fParty3Phone').value.trim()}
  ];
  // 收集分包
  for(var i = 1; i <= _subcontractCount; i++){
    var sName = document.getElementById('fSubName_' + i);
    if(sName && sName.closest('.party-row')){
      parties.push({
        partyType:4,partyTypeName:'分包单位',
        partyName:sName.value.trim(),
        creditCode:document.getElementById('fSubCredit_' + i).value.trim(),
        contactName:document.getElementById('fSubContact_' + i).value.trim(),
        contactPhone:document.getElementById('fSubPhone_' + i).value.trim()
      });
    }
  }
  if(currentEditProject){
    currentEditProject.projectCategory = projectCategory;
    currentEditProject.projectNo = projectNo;
    currentEditProject.projectName = projectName;
    currentEditProject.domainId = domainId;
    currentEditProject.domainName = domain ? domain.name : '';
    currentEditProject.projectType = projectType;
    currentEditProject.projectStatus = projectStatus;
    currentEditProject.streetCode = streetCode;
    currentEditProject.streetName = streetName;
    currentEditProject.communityCode = communityCode;
    currentEditProject.communityName = communityName;
    currentEditProject.gridCode = gridCode;
    currentEditProject.gridName = gridName;
    currentEditProject.regionCode = districtCode;

// 街道树数据 — 从 STREETS 动态构建，数据源对齐"区划管理"模块
function buildStreetTreeData() {
  var rootNode = { code: DISTRICT_CODE, name: DISTRICT_NAME, count: 0, expanded: true, children: [] };
  var streetIdx = 1;
  STREETS.forEach(function(st) {
    var streetCode = DISTRICT_CODE + String(streetIdx).padStart(3, '0');
    var streetNode = { code: streetCode, name: st.name, count: 0, children: [] };
    var commIdx = 1;
    st.communities.forEach(function(comm) {
      var commCode = streetCode + String(commIdx).padStart(3, '0');
      var commNode = { code: commCode, name: comm.name, count: 0, children: [] };
      comm.grids.forEach(function(gridName, gi) {
        var gridCode = commCode + String(gi + 1).padStart(3, '0');
        commNode.children.push({ code: gridCode, name: gridName, count: 0 });
      });
      streetNode.children.push(commNode);
      commIdx++;
    });
    rootNode.children.push(streetNode);
    streetIdx++;
  });
  return [rootNode];
}
var streetTreeData = buildStreetTreeData();

// 计算每个节点的项目数量
function calcTreeCounts(data, getCount){
  data.forEach(function(node){
    if(node.children && node.children.length > 0){
      calcTreeCounts(node.children, getCount);
      node.count = node.children.reduce(function(sum, child){return sum + child.count;}, 0);
    }else if(getCount){
      node.count = getCount(node.code);
    }
  });
}

// 渲染树形
function renderTree(nodes, level, parentExpanded){
  if(!parentExpanded && level > 0) return '';
  var html = '<div class="tree-children" style="' + (level === 0 ? '' : 'padding-left: var(--spacing-md)') + '">';
  nodes.forEach(function(node){
    var hasChildren = node.children && node.children.length > 0;
    var isExpanded = node.expanded || false;
    var isActive = selectedTreeNode && selectedTreeNode.code === node.code;
    html += '<div class="tree-node ' + (isActive ? 'active' : '') + '" onclick="onTreeNodeClick(\'' + node.code + '\', \'' + node.name + '\', ' + level + ', event)" data-code="' + node.code + '">';
    html += '<span class="arrow ' + (isExpanded ? 'expanded' : '') + '" style="' + (hasChildren ? '' : 'visibility:hidden') + '" onclick="toggleTreeNode(\'' + node.code + '\', event)">▶</span>';
    html += '<span class="node-icon">' + (node.icon || (level === 0 ? DOMAIN_ICONS.FOLDER : (level === 1 ? DOMAIN_ICONS.FOLDER : (level === 2 ? DOMAIN_ICONS.TAG : DOMAIN_ICONS.TAG)))) + '</span>';
    html += '<span>' + node.name + '</span>';
    html += '<span class="node-count">' + node.count + '</span>';
    html += '</div>';
    if(hasChildren){
      html += renderTree(node.children, level + 1, isExpanded);
    }
  });
  html += '</div>';
  return html;
}

// 切换树节点展开/折叠
function toggleTreeNode(code, event){
  event.stopPropagation();
  var data = currentTreeTab === 'street' ? streetTreeData : domainTreeData;
  var node = findTreeNode(data, code);
  if(node){
    node.expanded = !node.expanded;
    refreshTree();
  }
}

// 查找树节点
function findTreeNode(nodes, code){
  for(var i = 0; i < nodes.length; i++){
    if(nodes[i].code === code) return nodes[i];
    if(nodes[i].children){
      var found = findTreeNode(nodes[i].children, code);
      if(found) return found;
    }
  }
  return null;
}

// 点击树节点
function onTreeNodeClick(code, name, level, event){
  event.stopPropagation();
  selectedTreeNode = {type: currentTreeTab, code: code, name: name, level: level};
  refreshTree();
  // 触发筛选
  applyTreeFilter();
}

// 应用树形筛选
function applyTreeFilter(){
  if(!selectedTreeNode){
    filteredProjects = allProjects.slice();
  }else if(selectedTreeNode.type === 'street'){
    // 街道筛选：匹配该节点及其子节点的所有项目
    var codes = getTreeNodeDescendants(currentTreeTab === 'street' ? streetTreeData : domainTreeData, selectedTreeNode.code);
    filteredProjects = allProjects.filter(function(p){
      return codes.indexOf(p.regionCode) >= 0 || codes.indexOf(p.streetCode) >= 0 || 
             codes.indexOf(p.communityCode) >= 0 || codes.indexOf(p.gridCode) >= 0;
    });
  }else{
    // 领域筛选：匹配领域小类
    filteredProjects = allProjects.filter(function(p){
      return p.domainCode === selectedTreeNode.code || p.domainCode && p.domainCode.indexOf(selectedTreeNode.code) === 0;
    });
  }
  pgState.page = 1;
  pg.setPage(1);
  updateStats();
  renderTable();
}

// 获取节点及其所有子孙的code
function getTreeNodeDescendants(nodes, code){
  var result = [code];
  var node = findTreeNode(nodes, code);
  if(node && node.children){
    node.children.forEach(function(child){
      result = result.concat(getTreeNodeDescendants(nodes, child.code));
    });
  }
  return result;
}

// 刷新树形显示
function refreshTree(keyword){
  var data = currentTreeTab === 'street' ? streetTreeData : domainTreeData;
  if(keyword){
    data = filterTreeData(JSON.parse(JSON.stringify(data)), keyword);
  }
  document.getElementById('treeContent').innerHTML = renderTree(data, 0, true);
}

// 过滤树数据
function filterTreeData(nodes, keyword){
  var result = [];
  for(var i = 0; i < nodes.length; i++){
    var node = nodes[i];
    var match = node.name.toLowerCase().indexOf(keyword) !== -1;
    var filteredChildren = null;
    if(node.children){
      filteredChildren = filterTreeData(node.children, keyword);
      if(filteredChildren.length > 0){
        match = true;
        node.children = filteredChildren;
      }
    }
    if(match){
      result.push(node);
    }
  }
  return result;
}

// 初始化树形
function initTree(){
  // 计算数量
  calcTreeCounts(streetTreeData, function(code){
    return allProjects.filter(function(p){return p.regionCode === code || p.streetCode === code || p.communityCode === code || p.gridCode === code;}).length;
  });
  calcTreeCounts(domainTreeData, function(code){
    return allProjects.filter(function(p){return p.domainCode === code || (p.domainCode && p.domainCode.indexOf(code) === 0);}).length;
  });
  refreshTree();
}

// 企业选择弹窗分页变量
var _entCurrentPage = 1;
var _entPageSize = 10;
var _entFilteredData = [];

function openEnterpriseSelect(partyType, subIndex){
  _currentSelectParty = partyType;
  _currentSelectSubIndex = subIndex || 0;
  _entCurrentPage = 1;
  document.getElementById('entSearchKeyword').value = '';
  document.getElementById('enterpriseSelectModal').classList.add('show');
  renderEnterpriseList();
}

function renderEnterpriseList(){
  var keyword = document.getElementById('entSearchKeyword').value.trim().toLowerCase();
  var tbody = document.getElementById('enterpriseTableBody');
  _entFilteredData = enterpriseData.filter(function(e){
    return !keyword || e.name.toLowerCase().includes(keyword) || e.creditCode.includes(keyword);
  });
  
  if(_entFilteredData.length === 0){
    tbody.innerHTML = '<tr><td colspan="4" class="no-data">暂无数据</td></tr>';
    document.getElementById('enterprisePageInfo').textContent = '共 0 条';
    document.getElementById('enterprisePageBtns').innerHTML = '';
    return;
  }
  
  var total = _entFilteredData.length;
  var totalPages = Math.ceil(total / _entPageSize);
  if(_entCurrentPage > totalPages) _entCurrentPage = totalPages;
  var start = (_entCurrentPage - 1) * _entPageSize;
  var end = Math.min(start + _entPageSize, total);
  var pageData = _entFilteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(function(e, idx){
    return '<tr>' +
      '<td>' + (start + idx + 1) + '</td>' +
      '<td>' + e.name + '</td>' +
      '<td>' + e.creditCode + '</td>' +
      '<td class="action-col"><button class="btn btn-primary btn-sm" onclick="selectEnterprise(' + e.id + ')">选择</button></td>' +
      '</tr>';
  }).join('');
  
  // 更新分页信息
  document.getElementById('enterprisePageInfo').textContent = '共 ' + total + ' 条，第 ' + _entCurrentPage + '/' + totalPages + ' 页';
  
  // 渲染分页按钮
  var pageBtns = '';
  for(var i = 1; i <= totalPages; i++){
    pageBtns += '<button class="' + (i === _entCurrentPage ? 'active' : '') + '" onclick="goEnterprisePage(' + i + ')">' + i + '</button>';
  }
  document.getElementById('enterprisePageBtns').innerHTML = pageBtns;
}

function goEnterprisePage(page){
  _entCurrentPage = page;
  renderEnterpriseList();
}

function jumpEnterprisePage(){
  var input = document.getElementById('enterpriseJumpInput');
  var page = parseInt(input.value);
  var totalPages = Math.ceil(_entFilteredData.length / _entPageSize);
  if(page >= 1 && page <= totalPages){
    goEnterprisePage(page);
    input.value = '';
  }else{
    showToast('请输入有效的页码（1-' + totalPages + '）');
  }
}

function selectEnterprise(entId){
  var ent = enterpriseData.find(function(e){return e.id === entId;});
  if(!ent) return;
  
  if(_currentSelectParty === 1){
    document.getElementById('fParty1Name').value = ent.name;
    document.getElementById('fParty1Credit').value = ent.creditCode;
  }else if(_currentSelectParty === 2){
    document.getElementById('fParty2Name').value = ent.name;
    document.getElementById('fParty2Credit').value = ent.creditCode;
  }else if(_currentSelectParty === 3){
    document.getElementById('fParty3Name').value = ent.name;
    document.getElementById('fParty3Credit').value = ent.creditCode;
  }else if(_currentSelectParty === 4 && _currentSelectSubIndex > 0){
    document.getElementById('fSubName_' + _currentSelectSubIndex).value = ent.name;
    document.getElementById('fSubCredit_' + _currentSelectSubIndex).value = ent.creditCode;
  }
  closeModal('enterpriseSelectModal');
  showToast('已选择企业：' + ent.name);
}
