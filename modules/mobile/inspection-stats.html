<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>检查记录</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    body { background: #f5f7fb; }
    .ir-top {
      display: flex; align-items: center; height: 44px; padding: 0 12px;
      background: #2f7bff; color: #fff; position: sticky; top: 0; z-index: 20;
    }
    .ir-back {
      width: 32px; height: 32px; border: 0; background: transparent; color: #fff;
      display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    }
    .ir-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; margin-right: 32px; }
    .ir-tabs { display: flex; background: #fff; }
    .ir-tab {
      flex: 1; height: 44px; border: 0; background: #fff; color: #86909c;
      font-size: 15px; position: relative; cursor: pointer;
    }
    .ir-tab.on { color: #2f7bff; font-weight: 600; }
    .ir-tab.on::after {
      content: ''; position: absolute; left: 50%; bottom: 0; width: 28px; height: 2px;
      margin-left: -14px; background: #2f7bff; border-radius: 1px;
    }
    .ir-card {
      background: #fff; border-radius: 12px; margin: 12px 16px;
      padding: 14px 16px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative;
    }
    .ir-chart { min-height: 196px; }
    .ir-filter {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border: 0; background: transparent; color: #4e5969; cursor: pointer; padding: 0;
    }
    .ir-chart-main { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 28px 28px 0 0; }
    .ir-tip {
      position: static; flex: 0 0 auto; min-width: 88px;
      background: #fff; border-radius: 8px; padding: 8px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); text-align: left;
    }
    .ir-tip-name { font-size: 13px; color: #1d2129; }
    .ir-tip-num { font-size: 16px; font-weight: 700; color: #1d2129; line-height: 1.3; }
    .ir-tip-pct { font-size: 16px; font-weight: 700; color: #1d2129; }
    .ir-donut-wrap { width: 150px; height: 150px; position: relative; flex: 0 0 auto; }
    .ir-donut-wrap svg { width: 100%; height: 100%; display: block; }
    .ir-donut-wrap path { cursor: pointer; }
    .ir-center {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: #1d2129; pointer-events: none;
    }
    .ir-legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding-top: 4px; }
    .ir-legend button {
      border: 0; background: none; display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; color: #4e5969; cursor: pointer; padding: 0;
    }
    .ir-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .ir-sec-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #1d2129; }
    .ir-sec-title i { width: 3px; height: 14px; border-radius: 2px; background: #2f7bff; }
    .ir-sub { margin: 8px 0 10px; font-size: 14px; color: #4e5969; }
    .ir-row + .ir-row { margin-top: 14px; }
    .ir-row-name { font-size: 14px; color: #1d2129; margin-bottom: 8px; }
    .ir-metrics { display: grid; gap: 8px; }
    .ir-metrics.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .ir-metrics.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .ir-metric { background: #f4f6f8; border-radius: 8px; text-align: center; padding: 10px 2px 8px; }
    .ir-metric b { display: block; font-size: 18px; line-height: 1.2; font-weight: 700; }
    .ir-metric span { display: block; margin-top: 4px; font-size: 12px; color: #86909c; }
    .ir-list { padding-bottom: 16px; }
  </style>
</head>
<body>
  <div class="m-page">
    <div class="ir-top" id="irTop">
      <button class="ir-back" type="button" onclick="irBack()" aria-label="返回">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2L2 10L10 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="ir-title">检查记录</div>
    </div>
    <div class="ir-tabs" id="irTabs"></div>
    <div class="ir-card ir-chart" id="irChart"></div>
    <div id="irList" class="ir-list"></div>
  </div>

  <script>
    var GOV = [
      { name: '行业监管', color: '#22c55e', org: '南山区应急管理局', checks: 6, hazards: 4, rate: 75 },
      { name: '属地监管', color: '#2f7bff', org: '粤海街道办', checks: 4, hazards: 2, rate: 50 },
      { name: '专业监管', color: '#8aa0b8', org: '区消防救援大队', checks: 7, hazards: 3, rate: 67 }
    ];
    var ENT_SELF = { name: '企业检查', color: '#22c55e', checks: 50, hazards: 20, rate: 40 };
    var PLACES = [
      { name: '储罐区', checks: 12, hazards: 8, pending: 2 },
      { name: '危化品中间仓库', checks: 10, hazards: 6, pending: 3 },
      { name: '污水站', checks: 8, hazards: 4, pending: 1 },
      { name: '消防水泵及水箱', checks: 9, hazards: 5, pending: 2 },
      { name: '配电房', checks: 7, hazards: 3, pending: 0 },
      { name: '锅炉房', checks: 6, hazards: 4, pending: 1 }
    ];
    var HAZARDS = [
      { name: '危险源名称1', checks: 14, hazards: 9, pending: 3 },
      { name: '危险源名称2', checks: 12, hazards: 5, pending: 1 },
      { name: '危险源名称3', checks: 12, hazards: 7, pending: 4 }
    ];

    var tab = 'gov';
    var active = 0;

    function sumChecks(list) {
      return list.reduce(function(n, item) { return n + item.checks; }, 0);
    }
    function rateOf(item) {
      if (!item.hazards) return 0;
      return Math.round((item.hazards - item.pending) / item.hazards * 100);
    }
    function pctText(part, total) {
      if (!total) return '0%';
      var n = Math.round(part / total * 1000) / 10;
      return (n % 1 === 0 ? String(n) : n.toFixed(1)) + '%';
    }
    function slicesOf(which) {
      if (which === 'gov') {
        return GOV.map(function(item) {
          return { name: item.name, color: item.color, checks: item.checks };
        });
      }
      return [
        { name: ENT_SELF.name, color: ENT_SELF.color, checks: ENT_SELF.checks },
        { name: '场所检查', color: '#2f7bff', checks: sumChecks(PLACES) },
        { name: '危险源检查', color: '#8aa0b8', checks: sumChecks(HAZARDS) }
      ];
    }
    function totalOf(which) {
      return sumChecks(slicesOf(which));
    }
    function arcPath(cx, cy, r, start, end) {
      var s = (start - 90) * Math.PI / 180;
      var e = (end - 90) * Math.PI / 180;
      var x1 = cx + r * Math.cos(s);
      var y1 = cy + r * Math.sin(s);
      var x2 = cx + r * Math.cos(e);
      var y2 = cy + r * Math.sin(e);
      var large = end - start > 180 ? 1 : 0;
      return 'M ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2);
    }
    function metric(value, label, color) {
      return '<div class="ir-metric"><b style="color:' + color + '">' + value + '</b><span>' + label + '</span></div>';
    }
    function threeMetrics(checks, hazards, rate) {
      return '<div class="ir-metrics cols-3">' +
        metric(checks, '检查次数', '#2f7bff') +
        metric(hazards, '隐患数', '#fa8c16') +
        metric(rate + '%', '整改率', '#52c41a') +
        '</div>';
    }
    function fourMetrics(item) {
      return '<div class="ir-metrics cols-4">' +
        metric(item.checks, '检查次数', '#2f7bff') +
        metric(item.hazards, '隐患数', '#fa8c16') +
        metric(item.pending, '待整改', '#ff4d4f') +
        metric(rateOf(item) + '%', '整改率', '#52c41a') +
        '</div>';
    }
    function renderTabs() {
      var govN = totalOf('gov');
      var entN = totalOf('ent');
      document.getElementById('irTabs').innerHTML =
        '<button type="button" class="ir-tab' + (tab === 'gov' ? ' on' : '') + '" data-tab="gov">政府巡查 (' + govN + ')</button>' +
        '<button type="button" class="ir-tab' + (tab === 'ent' ? ' on' : '') + '" data-tab="ent">企业自查 (' + entN + ')</button>';
    }
    function renderChart() {
      var slices = slicesOf(tab);
      var total = totalOf(tab);
      var current = slices[active] || slices[0];
      var cx = 80, cy = 80, r = 56, gap = 3;
      var usable = 360 - gap * slices.length;
      var cursor = 0;
      var paths = '';
      slices.forEach(function(slice, index) {
        var sweep = total ? usable * slice.checks / total : 0;
        var start = cursor + gap / 2;
        var end = start + Math.max(sweep, 0.01);
        cursor += sweep + gap;
        var width = index === active ? 20 : 16;
        paths += '<path d="' + arcPath(cx, cy, r, start, end) + '" stroke="' + slice.color + '" stroke-width="' + width + '" fill="none" stroke-linecap="butt" data-i="' + index + '"></path>';
      });
      var legend = slices.map(function(slice, index) {
        return '<button type="button" data-i="' + index + '"><i class="ir-dot" style="background:' + slice.color + '"></i>' + slice.name + '</button>';
      }).join('');
      document.getElementById('irChart').innerHTML =
        '<button type="button" class="ir-filter" id="irFilter" aria-label="筛选">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5z"/></svg>' +
        '</button>' +
        '<div class="ir-chart-main"><div class="ir-donut-wrap"><svg viewBox="0 0 160 160">' + paths + '</svg><div class="ir-center">' + total + '</div></div>' +
        '<div class="ir-tip"><div class="ir-tip-name">' + current.name + '</div><div class="ir-tip-num">' + current.checks + '</div><div class="ir-tip-pct">' + pctText(current.checks, total) + '</div></div></div>' +
        '<div class="ir-legend">' + legend + '</div>';
    }
    function renderList() {
      var html = '';
      if (tab === 'gov') {
        GOV.forEach(function(item) {
          html += '<div class="ir-card ir-block"><div class="ir-sec-title"><i></i>' + item.name + '</div>' +
            '<div class="ir-sub">' + item.org + '</div>' + threeMetrics(item.checks, item.hazards, item.rate) + '</div>';
        });
      } else {
        html += '<div class="ir-card"><div class="ir-sec-title"><i></i>企业检查</div><div style="height:10px"></div>' +
          threeMetrics(ENT_SELF.checks, ENT_SELF.hazards, ENT_SELF.rate) + '</div>';
        html += '<div class="ir-card"><div class="ir-sec-title"><i></i>场所检查</div>';
        PLACES.forEach(function(item) {
          html += '<div class="ir-row"><div class="ir-row-name">' + item.name + '</div>' + fourMetrics(item) + '</div>';
        });
        html += '</div>';
        html += '<div class="ir-card"><div class="ir-sec-title"><i></i>危险源检查</div>';
        HAZARDS.forEach(function(item) {
          html += '<div class="ir-row"><div class="ir-row-name">' + item.name + '</div>' + fourMetrics(item) + '</div>';
        });
        html += '</div>';
      }
      document.getElementById('irList').innerHTML = html;
    }
    function render() {
      var slices = slicesOf(tab);
      if (active >= slices.length) active = 0;
      renderTabs();
      renderChart();
      renderList();
    }
    function irBack() {
      if (window.parent && window.parent !== window && typeof window.parent.mobileBack === 'function') {
        window.parent.mobileBack();
      } else {
        location.href = 'enterprise-code.html';
      }
    }
    document.getElementById('irTabs').addEventListener('click', function(event) {
      var btn = event.target.closest('.ir-tab');
      if (!btn) return;
      tab = btn.getAttribute('data-tab');
      active = 0;
      render();
    });
    document.getElementById('irChart').addEventListener('click', function(event) {
      var hit = event.target.closest('[data-i]');
      if (!hit) return;
      active = Number(hit.getAttribute('data-i'));
      renderChart();
    });
    if (window.parent && window.parent !== window) {
      document.getElementById('irTop').style.display = 'none';
    }
    render();
  </script>
  <script src="../../js/mobile-session.js"></script>
  <script src="../../js/annotations.js"></script>
</body>
</html>
