<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的中心</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .pf-gradient {
      position: fixed; top: 0; left: 0; right: 0; height: 350px; z-index: 0;
      background: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, #f5f7fa 100%);
      pointer-events: none;
    }
    .pf-gradient::before {
      content: ''; position: absolute; top: -20px; right: -10px; width: 180px; height: 180px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .pf-gradient::after {
      content: ''; position: absolute; top: 100px; left: -30px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .pf-header {
      padding: 107px 16px 24px; position: relative; z-index: 1;
    }
    .pf-top { display: flex; align-items: center; }
    .pf-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center;
      margin-right: 14px; border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0;
      position: relative; cursor: pointer;
    }
    .pf-avatar-hint {
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: rgba(255,255,255,0.7); white-space: nowrap;
    }
    .pf-avatar svg { width: 28px; height: 28px; }
    .pf-info { flex: 1; }
    .pf-name { font-size: 18px; font-weight: 600; color: #fff; }
    .pf-role { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 2px; }

    .pf-user-card {
      background: #fff; border-radius: 12px; padding: 16px; margin: -14px 16px 10px;
      position: relative; z-index: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex; align-items: center; gap: 14px;
    }
    .pf-user-code { flex-shrink: 0; text-align: center; }
    .pf-user-code-ring {
      width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative;
    }
    .pf-user-code-ring svg { width: 28px; height: 28px; }
    .pf-user-code-ring.green { background: linear-gradient(135deg, #a8f0b8, #52d47a); }
    .pf-user-code-ring.yellow { background: linear-gradient(135deg, #ffe08a, #faad14); }
    .pf-user-code-ring.red { background: linear-gradient(135deg, #ffa8a8, #ff4d4f); }
    .pf-user-code-label { font-size: 12px; color: #52c41a; font-weight: 600; margin-top: 4px; }
    .pf-user-detail { flex: 1; }
    .pf-user-name { font-size: 16px; font-weight: 600; color: #000; }
    .pf-user-role-text { font-size: 13px; color: #999; margin-top: 2px; }
    .pf-user-link { font-size: 12px; color: #576b95; margin-top: 6px; cursor: pointer; }

    .pf-card {
      background: #fff; border-radius: 10px; padding: 14px 16px; margin: 10px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .pf-card-title {
      font-size: 15px; font-weight: 600; color: #000; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pf-card-extra { font-size: 13px; color: #576b95; font-weight: 400; cursor: pointer; }

    .pf-safety-ring-wrap { display: flex; align-items: center; gap: 16px; }
    .pf-safety-ring { width: 90px; height: 90px; border-radius: 50%; flex-shrink: 0; position: relative; }
    .pf-safety-ring-inner {
      position: absolute; top: 18px; left: 18px; width: 54px; height: 54px;
      border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; color: #000;
    }
    .pf-safety-legend { flex: 1; }
    .pf-safety-legend-item { font-size: 13px; color: #333; margin-bottom: 6px; display: flex; align-items: center; }
    .pf-safety-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

    .progress-item { margin-bottom: 10px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 4px; }

    .pf-menu-item { display: flex; align-items: center; padding: 14px 16px; background: #fff; border-bottom: 0.5px solid #f0f0f0; cursor: pointer; }
    .pf-menu-item:active { background: #f5f5f5; }
    .pf-menu-icon { width: 24px; height: 24px; margin-right: 12px; display: flex; align-items: center; justify-content: center; }
    .pf-menu-icon svg { width: 18px; height: 18px; }
    .pf-menu-label { flex: 1; font-size: 15px; color: #000; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pf-menu-arrow { color: #ccc; font-size: 14px; }

    .pf-logout {
      display: block; width: calc(100% - 32px); margin: 24px 16px; padding: 12px;
      border: 1px solid #ff4d4f; border-radius: 8px; font-size: 15px; color: #ff4d4f;
      background: #fff; text-align: center; cursor: pointer;
    }
    .pf-logout:active { background: #fff2f0; }
    .m-toast {
      position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.78); color: #fff; padding: 10px 24px;
      border-radius: 8px; font-size: 14px; z-index: 200;
      transition: top 0.3s ease; white-space: nowrap;
    }
    .m-toast.show { top: 60px; }
  </style>
</head>
<body>
  <div class="m-page with-tabbar" style="background:#f5f7fa;">
    <div class="pf-gradient"></div>
    <div class="pf-header">
      <div class="pf-top">
        <div class="pf-avatar" onclick="showToast('头像更换功能开发中')"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="pf-avatar-hint">点击更换头像</span></div>
        <div class="pf-info">
          <div class="pf-name">李安全</div>
          <div class="pf-role">安全主管 · 管理层</div>
        </div>
      </div>

      <div class="pf-user-card" style="margin-top:16px;">
        <div class="pf-user-code">
          <div class="pf-user-code-ring green">
            <!-- 锁形图标 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </div>
          <div class="pf-user-code-label">绿色 - 正常</div>
        </div>
        <div class="pf-user-detail">
          <div class="pf-user-name">李安全</div>
          <div class="pf-user-role-text">安全主管 · 创安电子科技</div>
          <div class="pf-user-link" onclick="parent.navigateTo('code-change')">查看变码记录 ›</div>
        </div>
      </div>
    </div>

    <!-- 人员画像 - 雷达图 -->
    <div class="pf-card">
      <div class="pf-card-title">人员画像</div>
      <div style="display:flex;justify-content:center;margin-bottom:8px;">
        <svg width="200" height="180" viewBox="0 0 200 180">
          <!-- 五边形网格 -->
          <polygon points="100,15 178,65 155,150 45,150 22,65" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <polygon points="100,36 158,74 140,138 60,138 42,74" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <polygon points="100,57 138,83 125,126 75,126 62,83" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <polygon points="100,78 118,92 110,114 90,114 82,92" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <!-- 轴线 -->
          <line x1="100" y1="15" x2="100" y2="150" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="22" y1="65" x2="178" y2="150" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="178" y1="65" x2="22" y2="150" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="100" y1="150" x2="100" y2="15" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="22" y1="65" x2="178" y2="65" stroke="#e8e8e8" stroke-width="0.5"/>
          <!-- 数据区域 - 检查次数85% 按期履职率92% 隐患排查数58% 整改完成率78% 安全培训70% -->
          <polygon points="100,27 166,70 132,138 60,126 44,74" fill="rgba(31,147,234,0.15)" stroke="#1f93ea" stroke-width="1.5"/>
          <!-- 数据点 -->
          <circle cx="100" cy="27" r="3" fill="#1f93ea"/>
          <circle cx="166" cy="70" r="3" fill="#1f93ea"/>
          <circle cx="132" cy="138" r="3" fill="#1f93ea"/>
          <circle cx="60" cy="126" r="3" fill="#1f93ea"/>
          <circle cx="44" cy="74" r="3" fill="#1f93ea"/>
          <!-- 标签 -->
          <text x="100" y="8" text-anchor="middle" font-size="10" fill="#333">检查次数</text>
          <text x="187" y="62" text-anchor="start" font-size="10" fill="#333">按期履职</text>
          <text x="163" y="165" text-anchor="middle" font-size="10" fill="#333">隐患排查</text>
          <text x="37" y="165" text-anchor="middle" font-size="10" fill="#333">整改完成</text>
          <text x="10" y="62" text-anchor="end" font-size="10" fill="#333">安全培训</text>
          <!-- 数值 -->
          <text x="100" y="22" text-anchor="middle" font-size="8" fill="#1f93ea" font-weight="600">85%</text>
          <text x="172" y="68" text-anchor="start" font-size="8" fill="#1f93ea" font-weight="600">92%</text>
          <text x="138" y="144" text-anchor="middle" font-size="8" fill="#1f93ea" font-weight="600">58%</text>
          <text x="54" y="132" text-anchor="middle" font-size="8" fill="#1f93ea" font-weight="600">78%</text>
          <text x="38" y="72" text-anchor="end" font-size="8" fill="#1f93ea" font-weight="600">70%</text>
        </svg>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>检查完成率</span><span>85%</span></div>
        <div class="progress-bar"><div class="progress-fill blue" style="width:85%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>按期履职率</span><span>92%</span></div>
        <div class="progress-bar"><div class="progress-fill green" style="width:92%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>隐患排查数</span><span>7项</span></div>
        <div class="progress-bar"><div class="progress-fill yellow" style="width:58%"></div></div>
      </div>
      <div class="progress-item" style="margin-bottom:0;">
        <div class="progress-label"><span>按期整改率</span><span>78%</span></div>
        <div class="progress-bar"><div class="progress-fill green" style="width:78%"></div></div>
      </div>
    </div>

    <!-- 安全管控 -->
    <div class="pf-card">
      <div class="pf-card-title">安全管控 <span class="pf-card-extra" onclick="parent.navigateTo('control-list')">查看详情 ›</span></div>
      <div class="pf-safety-ring-wrap">
        <div class="pf-safety-ring" style="background:conic-gradient(#52c41a 0% 67%, #faad14 67% 100%);">
          <div class="pf-safety-ring-inner">3</div>
        </div>
        <div class="pf-safety-legend">
          <div class="pf-safety-legend-item"><span class="pf-safety-dot" style="background:#52c41a"></span>绿色 2个</div>
          <div class="pf-safety-legend-item"><span class="pf-safety-dot" style="background:#faad14"></span>黄色 1个</div>
          <div class="pf-safety-legend-item"><span class="pf-safety-dot" style="background:#ff4d4f"></span>红色 0个</div>
          <div style="font-size:11px;color:#999;margin-top:2px;">负责管控单元 3个</div>
        </div>
      </div>
    </div>

    <!-- 人员履职 -->
    <div class="pf-card">
      <div class="pf-card-title">人员履职</div>
      <div class="progress-item">
        <div class="progress-label"><span>本年履职任务</span><span>24/28</span></div>
        <div class="progress-bar"><div class="progress-fill blue" style="width:86%"></div></div>
      </div>
      <div class="progress-item" style="margin-bottom:0;">
        <div class="progress-label"><span>专项调度检查</span><span>5/6</span></div>
        <div class="progress-bar"><div class="progress-fill green" style="width:83%"></div></div>
      </div>
    </div>

    <!-- 隐患统计 -->
    <div class="pf-card">
      <div class="pf-card-title">隐患统计 <span class="pf-card-extra" onclick="parent.navigateTo('my-hazards')">查看详情 ›</span></div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <div style="flex:1;text-align:center;padding:8px 0;background:#f8f9fa;border-radius:8px;">
          <div style="font-size:20px;font-weight:700;">12</div><div style="font-size:11px;color:#999;">隐患总数</div>
        </div>
        <div style="flex:1;text-align:center;padding:8px 0;background:#f8f9fa;border-radius:8px;">
          <div style="font-size:20px;font-weight:700;color:#1f93ea;">7</div><div style="font-size:11px;color:#999;">我排查的</div>
        </div>
        <div style="flex:1;text-align:center;padding:8px 0;background:#f8f9fa;border-radius:8px;">
          <div style="font-size:20px;font-weight:700;color:#faad14;">5</div><div style="font-size:11px;color:#999;">我整改的</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
        <div class="ring-chart" style="background:conic-gradient(#ff4d4f 0% 17%, #faad14 17% 42%, #52c41a 42% 100%);width:70px;height:70px;">
          <div class="ring-chart-inner" style="top:12px;left:12px;width:46px;height:46px;font-size:12px;">12</div>
        </div>
        <div style="font-size:12px;color:#666;line-height:1.8;">
          <span style="color:#ff4d4f">●</span> 未整改 2<br>
          <span style="color:#faad14">●</span> 整改中 3<br>
          <span style="color:#52c41a">●</span> 已整改 7
        </div>
      </div>
    </div>

    <div class="m-divider"></div>

    <!-- 菜单 -->
    <div style="margin:0 16px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
      <div class="pf-menu-item" onclick="parent.navigateTo('scan')">
        <span class="pf-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1068ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><line x1="6.5" y1="6.5" x2="8" y2="6.5"/><line x1="6.5" y1="6.5" x2="6.5" y2="8"/><line x1="17.5" y1="6.5" x2="16" y2="6.5"/><line x1="17.5" y1="6.5" x2="17.5" y2="8"/><line x1="6.5" y1="17.5" x2="8" y2="17.5"/><line x1="6.5" y1="17.5" x2="6.5" y2="16"/><line x1="17.5" y1="17.5" x2="16" y2="17.5"/><line x1="17.5" y1="17.5" x2="17.5" y2="16"/></svg></span><span class="pf-menu-label">扫一扫</span><span class="pf-menu-arrow">›</span>
      </div>
      <div class="pf-menu-item" onclick="parent.navigateTo('code-change')">
        <span class="pf-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#722ed1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></span><span class="pf-menu-label">变码记录</span><span class="pf-menu-arrow">›</span>
      </div>
      <div class="pf-menu-item" onclick="showToast('密码修改页面（原型演示）')">
        <span class="pf-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fa8c16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span><span class="pf-menu-label">密码修改</span><span class="pf-menu-arrow">›</span>
      </div>
      <div class="pf-menu-item" style="border-bottom:none;">
        <span class="pf-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span><span class="pf-menu-label">关于</span><span class="pf-menu-arrow">›</span>
      </div>
    </div>

    <button class="pf-logout" onclick="parent.navigateTo('login')">退出登录</button>

    <div style="height:20px;"></div>
  </div>

  <!-- Toast提示 -->
  <div class="m-toast" id="mToast"></div>

  <script>
    function showToast(msg, duration) {
      var toast = document.getElementById('mToast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, duration || 2000);
    }
  </script>
</body>
</html>
