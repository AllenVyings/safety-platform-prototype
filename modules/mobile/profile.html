<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人码</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .pf-gradient { display: none; }
    .m-page {
      position: relative; overflow: hidden; background-color: var(--wc-page-bg);
      background-image: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, var(--wc-page-bg) 100%);
      background-size: 100% 350px; background-repeat: no-repeat; background-position: top;
    }
    .m-page::before {
      content: ''; position: absolute; top: 110px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .m-page::after {
      content: ''; position: absolute; top: 220px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .pf-header { padding: 107px 0 0; }
    .pf-code-card {
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: var(--wc-page-padding); text-align: center;
      box-shadow: var(--wc-shadow-card); position: relative; z-index: 1;
    }
    .pf-card-icons {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2;
    }
    .pf-card-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: var(--wc-page-bg);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .pf-card-icon-btn:active { background: var(--wc-icon-btn-active); }
    .pf-card-icon-btn svg { width: 16px; height: 16px; }
    .pf-code-name { font-size: var(--wc-font-title); font-weight: 700; color: var(--wc-text-primary); text-align: left; margin-bottom: var(--wc-gap-xl); }
    .pf-code-name .pf-role-tag { font-size: var(--wc-font-small); font-weight: 400; color: var(--wc-text-placeholder); margin-left: 6px; }
    .pf-qr-wrap {
      width: 180px; height: 180px; margin: 0 auto 8px;
      padding: var(--wc-gap-lg); border: 4px solid var(--wc-code-border-green); border-radius: var(--wc-card-radius);
      background: var(--wc-card-bg); cursor: pointer;
    }
    .pf-qr-wrap.yellow { border-color: var(--wc-code-border-yellow); }
    .pf-qr-wrap.red { border-color: #ffa39e; }
    .pf-qr-time { font-size: var(--wc-font-tiny); color: var(--wc-text-disabled); margin-top: var(--wc-gap-sm); }
    .pf-code-status-row {
      display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-xl); margin-top: var(--wc-gap-md);
    }
    .pf-code-badge {
      display: inline-flex; align-items: center; gap: var(--wc-gap-sm);
      font-size: var(--wc-font-small); font-weight: 600;
    }
    .pf-code-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .pf-code-link { font-size: var(--wc-font-small); color: var(--wc-blue); cursor: pointer; }
    .pf-code-link:active { opacity: 0.7; }
    .pf-action-row { display: flex; gap: var(--wc-gap-md); margin-top: var(--wc-gap-lg); }
    .pf-action-row button {
      font-size: var(--wc-font-small); padding: var(--wc-gap-md) 0; border-radius: var(--wc-btn-radius);
      display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-sm);
      cursor: pointer;
    }
    .pf-action-row svg { width: 14px; height: 14px; flex-shrink: 0; }

    .pf-card {
      background: var(--wc-card-bg); border-radius: var(--wc-gap-lg); padding: 14px var(--wc-page-padding); margin: var(--wc-gap-lg) var(--wc-page-padding);
      box-shadow: var(--wc-shadow-card-sm);
    }
    .pf-card-title {
      font-size: var(--wc-font-body); font-weight: 600; color: var(--wc-text-primary); margin-bottom: var(--wc-gap-xl);
      display: flex; align-items: center; justify-content: space-between;
    }
    .pf-card-extra { font-size: var(--wc-font-small); color: var(--wc-blue); font-weight: 400; cursor: pointer; }

    .pf-safety-ring-wrap { display: flex; align-items: center; gap: var(--wc-page-padding); }
    .pf-safety-ring { width: 90px; height: 90px; border-radius: 50%; flex-shrink: 0; position: relative; }
    .pf-safety-ring-inner {
      position: absolute; top: 18px; left: 18px; width: 54px; height: 54px;
      border-radius: 50%; background: var(--wc-card-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--wc-gap-lg); font-weight: 600; color: var(--wc-text-primary);
    }
    .pf-safety-legend { flex: 1; }
    .pf-safety-legend-item { font-size: var(--wc-font-small); color: var(--wc-text-secondary); margin-bottom: 6px; display: flex; align-items: center; }
    .pf-safety-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: var(--wc-gap-md); flex-shrink: 0; }

    .progress-item { margin-bottom: var(--wc-gap-lg); }
    .progress-label { display: flex; justify-content: space-between; font-size: var(--wc-font-small); color: var(--wc-text-tertiary); margin-bottom: var(--wc-gap-sm); }

    .pf-menu-item { display: flex; align-items: center; padding: 14px var(--wc-page-padding); background: var(--wc-card-bg); border-bottom: 0.5px solid var(--wc-track-bg); cursor: pointer; }
    .pf-menu-item:active { background: #f5f5f5; }
    .pf-menu-icon { width: 24px; height: 24px; margin-right: var(--wc-gap-xl); display: flex; align-items: center; justify-content: center; }
    .pf-menu-icon svg { width: 18px; height: 18px; }
    .pf-menu-label { flex: 1; font-size: var(--wc-font-body); color: var(--wc-text-primary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pf-menu-arrow { color: var(--wc-text-disabled); font-size: var(--wc-font-caption); }

    .pf-logout {
      display: block; width: calc(100% - 32px); margin: 24px var(--wc-page-padding); padding: var(--wc-gap-xl);
      border: 1px solid var(--danger); border-radius: var(--wc-btn-radius); font-size: var(--wc-font-body); color: var(--danger);
      background: var(--wc-card-bg); text-align: center; cursor: pointer;
    }
    .pf-logout:active { background: var(--wc-code-bg-red); }
    .m-toast {
      position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.78); color: var(--wc-card-bg); padding: var(--wc-gap-lg) 24px;
      border-radius: var(--wc-btn-radius); font-size: var(--wc-font-caption); z-index: 200;
      transition: top 0.3s ease; white-space: nowrap;
    }
    .m-toast.show { top: 60px; }
  </style>
</head>
<body>
  <div class="m-page with-tabbar m-gradient-header">
    <div class="pf-header">
      <div style="padding:0 var(--wc-page-padding);">
        <div class="pf-code-card">
          <div class="pf-card-icons">
            <div class="pf-card-icon-btn" onclick="navTo('scan')" title="扫码">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </div>
          </div>
          <div class="pf-code-name">李安全<span class="pf-role-tag" id="profileRoleTag">安全管理人员 · 创安电子科技</span></div>
          <div class="pf-qr-wrap" onclick="navTo('code-change')">
            <div class="code-qr-canvas"><svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#fff"/><rect x="2" y="2" width="26" height="26" fill="#52c41a" rx="3"/><rect x="6" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="10" width="10" height="10" fill="#52c41a" rx="1"/><rect x="72" y="2" width="26" height="26" fill="#52c41a" rx="3"/><rect x="76" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="80" y="10" width="10" height="10" fill="#52c41a" rx="1"/><rect x="2" y="72" width="26" height="26" fill="#52c41a" rx="3"/><rect x="6" y="76" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="80" width="10" height="10" fill="#52c41a" rx="1"/><rect x="35" y="5" width="5" height="5" fill="#52c41a"/><rect x="45" y="8" width="5" height="5" fill="#52c41a"/><rect x="55" y="5" width="5" height="5" fill="#52c41a"/><rect x="35" y="18" width="5" height="5" fill="#52c41a"/><rect x="50" y="15" width="5" height="5" fill="#52c41a"/><rect x="60" y="18" width="5" height="5" fill="#52c41a"/><rect x="8" y="35" width="5" height="5" fill="#52c41a"/><rect x="18" y="38" width="5" height="5" fill="#52c41a"/><rect x="28" y="35" width="5" height="5" fill="#52c41a"/><rect x="38" y="42" width="5" height="5" fill="#52c41a"/><rect x="48" y="35" width="5" height="5" fill="#52c41a"/><rect x="58" y="38" width="5" height="5" fill="#52c41a"/><rect x="68" y="35" width="5" height="5" fill="#52c41a"/><rect x="78" y="42" width="5" height="5" fill="#52c41a"/><rect x="88" y="35" width="5" height="5" fill="#52c41a"/><rect x="8" y="48" width="5" height="5" fill="#52c41a"/><rect x="22" y="45" width="5" height="5" fill="#52c41a"/><rect x="38" y="52" width="5" height="5" fill="#52c41a"/><rect x="52" y="48" width="5" height="5" fill="#52c41a"/><rect x="65" y="52" width="5" height="5" fill="#52c41a"/><rect x="75" y="45" width="5" height="5" fill="#52c41a"/><rect x="85" y="48" width="5" height="5" fill="#52c41a"/><rect x="8" y="58" width="5" height="5" fill="#52c41a"/><rect x="18" y="55" width="5" height="5" fill="#52c41a"/><rect x="32" y="58" width="5" height="5" fill="#52c41a"/><rect x="42" y="55" width="5" height="5" fill="#52c41a"/><rect x="55" y="58" width="5" height="5" fill="#52c41a"/><rect x="68" y="55" width="5" height="5" fill="#52c41a"/><rect x="78" y="58" width="5" height="5" fill="#52c41a"/><rect x="88" y="55" width="5" height="5" fill="#52c41a"/><rect x="35" y="72" width="5" height="5" fill="#52c41a"/><rect x="45" y="78" width="5" height="5" fill="#52c41a"/><rect x="55" y="72" width="5" height="5" fill="#52c41a"/><rect x="65" y="78" width="5" height="5" fill="#52c41a"/><rect x="75" y="72" width="5" height="5" fill="#52c41a"/><rect x="85" y="78" width="5" height="5" fill="#52c41a"/><rect x="35" y="88" width="5" height="5" fill="#52c41a"/><rect x="48" y="85" width="5" height="5" fill="#52c41a"/><rect x="60" y="90" width="5" height="5" fill="#52c41a"/><rect x="72" y="88" width="5" height="5" fill="#52c41a"/><rect x="82" y="90" width="5" height="5" fill="#52c41a"/><rect x="92" y="85" width="5" height="5" fill="#52c41a"/></svg></div>
          </div>
          <div class="pf-qr-time">更新时间：2025-01-15 08:00</div>
        </div>
      </div>
    </div>

    <!-- 人员画像 - 雷达图 -->
    <div class="pf-card">
      <div class="pf-card-title">人员画像</div>
      <div class="m-radar-chart-wrap">
        <svg viewBox="0 0 200 180">
          <!-- 五边形网格 -->
          <polygon points="100,15 178,65 155,150 45,150 22,65" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <polygon points="100,36 158,74 140,138 60,138 42,74" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <polygon points="100,57 138,83 125,126 75,126 62,83" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <polygon points="100,78 118,92 110,114 90,114 82,92" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
          <!-- 轴线 -->
          <line x1="100" y1="15" x2="100" y2="150" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="22" y1="65" x2="178" y2="150" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="178" y1="65" x2="22" y2="150" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="100" y1="150" x2="100" y2="15" stroke="#e8e8e8" stroke-width="0.5"/>
          <line x1="22" y1="65" x2="178" y2="65" stroke="#e8e8e8" stroke-width="0.5"/>
          <!-- 数据区域 - 检查次数85% 按期履职率92% 隐患排查数58% 整改完成率78% 安全培训70% -->
          <polygon points="100,27 166,70 132,138 60,126 44,74" fill="rgba(31,147,234,0.15)" stroke="#1f93ea" stroke-width="1.5"/>
          <!-- 数据点 -->
          <circle cx="100" cy="27" r="3" fill="#1f93ea"/>
          <circle cx="166" cy="70" r="3" fill="#1f93ea"/>
          <circle cx="132" cy="138" r="3" fill="#1f93ea"/>
          <circle cx="60" cy="126" r="3" fill="#1f93ea"/>
          <circle cx="44" cy="74" r="3" fill="#1f93ea"/>
          <!-- 标签 -->
          <text x="100" y="8" text-anchor="middle" font-size="10" fill="#333">检查次数</text>
          <text x="187" y="62" text-anchor="start" font-size="10" fill="#333">按期履职</text>
          <text x="163" y="165" text-anchor="middle" font-size="10" fill="#333">隐患排查</text>
          <text x="37" y="165" text-anchor="middle" font-size="10" fill="#333">按期整改</text>
          <text x="10" y="62" text-anchor="end" font-size="10" fill="#333">安全培训</text>
          <!-- 数值 -->
          <text x="100" y="22" text-anchor="middle" font-size="8" fill="#1f93ea" font-weight="600">85%</text>
          <text x="172" y="68" text-anchor="start" font-size="8" fill="#1f93ea" font-weight="600">92%</text>
          <text x="138" y="144" text-anchor="middle" font-size="8" fill="#1f93ea" font-weight="600">58%</text>
          <text x="54" y="132" text-anchor="middle" font-size="8" fill="#1f93ea" font-weight="600">78%</text>
          <text x="38" y="72" text-anchor="end" font-size="8" fill="#1f93ea" font-weight="600">70%</text>
        </svg>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>检查完成率</span><span>85%</span></div>
        <div class="progress-bar"><div class="progress-fill blue" style="width:85%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>按期履职率</span><span>92%</span></div>
        <div class="progress-bar"><div class="progress-fill green" style="width:92%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>隐患排查数</span><span>7项</span></div>
        <div class="progress-bar"><div class="progress-fill yellow" style="width:58%"></div></div>
      </div>
      <div class="progress-item" style="margin-bottom:0;">
        <div class="progress-label"><span>按期整改率</span><span>78%</span></div>
        <div class="progress-bar"><div class="progress-fill green" style="width:78%"></div></div>
      </div>
    </div>

    <!-- 安全管控对象 -->
    <div class="pf-card">
      <div class="pf-card-title">安全管控对象 <span class="pf-card-extra" onclick="navTo('control-list')">查看详情 ›</span></div>
      <div class="pf-safety-ring-wrap">
        <div class="pf-safety-ring" style="background:conic-gradient(var(--success) 0% 67%, var(--warning) 67% 100%);">
          <div class="pf-safety-ring-inner">3</div>
        </div>
        <div class="pf-safety-legend">
          <div class="pf-safety-legend-item"><span class="pf-safety-dot" style="background:var(--success)"></span>绿色 2个</div>
          <div class="pf-safety-legend-item"><span class="pf-safety-dot" style="background:var(--warning)"></span>黄色 1个</div>
          <div class="pf-safety-legend-item"><span class="pf-safety-dot" style="background:var(--danger)"></span>红色 0个</div>
          <div style="font-size:var(--wc-font-tiny);color:var(--wc-text-placeholder);margin-top:2px;">负责安全管控对象 3个</div>
        </div>
      </div>
    </div>

    <!-- 人员履职 -->
    <div class="pf-card">
      <div class="pf-card-title">人员履职</div>
      <div class="progress-item">
        <div class="progress-label"><span>本年履职任务</span><span>24/28</span></div>
        <div class="progress-bar"><div class="progress-fill blue" style="width:86%"></div></div>
      </div>
      <div class="progress-item" style="margin-bottom:0;">
        <div class="progress-label"><span>专项调度检查</span><span>5/6</span></div>
        <div class="progress-bar"><div class="progress-fill green" style="width:83%"></div></div>
      </div>
    </div>

    <!-- 隐患统计 -->
    <div class="pf-card">
      <div class="pf-card-title">隐患统计 <span class="pf-card-extra" onclick="navTo('my-hazards')">查看详情 ›</span></div>
      <div style="display:flex;gap:var(--wc-gap-md);margin-bottom:var(--wc-gap-xl);">
        <div style="flex:1;text-align:center;padding:var(--wc-gap-md) 0;background:var(--wc-page-bg);border-radius:var(--wc-btn-radius);">
          <div style="font-size:20px;font-weight:700;">12</div><div style="font-size:var(--wc-font-tiny);color:var(--wc-text-placeholder);">隐患总数</div>
        </div>
        <div style="flex:1;text-align:center;padding:var(--wc-gap-md) 0;background:var(--wc-page-bg);border-radius:var(--wc-btn-radius);">
          <div style="font-size:20px;font-weight:700;color:#1f93ea;">7</div><div style="font-size:var(--wc-font-tiny);color:var(--wc-text-placeholder);">我排查的</div>
        </div>
        <div style="flex:1;text-align:center;padding:var(--wc-gap-md) 0;background:var(--wc-page-bg);border-radius:var(--wc-btn-radius);">
          <div style="font-size:20px;font-weight:700;color:var(--warning);">5</div><div style="font-size:var(--wc-font-tiny);color:var(--wc-text-placeholder);">我整改的</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-gap-xl);">
        <div class="ring-chart" style="background:conic-gradient(var(--brand-blue) 0% 17%, var(--warning) 17% 42%, var(--success) 42% 100%);width:70px;height:70px;">
          <div class="ring-chart-inner" style="top:12px;left:12px;width:46px;height:46px;font-size:var(--wc-font-small);">12</div>
        </div>
        <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:1.8;">
          <span style="color:var(--brand-blue)">●</span> 待整改 2<br>
          <span style="color:var(--code-orange,#fa8c16)">●</span> 整改中 3<br>
          <span style="color:var(--success)">●</span> 已整改 7
        </div>
      </div>
    </div>

    <div style="height:20px;"></div>
  </div>

  <!-- Toast提示 -->
  <div class="m-toast" id="mToast"></div>

  <script>
    // showToast 已统一到 mobile-session.js 全局函数

    // ========== 页面初始化：根据 session 动态渲染 ==========
    function initProfilePage() {
      if (typeof MobilePageConfig === 'undefined') return;
      var config = MobilePageConfig.getProfileConfig();
      if (!config || !config.portalType) return;

      // 更新角色标签
      var roleTagEl = document.getElementById('profileRoleTag');
      if (roleTagEl) {
        roleTagEl.textContent = config.roleTag + ' · ' + config.unitName;
      }
    }

    // initProfilePage 将在外部脚本加载后调用
  </script>
<script src="../../js/mobile-page-config.js"></script>
<script src="../../js/mobile-session.js"></script>
<script>initProfilePage();</script>
<script src="../../js/annotations.js"></script>
</body>
</html>
