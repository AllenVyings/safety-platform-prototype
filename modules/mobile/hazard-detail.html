<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隐患详情</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #e5e5e5; font-size: 14px; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #999; flex-shrink: 0; }
    .info-value { color: #000; font-weight: 500; text-align: right; }
    .info-value.red { color: #ff4d4f; }
    .info-value.orange { color: #faad14; }
    .timeline { padding: 0 4px; }
    .tl-item { display: flex; padding-bottom: 24px; position: relative; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-dot-col { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; margin-right: 12px; }
    .tl-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid #d9d9d9; background: #fff; }
    .tl-dot.active { border-color: #1068ff; background: #1068ff; }
    .tl-dot.done { border-color: #52c41a; background: #52c41a; }
    .tl-line { flex: 1; width: 2px; background: #f0f0f0; margin-top: 4px; }
    .tl-item:last-child .tl-line { display: none; }
    .tl-content { flex: 1; padding-bottom: 4px; }
    .tl-title { font-size: 14px; color: #000; font-weight: 500; }
    .tl-title.pending { color: #bfbfbf; }
    .tl-time { font-size: 12px; color: #999; margin-top: 2px; }
    .section-label { font-size: 15px; font-weight: 600; color: #000; margin-bottom: 12px; }
    .rectify-card { background: #fafafa; border-radius: 8px; padding: 12px; margin-top: 8px; }
    .rectify-status { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
    .rectify-status.pending { background: #e6f7ff; color: #1677ff; }
    .rectify-status.waiting { background: #f5f5f5; color: #bfbfbf; }
    .rectify-action { margin-top: 10px; }
    .rectify-action .m-btn { padding: 8px 16px; font-size: 13px; width: auto; display: inline-block; }
    .m-btn-primary { background: #1068ff; }
    .m-btn-primary:active { background: #0958d9; }
  </style>
</head>
<body>
  <div class="m-page">
    <!-- 基本信息卡片 -->
    <div class="m-card">
      <div class="m-card-title">隐患信息</div>
      <div class="info-row">
        <span class="info-label">隐患类型</span>
        <span class="info-value">消防</span>
      </div>
      <div class="info-row">
        <span class="info-label">隐患等级</span>
        <span class="info-value red">重大</span>
      </div>
      <div class="info-row">
        <span class="info-label">发现时间</span>
        <span class="info-value">2024-01-05</span>
      </div>
      <div class="info-row">
        <span class="info-label">整改期限</span>
        <span class="info-value orange">2024-01-15</span>
      </div>
      <div class="info-row">
        <span class="info-label">整改责任人</span>
        <span class="info-value">王操作</span>
      </div>
      <div class="info-row">
        <span class="info-label">隐患描述</span>
        <span class="info-value" style="font-weight:400;line-height:1.6;">配电房灭火器已过期，存在消防安全隐患</span>
      </div>
      <div class="info-row" style="flex-direction:column;gap:8px;">
        <span class="info-label">隐患图片</span>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <div style="width:80px;height:80px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:24px;">🔥</div>
          <div style="width:80px;height:80px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:24px;">🧯</div>
          <div style="width:80px;height:80px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#999;">+1</div>
        </div>
      </div>
    </div>

    <!-- 隐患生命周期 -->
    <div class="m-card">
      <div class="m-card-title">处理进度</div>
      <div class="timeline">
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot done"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title">隐患发现</div>
            <div class="tl-time">2024-01-05 14:30</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot done"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title">整改分配</div>
            <div class="tl-time">2024-01-06 09:15 · 责任人: 王操作</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot active"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title">整改完成</div>
            <div class="tl-time" style="color:#1677ff;">进行中</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title pending">复核确认</div>
            <div class="tl-time" style="color:#bfbfbf;">待处理</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 整改信息 -->
    <div class="m-card">
      <div class="section-label">整改</div>
      <div class="rectify-card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:14px;color:#1a1a1a;">整改状态</span>
          <span class="rectify-status pending">● 待整改</span>
        </div>
        <div class="rectify-action">
          <button class="m-btn m-btn-primary" onclick="handleRectify()">填写整改</button>
        </div>
      </div>
    </div>

    <!-- 复核信息 -->
    <div class="m-card">
      <div class="m-card-title">复核</div>
      <div class="info-row">
        <span class="info-label">复核人</span>
        <span class="info-value">李安全</span>
      </div>
      <div class="info-row">
        <span class="info-label">复核结果</span>
        <span class="info-value" style="color:#bfbfbf;">待复核</span>
      </div>
      <div class="info-row">
        <span class="info-label">复核期限</span>
        <span class="info-value">2024-01-20</span>
      </div>
      <div class="info-row" style="border-bottom:none;">
        <span class="info-label">备注</span>
        <span class="info-value" style="font-weight:400;color:#bfbfbf;">需整改完成后方可复核</span>
      </div>
    </div>

    <div style="height:20px;"></div>
  </div>

  <script>

function showToast(msg, type) {
  type = type || 'info';
  var toast = document.getElementById('mToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'mToast';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 24px;border-radius:20px;font-size:14px;color:#fff;z-index:10000;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  var bg = '#1677ff';
  if (type === 'success') bg = '#52c41a';
  if (type === 'warning') bg = '#faad14';
  if (type === 'error') bg = '#ff4d4f';
  toast.style.background = bg;
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(function() { toast.style.opacity = '0'; }, 2500);
}
    function handleRectify() {
      showToast('打开整改提交页面（原型演示）', 'info');
    }
  </script>
</body>
</html>
