<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隐患详情</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .info-row { display: flex; justify-content: space-between; padding: var(--wc-gap-lg) 0; border-bottom: 0.5px solid var(--wc-divider); font-size: var(--wc-font-caption); }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--wc-text-placeholder); flex-shrink: 0; }
    .info-value { color: var(--wc-text-primary); font-weight: 500; text-align: right; }
    .info-value.red { color: var(--code-red); }
    .info-value.orange { color: var(--code-yellow); }
    .timeline { padding: 0 var(--wc-gap-sm); }
    .tl-item { display: flex; padding-bottom: 24px; position: relative; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-dot-col { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; margin-right: var(--wc-gap-xl); }
    .tl-dot { width: var(--wc-gap-xl); height: var(--wc-gap-xl); border-radius: 50%; flex-shrink: 0; border: 2px solid var(--wc-divider); background: var(--wc-card-bg); }
    .tl-dot.active { border-color: var(--brand-blue); background: var(--brand-blue); }
    .tl-dot.done { border-color: var(--code-green); background: var(--code-green); }
    .tl-line { flex: 1; width: 2px; background: var(--wc-track-bg); margin-top: var(--wc-gap-sm); }
    .tl-item:last-child .tl-line { display: none; }
    .tl-content { flex: 1; padding-bottom: var(--wc-gap-sm); }
    .tl-title { font-size: var(--wc-font-caption); color: var(--wc-text-primary); font-weight: 500; }
    .tl-title.pending { color: var(--wc-text-pending); }
    .tl-time { font-size: var(--wc-font-small); color: var(--wc-text-placeholder); margin-top: 2px; }
    .section-label { font-size: var(--wc-font-body); font-weight: 600; color: var(--wc-text-primary); margin-bottom: var(--wc-gap-xl); }
    .rectify-card { background: #fafafa; border-radius: var(--wc-btn-radius); padding: var(--wc-gap-xl); margin-top: var(--wc-gap-md); }
    .rectify-status { display: inline-flex; align-items: center; gap: var(--wc-gap-sm); font-size: 13px; padding: var(--wc-gap-sm) var(--wc-gap-lg); border-radius: 6px; }
    .rectify-status.pending { background: var(--primary-light); color: var(--primary); }
    .rectify-status.waiting { background: var(--wc-bg-gray); color: var(--wc-text-pending); }
    .rectify-action { margin-top: var(--wc-gap-lg); }
    .rectify-action .m-btn { padding: var(--wc-gap-md) var(--wc-page-padding); font-size: 13px; width: auto; display: inline-block; }
    .m-btn-primary { background: var(--brand-blue); }
    .m-btn-primary:active { background: var(--brand-blue-active); }
  </style>
</head>
<body>
  <div class="m-page">
    <!-- 基本信息卡片 -->
    <div class="m-card">
      <div class="m-card-title">隐患信息</div>
      <div class="info-row">
        <span class="info-label">隐患类型</span>
        <span class="info-value">消防</span>
      </div>
      <div class="info-row">
        <span class="info-label">隐患等级</span>
        <span class="info-value red">重大</span>
      </div>
      <div class="info-row">
        <span class="info-label">发现时间</span>
        <span class="info-value">2024-01-05</span>
      </div>
      <div class="info-row">
        <span class="info-label">整改期限</span>
        <span class="info-value orange">2024-01-15</span>
      </div>
      <div class="info-row">
        <span class="info-label">整改责任人</span>
        <span class="info-value">王操作</span>
      </div>
      <div class="info-row">
        <span class="info-label">隐患描述</span>
        <span class="info-value" style="font-weight:400;line-height:1.6;">配电房灭火器已过期，存在消防安全隐患</span>
      </div>
      <div class="info-row" style="flex-direction:column;gap:var(--wc-gap-md);">
        <span class="info-label">隐患图片</span>
        <div style="display:flex;gap:var(--wc-gap-md);margin-top:var(--wc-gap-sm);">
          <div style="width:80px;height:80px;border-radius:6px;background:var(--wc-track-bg);display:flex;align-items:center;justify-content:center;font-size:24px;">🔥</div>
          <div style="width:80px;height:80px;border-radius:6px;background:var(--wc-track-bg);display:flex;align-items:center;justify-content:center;font-size:24px;">🧯</div>
          <div style="width:80px;height:80px;border-radius:6px;background:var(--wc-track-bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--wc-text-placeholder);">+1</div>
        </div>
      </div>
    </div>

    <!-- 隐患生命周期 -->
    <div class="m-card">
      <div class="m-card-title">处理进度</div>
      <div class="timeline">
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot done"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title">隐患发现</div>
            <div class="tl-time">2024-01-05 14:30</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot done"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title">整改分配</div>
            <div class="tl-time">2024-01-06 09:15 · 责任人: 王操作</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot active"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title">整改完成</div>
            <div class="tl-time" style="color:var(--primary);">进行中</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-dot-col">
            <div class="tl-dot"></div>
          </div>
          <div class="tl-content">
            <div class="tl-title pending">复核确认</div>
            <div class="tl-time" style="color:var(--wc-text-pending);">待处理</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 整改信息 -->
    <div class="m-card">
      <div class="section-label">整改</div>
      <div class="rectify-card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:14px;color:var(--wc-text-primary);">整改状态</span>
          <span class="rectify-status pending">● 待整改</span>
        </div>
        <div class="rectify-action">
          <button class="m-btn m-btn-primary" onclick="handleRectify()">填写整改</button>
        </div>
      </div>
    </div>

    <!-- 复核信息 -->
    <div class="m-card">
      <div class="m-card-title">复核</div>
      <div class="info-row">
        <span class="info-label">复核人</span>
        <span class="info-value">李安全</span>
      </div>
      <div class="info-row">
        <span class="info-label">复核结果</span>
        <span class="info-value" style="color:var(--wc-text-pending);">待复核</span>
      </div>
      <div class="info-row">
        <span class="info-label">复核期限</span>
        <span class="info-value">2024-01-20</span>
      </div>
      <div class="info-row" style="border-bottom:none;">
        <span class="info-label">备注</span>
        <span class="info-value" style="font-weight:400;color:var(--wc-text-pending);">需整改完成后方可复核</span>
      </div>
    </div>

    <div style="height:20px;"></div>
  </div>

  <script>

function showToast(msg, type) {
  type = type || 'info';
  var toast = document.getElementById('mToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'mToast';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 24px;border-radius:20px;font-size:14px;color:#fff;z-index:10000;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  var bg = 'var(--primary)';
  if (type === 'success') bg = 'var(--code-green)';
  if (type === 'warning') bg = 'var(--code-yellow)';
  if (type === 'error') bg = 'var(--code-red)';
  toast.style.background = bg;
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(function() { toast.style.opacity = '0'; }, 2500);
}
    function handleRectify() {
      showToast('打开整改提交页面（原型演示）', 'info');
    }
  </script>
</body>
</html>
