<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>检查详情</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .info-row { display: flex; justify-content: space-between; padding: var(--wc-gap-lg) 0; border-bottom: 0.5px solid var(--wc-divider); font-size: var(--wc-font-caption); }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--wc-text-placeholder); flex-shrink: 0; }
    .info-value { color: var(--wc-text-primary); font-weight: 500; text-align: right; flex: 1; min-width: 0; }
    .result-badge { display: inline-block; padding: var(--wc-gap-sm) 14px; border-radius: 6px; font-size: var(--wc-font-caption); font-weight: 600; }
    .result-badge.safe { background: var(--wc-code-bg-green); color: var(--code-green); }
    .result-badge.hazard { background: var(--wc-code-bg-yellow); color: var(--code-yellow); }
    .check-item { display: flex; align-items: flex-start; padding: var(--wc-gap-xl) 0; border-bottom: 0.5px solid var(--wc-divider); }
    .check-item:last-child { border-bottom: none; }
    .check-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--wc-font-small); font-weight: 700; flex-shrink: 0; margin-right: var(--wc-gap-lg); margin-top: 1px; }
    .check-icon.safe { background: var(--wc-code-bg-green); color: var(--code-green); }
    .check-icon.hazard { background: var(--wc-code-bg-red); color: var(--code-red); }
    .check-icon.na { background: var(--wc-page-bg); color: var(--wc-text-placeholder); }
    .check-info { flex: 1; }
    .check-name { font-size: var(--wc-font-caption); color: var(--wc-text-primary); font-weight: 500; }
    .check-result { font-size: var(--wc-font-small); margin-top: 2px; }
    .check-result.safe { color: var(--code-green); }
    .check-result.hazard { color: var(--code-red); }
    .check-result.na { color: var(--wc-text-placeholder); }
    .hazard-link { display: inline-flex; align-items: center; gap: var(--wc-gap-sm); margin-top: var(--wc-gap-sm); font-size: var(--wc-font-small); color: var(--brand-blue); cursor: pointer; }
    .hazard-link:active { opacity: 0.7; }
    .sign-display { background: var(--wc-page-bg); border-radius: var(--wc-btn-radius); padding: var(--wc-page-padding); text-align: center; border: 0.5px solid var(--wc-divider); }
    .sign-display span { font-family: KaiTi, STKaiti, serif; font-size: 24px; color: var(--wc-text-secondary); }
    .related-item { display: flex; align-items: center; padding: var(--wc-gap-lg) 0; border-bottom: 0.5px solid var(--wc-divider); cursor: pointer; }
    .related-item:last-child { border-bottom: none; }
    .related-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: var(--wc-gap-lg); flex-shrink: 0; }
    .related-info { flex: 1; }
    .related-title { font-size: var(--wc-font-caption); color: var(--wc-text-primary); }
    .related-meta { font-size: var(--wc-font-small); color: var(--wc-text-placeholder); margin-top: 2px; }
    .related-arrow { color: var(--wc-text-disabled); font-size: var(--wc-font-caption); }
  </style>
</head>
<body>
  <div class="m-page">
    <!-- 基本信息 -->
    <div class="m-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="m-card-title" style="margin-bottom:0;">检查信息</div>
        <span class="result-badge hazard">发现隐患</span>
      </div>
      <div class="info-row">
        <span class="info-label">安全管控对象</span>
        <span class="info-value">A栋生产车间</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查表</span>
        <span class="info-value">生产车间日常安全检查表</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查时间</span>
        <span class="info-value">2025-01-15 09:30</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查人</span>
        <span class="info-value">李安全</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查类型</span>
        <span class="info-value">企业自查</span>
      </div>
      <div class="info-row" style="flex-direction:column;gap:var(--wc-gap-md);">
        <span class="info-label">电子签名</span>
        <div class="sign-display" style="margin-top:var(--wc-gap-sm);">
          <span>李安全</span>
        </div>
        <div style="font-size:var(--wc-font-small);color:var(--wc-text-placeholder);text-align:right;">签署时间: 2025-01-15 10:15</div>
      </div>
    </div>

    <!-- 检查明细 -->
    <div class="m-card">
      <div class="m-card-title">检查明细</div>

      <div class="check-item">
        <div class="check-icon safe">✓</div>
        <div class="check-info">
          <div class="check-name">消防设施检查</div>
          <div class="check-result safe">正常</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon safe">✓</div>
        <div class="check-info">
          <div class="check-name">安全出口检查</div>
          <div class="check-result safe">正常</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon hazard">✗</div>
        <div class="check-info">
          <div class="check-name">电气线路检查</div>
          <div class="check-result hazard">异常</div>
          <div class="hazard-link" onclick="parent.navigateTo('hazard-detail')">⚠ 关联隐患: 电气线路绝缘层破损 ›</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon safe">✓</div>
        <div class="check-info">
          <div class="check-name">灭火器检查</div>
          <div class="check-result safe">正常</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon na">—</div>
        <div class="check-info">
          <div class="check-name">安全标识检查</div>
          <div class="check-result na">不涉及</div>
        </div>
      </div>
    </div>

    <!-- 关联隐患 -->
    <div class="m-card">
      <div class="m-card-title">关联隐患</div>
      <div class="related-item" onclick="parent.navigateTo('hazard-detail')">
        <div class="related-dot" style="background:var(--code-yellow);"></div>
        <div class="related-info">
          <div class="related-title">电气线路绝缘层破损</div>
          <div class="related-meta">一般隐患 · 待整改 · 期限 2025-01-25</div>
        </div>
        <span class="related-arrow">›</span>
      </div>
    </div>

    <div style="height:20px;"></div>
  </div>
<script src="../../js/annotations.js"></script>
</body>
</html>
