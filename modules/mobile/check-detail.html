<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>检查详情</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #e5e5e5; font-size: 14px; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #999; flex-shrink: 0; }
    .info-value { color: #000; font-weight: 500; text-align: right; }
    .result-badge { display: inline-block; padding: 4px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .result-badge.safe { background: #f6ffed; color: #52c41a; }
    .result-badge.hazard { background: #fffbe6; color: #faad14; }
    .check-item { display: flex; align-items: flex-start; padding: 12px 0; border-bottom: 0.5px solid #e5e5e5; }
    .check-item:last-child { border-bottom: none; }
    .check-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-right: 10px; margin-top: 1px; }
    .check-icon.safe { background: #f6ffed; color: #52c41a; }
    .check-icon.hazard { background: #fff2f0; color: #ff4d4f; }
    .check-icon.na { background: #f5f5f5; color: #999; }
    .check-info { flex: 1; }
    .check-name { font-size: 14px; color: #000; font-weight: 500; }
    .check-result { font-size: 12px; margin-top: 2px; }
    .check-result.safe { color: #52c41a; }
    .check-result.hazard { color: #ff4d4f; }
    .check-result.na { color: #999; }
    .hazard-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; color: #1677ff; cursor: pointer; }
    .hazard-link:active { opacity: 0.7; }
    .sign-display { background: #fafafa; border-radius: 8px; padding: 16px; text-align: center; border: 0.5px solid #e5e5e5; }
    .sign-display span { font-family: KaiTi, STKaiti, serif; font-size: 24px; color: #333; }
    .related-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #e5e5e5; cursor: pointer; }
    .related-item:last-child { border-bottom: none; }
    .related-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
    .related-info { flex: 1; }
    .related-title { font-size: 14px; color: #000; }
    .related-meta { font-size: 12px; color: #999; margin-top: 2px; }
    .related-arrow { color: #ccc; font-size: 14px; }
  </style>
</head>
<body>
  <div class="m-page">

    <!-- 基本信息 -->
    <div class="m-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="m-card-title" style="margin-bottom:0;">检查信息</div>
        <span class="result-badge hazard">发现隐患</span>
      </div>
      <div class="info-row">
        <span class="info-label">管控对象</span>
        <span class="info-value">A栋生产车间</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查表</span>
        <span class="info-value">生产车间日常安全检查表</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查时间</span>
        <span class="info-value">2025-01-15 09:30</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查人</span>
        <span class="info-value">李安全</span>
      </div>
      <div class="info-row">
        <span class="info-label">检查类型</span>
        <span class="info-value">企业自查</span>
      </div>
    </div>

    <!-- 检查明细 -->
    <div class="m-card">
      <div class="m-card-title">检查明细</div>

      <div class="check-item">
        <div class="check-icon safe">✓</div>
        <div class="check-info">
          <div class="check-name">消防设施检查</div>
          <div class="check-result safe">无隐患</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon safe">✓</div>
        <div class="check-info">
          <div class="check-name">安全出口检查</div>
          <div class="check-result safe">无隐患</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon hazard">✗</div>
        <div class="check-info">
          <div class="check-name">电气线路检查</div>
          <div class="check-result hazard">有隐患</div>
          <div class="hazard-link" onclick="parent.navigateTo('hazard-detail')">⚠ 关联隐患: 电气线路绝缘层破损 ›</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon safe">✓</div>
        <div class="check-info">
          <div class="check-name">灭火器检查</div>
          <div class="check-result safe">无隐患</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-icon na">—</div>
        <div class="check-info">
          <div class="check-name">安全标识检查</div>
          <div class="check-result na">不涉及</div>
        </div>
      </div>
    </div>

    <!-- 电子签名 -->
    <div class="m-card">
      <div class="m-card-title">电子签名</div>
      <div class="sign-display">
        <span>李安全</span>
      </div>
      <div style="font-size:12px;color:#999;text-align:center;margin-top:6px;">签署时间: 2025-01-15 10:15</div>
    </div>

    <!-- 关联隐患 -->
    <div class="m-card">
      <div class="m-card-title">关联隐患</div>
      <div class="related-item" onclick="parent.navigateTo('hazard-detail')">
        <div class="related-dot" style="background:#faad14;"></div>
        <div class="related-info">
          <div class="related-title">电气线路绝缘层破损</div>
          <div class="related-meta">一般隐患 · 未整改 · 期限 2025-01-25</div>
        </div>
        <span class="related-arrow">›</span>
      </div>
    </div>

    <div style="height:20px;"></div>
  </div>
</body>
</html>
