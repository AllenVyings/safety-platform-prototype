<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>场所码首页</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .pc-gradient { display: none; }
    .m-page {
      position: relative; overflow: hidden; background-color: var(--wc-page-bg);
      background-image: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, var(--wc-page-bg) 100%);
      background-size: 100% 350px; background-repeat: no-repeat; background-position: top;
    }
    .m-page::before {
      content: ''; position: absolute; top: 110px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .m-page::after {
      content: ''; position: absolute; top: 220px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .pc-header {
      padding: 107px 0 0;
      display: flex; flex-direction: column;
    }
    .pc-code-card {
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: var(--wc-page-padding); text-align: center;
      box-shadow: var(--wc-shadow-card); position: relative; z-index: 1;
    }
    .pc-card-icons {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2;
    }
    .pc-card-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: var(--wc-page-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .pc-card-icon-btn:active { background: var(--wc-icon-btn-active); }
    .pc-card-icon-btn svg { width: 16px; height: 16px; }
    .pc-qr-wrap {
      width: 210px; height: 210px; margin: 4px auto 8px;
      padding: 5px; box-sizing: content-box;
      border: 4px solid #F1FBFC; border-radius: 12px;
      background: #fff; cursor: pointer;
      color: #ff071b;
    }
    .pc-qr-wrap .code-qr-canvas { border-radius: 0; }
    .pc-action-row { display: flex; gap: 12px; margin-top: 12px; justify-content: center; }
    .pc-action-btn {
      height: 28px; padding: 0 12px; border-radius: 6px;
      font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    .pc-action-btn.primary { background: #165DFF; color: #fff; border: none; }
    .pc-action-btn.primary:active { background: #1250d4; }
    .pc-action-btn.ghost { background: #fff; color: #165DFF; border: 1px solid #165DFF; }
    .pc-action-btn.ghost:active { background: #f0f5ff; }
    .pc-action-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
    .pc-qr-time { font-size: var(--wc-font-tiny); color: var(--wc-text-disabled); margin-top: var(--wc-gap-sm); }
    .pc-quick-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--wc-gap-sm);
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: 14px var(--wc-gap-md) var(--wc-gap-lg);
      box-shadow: var(--wc-shadow-card-sm);
    }
    .pc-quick-item { text-align: center; cursor: pointer; padding: var(--wc-gap-sm) 0; }
    .pc-quick-icon {
      width: 44px; height: 44px; border-radius: var(--wc-card-radius); margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .pc-quick-icon.blue { background: var(--wc-icon-bg-blue); }
    .pc-quick-icon.orange { background: var(--wc-icon-bg-orange); }
    .pc-quick-icon.green { background: var(--wc-code-bg-green); }
    .pc-quick-icon.purple { background: var(--wc-icon-bg-purple); }
    .pc-quick-label { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); }
    .duty-person-card { display: flex; align-items: flex-start; padding: var(--wc-gap-xl); background: #f9fafb; border-radius: var(--wc-btn-radius); margin-bottom: var(--wc-gap-lg); }
    .duty-person-card:last-child { margin-bottom: 0; }
    .duty-person-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--wc-gap-lg); margin-right: var(--wc-gap-xl); flex-shrink: 0; }
    .duty-person-avatar.area { background: var(--wc-icon-bg-orange); }
    .duty-person-avatar.scan { background: var(--wc-icon-bg-blue); }
    .duty-person-detail { flex: 1; }
    .duty-person-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .duty-person-name { font-size: var(--wc-font-caption); font-weight: 600; color: var(--wc-text-primary); }
    .duty-person-pos { font-size: var(--wc-font-small); color: var(--wc-text-placeholder); }
    .duty-person-dept { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); margin-bottom: 6px; }
    .duty-person-progress { display: flex; align-items: center; gap: var(--wc-gap-md); }
    .duty-person-progress .progress-bar { flex: 1; }
    .duty-person-progress .progress-text { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); white-space: nowrap; }
    .ctrl-item { display: flex; align-items: center; padding: var(--wc-gap-lg) 0; border-bottom: 0.5px solid var(--wc-divider); }
    .ctrl-item:last-child { border-bottom: none; }
    .ctrl-icon { width: 32px; height: 32px; border-radius: var(--wc-btn-radius); display: flex; align-items: center; justify-content: center; font-size: var(--wc-gap-lg); margin-right: var(--wc-gap-lg); flex-shrink: 0; }
    .ctrl-info { flex: 1; }
    .ctrl-name { font-size: var(--wc-font-caption); color: var(--wc-text-primary); font-weight: 500; }
    .ctrl-desc { font-size: var(--wc-font-small); color: var(--wc-text-placeholder); margin-top: 2px; }
    .ctrl-arrow { color: var(--wc-text-disabled); font-size: var(--wc-font-caption); }
    /* 主Tab样式 */
    .pc-tab-card {
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); margin: var(--wc-gap-lg) var(--wc-page-padding);
      box-shadow: var(--wc-shadow-card-sm); overflow: hidden;
    }
    .pc-main-tabs {
      display: flex; padding: 0; border-bottom: 0.5px solid rgba(0,0,0,0.08);
    }
    .pc-main-tab {
      flex: 1; text-align: center; padding: var(--wc-gap-xl) 0 var(--wc-gap-lg); font-size: var(--wc-font-caption);
      color: var(--wc-text-placeholder); cursor: pointer; position: relative; transition: color 0.2s;
    }
    .pc-main-tab.active { color: var(--brand-blue); font-weight: 600; }
    .pc-main-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 24px; height: 3px; background: var(--brand-blue); border-radius: 1.5px;
    }
    .pc-main-tab:active { opacity: 0.7; }
    .pc-panel { display: none; }
    .pc-panel.active { display: block; }
    .pc-panel-body { padding: 14px var(--wc-page-padding); }
    /* QR码详情弹层 */
    .qr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .qr-overlay.show { display: flex; }
    .qr-detail-card {
      background: var(--wc-card-bg); border-radius: var(--wc-radius-lg); padding: 24px; width: 292px; text-align: center;
      box-shadow: var(--wc-shadow-overlay); position: relative;
    }
    .qr-detail-close {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border-radius: 50%; background: var(--wc-track-bg); display: flex; align-items: center;
      justify-content: center; font-size: var(--wc-gap-lg); cursor: pointer; color: var(--wc-text-placeholder);
    }
    .qr-detail-close:active { background: var(--wc-pressed-bg-alt); }
    .qr-detail-qr {
      width: 210px; height: 210px; margin: 0 auto 12px;
      padding: 5px; box-sizing: content-box;
      border: 4px solid #F1FBFC; border-radius: 12px;
      background: #fff; color: #ff071b;
    }
    .qr-detail-qr svg { display: block; width: 100%; height: 100%; }
    .qr-detail-name { font-size: var(--wc-font-caption); color: var(--wc-text-tertiary); margin-bottom: 4px; }
    .qr-detail-time { font-size: var(--wc-font-small); color: var(--wc-text-disabled); margin-bottom: var(--wc-page-padding); }
    .qr-detail-actions { display: flex; gap: var(--wc-gap-lg); }
    .qr-detail-actions button { flex: 1; padding: var(--wc-gap-lg); border-radius: var(--wc-btn-radius); font-size: var(--wc-font-caption); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-sm); }
    .qr-detail-actions button svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>

  <script>
    // 主Tab切换
    function switchMainTab(el, idx) {
      el.parentElement.querySelectorAll('.pc-main-tab').forEach(function(t){t.classList.remove('active');});
      el.classList.add('active');
      document.querySelectorAll('.pc-panel').forEach(function(p){p.classList.remove('active');});
      document.getElementById('panel' + idx).classList.add('active');
    }

    // QR码弹层
    function showQrDetail() {
      document.getElementById('qrOverlay').classList.add('show');
    }
    function closeQrDetail() {
      document.getElementById('qrOverlay').classList.remove('show');
    }

    // 点击二维码 → 下钻异常记录（携带当前管控对象名称）
    function goCodeChange(nameElId) {
      try {
        var el = document.getElementById(nameElId);
        var name = '';
        if (el) {
          // 只取纯文本节点，排除标注徽章等子元素
          for (var i = 0; i < el.childNodes.length; i++) {
            if (el.childNodes[i].nodeType === 3) name += el.childNodes[i].textContent;
          }
          name = name.replace(/\s+/g, ' ').trim();
        }
        if (name) localStorage.setItem('codeChangeEntityName', name);
        localStorage.setItem('codeChangeResetToday', '1'); // 二维码/日历入口进入异常记录默认显示当天
      } catch (e) {}
      if (window.parent && window.parent !== window && typeof window.parent.navigateTo === 'function') {
        navTo('code-change');
      } else {
        window.location.href = 'code-change.html';
      }
    }

    // 初始化场所码页面（根据 session 动态渲染）
    function initPlaceCodePage() {
      var timeLabel = codeUpdateTimeLabel();
      var cardTime = document.querySelector('.pc-qr-time');
      if (cardTime) cardTime.textContent = timeLabel;
      var detailTime = document.querySelector('.qr-detail-time');
      if (detailTime) detailTime.textContent = timeLabel;

      if (typeof MobilePageConfig === 'undefined') return;
      var config = MobilePageConfig.getPlaceCodeConfig();
      if (!config || !config.place) return;
      var place = config.place;

      // 更新场所名称（含二维码放大层）
      var nameEl = document.getElementById('pcPlaceName');
      if (nameEl) nameEl.textContent = place.name;
      var qrNameEl = document.querySelector('.qr-detail-name');
      if (qrNameEl) qrNameEl.textContent = place.name;

      // 区域负责人 + 扫码责任人：同套数据（mobile-page-config.js，与企业端 PLACE_DETAIL 一致）
      var ownerRow = document.getElementById('pcAreaOwnerRow');
      if (ownerRow && place.owner) {
        ownerRow.innerHTML =
          '<tr style="border-bottom:none;">' +
          '<td style="text-align:center;padding:10px 4px;font-size:var(--wc-font-caption);color:var(--wc-text-primary);">' + place.owner + '</td>' +
          '<td style="text-align:center;padding:10px 4px;font-size:var(--wc-font-caption);color:var(--wc-text-primary);">' + (place.owner === '王五' ? '安全主管' : '技术经理') + '</td>' +
          '<td style="text-align:center;padding:10px 4px;font-size:var(--wc-font-caption);color:var(--wc-text-primary);">' + (place.phone || '') + '</td>' +
          '</tr>';
      }
      var scanRows = document.getElementById('pcScanRows');
      if (scanRows && place.scanPersons) {
        var scanHtml = '';
        place.scanPersons.forEach(function(p, i) {
          var border = i === place.scanPersons.length - 1 ? 'none' : '0.5px solid var(--wc-divider)';
          var tick = p.done
            ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="var(--success)"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : '<svg viewBox="0 0 24 24" width="18" height="18" fill="#ddd"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          scanHtml += '<tr style="border-bottom:' + border + ';">' +
            '<td style="text-align:center;padding:10px 4px;font-size:var(--wc-font-caption);color:var(--wc-text-primary);">' + p.dept + '</td>' +
            '<td style="text-align:center;padding:10px 4px;font-size:var(--wc-font-caption);color:var(--wc-text-primary);">' + p.name + '</td>' +
            '<td style="text-align:center;padding:10px 4px;font-size:var(--wc-font-caption);color:var(--wc-text-primary);">' + p.freq + '</td>' +
            '<td style="text-align:center;padding:10px 4px;">' + tick + '</td></tr>';
        });
        scanRows.innerHTML = scanHtml;
      }

      // 更新背景渐变
      var mPage = document.querySelector('.m-page');
      if (mPage) mPage.style.backgroundImage = config.gradient;

      // 二维码码点颜色跟场所码色（官方三色原值，与 mobile.css 一致），外框保持浅色固定边
      var inkColors = { red: '#ff071b', yellow: '#ffd838', green: '#12c16e' };
      var ink = inkColors[place.codeColor] || '#12c16e';
      var qrWrap = document.querySelector('.pc-qr-wrap');
      if (qrWrap) qrWrap.style.color = ink;
      var qrDetail = document.querySelector('.qr-detail-qr');
      if (qrDetail) qrDetail.style.color = ink;

      // 更新快捷入口
      var quickGrid = document.getElementById('pcQuickGrid');
      if (quickGrid && place.quickActions) {
        var html = '';
        place.quickActions.forEach(function(a) {
          var onclick = a.nav ? " onclick=\"navTo('" + a.nav + "')\"" : '';
          html += '<div class="pc-quick-item"' + onclick + '>' +
            '<div class="pc-quick-icon ' + a.color + '">' + a.icon + '</div>' +
            '<div class="pc-quick-label">' + a.label + '</div>' +
            '</div>';
        });
        quickGrid.innerHTML = html;
      }

      // 更新统计区
      var statsPanel = document.getElementById('pcStatsPanel');
      if (statsPanel && place.stats) {
        var s = place.stats;
        var greenPct = s.total > 0 ? Math.round(s.green / s.total * 100) + '%' : '0%';
        var yellowEnd = s.total > 0 ? Math.round((s.green + s.yellow) / s.total * 100) + '%' : '0%';
        var conicGrad = 'conic-gradient(var(--success) 0% ' + greenPct + ', var(--warning) ' + greenPct + ' ' + yellowEnd + ', var(--danger) ' + yellowEnd + ' 100%)';
        statsPanel.innerHTML =
          '<div class="stat-row" style="padding:0;margin-bottom:var(--wc-gap-xl);">' +
          '  <div class="stat-item"><div class="stat-num">' + s.total + '</div><div class="stat-label">危险源总数</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--success)">' + s.green + '</div><div class="stat-label">绿色</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--warning)">' + s.yellow + '</div><div class="stat-label">黄色</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--danger)">' + s.red + '</div><div class="stat-label">红色</div></div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-page-padding);">' +
          '  <div class="ring-chart" style="background:' + conicGrad + ';"><div class="ring-chart-inner">' + greenPct + '</div></div>' +
          '  <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:2;">' +
          '    <span style="color:var(--success)">&#x25CF;</span> 绿色 ' + s.green + '个<br>' +
          '    <span style="color:var(--warning)">&#x25CF;</span> 黄色 ' + s.yellow + '个<br>' +
          '    <span style="color:var(--danger)">&#x25CF;</span> 红色 ' + s.red + '个' +
          '  </div>' +
          '</div>';
      }

      // 更新隐患统计区
      var hazardPanel = document.getElementById('pcHazardStatsPanel');
      if (hazardPanel && place.hazardStats) {
        var h = place.hazardStats;
        var pendingPct = h.total > 0 ? Math.round(h.pending / h.total * 100) : 0;
        var fixingPct = h.total > 0 ? Math.round(h.fixing / h.total * 100) : 0;
        var donePct = h.total > 0 ? 100 - pendingPct - fixingPct : 0;
        var conicGrad = 'conic-gradient(var(--danger) 0% ' + pendingPct + '%, var(--warning) ' + pendingPct + '% ' + (pendingPct + fixingPct) + '%, var(--success) ' + (pendingPct + fixingPct) + '% 100%)';
        hazardPanel.innerHTML =
          '<div class="stat-row" style="padding:0;margin-bottom:var(--wc-gap-xl);">' +
          '  <div class="stat-item"><div class="stat-num">' + h.total + '</div><div class="stat-label">隐患总数</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--danger)">' + h.pending + '</div><div class="stat-label">待整改</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--warning)">' + h.fixing + '</div><div class="stat-label">整改中</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--success)">' + h.done + '</div><div class="stat-label">已完成</div></div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-page-padding);">' +
          '  <div class="ring-chart" style="background:' + conicGrad + ';"><div class="ring-chart-inner">' + donePct + '%</div></div>' +
          '  <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:2;">' +
          '    <span style="color:var(--danger)">&#x25CF;</span> 待整改 ' + h.pending + '个<br>' +
          '    <span style="color:var(--warning)">&#x25CF;</span> 整改中 ' + h.fixing + '个<br>' +
          '    <span style="color:var(--success)">&#x25CF;</span> 已完成 ' + h.done + '个' +
          '  </div>' +
          '</div>';
      }
    }
    // initPlaceCodePage 将在外部脚本加载后调用
  </script>
<script src="../../js/domain-data.js"></script>
<script src="../../js/mobile-page-config.js"></script>
<script src="../../js/mobile-session.js?v=20261124"></script>
<script>initPlaceCodePage();</script>
<script src="../../js/annotations.js"></script>
</body>
