<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>危险源码首页</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .hc-gradient {
      position: fixed; top: 0; left: 0; right: 0; height: 350px; z-index: 0;
      background: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, #f5f7fa 100%);
    }
    .hc-gradient::before {
      content: ''; position: absolute; top: 100px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .hc-gradient::after {
      content: ''; position: absolute; top: 210px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .hc-header {
      padding: 107px 0 0; position: relative; z-index: 1;
      display: flex; flex-direction: column;
    }
    .hc-code-card {
      background: #fff; border-radius: 12px; padding: 16px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; z-index: 1;
    }
    .hc-card-icons {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2;
    }
    .hc-card-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: #f5f7fa;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .hc-card-icon-btn:active { background: #e8eaed; }
    .hc-card-icon-btn svg { width: 16px; height: 16px; }
    .hc-qr-wrap {
      width: 180px; height: 180px; margin: 0 auto 8px;
      padding: 10px; border: 4px solid #ffa39e; border-radius: 12px;
      background: #fff; cursor: pointer;
    }
    .hc-action-row { display: flex; gap: 8px; margin-top: 10px; }
    .hc-action-row .m-btn { font-size: 13px; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .m-btn-outline { background: #fff; color: #576b95; border: 0.5px solid #576b95; }
    .m-btn-outline:active { background: #f0f4ff; }
    .hc-action-row svg { width: 14px; height: 14px; flex-shrink: 0; }
    .hc-qr-time { font-size: 11px; color: #bbb; margin-top: 4px; }
    .hc-quick-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      background: #fff; border-radius: 12px; padding: 14px 8px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .hc-quick-item { text-align: center; cursor: pointer; padding: 4px 0; }
    .hc-quick-icon {
      width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .hc-quick-icon.blue { background: #e8f4fd; }
    .hc-quick-icon.orange { background: #fff3e6; }
    .hc-quick-icon.green { background: #f0fff0; }
    .hc-quick-icon.purple { background: #f5f0ff; }
    .hc-quick-label { font-size: 12px; color: #666; }
    .duty-person-card { display: flex; align-items: flex-start; padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 10px; }
    .duty-person-card:last-child { margin-bottom: 0; }
    .duty-person-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; flex-shrink: 0; }
    .duty-person-avatar.area { background: #fff2f0; }
    .duty-person-avatar.scan { background: #e8f4fd; }
    .duty-person-detail { flex: 1; }
    .duty-person-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .duty-person-name { font-size: 14px; font-weight: 600; color: #000; }
    .duty-person-pos { font-size: 12px; color: #999; }
    .duty-person-dept { font-size: 12px; color: #666; margin-bottom: 6px; }
    .duty-person-progress { display: flex; align-items: center; gap: 8px; }
    .duty-person-progress .progress-bar { flex: 1; }
    .duty-person-progress .progress-text { font-size: 12px; color: #666; white-space: nowrap; }
    /* QR码详情弹层 */
    .qr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .qr-overlay.show { display: flex; }
    .qr-detail-card {
      background: #fff; border-radius: 16px; padding: 24px; width: 260px; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); position: relative;
    }
    .qr-detail-close {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border-radius: 50%; background: #f0f0f0; display: flex; align-items: center;
      justify-content: center; font-size: 16px; cursor: pointer; color: #999;
    }
    .qr-detail-close:active { background: #e0e0e0; }
    .qr-detail-qr { width: 180px; height: 180px; margin: 0 auto 12px; border-radius: 10px; overflow: hidden; }
    .qr-detail-name { font-size: 14px; color: #666; margin-bottom: 4px; }
    .qr-detail-time { font-size: 12px; color: #bbb; margin-bottom: 16px; }
    .qr-detail-actions { display: flex; gap: 10px; }
    .qr-detail-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .qr-detail-actions button svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="m-page with-tabbar" style="background:#f5f7fa;">
    <div class="hc-gradient"></div>

    <div class="hc-header">
      <!-- 安全码模块 -->
      <div style="position:relative;z-index:1;padding:0 16px;">
        <div class="hc-code-card">
          <div class="hc-card-icons">
            <div class="hc-card-icon-btn" title="危险源信息">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="hc-card-icon-btn" onclick="parent.navigateTo('scan')" title="扫一扫">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
          </div>
          <div style="font-size:17px;font-weight:700;color:#000;text-align:left;margin-bottom:12px;">危化品存储区</div>
          <div class="hc-qr-wrap" onclick="showQrDetail()">
            <div class="code-qr-canvas"><svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#fff"/><rect x="2" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="72" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="76" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="80" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="2" y="72" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="76" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="80" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="35" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="8" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="50" y="15" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="28" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="58" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="22" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="52" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="32" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="42" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="88" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="85" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="90" width="5" height="5" fill="#ff4d4f"/><rect x="72" y="88" width="5" height="5" fill="#ff4d4f"/><rect x="82" y="90" width="5" height="5" fill="#ff4d4f"/><rect x="92" y="85" width="5" height="5" fill="#ff4d4f"/></svg></div>
          </div>
          <div class="hc-qr-time">更新时间：2025-01-15 08:00</div>
          <div class="hc-action-row" style="justify-content:center;">
            <button class="m-btn" style="width:80px;background:#1068ff;color:#fff;border:none;border-radius:8px;font-size:12px;padding:6px 0;"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>下载</button>
            <button class="m-btn" style="width:80px;background:#fff;color:#1068ff;border:1px solid #1068ff;border-radius:8px;font-size:12px;padding:6px 0;"><svg viewBox="0 0 24 24" fill="none" stroke="#1068ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>分享</button>
          </div>
        </div>
      </div>

      <!-- 快捷入口 -->
      <div style="margin-top:10px;position:relative;z-index:1;padding:0 16px;">
        <div class="hc-quick-grid">
          <div class="hc-quick-item" onclick="parent.navigateTo('check-list')">
            <div class="hc-quick-icon orange">🔎</div>
            <div class="hc-quick-label">码上排查</div>
          </div>
          <div class="hc-quick-item" onclick="parent.navigateTo('hazard-stats')">
            <div class="hc-quick-icon green">⚠️</div>
            <div class="hc-quick-label">隐患记录</div>
          </div>
          <div class="hc-quick-item" onclick="parent.navigateTo('inspection-stats')">
            <div class="hc-quick-icon purple">📄</div>
            <div class="hc-quick-label">检查记录</div>
          </div>
          <div class="hc-quick-item" onclick="parent.navigateTo('code-change')">
            <div class="hc-quick-icon blue">🔄</div>
            <div class="hc-quick-label">变码记录</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 责任与履职状态 -->
    <div class="m-card">
      <div class="m-card-title">责任与履职状态</div>
      <div class="duty-person-card">
        <div class="duty-person-avatar area">👷</div>
        <div class="duty-person-detail">
          <div class="duty-person-row">
            <span class="duty-person-name">王操作</span>
            <span class="duty-person-pos">区域责任人</span>
          </div>
          <div class="duty-person-dept">生产运营部 · 隐患整改负责人</div>
          <div class="duty-person-progress">
            <div class="progress-bar" style="flex:1">
              <div class="progress-fill red" style="width:33%"></div>
            </div>
            <span class="progress-text">整改 1/3</span>
          </div>
        </div>
      </div>
      <div class="duty-person-card">
        <div class="duty-person-avatar scan">🔍</div>
        <div class="duty-person-detail">
          <div class="duty-person-row">
            <span class="duty-person-name">赵巡检</span>
            <span class="duty-person-pos">扫码责任人</span>
          </div>
          <div class="duty-person-dept">安全管理部 · 巡检专员</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:6px;">
            <span>巡检频次：每日1次</span>
            <span style="color:#faad14">未完成</span>
          </div>
          <div class="duty-person-progress">
            <div class="progress-bar" style="flex:1">
              <div class="progress-fill yellow" style="width:50%"></div>
            </div>
            <span class="progress-text">巡检 1/2</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐患统计 - 独立卡片 -->
    <div class="m-card">
      <div class="m-card-title">隐患统计 <span style="font-size:13px;color:#576b95;font-weight:400;cursor:pointer;" onclick="parent.navigateTo('hazard-stats')">查看详情 ›</span></div>
      <div class="stat-row" style="padding:0;margin-bottom:12px;">
        <div class="stat-item"><div class="stat-num">5</div><div class="stat-label">隐患总数</div></div>
        <div class="stat-item"><div class="stat-num" style="color:#ff4d4f">2</div><div class="stat-label">未整改</div></div>
        <div class="stat-item"><div class="stat-num" style="color:#faad14">1</div><div class="stat-label">整改中</div></div>
        <div class="stat-item"><div class="stat-num" style="color:#52c41a">2</div><div class="stat-label">已整改</div></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
        <div class="ring-chart" style="background:conic-gradient(#52c41a 0% 40%, #faad14 40% 60%, #ff4d4f 60% 100%);">
          <div class="ring-chart-inner">40%</div>
        </div>
        <div style="font-size:12px;color:#666;line-height:2;">
          <span style="color:#52c41a">●</span> 已整改 2项<br>
          <span style="color:#faad14">●</span> 整改中 1项<br>
          <span style="color:#ff4d4f">●</span> 未整改 2项
        </div>
      </div>
    </div>

    <div style="height:10px;"></div>
  </div>

  <!-- QR码详情弹层 -->
  <div class="qr-overlay" id="qrOverlay" onclick="if(event.target===this)closeQrDetail()">
    <div class="qr-detail-card" style="position:relative;">
      <div class="qr-detail-close" onclick="closeQrDetail()">✕</div>
      <div class="qr-detail-qr"><svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#fff"/><rect x="2" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="72" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="76" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="80" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="2" y="72" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="76" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="80" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="35" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="8" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="50" y="15" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="28" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="58" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="22" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="52" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="32" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="42" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="88" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="85" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="90" width="5" height="5" fill="#ff4d4f"/><rect x="72" y="88" width="5" height="5" fill="#ff4d4f"/><rect x="82" y="90" width="5" height="5" fill="#ff4d4f"/><rect x="92" y="85" width="5" height="5" fill="#ff4d4f"/></svg></div>
      <div class="qr-detail-name">危化品存储区</div>
      <div class="qr-detail-time">更新时间：2025-01-15 08:00</div>
      <div class="qr-detail-actions">
        <button style="background:#f5f7fa;color:#576b95;"><svg viewBox="0 0 24 24" fill="none" stroke="#576b95" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>下载</button>
        <button style="background:#1068ff;color:#fff;"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>分享</button>
      </div>
    </div>
  </div>

  <script>
    // QR码弹层
    function showQrDetail() {
      document.getElementById('qrOverlay').classList.add('show');
    }
    function closeQrDetail() {
      document.getElementById('qrOverlay').classList.remove('show');
    }
  </script>
</body>
</html>
