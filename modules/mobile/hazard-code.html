<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>危险源码首页</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .hc-gradient { display: none; }
    .m-page {
      position: relative; overflow: hidden; background-color: var(--wc-page-bg);
      background-image: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, var(--wc-page-bg) 100%);
      background-size: 100% 350px; background-repeat: no-repeat; background-position: top;
    }
    .m-page::before {
      content: ''; position: absolute; top: 110px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .m-page::after {
      content: ''; position: absolute; top: 220px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .hc-header {
      padding: 107px 0 0;
      display: flex; flex-direction: column;
    }
    .hc-code-card {
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: var(--wc-page-padding); text-align: center;
      box-shadow: var(--wc-shadow-card); position: relative; z-index: 1;
    }
    .hc-card-icons {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2;
    }
    .hc-card-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: var(--wc-page-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .hc-card-icon-btn:active { background: var(--wc-icon-btn-active); }
    .hc-card-icon-btn svg { width: 16px; height: 16px; }
    .hc-qr-wrap {
      width: 180px; height: 180px; margin: 0 auto 8px;
      padding: var(--wc-gap-lg); border: 4px solid var(--wc-code-border-red); border-radius: var(--wc-card-radius);
      background: var(--wc-card-bg); cursor: pointer;
    }
    .hc-action-row { display: flex; gap: var(--wc-gap-md); margin-top: var(--wc-gap-lg); }
    .hc-action-row .m-btn { font-size: var(--wc-font-small); padding: var(--wc-gap-md); border-radius: var(--wc-btn-radius); display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-sm); }
    .m-btn-outline { background: var(--wc-card-bg); color: var(--wc-blue); border: 0.5px solid var(--wc-blue); }
    .m-btn-outline:active { background: var(--primary-light); }
    .hc-action-row svg { width: 14px; height: 14px; flex-shrink: 0; }
    .hc-qr-time { font-size: var(--wc-font-tiny); color: var(--wc-text-disabled); margin-top: var(--wc-gap-sm); }
    .hc-quick-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--wc-gap-sm);
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: 14px var(--wc-gap-md) var(--wc-gap-lg);
      box-shadow: var(--wc-shadow-card-sm);
    }
    .hc-quick-item { text-align: center; cursor: pointer; padding: var(--wc-gap-sm) 0; }
    .hc-quick-icon {
      width: 44px; height: 44px; border-radius: var(--wc-card-radius); margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .hc-quick-icon.blue { background: var(--wc-icon-bg-blue); }
    .hc-quick-icon.orange { background: var(--wc-icon-bg-orange); }
    .hc-quick-icon.green { background: var(--wc-code-bg-green); }
    .hc-quick-icon.purple { background: var(--wc-icon-bg-purple); }
    .hc-quick-label { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); }
    .duty-person-card { display: flex; align-items: flex-start; padding: var(--wc-gap-xl); background: #f9fafb; border-radius: var(--wc-btn-radius); margin-bottom: var(--wc-gap-lg); }
    .duty-person-card:last-child { margin-bottom: 0; }
    .duty-person-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--wc-gap-lg); margin-right: var(--wc-gap-xl); flex-shrink: 0; }
    .duty-person-avatar.area { background: var(--wc-code-bg-red); }
    .duty-person-avatar.scan { background: var(--wc-icon-bg-blue); }
    .duty-person-detail { flex: 1; }
    .duty-person-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .duty-person-name { font-size: var(--wc-font-caption); font-weight: 600; color: var(--wc-text-primary); }
    .duty-person-pos { font-size: var(--wc-font-small); color: var(--wc-text-placeholder); }
    .duty-person-dept { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); margin-bottom: 6px; }
    .duty-person-progress { display: flex; align-items: center; gap: var(--wc-gap-md); }
    .duty-person-progress .progress-bar { flex: 1; }
    .duty-person-progress .progress-text { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); white-space: nowrap; }
    /* QR码详情弹层 */
    .qr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .qr-overlay.show { display: flex; }
    .qr-detail-card {
      background: var(--wc-card-bg); border-radius: var(--wc-radius-lg); padding: 24px; width: 260px; text-align: center;
      box-shadow: var(--wc-shadow-overlay); position: relative;
    }
    .qr-detail-close {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border-radius: 50%; background: var(--wc-track-bg); display: flex; align-items: center;
      justify-content: center; font-size: var(--wc-gap-lg); cursor: pointer; color: var(--wc-text-placeholder);
    }
    .qr-detail-close:active { background: var(--wc-pressed-bg-alt); }
    .qr-detail-qr { width: 180px; height: 180px; margin: 0 auto 12px; border-radius: var(--wc-gap-lg); overflow: hidden; }
    .qr-detail-name { font-size: var(--wc-font-caption); color: var(--wc-text-tertiary); margin-bottom: 4px; }
    .qr-detail-time { font-size: var(--wc-font-small); color: var(--wc-text-disabled); margin-bottom: var(--wc-page-padding); }
    .qr-detail-actions { display: flex; gap: var(--wc-gap-lg); }
    .qr-detail-actions button { flex: 1; padding: var(--wc-gap-lg); border-radius: var(--wc-btn-radius); font-size: var(--wc-font-caption); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-sm); }
    .qr-detail-actions button svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="m-page with-tabbar">

    <div class="hc-header">
      <!-- 安全码模块 -->
      <div style="position:relative;z-index:1;padding:0 var(--wc-page-padding);">
        <div class="hc-code-card">
          <div class="hc-card-icons">
            <div class="hc-card-icon-btn" title="危险源信息">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="hc-card-icon-btn" onclick="parent.navigateTo('scan')" title="扫一扫">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><line x1="6.5" y1="6.5" x2="8" y2="6.5"/><line x1="6.5" y1="6.5" x2="6.5" y2="8"/><line x1="17.5" y1="6.5" x2="16" y2="6.5"/><line x1="17.5" y1="6.5" x2="17.5" y2="8"/><line x1="6.5" y1="17.5" x2="8" y2="17.5"/><line x1="6.5" y1="17.5" x2="6.5" y2="16"/><line x1="17.5" y1="17.5" x2="16" y2="17.5"/><line x1="17.5" y1="17.5" x2="17.5" y2="16"/></svg>
            </div>
          </div>
          <div id="hcParentLabel" style="font-size:var(--wc-font-small);color:var(--wc-text-placeholder);text-align:left;margin-bottom:6px;cursor:pointer;" onclick="parent.navigateTo('place-code')">‹ 上级：A栋生产车间（场所码）</div>
          <div id="hcHazardName" style="font-size:var(--wc-font-title);font-weight:700;color:var(--wc-text-primary);text-align:left;margin-bottom:6px;">危化品存储区</div>
          <div id="hcHazardTags" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--wc-gap-xl);font-size:var(--wc-font-small);">
            <span style="background:var(--code-red-light);color:var(--code-red-dark);padding:2px 8px;border-radius:4px;">等级：重大（红色）</span>
            <span style="background:var(--code-yellow-light);color:var(--code-yellow-dark);padding:2px 8px;border-radius:4px;">R值：25</span>
            <span style="background:var(--wc-bg-gray);color:var(--wc-text-secondary);padding:2px 8px;border-radius:4px;">责任部门：生产运营部</span>
          </div>
          <div class="hc-qr-wrap" onclick="showQrDetail()">
            <div class="code-qr-canvas"><svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#fff"/><rect x="2" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="72" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="76" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="80" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="2" y="72" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="76" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="80" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="35" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="8" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="50" y="15" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="28" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="58" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="22" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="52" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="32" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="42" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="58" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="55" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="72" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="78" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="88" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="85" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="90" width="5" height="5" fill="#ff4d4f"/><rect x="72" y="88" width="5" height="5" fill="#ff4d4f"/><rect x="82" y="90" width="5" height="5" fill="#ff4d4f"/><rect x="92" y="85" width="5" height="5" fill="#ff4d4f"/></svg></div>
          </div>
          <div class="hc-qr-time">更新时间：2025-01-15 08:00</div>
          <div class="hc-action-row" style="justify-content:center;">
            <button class="m-btn" style="width:80px;background:var(--primary);color:var(--wc-card-bg);border:none;border-radius:var(--wc-btn-radius);font-size:var(--wc-font-small);padding:6px 0;"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>下载</button>
            <button class="m-btn" style="width:80px;background:var(--wc-card-bg);color:var(--primary);border:1px solid var(--primary);border-radius:var(--wc-btn-radius);font-size:var(--wc-font-small);padding:6px 0;"><svg viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>分享</button>
          </div>
        </div>
      </div>

      <!-- 快捷入口 -->
      <div style="margin-top:var(--wc-gap-lg);position:relative;z-index:1;padding:0 var(--wc-page-padding);">
        <div id="hcQuickGrid" class="hc-quick-grid">
          <div class="hc-quick-item" onclick="parent.navigateTo('check-list')">
            <div class="hc-quick-icon orange">🔎</div>
            <div class="hc-quick-label">码上排查</div>
          </div>
          <div class="hc-quick-item" onclick="parent.navigateTo('hazard-stats')">
            <div class="hc-quick-icon green">⚠️</div>
            <div class="hc-quick-label">隐患记录</div>
          </div>
          <div class="hc-quick-item" onclick="parent.navigateTo('inspection-stats')">
            <div class="hc-quick-icon purple">📄</div>
            <div class="hc-quick-label">检查记录</div>
          </div>
          <div class="hc-quick-item" onclick="parent.navigateTo('code-change')">
            <div class="hc-quick-icon blue">🔄</div>
            <div class="hc-quick-label">变码记录</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 责任与履职状态 -->
    <div class="m-card">
      <div class="m-card-title">责任与履职状态</div>
      <div class="duty-person-card">
        <div class="duty-person-avatar area">👷</div>
        <div class="duty-person-detail">
          <div class="duty-person-row">
            <span class="duty-person-name">王操作</span>
            <span class="duty-person-pos">区域责任人</span>
          </div>
          <div class="duty-person-dept">生产运营部 · 隐患整改负责人</div>
          <div class="duty-person-progress">
            <div class="progress-bar" style="flex:1">
              <div class="progress-fill red" style="width:33%"></div>
            </div>
            <span class="progress-text">整改 1/3</span>
          </div>
        </div>
      </div>
      <div class="duty-person-card">
        <div class="duty-person-avatar scan">🔍</div>
        <div class="duty-person-detail">
          <div class="duty-person-row">
            <span class="duty-person-name">赵巡检</span>
            <span class="duty-person-pos">扫码责任人</span>
          </div>
          <div class="duty-person-dept">安全管理部 · 巡检专员</div>
          <div style="display:flex;justify-content:space-between;font-size:var(--wc-font-small);color:var(--wc-text-tertiary);margin-bottom:6px;">
            <span>巡检频次：每日1次</span>
            <span style="color:var(--code-yellow)">未完成</span>
          </div>
          <div class="duty-person-progress">
            <div class="progress-bar" style="flex:1">
              <div class="progress-fill yellow" style="width:50%"></div>
            </div>
            <span class="progress-text">巡检 1/2</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐患统计 - 独立卡片 -->
    <div class="m-card">
      <div class="m-card-title">隐患统计 <span style="font-size:var(--wc-font-small);color:var(--wc-blue);font-weight:400;cursor:pointer;" onclick="parent.navigateTo('hazard-stats')">查看详情 ›</span></div>
      <div class="stat-row" style="padding:0;margin-bottom:var(--wc-gap-xl);">
        <div class="stat-item"><div class="stat-num">5</div><div class="stat-label">隐患总数</div></div>
        <div class="stat-item"><div class="stat-num" style="color:var(--code-red)">2</div><div class="stat-label">待整改</div></div>
        <div class="stat-item"><div class="stat-num" style="color:var(--code-yellow)">1</div><div class="stat-label">整改中</div></div>
        <div class="stat-item"><div class="stat-num" style="color:var(--code-green)">2</div><div class="stat-label">已整改</div></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-page-padding);">
        <div class="ring-chart" style="background:conic-gradient(var(--code-green) 0% 40%, var(--code-yellow) 40% 60%, var(--code-red) 60% 100%);">
          <div class="ring-chart-inner">40%</div>
        </div>
        <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:2;">
          <span style="color:var(--code-green)">●</span> 已整改 2项<br>
          <span style="color:var(--code-yellow)">●</span> 整改中 1项<br>
          <span style="color:var(--code-red)">●</span> 待整改 2项
        </div>
      </div>
    </div>

    <div style="height:var(--wc-gap-lg);"></div>
  </div>

  <!-- QR码详情弹层 -->
  <div class="qr-overlay" id="qrOverlay" onclick="if(event.target===this)closeQrDetail()">
    <div class="qr-detail-card" style="position:relative;">
      <div class="qr-detail-close" onclick="closeQrDetail()">✕</div>
      <div class="qr-detail-qr"><svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#fff"/><rect x="2" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="72" y="2" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="76" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="80" y="10" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="2" y="72" width="26" height="26" fill="#ff4d4f" rx="3"/><rect x="6" y="76" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="80" width="10" height="10" fill="#ff4d4f" rx="1"/><rect x="35" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="45" y="8" width="5" height="5" fill="#ff4d4f"/><rect x="55" y="5" width="5" height="5" fill="#ff4d4f"/><rect x="35" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="50" y="15" width="5" height="5" fill="#ff4d4f"/><rect x="60" y="18" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="18" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="28" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="48" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="58" y="38" width="5" height="5" fill="#ff4d4f"/><rect x="68" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="78" y="42" width="5" height="5" fill="#ff4d4f"/><rect x="88" y="35" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="22" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="38" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="52" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="65" y="52" width="5" height="5" fill="#ff4d4f"/><rect x="75" y="45" width="5" height="5" fill="#ff4d4f"/><rect x="85" y="48" width="5" height="5" fill="#ff4d4f"/><rect x="8" y="58" width="5" height="5" fill   <script>
    // QR码弹层
    function showQrDetail() {
      document.getElementById('qrOverlay').classList.add('show');
    }
    function closeQrDetail() {
      document.getElementById('qrOverlay').classList.remove('show');
    }

    // 初始化危险源码页面（根据 session 动态渲染）
    function initHazardCodePage() {
      if (typeof MobilePageConfig === 'undefined') return;
      var config = MobilePageConfig.getHazardCodeConfig();
      if (!config || !config.hazard) return;
      var h = config.hazard;

      // 更新父级标签
      var parentEl = document.getElementById('hcParentLabel');
      if (parentEl) {
        if (!h.parentName) {
          parentEl.style.display = 'none';
        } else {
          parentEl.style.display = '';
          parentEl.innerHTML = '&lsaquo; 上级：' + h.parentName + '（场所码）';
        }
      }

      // 更新危险源名称
      var nameEl = document.getElementById('hcHazardName');
      if (nameEl) nameEl.textContent = h.name;

      // 更新等级标签
      var tagsEl = document.getElementById('hcHazardTags');
      if (tagsEl) {
        var levelClassMap = { red: 'var(--code-red-light)', yellow: 'var(--code-yellow-light)', green: 'var(--code-bg-green)', orange: 'var(--code-yellow-light)' };
        var levelColorMap = { red: 'var(--code-red-dark)', yellow: 'var(--code-yellow-dark)', green: 'var(--code-green)', orange: 'var(--code-yellow-dark)' };
        tagsEl.innerHTML =
          '<span style="background:' + (levelClassMap[h.levelColor] || 'var(--code-red-light)') + ';color:' + (levelColorMap[h.levelColor] || 'var(--code-red-dark)') + ';padding:2px 8px;border-radius:4px;">等级：' + h.level + '（' + (h.levelColor === 'red' ? '红色' : h.levelColor === 'yellow' ? '黄色' : h.levelColor === 'green' ? '绿色' : '橙色') + '）</span>' +
          '<span style="background:var(--code-yellow-light);color:var(--code-yellow-dark);padding:2px 8px;border-radius:4px;">R值：' + h.rValue + '</span>' +
          '<span style="background:var(--wc-bg-gray);color:var(--wc-text-secondary);padding:2px 8px;border-radius:4px;">责任部门：' + h.dept + '</span>';
      }

      // 更新背景渐变
      var mPage = document.querySelector('.m-page');
      if (mPage) mPage.style.backgroundImage = config.gradient;

      // 更新危险源码边框颜色
      var qrWrap = document.querySelector('.hc-qr-wrap');
      if (qrWrap) {
        var borderColors = { red: 'var(--wc-code-border-red)', yellow: 'var(--wc-code-border-yellow)', green: 'var(--wc-code-border-green)', orange: 'var(--wc-code-border-orange, #fa8c16)' };
        qrWrap.style.borderColor = borderColors[h.levelColor] || 'var(--wc-code-border-red)';
      }

      // 更新时间
      var timeEl = document.querySelector('.hc-qr-time');
      if (timeEl) timeEl.textContent = '更新时间：' + h.qrTime;

      // 更新快捷入口
      var quickGrid = document.getElementById('hcQuickGrid');
      if (quickGrid && h.quickActions) {
        var html = '';
        h.quickActions.forEach(function(a) {
          var onclick = a.nav ? " onclick=\"parent.navigateTo('" + a.nav + "')\"" : '';
          html += '<div class="hc-quick-item"' + onclick + '>' +
            '<div class="hc-quick-icon ' + a.color + '">' + a.icon + '</div>' +
            '<div class="hc-quick-label">' + a.label + '</div>' +
            '</div>';
        });
        quickGrid.innerHTML = html;
      }

      // 更新责任与履职状态
      var dutyCards = document.querySelectorAll('.duty-person-card');
      if (dutyCards.length > 0 && h.dutyPersons) {
        var dutyHtml = '';
        h.dutyPersons.forEach(function(p) {
          var avatarClass = p.pos && p.pos.indexOf('区域') >= 0 ? 'area' : 'scan';
          var avatarIcon = avatarClass === 'area' ? '&#x1F477;' : '&#x1F50D;';
          var statusLine = '';
          if (p.freq) {
            statusLine = '<div style="display:flex;justify-content:space-between;font-size:var(--wc-font-small);color:var(--wc-text-tertiary);margin-bottom:6px;">' +
              '<span>巡检频次：' + p.freq + '</span>' +
              '<span style="color:' + (p.statusColor || 'var(--success)') + '">' + (p.status || '已完成') + '</span>' +
              '</div>';
          }
          dutyHtml +=
            '<div class="duty-person-card">' +
              '<div class="duty-person-avatar ' + avatarClass + '">' + avatarIcon + '</div>' +
              '<div class="duty-person-detail">' +
                '<div class="duty-person-row">' +
                  '<span class="duty-person-name">' + p.name + '</span>' +
                  '<span class="duty-person-pos">' + p.pos + '</span>' +
                '</div>' +
                '<div class="duty-person-dept">' + p.dept + '</div>' +
                statusLine +
                '<div class="duty-person-progress">' +
                  '<div class="progress-bar" style="flex:1">' +
                    '<div class="progress-fill ' + (p.progressPct >= 100 ? 'green' : p.progressPct >= 50 ? 'yellow' : 'red') + '" style="width:' + p.progressPct + '%"></div>' +
                  '</div>' +
                  '<span class="progress-text">整改 ' + p.progress + '</span>' +
                '</div>' +
              '</div>' +
            '</div>';
        });
        // Replace all duty person cards
        var dutyContainer = dutyCards[0].parentElement;
        dutyContainer.innerHTML = dutyHtml;
      }

      // 更新隐患统计
      var hazardStatsCards = document.querySelectorAll('.m-card .stat-row');
      if (hazardStatsCards.length > 0 && h.hazardStats) {
        var hs = h.hazardStats;
        var statsRow = hazardStatsCards[0];
        statsRow.innerHTML =
          '<div class="stat-item"><div class="stat-num">' + hs.total + '</div><div class="stat-label">隐患总数</div></div>' +
          '<div class="stat-item"><div class="stat-num" style="color:var(--code-red)">' + hs.pending + '</div><div class="stat-label">待整改</div></div>' +
          '<div class="stat-item"><div class="stat-num" style="color:var(--code-yellow)">' + hs.fixing + '</div><div class="stat-label">整改中</div></div>' +
          '<div class="stat-item"><div class="stat-num" style="color:var(--code-green)">' + hs.done + '</div><div class="stat-label">已整改</div></div>';

        // Update ring chart
        var ringCharts = document.querySelectorAll('.ring-chart');
        if (ringCharts.length > 0 && hs.total > 0) {
          var donePct = Math.round(hs.done / hs.total * 100);
          var fixingEnd = Math.round((hs.done + hs.fixing) / hs.total * 100);
          ringCharts[0].style.background = 'conic-gradient(var(--code-green) 0% ' + donePct + '%, var(--code-yellow) ' + donePct + '% ' + fixingEnd + '%, var(--code-red) ' + fixingEnd + '% 100%)';
          var innerEl = ringCharts[0].querySelector('.ring-chart-inner');
          if (innerEl) innerEl.textContent = donePct + '%';
        }

        // Update legend
        var legends = document.querySelectorAll('.m-card .stat-row');
        // Find the legend div after stat-row
        var statRowParent = statsRow.parentElement;
        var flexDiv = statRowParent.querySelector('div[style*="display:flex"]');
        if (flexDiv) {
          var legendTexts = flexDiv.querySelectorAll('div[style*="line-height:2"]');
          if (legendTexts.length > 0) {
            legendTexts[0].innerHTML =
              '<span style="color:var(--code-green)">&#x25CF;</span> 已整改 ' + hs.done + '项<br>' +
              '<span style="color:var(--code-yellow)">&#x25CF;</span> 整改中 ' + hs.fixing + '项<br>' +
              '<span style="color:var(--code-red)">&#x25CF;</span> 待整改 ' + hs.pending + '项';
          }
        }
      }

      // 更新QR码详情弹层
      var qrDetailName = document.querySelector('.qr-detail-name');
      if (qrDetailName) qrDetailName.textContent = h.name;
      var qrDetailTime = document.querySelector('.qr-detail-time');
      if (qrDetailTime) qrDetailTime.textContent = '更新时间：' + h.qrTime;
    }
    // initHazardCodePage 将在外部脚本加载后调用
  </script>
<script src="../../js/domain-data.js"></script>
<script src="../../js/mobile-page-config.js"></script>
<script src="../../js/mobile-session.js"></script>
<script>initHazardCodePage();</script>
