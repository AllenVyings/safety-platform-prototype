<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隐患统计</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .hs-card { background: var(--wc-card-bg); border-radius: 12px; padding: 14px var(--wc-page-padding); margin: var(--wc-gap-lg) var(--wc-page-padding); box-shadow: var(--wc-shadow-card); }
    .hs-card-title { font-size: var(--wc-font-body); font-weight: 600; color: var(--wc-text-primary); margin-bottom: var(--wc-gap-xl); display: flex; align-items: center; justify-content: space-between; }
    .hs-chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--wc-gap-xl); }
    .hs-chart-item { text-align: center; padding: var(--wc-gap-lg) 0; background: var(--wc-page-bg); border-radius: var(--wc-btn-radius); }
    .hs-chart-ring { margin: 0 auto 6px; }
    .hs-chart-label { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); }
    .hs-filter-bar { display: flex; gap: var(--wc-gap-md); padding: var(--wc-gap-md) var(--wc-page-padding); overflow-x: auto; background: var(--wc-card-bg); border-bottom: 0.5px solid var(--wc-track-bg); }
    .hs-filter-chip { white-space: nowrap; padding: 5px 14px; border-radius: 14px; font-size: 13px; background: var(--wc-bg-gray); color: var(--wc-text-tertiary); cursor: pointer; transition: all 0.2s ease; }
    .hs-filter-chip.active { background: var(--brand-blue); color: var(--wc-card-bg); }
    .hs-list-item { display: flex; align-items: center; padding: var(--wc-gap-xl) var(--wc-page-padding); background: var(--wc-card-bg); border-bottom: 0.5px solid var(--wc-bg-gray); cursor: pointer; }
    .hs-list-item:active { background: var(--wc-page-bg); }
    .hs-urgency { width: var(--wc-gap-sm); height: 32px; border-radius: 2px; margin-right: var(--wc-gap-lg); flex-shrink: 0; }
    .hs-list-info { flex: 1; }
    .hs-list-name { font-size: var(--wc-font-caption); color: var(--wc-text-primary); font-weight: 500; }
    .hs-list-meta { font-size: var(--wc-font-small); color: #888; margin-top: 2px; }
    .hs-list-badge { font-size: var(--wc-font-tiny); padding: 2px var(--wc-gap-md); border-radius: var(--wc-btn-radius); }
  </style>
</head>
<body>
  <div class="m-page">
    <!-- 总览图表 -->
    <div class="hs-card">
      <div class="hs-card-title">隐患总览</div>
      <div class="stat-row" style="padding:0;margin-bottom:12px;">
        <div class="stat-item"><div class="stat-num">12</div><div class="stat-label">总数</div></div>
        <div class="stat-item"><div class="stat-num" style="color:var(--code-red)">2</div><div class="stat-label">未整改</div></div>
        <div class="stat-item"><div class="stat-num" style="color:var(--code-yellow)">3</div><div class="stat-label">整改中</div></div>
        <div class="stat-item"><div class="stat-num" style="color:var(--code-green)">7</div><div class="stat-label">已整改</div></div>
      </div>
      <div class="hs-chart-grid">
        <div class="hs-chart-item">
          <div class="hs-chart-ring ring-chart" style="width:70px;height:70px;background:conic-gradient(var(--code-red) 0% 25%, var(--code-yellow) 25% 50%, var(--code-green) 50% 100%);">
            <div class="ring-chart-inner" style="top:12px;left:12px;width:46px;height:46px;font-size:12px;">12</div>
          </div>
          <div class="hs-chart-label">状态分布</div>
        </div>
        <div class="hs-chart-item">
          <div class="hs-chart-ring ring-chart" style="width:70px;height:70px;background:conic-gradient(var(--code-red) 0% 33%, var(--primary) 33% 100%);">
            <div class="ring-chart-inner" style="top:12px;left:12px;width:46px;height:46px;font-size:12px;">4:8</div>
          </div>
          <div class="hs-chart-label">重大:一般</div>
        </div>
        <div class="hs-chart-item">
          <div class="hs-chart-ring ring-chart" style="width:70px;height:70px;background:conic-gradient(var(--brand-blue) 0% 30%, #fa8c16 30% 60%, var(--code-red) 60% 80%, #722ed1 80% 100%);">
            <div class="ring-chart-inner" style="top:12px;left:12px;width:46px;height:46px;font-size:12px;">4类</div>
          </div>
          <div class="hs-chart-label">类型分布</div>
        </div>
        <div class="hs-chart-item">
          <div class="hs-chart-ring ring-chart" style="width:70px;height:70px;background:conic-gradient(var(--brand-blue) 0% 40%, var(--code-red) 40% 55%, var(--code-yellow) 55% 75%, var(--code-green) 75% 100%);">
            <div class="ring-chart-inner" style="top:12px;left:12px;width:46px;height:46px;font-size:12px;">4处</div>
          </div>
          <div class="hs-chart-label">高发部位</div>
        </div>
      </div>
    </div>

    <!-- 隐患列表 -->
    <div class="hs-filter-bar">
      <span class="hs-filter-chip active" onclick="filterHazard(this)">全部</span>
      <span class="hs-filter-chip" onclick="filterHazard(this)">未整改</span>
      <span class="hs-filter-chip" onclick="filterHazard(this)">整改中</span>
      <span class="hs-filter-chip" onclick="filterHazard(this)">已整改</span>
    </div>
    <div class="hs-list-item" onclick="parent.navigateTo('hazard-detail')">
      <div class="hs-urgency" style="background:var(--primary)"></div>
      <div class="hs-list-info"><div class="hs-list-name">配电房灭火器过期</div><div class="hs-list-meta">消防 · 重大 · 期限 01-15</div></div>
      <span class="hs-list-badge code-badge green" style="background:var(--primary-light);color:var(--primary);">未整改</span>
    </div>
    <div class="hs-list-item" onclick="parent.navigateTo('hazard-detail')">
      <div class="hs-urgency" style="background:var(--primary)"></div>
      <div class="hs-list-info"><div class="hs-list-name">电气线路绝缘层破损</div><div class="hs-list-meta">电气 · 重大 · 期限 01-25</div></div>
      <span class="hs-list-badge code-badge green" style="background:var(--primary-light);color:var(--primary);">未整改</span>
    </div>
    <div class="hs-list-item" onclick="parent.navigateTo('hazard-detail')">
      <div class="hs-urgency" style="background:var(--code-yellow)"></div>
      <div class="hs-list-info"><div class="hs-list-name">仓库安全出口标识缺失</div><div class="hs-list-meta">标志 · 一般 · 期限 01-20</div></div>
      <span class="hs-list-badge code-badge yellow">整改中</span>
    </div>
    <div class="hs-list-item" onclick="parent.navigateTo('hazard-detail')">
      <div class="hs-urgency" style="background:var(--code-yellow)"></div>
      <div class="hs-list-info"><div class="hs-list-name">危化品存储区通风不良</div><div class="hs-list-meta">设备 · 一般 · 期限 02-01</div></div>
      <span class="hs-list-badge code-badge yellow">整改中</span>
    </div>
    <div class="hs-list-item">
      <div class="hs-urgency" style="background:var(--code-yellow)"></div>
      <div class="hs-list-info"><div class="hs-list-name">实验室化学品未分类存放</div><div class="hs-list-meta">危化品 · 一般 · 期限 01-30</div></div>
      <span class="hs-list-badge code-badge yellow">整改中</span>
    </div>

    <div style="height:32px;"></div>
  </div>

  <script>
    function filterHazard(el) {
      document.querySelectorAll('.hs-filter-chip').forEach(function(c){c.classList.remove('active');});
      el.classList.add('active');
    }
  </script>
</body>
</html>
