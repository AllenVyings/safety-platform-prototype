<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的隐患</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .mh-stat-bar { display: flex; gap: var(--wc-gap-md); padding: var(--wc-gap-xl) var(--wc-page-padding); background: var(--wc-card-bg); border-bottom: 0.5px solid var(--wc-track-bg); }
    .mh-stat-item { flex: 1; text-align: center; padding: var(--wc-gap-lg) 0; background: var(--wc-page-bg); border-radius: var(--wc-btn-radius); }
    .mh-stat-num { font-size: 20px; font-weight: 700; }
    .mh-stat-label { font-size: var(--wc-font-tiny); color: var(--wc-text-placeholder); margin-top: 2px; }
    .mh-bar-chart { display: flex; align-items: center; gap: var(--wc-gap-xl); padding: var(--wc-gap-xl) var(--wc-page-padding) var(--wc-gap-md); background: var(--wc-card-bg); }
    .mh-bar-label { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); white-space: nowrap; }
    .mh-bar-track { flex: 1; height: 8px; background: var(--wc-track-bg); border-radius: var(--wc-radius-sm); overflow: hidden; display: flex; }
    .mh-bar-fill { height: 100%; }
    .mh-bar-fill.green { background: var(--code-green); }
    .mh-bar-fill.orange { background: var(--code-yellow); }
    .mh-bar-fill.red { background: var(--code-red); }
    .mh-bar-legend { display: flex; gap: var(--wc-gap-xl); padding: var(--wc-gap-sm) var(--wc-page-padding) var(--wc-gap-lg); background: var(--wc-card-bg); }
    .mh-bar-legend-item { font-size: var(--wc-font-tiny); color: var(--wc-text-tertiary); display: flex; align-items: center; gap: var(--wc-gap-sm); }
    .mh-bar-legend-dot { width: 6px; height: 6px; border-radius: 50%; }
    .mh-filter-bar { display: flex; gap: var(--wc-gap-md); padding: var(--wc-gap-md) var(--wc-page-padding); overflow-x: auto; background: var(--wc-card-bg); border-bottom: 0.5px solid var(--wc-track-bg); }
    .mh-filter-chip { white-space: nowrap; padding: 5px 14px; border-radius: 14px; font-size: var(--wc-font-small); background: var(--wc-pressed-bg); color: var(--wc-text-tertiary); cursor: pointer; transition: all 0.2s ease; }
    .mh-filter-chip.active { background: var(--brand-blue); color: var(--wc-card-bg); }
    .mh-tab { display: flex; background: var(--wc-card-bg); border-bottom: 0.5px solid var(--wc-track-bg); }
    .mh-tab-item { flex: 1; text-align: center; padding: var(--wc-gap-lg) 0; font-size: var(--wc-font-caption); color: var(--wc-text-placeholder); cursor: pointer; position: relative; }
    .mh-tab-item.active { color: var(--brand-blue); font-weight: 600; }
    .mh-tab-item.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: var(--brand-blue); border-radius: 1.5px; }
    .mh-card { background: var(--wc-card-bg); padding: 14px var(--wc-page-padding); margin: var(--wc-gap-lg) var(--wc-page-padding); border-radius: 12px; box-shadow: var(--wc-shadow-card); cursor: pointer; transition: background 0.15s ease; }
    .mh-card:active { background: var(--wc-page-bg); }
    .mh-card-row { display: flex; justify-content: space-between; font-size: var(--wc-font-small); padding: 3px 0; }
    .mh-card-label { color: var(--wc-text-placeholder); }
    .mh-card-value { color: var(--wc-text-secondary); }
    .mh-card-value.red { color: var(--code-red); }
.mh-card-value.blue { color: var(--code-blue); }
    .mh-card-value.orange { color: var(--code-yellow); }
    .mh-card-value.green { color: var(--code-green); }
  </style>
</head>
<body>
  <div class="m-page">
    <!-- 统计卡片区 -->
    <div class="mh-stat-bar">
      <div class="mh-stat-item"><div class="mh-stat-num">12</div><div class="mh-stat-label">隐患总数</div></div>
      <div class="mh-stat-item"><div class="mh-stat-num" style="color:var(--brand-cyan)">7</div><div class="mh-stat-label">我排查的</div></div>
      <div class="mh-stat-item"><div class="mh-stat-num" style="color:var(--code-yellow)">5</div><div class="mh-stat-label">我整改的</div></div>
    </div>
    <div class="mh-bar-chart">
      <span class="mh-bar-label">状态占比</span>
      <div class="mh-bar-track">
        <div class="mh-bar-fill green" style="width:58%"></div>
        <div class="mh-bar-fill orange" style="width:25%"></div>
        <div class="mh-bar-fill red" style="width:17%"></div>
      </div>
    </div>
    <div class="mh-bar-legend">
      <div class="mh-bar-legend-item"><span class="mh-bar-legend-dot" style="background:var(--code-green)"></span>已整改 7</div>
      <div class="mh-bar-legend-item"><span class="mh-bar-legend-dot" style="background:var(--code-yellow)"></span>整改中 3</div>
      <div class="mh-bar-legend-item"><span class="mh-bar-legend-dot" style="background:var(--code-red)"></span>未整改 2</div>
    </div>

    <div class="mh-tab">
      <div class="mh-tab-item active" onclick="switchView(this,0)">我排查的 (7)</div>
      <div class="mh-tab-item" onclick="switchView(this,1)">我整改的 (5)</div>
    </div>

    <div class="mh-filter-bar">
      <span class="mh-filter-chip active">全部</span>
      <span class="mh-filter-chip">未整改</span>
      <span class="mh-filter-chip">整改中</span>
      <span class="mh-filter-chip">已整改</span>
    </div>

    <!-- 我排查的 -->
    <div id="viewPanel0">
      <div class="mh-card" onclick="parent.navigateTo('hazard-detail')">
        <div class="mh-card-row"><span class="mh-card-label">隐患类型</span><span class="mh-card-value">消防</span></div>
        <div class="mh-card-row"><span class="mh-card-label">安全管控对象</span><span class="mh-card-value">A栋配电房</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改状态</span><span class="mh-card-value blue">未整改</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改期限</span><span class="mh-card-value">2025-01-15</span></div>
      </div>
      <div class="mh-card" onclick="parent.navigateTo('hazard-detail')">
        <div class="mh-card-row"><span class="mh-card-label">隐患类型</span><span class="mh-card-value">电气</span></div>
        <div class="mh-card-row"><span class="mh-card-label">安全管控对象</span><span class="mh-card-value">A栋生产车间</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改状态</span><span class="mh-card-value blue">未整改</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改期限</span><span class="mh-card-value">2025-01-25</span></div>
      </div>
      <div class="mh-card">
        <div class="mh-card-row"><span class="mh-card-label">隐患类型</span><span class="mh-card-value">标志</span></div>
        <div class="mh-card-row"><span class="mh-card-label">安全管控对象</span><span class="mh-card-value">B栋仓库</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改状态</span><span class="mh-card-value orange">整改中</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改期限</span><span class="mh-card-value">2025-01-20</span></div>
      </div>
    </div>

    <!-- 我整改的 -->
    <div id="viewPanel1" style="display:none;">
      <div class="mh-card">
        <div class="mh-card-row"><span class="mh-card-label">隐患类型</span><span class="mh-card-value">设备</span></div>
        <div class="mh-card-row"><span class="mh-card-label">安全管控对象</span><span class="mh-card-value">危化品存储区</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改状态</span><span class="mh-card-value orange">整改中</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改期限</span><span class="mh-card-value">2025-02-01</span></div>
      </div>
      <div class="mh-card">
        <div class="mh-card-row"><span class="mh-card-label">隐患类型</span><span class="mh-card-value">消防</span></div>
        <div class="mh-card-row"><span class="mh-card-label">安全管控对象</span><span class="mh-card-value">B栋仓库</span></div>
        <div class="mh-card-row"><span class="mh-card-label">整改状态</span><span class="mh-card-value green">已整改</span></div>
        <div class="mh-card-row"><span class="mh-card-label">完成时间</span><span class="mh-card-value">2025-01-10</span></div>
      </div>
    </div>

    <div style="height:32px;"></div>
  </div>

  <script>
    function switchView(el, idx) {
      el.parentElement.querySelectorAll('.mh-tab-item').forEach(function(t){t.classList.remove('active');});
      el.classList.add('active');
      document.getElementById('viewPanel0').style.display = idx === 0 ? '' : 'none';
      document.getElementById('viewPanel1').style.display = idx === 1 ? '' : 'none';
    }
    document.querySelectorAll('.mh-filter-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.mh-filter-chip').forEach(function(c){c.classList.remove('active');});
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
