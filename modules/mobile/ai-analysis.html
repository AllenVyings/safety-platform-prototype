<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能分析</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    /* 顶部提示 */
    .ai-tip {
      display: flex; align-items: flex-start; gap: 10px; margin: 16px; padding: 12px 14px;
      background: linear-gradient(135deg, #f0f5ff, #e6f7ff); border-radius: 10px;
      border-left: 3px solid #1677ff;
    }
    .ai-tip-icon { flex-shrink: 0; font-size: 18px; line-height: 1.4; }
    .ai-tip-text { font-size: 12px; color: #595959; line-height: 1.6; }
    .ai-tip-line { margin-bottom: 4px; line-height: 1.6; }
    .ai-tip-line:last-child { margin-bottom: 0; }
    .ai-tip-line-label { font-size: 14px; color: #000; font-weight: 600; }
    .ai-tip-line-text { font-size: 13px; color: #8c8c8c; }

    /* 上传区域 */
    .ai-upload-area {
      background: #fff; border-radius: 12px; margin: 16px; padding: 32px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04); text-align: center;
    }
    .ai-upload-actions { display: flex; gap: 16px; justify-content: center; }
    .ai-upload-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 140px; height: 120px; border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .ai-upload-btn.camera {
      background: linear-gradient(135deg, #e6f7ff, #bae7ff); border: 1.5px solid #91d5ff;
    }
    .ai-upload-btn.camera:active { background: linear-gradient(135deg, #bae7ff, #91d5ff); }
    .ai-upload-btn.album {
      background: linear-gradient(135deg, #f6ffed, #d9f7be); border: 1.5px solid #b7eb8f;
    }
    .ai-upload-btn.album:active { background: linear-gradient(135deg, #d9f7be, #b7eb8f); }
    .ai-upload-btn svg { width: 32px; height: 32px; margin-bottom: 8px; }
    .ai-upload-btn-label { font-size: 14px; font-weight: 600; }
    .ai-upload-btn.camera .ai-upload-btn-label { color: #1677ff; }
    .ai-upload-btn.album .ai-upload-btn-label { color: #52c41a; }
    .ai-upload-btn-sub { font-size: 11px; color: #999; margin-top: 4px; }

    /* 图片预览 + 删除 */
    .ai-preview {
      display: none; background: #fff; border-radius: 12px; margin: 16px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .ai-preview.show { display: block; }
    .ai-preview-img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
    .ai-preview-bar {
      display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    }
    .ai-preview-name { font-size: 13px; color: #595959; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-preview-del { font-size: 13px; color: #ff4d4f; cursor: pointer; margin-left: 12px; flex-shrink: 0; }
    .ai-preview-del:active { opacity: 0.7; }

    /* 开始识别按钮 */
    .ai-analyze-btn {
      display: none; margin: 16px auto; padding: 14px 0; border-radius: 24px;
      width: 85%;
      font-size: 15px; font-weight: 600; text-align: center; cursor: pointer;
      background: linear-gradient(135deg, #1677ff, #4096ff); color: #fff; border: none;
      box-shadow: 0 4px 12px rgba(22,119,255,0.35);
      letter-spacing: 2px;
    }
    .ai-analyze-btn.show { display: block; }
    .ai-analyze-btn:active { background: linear-gradient(135deg, #0958d9, #1677ff); box-shadow: 0 2px 6px rgba(22,119,255,0.25); }

    /* 加载动画 */
    .ai-loading { display: none; text-align: center; padding: 48px 16px; }
    .ai-loading.show { display: block; }
    .ai-spinner {
      width: 36px; height: 36px; border: 3px solid #f0f0f0; border-top-color: #1677ff;
      border-radius: 50%; margin: 0 auto 12px; animation: ai-spin 0.8s linear infinite;
    }
    @keyframes ai-spin { to { transform: rotate(360deg); } }
    .ai-loading-text { font-size: 14px; color: #999; }

    /* 标注图片 */
    .ai-marked-img-area {
      margin: 16px; border-radius: 12px; overflow: hidden; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .ai-marked-img-label {
      font-size: 13px; font-weight: 600; color: #595959; padding: 10px 14px 0;
    }
    .ai-marked-img { width: 100%; display: block; }

    /* 识别结果 - 每条隐患独立卡片 */
    .ai-result-cards { margin: 0 16px; }
    .ai-result-card {
      background: #fff; border-radius: 12px; margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden;
    }
    .ai-result-body { padding: 14px 16px; }
    /* 字段行 - 左右对称 */
    .ai-result-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; line-height: 1.6; padding: 7px 0;
      border-bottom: 0.5px solid #f5f5f5;
    }
    .ai-result-row:last-child { border-bottom: none; }
    .ai-result-label { color: #8c8c8c; font-weight: 600; }
    .ai-result-value { color: #262626; font-weight: 500; text-align: right; }
    .ai-result-value.major { color: #ff4d4f; }
    .ai-result-value.normal { color: #faad14; }
    /* 隐患类型标签样式 */
    .ai-result-type-tag {
      display: inline-block; font-size: 12px; font-weight: 600;
      padding: 2px 10px; border-radius: 10px;
      color: #1677ff; background: #e6f7ff; border: 1px solid #91d5ff;
    }

    /* 智能上报抽屉 */
    .ai-report-mask {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45); z-index: 50;
    }
    .ai-report-mask.show { display: block; }
    .ai-report-drawer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
      background: #fff; border-radius: 14px 14px 0 0;
      transform: translateY(100%); transition: transform 0.3s ease;
      max-height: 85vh; display: flex; flex-direction: column;
    }
    .ai-report-drawer.show { transform: translateY(0); }
    .ai-report-drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; border-bottom: 0.5px solid #f0f0f0; flex-shrink: 0;
    }
    .ai-report-drawer-title { font-size: 16px; font-weight: 600; color: #000; }
    .ai-report-drawer-close {
      width: 28px; height: 28px; border-radius: 50%; background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #999; cursor: pointer; border: none;
    }
    .ai-report-drawer-close:active { background: #e8e8e8; }
    .ai-report-drawer-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    /* 隐患表单卡片 */
    .ai-hazard-form {
      border-bottom: 6px solid #f5f7fa; padding: 14px 16px;
    }
    .ai-hazard-form:last-child { border-bottom: none; }
    .ai-hf-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .ai-hf-check {
      width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid #d9d9d9;
      flex-shrink: 0; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.2s;
    }
    .ai-hf-check.checked { background: #1677ff; border-color: #1677ff; }
    .ai-hf-check.checked::after {
      content: ''; width: 6px; height: 10px; border: 2px solid #fff; border-top: none;
      border-left: none; transform: rotate(45deg) translateY(-1px);
    }
    .ai-hf-title { font-size: 14px; font-weight: 600; color: #000; flex: 1; line-height: 1.4; }
    .ai-hf-level { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
    .ai-hf-level.normal { color: #faad14; background: #fffbe6; }
    .ai-hf-level.major { color: #ff4d4f; background: #fff2f0; }
    .ai-hf-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #8c8c8c; }
    .ai-hf-type { background: #f5f5f5; padding: 2px 8px; border-radius: 4px; }
    .ai-hf-suggest { color: #1677ff; flex: 1; line-height: 1.5; }
    .ai-hf-field { margin-top: 10px; }
    .ai-hf-field-label { font-size: 13px; color: #666; margin-bottom: 6px; }
    .ai-hf-field-label .req { color: #ff4d4f; }
    .ai-hf-select {
      width: 100%; height: 36px; border: 1px solid #d9d9d9; border-radius: 8px;
      padding: 0 10px; font-size: 13px; color: #333; background: #fff; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 10px center; box-sizing: border-box;
    }
    .ai-hf-deadline-row { display: flex; gap: 10px; }
    .ai-hf-deadline-btn {
      flex: 1; padding: 8px 0; border: 1px solid #d9d9d9; border-radius: 8px;
      font-size: 13px; text-align: center; cursor: pointer; background: #fff; color: #666;
    }
    .ai-hf-deadline-btn.active { background: #f0f4ff; border-color: #1677ff; color: #1677ff; }
    .ai-hf-stepper { margin-top: 10px; display: none; align-items: center; gap: 12px; }
    .ai-hf-stepper.show { display: flex; }
    .ai-hf-stepper-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid #d9d9d9;
      background: #fff; font-size: 18px; color: #666; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ai-hf-stepper-btn:active { background: #f5f5f5; }
    .ai-hf-stepper-btn:disabled { color: #d9d9d9; border-color: #f0f0f0; cursor: not-allowed; }
    .ai-hf-stepper-value { font-size: 16px; font-weight: 600; color: #000; min-width: 28px; text-align: center; }
    .ai-hf-stepper-unit { font-size: 13px; color: #8c8c8c; }
    /* 抽屉底部 */
    .ai-report-drawer-footer {
      padding: 12px 16px; border-top: 0.5px solid #f0f0f0; flex-shrink: 0;
    }
    .ai-report-confirm-btn {
      width: 100%; padding: 12px 0; border-radius: 10px; font-size: 15px; font-weight: 600;
      text-align: center; cursor: pointer; border: none;
      background: #1677ff; color: #fff;
    }
    .ai-report-confirm-btn:active { background: #0958d9; }
    .ai-report-confirm-btn:disabled { background: #d9d9d9; color: #fff; cursor: not-allowed; }

    /* 底部操作按钮 */
    .ai-bottom-bar {
      display: none; padding: 12px 16px; gap: 10px; background: #fff;
      box-shadow: 0 -1px 6px rgba(0,0,0,0.06); position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    }
    .ai-bottom-bar.show { display: flex; }
    .ai-bar-btn {
      flex: 1; padding: 11px 0; border-radius: 10px; font-size: 14px; font-weight: 500;
      text-align: center; cursor: pointer; border: none;
    }
    .ai-bar-btn.retry { background: #fff; color: #666; border: 1px solid #d9d9d9; }
    .ai-bar-btn.retry:active { background: #f5f5f5; }
    .ai-bar-btn.report { background: #1677ff; color: #fff; }
    .ai-bar-btn.report:active { background: #0958d9; }
  </style>
</head>
<body>
  <div class="m-page" style="background:#f5f7fa;">

    <!-- 顶部提示 -->
    <div class="ai-tip">
      <div class="ai-tip-icon">💡</div>
      <div class="ai-tip-text" id="tipText"><div class="ai-tip-line">拍摄或上传现场照片，AI将自动识别图片中的安全隐患，并给出隐患等级和整改建议。</div></div>
    </div>

    <!-- 上传区域 -->
    <div class="ai-upload-area" id="uploadArea">
      <div class="ai-upload-actions">
        <div class="ai-upload-btn camera" onclick="openCamera()">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <div class="ai-upload-btn-label">拍照识别</div>
          <div class="ai-upload-btn-sub">拍摄现场照片</div>
        </div>
        <div class="ai-upload-btn album" onclick="openAlbum()">
          <svg viewBox="0 0 24 24" fill="none" stroke="#52c41a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <div class="ai-upload-btn-label">上传图片</div>
          <div class="ai-upload-btn-sub">从相册选择</div>
        </div>
      </div>
    </div>

    <!-- 图片预览 -->
    <div class="ai-preview" id="previewArea">
      <img class="ai-preview-img" id="previewImg" src="" alt="预览">
      <div class="ai-preview-bar">
        <span class="ai-preview-name" id="previewName">image.jpg</span>
        <span class="ai-preview-del" onclick="removeImage()">删除</span>
      </div>
    </div>

    <!-- 开始识别按钮 -->
    <button class="ai-analyze-btn" id="analyzeBtn" onclick="startAnalyze()">开始识别</button>

    <!-- 加载动画 -->
    <div class="ai-loading" id="loadingArea">
      <div class="ai-spinner"></div>
      <div class="ai-loading-text">AI 正在识别中...</div>
    </div>

    <!-- 标注图片 -->
    <div class="ai-marked-img-area" id="markedImgArea" style="display:none;">
      <div class="ai-marked-img-label">隐患位置标注</div>
      <canvas class="ai-marked-img" id="markedCanvas"></canvas>
    </div>

    <!-- 识别结果 - 独立卡片 -->
    <div class="ai-result-cards" id="resultArea" style="display:none;"></div>

    <div style="height:80px;"></div>
  </div>

  <!-- 智能上报抽屉 -->
  <div class="ai-report-mask" id="reportMask" onclick="closeReportDrawer()"></div>
  <div class="ai-report-drawer" id="reportDrawer">
    <div class="ai-report-drawer-header">
      <div class="ai-report-drawer-title">智能上报</div>
      <button class="ai-report-drawer-close" onclick="closeReportDrawer()">✕</button>
    </div>
    <div class="ai-report-drawer-body" id="reportDrawerBody"></div>
    <div class="ai-report-drawer-footer">
      <button class="ai-report-confirm-btn" id="reportConfirmBtn" onclick="confirmReport()">确认上报</button>
    </div>
  </div>

  <!-- 底部操作按钮 -->
  <div class="ai-bottom-bar" id="bottomBar">
    <button class="ai-bar-btn retry" onclick="retryAnalyze()">重新识别</button>
    <button class="ai-bar-btn report" onclick="smartReport()">智能上报</button>
  </div>

  <script>
    var hasImage = false;
    var identifiedItems = [];
    var reportCheckedSet = {};
    var deadlineModes = {};
    var aiDays = {};

    // 模拟原始图片 SVG
    var sceneSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">'
      + '<rect fill="#d9d9d9" width="400" height="280"/>'
      + '<rect x="20" y="40" width="120" height="200" rx="4" fill="#bfbfbf"/>'
      + '<rect x="160" y="60" width="220" height="80" rx="4" fill="#bfbfbf"/>'
      + '<rect x="160" y="160" width="100" height="100" rx="4" fill="#bfbfbf"/>'
      + '<circle cx="300" cy="210" r="40" fill="#d4d4d4"/>'
      + '<rect x="30" y="50" width="100" height="8" rx="2" fill="#ffccc7"/>'
      + '<rect x="30" y="70" width="100" height="8" rx="2" fill="#ffccc7"/>'
      + '<rect x="170" y="80" width="200" height="6" rx="2" fill="#ffe58f"/>'
      + '<rect x="170" y="100" width="200" height="6" rx="2" fill="#ffe58f"/>'
      + '</svg>';

    function openCamera() {
      hasImage = true;
      document.getElementById('previewImg').src = 'data:image/svg+xml,' + encodeURIComponent(sceneSvg);
      document.getElementById('previewName').textContent = '现场照片_' + new Date().getHours() + String(new Date().getMinutes()).padStart(2,'0') + '.jpg';
      showPreviewState();
    }

    function openAlbum() {
      hasImage = true;
      document.getElementById('previewImg').src = 'data:image/svg+xml,' + encodeURIComponent(sceneSvg);
      document.getElementById('previewName').textContent = 'IMG_' + Date.now() % 10000 + '.jpg';
      showPreviewState();
    }

    function showPreviewState() {
      document.getElementById('tipText').innerHTML = '<div class="ai-tip-line">拍摄或上传现场照片，AI将自动识别图片中的安全隐患，并给出隐患等级和整改建议。</div>';
      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('previewArea').classList.add('show');
      document.getElementById('analyzeBtn').classList.add('show');
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('markedImgArea').style.display = 'none';
      document.getElementById('bottomBar').classList.remove('show');
    }

    function removeImage() {
      hasImage = false;
      document.getElementById('tipText').innerHTML = '<div class="ai-tip-line">拍摄或上传现场照片，AI将自动识别图片中的安全隐患，并给出隐患等级和整改建议。</div>';
      document.getElementById('uploadArea').style.display = '';
      document.getElementById('previewArea').classList.remove('show');
      document.getElementById('analyzeBtn').classList.remove('show');
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('markedImgArea').style.display = 'none';
      document.getElementById('bottomBar').classList.remove('show');
    }

    function startAnalyze() {
      if (!hasImage) return;
      document.getElementById('analyzeBtn').classList.remove('show');
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('markedImgArea').style.display = 'none';
      document.getElementById('bottomBar').classList.remove('show');
      document.getElementById('loadingArea').classList.add('show');

      setTimeout(function() {
        document.getElementById('loadingArea').classList.remove('show');
        showResults();
      }, 2000);
    }

    function showResults() {
      identifiedItems = [
        { desc: '电气线路绝缘层破损裸露', type: '电气线路', level: 'major', suggest: '立即断电，更换破损线路或包扎绝缘层', risk: '触电风险、火灾风险' },
        { desc: '消防通道堆放杂物阻碍通行', type: '疏散通道', level: 'normal', suggest: '立即清理通道杂物，保持宽度≥1.2m', risk: '疏散受阻' },
        { desc: '配电箱未上锁且无警示标识', type: '设备设施', level: 'normal', suggest: '配电箱上锁并张贴"当心触电"警示标识', risk: '触电风险' }
      ];

      // 隐藏原图预览
      document.getElementById('previewArea').classList.remove('show');
      // 切换提示文本
      document.getElementById('tipText').innerHTML = '<div class="ai-tip-line"><span class="ai-tip-line-label">根据您提供的信息，识别到隐患情况和问题建议如下：</span></div><div class="ai-tip-line"><span class="ai-tip-line-text">以下由AI识别输出，隐患内容仅供参考</span></div>';

      // 绘制标注图片
      drawMarkedImage();

      // 渲染独立卡片
      var container = document.getElementById('resultArea');
      var html = '';
      identifiedItems.forEach(function(item, i) {
        var levelText = item.level === 'major' ? '重大隐患' : '一般隐患';
        var levelCls = item.level === 'major' ? 'major' : 'normal';
        html += '<div class="ai-result-card">'
          + '<div class="ai-result-body">'
          + '<div class="ai-result-row"><span class="ai-result-label">隐患类型</span><span class="ai-result-value"><span class="ai-result-type-tag">' + item.type + '类隐患</span></span></div>'
          + '<div class="ai-result-row"><span class="ai-result-label">隐患描述</span><span class="ai-result-value">' + item.desc + '</span></div>'
          + '<div class="ai-result-row"><span class="ai-result-label">隐患等级</span><span class="ai-result-value ' + levelCls + '">' + levelText + '</span></div>'
          + '<div class="ai-result-row"><span class="ai-result-label">整改建议</span><span class="ai-result-value">' + item.suggest + '</span></div>'
          + '<div class="ai-result-row"><span class="ai-result-label">关联风险</span><span class="ai-result-value">' + item.risk + '</span></div>'
          + '</div></div>';
      });
      container.innerHTML = html;

      document.getElementById('markedImgArea').style.display = 'block';
      container.style.display = 'block';
      document.getElementById('bottomBar').classList.add('show');
    }

    function drawMarkedImage() {
      var canvas = document.getElementById('markedCanvas');
      var container = document.getElementById('markedImgArea');
      var w = container.offsetWidth || 360;
      var h = Math.round(w * 0.7);
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');

      ctx.fillStyle = '#d9d9d9';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#bfbfbf';
      ctx.fillRect(w*0.05, h*0.14, w*0.3, h*0.72);
      ctx.fillRect(w*0.4, h*0.21, w*0.55, h*0.29);
      ctx.fillRect(w*0.4, h*0.57, w*0.25, h*0.36);

      ctx.fillStyle = '#ffccc7';
      ctx.fillRect(w*0.075, h*0.18, w*0.25, h*0.03);
      ctx.fillRect(w*0.075, h*0.25, w*0.25, h*0.03);

      ctx.fillStyle = '#ffe58f';
      ctx.fillRect(w*0.425, h*0.29, w*0.5, h*0.02);
      ctx.fillRect(w*0.425, h*0.36, w*0.5, h*0.02);

      ctx.fillStyle = '#d4d4d4';
      ctx.fillRect(w*0.4, h*0.57, w*0.25, h*0.36);

      // 标注框1: 电气线路 (红色)
      ctx.strokeStyle = '#ff4d4f';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(w*0.05, h*0.12, w*0.32, h*0.2);
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff4d4f';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('1', w*0.07, h*0.11);
      ctx.fillStyle = 'rgba(255,77,79,0.1)';
      ctx.fillRect(w*0.05, h*0.12, w*0.32, h*0.2);

      // 标注框2: 消防通道 (黄色)
      ctx.strokeStyle = '#faad14';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(w*0.4, h*0.26, w*0.54, h*0.15);
      ctx.setLineDash([]);
      ctx.fillStyle = '#faad14';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('2', w*0.42, h*0.255);
      ctx.fillStyle = 'rgba(250,173,20,0.1)';
      ctx.fillRect(w*0.4, h*0.26, w*0.54, h*0.15);

      // 标注框3: 配电箱 (黄色)
      ctx.strokeStyle = '#faad14';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(w*0.39, h*0.55, w*0.27, h*0.4);
      ctx.setLineDash([]);
      ctx.fillStyle = '#faad14';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('3', w*0.41, h*0.545);
      ctx.fillStyle = 'rgba(250,173,20,0.1)';
      ctx.fillRect(w*0.39, h*0.55, w*0.27, h*0.4);
    }

    /* ========== 智能上报抽屉 ========== */
    function toggleHazardCheck(i) {
      reportCheckedSet[i] = !reportCheckedSet[i];
      var el = document.getElementById('hfcheck' + i);
      el.classList.toggle('checked', reportCheckedSet[i]);
      // 切换表单区域的禁用态
      var form = document.getElementById('hfform' + i);
      form.style.opacity = reportCheckedSet[i] ? '1' : '0.4';
      form.style.pointerEvents = reportCheckedSet[i] ? 'auto' : 'none';
      updateConfirmBtn();
    }

    function selectDeadline(i, mode) {
      deadlineModes[i] = mode;
      var row = document.getElementById('dlrow' + i);
      row.querySelectorAll('.ai-hf-deadline-btn').forEach(function(b) { b.classList.remove('active'); });
      if (mode === 'immediate') {
        row.querySelector('.ai-hf-deadline-btn:first-child').classList.add('active');
      } else {
        row.querySelector('.ai-hf-deadline-btn:last-child').classList.add('active');
      }
      document.getElementById('dlstep' + i).classList.toggle('show', mode === 'limited');
      updateConfirmBtn();
    }

    function changeAiDays(i, delta) {
      aiDays[i] = Math.max(1, Math.min(365, aiDays[i] + delta));
      document.getElementById('dlval' + i).textContent = aiDays[i];
      document.getElementById('dlminus' + i).disabled = aiDays[i] <= 1;
    }

    function updateConfirmBtn() {
      var anyChecked = false;
      var allValid = true;
      identifiedItems.forEach(function(item, i) {
        if (reportCheckedSet[i]) {
          anyChecked = true;
          if (!deadlineModes[i]) allValid = false;
        }
      });
      document.getElementById('reportConfirmBtn').disabled = !(anyChecked && allValid);
    }

    function smartReport() {
      if (!identifiedItems.length) return;
      reportCheckedSet = {};
      deadlineModes = {};
      aiDays = {};

      var body = document.getElementById('reportDrawerBody');
      var html = '';
      identifiedItems.forEach(function(item, i) {
        reportCheckedSet[i] = true;
        deadlineModes[i] = '';
        aiDays[i] = 1;
        var levelText = item.level === 'major' ? '重大隐患' : '一般隐患';
        var levelCls = item.level === 'major' ? 'major' : 'normal';

        html += '<div class="ai-hazard-form" id="hfform' + i + '">'
          + '<div class="ai-hf-header">'
          + '<div class="ai-hf-check checked" id="hfcheck' + i + '" onclick="toggleHazardCheck(' + i + ')"></div>'
          + '<div class="ai-hf-title">' + item.desc + '</div>'
          + '<span class="ai-hf-level ' + levelCls + '">' + levelText + '</span>'
          + '</div>'
          + '<div class="ai-hf-row">'
          + '<span class="ai-hf-type">类型: ' + item.type + '</span>'
          + '</div>'
          + '<div class="ai-hf-row">'
          + '<span class="ai-hf-suggest">建议: ' + item.suggest + '</span>'
          + '</div>'
          + '<div class="ai-hf-row">'
          + '<span>关联风险: ' + item.risk + '</span>'
          + '</div>'
          + '<div class="ai-hf-field">'
          + '<div class="ai-hf-field-label"><span class="req">*</span> 整改责任人</div>'
          + '<select class="ai-hf-select" id="dlperson' + i + '">'
          + '<option value="王操作" selected>王操作</option>'
          + '<option value="赵巡检">赵巡检</option>'
          + '<option value="李安全">李安全</option>'
          + '</select>'
          + '</div>'
          + '<div class="ai-hf-field">'
          + '<div class="ai-hf-field-label"><span class="req">*</span> 整改期限</div>'
          + '<div class="ai-hf-deadline-row" id="dlrow' + i + '">'
          + '<div class="ai-hf-deadline-btn" onclick="selectDeadline(' + i + ',\'immediate\')">立即整改</div>'
          + '<div class="ai-hf-deadline-btn" onclick="selectDeadline(' + i + ',\'limited\')">限期整改</div>'
          + '</div>'
          + '<div class="ai-hf-stepper" id="dlstep' + i + '">'
          + '<button class="ai-hf-stepper-btn" id="dlminus' + i + '" onclick="changeAiDays(' + i + ',-1)" disabled>-</button>'
          + '<div><span class="ai-hf-stepper-value" id="dlval' + i + '">1</span><span class="ai-hf-stepper-unit">天</span></div>'
          + '<button class="ai-hf-stepper-btn" onclick="changeAiDays(' + i + ',1)">+</button>'
          + '</div>'
          + '</div>'
          + '</div>';
      });
      body.innerHTML = html;

      document.getElementById('reportConfirmBtn').disabled = true;
      document.getElementById('reportMask').classList.add('show');
      document.getElementById('reportDrawer').classList.add('show');
    }

    function closeReportDrawer() {
      document.getElementById('reportMask').classList.remove('show');
      document.getElementById('reportDrawer').classList.remove('show');
    }

    function confirmReport() {
      var selected = [];
      identifiedItems.forEach(function(item, i) {
        if (!reportCheckedSet[i]) return;
        var deadlineDisplay = '';
        if (deadlineModes[i] === 'immediate') {
          var now = new Date();
          deadlineDisplay = '立即整改（' + now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + '）';
        } else if (deadlineModes[i] === 'limited') {
          var now = new Date();
          var target = new Date(now.getTime() + aiDays[i] * 86400000);
          deadlineDisplay = '限期' + aiDays[i] + '天（' + target.getFullYear() + '-' + String(target.getMonth()+1).padStart(2,'0') + '-' + String(target.getDate()).padStart(2,'0') + '）';
        }
        var personEl = document.getElementById('dlperson' + i);
        var person = personEl ? personEl.value : '';
        selected.push({
          type: item.type,
          description: item.desc,
          level: item.level,
          suggest: item.suggest,
          risk: item.risk,
          person: person,
          deadlineMode: deadlineModes[i],
          deadlineDate: deadlineDisplay,
          photos: [],
          source: 'AI识别'
        });
      });
      if (!selected.length) { alert('请至少勾选一条隐患'); return; }

      try {
        var existing = JSON.parse(localStorage.getItem('aiHazards') || '[]');
        selected.forEach(function(h) { existing.push(h); });
        localStorage.setItem('aiHazards', JSON.stringify(existing));
      } catch(e) {}

      closeReportDrawer();
      alert('已将' + selected.length + '条隐患添加到隐患列表（原型演示）');
      try { parent.mobileBack(); } catch(e) {}
    }

    function retryAnalyze() {
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('markedImgArea').style.display = 'none';
      document.getElementById('bottomBar').classList.remove('show');
      document.getElementById('loadingArea').classList.add('show');

      setTimeout(function() {
        document.getElementById('loadingArea').classList.remove('show');
        showResults();
      }, 1500);
    }
  </script>
</body>
</html>
