<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>企业码</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .ec-gradient { display: none; }
    .m-page {
      position: relative; overflow: hidden; background-color: var(--wc-page-bg);
      background-image: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, var(--wc-page-bg) 100%);
      background-size: 100% 350px; background-repeat: no-repeat; background-position: top;
    }
    .m-page::before {
      content: ''; position: absolute; top: 110px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .m-page::after {
      content: ''; position: absolute; top: 220px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .ec-header {
      padding: 107px 0 0;
      display: flex; flex-direction: column;
    }
    .ec-code-card {
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: var(--wc-page-padding); text-align: center;
      box-shadow: var(--wc-shadow-card); position: relative; z-index: 1;
    }
    .ec-card-icons {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2;
    }
    .ec-card-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: var(--wc-page-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .ec-card-icon-btn:active { background: var(--wc-icon-btn-active); }
    .ec-card-icon-btn svg { width: 16px; height: 16px; }
    .ec-qr-wrap {
      width: 180px; height: 180px; margin: 0 auto 8px;
      padding: var(--wc-gap-lg); border: 4px solid var(--wc-code-border-green); border-radius: var(--wc-card-radius);
      background: var(--wc-card-bg); cursor: pointer;
    }
    .ec-action-row { display: flex; gap: var(--wc-gap-md); margin-top: var(--wc-gap-lg); }
    .ec-action-row .m-btn { font-size: var(--wc-font-small); padding: var(--wc-gap-md); border-radius: var(--wc-btn-radius); display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-sm); }
    .m-btn-outline { background: var(--wc-card-bg); color: var(--wc-blue); border: 0.5px solid var(--wc-blue); }
    .m-btn-outline:active { background: var(--primary-light); }
    .ec-action-row svg { width: 14px; height: 14px; flex-shrink: 0; }
    .ec-qr-time { font-size: var(--wc-font-tiny); color: var(--wc-text-disabled); margin-top: var(--wc-gap-sm); }
    .ec-quick-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--wc-gap-sm);
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: 14px var(--wc-gap-md) var(--wc-gap-lg);
      box-shadow: var(--wc-shadow-card-sm);
    }
    .ec-quick-item { text-align: center; cursor: pointer; padding: var(--wc-gap-sm) 0; }
    .ec-quick-icon {
      width: 44px; height: 44px; border-radius: var(--wc-card-radius); margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .ec-quick-icon.blue { background: var(--wc-icon-bg-blue); }
    .ec-quick-icon.orange { background: var(--wc-icon-bg-orange); }
    .ec-quick-icon.green { background: var(--wc-code-bg-green); }
    .ec-quick-icon.purple { background: var(--wc-icon-bg-purple); }
    .ec-quick-label { font-size: var(--wc-font-small); color: var(--wc-text-tertiary); }
    /* 主Tab样式 */
    .ec-tab-card {
      background: var(--wc-card-bg); border-radius: var(--wc-card-radius); margin: var(--wc-gap-lg) var(--wc-page-padding);
      box-shadow: var(--wc-shadow-card-sm); overflow: hidden;
    }
    .ec-main-tabs {
      display: flex; padding: 0; border-bottom: 0.5px solid rgba(0,0,0,0.08);
    }
    .ec-main-tab {
      flex: 1; text-align: center; padding: var(--wc-gap-xl) 0 var(--wc-gap-lg); font-size: var(--wc-font-caption);
      color: var(--wc-text-placeholder); cursor: pointer; position: relative; transition: color 0.2s;
    }
    .ec-main-tab.active { color: var(--brand-blue); font-weight: 600; }
    .ec-main-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 24px; height: 3px; background: var(--brand-blue); border-radius: 1.5px;
    }
    .ec-main-tab:active { opacity: 0.7; }
    .ec-panel { display: none; }
    .ec-panel.active { display: block; }
    .ec-panel-body { padding: 14px var(--wc-page-padding); }
    /* 人员履职子Tab */
    .ec-duty-tabs .m-tab.active { color: var(--brand-blue); font-weight: 500; }
    .ec-duty-tabs .m-tab.active::after { background: var(--brand-blue); }
    /* QR码详情弹层 */
    .qr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .qr-overlay.show { display: flex; }
    .qr-detail-card {
      background: var(--wc-card-bg); border-radius: var(--wc-radius-lg); padding: 24px; width: 260px; text-align: center;
      box-shadow: var(--wc-shadow-overlay); position: relative;
    }
    .qr-detail-close {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border-radius: 50%; background: var(--wc-track-bg); display: flex; align-items: center;
      justify-content: center; font-size: var(--wc-gap-lg); cursor: pointer; color: var(--wc-text-placeholder);
    }
    .qr-detail-close:active { background: var(--wc-pressed-bg-alt); }
    .qr-detail-qr { width: 180px; height: 180px; margin: 0 auto 12px; border-radius: var(--wc-gap-lg); overflow: hidden; }
    .qr-detail-status { font-size: var(--wc-gap-lg); font-weight: 600; margin-bottom: 4px; }
    .qr-detail-name { font-size: var(--wc-font-caption); color: var(--wc-text-tertiary); margin-bottom: 4px; }
    .qr-detail-time { font-size: var(--wc-font-small); color: var(--wc-text-disabled); margin-bottom: var(--wc-page-padding); }
    .qr-detail-actions { display: flex; gap: var(--wc-gap-lg); }
    .qr-detail-actions button { flex: 1; padding: var(--wc-gap-lg); border-radius: var(--wc-btn-radius); font-size: var(--wc-font-caption); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--wc-gap-sm); }
    .qr-detail-actions button svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="m-page with-tabbar">

    <div class="ec-header">
      <!-- 安全码模块 -->
      <div style="position:relative;z-index:1;padding:0 var(--wc-page-padding);">
        <div class="ec-code-card">
          <div class="ec-card-icons">
            <div class="ec-card-icon-btn" title="定位">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </div>
            <div class="ec-card-icon-btn" onclick="parent.navigateTo('scan')" title="扫一扫">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><line x1="6.5" y1="6.5" x2="8" y2="6.5"/><line x1="6.5" y1="6.5" x2="6.5" y2="8"/><line x1="17.5" y1="6.5" x2="16" y2="6.5"/><line x1="17.5" y1="6.5" x2="17.5" y2="8"/><line x1="6.5" y1="17.5" x2="8" y2="17.5"/><line x1="6.5" y1="17.5" x2="6.5" y2="16"/><line x1="17.5" y1="17.5" x2="16" y2="17.5"/><line x1="17.5" y1="17.5" x2="17.5" y2="16"/></svg>
            </div>
          </div>
          <div id="homeEntityName" style="font-size:var(--wc-font-title);font-weight:700;color:var(--wc-text-primary);text-align:left;margin-bottom:var(--wc-gap-xl);">创安电子科技有限公司</div>
          <div class="ec-qr-wrap" onclick="showQrDetail()">
            <div class="code-qr-canvas"><svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#fff"/><rect x="2" y="2" width="26" height="26" fill="#52c41a" rx="3"/><rect x="6" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="10" width="10" height="10" fill="#52c41a" rx="1"/><rect x="72" y="2" width="26" height="26" fill="#52c41a" rx="3"/><rect x="76" y="6" width="18" height="18" fill="#fff" rx="2"/><rect x="80" y="10" width="10" height="10" fill="#52c41a" rx="1"/><rect x="2" y="72" width="26" height="26" fill="#52c41a" rx="3"/><rect x="6" y="76" width="18" height="18" fill="#fff" rx="2"/><rect x="10" y="80" width="10" height="10" fill="#52c41a" rx="1"/><rect x="35" y="5" width="5" height="5" fill="#52c41a"/><rect x="45" y="8" width="5" height="5" fill="#52c41a"/><rect x="55" y="5" width="5" height="5" fill="#52c41a"/><rect x="35" y="18" width="5" height="5" fill="#52c41a"/><rect x="50" y="15" width="5" height="5" fill="#52c41a"/><rect x="60" y="18" width="5" height="5" fill="#52c41a"/><rect x="8" y="35" width="5" height="5" fill="#52c41a"/><rect x="18" y="38" width="5" height="5" fill="#52c41a"/><rect x="28" y="35" width="5" height="5" fill="#52c41a"/><rect x="38" y="42" width="5" height="5" fill="#52c41a"/><rect x="48" y="35" width="5" height="5" fill="#52c41a"/><rect x="58" y="38" width="5" height="5" fill="#52c41a"/><rect x="68" y="35" width="5" height="5" fill="#52c41a"/><rect x="78" y="42" width="5" height="5" fill="#52c41a"/><rect x="88" y="35" width="5" height="5" fill="#52c41a"/><rect x="8" y="48" width="5" height="5" fill="#52c41a"/><rect x="22" y="45" width="5" height="5" fill="#52c41a"/><rect x="38" y="52" width="5" height="5" fill="#52c41a"/><rect x="52" y="48" width="5" height="5" fill="#52c41a"/><rect x="65" y="52" width="5" height="5" fill="#52c41a"/><rect x="75" y="45" width="5" height="5" fill="#52c41a"/><rect x="85" y="48" width="5" height="5" fill="#52c41a"/><rect x="8" y="58" width="5" height="5" fill="#52c41a"/><rect x="18" y="55" width="5" height="5" fill="#52c41a"/><rect x="32" y="58" width="5" height="5" fill="#52c41a"/><rect x="42" y="55" width="5" height="5" fill="#52c41a"/><rect x="55" y="58" width="5" height="5" fill="#52c41a"/><rect x="68" y="55" width="5" height="5" fill="#52c41a"/><rect x="78" y="58" width="5" height="5" fill="#52c41a"/><rect x="88" y="55" width="5" height="5" fill="#52c41a"/><rect x="35" y="72" width="5" height="5" fill="#52c41a"/><rect x="45" y="78" width="5" height="5" fill="#52c41a"/><rect x="55" y="72" width="5" height="5" fill="#52c41a"/><rect x="65" y="78" width="5" height="5" fill="#52c41a"/><rect x="75" y="72" width="5" height="5" fill="#52c41a"/><rect x="85" y="78" width="5" height="5" fill="#52c41a"/><rect x="35" y="88" width="5" height="5" fill="#52c41a"/><rect x="48" y="85" width="5" height="5" fill="#52c41a"/><rect x="60" y="90" width="5" height="5" fill="#52c41a"/><rect x="72" y="88" width="5" height="5" fill="#52c41a"/><rect x="82" y="90" width="5" height="5" fill="#52c41a"/><rect x="92" y="85" width="5" height="5" fill="#52c41a"/></svg></div>
          </div>
          <div class="ec-qr-time" id="homeQrTime">更新时间：2025-01-15 08:00</div>
          <div class="ec-action-row" style="justify-content:center;">
            <button class="m-btn" style="width:80px;background:var(--primary);color:var(--wc-card-bg);border:none;border-radius:var(--wc-btn-radius);font-size:var(--wc-font-small);padding:6px 0;" onclick="showToast('二维码已保存至相册')"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>下载</button>
            <button class="m-btn" style="width:80px;background:var(--wc-card-bg);color:var(--primary);border:1px solid var(--primary);border-radius:var(--wc-btn-radius);font-size:var(--wc-font-small);padding:6px 0;" onclick="showToast('分享链接已复制')"><svg viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>分享</button>
          </div>
        </div>
      </div>

      <!-- 快捷入口 -->
      <div style="margin-top:var(--wc-gap-lg);position:relative;z-index:1;padding:0 var(--wc-page-padding);">
        <div class="ec-quick-grid" id="homeQuickGrid">
          <div class="ec-quick-item">
            <div class="ec-quick-icon blue">📊</div>
            <div class="ec-quick-label">基本信息</div>
          </div>
          <div class="ec-quick-item" onclick="parent.navigateTo('check-list')">
            <div class="ec-quick-icon orange">🔎</div>
            <div class="ec-quick-label">码上排查</div>
          </div>
          <div class="ec-quick-item" onclick="parent.navigateTo('hazard-stats')">
            <div class="ec-quick-icon green">⚠️</div>
            <div class="ec-quick-label">隐患记录</div>
          </div>
          <div class="ec-quick-item" onclick="parent.navigateTo('inspection-stats')">
            <div class="ec-quick-icon purple">📄</div>
            <div class="ec-quick-label">检查记录</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主Tab卡片 -->
    <div class="ec-tab-card">
      <div class="ec-main-tabs">
        <div class="ec-main-tab active" onclick="switchMainTab(this,0)"><span class="ec-main-tab-label">安全管控</span></div>
        <div class="ec-main-tab" onclick="switchMainTab(this,1)"><span class="ec-main-tab-label">人员履职</span></div>
        <div class="ec-main-tab" onclick="switchMainTab(this,2)"><span class="ec-main-tab-label">隐患统计</span></div>
      </div>

      <!-- 安全管控 -->
      <div class="ec-panel active" id="panel0">
        <div class="ec-panel-body">
          <div id="homeStatsPanel">
          <div class="stat-row" style="padding:0;margin-bottom:var(--wc-gap-xl);">
            <div class="stat-item"><div class="stat-num">7</div><div class="stat-label">管控对象总数</div></div>
            <div class="stat-item"><div class="stat-num" style="color:var(--success)">5</div><div class="stat-label">绿色</div></div>
            <div class="stat-item"><div class="stat-num" style="color:var(--warning)">1</div><div class="stat-label">黄色</div></div>
            <div class="stat-item"><div class="stat-num" style="color:var(--danger)">1</div><div class="stat-label">红色</div></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-page-padding);">
            <div class="ring-chart" style="background:conic-gradient(var(--success) 0% 71%, var(--warning) 71% 86%, var(--danger) 86% 100%);">
              <div class="ring-chart-inner">71%</div>
            </div>
            <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:2;">
              <span style="color:var(--success)">●</span> 绿色 5个<br>
              <span style="color:var(--warning)">●</span> 黄色 1个<br>
              <span style="color:var(--danger)">●</span> 红色 1个
            </div>
          </div>
          <div style="text-align:right;margin-top:8px;">
            <span style="font-size:var(--wc-font-small);color:var(--wc-blue);cursor:pointer;" onclick="parent.navigateTo('control-list')">查看详情 ›</span>
          </div>
          </div>
        </div>
      </div>

      <!-- 人员履职 -->
      <div class="ec-panel" id="panel1">
        <div class="ec-panel-body">
          <div class="m-tabs ec-duty-tabs" style="margin:0 0 var(--wc-gap-xl);">
            <div class="m-tab active" onclick="switchDutyTab(this,0)">主要负责人</div>
            <div class="m-tab" onclick="switchDutyTab(this,1)">安全管理人员</div>
            <div class="m-tab" onclick="switchDutyTab(this,2)">从业人员</div>
          </div>
          <div id="dutyContent">
            <div class="duty-bar"><span class="duty-bar-label">绿色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:75%;background:var(--success)"></div></div><span class="duty-bar-num">3人</span></div>
            <div class="duty-bar"><span class="duty-bar-label">黄色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:25%;background:var(--warning)"></div></div><span class="duty-bar-num">1人</span></div>
            <div class="duty-bar"><span class="duty-bar-label">红色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:0%;background:var(--danger)"></div></div><span class="duty-bar-num">0人</span></div>
            <div style="font-size:var(--wc-font-small);color:var(--wc-text-placeholder);text-align:center;margin-top:var(--wc-gap-sm)">在册 4人</div>
          </div>
        </div>
      </div>

      <!-- 隐患统计 -->
      <div class="ec-panel" id="panel2">
        <div class="ec-panel-body">
          <div class="stat-row" style="padding:0;margin-bottom:var(--wc-gap-xl);">
            <div class="stat-item"><div class="stat-num">12</div><div class="stat-label">隐患总数</div></div>
            <div class="stat-item"><div class="stat-num" style="color:var(--danger)">2</div><div class="stat-label">待整改</div></div>
            <div class="stat-item"><div class="stat-num" style="color:var(--warning)">3</div><div class="stat-label">整改中</div></div>
            <div class="stat-item"><div class="stat-num" style="color:var(--success)">7</div><div class="stat-label">已整改</div></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-page-padding);">
            <div class="ring-chart" style="background:conic-gradient(var(--success) 0% 58%, var(--warning) 58% 83%, var(--danger) 83% 100%);">
              <div class="ring-chart-inner">58%</div>
            </div>
            <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:2;">
              <span style="color:var(--success)">●</span> 已整改 7项<br>
              <span style="color:var(--warning)">●</span> 整改中 3项<br>
              <span style="color:var(--danger)">●</span> 待整改 2项
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="height:var(--wc-gap-lg);"></div>
  </div>

  <!-- QR码详情弹层 -->
  <div class="qr-overlay" id="qrOverlay" onclick="if(event.target===this)closeQrDetail()">
    <div class="qr-detail-card" style="position:relative;">
      <div class="qr-detail-close" onclick="closeQrDetail()">✕</div>

  <script>
    // 主Tab切换
    function switchMainTab(el, idx) {
      el.parentElement.querySelectorAll('.ec-main-tab').forEach(function(t){t.classList.remove('active');});
      el.classList.add('active');
      document.querySelectorAll('.ec-panel').forEach(function(p){p.classList.remove('active');});
      document.getElementById('panel' + idx).classList.add('active');
    }

    // 人员履职子Tab
    var dutyData = [
      { green:3, yellow:1, red:0, total:4 },
      { green:6, yellow:2, red:1, total:9 },
      { green:15, yellow:3, red:1, total:19 }
    ];
    function switchDutyTab(el, idx) {
      el.parentElement.querySelectorAll('.m-tab').forEach(function(t){t.classList.remove('active');});
      el.classList.add('active');
      var d = dutyData[idx];
      document.getElementById('dutyContent').innerHTML =
        '<div class="duty-bar"><span class="duty-bar-label">绿色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:'+Math.round(d.green/d.total*100)+'%;background:var(--success)"></div></div><span class="duty-bar-num">'+d.green+'人</span></div>'+
        '<div class="duty-bar"><span class="duty-bar-label">黄色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:'+Math.round(d.yellow/d.total*100)+'%;background:var(--warning)"></div></div><span class="duty-bar-num">'+d.yellow+'人</span></div>'+
        '<div class="duty-bar"><span class="duty-bar-label">红色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:'+Math.round(d.red/d.total*100)+'%;background:var(--danger)"></div></div><span class="duty-bar-num">'+d.red+'人</span></div>'+
        '<div style="font-size:var(--wc-font-small);color:var(--wc-text-placeholder);text-align:center;margin-top:var(--wc-gap-sm)">在册 '+d.total+'人</div>';
    }

    // QR码弹层
    function showQrDetail() {
      document.getElementById('qrOverlay').classList.add('show');
    }
    function closeQrDetail() {
      document.getElementById('qrOverlay').classList.remove('show');
    }
    function showToast(msg) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:200;white-space:nowrap;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 2000);
    }

    // ========== 页面初始化：根据 session 动态渲染 ==========
    function initHomePage() {
      if (typeof MobilePageConfig === 'undefined') return;
      var config = MobilePageConfig.getHomeConfig();
      if (!config || !config.portalType) return;

      // 更新企业名称
      var nameEl = document.getElementById('homeEntityName');
      if (nameEl) nameEl.textContent = config.entityName;

      // 更新背景渐变
      var mPage = document.querySelector('.m-page');
      if (mPage) mPage.style.backgroundImage = config.gradient;

      // 更新码边框颜色
      var qrWrap = document.querySelector('.ec-qr-wrap');
      if (qrWrap) qrWrap.style.borderColor = config.borderColor;

      // 更新主Tab标签
      var tabLabels = document.querySelectorAll('.ec-main-tab-label');
      if (tabLabels.length >= 3) {
        config.mainTabLabels.forEach(function(label, i) {
          tabLabels[i].textContent = label;
        });
      }

      // 更新安全管控统计
      var statsPanel = document.getElementById('homeStatsPanel');
      if (statsPanel) {
        var s = config.stats;
        var conicGrad = 'conic-gradient(var(--success) 0% ' + s.greenPct;
        var yellowEnd = Math.round((s.green + s.yellow) / s.total * 100) + '%';
        conicGrad += ', var(--warning) ' + s.greenPct + ' ' + yellowEnd;
        conicGrad += ', var(--danger) ' + yellowEnd + ' 100%)';
        statsPanel.innerHTML =
          '<div class="stat-row" style="padding:0;margin-bottom:var(--wc-gap-xl);">' +
          '  <div class="stat-item"><div class="stat-num">' + s.total + '</div><div class="stat-label">管控对象总数</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--success)">' + s.green + '</div><div class="stat-label">绿色</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--warning)">' + s.yellow + '</div><div class="stat-label">黄色</div></div>' +
          '  <div class="stat-item"><div class="stat-num" style="color:var(--danger)">' + s.red + '</div><div class="stat-label">红色</div></div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:var(--wc-page-padding);">' +
          '  <div class="ring-chart" style="background:' + conicGrad + ';"><div class="ring-chart-inner">' + s.greenPct + '</div></div>' +
          '  <div style="font-size:var(--wc-font-small);color:var(--wc-text-tertiary);line-height:2;">' +
          '    <span style="color:var(--success)">●</span> 绿色 ' + s.green + '个<br>' +
          '    <span style="color:var(--warning)">●</span> 黄色 ' + s.yellow + '个<br>' +
          '    <span style="color:var(--danger)">●</span> 红色 ' + s.red + '个' +
          '  </div>' +
          '</div>' +
          '<div style="text-align:right;margin-top:8px;">' +
          '  <span style="font-size:var(--wc-font-small);color:var(--wc-blue);cursor:pointer;" onclick="parent.navigateTo(\'control-list\')">查看详情 ›</span>' +
          '</div>';
      }

      // 更新快捷入口
      var quickGrid = document.getElementById('homeQuickGrid');
      if (quickGrid) {
        var html = '';
        config.quickActions.forEach(function(a) {
          var onclick = a.nav ? ' onclick="parent.navigateTo(\'' + a.nav + '\')"' : '';
          html += '<div class="ec-quick-item"' + onclick + '>' +
            '<div class="ec-quick-icon ' + a.color + '">' + a.icon + '</div>' +
            '<div class="ec-quick-label">' + a.label + '</div>' +
            '</div>';
        });
        quickGrid.innerHTML = html;
      }

      // 政府端：更新码类型为"监管码"
      // 企业端：更新码类型标签（企业码/项目码/场所码等）
      // 此处通过 codeTypeLabel 可用于后续扩展，当前QR码区域已自适应
    }

    // initHomePage 将在外部脚本加载后调用
  </script>
<script src="../../js/domain-data.js"></script>
<script src="../../js/mobile-page-config.js"></script>
<script src="../../js/mobile-session.js"></script>
<script>initHomePage();</script>
<script src="../../js/annotations.js"></script>
</body>
