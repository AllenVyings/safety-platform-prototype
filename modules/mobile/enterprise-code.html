<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>企业码</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .ec-gradient {
      position: fixed; top: 0; left: 0; right: 0; height: 350px; z-index: 0;
      background: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, #f5f7fa 100%);
    }
    .ec-gradient::before {
      content: ''; position: absolute; top: 100px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .ec-gradient::after {
      content: ''; position: absolute; top: 210px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .ec-header {
      padding: 107px 0 0; position: relative; z-index: 1;
      display: flex; flex-direction: column;
    }
    .ec-code-card {
      background: #fff; border-radius: 12px; padding: 16px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; z-index: 1;
    }
    .ec-card-icons {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2;
    }
    .ec-card-icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: #f5f7fa;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .ec-card-icon-btn:active { background: #e8eaed; }
    .ec-card-icon-btn svg { width: 16px; height: 16px; }
    .ec-qr-wrap {
      width: 180px; height: 180px; margin: 0 auto 8px;
      padding: 10px; border: 4px solid #b7eb8f; border-radius: 12px;
      background: #fff; cursor: pointer;
    }
    .ec-action-row { display: flex; gap: 8px; margin-top: 10px; }
    .ec-action-row .m-btn { font-size: 13px; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .m-btn-outline { background: #fff; color: #576b95; border: 0.5px solid #576b95; }
    .m-btn-outline:active { background: #f0f4ff; }
    .ec-action-row svg { width: 14px; height: 14px; flex-shrink: 0; }
    .ec-qr-time { font-size: 11px; color: #bbb; margin-top: 4px; }
    .ec-quick-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      background: #fff; border-radius: 12px; padding: 14px 8px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .ec-quick-item { text-align: center; cursor: pointer; padding: 4px 0; }
    .ec-quick-icon {
      width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .ec-quick-icon.blue { background: #e8f4fd; }
    .ec-quick-icon.orange { background: #fff3e6; }
    .ec-quick-icon.green { background: #f0fff0; }
    .ec-quick-icon.purple { background: #f5f0ff; }
    .ec-quick-label { font-size: 12px; color: #666; }
    /* 主Tab样式 */
    .ec-tab-card {
      background: #fff; border-radius: 12px; margin: 10px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04); overflow: hidden;
    }
    .ec-main-tabs {
      display: flex; padding: 0; border-bottom: 0.5px solid rgba(0,0,0,0.08);
    }
    .ec-main-tab {
      flex: 1; text-align: center; padding: 12px 0 10px; font-size: 14px;
      color: #999; cursor: pointer; position: relative; transition: color 0.2s;
    }
    .ec-main-tab.active { color: #1068ff; font-weight: 600; }
    .ec-main-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 24px; height: 3px; background: #1068ff; border-radius: 1.5px;
    }
    .ec-main-tab:active { opacity: 0.7; }
    .ec-panel { display: none; }
    .ec-panel.active { display: block; }
    .ec-panel-body { padding: 14px 16px; }
    /* 人员履职子Tab */
    .ec-duty-tabs .m-tab.active { color: #1068ff; font-weight: 500; }
    .ec-duty-tabs .m-tab.active::after { background: #1068ff; }
    /* QR码详情弹层 */
    .qr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .qr-overlay.show { display: flex; }
    .qr-detail-card {
      background: #fff; border-radius: 16px; padding: 24px; width: 260px; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); position: relative;
    }
    .qr-detail-close {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border-radius: 50%; background: #f0f0f0; display: flex; align-items: center;
      justify-content: center; font-size: 16px; cursor: pointer; color: #999;
    }
    .qr-detail-close:active { background: #e0e0e0; }
    .qr-detail-qr { width: 180px; height: 180px; margin: 0 auto 12px; border-radius: 10px; overflow: hidden; }
    .qr-detail-status { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .qr-detail-name { font-size: 14px; color: #666; margin-bottom: 4px; }
    .qr-detail-time { font-size: 12px; color: #bbb; margin-bottom: 16px; }
    .qr-detail-actions { display: flex; gap: 10px; }
    .qr-detail-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .qr-detail-actions button svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>

            <div class="ec-quick-label">基本信息</div>
          </div>
          <div class="ec-quick-item" onclick="parent.navigateTo('check-list')">
            <div class="ec-quick-icon orange">🔎</div>
            <div class="ec-quick-label">码上排查</div>

          <div class="ec-quick-item" onclick="parent.navigateTo('hazard-stats')">

            <div class="ec-quick-icon purple">📄</div>
            <div class="ec-quick-label">检查记录</div>

    <!-- 主Tab卡片 -->

      <div class="ec-main-tabs">
        <div class="ec-main-tab active" onclick="switchMainTab(this,0)">安全管控</div>

        <div class="ec-main-tab" onclick="switchMainTab(this,2)">隐患统计</div>

      <!-- 安全管控 -->

            <div class="stat-item"><div class="stat-num" style="color:#faad14">1</div><div class="stat-label">黄色</div></div>

              <span style="color:#52c41a">●</span> 绿色 5个<br>
              <span style="color:#faad14">●</span> 黄色 1个<br>
              <span style="color:#ff4d4f">●</span> 红色 1个
            </div>
          </div>
          <div style="text-align:right;margin-top:8px;">
            <span style="font-size:13px;color:#576b95;cursor:pointer;" onclick="parent.navigateTo('control-list')">查看详情 ›</span>
          </div>
        </div>
      </div>

      <!-- 人员履职 -->
      <div class="ec-panel" id="panel1">
        <div class="ec-panel-body">
          <div class="m-tabs ec-duty-tabs" style="margin:0 0 12px;">
            <div class="m-tab active" onclick="switchDutyTab(this,0)">领导层</div>
            <div class="m-tab" onclick="switchDutyTab(this,1)">管理层</div>
            <div class="m-tab" onclick="switchDutyTab(this,2)">员工层</div>
          </div>

            <div class="duty-bar"><span class="duty-bar-label">绿色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:75%;background:#52c41a"></div></div><span class="duty-bar-num">3人</span></div>

            <div class="duty-bar"><span class="duty-bar-label">红色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:0%;background:#ff4d4f"></div></div><span class="duty-bar-num">0人</span></div>
            <div style="font-size:12px;color:#999;text-align:center;margin-top:4px">在册 4人</div>
          </div>
        </div>
      </div>

      <!-- 隐患统计 -->
      <div class="ec-panel" id="panel2">
        <div class="ec-panel-body">
          <div class="stat-row" style="padding:0;margin-bottom:12px;">
            <div class="stat-item"><div class="stat-num">12</div><div class="stat-label">隐患总数</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#ff4d4f">2</div><div class="stat-label">未整改</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#faad14">3</div><div class="stat-label">整改中</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#52c41a">7</div><div class="stat-label">已整改</div></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
            <div class="ring-chart" style="background:conic-gradient(#52c41a 0% 58%, #faad14 58% 83%, #ff4d4f 83% 100%);">
              <div class="ring-chart-inner">58%</div>
            </div>
            <div style="font-size:12px;color:#666;line-height:2;">
              <span style="color:#52c41a">●</span> 已整改 7项<br>
              <span style="color:#faad14">●</span> 整改中 3项<br>
              <span style="color:#ff4d4f">●</span> 未整改 2项
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="height:10px;"></div>
  </div>

  <script>
    // 主Tab切换
    function switchMainTab(el, idx) {
      el.parentElement.querySelectorAll('.ec-main-tab').forEach(function(t){t.classList.remove('active');});
      el.classList.add('active');
      document.querySelectorAll('.ec-panel').forEach(function(p){p.classList.remove('active');});
      document.getElementById('panel' + idx).classList.add('active');
    }

    // 人员履职子Tab
    var dutyData = [
      { green:3, yellow:1, red:0, total:4 },
      { green:6, yellow:2, red:1, total:9 },
      { green:15, yellow:3, red:1, total:19 }
    ];
    function switchDutyTab(el, idx) {
      el.parentElement.querySelectorAll('.m-tab').forEach(function(t){t.classList.remove('active');});
      el.classList.add('active');
      var d = dutyData[idx];
      document.getElementById('dutyContent').innerHTML =
        '<div class="duty-bar"><span class="duty-bar-label">绿色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:'+Math.round(d.green/d.total*100)+'%;background:#52c41a"></div></div><span class="duty-bar-num">'+d.green+'人</span></div>'+
        '<div class="duty-bar"><span class="duty-bar-label">黄色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:'+Math.round(d.yellow/d.total*100)+'%;background:#faad14"></div></div><span class="duty-bar-num">'+d.yellow+'人</span></div>'+
        '<div class="duty-bar"><span class="duty-bar-label">红色</span><div class="duty-bar-track"><div class="duty-bar-fill" style="width:'+Math.round(d.red/d.total*100)+'%;background:#ff4d4f"></div></div><span class="duty-bar-num">'+d.red+'人</span></div>'+
        '<div style="font-size:12px;color:#999;text-align:center;margin-top:4px">在册 '+d.total+'人</div>';
    }

    // QR码弹层
    function showQrDetail() {
      document.getElementById('qrOverlay').classList.add('show');
    }
    function closeQrDetail() {
      document.getElementById('qrOverlay').classList.remove('show');
    }
    function showToast(msg) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:200;white-space:nowrap;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 2000);
    }
  </script>
