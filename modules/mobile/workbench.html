<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工作台</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    /* 渐变背景作为 m-page 背景图，永远在内容下方 */
    .m-page {
      position: relative; overflow: hidden; background-color: var(--wc-page-bg);
      background-image: linear-gradient(180deg, var(--brand-blue) 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, var(--wc-page-bg) 100%);
      background-size: 100% 350px; background-repeat: no-repeat; background-position: top;
    }
    .m-page::before {
      content: ''; position: absolute; top: 110px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none;
    }
    .m-page::after {
      content: ''; position: absolute; top: 220px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .wb-body { padding: 107px var(--wc-page-padding) 0; }
    .wb-card {
      background: var(--wc-card-bg); border-radius: 12px; padding: 14px var(--wc-gap-md) var(--wc-gap-lg);
      box-shadow: var(--wc-shadow-card); margin-bottom: var(--wc-gap-lg);
    }
    .wb-card-title {
      font-size: var(--wc-font-body); font-weight: 500; color: var(--wc-text-primary); padding: 0 var(--wc-gap-md) var(--wc-gap-lg);
    }
    .wb-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--wc-gap-sm);
    }
    .wb-item { text-align: center; cursor: pointer; padding: 6px 0; }
    .wb-item:active { opacity: 0.7; }
    .wb-icon {
      width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .wb-label { font-size: var(--wc-font-small); color: var(--wc-text-secondary); }
  </style>
</head>
<body>
  <div class="m-page with-tabbar">

    <!-- 内容流（渐变已作为 m-page 背景图，不可能遮挡内容） -->
    <div class="wb-body">

      <!-- 常用功能 -->
      <div class="wb-card">
        <div class="wb-card-title">常用功能</div>
        <div class="wb-grid">
          <div class="wb-item" onclick="parent.navigateTo('check-list')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-blue);">🔎</div>
            <div class="wb-label">码上排查</div>
          </div>
          <div class="wb-item" onclick="showToast('码上作业功能开发中')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-green);">🛠️</div>
            <div class="wb-label">码上作业</div>
          </div>
          <div class="wb-item" onclick="showToast('动态赋码功能开发中')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-orange);">🏷️</div>
            <div class="wb-label">动态赋码</div>
          </div>
        </div>
      </div>

      <!-- 安全档案 -->
      <div class="wb-card">
        <div class="wb-card-title">安全档案</div>
        <div class="wb-grid">
          <div class="wb-item" onclick="parent.navigateTo('inspection-stats')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-blue);">📊</div>
            <div class="wb-label">检查统计</div>
          </div>
          <div class="wb-item" onclick="parent.navigateTo('hazard-stats')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-orange);">📉</div>
            <div class="wb-label">隐患统计</div>
          </div>
          <div class="wb-item" onclick="parent.navigateTo('my-inspections')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-green);">✅</div>
            <div class="wb-label">我的检查</div>
          </div>
          <div class="wb-item" onclick="parent.navigateTo('my-hazards')">
            <div class="wb-icon" style="background:var(--wc-icon-bg-red);">🚨</div>
            <div class="wb-label">我的隐患</div>
          </div>
        </div>
      </div>

      <!-- 安全知识库 -->
      <div class="wb-card">
        <div class="wb-card-title">安全知识库</div>
        <div class="wb-grid">
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-blue);">⚖️</div>
            <div class="wb-label">法规库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-orange);">📚</div>
            <div class="wb-label">常见隐患库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-green);">📑</div>
            <div class="wb-label">企业预案库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-purple);">📘</div>
            <div class="wb-label">操作指引库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-red);">🤖</div>
            <div class="wb-label">安全问答</div>
          </div>
        </div>
      </div>

      <!-- 监测预警（最后一个卡片，底部间距收窄） -->
      <div class="wb-card" style="margin-bottom:var(--wc-gap-sm);">
        <div class="wb-card-title">监测预警</div>
        <div class="wb-grid">
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-code-bg-yellow);">⛈️</div>
            <div class="wb-label">气象预警</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-blue);">🎥</div>
            <div class="wb-label">视频监控</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:var(--wc-icon-bg-purple);">📡</div>
            <div class="wb-label">物联感知</div>
          </div>
        </div>
      </div>

    </div>

    <div style="height:10px;"></div>
  </div>

  <script>
    function showToast(msg) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:200;white-space:nowrap;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 2000);
    }
  </script>
</body>
</html>
