<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工作台</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    /* 渐变背景固定区域，不随内容撑高 */
    .wb-gradient {
      position: fixed; top: 0; left: 0; right: 0; height: 350px; z-index: 0;
      background: linear-gradient(180deg, #1068ff 0%, #3d86ff 30%, #5a9aff 50%, #70a4fd 70%, #b8d4fe 85%, #f5f7fa 100%);
    }
    .wb-gradient::before {
      content: ''; position: absolute; top: 110px; right: -10px; width: 160px; height: 160px;
      border-radius: 50%; background: rgba(255,255,255,0.08);
    }
    .wb-gradient::after {
      content: ''; position: absolute; top: 220px; left: -20px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,0.05);
    }
    /* 内容流，覆盖在渐变之上 */
    .wb-body { position: relative; z-index: 1; padding: 107px 16px 0; }
    .wb-card {
      background: #fff; border-radius: 12px; padding: 14px 8px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 10px;
    }
    .wb-card-title {
      font-size: 15px; font-weight: 500; color: #000; padding: 0 8px 10px;
    }
    .wb-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    }
    .wb-item { text-align: center; cursor: pointer; padding: 6px 0; }
    .wb-item:active { opacity: 0.7; }
    .wb-icon {
      width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .wb-label { font-size: 12px; color: #333; }
  </style>
</head>
<body>
  <div class="m-page with-tabbar" style="background:#f5f7fa;">

    <!-- 渐变背景层（固定350px，不随内容撑高） -->
    <div class="wb-gradient"></div>

    <!-- 内容流（浮在渐变之上，超出渐变范围后自然在页面背景上） -->
    <div class="wb-body">

      <!-- 常用功能 -->
      <div class="wb-card">
        <div class="wb-card-title">常用功能</div>
        <div class="wb-grid">
          <div class="wb-item" onclick="parent.navigateTo('check-list')">
            <div class="wb-icon" style="background:#e8f4fd;">🔎</div>
            <div class="wb-label">码上排查</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#edf8ee;">🛠️</div>
            <div class="wb-label">码上作业</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#fff7e6;">🏷️</div>
            <div class="wb-label">动态赋码</div>
          </div>
        </div>
      </div>

      <!-- 安全档案 -->
      <div class="wb-card">
        <div class="wb-card-title">安全档案</div>
        <div class="wb-grid">
          <div class="wb-item">
            <div class="wb-icon" style="background:#e8f4fd;">📊</div>
            <div class="wb-label">检查统计</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#fff7e6;">📉</div>
            <div class="wb-label">隐患统计</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#edf8ee;">✅</div>
            <div class="wb-label">我的检查</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#fff1f0;">🚨</div>
            <div class="wb-label">我的隐患</div>
          </div>
        </div>
      </div>

      <!-- 安全知识库 -->
      <div class="wb-card">
        <div class="wb-card-title">安全知识库</div>
        <div class="wb-grid">
          <div class="wb-item">
            <div class="wb-icon" style="background:#e8f4fd;">⚖️</div>
            <div class="wb-label">法规库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#fff7e6;">📚</div>
            <div class="wb-label">常见隐患库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#edf8ee;">📑</div>
            <div class="wb-label">企业预案库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#f3eeff;">📘</div>
            <div class="wb-label">操作指引库</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#fff1f0;">🤖</div>
            <div class="wb-label">安全问答</div>
          </div>
        </div>
      </div>

      <!-- 监测预警（最后一个卡片，底部间距收窄） -->
      <div class="wb-card" style="margin-bottom:4px;">
        <div class="wb-card-title">监测预警</div>
        <div class="wb-grid">
          <div class="wb-item">
            <div class="wb-icon" style="background:#fffbe6;">⛈️</div>
            <div class="wb-label">气象预警</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#e8f4fd;">🎥</div>
            <div class="wb-label">视频监控</div>
          </div>
          <div class="wb-item">
            <div class="wb-icon" style="background:#f3eeff;">📡</div>
            <div class="wb-label">物联感知</div>
          </div>
        </div>
      </div>

    </div>

    <div style="height:10px;"></div>
  </div>
</body>
</html>
