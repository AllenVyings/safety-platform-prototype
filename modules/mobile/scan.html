<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>扫一扫</title>
  <link rel="stylesheet" href="../../css/mobile.css">
  <style>
    .scan-page { min-height: 100vh; background: var(--wc-text-primary); display: flex; flex-direction: column; overflow: hidden; }
    .scan-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .scan-viewfinder { position: relative; width: 240px; height: 240px; }
    .scan-corner { position: absolute; width: 24px; height: 24px; border-color: var(--wc-green); border-style: solid; border-width: 0; }
    .scan-corner.tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: var(--wc-radius-sm); }
    .scan-corner.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: var(--wc-radius-sm); }
    .scan-corner.bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: var(--wc-radius-sm); }
    .scan-corner.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: var(--wc-radius-sm); }
    .scan-line { position: absolute; top: 0; left: 10%; width: 80%; height: 2px; background: linear-gradient(90deg, transparent, var(--wc-green), transparent); animation: scanMove 2s linear infinite; }
    @keyframes scanMove {
      0% { top: 10px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 230px; opacity: 0; }
    }
    .scan-hint { color: rgba(255,255,255,0.8); font-size: var(--wc-font-caption); margin-top: 24px; text-align: center; }
    .scan-types { padding: 20px 24px 40px; background: rgba(0,0,0,0.6); }
    .scan-types-title { font-size: var(--wc-font-small); color: rgba(255,255,255,0.5); margin-bottom: var(--wc-gap-xl); text-align: center; }
    .scan-type-item { display: flex; align-items: center; padding: var(--wc-gap-lg) 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .scan-type-item:last-child { border-bottom: none; }
    .scan-type-icon { width: 32px; height: 32px; border-radius: var(--wc-btn-radius); display: flex; align-items: center; justify-content: center; margin-right: var(--wc-gap-xl); flex-shrink: 0; }
    .scan-type-icon svg { width: 18px; height: 18px; }
    .scan-type-name { font-size: var(--wc-font-caption); color: var(--wc-card-bg); flex: 1; }
    .scan-type-arrow { color: rgba(255,255,255,0.3); font-size: var(--wc-font-caption); }
    .scan-actions { position: fixed; bottom: 80px; left: 0; right: 0; display: flex; justify-content: center; gap: 48px; z-index: 10; }
    .scan-action-btn { display: flex; flex-direction: column; align-items: center; gap: var(--wc-gap-sm); cursor: pointer; }
    .scan-action-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
    .scan-action-icon svg { width: 20px; height: 20px; }
    .scan-action-label { font-size: var(--wc-font-tiny); color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <div class="scan-page">
    <div style="position:fixed;top:12px;left:var(--wc-page-padding);z-index:20;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="parent.mobileBack()"><span style="color:var(--wc-card-bg);font-size:18px;">✕</span></div>
    <div class="scan-body">
      <div class="scan-viewfinder">
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
        <div class="scan-line"></div>
      </div>
      <div class="scan-hint">将码放入框内，即可自动扫描</div>
    </div>

    <div class="scan-types">
      <div class="scan-types-title">支持的码类型</div>
      <div class="scan-type-item" onclick="handleScanResult('enterprise')">
        <div class="scan-type-icon" style="background:var(--primary-light);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brand-blue)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <span class="scan-type-name">企业码</span>
        <span style="font-size:var(--wc-font-small);color:rgba(255,255,255,0.4);margin-right:var(--wc-gap-md);">→ 企业码首页</span>
        <span class="scan-type-arrow">›</span>
      </div>
      <div class="scan-type-item" onclick="handleScanResult('place')">
        <div class="scan-type-icon" style="background:var(--wc-icon-bg-orange);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--code-yellow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
        <span class="scan-type-name">场所码</span>
        <span style="font-size:var(--wc-font-small);color:rgba(255,255,255,0.4);margin-right:var(--wc-gap-md);">→ 场所码首页</span>
        <span class="scan-type-arrow">›</span>
      </div>
      <div class="scan-type-item" onclick="handleScanResult('hazard')">
        <div class="scan-type-icon" style="background:var(--wc-code-bg-red);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--code-red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <span class="scan-type-name">危险源码</span>
        <span style="font-size:var(--wc-font-small);color:rgba(255,255,255,0.4);margin-right:var(--wc-gap-md);">→ 危险源码首页</span>
        <span class="scan-type-arrow">›</span>
      </div>
      <div class="scan-type-item" onclick="handleScanResult('keyplace')">
        <div class="scan-type-icon" style="background:var(--accent-light);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-light)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <span class="scan-type-name">重点场所码</span>
        <span style="font-size:var(--wc-font-small);color:rgba(255,255,255,0.4);margin-right:var(--wc-gap-md);">→ 重点场所码首页（企业只读）</span>
        <span class="scan-type-arrow">›</span>
      </div>
    </div>

    <div class="scan-actions">
      <div class="scan-action-btn" id="torchBtn" onclick="toggleTorch()">
        <div class="scan-action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--wc-card-bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 017 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 01-1 1h-6a1 1 0 01-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 017-7z"/></svg></div>
        <span class="scan-action-label">闪光灯</span>
      </div>
      <div class="scan-action-btn" onclick="openAlbum()">
        <div class="scan-action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--wc-card-bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
        <span class="scan-action-label">从相册导入</span>
      </div>
    </div>
  </div>

  <script>

function showToast(msg, type) {
  type = type || 'info';
  var toast = document.getElementById('mToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'mToast';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 24px;border-radius:20px;font-size:14px;color:#fff;z-index:10000;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  var bg = 'var(--primary)';
  if (type === 'success') bg = 'var(--code-green)';
  if (type === 'warning') bg = 'var(--code-yellow)';
  if (type === 'error') bg = 'var(--code-red)';
  toast.style.background = bg;
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(function() { toast.style.opacity = '0'; }, 2500);
}
    var torchOn = false;
    function toggleTorch() {
      torchOn = !torchOn;
      var btn = document.getElementById('torchBtn');
      var icon = btn.querySelector('.scan-action-icon');
      if (torchOn) {
        icon.style.background = 'rgba(255,255,255,0.4)';
      } else {
        icon.style.background = 'rgba(255,255,255,0.15)';
      }
    }

    function openAlbum() {
      showToast('打开相册选择图片（原型演示）', 'info');
    }

    function handleScanResult(type) {
      var targets = { enterprise: 'enterprise-code', place: 'place-code', hazard: 'hazard-code', keyplace: 'place-code' };
      parent.navigateTo(targets[type] || 'enterprise-code');
    }
  </script>
</body>
</html>
