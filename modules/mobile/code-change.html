<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>异常记录</title>
  <style>
    /* ===== 内联基础样式（自包含，不依赖外部 mobile.css，保证独立预览可渲染） ===== */
    :root {
      /* 官方设计稿码色（iOS 导出值）：绿 #12C16E / 黄 #FFD838 / 红 #FF071B */
      --success: #12c16e;
      --warning: #ffd838;
      --danger: #ff071b;
      --primary: #1677ff;
      --wc-page-bg: #f5f7fa;
      --wc-card-bg: #ffffff;
      --wc-bg-secondary: #f7f7f7;
      --wc-text-primary: #000000;
      --wc-text-secondary: #333333;
      --wc-text-placeholder: #999999;
      --wc-divider: #e5e5e5;
      --wc-page-padding: 16px;
      --wc-btn-radius: 8px;
      --wc-card-radius: 10px;
      --wc-font-body: 15px;
      --wc-font-caption: 14px;
      --wc-font-small: 12px;
      --wc-font-tiny: 10px;
      --wc-gap-sm: 4px;
      --wc-gap-md: 8px;
      --wc-gap-lg: 10px;
      --wc-gap-xl: 12px;
      --wc-shadow-card-sm: 0 1px 4px rgba(0,0,0,0.04);
      --wc-code-bg-green: #f0fff0;
      --wc-code-border-green: #b7eb8f;
      --wc-code-bg-yellow: #fffbe6;
      --wc-code-border-yellow: #ffe58f;
      --wc-code-bg-red: #fff2f0;
      --wc-code-border-red: #ffccc7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 隐藏滚动条（与首页 mobile.css 处理方式一致） */
    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--wc-page-bg); scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; }
    /* 基准宽度 375px（与外壳手机框架一致），保证独立打开与嵌入框架观感相同 */
    .m-page { min-height: 100vh; background: var(--wc-page-bg); max-width: 375px; margin: 0 auto; display: flex; flex-direction: column; }
    .m-card { background: var(--wc-card-bg); border-radius: var(--wc-card-radius); padding: 14px var(--wc-page-padding); margin: 10px var(--wc-page-padding); box-shadow: var(--wc-shadow-card-sm); }
    .m-card-title { font-size: var(--wc-font-body); font-weight: 500; color: var(--wc-text-primary); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .code-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .code-badge.green { background: var(--wc-code-bg-green); color: var(--success); border: 0.5px solid var(--wc-code-border-green); }
    .code-badge.yellow { background: var(--wc-code-bg-yellow); color: var(--warning); border: 0.5px solid var(--wc-code-border-yellow); }
    .code-badge.red { background: var(--wc-code-bg-red); color: var(--danger); border: 0.5px solid var(--wc-code-border-red); }
  </style>
  <style>
    /* 统计区（环形图 + 轮播，两侧与边界留边距） */
    .stats-section { background: var(--wc-card-bg); margin: 14px var(--wc-page-padding); border-radius: var(--wc-card-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 22px 18px 16px; }

    /* 环形图容器 */
    .ring-wrap { display: flex; justify-content: center; position: relative; }
    .ring-svg { width: 250px; height: 250px; display: block; }
    .ring-seg { cursor: pointer; transition: opacity 0.25s ease, transform 0.25s ease; transform-box: view-box; transform-origin: 115px 115px; }
    .ring-seg.dim { opacity: 0.22; }
    .ring-seg.selected { transform: scale(1.06); }

    /* 卡片左上角：码色二维码图标 + 管控对象名称（页面一级信息，字号最大） */
    .stats-header { display: flex; align-items: center; gap: 10px; padding: 0 2px 16px; }
    .stats-header-name { font-size: 18px; font-weight: 700; color: var(--wc-text-primary); line-height: 1.35; flex: 1; min-width: 0; }
    .stats-header-cal { flex-shrink: 0; width: 22px; height: 22px; color: var(--wc-text-placeholder); cursor: pointer; }
    .stats-header-cal:active { opacity: 0.6; }

    /* 环中心：选中维度名 + 状态 */
    .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 130px; }
    .ring-center-name { font-size: 16px; font-weight: 600; color: var(--wc-text-primary); line-height: 1.3; }
    .ring-center-status { font-size: 12px; margin-top: 8px; display: inline-block; padding: 3px 12px; border-radius: 12px; font-weight: 600; }
    .ring-center-status.green { background: rgba(18,193,110,0.1); color: var(--success); }
    .ring-center-status.yellow { background: rgba(255,216,56,0.15); color: var(--warning); }
    .ring-center-status.red { background: rgba(255,7,27,0.1); color: var(--danger); }

    /* 六维度轮播：固定 3 槽，选中居中，不出现第 4 个 */
    .carousel { display: flex; gap: var(--wc-gap-lg); padding: 12px 2px 2px; align-items: center; }
    .carousel-slot { flex: 1; min-width: 0; }
    .dim-card { background: var(--wc-bg-secondary); border-radius: var(--wc-btn-radius); padding: 12px 8px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; cursor: pointer; transition: all 0.25s ease; animation: dimFade 0.22s ease; }
    @keyframes dimFade { from { opacity: 0; } }
    .dim-card.side { background: #f0f0f0; }
    .dim-card.side .dim-name { color: var(--wc-text-placeholder); }
    .dim-card.side .dim-dot { opacity: 0.6; }
    .dim-card.center { background: var(--wc-card-bg); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dim-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dim-dot.green { background: var(--success); }
    .dim-dot.yellow { background: var(--warning); }
    .dim-dot.red { background: var(--danger); }
    .dim-name { font-size: 12px; font-weight: 600; color: var(--wc-text-primary); line-height: 1.3; white-space: nowrap; }

    /* ===== 明细区通用 ===== */
    .panel-area { margin: 0 var(--wc-page-padding); flex: 1; display: flex; flex-direction: column; }
    .panel-card { background: var(--wc-card-bg); border-radius: var(--wc-card-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 14px; }

    /* 迷你二维码图标：官方切图提取的形状遮罩 + 码色填充（支持绿/黄/红三色） */
    .mini-qr {
      flex-shrink: 0; display: block;
      -webkit-mask-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGkAAABpCAYAAAA5gg06AAACnElEQVR42u2dO2sUURhAzyYRNaBFML4QbRTFByj5AfaCImihRRACYqlgZW2plRZiJdrYpbCzU8FOEKyEVYLExCjiczG+4lrMprHYne/qZu6Yc2Cqe7+73865zAyX+wARERERERGRmtHoUX4IuAGMZJr/eeBKl/JbwMlMc38MHAVme1UcKlG+okS9qhjoUZ5z7qtK5F/qT0oNeqIoSZSkJFGSKElJoiQliZIkTr/GtX4Bn4A2sbGs1RXfjzbwGVgIxAwCa+soaRo4DnwMxBwGLgLDFUqaBk4BM4GYUeBhHSV9Bx4FY+aCPbhfeU8BLwIxLd9JoiQliZKUJEoSJSlJlCRK+j8lNRLbHg3WH6Seg85DOSTUTmh3B/Cmhp12O/DMx50oSUmiJFGSkkRJShIliZKUJOQ/mNgCmvR5huZf8L5H+QzwNNPcp4AfdkEREREREeq2ldpOisVdKzPN/x7dF3AdA3YF27xLfG3VOuBMMOYtcP1f3IQjwDuKySg5Xud65H87oc3TCfdpd8LvPAG24LAQjt2JkkRJShIlKUmUJEpSkihJSJmI0iBtpd8r4AIwH4g5CExQbKlWJSPA5mDMhiolLQ4GRmkBNxNyGc9A0lngBPFzJ2q3lVqd2dS5fCeJkpQkSpJl9uHwgGJf1QhjwJ5gzAfgTjDmJfBFSXCtc0W4lCBpjmIXZB93S8S3hJgF30l+OMhylTQAbAvGDJO+I5hfdwmsB64CPwMxW6n+rIraSkrp3WsopidXzThwIFD/NcXU5Sbx4xMmgL2BmFngMk4zDk8zbiY8pheZdJqxHw6iJFGSkkRJoiQliZJESUoSlm4fh43APvI57ONPmsDzLuX7O/+hLF8pBlhTGCN2iMo8cN8uKCIiIiIiEuc39K/MXaKg0VUAAAAASUVORK5CYII=);
      mask-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGkAAABpCAYAAAA5gg06AAACnElEQVR42u2dO2sUURhAzyYRNaBFML4QbRTFByj5AfaCImihRRACYqlgZW2plRZiJdrYpbCzU8FOEKyEVYLExCjiczG+4lrMprHYne/qZu6Yc2Cqe7+73865zAyX+wARERERERGRmtHoUX4IuAGMZJr/eeBKl/JbwMlMc38MHAVme1UcKlG+okS9qhjoUZ5z7qtK5F/qT0oNeqIoSZSkJFGSKElJoiQliZIkTr/GtX4Bn4A2sbGs1RXfjzbwGVgIxAwCa+soaRo4DnwMxBwGLgLDFUqaBk4BM4GYUeBhHSV9Bx4FY+aCPbhfeU8BLwIxLd9JoiQliZKUJEoSJSlJlCRK+j8lNRLbHg3WH6Seg85DOSTUTmh3B/Cmhp12O/DMx50oSUmiJFGSkkRJShIliZKUJOQ/mNgCmvR5huZf8L5H+QzwNNPcp4AfdkEREREREeq2ldpOisVdKzPN/x7dF3AdA3YF27xLfG3VOuBMMOYtcP1f3IQjwDuKySg5Xud65H87oc3TCfdpd8LvPAG24LAQjt2JkkRJShIlKUmUJEpSkihJSJmI0iBtpd8r4AIwH4g5CExQbKlWJSPA5mDMhiolLQ4GRmkBNxNyGc9A0lngBPFzJ2q3lVqd2dS5fCeJkpQkSpJl9uHwgGJf1QhjwJ5gzAfgTjDmJfBFSXCtc0W4lCBpjmIXZB93S8S3hJgF30l+OMhylTQAbAvGDJO+I5hfdwmsB64CPwMxW6n+rIraSkrp3WsopidXzThwIFD/NcXU5Sbx4xMmgL2BmFngMk4zDk8zbiY8pheZdJqxHw6iJFGSkkRJoiQliZJESUoSlm4fh43APvI57ONPmsDzLuX7O/+hLF8pBlhTGCN2iMo8cN8uKCIiIiIiEuc39K/MXaKg0VUAAAAASUVORK5CYII=);
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
    }
    .mini-qr.yellow { background-color: var(--warning); }
    .mini-qr.red { background-color: var(--danger); }
    .mini-qr.green { background-color: var(--success); }

    /* ===== 履职检查：轻量列表行 ===== */
    .check-list { padding: 6px 18px; }
    .check-row { display: flex; align-items: center; gap: 14px; padding: 20px 0; cursor: pointer; }
    .check-row + .check-row { border-top: 0.5px solid #f5f5f5; }
    .check-row:active { opacity: 0.7; }
    .check-row-main { flex: 1; min-width: 0; }
    .check-row-title { font-size: 15px; font-weight: 600; color: var(--wc-text-primary); line-height: 1.45; }
    .check-row-person { font-size: 12px; color: var(--wc-text-placeholder); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
    .check-row-person svg { width: 12px; height: 12px; }
    .overdue-badge { flex-shrink: 0; font-size: 11px; color: var(--danger); border: 1px solid var(--danger); border-radius: 4px; padding: 3px 8px; background: var(--wc-card-bg); }

    /* ===== 隐患整改：卡片 + 拟物印章 ===== */
    .hazard-card { position: relative; padding: 18px; overflow: hidden; cursor: pointer; }
    .hazard-card:active { opacity: 0.85; }
    .hazard-title { font-size: 15px; font-weight: 600; color: var(--wc-text-primary); line-height: 1.6; padding-right: 74px; margin-bottom: 12px; }
    .hazard-field { font-size: 13px; padding: 5px 0; line-height: 1.6; color: var(--wc-text-secondary); }
    .hazard-field .lbl { color: var(--wc-text-placeholder); }
    .hazard-tags { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 0.5px solid #f0f0f0; }
    .hazard-tag { font-size: 11px; color: #fff; padding: 3px 12px; border-radius: 12px; font-weight: 500; }
    .hazard-tag.cat { background: var(--primary); }
    .hazard-tag.lv-general { background: var(--warning); }
    .hazard-tag.lv-major { background: var(--danger); }
    /* 官方拟物印章：切图已归一化为等尺寸正方形画布，统一显示尺寸 */
    .stamp { position: absolute; top: 14px; right: 12px; width: 66px; height: 66px; pointer-events: none; }

    /* ===== 上下关联：阈值提示 + 折叠分组 ===== */
    .threshold-tip { font-size: 12px; color: var(--wc-text-secondary); padding: 14px 2px; }
    .threshold-tip b { color: var(--danger); }
    .assoc-group { padding: 0 18px; }
    .assoc-group-header { display: flex; align-items: center; gap: 8px; padding: 16px 0; cursor: pointer; }
    .assoc-group-title { flex: 1; font-size: 15px; font-weight: 700; color: var(--wc-text-primary); }
    .assoc-arrow { width: 16px; height: 16px; transition: transform 0.25s ease; color: var(--wc-text-placeholder); }
    .assoc-group.collapsed .assoc-arrow { transform: rotate(180deg); }
    .assoc-group.collapsed .assoc-group-body { display: none; }
    .assoc-group-body { padding-bottom: 12px; }
    .assoc-row { display: flex; align-items: center; gap: 12px; background: var(--wc-bg-secondary); border-radius: var(--wc-btn-radius); padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .assoc-row:active { opacity: 0.7; }
    .assoc-row-main { flex: 1; min-width: 0; }
    .assoc-row-name { font-size: 15px; font-weight: 600; color: var(--wc-text-primary); }
    .assoc-row-sub { font-size: 12px; color: var(--wc-text-placeholder); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
    .assoc-row-sub svg { width: 12px; height: 12px; }
    .assoc-row-role { font-size: 12px; color: var(--wc-text-placeholder); flex-shrink: 0; }

    /* 空状态（白色卡片容器，撑满剩余高度，内容垂直居中） */
    .empty-state { background: var(--wc-card-bg); border-radius: var(--wc-card-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; padding: 36px 0 44px; color: var(--wc-text-placeholder); font-size: 13px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .empty-img { width: 180px; height: auto; display: block; margin: 0 auto 4px; flex-shrink: 0; }

    /* 刷新时间（参考首页 ec-qr-time：今天带时分，历史仅年月日） */
    .stats-update-time { text-align: center; font-size: 12px; color: var(--wc-text-placeholder); padding: 10px 0 0; }

    /* ===== 码色日历底部抽屉 ===== */
    .cal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 90; }
    .cal-mask.show { opacity: 1; pointer-events: auto; }
    .cal-drawer { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: 100%; max-width: 375px; background: var(--wc-card-bg); border-radius: 16px 16px 0 0; z-index: 91; transition: transform 0.3s ease; padding: 8px 18px 24px; }
    .cal-drawer.show { transform: translate(-50%, 0); }
    .cal-drawer-handle { width: 36px; height: 4px; border-radius: 2px; background: #e0e0e0; margin: 6px auto 10px; }
    .cal-drawer-header { display: flex; align-items: center; justify-content: center; position: relative; padding: 4px 0 10px; }
    .cal-nav { width: 28px; height: 28px; border-radius: 6px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
    .cal-nav.disabled { background: #e8e8e8; color: #bbb; cursor: default; }
    .cal-title { font-size: 16px; font-weight: 600; color: var(--wc-text-primary); min-width: 130px; text-align: center; cursor: pointer; }
    .cal-close { position: absolute; right: 0; top: 2px; width: 24px; height: 24px; color: var(--wc-text-placeholder); cursor: pointer; }
    .cal-legend { display: flex; justify-content: flex-end; gap: 12px; font-size: 11px; color: var(--wc-text-secondary); padding: 2px 0 8px; }
    .cal-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
    .cal-legend i.green { background: var(--success); }
    .cal-legend i.yellow { background: var(--warning); }
    .cal-legend i.red { background: var(--danger); }
    .cal-table { width: 100%; border-collapse: collapse; }
    .cal-table th { font-size: 12px; color: #c9cdd4; padding: 6px 0; font-weight: 400; }
    .cal-table td { text-align: center; padding: 5px 0; }
    .cal-dot { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .cal-dot.green { background: var(--success); color: #fff; }
    .cal-dot.yellow { background: var(--warning); color: #fff; }
    .cal-dot.red { background: var(--danger); color: #fff; }
    .cal-dot.future { background: #e8e8e8; color: #bbb; cursor: default; }
    .cal-dot.empty { background: transparent; color: #ccc; cursor: default; }
    .cal-dot.selected { box-shadow: 0 0 0 2px var(--wc-card-bg), 0 0 0 4px var(--primary); font-weight: 700; }
    /* 年月选择面板 */
    .cal-ym { display: none; padding: 6px 0 10px; }
    .cal-ym.show { display: block; }
    .cal-ym-years { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 4px 0 12px; }
    .cal-ym-year { font-size: 16px; font-weight: 600; color: var(--wc-text-primary); min-width: 80px; text-align: center; }
    .cal-ym-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .cal-ym-month { text-align: center; padding: 10px 0; border-radius: 8px; background: var(--wc-bg-secondary); font-size: 13px; color: var(--wc-text-primary); cursor: pointer; }
    .cal-ym-month.active { background: var(--primary); color: #fff; font-weight: 600; }
    .cal-ym-month.disabled { color: #ccc; cursor: default; }
  </style>
</head>
<body>
  <div class="m-page">
    <!-- 统计区：环形图 + 六维度轮播 -->
    <div class="stats-section">
      <!-- 左上角：码色二维码图标（六维取最高）+ 管控对象名称 -->
      <div class="stats-header"><span class="mini-qr red" id="objQr" style="width:26px;height:26px"></span><span class="stats-header-name" id="objName">深圳XX化工有限公司</span><svg class="stats-header-cal" onclick="openCalDrawer()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="14.5" r="0.5" fill="currentColor"/><circle cx="12" cy="14.5" r="0.5" fill="currentColor"/><circle cx="16" cy="14.5" r="0.5" fill="currentColor"/><circle cx="8" cy="18" r="0.5" fill="currentColor"/><circle cx="12" cy="18" r="0.5" fill="currentColor"/></svg></div>
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 230 230" id="ringSvg"></svg>
        <div class="ring-center">
          <div class="ring-center-name" id="centerName">履职检查</div>
          <div class="ring-center-status red" id="centerStatus">异常</div>
        </div>
      </div>
      <!-- 刷新时间：今天带时分（参考首页），历史数据仅年月日 -->
      <div class="stats-update-time" id="updateTime"></div>
      <!-- 六维度轮播：3 槽，选中居中，点左/右卡片循环切换 -->
      <div class="carousel">
        <div class="carousel-slot" id="slotLeft"></div>
        <div class="carousel-slot" id="slotCenter"></div>
        <div class="carousel-slot" id="slotRight"></div>
      </div>
    </div>

    <!-- 明细内容区（随选中维度切换，两侧留边距） -->
    <div class="panel-area" id="panelArea"></div>

    <div style="height:20px;"></div>
  </div>

  <!-- 码色日历底部抽屉 -->
  <div class="cal-mask" id="calMask" onclick="closeCalDrawer()"></div>
  <div class="cal-drawer" id="calDrawer">
    <div class="cal-drawer-handle"></div>
    <div class="cal-drawer-header">
      <div class="cal-nav" id="calPrev" onclick="drawerNav(-1)">‹</div>
      <div class="cal-title" id="calTitle" onclick="toggleYmPanel()"></div>
      <div class="cal-nav" id="calNext" onclick="drawerNav(1)">›</div>
      <svg class="cal-close" onclick="closeCalDrawer()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </div>
    <div class="cal-ym" id="calYm">
      <div class="cal-ym-years">
        <div class="cal-nav" onclick="ymYearNav(-1)">‹</div>
        <div class="cal-ym-year" id="ymYear"></div>

  <script>
    // 六个维度：状态 green=正常 yellow=黄色 red=红色
    var DIMS = [
      { name: '履职检查', status: 'red' },
      { name: '隐患整改', status: 'red' },
      { name: '上下关联', status: 'red' },
      { name: '调度处置', status: 'green' },
      { name: '主动赋码', status: 'green' },
      { name: '监测预警', status: 'green' }
    ];
    // 环中心文案只有两种：正常 / 异常；颜色取该维度事件导致的最高异常码色
    var STATUS_TEXT = { green: '正常', yellow: '异常', red: '异常' };
    var STATUS_COLOR = { green: 'var(--success)', yellow: 'var(--warning)', red: 'var(--danger)' };

    // 汇总状态：六维取最高（红 > 黄 > 绿）
    function worstStatus() {
      if (DIMS.some(function(d){ return d.status === 'red'; })) return 'red';
      if (DIMS.some(function(d){ return d.status === 'yellow'; })) return 'yellow';
      return 'green';
    }
    function prevIdx(i) { return (i - 1 + DIMS.length) % DIMS.length; }
    function nextIdx(i) { return (i + 1) % DIMS.length; }

    var current = 0;

    // 生成六段环形图（等分，段间留缺口）
    function buildRing() {
      var svg = document.getElementById('ringSvg');
      var cx = 115, cy = 115, r = 88, sw = 30; // 半径、描边宽
      var gap = 6; // 每段之间的缺口（度）
      var segAngle = 360 / DIMS.length;
      var start = -90; // 从顶部开始
      var html = '';
      // 底环（淡色轨道）
      html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" style="stroke:var(--wc-bg-secondary)" stroke-width="' + sw + '"/>';
      DIMS.forEach(function(d, i) {
        var a0 = start + i * segAngle + gap / 2;
        var a1 = start + (i + 1) * segAngle - gap / 2;
        var large = (a1 - a0) > 180 ? 1 : 0;
        var x0 = cx + r * Math.cos(a0 * Math.PI / 180), y0 = cy + r * Math.sin(a0 * Math.PI / 180);
        var x1 = cx + r * Math.cos(a1 * Math.PI / 180), y1 = cy + r * Math.sin(a1 * Math.PI / 180);
        html += '<path class="ring-seg" id="seg' + i + '" d="M ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
          ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
          '" fill="none" style="stroke:' + STATUS_COLOR[d.status] + '" stroke-width="' + sw + '"' +
          ' onclick="selectDim(' + i + ')"/>';
      });
      svg.innerHTML = html;
    }

    // ===== 明细区辅助生成函数 =====
    // 迷你二维码图标：官方「绿二维码@3x」切图提取形状作 CSS mask，状态色填充（支持绿/黄/红）
    function miniQr(color, size) {
      size = size || 38;
      return '<span class="mini-qr ' + color + '" style="width:' + size + 'px;height:' + size + 'px"></span>';
    }

    function stampSvg(text) {
      return '<img class="stamp" src="' + (STAMP_IMGS[text] || STAMP_IMGS['待整改']) + '" alt="' + text + '">';
    }

    // 维度卡片 HTML（左圆点 + 右维度名）
    function dimCardHtml(d, cls) {
      var border = cls === 'center' ? STATUS_COLOR[d.status] : 'transparent';
      return '<div class="dim-card ' + cls + '" style="border-color:' + border + '">' +
        '<div class="dim-dot ' + d.status + '"></div>' +
        '<div class="dim-name">' + d.name + '</div>' +
        '</div>';
    }

    // 渲染轮播：左槽=前一个、中槽=当前、右槽=后一个，循环切换
    function renderCarousel() {
      var left = DIMS[prevIdx(current)], mid = DIMS[current], right = DIMS[nextIdx(current)];
      document.getElementById('slotLeft').innerHTML = dimCardHtml(left, 'side');
      document.getElementById('slotCenter').innerHTML = dimCardHtml(mid, 'center');
      document.getElementById('slotRight').innerHTML = dimCardHtml(right, 'side');
      // 点左卡片 → 切到前一个；点右卡片 → 切到后一个（循环）
      document.getElementById('slotLeft').onclick = function() { selectDim(prevIdx(current)); };
      document.getElementById('slotRight').onclick = function() { selectDim(nextIdx(current)); };
    }

      return arr[d - 1];
    }
    var STATUS_NAME = { 1: 'green', 2: 'yellow', 3: 'red' };

    // 当前查看日期（默认今天；二维码入口重置为今天；首页日历点哪天直接显示哪天）
    var viewDate = new Date();
    viewDate = { y: viewDate.getFullYear(), m: viewDate.getMonth(), d: viewDate.getDate() };
    try {
      if (localStorage.getItem('codeChangeResetToday') === '1') {
        localStorage.removeItem('codeChangeResetToday');
        localStorage.removeItem('codeChangeViewDate');
      } else {
        var saved = localStorage.getItem('codeChangeViewDate');
        if (saved) {
          var p = saved.split('-');
          var vd = { y: +p[0], m: +p[1] - 1, d: +p[2] };
          // 防御：非法日期或未来日期回退今天（未来日无数据）
          var vdt = new Date(vd.y, vd.m, vd.d);
          var now0 = new Date();
          if (vdt.getFullYear() === vd.y && vdt.getMonth() === vd.m && vdt.getDate() === vd.d &&
              vdt <= new Date(now0.getFullYear(), now0.getMonth(), now0.getDate())) {
            viewDate = vd;
          } else {
            localStorage.removeItem('codeChangeViewDate');
          }
        }
      }
    } catch (e) {}

    // 按日期生成六维状态与明细面板
    function buildDayData() {
      var s = dayStatus(viewDate.y, viewDate.m, viewDate.d);
      var color = STATUS_NAME[s] || 'green';
      var emptyHtml = EMPTY_HTML;
      if (color === 'green') {
        // 绿码日：六维全部正常，明细全部空态
        DIMS.forEach(function(d) { d.status = 'green'; });
        PANELS = [emptyHtml, emptyHtml, emptyHtml, emptyHtml, emptyHtml, emptyHtml];
      } else if (color === 'yellow') {
        // 黄码日：履职检查黄（示例事件均为黄码级）
        DIMS[0].status = 'yellow'; DIMS[1].status = 'green';
        for (var i = 2; i < 6; i++) DIMS[i].status = 'green';
        PANELS = [PANEL_CHECK_YELLOW, emptyHtml, emptyHtml, emptyHtml, emptyHtml, emptyHtml];
      } else {
        // 红码日：履职检查红 + 隐患整改红 + 上下关联红（明细含「超期未整改」红章=红码级；上下关联为异常占比超40%致红，状态须与数据对应）
        DIMS[0].status = 'red'; DIMS[1].status = 'red'; DIMS[2].status = 'red';
        DIMS[3].status = 'green'; DIMS[4].status = 'green'; DIMS[5].status = 'green';
        PANELS = [PANEL_CHECK_RED, PANEL_HAZARD, PANEL_ASSOC, emptyHtml, emptyHtml, emptyHtml];
      }
    }

    // 刷新时间：今天带时分，历史仅年月日
    function renderUpdateTime() {
      var now = new Date();
      var isToday = viewDate.y === now.getFullYear() && viewDate.m === now.getMonth() && viewDate.d === now.getDate();
      var label = viewDate.y + '-' + pad2(viewDate.m + 1) + '-' + pad2(viewDate.d);
      if (isToday) label += ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      document.getElementById('updateTime').textContent = '更新时间：' + label;
    }

    // ===== 码色日历抽屉 =====
    var drawerY, drawerM, ymY;
    function openCalDrawer() {
      drawerY = viewDate.y; drawerM = viewDate.m;
      document.getElementById('calYm').classList.remove('show');
      document.getElementById('calBody').style.display = '';
      renderDrawerCal();
      document.getElementById('calMask').classList.add('show');
      document.getElementById('calDrawer').classList.add('show');
    }
    function closeCalDrawer() {
      document.getElementById('calMask').classList.remove('show');
      document.getElementById('calDrawer').classList.remove('show');
    }
    function drawerNav(delta) {
      var now = new Date();
      var m = drawerM + delta, y = drawerY;
      if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
      if (y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth())) return;
      drawerY = y; drawerM = m;
      renderDrawerCal();
    }
    function renderDrawerCal() {
      var now = new Date();
      document.getElementById('calTitle').textContent = drawerY + '年' + (drawerM + 1) + '月';
      var canNext = !(drawerY > now.getFullYear() || (drawerY === now.getFullYear() && drawerM >= now.getMonth()));
      document.getElementById('calNext').className = 'cal-nav' + (canNext ? '' : ' disabled');
      var firstWeekday = new Date(drawerY, drawerM, 1).getDay();
      var lead = (firstWeekday + 6) % 7;
      var daysInMonth = new Date(drawerY, drawerM + 1, 0).getDate();
      var prevDays = new Date(drawerY, drawerM, 0).getDate();
      var rows = Math.ceil((lead + daysInMonth) / 7);
      var html = '<tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr>';
      for (var i = 0; i < rows * 7; i++) {
        if (i % 7 === 0) html += '<tr>';
        var d = 1 - lead + i;
        if (d < 1) html += '<td><span class="cal-dot empty">' + (prevDays + d) + '</span></td>';
        else if (d > daysInMonth) html += '<td><span class="cal-dot empty">' + (d - daysInMonth) + '</span></td>';
        else {
          var s = dayStatus(drawerY, drawerM, d);
          var cls = s === null ? 'future' : STATUS_NAME[s];
          var sel = (drawerY === viewDate.y && drawerM === viewDate.m && d === viewDate.d) ? ' selected' : '';
          var click = s === null ? '' : ' onclick="pickDay(' + d + ')"';
          html += '<td><span class="cal-dot ' + cls + sel + '"' + click + '>' + d + '</span></td>';
        }
        if (i % 7 === 6) html += '</tr>';
      }
      document.getElementById('calTable').innerHTML = html;
    }
    function pickDay(d) {
      viewDate = { y: drawerY, m: drawerM, d: d };
      try { localStorage.setItem('codeChangeViewDate', dateKey(drawerY, drawerM, d)); } catch (e) {}
      closeCalDrawer();
      applyViewDate();
    }
    // 整页切换到当前 viewDate 的数据
    function applyViewDate() {
      buildDayData();
      buildRing();
      renderHeader();
      renderUpdateTime();
      selectDim(0);
    }
    // 年月选择面板
    function toggleYmPanel() {
      var p = document.getElementById('calYm');
      var show = !p.classList.contains('show');
      p.classList.toggle('show', show);
      document.getElementById('calBody').style.display = show ? 'none' : '';
      if (show) { ymY = drawerY; renderYmPanel(); }
    }
    function ymYearNav(delta) {
      var now = new Date();
      if (ymY + delta > now.getFullYear()) return;
      ymY += delta;
      renderYmPanel();
    }
    function renderYmPanel() {
      var now = new Date();
      document.getElementById('ymYear').textContent = ymY + '年';
      document.getElementById('ymYearNext').className = 'cal-nav' + (ymY >= now.getFullYear() ? ' disabled' : '');
      var html = '';
      for (var m = 0; m < 12; m++) {
        var disabled = ymY > now.getFullYear() || (ymY === now.getFullYear() && m > now.getMonth());
        var active = ymY === drawerY && m === drawerM;
        html += '<div class="cal-ym-month' + (active ? ' active' : '') + (disabled ? ' disabled' : '') + '"' +
          (disabled ? '' : ' onclick="pickMonth(' + m + ')"') + '>' + (m + 1) + '月</div>';
      }
      document.getElementById('ymGrid').innerHTML = html;
    }
    function pickMonth(m) {
      drawerY = ymY; drawerM = m;
      document.getElementById('calYm').classList.remove('show');
      document.getElementById('calBody').style.display = '';
      renderDrawerCal();
    }

    // 选中维度：环形图高亮 + 轮播 + 明细联动；环中心显示选中维度名+状态
    function selectDim(idx) {
      current = idx;
      DIMS.forEach(function(d, i) {
        var seg = document.getElementById('seg' + i);
        if (seg) seg.classList.toggle('dim', i !== idx);
      });
      renderCarousel();
      var d = DIMS[idx];
      document.getElementById('centerName').textContent = d.name;
      var st = document.getElementById('centerStatus');
      st.textContent = STATUS_TEXT[d.status];
      st.className = 'ring-center-status ' + d.status;
      document.getElementById('panelArea').innerHTML = PANELS[idx];
    }

    // 左上角：码色二维码图标（六维取最高）+ 对象名称；名称由入口页（企业码/场所码/危险源码）传入
    function renderHeader() {
      try {
        var passed = localStorage.getItem('codeChangeEntityName');
        // 防御：剔除历史脏数据尾部混入的标注徽章数字
        if (passed) document.getElementById('objName').textContent = passed.replace(/\d+$/, '').trim();
      } catch (e) {}
      document.getElementById('objQr').className = 'mini-qr ' + worstStatus();
    }

    // 初始化：按当前查看日期组装数据并渲染
    applyViewDate();
  </script>
<script src="../../js/mobile-session.js"></script>
<script src="../../js/annotations.js"></script>
</body>
</html>
