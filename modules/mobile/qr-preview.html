    .preview-row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }

    .preview-card p { font-size: 12px; color: #999; margin: 0; }
    .qr-box { width: 140px; height: 140px; border-radius: 8px; overflow: hidden; margin: 0 auto; }
    .label-tag { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
