<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业基本信息 - 企业端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ========== 页面背景 ========== */
    .page-container { 
      padding: var(--spacing-lg); 
      background: var(--bg-page);
      min-height: 100vh;
    }
    
    /* ========== 页面标题栏 ========== */
    .page-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: var(--spacing-md);
      background: var(--bg-primary);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-header);
    }
    .page-title { font-size: var(--font-size-xl); font-weight: 600; color: var(--text-primary); }
    
    /* ========== 信息卡片 ========== */
    .info-card { 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      box-shadow: var(--shadow-card);
    }
    .info-header { 
      padding: var(--spacing-md) var(--spacing-lg); 
      border-bottom: 1px solid var(--border-light); 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      background: var(--bg-section);
    }
    .info-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--text-primary); }
    .info-body { padding: var(--spacing-lg); }
    
    /* ========== 信息板块 ========== */
    .info-section { margin-bottom: var(--spacing-xl); }
    .info-section:last-child { margin-bottom: 0; }
    
    .info-section-title {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
      padding-bottom: var(--spacing-sm);
      border-bottom: 1px solid var(--border-light);
    }
    .info-section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-md); }
    .info-item { display: flex; flex-direction: column; gap: 4px; }
    .info-label { font-size: var(--font-size-xs); color: var(--text-secondary); }
    .info-value { font-size: var(--font-size-sm); color: var(--text-primary); }
    
    .tag-list { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); }
    .tag-item { background: var(--info-light); color: var(--info); padding: 4px 12px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); display: inline-flex; align-items: center; gap: 4px; }
    .tag-item .tag-remove { cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.6; display: none; }
    .tag-item .tag-remove:hover { opacity: 1; }
    .editing .tag-item .tag-remove { display: inline; }
    .tag-input-wrap { display: none; align-items: center; gap: 6px; }
    .editing .tag-input-wrap { display: inline-flex; }
    .tag-input { border: 1px solid var(--border-input); border-radius: var(--radius-sm); padding: 4px 8px; font-size: var(--font-size-xs); outline: none; width: 120px; }
    .tag-input:focus { border-color: var(--primary); }
    .tag-add-btn { background: var(--info-light); color: var(--info); border: 1px dashed var(--info); padding: 4px 10px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); cursor: pointer; white-space: nowrap; }
    .tag-add-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .readonly-field { background: var(--bg-section-alt); padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); color: var(--text-secondary); }
    .editable-field { background: var(--bg-primary); padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); color: var(--text-primary); outline: none; }
    .editable-field.editing { border: 1px solid var(--border-input); }
    .editable-field.editing:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
    .field-error { color: var(--error); font-size: 12px; margin-top: 4px; display: none; }
    .has-error .editable-field { border-color: var(--error); }
    .has-error .field-error { display: block; }
  </style>
</head>
<body>
  <div class="module-page page-container" data-module="ent-info">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">企业端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">企业信息</span>
    </div>
    
    <!-- 页面标题栏已隐藏 -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: var(--spacing-md);">
      <button class="btn btn-primary" id="editBtn" onclick="toggleEdit()">编辑</button>
    </div>
    
    <div class="info-card">
      <div class="info-header">
        <span class="info-title">基础信息</span>
      </div>
      <div class="info-body">
        <div class="info-section">
          <div class="info-section-title">基本信息</div>
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">企业名称</span>
              <span class="info-value readonly-field">创安电子科技有限公司</span>
            </div>
            <div class="info-item">
              <span class="info-label">统一社会信用代码</span>
              <span class="info-value readonly-field">91440300MA5DQ2XXXX</span>
            </div>
            <div class="info-item">
              <span class="info-label">法定代表人</span>
              <span class="info-value"><input class="editable-field" data-field="legalPerson" value="王建国" readonly style="width:100%;box-sizing:border-box;"></span>
            </div>
            <div class="info-item" id="fg-phone">
              <span class="info-label">联系电话</span>
              <span class="info-value"><input class="editable-field" data-field="phone" value="13800138000" readonly style="width:100%;box-sizing:border-box;"></span>
              <div class="field-error">请输入正确的手机号（11位数字，1开头）</div>
            </div>
            <div class="info-item">
              <span class="info-label">注册地址</span>
              <span class="info-value readonly-field">深圳市南山区科技园南区</span>
            </div>
            <div class="info-item">
              <span class="info-label">经营地址</span>
              <span class="info-value"><input class="editable-field" data-field="bizAddress" value="深圳市南山区科技园南区A栋" readonly style="width:100%;box-sizing:border-box;"></span>
            </div>
            <div class="info-item">
              <span class="info-label">所属网格</span>
              <span class="info-value readonly-field">南山区-南山街道-第12网格</span>
            </div>
            <div class="info-item">
              <span class="info-label">监管单位</span>
              <span class="info-value readonly-field">南山区应急管理局</span>
            </div>
            <div class="info-item">
              <span class="info-label">企业状态</span>
              <span class="info-value"><span class="tag tag-green">正常</span></span>
            </div>
          </div>
        </div>
        
        <div class="info-section">
          <div class="info-section-title">关联领域小类</div>
          <div class="tag-list" id="categoryTags">
            <span class="tag-item">充换电设施<span class="tag-remove" onclick="removeTag(this)">&times;</span></span>
            <span class="tag-item">工业制造<span class="tag-remove" onclick="removeTag(this)">&times;</span></span>
            <span class="tag-item">危险化学品使用<span class="tag-remove" onclick="removeTag(this)">&times;</span></span>
            <div class="tag-input-wrap">
              <input class="tag-input" id="tagInput" placeholder="输入新标签" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag();}">
              <button class="tag-add-btn" onclick="addTag()">添加</button>
            </div>
          </div>
        </div>
        
        <div class="info-section">
          <div class="info-section-title">账号信息</div>
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">登录账号</span>
              <span class="info-value readonly-field">ca888</span>
            </div>
            <div class="info-item">
              <span class="info-label">登录密码</span>
              <span class="info-value readonly-field">••••••••</span>
            </div>
            <div class="info-item">
              <span class="info-label">账号状态</span>
              <span class="info-value"><span class="tag tag-green">正常</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    (function() {
      'use strict';
      
      const CONFIG = {
        moduleId: 'ent-info',
        moduleName: '企业基本信息'
      };
      
      let state = {
        initialized: false,
        isEditing: false
      };
      
      function init() {
        if (state.initialized) return;
        console.log(`[${CONFIG.moduleId}] 模块初始化`);
        state.initialized = true;
      }
      
      window.toggleEdit = function() {
        state.isEditing = !state.isEditing;
        var btn = document.getElementById('editBtn');
        var editableFields = document.querySelectorAll('.editable-field');

        if (state.isEditing) {
          btn.textContent = '保存';
          btn.className = 'btn btn-primary';
          editableFields.forEach(function(f) {
            f.removeAttribute('readonly');
            f.classList.add('editing');
          });
        } else {
          // 校验联系电话
          var phoneField = document.querySelector('[data-field="phone"]');
          var phoneFg = document.getElementById('fg-phone');
          if (phoneField) {
            var phone = phoneField.value.trim();
            var phoneReg = /^1\d{10}$/;
            if (!phoneReg.test(phone)) {
              phoneFg.classList.add('has-error');
              phoneField.focus();
              return;
            }
            phoneFg.classList.remove('has-error');
          }

          btn.textContent = '编辑';
          btn.className = 'btn btn-default';
          editableFields.forEach(function(f) {
            f.setAttribute('readonly', 'readonly');
            f.classList.remove('editing');
          });
          showToast('保存成功！');
        }
      };

      // 标签交互
      window.removeTag = function(el) {
        var tagItem = el.parentElement;
        tagItem.remove();
        showToast('标签已移除');
      };

      window.addTag = function() {
        var input = document.getElementById('tagInput');
        var value = input.value.trim();
        if (!value) return;
        var container = document.getElementById('categoryTags');
        var inputWrap = container.querySelector('.tag-input-wrap');
        var newTag = document.createElement('span');
        newTag.className = 'tag-item';
        newTag.innerHTML = value + '<span class="tag-remove" onclick="removeTag(this)">&times;</span>';
        container.insertBefore(newTag, inputWrap);
        input.value = '';
        showToast('标签已添加：' + value);
      };

      function showToast(msg) {
        var t = document.createElement('div');
        t.textContent = msg;
        Object.assign(t.style, { position:'fixed', top:'24px', left:'50%', transform:'translateX(-50%)', padding:'8px 24px', background:'#1677ff', color:'#fff', borderRadius:'6px', fontSize:'14px', zIndex:'9999', boxShadow:'0 2px 8px rgba(0,0,0,0.15)' });
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 2000);
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      window.destroyModule = function() {
        console.log(`[${CONFIG.moduleId}] 模块销毁`);
        state.initialized = false;
      };
    })();
  </script>
<script src="../../js/annotations.js"></script>
</body>
</html>
