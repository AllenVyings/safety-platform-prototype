<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目组织架构 - 企业端</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family);background:var(--bg-page-solid);color:var(--text-primary);font-size:var(--font-size-md)}
.page-container{padding:20px;min-height:100vh}

/* 面包屑 */
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:var(--font-size-sm);color:var(--text-tertiary);margin-bottom:16px}
.breadcrumb a{color:var(--text-secondary);text-decoration:none;transition:color var(--duration-fast)}
.breadcrumb a:hover{color:var(--primary)}
.breadcrumb .sep{margin:0 4px;color:var(--text-tertiary)}
.breadcrumb .current{color:var(--text-primary);font-weight:500}

/* ========== 主布局 ========== */
.main-layout{display:flex;gap:16px;height:calc(100vh - 90px)}

/* ========== 左侧树面板 ========== */
.tree-panel{width:320px;background:var(--bg-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow var(--duration-normal)}
.tree-panel:hover{box-shadow:var(--shadow-card-hover)}

.panel-header{padding:16px 20px;border-bottom:1px solid var(--border-light);font-size:var(--font-size-lg);font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--bg-card) 0%,#f8faff 100%)}
.panel-header .header-icon{width:28px;height:28px;background:var(--primary-light);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
.panel-header .header-icon svg{width:16px;height:16px;color:var(--primary)}

/* 树搜索 */
.tree-search{padding:10px 14px;border-bottom:1px solid var(--border-light)}
.tree-search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;transition:all var(--duration-fast);background:var(--bg-secondary);color:var(--text-primary)}
.tree-search input:focus{border-color:var(--primary);background:var(--bg-card);box-shadow:var(--shadow-input-focus)}
.tree-search input::placeholder{color:var(--text-placeholder)}
.tree-search-wrap{position:relative}
.tree-search-wrap .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:14px;pointer-events:none}

.tree-body{flex:1;overflow-y:auto;padding:8px 6px}
.tree-body::-webkit-scrollbar{width:4px}
.tree-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tree-body::-webkit-scrollbar-thumb:hover{background:var(--border-dark)}

/* ========== 树节点 ========== */
.tree-node{position:relative}
.tree-node-content{display:flex;align-items:center;padding:7px 10px 7px 8px;cursor:pointer;border-radius:var(--radius-md);transition:all var(--duration-fast);gap:6px;margin:1px 0;position:relative}
.tree-node-content:hover{background:var(--bg-hover)}
.tree-node-content.active{background:var(--bg-active);color:var(--primary)}
.tree-node-content.active .node-label{font-weight:500}
.tree-node-content.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--primary);border-radius:0 2px 2px 0}

.tree-node-content .toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);font-size:10px;flex-shrink:0;transition:transform var(--duration-fast);border-radius:var(--radius-sm)}
.tree-node-content .toggle:hover{background:var(--bg-secondary);color:var(--primary)}
.tree-node-content .toggle.expanded{transform:rotate(0deg)}
.tree-node-content .toggle.collapsed{transform:rotate(-90deg)}

.tree-node-content .icon{font-size:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tree-node-content .node-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-sm);color:var(--text-primary);min-width:0}
.tree-node-content.active .node-label{color:var(--primary)}

.tree-node-content .node-tag{font-size:var(--font-size-xs);padding:1px 6px;border-radius:var(--radius-sm);margin-left:2px;flex-shrink:0;font-weight:500;letter-spacing:0.3px}
.tree-node-content .drag-handle{width:16px;height:16px;display:none;cursor:grab;color:var(--text-tertiary);margin-left:4px;border-radius:var(--radius-sm);align-items:center;justify-content:center;font-size:10px}
.tree-node-content:hover .drag-handle{display:flex}
.tree-node-content .drag-handle:hover{background:var(--bg-secondary);color:var(--text-secondary)}
.tree-node-content .drag-handle:active{cursor:grabbing}

/* 节点类型 SVG 图标色 */
.node-root .icon svg{color:var(--primary)}
.node-category .icon svg{color:var(--accent)}
.node-enterprise .icon svg{color:var(--success)}
.node-department .icon svg{color:var(--warning)}

/* 节点标签颜色 */
.tag-category{background:var(--accent-light);color:var(--accent-active);border:1px solid rgba(123,97,255,0.25)}
.tag-enterprise{background:var(--success-light);color:var(--success);border:1px solid rgba(82,196,26,0.25)}
.tag-department{background:var(--warning-light);color:var(--warning);border:1px solid rgba(250,173,20,0.25)}

/* 子节点缩进 + 层级线 */
.tree-node{display:block!important}
.tree-children{padding-left:16px;display:block!important;position:relative}
.tree-children::before{content:'';position:absolute;left:18px;top:0;bottom:12px;width:1px;background:var(--border-light)}
.tree-children>.tree-node::before{content:'';position:absolute;left:-6px;top:14px;width:12px;height:1px;background:var(--border-light)}

/* ========== 右侧内容 ========== */
.right-panel{flex:1;background:var(--bg-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow var(--duration-normal)}
.right-panel:hover{box-shadow:var(--shadow-card-hover)}

/* 工具栏 */
.toolbar{padding:14px 20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,var(--bg-card) 0%,#f8faff 100%)}
.toolbar-title{font-size:var(--font-size-lg);font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:10px}
.toolbar-title .node-type-tag{font-size:var(--font-size-xs);padding:2px 8px;border-radius:var(--radius-sm);font-weight:500}
.toolbar-actions{display:flex;gap:8px;align-items:center}

/* ========== 按钮 ========== */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:var(--font-size-sm);cursor:pointer;transition:all var(--duration-fast);font-family:var(--font-family);line-height:1.5}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff;box-shadow:0 2px 6px rgba(22,119,255,0.3)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-hover);border-color:var(--danger-hover);box-shadow:0 2px 6px rgba(255,77,79,0.3)}
.btn-sm{padding:4px 10px;font-size:var(--font-size-xs)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .btn-icon{font-size:14px;display:flex;align-items:center}

/* 搜索框 */
.search-box{position:relative}
.search-box input{padding:6px 10px 6px 30px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);width:200px;outline:none;transition:all var(--duration-fast);background:var(--bg-secondary);color:var(--text-primary)}
.search-box input:focus{border-color:var(--primary);background:var(--bg-card);box-shadow:var(--shadow-input-focus)}
.search-box input::placeholder{color:var(--text-placeholder)}
.search-box .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:14px;pointer-events:none}

/* ========== 路径栏 ========== */
.path-bar{padding:8px 20px;background:var(--bg-section-alt);border-bottom:1px solid var(--border-light);font-size:var(--font-size-xs);color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.path-bar .path-label{color:var(--text-tertiary);font-weight:500}
.path-bar .path-text{color:var(--text-primary)}
.path-bar .path-sep{color:var(--text-tertiary);margin:0 2px}

/* ========== 信息卡片 ========== */
.info-card{margin:16px 20px 0;background:linear-gradient(135deg,#f8faff 0%,var(--bg-section-alt) 100%);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:16px 20px}
.info-card-header{font-weight:600;font-size:var(--font-size-sm);color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border-light)}
.info-card-header .card-icon{width:22px;height:22px;background:var(--primary-light);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.info-card-header .card-icon svg{width:13px;height:13px;color:var(--primary)}
.info-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px}
.info-card-field{display:flex;flex-direction:column;gap:2px}
.info-card-field .field-label{font-size:var(--font-size-xs);color:var(--text-tertiary);font-weight:400}
.info-card-field .field-value{font-size:var(--font-size-sm);color:var(--text-primary);font-weight:500}

/* ========== 表格 ========== */
.table-scroll{flex:1;overflow:auto;padding:0 20px}
.table-scroll::-webkit-scrollbar{width:6px;height:6px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:11px 16px;text-align:left;font-size:var(--font-size-sm);border-bottom:1px solid var(--border-light)}
th{background:var(--bg-table-header);font-weight:600;color:var(--text-secondary);position:sticky;top:0;z-index:5;white-space:nowrap}
tr:hover td{background:var(--bg-hover)}
td{color:var(--text-primary)}

/* 序号 */
.seq-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--bg-secondary);border-radius:var(--radius-sm);font-size:var(--font-size-xs);color:var(--text-secondary);font-weight:500}

/* 部门名称列 */
.dept-name-cell{display:flex;align-items:center;gap:8px}
.dept-name-cell .dept-icon{width:22px;height:22px;background:var(--warning-light);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dept-name-cell .dept-icon svg{width:12px;height:12px;color:var(--warning)}

/* 操作列 */
.action-btns{display:flex;gap:6px}
.action-btn{padding:3px 10px;border-radius:var(--radius-sm);font-size:var(--font-size-xs);cursor:pointer;border:none;transition:all var(--duration-fast);font-family:var(--font-family);font-weight:500}
.action-btn-edit{background:var(--primary-light);color:var(--primary)}
.action-btn-edit:hover{background:var(--primary);color:#fff;box-shadow:0 2px 4px rgba(22,119,255,0.25)}
.action-btn-del{background:var(--danger-light);color:var(--danger)}
.action-btn-del:hover{background:var(--danger);color:#fff;box-shadow:0 2px 4px rgba(255,77,79,0.25)}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-tertiary)}
.empty-state .empty-icon{width:64px;height:64px;background:var(--bg-secondary);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty-state .empty-icon svg{width:28px;height:28px;color:var(--text-placeholder)}
.empty-state .empty-text{font-size:var(--font-size-sm);color:var(--text-tertiary)}

/* 分页 - .pagination 由 framework.css 提供, JS 分页由 pagination.js 驱动 */

/* ========== 弹窗 ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-content{background:var(--bg-card);border-radius:var(--radius-xl);width:480px;max-width:90vw;max-height:90vh;overflow:auto;box-shadow:var(--shadow-elevated);animation:modalIn .2s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(-16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:var(--font-size-lg);font-weight:600;color:var(--text-primary)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-tertiary);font-size:18px;transition:all var(--duration-fast)}
.modal-close:hover{background:var(--bg-secondary);color:var(--text-primary)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px}

/* 表单 */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:var(--font-size-sm);color:var(--text-label);margin-bottom:6px;font-weight:500}
.form-label .required{color:var(--danger);margin-left:2px}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;transition:all var(--duration-fast);color:var(--text-primary);background:var(--bg-card);font-family:var(--font-family)}
.form-input:focus{border-color:var(--primary);box-shadow:var(--shadow-input-focus)}
.form-input:disabled{background:var(--bg-secondary);color:var(--text-disabled);cursor:not-allowed}
.form-input::placeholder{color:var(--text-placeholder)}
.form-hint{font-size:var(--font-size-xs);color:var(--text-tertiary);margin-top:4px}

/* ========== Toast ========== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);padding:10px 20px;border-radius:var(--radius-lg);font-size:var(--font-size-sm);z-index:2000;opacity:0;transition:all var(--duration-normal);box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-success{background:var(--success-light);color:var(--success);border:1px solid rgba(82,196,26,0.25)}
.toast-error{background:var(--danger-light);color:var(--danger);border:1px solid rgba(255,77,79,0.25)}

/* 拖拽占位 */
.drag-placeholder{height:36px;border:2px dashed var(--primary);border-radius:var(--radius-md);background:var(--primary-light);margin:2px 0}
.dragging{opacity:.5}

/* 删除弹窗图标 */
.del-icon{width:56px;height:56px;background:var(--danger-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.del-icon svg{width:28px;height:28px;color:var(--danger)}
</style>
</head>
<body>
<div class="page-container" data-module="enterprise/project-org">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item"><a href="#">企业端</a></span>
    <span class="sep">/</span>
    <span class="breadcrumb-item"><a href="#">项目信息管理</a></span>
    <span class="sep">/</span>
    <span class="breadcrumb-item current">项目组织架构</span>
  </div>

  <div class="main-layout">
    <!-- 左侧组织树 -->
    <div class="tree-panel">
      <div class="panel-header">
        <span class="header-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        项目组织架构
      </div>
      <div class="tree-search">
        <div class="tree-search-wrap">
          <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="text" id="treeSearchInput" placeholder="搜索项目节点..." oninput="onTreeSearch()">
        </div>
      </div>
      <div class="tree-body" id="orgTree"></div>
    </div>

    <!-- 右侧内容 -->
    <div class="right-panel">
      <div class="toolbar">
        <div class="toolbar-title">
          <span id="rightTitle">子节点列表</span>
          <span class="node-type-tag" id="rightTypeTag"></span>
        </div>
        <div class="toolbar-actions">
          <div class="search-box">
            <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="searchInput" placeholder="搜索部门..." oninput="onSearch()">
          </div>
          <button class="btn btn-primary btn-sm" id="btnAddCategory" onclick="openAddCategoryModal()" style="display:none">
            <span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>新增分类
          </button>
          <button class="btn btn-primary btn-sm" id="btnAddEnterprise" onclick="openAddEnterpriseModal()" style="display:none">
            <span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>新增企业
          </button>
          <button class="btn btn-primary btn-sm" id="btnAdd" onclick="openAddModal()">
            <span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>新增部门
          </button>
          <button class="btn btn-danger btn-sm" id="btnDeleteNode" onclick="openDelSelectedModal()" style="display:none">
            <span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>删除节点
          </button>
        </div>
      </div>
      <div class="path-bar" id="pathBar"><span class="path-label">当前位置：</span><span id="pathText" class="path-text"></span></div>
      <div id="nodeInfoCard" class="info-card"></div>
      <div class="table-scroll">
        <table id="dataTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none">
          <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></div>
          <div class="empty-text">暂无下属部门</div>
        </div>
      </div>
      <div class="pagination" id="paginationBar"></div>
    </div>
  </div>
</div>

<!-- 新增/编辑部门弹窗 -->
<div class="modal-overlay" id="deptModal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="deptModalTitle">新增部门</span>
      <span class="modal-close" onclick="closeDeptModal()">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">上级部门<span class="required">*</span></label>
        <select class="form-input" id="modalParentSelect">
          <option value="">请选择上级部门</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">部门名称<span class="required">*</span></label>
        <input type="text" class="form-input" id="modalDeptName" placeholder="请输入部门名称">
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <textarea class="form-input" id="modalRemark" rows="3" placeholder="请输入备注信息" style="resize:vertical;font-family:inherit;"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDeptModal()">取消</button>
      <button class="btn btn-primary" onclick="saveDept()">确定</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delModal" style="display:none">
  <div class="modal-content" style="width:380px">
    <div class="modal-header">
      <span class="modal-title">确认删除</span>
      <span class="modal-close" onclick="closeDelModal()">&times;</span>
    </div>
    <div class="modal-body" style="text-align:center;padding:28px 20px">
      <div class="del-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div>
      <div style="font-size:var(--font-size-md);color:var(--text-primary);font-weight:500">确定删除 <span id="delTargetName" style="color:var(--danger)"></span> 吗？</div>
      <div style="font-size:var(--font-size-xs);color:var(--text-tertiary);margin-top:8px">删除后不可恢复</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDelModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="../../js/pagination.js"></script>
<script>
// ===================== SVG 图标模板 =====================
var ICONS = {
  root: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
  category: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  enterprise: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V12h6v10M9 6h.01M15 6h.01M9 10h.01M15 10h.01"/></svg>',
  department: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
};

// ===================== 数据 =====================
var projectInfo = {
  name: 'XX大厦建设项目',
  parties: {
    "建设单位": { name: "XX建设集团", creditCode: "91110000123456789X", leader: "张三", phone: "13800138001" },
    "施工单位": { name: "XX建筑工程有限公司", creditCode: "91110000987654321Y", leader: "李四", phone: "13900139001" },
    "监理单位": { name: "XX监理咨询有限公司", creditCode: "91110000567890123Z", leader: "王五", phone: "13700137001" },
    "分包单位": { name: "XX装饰工程有限公司", creditCode: "91110000345678901A", leader: "赵六", phone: "13800138002" }
  }
};

function buildOrgTree() {
  var partyTypes = [
    { key: '建设单位', id: 'cat1', entId: 'ent1' },
    { key: '施工单位', id: 'cat2', entId: 'ent2' },
    { key: '监理单位', id: 'cat3', entId: 'ent3' },
    { key: '分包单位', id: 'cat4', entId: 'ent4' }
  ];
  var children = [];
  partyTypes.forEach(function(pt) {
    var party = projectInfo.parties[pt.key];
    var enterpriseNode = {
      id: pt.entId, name: party ? party.name : pt.key + '(未设置)', type: 'enterprise',
      creditCode: party ? party.creditCode : '', leader: party ? party.leader : '', phone: party ? party.phone : '',
      children: []
    };
    children.push({ id: pt.id, name: pt.key, type: 'category', expanded: true, children: [enterpriseNode] });
  });
  return { id: 'root', name: projectInfo.name, type: 'root', expanded: true, children: children };
}

var treeData = buildOrgTree();

// ===================== 状态 =====================
var selectedNodeId = 'root';
var selectedNode = treeData;
var modalMode = 'add';
var editingDeptId = null;
var deletingNodeId = null;
var pageSize = 10, currentPage = 1;
var searchKeyword = '';
var treeSearchKeyword = '';
var dragSrcId = null;

// ===================== 工具函数 =====================
function findNode(id, node) {
  node = node || treeData;
  if (node.id === id) return node;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = findNode(id, node.children[i]);
      if (found) return found;
    }
  }
  return null;
}

function getParentNode(targetId, node, parent) {
  node = node || treeData; parent = parent || null;
  if (node.id === targetId) return parent;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = getParentNode(targetId, node.children[i], node);
      if (found !== undefined) return found;
    }
  }
  return undefined;
}

function getNodePath(id) {
  var path = [];
  function walk(node, targetId) {
    path.push(node);
    if (node.id === targetId) return true;
    if (node.children) { for (var i = 0; i < node.children.length; i++) { if (walk(node.children[i], targetId)) return true; } }
    path.pop();
    return false;
  }
  walk(treeData, id);
  return path;
}

function showToast(msg, type) {
  type = type || 'success';
  var el = document.getElementById('toast');
  var icon = type === 'success'
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  el.innerHTML = icon + msg;
  el.className = 'toast toast-' + type;
  setTimeout(function() { el.classList.add('show'); }, 10);
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function getNextId(prefix) {
  var allIds = [];
  function collect(n) { allIds.push(n.id); if (n.children) n.children.forEach(collect); }
  collect(treeData);
  var maxNum = 0;
  for (var i = 0; i < allIds.length; i++) {
    if (allIds[i].indexOf(prefix) === 0) { var num = parseInt(allIds[i].replace(prefix, '')) || 0; if (num > maxNum) maxNum = num; }
  }
  return prefix + (maxNum + 1);
}

// ===================== 渲染树 =====================
function renderTree() {
  var container = document.getElementById('orgTree');
  container.innerHTML = renderNode(treeData, 0);
  attachTreeEvents();
}

function nodeMatchesSearch(node) {
  if (!treeSearchKeyword) return true;
  var kw = treeSearchKeyword.toLowerCase();
  if (node.name && node.name.toLowerCase().indexOf(kw) !== -1) return true;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      if (nodeMatchesSearch(node.children[i])) return true;
    }
  }
  return false;
}

function renderNode(node, depth) {
  if (treeSearchKeyword && !nodeMatchesSearch(node)) return '';
  var hasChildren = node.children && node.children.length > 0;
  var isSelected = node.id === selectedNodeId;
  var typeClass = 'node-' + node.type;
  var tagMap = { category: 'tag-category', enterprise: 'tag-enterprise', department: 'tag-department' };
  var tagClass = tagMap[node.type] || '';
  var tagText = { category: '分类', enterprise: '单位', department: '部门' }[node.type] || '';

  var html = '<div class="tree-node" data-id="' + node.id + '" data-type="' + node.type + '">';
  html += '<div class="tree-node-content ' + typeClass + (isSelected ? ' active' : '') + '" data-id="' + node.id + '">';

  if (hasChildren) {
    html += '<span class="toggle ' + (node.expanded ? 'expanded' : 'collapsed') + '" onclick="event.stopPropagation();toggleExpand(\'' + node.id + '\')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></span>';
  } else {
    html += '<span class="toggle" style="visibility:hidden"></span>';
  }

  html += '<span class="icon">' + (ICONS[node.type] || '') + '</span>';
  html += '<span class="node-label" title="' + node.name + '">' + highlightText(node.name, treeSearchKeyword) + '</span>';

  if (tagClass) {
    html += '<span class="node-tag ' + tagClass + '">' + tagText + '</span>';
  }

  if (node.type === 'department') {
    html += '<span class="drag-handle" draggable="true" data-id="' + node.id + '"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="2"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/><circle cx="15" cy="18" r="2"/></svg></span>';
  }

  html += '</div>';

  if (hasChildren && node.expanded) {
    html += '<div class="tree-children">';
    for (var i = 0; i < node.children.length; i++) {
      html += renderNode(node.children[i], depth + 1);
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function highlightText(text, keyword) {
  if (!keyword) return text;
  var idx = text.toLowerCase().indexOf(keyword.toLowerCase());
  if (idx === -1) return text;
  return text.substring(0, idx) + '<mark style="background:var(--warning-light);padding:0 1px;border-radius:2px">' + text.substring(idx, idx + keyword.length) + '</mark>' + text.substring(idx + keyword.length);
}

function onTreeSearch() {
  treeSearchKeyword = document.getElementById('treeSearchInput').value;
  renderTree();
}

function attachTreeEvents() {
  var contents = document.querySelectorAll('.tree-node-content');
  for (var i = 0; i < contents.length; i++) {
    contents[i].addEventListener('click', function() { selectNode(this.dataset.id); });
  }

  var handles = document.querySelectorAll('.drag-handle');
  for (var i = 0; i < handles.length; i++) {
    handles[i].addEventListener('dragstart', function(e) {
      dragSrcId = this.dataset.id;
      this.closest('.tree-node-content').classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    handles[i].addEventListener('dragend', function() {
      var dragging = document.querySelectorAll('.dragging');
      for (var j = 0; j < dragging.length; j++) dragging[j].classList.remove('dragging');
      var placeholders = document.querySelectorAll('.drag-placeholder');
      for (var j = 0; j < placeholders.length; j++) placeholders[j].remove();
      dragSrcId = null;
    });
  }

  var childContainers = document.querySelectorAll('.tree-children');
  for (var i = 0; i < childContainers.length; i++) {
    childContainers[i].addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragSrcId) return;
      var srcNode = findNode(dragSrcId);
      if (!srcNode || srcNode.type !== 'department') return;
      var afterEl = getDragAfterElement(this, e.clientY);
      var placeholder = document.querySelector('.drag-placeholder');
      if (!placeholder) { placeholder = document.createElement('div'); placeholder.className = 'drag-placeholder'; }
      if (afterEl) this.insertBefore(placeholder, afterEl); else this.appendChild(placeholder);
    });

    childContainers[i].addEventListener('drop', function(e) {
      e.preventDefault();
      if (!dragSrcId) return;
      var srcNode = findNode(dragSrcId);
      if (!srcNode || srcNode.type !== 'department') return;
      var parentNode = getParentNode(dragSrcId);
      if (!parentNode || parentNode.type !== 'enterprise') return;
      var placeholder = document.querySelector('.drag-placeholder');
      if (placeholder) placeholder.remove();
      var siblings = parentNode.children;
      var srcIndex = -1;
      for (var j = 0; j < siblings.length; j++) { if (siblings[j].id === dragSrcId) { srcIndex = j; break; } }
      if (srcIndex === -1) return;
      var moved = siblings.splice(srcIndex, 1)[0];
      var targetIndex = siblings.length;
      var afterEl = getDragAfterElement(this, e.clientY);
      if (afterEl) { var afterId = afterEl.closest('.tree-node').dataset.id; for (var j = 0; j < siblings.length; j++) { if (siblings[j].id === afterId) { targetIndex = j; break; } } if (targetIndex === -1) targetIndex = siblings.length; }
      siblings.splice(targetIndex, 0, moved);
      renderTree(); renderRightPanel(); showToast('排序已更新');
    });
  }
}

function getDragAfterElement(container, y) {
  var draggableElements = Array.prototype.slice.call(container.querySelectorAll('.tree-node-content:not(.dragging)'));
  var closest = null, closestOffset = Number.NEGATIVE_INFINITY;
  for (var i = 0; i < draggableElements.length; i++) {
    var box = draggableElements[i].getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = draggableElements[i]; }
  }
  return closest;
}

function toggleExpand(id) { var node = findNode(id); if (node) { node.expanded = !node.expanded; renderTree(); } }
function selectNode(id) { selectedNodeId = id; selectedNode = findNode(id); currentPage = 1; if (typeof pg !== 'undefined' && pg) pg.setPage(1); renderTree(); renderRightPanel(); }

// ===================== 渲染右侧列表 =====================
function renderRightPanel() {
  var titleEl = document.getElementById('rightTitle');
  var tagEl = document.getElementById('rightTypeTag');
  var pathText = document.getElementById('pathText');

  var path = getNodePath(selectedNodeId);
  var pathNames = [];
  for (var i = 0; i < path.length; i++) pathNames.push(path[i].name);
  // 渲染路径带分隔符
  var pathHtml = '';
  for (var i = 0; i < pathNames.length; i++) {
    if (i > 0) pathHtml += '<span class="path-sep">/</span>';
    pathHtml += pathNames[i];
  }
  pathText.innerHTML = pathHtml;

  var typeLabels = { root: '项目', category: '分类', enterprise: '单位', department: '部门' };
  var typeColors = { root: 'var(--primary)', category: 'var(--accent)', enterprise: 'var(--success)', department: 'var(--warning)' };
  titleEl.textContent = selectedNode.name;
  tagEl.textContent = typeLabels[selectedNode.type] || '';
  var tc = typeColors[selectedNode.type] || 'var(--text-tertiary)';
  tagEl.style.cssText = 'background:color-mix(in srgb,' + tc + ' 10%,transparent);color:' + tc + ';border:1px solid color-mix(in srgb,' + tc + '25%,transparent)';

  var btnAddCategory = document.getElementById('btnAddCategory');
  var btnAddEnterprise = document.getElementById('btnAddEnterprise');
  var btnDeleteNode = document.getElementById('btnDeleteNode');
  var btnAdd = document.getElementById('btnAdd');
  btnAddCategory.style.display = (selectedNode.type === 'root') ? 'inline-flex' : 'none';
  btnAddEnterprise.style.display = (selectedNode.type === 'category') ? 'inline-flex' : 'none';
  btnAdd.style.display = (selectedNode.type === 'enterprise' || selectedNode.type === 'department') ? 'inline-flex' : 'none';
  btnDeleteNode.style.display = (selectedNode.type === 'category' || selectedNode.type === 'enterprise' || selectedNode.type === 'department') ? 'inline-flex' : 'none';

  // 渲染节点信息卡片
  var infoCard = document.getElementById('nodeInfoCard');
  infoCard.innerHTML = renderNodeInfoCard(selectedNode);

  // 根据节点类型动态决定表头和数据
  var childType = getChildType(selectedNode.type);
  var headers = getTableHeaders(childType);
  var headRow = document.getElementById('tableHead');
  var headHtml = '';
  for (var i = 0; i < headers.length; i++) headHtml += '<th' + (i === headers.length - 1 ? ' class="action-col"' : '') + '>' + headers[i] + '</th>';
  headRow.innerHTML = headHtml;

  // 取直接子节点
  var children = (selectedNode.children || []).slice();
  var data = [];
  for (var i = 0; i < children.length; i++) {
    var n = children[i];
    if (!searchKeyword) { data.push(n); }
    else if (n.name && n.name.toLowerCase().indexOf(searchKeyword.toLowerCase()) !== -1) { data.push(n); }
  }

  var total = data.length;
  var totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  var start = (currentPage - 1) * pageSize;
  var pageData = data.slice(start, start + pageSize);

  var tbody = document.getElementById('tableBody');
  var emptyState = document.getElementById('emptyState');

  var emptyLabels = { category: '暂无分类', enterprise: '暂无下级单位', department: '暂无下级部门' };
  if (pageData.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.querySelector('.empty-text').textContent = emptyLabels[childType] || '暂无数据';
  } else {
    emptyState.style.display = 'none';
    var bodyHtml = '';
    for (var i = 0; i < pageData.length; i++) { bodyHtml += renderRowByType(pageData[i], start + i + 1, childType); }
    tbody.innerHTML = bodyHtml;
  }

  if (typeof pg !== 'undefined' && pg) pg.setTotal(total);
}

function renderNodeInfoCard(node) {
  var type = node.type;
  var rows = [];

  if (type === 'root') {
    rows = [['节点类型', '项目根节点'], ['项目名称', node.name], ['下级分类数', (node.children ? node.children.length : 0) + ' 个']];
  } else if (type === 'category') {
    rows = [['节点类型', '分类节点'], ['分类名称', node.name], ['下级单位数', (node.children ? node.children.length : 0) + ' 家']];
  } else if (type === 'enterprise') {
    rows = [['节点类型', '单位节点'], ['单位名称', node.name], ['统一信用代码', node.creditCode || '-'], ['负责人', node.leader || '-'], ['联系电话', node.phone || '-'], ['下级部门数', (node.children ? node.children.length : 0) + ' 个']];
  } else if (type === 'department') {
    var parentNode = getParentNode(node.id);
    rows = [['节点类型', '部门节点'], ['部门名称', node.name], ['上级部门', parentNode ? parentNode.name : '-'], ['人数', (node.personCount || 0) + ' 人'], ['备注', node.remark || '-']];
  }

  var html = '<div class="info-card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>当前节点信息</div>';
  html += '<div class="info-card-grid">';
  for (var i = 0; i < rows.length; i++) {
    html += '<div class="info-card-field"><span class="field-label">' + rows[i][0] + '</span><span class="field-value">' + rows[i][1] + '</span></div>';
  }
  html += '</div>';
  return html;
}

function getChildType(parentType) {
  var map = { root: 'category', category: 'enterprise', enterprise: 'department', department: 'department' };
  return map[parentType] || 'department';
}

function getTableHeaders(childType) {
  if (childType === 'category') return ['序号', '分类名称', '下级单位数', '操作'];
  if (childType === 'enterprise') return ['序号', '单位名称', '统一信用代码', '负责人', '联系电话', '下级部门数', '操作'];
  return ['序号', '部门名称', '上级部门', '人数', '备注', '操作'];
}

function renderRowByType(item, seq, childType) {
  if (childType === 'category') return renderCategoryRow(item, seq);
  if (childType === 'enterprise') return renderEnterpriseRow(item, seq);
  return renderDeptRow(item, seq);
}

function renderCategoryRow(item, seq) {
  var childCount = (item.children ? item.children.length : 0);
  return '<tr>' +
    '<td><span class="seq-num">' + seq + '</span></td>' +
    '<td><div class="dept-name-cell"><span class="dept-icon" style="background:var(--accent-light);border-radius:var(--radius-sm)">' + ICONS.category + '</span>' + item.name + '</div></td>' +
    '<td>' + childCount + ' 家</td>' +
    '<td class="action-col"><div class="action-btns">' +
    '<button class="action-btn action-btn-edit" onclick="editCategoryName(\'' + item.id + '\')">编辑</button>' +
    '<button class="action-btn action-btn-del" onclick="openDelModal(\'' + item.id + '\')">删除</button>' +
    '</div></td>' +
    '</tr>';
}

function renderEnterpriseRow(item, seq) {
  var childCount = (item.children ? item.children.length : 0);
  return '<tr>' +
    '<td><span class="seq-num">' + seq + '</span></td>' +
    '<td><div class="dept-name-cell"><span class="dept-icon" style="background:var(--success-light);border-radius:var(--radius-sm)">' + ICONS.enterprise + '</span>' + item.name + '</div></td>' +
    '<td style="font-family:var(--font-family-code);font-size:12px;color:var(--text-secondary)">' + (item.creditCode || '-') + '</td>' +
    '<td>' + (item.leader || '-') + '</td>' +
    '<td>' + (item.phone || '-') + '</td>' +
    '<td>' + childCount + ' 个</td>' +
    '<td class="action-col"><div class="action-btns">' +
    '<button class="action-btn action-btn-edit" onclick="editEnterpriseInfo(\'' + item.id + '\')">编辑</button>' +
    '<button class="action-btn action-btn-del" onclick="openDelModal(\'' + item.id + '\')">删除</button>' +
    '</div></td>' +
    '</tr>';
}

function renderDeptRow(item, seq) {
  var parentNode = getParentNode(item.id);
  return '<tr>' +
    '<td><span class="seq-num">' + seq + '</span></td>' +
    '<td><div class="dept-name-cell"><span class="dept-icon">' + ICONS.department + '</span>' + item.name + '</div></td>' +
    '<td>' + (parentNode ? parentNode.name : '-') + '</td>' +
    '<td>' + (item.personCount || 0) + ' 人</td>' +
    '<td>' + (item.remark || '-') + '</td>' +
    '<td class="action-col"><div class="action-btns">' +
    '<button class="action-btn action-btn-edit" onclick="openEditModal(\'' + item.id + '\')">编辑</button>' +
    '<button class="action-btn action-btn-del" onclick="openDelModal(\'' + item.id + '\')">删除</button>' +
    '</div></td>' +
    '</tr>';
}

function editCategoryName(id) {
  var node = findNode(id);
  if (!node || node.type !== 'category') return;
  var newName = prompt('请输入分类名称：', node.name);
  if (!newName || !newName.trim()) return;
  node.name = newName.trim();
  renderTree(); renderRightPanel(); showToast('分类名称已更新');
}

function editEnterpriseInfo(id) {
  var node = findNode(id);
  if (!node || node.type !== 'enterprise') return;
  var newName = prompt('请输入单位名称：', node.name);
  if (!newName || !newName.trim()) return;
  node.name = newName.trim();
  renderTree(); renderRightPanel(); showToast('单位信息已更新');
}

function onSearch() {
  searchKeyword = document.getElementById('searchInput').value;
  currentPage = 1;
  if (typeof pg !== 'undefined' && pg) pg.setPage(1);
  renderRightPanel();
}

// ===================== 弹窗操作 =====================
function openAddModal() {
  if (selectedNode.type !== 'enterprise' && selectedNode.type !== 'department') return;
  modalMode = 'add'; editingDeptId = null;
  document.getElementById('deptModalTitle').textContent = '新增部门';
  renderParentSelect(selectedNode.id);
  document.getElementById('modalDeptName').value = '';
  document.getElementById('modalRemark').value = '';
  document.getElementById('deptModal').style.display = 'flex';
}

function openEditModal(id) {
  var node = findNode(id);
  if (!node || node.type !== 'department') return;
  modalMode = 'edit'; editingDeptId = id;
  var parent = getParentNode(id);
  renderParentSelect(parent ? parent.id : '', id);
  document.getElementById('deptModalTitle').textContent = '编辑部门';
  document.getElementById('modalDeptName').value = node.name;
  document.getElementById('modalRemark').value = node.remark || '';
  document.getElementById('deptModal').style.display = 'flex';
}

function closeDeptModal() { document.getElementById('deptModal').style.display = 'none'; }

function renderParentSelect(defaultId, excludeId) {
  var select = document.getElementById('modalParentSelect');
  var options = '<option value="">请选择上级部门</option>';
  function walk(node, depth) {
    if (node.id === excludeId) return;
    if (node.type === 'enterprise' || node.type === 'department') {
      var indent = '';
      for (var i = 0; i < depth; i++) indent += '&nbsp;&nbsp;';
      var prefix = node.type === 'enterprise' ? '&#9632; ' : '&#9632; ';
      var selected = node.id === defaultId ? ' selected' : '';
      options += '<option value="' + node.id + '"' + selected + '>' + indent + prefix + node.name + '</option>';
    }
    if (node.children) { for (var i = 0; i < node.children.length; i++) { walk(node.children[i], depth + 1); } }
  }
  walk(treeData, 0);
  select.innerHTML = options;
}

function saveDept() {
  var name = document.getElementById('modalDeptName').value.trim();
  if (!name) { showToast('请输入部门名称', 'error'); return; }
  var parentId = document.getElementById('modalParentSelect').value;
  if (!parentId) { showToast('请选择上级部门', 'error'); return; }
  var parentNode = findNode(parentId);
  if (!parentNode) { showToast('上级部门不存在', 'error'); return; }
  var remark = document.getElementById('modalRemark').value.trim();

  if (modalMode === 'add') {
    if (!parentNode.children) parentNode.children = [];
    parentNode.children.push({ id: getNextId('dept'), name: name, type: 'department', personCount: 0, remark: remark });
    showToast('部门「' + name + '」新增成功');
  } else {
    var node = findNode(editingDeptId);
    if (node) {
      node.name = name; node.remark = remark;
      var oldParent = getParentNode(editingDeptId);
      if (oldParent && oldParent.id !== parentId) {
        var idx = -1;
        for (var i = 0; i < oldParent.children.length; i++) { if (oldParent.children[i].id === editingDeptId) { idx = i; break; } }
        if (idx > -1) oldParent.children.splice(idx, 1);
        if (!parentNode.children) parentNode.children = [];
        parentNode.children.push(node);
      }
      showToast('部门信息已更新');
    }
  }
  closeDeptModal(); renderTree(); renderRightPanel();
}

function openDelModal(id) {
  var node = findNode(id);
  if (!node) return;
  if (node.type === 'root') { showToast('项目根节点不可删除', 'error'); return; }
  // 四方责任体预设企业节点不可删除
  if (node.type === 'enterprise' && ['ent1','ent2','ent3','ent4'].indexOf(node.id) !== -1) {
    showToast('四方责任体企业节点不可删除', 'error'); return;
  }
  deletingNodeId = id;
  document.getElementById('delTargetName').textContent = node.name;
  document.getElementById('delModal').style.display = 'flex';
}

function closeDelModal() { document.getElementById('delModal').style.display = 'none'; deletingNodeId = null; }

function confirmDelete() {
  if (!deletingNodeId) return;
  var node = findNode(deletingNodeId);
  var parent = getParentNode(deletingNodeId);
  if (parent && parent.children) {
    var idx = -1;
    for (var i = 0; i < parent.children.length; i++) { if (parent.children[i].id === deletingNodeId) { idx = i; break; } }
    if (idx > -1) {
      var name = parent.children[idx].name;
      var typeLabel = { category: '分类', enterprise: '企业', department: '部门' }[node.type] || '节点';
      parent.children.splice(idx, 1);
      showToast(typeLabel + '「' + name + '」已删除');
    }
  }
  // 如果删除的是当前选中节点，切换到父节点
  if (deletingNodeId === selectedNodeId && parent) {
    selectedNodeId = parent.id;
    selectedNode = parent;
  }
  closeDelModal(); renderTree(); renderRightPanel();
}

function openAddCategoryModal() {
  var name = prompt('请输入分类名称：');
  if (!name || !name.trim()) return;
  name = name.trim();
  if (!treeData.children) treeData.children = [];
  treeData.children.push({ id: getNextId('cat'), name: name, type: 'category', expanded: true, children: [] });
  renderTree(); renderRightPanel(); showToast('分类「' + name + '」新增成功');
}

function openAddEnterpriseModal() {
  if (selectedNode.type !== 'category') return;
  var name = prompt('请输入企业名称：');
  if (!name || !name.trim()) return;
  name = name.trim();
  if (!selectedNode.children) selectedNode.children = [];
  selectedNode.children.push({ id: getNextId('ent'), name: name, type: 'enterprise', creditCode: '', leader: '', phone: '', children: [] });
  renderTree(); renderRightPanel(); showToast('企业「' + name + '」新增成功');
}

function openDelSelectedModal() {
  if (!selectedNode) return;
  if (selectedNode.type === 'root') { showToast('项目根节点不可删除', 'error'); return; }
  deletingNodeId = selectedNode.id;
  document.getElementById('delTargetName').textContent = selectedNode.name;
  document.getElementById('delModal').style.display = 'flex';
}

// ===================== 初始化 =====================
var pg = new Pagination('paginationBar', {
  total: 0,
  size: pageSize,
  onChange: function(page, size) {
    currentPage = page;
    pageSize = size;
    renderRightPanel();
  }
});

renderTree();
renderRightPanel();
