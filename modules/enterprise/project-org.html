<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目组织架构 - 企业端</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-container{padding:20px;min-height:100vh}
.breadcrumb a{color:#666;text-decoration:none}
.breadcrumb a:hover{color:#1890ff}
.breadcrumb .sep{margin:0 6px;color:#999}

/* 主布局 */
.main-layout{display:flex;gap:16px;height:calc(100vh - 80px)}

/* 左侧树 */
.left-panel{width:320px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
.panel-header{padding:14px 16px;border-bottom:1px solid #f0f0f0;font-size:15px;font-weight:600;color:#1f2937;display:flex;align-items:center;gap:8px}
.panel-header .icon{font-size:18px}
.tree-body{flex:1;overflow-y:auto;padding:12px 8px}

/* 树节点 */
.tree-node{position:relative}
.tree-node-content{display:flex;align-items:center;padding:8px 8px 8px 12px;cursor:pointer;border-radius:6px;transition:all .15s;gap:6px}
.tree-node-content:hover{background:#f5f7fa}
.tree-node-content.active{background:#e6f7ff;color:#1890ff}
.tree-node-content .toggle{width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:10px;flex-shrink:0}
.tree-node-content .toggle:hover{color:#1890ff}
.tree-node-content .icon{font-size:16px;flex-shrink:0}
.tree-node-content .node-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tree-node-content .node-tag{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;flex-shrink:0}
.tree-node-content .drag-handle{width:14px;height:14px;display:none;cursor:grab;color:#ccc;margin-left:4px}
.tree-node-content:hover .drag-handle{display:block}
.tree-node-content .drag-handle:active{cursor:grabbing}

/* 节点类型颜色 */
.node-root .icon{color:#1890ff}
.node-category .icon{color:#722ed1}
.node-enterprise .icon{color:#52c41a}
.node-department .icon{color:#fa8c16}

.tag-category{background:#f9f0ff;color:#722ed1;border:1px solid #d3adf7}
.tag-enterprise{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.tag-department{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}

/* 子节点缩进 */
.tree-node{display:block!important}
.tree-children{padding-left:20px;display:block!important}

/* 右侧内容 */
.right-panel{flex:1;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}

/* 工具栏 */
.toolbar{padding:12px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar-title{font-size:15px;font-weight:600;color:#1f2937;display:flex;align-items:center;gap:8px}
.toolbar-title .node-type-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:400}
.toolbar-actions{display:flex;gap:8px;align-items:center}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:6px;border:1px solid #d9d9d9;background:#fff;color:#333;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#1890ff;color:#1890ff}
.btn-primary{background:#1890ff;border-color:#1890ff;color:#fff}
.btn-primary:hover{background:#40a9ff;border-color:#40a9ff;color:#fff}
.btn-danger{background:#ff4d4f;border-color:#ff4d4f;color:#fff}
.btn-danger:hover{background:#ff7875;border-color:#ff7875}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 搜索 */
.search-box{position:relative}
.search-box input{padding:6px 10px 6px 30px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:200px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:#1890ff}
.search-box .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#999;font-size:13px}

/* 表格 */
.table-scroll{flex:1;overflow:auto;padding:0 16px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:12px 16px;text-align:left;font-size:13px;border-bottom:1px solid #f0f0f0}
th{background:#fafafa;font-weight:600;color:#666;position:sticky;top:0;z-index:5}
tr:hover{background:#f5f7fa}
td{color:#333}

/* 操作列 */
.action-btns{display:flex;gap:6px}
.action-btn{padding:3px 10px;border-radius:4px;font-size:12px;cursor:pointer;border:none;transition:all .15s}
.action-btn-edit{background:#e6f7ff;color:#1890ff}
.action-btn-edit:hover{background:#1890ff;color:#fff}
.action-btn-del{background:#fff1f0;color:#ff4d4f}
.action-btn-del:hover{background:#ff4d4f;color:#fff}
.action-btn-view{background:#f6ffed;color:#52c41a}
.action-btn-view:hover{background:#52c41a;color:#fff}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:#999}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state .empty-text{font-size:14px}

/* 序号 */
.seq-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#f0f2f5;border-radius:4px;font-size:12px;color:#666;font-weight:500}

/* 分页 */
.pagination{display:flex;justify-content:flex-end;align-items:center;padding:12px 16px;gap:8px;border-top:1px solid #f0f0f0}
.pagination-btn{padding:5px 12px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;font-size:12px}
.pagination-btn:hover{border-color:#1890ff;color:#1890ff}
.pagination-btn:disabled{opacity:.5;cursor:not-allowed}
.pagination-info{font-size:12px;color:#666}
.page-size-select{padding:5px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;outline:none}

/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-content{background:#fff;border-radius:8px;width:480px;max-width:90vw;max-height:90vh;overflow:auto;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600;color:#1f2937}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:#999;font-size:18px}
.modal-close:hover{background:#f5f5f5;color:#333}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:10px}

/* 表单 */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;color:#333;margin-bottom:6px;font-weight:500}
.form-label .required{color:#ff4d4f;margin-left:2px}
.form-input{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:#1890ff}
.form-input:disabled{background:#f5f5f5;color:#999;cursor:not-allowed}
.form-hint{font-size:12px;color:#999;margin-top:4px}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);padding:10px 20px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-success{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.toast-error{background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e}

/* 拖拽占位 */
.drag-placeholder{height:36px;border:2px dashed #1890ff;border-radius:6px;background:#e6f7ff;margin:2px 0}
.dragging{opacity:.6}

/* 面包屑路径 */
.path-bar{padding:10px 16px;background:#f6ffed;border-bottom:1px solid #f0f0f0;font-size:12px;color:#52c41a;display:flex;align-items:center;gap:6px}
.path-bar .path-label{color:#666}
</style>
</head>
<body>
<div class="page-container" data-module="enterprise/project-org">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">企业端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item">项目信息管理</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">项目组织架构</span>
  </div>

  <div class="main-layout">
    <!-- 左侧组织树 -->
    <div class="left-panel">
      <div class="panel-header"><span class="icon">🏗️</span>项目列表</div>
      <div class="tree-body" id="orgTree"></div>
    </div>

    <!-- 右侧内容 -->
    <div class="right-panel">
      <div class="toolbar">
        <div class="toolbar-title">
          <span id="rightTitle">子节点列表</span>
          <span class="node-type-tag" id="rightTypeTag"></span>
        </div>
        <div class="toolbar-actions">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索..." oninput="onSearch()">
          </div>
          <button class="btn btn-primary btn-sm" id="btnAddCategory" onclick="openAddCategoryModal()" style="display:none">
            <span>+</span> 新增分类
          </button>
          <button class="btn btn-primary btn-sm" id="btnAddEnterprise" onclick="openAddEnterpriseModal()" style="display:none">
            <span>+</span> 新增企业
          </button>
          <button class="btn btn-primary btn-sm" id="btnAdd" onclick="openAddModal()">
            <span>+</span> 新增部门
          </button>
          <button class="btn btn-danger btn-sm" id="btnDeleteNode" onclick="openDelSelectedModal()" style="display:none">
            删除节点
          </button>
        </div>
      </div>
      <div class="path-bar" id="pathBar"><span class="path-label">当前位置：</span><span id="pathText"></span></div>
      <div class="table-scroll">
        <table id="dataTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none">
          <div class="empty-icon">📭</div>
          <div class="empty-text">暂无数据</div>
        </div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- 新增/编辑部门弹窗 -->
<div class="modal-overlay" id="deptModal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="deptModalTitle">新增部门</span>
      <span class="modal-close" onclick="closeDeptModal()">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">上级部门<span class="required">*</span></label>
        <select class="form-input" id="modalParentSelect">
          <option value="">请选择上级部门</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">部门名称<span class="required">*</span></label>
        <input type="text" class="form-input" id="modalDeptName" placeholder="请输入部门名称">
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <textarea class="form-input" id="modalRemark" rows="3" placeholder="请输入备注信息" style="resize:vertical;font-family:inherit;"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDeptModal()">取消</button>
      <button class="btn btn-primary" onclick="saveDept()">确定</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delModal" style="display:none">
  <div class="modal-content" style="width:360px">
    <div class="modal-header">
      <span class="modal-title">确认删除</span>
      <span class="modal-close" onclick="closeDelModal()">&times;</span>
    </div>
    <div class="modal-body" style="text-align:center;padding:24px 20px">
      <div style="font-size:40px;margin-bottom:12px">⚠️</div>
      <div style="font-size:14px;color:#333">确定删除部门 <strong id="delTargetName"></strong> 吗？</div>
      <div style="font-size:12px;color:#999;margin-top:8px">删除后不可恢复</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDelModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===================== 数据 =====================
// 从项目基本信息读取四方责任体数据
const projectInfo = {
  name: 'XX大厦建设项目',
  parties: {
  "建设单位": {
    "name": "XX建设集团",
    "creditCode": "91110000123456789X",
    "leader": "张三",
    "phone": "13800138001"
  },
  "施工单位": {
    "name": "XX建筑工程有限公司",
    "creditCode": "91110000987654321Y",
    "leader": "李四",
    "phone": "13900139001"
  },
  "监理单位": {
    "name": "XX监理咨询有限公司",
    "creditCode": "91110000567890123Z",
    "leader": "王五",
    "phone": "13700137001"
  },
  "分包单位": {
    "name": "XX装饰工程有限公司",
    "creditCode": "91110000345678901A",
    "leader": "赵六",
    "phone": "13800138002"
  }
}
};

function buildOrgTree() {
  const partyTypes = [
    { key: '建设单位', id: 'cat1', entId: 'ent1' },
    { key: '施工单位', id: 'cat2', entId: 'ent2' },
    { key: '监理单位', id: 'cat3', entId: 'ent3' },
    { key: '分包单位', id: 'cat4', entId: 'ent4' }
  ];

  const children = [];
  partyTypes.forEach((pt, idx) => {
    const party = projectInfo.parties[pt.key];
    const enterpriseNode = {
      id: pt.entId,
      name: party ? party.name : pt.key + '(未设置)',
      type: 'enterprise',
      creditCode: party ? party.creditCode : '',
      leader: party ? party.leader : '',
      phone: party ? party.phone : '',
      children: []
    };

    children.push({
      id: pt.id,
      name: pt.key,
      type: 'category',
      expanded: true,
      children: [enterpriseNode]
    });
  });

  return {
    id: 'root',
    name: projectInfo.name,
    type: 'root',
    expanded: true,
    children: children
  };
}

const treeData = buildOrgTree();
// ===================== 状态 =====================
let selectedNodeId = 'root';
let selectedNode = treeData;
let modalMode = 'add';
let editingDeptId = null;
let deletingNodeId = null;
let pageSize = 10, currentPage = 1;
let searchKeyword = '';
let dragSrcId = null;

// ===================== 工具函数 =====================
function findNode(id, node) {
  node = node || treeData;
  if (node.id === id) return node;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = findNode(id, node.children[i]);
      if (found) return found;
    }
  }
  return null;
}

function getParentNode(targetId, node, parent) {
  node = node || treeData;
  parent = parent || null;
  if (node.id === targetId) return parent;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = getParentNode(targetId, node.children[i], node);
      if (found !== undefined) return found;
    }
  }
  return undefined;
}

function getNodePath(id) {
  var path = [];
  function walk(node, targetId) {
    path.push(node);
    if (node.id === targetId) return true;
    if (node.children) {
      for (var i = 0; i < node.children.length; i++) {
        if (walk(node.children[i], targetId)) return true;
      }
    }
    path.pop();
    return false;
  }
  walk(treeData, id);
  return path;
}

function showToast(msg, type) {
  type = type || 'success';
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type;
  setTimeout(function() { el.classList.add('show'); }, 10);
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function getNextId(prefix) {
  var allIds = [];
  function collect(n) { allIds.push(n.id); if (n.children) n.children.forEach(collect); }
  collect(treeData);
  var maxNum = 0;
  for (var i = 0; i < allIds.length; i++) {
    if (allIds[i].indexOf(prefix) === 0) {
      var num = parseInt(allIds[i].replace(prefix, '')) || 0;
      if (num > maxNum) maxNum = num;
    }
  }
  return prefix + (maxNum + 1);
}

// ===================== 渲染树 =====================
function renderTree() {
  var container = document.getElementById('orgTree');
  container.innerHTML = renderNode(treeData, 0);
  attachTreeEvents();
}

function renderNode(node, depth) {
  var hasChildren = node.children && node.children.length > 0;
  var isSelected = node.id === selectedNodeId;
  var iconMap = { root: '🏗️', category: '📁', enterprise: '🏢', department: '👥' };
  var typeClass = 'node-' + node.type;
  var tagMap = { category: 'tag-category', enterprise: 'tag-enterprise', department: 'tag-department' };
  var tagClass = tagMap[node.type] || '';
  var tagText = { category: '分类', enterprise: '单位', department: '部门' }[node.type] || '';

  var html = '<div class="tree-node" data-id="' + node.id + '" data-type="' + node.type + '">';
  html += '<div class="tree-node-content ' + typeClass + (isSelected ? ' active' : '') + '" data-id="' + node.id + '">';

  if (hasChildren) {
    html += '<span class="toggle" onclick="event.stopPropagation();toggleExpand(&#39;' + node.id + '&#39;)">'  + (node.expanded ? '▼' : '▶') + '</span>';
  } else {
    html += '<span class="toggle" style="visibility:hidden">▶</span>';
  }

  html += '<span class="icon">' + (iconMap[node.type] || '') + '</span>';
  html += '<span class="node-label" title="' + node.name + '">' + node.name + '</span>';

  if (tagClass) {
    html += '<span class="node-tag ' + tagClass + '">' + tagText + '</span>';
  }

  if (node.type === 'department') {
    html += '<span class="drag-handle" draggable="true" data-id="' + node.id + '">⋮⋮</span>';
  }

  html += '</div>';

  if (hasChildren && node.expanded) {
    html += '<div class="tree-children">';
    for (var i = 0; i < node.children.length; i++) {
      html += renderNode(node.children[i], depth + 1);
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function attachTreeEvents() {
  var contents = document.querySelectorAll('.tree-node-content');
  for (var i = 0; i < contents.length; i++) {
    contents[i].addEventListener('click', function() {
      selectNode(this.dataset.id);
    });
  }

  var handles = document.querySelectorAll('.drag-handle');
  for (var i = 0; i < handles.length; i++) {
    handles[i].addEventListener('dragstart', function(e) {
      dragSrcId = this.dataset.id;
      this.closest('.tree-node-content').classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    handles[i].addEventListener('dragend', function() {
      var dragging = document.querySelectorAll('.dragging');
      for (var j = 0; j < dragging.length; j++) dragging[j].classList.remove('dragging');
      var placeholders = document.querySelectorAll('.drag-placeholder');
      for (var j = 0; j < placeholders.length; j++) placeholders[j].remove();
      dragSrcId = null;
    });
  }

  var childContainers = document.querySelectorAll('.tree-children');
  for (var i = 0; i < childContainers.length; i++) {
    childContainers[i].addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragSrcId) return;
      var srcNode = findNode(dragSrcId);
      if (!srcNode || srcNode.type !== 'department') return;

      var afterEl = getDragAfterElement(this, e.clientY);
      var placeholder = document.querySelector('.drag-placeholder');
      if (!placeholder) {
        placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
      }
      if (afterEl) this.insertBefore(placeholder, afterEl);
      else this.appendChild(placeholder);
    });

    childContainers[i].addEventListener('drop', function(e) {
      e.preventDefault();
      if (!dragSrcId) return;
      var srcNode = findNode(dragSrcId);
      if (!srcNode || srcNode.type !== 'department') return;

      var parentNode = getParentNode(dragSrcId);
      if (!parentNode || parentNode.type !== 'enterprise') return;

      var placeholder = document.querySelector('.drag-placeholder');
      if (placeholder) placeholder.remove();

      var siblings = parentNode.children;
      var srcIndex = -1;
      for (var j = 0; j < siblings.length; j++) {
        if (siblings[j].id === dragSrcId) { srcIndex = j; break; }
      }
      if (srcIndex === -1) return;

      var moved = siblings.splice(srcIndex, 1)[0];
      var targetIndex = siblings.length;
      var afterEl = getDragAfterElement(this, e.clientY);
      if (afterEl) {
        var afterId = afterEl.closest('.tree-node').dataset.id;
        for (var j = 0; j < siblings.length; j++) {
          if (siblings[j].id === afterId) { targetIndex = j; break; }
        }
        if (targetIndex === -1) targetIndex = siblings.length;
      }
      siblings.splice(targetIndex, 0, moved);

      renderTree();
      renderRightPanel();
      showToast('排序已更新');
    });
  }
}

function getDragAfterElement(container, y) {
  var draggableElements = Array.prototype.slice.call(container.querySelectorAll('.tree-node-content:not(.dragging)'));
  var closest = null;
  var closestOffset = Number.NEGATIVE_INFINITY;
  for (var i = 0; i < draggableElements.length; i++) {
    var box = draggableElements[i].getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closestOffset) {
      closestOffset = offset;
      closest = draggableElements[i];
    }
  }
  return closest;
}

function toggleExpand(id) {
  var node = findNode(id);
  if (node) { node.expanded = !node.expanded; renderTree(); }
}

function selectNode(id) {
  selectedNodeId = id;
  selectedNode = findNode(id);
  currentPage = 1;
  renderTree();
  renderRightPanel();
}

// ===================== 渲染右侧列表 =====================
function renderRightPanel() {
  var titleEl = document.getElementById('rightTitle');
  var tagEl = document.getElementById('rightTypeTag');
  var pathText = document.getElementById('pathText');
  var btnAdd = document.getElementById('btnAdd');

  var path = getNodePath(selectedNodeId);
  var pathNames = [];
  for (var i = 0; i < path.length; i++) pathNames.push(path[i].name);
  pathText.textContent = pathNames.join(' > ');

  var typeLabels = { root: '项目', category: '分类', enterprise: '单位', department: '部门' };
  var typeColors = { root: '#1890ff', category: '#722ed1', enterprise: '#52c41a', department: '#fa8c16' };
  titleEl.textContent = selectedNode.name;
  tagEl.textContent = typeLabels[selectedNode.type] || '';
  var tc = typeColors[selectedNode.type] || '#999';
  tagEl.style.cssText = 'background:' + tc + '15;color:' + tc + ';border:1px solid ' + tc + '40';

  // 根据节点类型显示不同操作按钮（PRD §6.4.3）
  var btnAddCategory = document.getElementById('btnAddCategory');
  var btnAddEnterprise = document.getElementById('btnAddEnterprise');
  var btnDeleteNode = document.getElementById('btnDeleteNode');
  // 项目根节点：显示新增分类
  btnAddCategory.style.display = (selectedNode.type === 'root') ? 'inline-flex' : 'none';
  // 分类节点：显示新增企业、删除节点
  btnAddEnterprise.style.display = (selectedNode.type === 'category') ? 'inline-flex' : 'none';
  // 企业/部门节点：显示新增部门、删除节点（项目根节点和四方责任体企业节点不可删除）
  btnAdd.style.display = (selectedNode.type === 'enterprise' || selectedNode.type === 'department') ? 'inline-flex' : 'none';
  btnDeleteNode.style.display = (selectedNode.type === 'category' || selectedNode.type === 'enterprise' || selectedNode.type === 'department') ? 'inline-flex' : 'none';

  // 渲染节点信息卡片
  var infoCard = document.getElementById('nodeInfoCard');
  if (!infoCard) {
    infoCard = document.createElement('div');
    infoCard.id = 'nodeInfoCard';
    infoCard.className = 'info-card';
    var tableScroll = document.querySelector('.table-scroll');
    tableScroll.parentNode.insertBefore(infoCard, tableScroll);
  }
  infoCard.innerHTML = renderNodeInfoCard(selectedNode);
  infoCard.style.display = 'block';

  // 统一表格列头：下属部门列表
  var headRow = document.getElementById('tableHead');
  var headers = ['序号', '部门名称', '上级部门', '人数', '备注', '操作'];
  var headHtml = '';
  for (var i = 0; i < headers.length; i++) headHtml += '<th>' + headers[i] + '</th>';
  headRow.innerHTML = headHtml;

  // 递归收集所有后代部门
  var allDepts = collectAllDepartments(selectedNode);

  // 搜索过滤
  var data = [];
  for (var i = 0; i < allDepts.length; i++) {
    var n = allDepts[i];
    if (!searchKeyword) { data.push(n); }
    else if (n.name && n.name.toLowerCase().indexOf(searchKeyword.toLowerCase()) !== -1) { data.push(n); }
  }

  var total = data.length;
  var totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  var start = (currentPage - 1) * pageSize;
  var pageData = data.slice(start, start + pageSize);

  var tbody = document.getElementById('tableBody');
  var emptyState = document.getElementById('emptyState');

  if (pageData.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.querySelector('.empty-text').textContent = '暂无下属部门';
  } else {
    emptyState.style.display = 'none';
    var bodyHtml = '';
    for (var i = 0; i < pageData.length; i++) {
      bodyHtml += renderDeptRow(pageData[i], start + i + 1);
    }
    tbody.innerHTML = bodyHtml;
  }

  renderPagination(total, totalPages);
}

function renderNodeInfoCard(node) {
  var type = node.type;
  var rows = [];

  if (type === 'root') {
    rows = [
      ['节点类型', '项目根节点'],
      ['项目名称', node.name],
      ['下级分类数', (node.children ? node.children.length : 0) + ' 个']
    ];
  } else if (type === 'category') {
    rows = [
      ['节点类型', '分类节点'],
      ['分类名称', node.name],
      ['下级单位数', (node.children ? node.children.length : 0) + ' 家']
    ];
  } else if (type === 'enterprise') {
    rows = [
      ['节点类型', '单位节点'],
      ['单位名称', node.name],
      ['统一信用代码', node.creditCode || '-'],
      ['负责人', node.leader || '-'],
      ['联系电话', node.phone || '-'],
      ['下级部门数', (node.children ? node.children.length : 0) + ' 个']
    ];
  } else if (type === 'department') {
    var parentNode = getParentNode(node.id);
    rows = [
      ['节点类型', '部门节点'],
      ['部门名称', node.name],
      ['上级部门', parentNode ? parentNode.name : '-'],
      ['人数', (node.personCount || 0) + ' 人'],
      ['备注', node.remark || '-']
    ];
  }

  var html = '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px 20px;margin-bottom:16px">';
  html += '<div style="font-weight:600;font-size:14px;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:6px"><span style="font-size:16px">📋</span>当前节点信息</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px">';
  for (var i = 0; i < rows.length; i++) {
    html += '<div><div style="font-size:12px;color:#999;margin-bottom:2px">' + rows[i][0] + '</div><div style="font-size:13px;color:#333;font-weight:500">' + rows[i][1] + '</div></div>';
  }
  html += '</div></div>';
  return html;
}

function collectAllDepartments(node, result) {
  result = result || [];
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var child = node.children[i];
      if (child.type === 'department') {
        result.push(child);
      }
      // Always recurse into children to find nested departments
      collectAllDepartments(child, result);
    }
  }
  return result;
}

function renderDeptRow(item, seq) {
  var parentNode = getParentNode(item.id);
  return '<tr>' +
    '<td><span class="seq-num">' + seq + '</span></td>' +
    '<td><span style="display:flex;align-items:center;gap:6px"><span style="font-size:16px">👥</span>' + item.name + '</span></td>' +
    '<td>' + (parentNode ? parentNode.name : '-') + '</td>' +
    '<td>' + (item.personCount || 0) + ' 人</td>' +
    '<td>' + (item.remark || '-') + '</td>' +
    '<td><div class="action-btns">' +
    '<button class="action-btn action-btn-edit" onclick="openEditModal(&#39;' + item.id + '&#39;)">编辑</button>' +
    '<button class="action-btn action-btn-del" onclick="openDelModal(&#39;' + item.id + '&#39;)">删除</button>' +
    '</div></td>' +
    '</tr>';
}

function renderPagination(total, totalPages) {
  var container = document.getElementById('pagination');
  if (total <= pageSize) { container.innerHTML = ''; return; }

  var html = '<span class="pagination-info">共 ' + total + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
  html += '<button class="pagination-btn"' + (currentPage <= 1 ? ' disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')">上一页</button>';
  html += '<button class="pagination-btn"' + (currentPage >= totalPages ? ' disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')">下一页</button>';
  html += '<select class="page-size-select" onchange="changePageSize(this.value)">' +
    '<option value="10"' + (pageSize == 10 ? ' selected' : '') + '>10条/页</option>' +
    '<option value="20"' + (pageSize == 20 ? ' selected' : '') + '>20条/页</option>' +
    '<option value="50"' + (pageSize == 50 ? ' selected' : '') + '>50条/页</option>' +
    '</select>';
  container.innerHTML = html;
}

function goPage(p) { currentPage = p; renderRightPanel(); }
function changePageSize(size) { pageSize = parseInt(size); currentPage = 1; renderRightPanel(); }
function onSearch() { searchKeyword = document.getElementById('searchInput').value; currentPage = 1; renderRightPanel(); }

// ===================== 弹窗操作 =====================
function openAddModal() {
  if (selectedNode.type !== 'enterprise' && selectedNode.type !== 'department') return;
  modalMode = 'add';
  editingDeptId = null;
  document.getElementById('deptModalTitle').textContent = '新增部门';
  renderParentSelect(selectedNode.id);
  document.getElementById('modalDeptName').value = '';
  document.getElementById('modalRemark').value = '';
  document.getElementById('deptModal').style.display = 'flex';
}

function openEditModal(id) {
  var node = findNode(id);
  if (!node || node.type !== 'department') return;
  modalMode = 'edit';
  editingDeptId = id;
  var parent = getParentNode(id);
  renderParentSelect(parent ? parent.id : '', id);
  document.getElementById('deptModalTitle').textContent = '编辑部门';
  document.getElementById('modalDeptName').value = node.name;
  document.getElementById('modalRemark').value = node.remark || '';
  document.getElementById('deptModal').style.display = 'flex';
}

function closeDeptModal() {
  document.getElementById('deptModal').style.display = 'none';
}

function renderParentSelect(defaultId, excludeId) {
  var select = document.getElementById('modalParentSelect');
  var options = '<option value="">请选择上级部门</option>';

  function walk(node, depth) {
    if (node.id === excludeId) return;
    if (node.type === 'enterprise' || node.type === 'department') {
      var indent = '';
      for (var i = 0; i < depth; i++) indent += '&nbsp;&nbsp;';
      var prefix = node.type === 'enterprise' ? '🏢 ' : '👥 ';
      var selected = node.id === defaultId ? ' selected' : '';
      options += '<option value="' + node.id + '"' + selected + '>' + indent + prefix + node.name + '</option>';
    }
    if (node.children) {
      for (var i = 0; i < node.children.length; i++) {
        walk(node.children[i], depth + 1);
      }
    }
  }

  walk(treeData, 0);
  select.innerHTML = options;
}

function saveDept() {
  var name = document.getElementById('modalDeptName').value.trim();
  if (!name) { showToast('请输入部门名称', 'error'); return; }

  var parentId = document.getElementById('modalParentSelect').value;
  if (!parentId) { showToast('请选择上级部门', 'error'); return; }
  var parentNode = findNode(parentId);
  if (!parentNode) { showToast('上级部门不存在', 'error'); return; }

  var remark = document.getElementById('modalRemark').value.trim();

  if (modalMode === 'add') {
    if (!parentNode.children) parentNode.children = [];
    var newDept = {
      id: getNextId('dept'),
      name: name,
      type: 'department',
      personCount: 0,
      remark: remark
    };
    parentNode.children.push(newDept);
    showToast('部门「' + name + '」新增成功');
  } else {
    var node = findNode(editingDeptId);
    if (node) {
      node.name = name;
      node.remark = remark;
      // 如果上级部门变更，移动节点
      var oldParent = getParentNode(editingDeptId);
      if (oldParent && oldParent.id !== parentId) {
        // 从旧父节点移除
        var idx = -1;
        for (var i = 0; i < oldParent.children.length; i++) {
          if (oldParent.children[i].id === editingDeptId) { idx = i; break; }
        }
        if (idx > -1) oldParent.children.splice(idx, 1);
        // 添加到新父节点
        if (!parentNode.children) parentNode.children = [];
        parentNode.children.push(node);
      }
      showToast('部门信息已更新');
    }
  }

  closeDeptModal();
  renderTree();
  renderRightPanel();
}

function openDelModal(id) {
  var node = findNode(id);
  if (!node) return;
  if (node.type !== 'department') { showToast('该节点不允许删除', 'error'); return; }
  deletingNodeId = id;
  document.getElementById('delTargetName').textContent = node.name;
  document.getElementById('delModal').style.display = 'flex';
}

function closeDelModal() {
  document.getElementById('delModal').style.display = 'none';
  deletingNodeId = null;
}

function confirmDelete() {
  if (!deletingNodeId) return;
  var parent = getParentNode(deletingNodeId);
  if (parent && parent.children) {
    var idx = -1;
    for (var i = 0; i < parent.children.length; i++) {
      if (parent.children[i].id === deletingNodeId) { idx = i; break; }
    }
    if (idx > -1) {
      var name = parent.children[idx].name;
      parent.children.splice(idx, 1);
      showToast('部门「' + name + '」已删除');
    }
  }
  closeDelModal();
  renderTree();
  renderRightPanel();
}

// ===================== 新增分类/企业/删除节点弹窗 =====================
function openAddCategoryModal() {
  var name = prompt('请输入分类名称：');
  if (!name || !name.trim()) return;
  name = name.trim();
  // 在根节点下新增分类
  if (!treeData.children) treeData.children = [];
  treeData.children.push({
    id: getNextId('cat'),
    name: name,
    type: 'category',
    expanded: true,
    children: []
  });
  renderTree();
  renderRightPanel();
  showToast('分类「' + name + '」新增成功');
}

function openAddEnterpriseModal() {
  if (selectedNode.type !== 'category') return;
  var name = prompt('请输入企业名称：');
  if (!name || !name.trim()) return;
  name = name.trim();
  if (!selectedNode.children) selectedNode.children = [];
  selectedNode.children.push({
    id: getNextId('ent'),
    name: name,
    type: 'enterprise',
    creditCode: '',
    leader: '',
    phone: '',
    children: []
  });
  renderTree();
  renderRightPanel();
  showToast('企业「' + name + '」新增成功');
}

function openDelSelectedModal() {
  if (!selectedNode) return;
  // PRD: 项目根节点不可删除
  if (selectedNode.type === 'root') {
    showToast('项目根节点不可删除', 'error');
    return;
  }
  deletingNodeId = selectedNode.id;
  document.getElementById('delTargetName').textContent = selectedNode.name;
  document.getElementById('delModal').style.display = 'flex';
}

// ===================== 初始化 =====================
renderTree();
renderRightPanel();
</script>
