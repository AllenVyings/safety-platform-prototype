<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - 企业端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ========== 页面背景 ========== */
    .workbench-page {
      padding: var(--spacing-lg);
      background: var(--bg-page);
      min-height: 100vh;
    }
    
    /* ========== 统计卡片 ========== */
    
    /* ========== 快捷操作区 ========== */
    .quick-actions {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md) var(--spacing-lg);
      box-shadow: var(--shadow-card);
      margin-bottom: var(--spacing-md);
    }
    .quick-actions-title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      margin-bottom: var(--spacing-md);
      color: var(--text-primary);
    }
    /* .action-buttons 由 framework.css 提供 */
    
    /* ========== 待办事项 ========== */
    .todo-section {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md) var(--spacing-lg);
      box-shadow: var(--shadow-card);
    }
    .todo-title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      margin-bottom: var(--spacing-md);
      color: var(--text-primary);
    }

    /* ========== 通知公告 ========== */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
    }
    .notice-section {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md) var(--spacing-lg);
      box-shadow: var(--shadow-card);
    }
    .notice-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }
    .notice-heading {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--text-primary);
    }
    .notice-more {
      font-size: var(--font-size-xs);
      color: var(--primary);
      cursor: pointer;
    }
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    .notice-card {
      display: flex;
      align-items: flex-start;
      padding: var(--spacing-sm-plus) var(--spacing-md);
      background: var(--bg-section);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    .notice-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .notice-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; margin-right: 10px; flex-shrink: 0; }
    .notice-dot.urgent { background: var(--danger); }
    .notice-dot.normal { background: var(--info); }
    .notice-card-body { flex: 1; min-width: 0; }
    .notice-card-title { font-size: var(--font-size-sm); color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice-card-meta { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: var(--spacing-xs); display: flex; gap: 12px; }
    .notice-tag { font-size: var(--font-size-xs); padding: 1px 6px; border-radius: 3px; }
    .notice-tag.urgent { background: var(--danger-light); color: var(--danger); }
    .notice-tag.normal { background: var(--info-light); color: var(--info); }
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    .todo-item {
      display: flex;
      align-items: center;
      padding: var(--spacing-sm-plus) var(--spacing-md);
      background: var(--bg-section);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
    }
    .todo-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: var(--font-size-lg);
    }
    .todo-icon.warning { background: var(--warning-light); color: var(--warning); }
    .todo-icon.danger { background: var(--danger-light); color: var(--danger); }
    .todo-content {
      flex: 1;
    }
    .todo-name {
      font-size: var(--font-size-md);
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .todo-desc {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }
    .todo-action {
      margin-left: 12px;
    }
    .todo-overdue-tag {
      font-size: var(--font-size-xs);
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--danger-light);
      color: var(--danger);
      margin-left: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="module-page workbench-page" data-module="enterprise/workbench">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">企业端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">工作台</span>
    </div>
    
    <!-- 页面标题栏已隐藏 -->
    
    <!-- 统计卡片 -->
    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">安全管控对象</div>
          <div class="stat-value" id="statControl">24</div>
        </div>
        <div class="stat-indicator" style="background: var(--info);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">待自查</div>
          <div class="stat-value" id="statPending" style="color:var(--warning)">3</div>
        </div>
        <div class="stat-indicator" style="background: var(--warning);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">待整改隐患</div>
          <div class="stat-value" id="statHazard" style="color:var(--danger)">2</div>
        </div>
        <div class="stat-indicator" style="background: var(--danger);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">安全得分</div>
          <div class="stat-value" id="statRate" style="color:var(--success)">92</div>
        </div>
        <div class="stat-indicator" style="background: var(--success);"></div>
      </div>
    </section>
    
    <!-- 快捷操作 -->
    <section class="quick-actions">
      <div class="quick-actions-title">快捷操作</div>
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="startSelfCheck()">开始自查</button>
        <button class="btn btn-default" onclick="viewHazards()">查看隐患</button>
        <button class="btn btn-default" onclick="viewRecords()">检查记录</button>
        <button class="btn btn-default" onclick="updateInfo()">更新信息</button>
      </div>
    </section>
    
    <!-- 待办事项 + 通知公告 -->
    <div class="content-grid">
      <section class="todo-section">
        <div class="todo-title">待办事项</div>
        <div class="todo-list" id="todoList">
          <!-- 逾期项置顶（danger > warning 排序） -->
          <div class="todo-item" data-priority="danger">
            <div class="todo-icon danger">🔴</div>
            <div class="todo-content">
              <div class="todo-name">消防通道隐患整改 <span class="todo-overdue-tag">逾期</span></div>
              <div class="todo-desc">逾期2天，请立即处理</div>
            </div>
            <div class="todo-action">
              <button class="btn btn-primary btn-sm" onclick="handleTodo('消防通道隐患整改')">去整改</button>
            </div>
          </div>
          <div class="todo-item" data-priority="warning">
            <div class="todo-icon warning">⚠️</div>
            <div class="todo-content">
              <div class="todo-name">月度安全自查</div>
              <div class="todo-desc">截止日期：2026-04-05</div>
            </div>
            <div class="todo-action">
              <button class="btn btn-primary btn-sm" onclick="handleTodo('月度安全自查')">去处理</button>
            </div>
          </div>
        </div>
      </section>

      <section class="notice-section">
        <div class="notice-title-bar">
          <span class="notice-heading">📢 通知公告</span>
          <span class="notice-more" onclick="showToast('查看全部通知')">查看全部 &gt;</span>
        </div>
        <div class="notice-list">
          <div class="notice-card" onclick="showToast('查看通知详情')">
            <div class="notice-dot urgent"></div>
            <div class="notice-card-body">
              <div class="notice-card-title">关于开展五一劳动节期间安全生产专项检查的紧急通知</div>
              <div class="notice-card-meta">
                <span>南山区应急管理局</span>
                <span>2026-04-28 09:00</span>
                <span class="notice-tag urgent">紧急</span>
              </div>
            </div>
          </div>
          <div class="notice-card" onclick="showToast('查看通知详情')">
            <div class="notice-dot normal"></div>
            <div class="notice-card-body">
              <div class="notice-card-title">4月份安全生产例会会议纪要</div>
              <div class="notice-card-meta">
                <span>企业安全部</span>
                <span>2026-04-23 14:30</span>
                <span class="notice-tag normal">普通</span>
              </div>
            </div>
          </div>
          <div class="notice-card" onclick="showToast('查看通知详情')">
            <div class="notice-dot urgent"></div>
            <div class="notice-card-body">
              <div class="notice-card-title">关于汛期安全防范工作的紧急通知</div>
              <div class="notice-card-meta">
                <span>南山区住建局</span>
                <span>2026-04-20 10:00</span>
                <span class="notice-tag urgent">紧急</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
  
  <script>
    (function() {
      'use strict';
      
      var CONFIG = {
        moduleId: 'ent-workbench',
        moduleName: '企业工作台'
      };

      var state = {
        initialized: false
      };
      
      function init() {
        if (state.initialized) return;
        console.log(`[${CONFIG.moduleId}] 模块初始化`);
        state.initialized = true;
      }
      
      function showToast(msg) {
        var el = document.getElementById('_toast');
        if (!el) {
          el = document.createElement('div');
          el.id = '_toast';
          el.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:var(--spacing-sm) var(--spacing-lg);background:var(--primary);color:var(--bg-primary);border-radius:6px;font-size:14px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);opacity:0;transition:opacity var(--duration-normal);pointer-events:none';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        el.style.opacity = '1';
        setTimeout(function() { el.style.opacity = '0'; }, 2000);
      }
      window.showToast = showToast;

      // 导航到首页
      window.goToHome = function() {
        console.log('导航到首页');
        showToast('导航到：首页');
      };

      // 快捷操作
      window.startSelfCheck = function() {
        console.log('开始自查');
        showToast('开始自查');
      };
      window.viewHazards = function() {
        console.log('查看隐患');
        showToast('查看隐患');
      };
      window.viewRecords = function() {
        console.log('查看记录');
        showToast('查看记录');
      };
      window.updateInfo = function() {
        console.log('更新信息');
        showToast('更新信息');
      };

      // 待办事项处理
      window.handleTodo = function(todoName) {
        console.log('处理待办：' + todoName);
        showToast('处理待办：' + todoName);
      };
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      window.destroyModule = function() {
        console.log(`[${CONFIG.moduleId}] 模块销毁`);
        state.initialized = false;
      };
    })();
  </script>
<script src="../../js/annotations.js"></script>
</body>
</html>
