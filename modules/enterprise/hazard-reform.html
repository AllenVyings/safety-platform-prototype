<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>隐患整改管理 - 企业端</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/framework.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}
.module-page.page-container{height:100%;min-height:0;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;overflow:hidden}
.split-view{display:flex;gap:12px;flex:1;min-height:0;overflow:hidden}
.tree-panel{width:280px;flex-shrink:0;align-self:stretch;min-height:0;background:var(--bg-primary);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-card);padding:12px}
.tree-header{padding:0 0 12px;border-bottom:1px solid var(--border-light)}
.tree-header-title{font-size:var(--font-size-md);font-weight:600;color:var(--text-primary);padding-left:12px;border-left:4px solid var(--primary);line-height:1.6}
.tree-search{position:relative;padding:var(--spacing-sm) 0;border-bottom:1px solid var(--border-light)}
.tree-search .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);display:flex;pointer-events:none}
.tree-search input{width:100%;height:32px;padding:0 12px 0 32px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;box-sizing:border-box;background:var(--bg-section-alt)}
.tree-search input:focus{border-color:var(--primary)}
.tree-body{flex:1;overflow-y:auto;padding:var(--spacing-sm) 0}
.tree-node{display:flex;align-items:center;padding:6px var(--spacing-sm);cursor:pointer;border-radius:var(--radius-md);margin:0 0 2px}
.tree-node:hover{background:var(--bg-section-alt)}
.tree-node.active{background:var(--primary-light);color:var(--primary)}
.tree-node-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;margin-right:var(--spacing-sm);flex-shrink:0}
.tree-node-icon svg{width:14px;height:14px}
.tree-node-label{flex:1;min-width:0;font-size:var(--font-size-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-toggle,.tree-pad{width:12px;margin-right:var(--spacing-xs);flex-shrink:0;display:inline-block;text-align:center;color:var(--text-tertiary);font-size:var(--font-size-xs)}
.tree-toggle{cursor:pointer;transition:transform var(--duration-normal)}
.tree-toggle.expanded{transform:rotate(90deg)}
.tree-children{display:none;margin-left:16px}
.tree-children.expanded{display:block}
.right-column{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.filter-card{flex-shrink:0;background:var(--bg-primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px 20px}
.filter-card .filter-bar{display:grid;grid-template-columns:max-content max-content max-content;column-gap:32px;row-gap:12px;align-items:center;margin:0;padding:0;background:transparent;border:none;border-radius:0}
.filter-card .filter-item{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.filter-card .filter-item-time{grid-column:1 / -1;justify-self:start}
.filter-card .filter-item-time #btnQuery{margin-left:16px}
.filter-card .filter-item label{flex:0 0 98px;width:98px;text-align:right;white-space:nowrap;font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary)}
.filter-card .filter-bar select,.filter-card .filter-bar input[type="text"],.filter-card .filter-bar input[type="date"]{width:240px;flex:0 0 240px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box;background:var(--bg-primary)}
.filter-to{color:var(--text-secondary);font-size:var(--font-size-sm);padding:0 2px}
/* 统计卡片：色条版结构对齐企业用户；白底+卡片阴影，避免与页面灰底糊成一片 */
.stats-row{display:flex;gap:12px;flex-shrink:0}
.stat-card{flex:1;background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md) var(--spacing-lg);position:relative;overflow:hidden;display:flex;align-items:center;gap:var(--spacing-md);box-shadow:var(--shadow-card);border:none;min-height:0}
.stat-card:hover{box-shadow:var(--shadow-card);border-color:transparent}
.stat-card-body{flex:1}
.stat-label{font-size:var(--font-size-xs);color:var(--text-secondary)}
.stat-value{font-size:24px;font-weight:700;color:var(--text-primary);margin-top:2px;line-height:1.2;letter-spacing:0}
.stat-indicator{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 2px 2px 0}
.stat-indicator-primary{background:var(--primary)}
.stat-indicator-success{background:var(--success)}
.stat-indicator-warning{background:var(--warning)}
.stat-indicator-danger{background:var(--danger)}
.stat-value-success{color:var(--success)}
.stat-value-warning{color:var(--warning)}
.stat-value-danger{color:var(--danger)}
.list-panel{position:relative;flex:1;min-width:0;min-height:0;background:var(--bg-primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px 20px;display:flex;flex-direction:column;overflow:hidden}
.list-title{font-size:var(--font-size-md);font-weight:600;color:var(--text-primary);padding-left:12px;border-left:4px solid var(--primary);line-height:1.6;margin:0 0 8px}
.list-sub{font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:12px}
.list-panel .table-wrap{flex:0 0 auto;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.list-panel .table-wrap.can-scroll-y{flex:0 1 auto;overflow-y:auto}
.list-panel .table-wrap::-webkit-scrollbar{width:0;height:0}
.list-panel .table-wrap:hover{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.28) transparent}
.list-panel .table-wrap:hover::-webkit-scrollbar{width:8px;height:8px}
.list-panel .table-wrap:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28);border-radius:4px}
.list-panel .table-wrap table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.list-panel .table-wrap th,
.list-panel .table-wrap td{box-sizing:border-box;height:48px;padding:0 20px;vertical-align:middle}
.list-panel .table-wrap td{white-space:nowrap}
.list-panel .table-wrap thead th{position:sticky;top:0;z-index:12;background:var(--bg-table-header)}
.list-panel .table-wrap th.col-index,
.list-panel .table-wrap td.col-index{left:0;width:64px;min-width:64px;max-width:64px;padding:0 12px}
.list-panel .table-wrap th.col-desc,
.list-panel .table-wrap td.col-desc{width:240px;min-width:240px;max-width:240px}
.list-panel .table-wrap td.col-desc .cell-clip{display:block;width:200px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-panel .table-wrap th.operation-col,
.list-panel .table-wrap td.operation-col{min-width:120px;padding:0 28px}
.list-panel .table-wrap td.empty-row{height:auto;max-width:none;text-align:center;color:var(--text-tertiary);padding:40px 12px}
.list-panel .pagination{flex-shrink:0;margin-top:auto;padding:16px 0 0;background:transparent;border-top:none}
.tag-pending{background:#fff1f0;color:#ff4d4f}
.tag-doing{background:#fff7e6;color:#fa8c16}
.tag-review{background:#e6f4ff;color:#1677ff}
.tag-done{background:#f6ffed;color:#52c41a}
.tag-overdue{background:#fff1f0;color:#cf1322}
.name-bubble{position:fixed;z-index:40;display:none;max-width:360px;padding:8px 12px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);font-size:var(--font-size-sm);line-height:1.5;word-break:break-all;pointer-events:none}
.name-bubble.show{display:block}
.modal-overlay#modal-hazard-detail{z-index:1100}
.modal-dialog.detail-dialog{width:1100px;max-width:calc(100vw - 48px);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.modal-head-title{font-size:16px;font-weight:600;color:#1f1f1f}
.modal-head-close{background:none;border:none;font-size:22px;cursor:pointer;color:#999;line-height:1;width:28px;height:28px}
.modal-head-close:hover{color:#666}
.detail-dialog .modal-body{padding:20px 24px;overflow:auto;flex:1;min-height:0;background:#fff;color:#1f1f1f}
.detail-dialog .modal-foot{flex-shrink:0;padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;background:#fff}
.detail-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,0.75fr);gap:28px;align-items:start;min-height:0}
.detail-main{min-width:0}
.detail-side{min-width:0;padding-left:24px;border-left:1px solid #f0f0f0}
.detail-block{margin-bottom:24px}
.detail-block:last-child{margin-bottom:0}
.detail-section-title{font-size:15px;font-weight:600;color:#1f1f1f;padding-left:10px;border-left:3px solid #1677ff;line-height:1.4;margin:0 0 14px}
.detail-kv{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;row-gap:10px}
.detail-kv-item{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:start;line-height:1.6}
.detail-kv-item.full{grid-column:1 / -1}
.detail-kv-label{color:#1f1f1f;font-size:13px;font-weight:600;white-space:nowrap;padding-top:1px}
.detail-kv-value{color:#1f1f1f;font-size:14px;font-weight:400;word-break:break-word}
.detail-thumbs{display:flex;flex-wrap:wrap;gap:10px}
.detail-thumb{width:96px;height:96px;border-radius:6px;overflow:hidden;border:1px solid #f0f0f0;background:#f5f5f5;flex-shrink:0}
.detail-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.flow-title{font-size:15px;font-weight:600;color:#1f1f1f;margin:0 0 16px}
.flow-list{list-style:none;margin:0;padding:0}
.flow-item{position:relative;padding:0 0 18px 0}
.flow-item:last-child{padding-bottom:0}
.flow-item:not(:last-child)::before{content:'';position:absolute;left:6px;top:18px;bottom:0;border-left:2px dashed #bfbfbf}
.flow-head{display:flex;align-items:center;gap:10px;min-height:20px;position:relative;z-index:1}
.flow-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-sizing:border-box;background:#fff;position:relative;border:2px solid #d9d9d9}
/* 已完成：外圈+内点 */
.flow-dot.is-done.report{border-color:#1677ff;color:#1677ff}
.flow-dot.is-done.reform{border-color:#ff4d4f;color:#ff4d4f}
.flow-dot.is-done.review{border-color:#fa8c16;color:#fa8c16}
.flow-dot.is-done.close{border-color:#52c41a;color:#52c41a}
.flow-dot.is-done::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:currentColor}
/* 当前节点：实心圆，更醒目 */
.flow-dot.is-current.report{background:#1677ff;border-color:#1677ff;box-shadow:0 0 0 3px rgba(22,119,255,.2)}
.flow-dot.is-current.reform{background:#ff4d4f;border-color:#ff4d4f;box-shadow:0 0 0 3px rgba(255,77,79,.2)}
.flow-dot.is-current.review{background:#fa8c16;border-color:#fa8c16;box-shadow:0 0 0 3px rgba(250,140,22,.2)}
.flow-dot.is-current.close{background:#52c41a;border-color:#52c41a;box-shadow:0 0 0 3px rgba(82,196,26,.2)}
/* 未到达：空心淡色 */
.flow-dot.is-pending.report{border-color:#91caff;background:#fff}
.flow-dot.is-pending.reform{border-color:#ffa39e;background:#fff}
.flow-dot.is-pending.review{border-color:#ffd591;background:#fff}
.flow-dot.is-pending.close{border-color:#b7eb8f;background:#fff}
.flow-tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;line-height:20px;flex-shrink:0}
.flow-tag.is-done.report,.flow-tag.is-current.report{background:#e6f4ff;color:#1677ff}
.flow-tag.is-done.reform,.flow-tag.is-current.reform{background:#fff1f0;color:#ff4d4f}
.flow-tag.is-done.review,.flow-tag.is-current.review,.flow-tag.is-returned.review{background:#fff7e6;color:#fa8c16}
.flow-tag.is-done.close,.flow-tag.is-current.close{background:#f6ffed;color:#52c41a}
.flow-tag.is-current{box-shadow:inset 0 0 0 1px currentColor}
.flow-tag.is-pending{background:#f5f5f5;color:#bfbfbf}
.flow-time{font-size:12px;color:#8c8c8c;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-item.is-current .flow-time{color:#595959;font-weight:500}
.flow-item.is-pending .flow-time{color:#d9d9d9}
/* 审批退回：轴点/连线仍用复核橙色，与标签、卡片色统一 */
.flow-dot.is-done.is-returned.review,.flow-dot.is-returned.review{border-color:#fa8c16;color:#fa8c16;background:#fff}
.flow-dot.is-returned.review::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:currentColor}
.flow-item.is-returned:not(:last-child)::before{border-left-color:#ffc069}
.flow-body{margin:8px 0 0 24px;padding:10px 12px;background:#fafafa;border-radius:6px;border:1px solid #f0f0f0;min-width:0}
.flow-body.is-current{background:#fff;border-color:#d9d9d9;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.flow-body.is-current.report,.flow-body.is-done.report{border-left:3px solid #1677ff}
.flow-body.is-current.reform,.flow-body.is-done.reform{border-left:3px solid #ff4d4f}
.flow-body.is-current.review,.flow-body.is-done.review{border-left:3px solid #fa8c16}
.flow-body.is-current.close,.flow-body.is-done.close{border-left:3px solid #52c41a}
.flow-body.is-pending{background:#fcfcfc;border-color:#f0f0f0}
.flow-body.is-pending .flow-row-label,.flow-body.is-pending .flow-row-value{color:#bfbfbf}
.flow-fields{display:flex;flex-direction:column;gap:6px}
.flow-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;align-items:start;line-height:1.55}
.flow-row-label{color:#1f1f1f;font-size:12px;font-weight:600;white-space:nowrap}
.flow-row-value{color:#1f1f1f;font-size:13px;font-weight:400;word-break:break-word}
.flow-thumbs{display:flex;flex-wrap:wrap;gap:6px}
.flow-thumbs .detail-thumb{width:64px;height:64px}
/* 任务流转弹窗（§6.3.7.3.10） */
.modal-overlay#modal-hazard-transfer{z-index:1100}
.modal-dialog.transfer-dialog{width:640px;max-width:calc(100vw - 48px);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.transfer-dialog .modal-body{padding:20px 24px;overflow:auto;flex:1;min-height:0}
.transfer-dialog .modal-foot{flex-shrink:0;padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:12px;background:#fff}
.tf-field{margin-bottom:16px}
.tf-field:last-child{margin-bottom:0}
.tf-label{display:block;font-size:13px;font-weight:600;color:#1f1f1f;margin-bottom:6px}
.tf-label .req{color:#ff4d4f;margin-right:2px}
.tf-static{font-size:14px;color:#1f1f1f;line-height:1.6;word-break:break-word}
.transfer-dialog select{width:100%;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box;background:var(--bg-primary);outline:none}
.transfer-dialog select:focus{border-color:var(--primary)}
.transfer-dialog select:disabled{background:var(--bg-section-alt);color:var(--text-tertiary);cursor:not-allowed}
.transfer-dialog textarea{width:100%;height:80px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box;resize:vertical;outline:none;font-family:inherit}
.transfer-dialog textarea:focus{border-color:var(--primary)}
.tf-tip{font-size:12px;color:var(--text-tertiary);margin-top:4px}
.tf-count{font-size:12px;color:var(--text-tertiary);text-align:right;margin-top:4px}
/* 选人组件：对齐安全管控对象管理（hazard-list）check-person-* 同款 */
.check-person-select{position:relative}
.check-person-trigger{height:32px;display:flex;align-items:center;gap:8px;padding:2px 8px;border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;background:var(--bg-primary);font-size:var(--font-size-sm);box-sizing:border-box}
.check-person-trigger:hover{border-color:var(--primary)}
.check-person-trigger.disabled{background:var(--bg-section-alt);color:var(--text-tertiary);cursor:not-allowed}
.check-person-trigger.disabled:hover{border-color:var(--border)}
.check-person-placeholder{color:var(--text-placeholder)}
.check-person-caret{color:var(--text-tertiary);font-size:12px;flex-shrink:0}
.check-person-tags{display:flex;flex-wrap:nowrap;gap:4px;flex:1;min-width:0;overflow:hidden}
.check-person-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-sm);font-size:var(--font-size-xs);background:var(--primary-light);color:var(--primary);flex-shrink:0;max-width:160px;overflow:hidden;white-space:nowrap}
.check-person-tag .tag-x{cursor:pointer;font-weight:700}
.check-person-tag .tag-x:hover{color:var(--danger)}
/* 面板在弹窗内原位展开（文档流），下方字段随之下移，不遮挡表单 */
.check-person-panel{display:none;width:100%;margin-top:8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-card);box-sizing:border-box}
.check-person-panel.open{display:block}
.check-person-cols{display:flex;height:280px}
.check-person-left{width:220px;flex-shrink:0;border-right:1px solid var(--border-light);display:flex;flex-direction:column}
.check-person-search{margin:8px;padding:0 10px;height:30px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-xs);outline:none;box-sizing:border-box}
.check-person-tree{flex:1;overflow-y:auto;padding:4px 0}
.check-person-dept{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:var(--font-size-sm)}
.check-person-dept:hover{background:var(--bg-section)}
.check-person-dept.active{background:var(--primary-light);color:var(--primary)}
.check-person-dept .dept-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-person-dept .dept-count{margin-left:auto;font-size:var(--font-size-xs);color:var(--text-tertiary);flex-shrink:0}
.check-person-dept input,.check-person-user input{accent-color:var(--primary);flex-shrink:0}
.check-person-right{flex:1;display:flex;flex-direction:column;min-width:0}
.check-person-right-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border-light);font-size:var(--font-size-sm)}
.check-person-right-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-person-users{flex:1;overflow-y:auto}
.check-person-user{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:var(--font-size-sm);cursor:pointer}
.check-person-user:hover{background:var(--bg-section)}
.check-person-user.disabled{color:var(--text-tertiary);cursor:default}
.check-person-user.disabled:hover{background:none}
.check-person-user .user-phone{margin-left:auto;font-size:var(--font-size-xs);color:var(--text-tertiary)}
/* 列表标题行：标题与批量导出按钮同行 */
.list-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.list-head-left{flex:1;min-width:0}
.list-head-actions{display:flex;gap:8px;flex-shrink:0}
.list-head .btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
.list-head .btn svg{width:14px;height:14px}
.task-badge{display:none;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:11px;line-height:16px;text-align:center;box-sizing:border-box}
.task-badge.show{display:inline-block}
/* 导出设置弹窗（§6.3.7.3.11） */
.modal-overlay#modal-hazard-export{z-index:1150}
.modal-dialog.export-dialog{width:600px;max-width:calc(100vw - 48px);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.export-dialog .modal-body{padding:20px 24px;overflow:auto;flex:1;min-height:0}
.export-dialog .modal-foot{flex-shrink:0;padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:12px;background:#fff}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.ex-grid select{width:100%;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box;background:var(--bg-primary);outline:none}
.ex-grid select:focus{border-color:var(--primary)}
.ex-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;height:32px}
.ex-switch input{display:none}
.ex-slider{width:36px;height:20px;border-radius:10px;background:#d9d9d9;position:relative;transition:background .2s;flex-shrink:0}
.ex-slider::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.ex-switch input:checked + .ex-slider{background:var(--primary)}
.ex-switch input:checked + .ex-slider::after{left:18px}
.ex-switch-text{font-size:var(--font-size-sm);color:var(--text-secondary)}
/* 数据范围信息条：只读上下文，与可编辑控件区分 */
.ex-scope{background:var(--bg-section-alt);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:18px}
.ex-scope-label{font-size:var(--font-size-xs);color:var(--text-tertiary);margin-bottom:4px}
.ex-scope-value{font-size:var(--font-size-sm);color:var(--text-primary);line-height:1.6;word-break:break-word}
.ex-scope-count{font-size:var(--font-size-sm);color:var(--text-secondary);margin-top:6px}
.ex-scope-count b{color:var(--primary);font-size:18px;font-weight:700;padding:0 2px}
.ex-section-title{font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary);padding-left:10px;border-left:3px solid var(--primary);line-height:1.4;margin:0 0 12px}
.ex-grid .tf-field{margin-bottom:12px}
/* 照片开关独立整行，避免与下拉网格高度失衡 */
.ex-photo-row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border-light);margin-top:6px;padding-top:14px}
.ex-photo-row .tf-label{margin-bottom:0}
.ex-photo-tip{margin-left:auto;font-size:var(--font-size-xs);color:var(--text-tertiary)}
/* 导出记录任务中心：批量导出内嵌顶部，列表固定列宽、文件名省略 */
.modal-overlay#modal-export-tasks{z-index:1100}
.modal-overlay#modal-task-delete{z-index:1200}
#modal-export-tasks .modal-dialog{width:760px}
.ex-task-toolbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:14px}
.ex-task-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);table-layout:fixed}
.ex-task-table th{background:var(--bg-table-header);text-align:left;padding:10px 12px;font-weight:600;color:var(--text-primary);white-space:nowrap}
.ex-task-table td{padding:12px;border-bottom:1px solid var(--border-light);vertical-align:middle;color:var(--text-primary)}
.ex-task-table th:nth-child(2),.ex-task-table td:nth-child(2){width:64px}
.ex-task-table th:nth-child(3),.ex-task-table td:nth-child(3){width:132px}
.ex-task-table th:nth-child(4),.ex-task-table td:nth-child(4){width:104px}
.ex-task-table th:nth-child(5),.ex-task-table td:nth-child(5){width:112px}
.ex-task-table td:nth-child(n+2){white-space:nowrap}
.ex-task-table .tag{white-space:nowrap}
.ex-task-table .task-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-task-table .task-scope{color:var(--text-secondary);font-size:var(--font-size-xs);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-task-table .task-progress{color:var(--text-tertiary);font-size:var(--font-size-xs)}
.task-actions{display:flex;gap:12px;white-space:nowrap}
.ex-task-empty{text-align:center;color:var(--text-tertiary);padding:40px 12px}
/* 删除任务确认弹窗 */
.modal-dialog.confirm-dialog{width:400px;max-width:calc(100vw - 48px);display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.confirm-dialog .modal-body{padding:20px 24px}
.confirm-dialog .modal-foot{flex-shrink:0;padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:12px}
.confirm-text{font-size:var(--font-size-sm);color:var(--text-primary);line-height:1.7;word-break:break-word}
#_toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2000;padding:10px 20px;background:rgba(0,0,0,.78);color:#fff;font-size:14px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}
@media (max-width:960px){
  .detail-layout{grid-template-columns:1fr}
  .detail-side{padding-left:0;border-left:none;border-top:1px solid #f0f0f0;padding-top:16px}
}
</style>

              <option value="已整改">已整改</option>
              <option value="已逾期">已逾期</option>

            <select id="filterOverdue">

            <button class="btn btn-default" id="btnReset" type="button">重置</button>
          </div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">隐患总数</div>
            <div class="stat-value" id="statTotal">0</div>
          </div>
          <div class="stat-indicator stat-indicator-primary"></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">已完成</div>
            <div class="stat-value stat-value-success" id="statDone">0</div>
          </div>
          <div class="stat-indicator stat-indicator-success"></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">未完成</div>
            <div class="stat-value stat-value-danger" id="statOpen">0</div>
          </div>
          <div class="stat-indicator stat-indicator-danger"></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">整改率</div>
            <div class="stat-value" id="statRate">0%</div>
          </div>
          <div class="stat-indicator stat-indicator-primary"></div>
        </div>
      </div>
      <div class="list-panel table-card">
        <div class="list-head">

          </div>

            <button class="btn btn-default" type="button" id="btnTaskList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>导出记录<span class="task-badge" id="taskBadge"></span></button>

</div>

  </div>
</div>

<div class="modal-overlay" id="modal-hazard-transfer">

        </div>

      <button class="btn btn-primary" type="button" id="btnDoExport">提交导出任务</button>

  function branchHit(node, kw) {
    if (!kw) return true;
    if (labelOf(node).indexOf(kw) >= 0) return true;
    return (node.children || []).some(function(child) { return branchHit(child, kw); });
  }

  function renderBranch(nodes, kw, parentHit) {
    var html = '';
    nodes.forEach(function(node) {
      var selfHit = !kw || labelOf(node).indexOf(kw) >= 0;
      var childHit = (node.children || []).some(function(child) { return branchHit(child, kw); });
      if (kw && !parentHit && !selfHit && !childHit) return;
      var kids = node.children || [];
      var open = !!(kw || node.open !== false);
      html += '<div class="tree-node' + (node.id === state.selectedId ? ' active' : '') + '" data-id="' + esc(node.id) + '">';
      if (kids.length) html += '<span class="tree-toggle' + (open ? ' expanded' : '') + '" data-toggle="' + esc(node.id) + '">▶</span>';
      else html += '<span class="tree-pad"></span>';

      html += '<span class="tree-node-label" title="' + esc(labelOf(node)) + '">' + esc(labelOf(node)) + '</span></div>';
      if (kids.length) {

    if (!node || node.type === 'enterprise' || node.type === 'project') return true;
    if (node.type === 'domain') {
      var bag = {};
      (node.children || []).forEach(function(child) { collectIds(child, bag); });
      return !!bag[row.objectId];
    }
    if (node.type === 'region') {
      var regionBag = {};
      (node.children || []).forEach(function(child) { collectIds(child, regionBag); });
      return !!regionBag[row.objectId];
    }
    return row.objectId === node.id;
  }

      if (applied.desc && row.desc.indexOf(applied.desc) < 0) return false;
      if (applied.status && row.status !== applied.status) return false;
      if (applied.overdue === 'yes' && !row.overdue) return false;
      if (applied.overdue === 'no' && row.overdue) return false;
      if (applied.start && row.foundAt < applied.start) return false;
      if (applied.end && row.foundAt > applied.end) return false;
      return true;

  function getOrgTree() {
    return (window.getEnterpriseOrg ? getEnterpriseOrg() : null) || [];
  }

  function orgFindNode(name) {
    var found = null;
    function walk(nodes) {
      (nodes || []).forEach(function(node) {
        if (found) return;
        if (node.name === name) { found = node; return; }
        if (node.children) walk(node.children);
      });
    }
    walk(getOrgTree());
    return found;
  }

  function orgSubtreeNames(node) {
    var names = [node.name];
    (node.children || []).forEach(function(child) {
      orgSubtreeNames(child).forEach(function(n) { names.push(n); });
    });
    return names;
  }

  function tfCompanyName() {
    var profile = window.getEnterpriseProfile ? getEnterpriseProfile() : null;
    if (profile && profile.name) return profile.name;
    var tree = getOrgTree();
    return (tree[0] && tree[0].name) || '企业';
  }

  function tfUsersIn(deptName) {
    var users = ENT_USERS.filter(function(user) { return user.enabled; });
    if (!deptName) return users;
    var node = orgFindNode(deptName);
    if (!node || node.status !== 1) return [];
    var names = orgSubtreeNames(node).filter(function(name) {
      var item = orgFindNode(name);
      return item && item.status === 1;
    });
    return users.filter(function(user) { return names.indexOf(user.dept) !== -1; });
  }

    var pagerEl = document.getElementById('pager');
    var title = panel.querySelector('.list-title');
    var sub = panel.querySelector('.list-sub');
    var note = panel.querySelector('.list-note');
    var panelStyle = getComputedStyle(panel);
    var available = panel.clientHeight
      - parseFloat(panelStyle.paddingTop) - parseFloat(panelStyle.paddingBottom)
      - title.offsetHeight - sub.offsetHeight - (note ? note.offsetHeight : 0) - pagerEl.offsetHeight

    html += '<div class="detail-kv-item full"><div class="detail-kv-label">隐患图片：</div><div class="detail-kv-value"><div class="detail-thumbs">' + thumbHtml('hazard') + '</div></div></div>';
    html += '</div></div>';

    html += '<div class="detail-block"><div class="detail-section-title">隐患整改</div><div class="detail-kv">';
    if (showReform) {
      html += kv('整改人', esc(row.person));
      html += kv('整改时间', esc(reformTime));
      html += kv('整改描述', esc(reformDesc), true);
      html += '<div class="detail-kv-item full"><div class="detail-kv-label">整改图片：</div><div class="detail-kv-value">' + photoThumbs(row.rectifyPhotos, 'detail-thumbs', 'reform') + '</div></div>';
    } else {
      html += kv('整改人', '-');
      html += kv('整改时间', '-');
      html += kv('整改描述', '-', true);
      html += '<div class="detail-kv-item full"><div class="detail-kv-label">整改图片：</div><div class="detail-kv-value">-</div></div>';
    }
    html += '</div></div>';

    html += '<div class="detail-block"><div class="detail-section-title">整改复核</div><div class="detail-kv">';
    if (showReview) {
      html += kv('审批结果', esc(approveResult || '-'));
      if (closed) {
        html += kv('整改完成时间', esc(row.closeTime || reviewTime));
        html += kv('核实情况', esc(reviewResult), true);
      } else if (rejected) {
        html += kv('复核人', esc(reviewer));
        html += kv('复核时间', esc(reviewTime));
        html += kv('核实情况', esc(reviewResult), true);
      } else {
        html += kv('复核人', esc(reviewer));
        html += kv('复核时间', esc(reviewTime));
        html += kv('核实情况', esc(reviewResult), true);
      }
    } else {
      html += kv('审批结果', '-');
      html += kv('复核人', '-');
      html += kv('复核时间', '-');
      html += kv('核实情况', '-', true);
    }
    html += '</div></div>';

    html += '</div><div class="detail-side"><div class="flow-title">流程记录</div><ul class="flow-list">';

    function flowRow(label, valueHtml) {
      return '<div class="flow-row"><div class="flow-row-label">' + esc(label) + '：</div><div class="flow-row-value">' + valueHtml + '</div></div>';
    }

    /* 任务流转留痕：仅当前节点卡片展示，多次流转按顺序追加（§6.3.7.3.8） */
    function transferRows(nodeName) {
      var list = (row.transfers || []).filter(function(t) { return t.node === nodeName; });
      if (!list.length) return '';
      return flowRow('流转记录', list.map(function(t) {
        return esc(t.time + ' ' + t.from + '→' + t.to + '：' + t.reason);
      }).join('<br>'));
    }

    /* phase: done | current | pending；axisExtra（如 returned）作用圆点+标签色块，不改变内容卡样式 */
    function flowNode(tagClass, tagText, phase, timeText, rowsHtml, axisExtra) {
      var extra = axisExtra ? ' is-' + axisExtra : '';
      var item = '<li class="flow-item is-' + phase + extra + '">';
      item += '<div class="flow-head">';
      item += '<span class="flow-dot ' + tagClass + ' is-' + phase + extra + '"></span>';
      item += '<span class="flow-tag ' + tagClass + ' is-' + phase + extra + '">' + esc(tagText) + '</span>';
      item += '<span class="flow-time">' + esc(timeText || '-') + '</span>';
      item += '</div>';
      item += '<div class="flow-body is-' + phase + ' ' + tagClass + '"><div class="flow-fields">' + rowsHtml + '</div></div>';
      item += '</li>';
      return item;
    }

    var dash = '-';
    var closeTime = closed ? (row.closeTime || reviewTime) : dash;
    var emptyReformRows =
      flowRow('整改人', dash) +
      flowRow('整改描述', dash) +
      flowRow('整改图片', dash);
    var emptyReviewRows =
      flowRow('审批结果', dash) +
      flowRow('核实情况', dash);

    html += flowNode('report', '隐患上报', 'done', reportTime,
      flowRow('上报人', esc(reporter)) +
      flowRow('隐患描述', esc(row.desc))
    );

    /*
     * 审批退回：上一轮整改/整改复核节点保留（复核已办结，非操作态）；
     * 轴上 returned 仅标圆点/连线；自复核再流向新的空「隐患整改」。
     */
    if (rejected && !closed) {
      html += flowNode('reform', '隐患整改', 'done', reformTime,
        flowRow('整改人', esc(row.person)) +
        flowRow('整改描述', esc(reformDesc)) +
        flowRow('整改图片', photoThumbs(row.rectifyPhotos, 'flow-thumbs', 'reform'))
      );
      html += flowNode('review', '整改复核', 'done', reviewTime,
        flowRow('审批结果', '退回') +
        flowRow('复核人', esc(reviewer)) +
        flowRow('核实情况', esc(reviewResult)),
        'returned'
      );
      html += flowNode('reform', '隐患整改', 'current', dash, emptyReformRows + transferRows('隐患整改'));
      html += flowNode('review', '整改复核', 'pending', dash, emptyReviewRows);
      html += flowNode('close', '隐患销号', 'pending', dash,
        flowRow('说明', dash)
      );
    } else {
      var reformPhase;
      var reviewPhase;
      var closePhase = closed ? 'done' : 'pending';
      if (closed) {
        reformPhase = 'done';
        reviewPhase = 'done';
      } else if (status === '待验收') {
        reformPhase = 'done';
        reviewPhase = 'current';
      } else if (status === '整改中' || status === '待整改' || status === '已逾期') {
        reformPhase = 'current';
        reviewPhase = 'pending';
      } else {
        reformPhase = 'pending';
        reviewPhase = 'pending';
      }

      html += flowNode('reform', '隐患整改', reformPhase, showReform ? reformTime : dash,
        flowRow('整改人', showReform ? esc(row.person) : dash) +
        flowRow('整改描述', showReform ? esc(reformDesc) : dash) +
        flowRow('整改图片', showReform ? photoThumbs(row.rectifyPhotos, 'flow-thumbs', 'reform') : dash) +
        (reformPhase === 'current' ? transferRows('隐患整改') : '')
      );

      var reviewRows;
      if (closed) {
        reviewRows =
          flowRow('审批结果', '同意') +
          flowRow('整改完成时间', esc(row.closeTime || reviewTime)) +
          flowRow('核实情况', esc(reviewResult));
      } else if (showReview) {
        reviewRows =
          flowRow('审批结果', dash) +
          flowRow('复核人', esc(reviewer)) +
          flowRow('核实情况', dash);
      } else {
        reviewRows = emptyReviewRows;
      }

      html += flowNode('review', '整改复核', reviewPhase, showReview || closed ? reviewTime : dash,
        reviewRows + (reviewPhase === 'current' ? transferRows('整改复核') : ''));

      html += flowNode('close', '隐患销号', closePhase, closed ? closeTime : dash,
        flowRow('说明', closed ? '隐患已闭环销号' : dash)
      );
    }

    html += '</ul></div></div>';
    return html;
  }

    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());

  function renderTfTags() {

  function renderTfTree() {
    var search = document.getElementById('tfDeptSearch');
    var keyword = search ? search.value.trim() : '';
    var company = tfCompanyName();
    var html = '<div class="check-person-dept' + (tfBrowse === '' ? ' active' : '') + '" data-dept="" title="' + esc(company) + '"><span class="dept-name" style="font-weight:600">' + esc(company) + '</span></div>';
    function renderNodes(nodes, level) {
      (nodes || []).forEach(function(node) {
        if (node.status !== 1) return;
        var selfMatch = !keyword || node.name.indexOf(keyword) !== -1;
        var childMatch = false;
        if (keyword) {
          (function scan(children) {
            (children || []).forEach(function(child) {
              if (child.status !== 1) return;
              if (child.name.indexOf(keyword) !== -1) childMatch = true;
              scan(child.children);
            });
          })(node.children);
        }
        if (keyword && !selfMatch && !childMatch) return;
        var count = tfUsersIn(node.name).length;
        html += '<div class="check-person-dept' + (tfBrowse === node.name ? ' active' : '') + '" style="padding-left:' + (12 + level * 16) + 'px" data-dept="' + esc(node.name) + '" title="' + esc(node.name) + '"><span class="dept-name">' + esc(node.name) + '</span><span class="dept-count">(' + count + ')</span></div>';
        renderNodes(node.children, level + 1);
      });
    }
    var orgRoot = getOrgTree()[0];
    renderNodes(orgRoot && orgRoot.children, 0);
    var tree = document.getElementById('tfTree');
    if (tree) tree.innerHTML = html;
  }

  function renderTfUsers() {
    if (tfBrowse) {
      var browseNode = orgFindNode(tfBrowse);
      if (!browseNode || browseNode.status !== 1) tfBrowse = '';
    }
    var users = tfUsersIn(tfBrowse);
    var label = document.getElementById('tfDeptLabel');
    if (label) label.textContent = tfBrowse || tfCompanyName();
    var html = users.map(function(user) {
      if (user.name === tfCurrentPerson) {
        return '<label class="check-person-user disabled"><input type="checkbox" disabled><span>' + esc(user.name) + '</span><span class="user-phone">' + esc(user.phone) + ' · 当前处理人</span></label>';
      }
      var checked = tfTargetName === user.name;
      return '<label class="check-person-user"><input type="checkbox" data-name="' + esc(user.name) + '"' + (checked ? ' checked' : '') + '><span>' + esc(user.name) + '</span><span class="user-phone">' + esc(user.phone) + '</span></label>';
    }).join('');

  function renderTfPickerBody() {

      panel.innerHTML = '<div class="check-person-cols"><div class="check-person-left"><input class="check-person-search" id="tfDeptSearch" type="text" placeholder="搜索部门"><div class="check-person-tree" id="tfTree"></div></div><div class="check-person-right"><div class="check-person-right-head"><span class="check-person-right-title" id="tfDeptLabel"></span></div><div class="check-person-users" id="tfUsers"></div></div></div>';
    }

  function toggleTfPicker() {

    var willOpen = !panel.classList.contains('open');

  function selectTfUser(name, checked) {
    var user = ENT_USERS.filter(function(item) { return item.name === name; })[0];

  function openTransfer(id) {
    var row = hazards.filter(function(item) { return item.id === id; })[0];
    var cur = row && currentNodeOf(row);
    if (!row || !cur) return;
    transferId = id;
    document.getElementById('tfDesc').textContent = row.desc;
    document.getElementById('tfNode').innerHTML = cur.node === '整改复核'
      ? '<span class="tag tag-orange">整改复核</span>'
      : '<span class="tag tag-red">隐患整改</span>';
    document.getElementById('tfPerson').textContent = cur.person;
    tfCurrentPerson = cur.person;
    tfTargetName = '';
    tfBrowse = '';
    renderTfTags();
    closeTfPanel();
    var candidates = ENT_USERS.filter(function(user) { return user.enabled && user.name !== cur.person; });
    var trigger = document.getElementById('tfTargetTrigger');
    var confirmBtn = document.getElementById('btnConfirmTransfer');
    if (!candidates.length) {
      trigger.classList.add('disabled');
      confirmBtn.disabled = true;
      document.getElementById('tfTargetTip').textContent = '暂无可转交的用户（启用用户中除当前处理人外无其他人）';
    } else {

      document.getElementById('tfTargetTip').textContent = '';
    }
    document.getElementById('tfReason').value = '';
    document.getElementById('tfReasonCount').textContent = '0';

    document.getElementById('modal-hazard-transfer').classList.remove('show');
    transferId = null;
  }

  function confirmTransfer() {
    var row = hazards.filter(function(item) { return item.id === transferId; })[0];
    var cur = row && currentNodeOf(row);
    if (!row || !cur) return;
    var target = tfTargetName;
    var reason = document.getElementById('tfReason').value.trim();
    if (!target) { showToast('请选择转交对象'); return; }
    if (!reason) { showToast('请填写流转原因'); return; }
    /* 固化上报人/复核人派生值，避免整改责任人变更后演示数据漂移 */
    row.reporter = reporterOf(row);
    row.reviewer = reviewerOf(row);
    if (cur.node === '隐患整改') row.person = target;
    else row.reviewer = target;
    if (!row.transfers) row.transfers = [];
    row.transfers.push({ node: cur.node, from: cur.person, to: target, reason: reason, time: nowText() });
    closeTransfer();
    renderList();
    showToast('已流转给' + target);
  }

  /* ========== 批量导出（§6.3.7.3.11，模板依据《安全码2.0系统导出模板设计文档》企业侧隐患记录） ========== */
  var EXPORT_HEADERS = ['企业名称', '领域大类', '领域小类', '所属街道', '所属社区', '所属网格', '管控对象', '检查表名称', '检查内容', '检查时间', '检查人', '检查分类', '隐患类型', '隐患描述', '隐患等级', '隐患照片', '整改方式', '整改人', '整改时间', '整改照片', '整改反馈', '整改依据', '复核人', '复核结果', '复核意见', '复核时间'];

  function exportSourceLabel(source) {
    return source === '日常自查' ? '企业自查' : '政府巡查';
  }

  function exportLevel(level) {
    return level === '重大隐患' ? '重大事故隐患' : level;
  }

  function exportMethod(row) {
    if (row.method !== '限期整改') return row.method;
    var days = Math.round((new Date(row.deadline) - new Date(row.foundAt)) / 86400000);
    return '限期整改（' + days + '天）';
  }

  function regionParts() {
    var profile = window.getEnterpriseProfile ? getEnterpriseProfile() : null;
    var parts = profile && profile.grid ? profile.grid.split('/').map(function(s) { return s.trim(); }) : [];
    return { street: parts[1] || '—', community: parts[2] || '—', grid: parts[3] || '—' };
  }

  function exportFilterRows() {
    var level = document.getElementById('exLevel').value;
    var method = document.getElementById('exMethod').value;
    var person = document.getElementById('exPerson').value;
    var reviewer = document.getElementById('exReviewer').value;
    var source = document.getElementById('exSource').value;
    return matched().filter(function(row) {
      if (level && exportLevel(row.level) !== level) return false;
      if (method && row.method !== method) return false;
      if (person && row.person !== person) return false;
      if (reviewer && reviewerOf(row) !== reviewer) return false;
      if (source && exportSourceLabel(row.source) !== source) return false;
      return true;
    });
  }

  function exportRowValues(row, withPhotos) {
    var region = regionParts();
    var closed = row.status === '已整改';
    var rejected = !!row.reviewRejected;
    var showReform = row.status === '整改中' || row.status === '待验收' || closed || rejected;
    var showReview = row.status === '待验收' || closed || rejected;
    var gov = row.source !== '日常自查';
    var vals = [
      root.name, '—', '—', region.street, region.community, region.grid,
      row.objectName || root.name, '—', '—',
      row.foundAt + ' 10:49',
      gov ? '陈海海（南山街道办）' : reporterOf(row),
      exportSourceLabel(row.source),
      row.hazardType, row.desc, exportLevel(row.level)
    ];
    if (withPhotos) vals.push('');
    vals.push(exportMethod(row), row.person, showReform ? (row.reformTime || row.foundAt + ' 14:24') : '—');
    if (withPhotos) vals.push('');
    vals.push(
      showReform ? (row.reformDesc || '已按要求整改，现场清理到位') : '—',
      '—',
      showReview ? reviewerOf(row) : '—',
      closed ? '同意' : (rejected ? '不同意' : '—'),
      showReview ? (row.reviewResult || (rejected ? '退回重新整改' : '已按要求整改，隐患消除')) : '—',
      showReview ? (row.reviewTime || row.foundAt + ' 16:25') : '—'
    );
    return vals;
  }

  function scopeSummary() {
    var node = findNode(state.selectedId);
    var a = state.applied;
    var parts = [PREFIX[node.type] + '：' + node.name];
    if (a.desc) parts.push('描述含「' + a.desc + '」');
    if (a.status) parts.push('状态=' + a.status);
    if (a.overdue) parts.push(a.overdue === 'yes' ? '超期' : '未超期');
    if (a.start || a.end) parts.push('发现时间 ' + (a.start || '…') + ' 至 ' + (a.end || '…'));
    return parts.join('；');
  }

  /* ========== 导出任务（异步打包：提交→排队→打包→完成→下载，§6.3.7.3.12） ========== */
  var EXPORT_TASKS_KEY = 'sa_hazard_export_tasks';
  var taskTimer = null;

  function loadTasks() {
    try { return JSON.parse(localStorage.getItem(EXPORT_TASKS_KEY)) || []; } catch (err) { return []; }
  }

  function saveTasks(tasks) {
    try { localStorage.setItem(EXPORT_TASKS_KEY, JSON.stringify(tasks)); } catch (err) {}
  }

  function taskActive(t) {
    return t.status === 'queued' || t.status === 'packaging';
  }

  function tickTasks() {
    var tasks = loadTasks();
    var now = Date.now();
    var changed = false;
    tasks.forEach(function(t) {
      if (t.status === 'queued' && now - t.createdAt >= 1000) {
        t.status = 'packaging'; t.progress = 0; changed = true;
      } else if (t.status === 'packaging') {
        t.progress = Math.min(100, Math.round((now - t.createdAt - 1000) / 40));
        if (t.progress >= 100) { t.status = 'completed'; t.completedAt = now; }
        changed = true;
      }
    });
    if (changed) {
      saveTasks(tasks);
      renderTaskBadge();
      if (document.getElementById('modal-export-tasks').classList.contains('show')) renderTaskList();
    }
    if (!tasks.some(taskActive) && taskTimer) { clearInterval(taskTimer); taskTimer = null; }
  }

  function ensureTaskTimer() {
    if (!taskTimer) taskTimer = setInterval(tickTasks, 500);
  }

  function renderTaskBadge() {
    var n = loadTasks().filter(function(t) { return t.status === 'completed' && !t.downloaded; }).length;
    var badge = document.getElementById('taskBadge');
    badge.textContent = n > 99 ? '99+' : String(n);
    badge.classList.toggle('show', n > 0);
  }

  function taskStatusTag(t) {
    if (t.status === 'queued') return '<span class="tag tag-review">排队中</span>';
    if (t.status === 'packaging') return '<span class="tag tag-doing">打包中</span> <span class="task-progress">' + (t.progress || 0) + '%</span>';
    if (t.status === 'completed') return '<span class="tag tag-done">已完成</span>';
    return '<span class="tag tag-pending">失败</span>';
  }

  function renderTaskList() {
    var tasks = loadTasks();
    var box = document.getElementById('taskListBody');
    if (!tasks.length) {
      box.innerHTML = '<div class="ex-task-empty">暂无导出任务</div>';
      return;
    }
    var html = '<table class="ex-task-table"><thead><tr><th>文件名</th><th>条数</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    tasks.forEach(function(t) {
      var action = '';
      if (t.status === 'completed') action += '<button class="btn-link" type="button" data-task-download="' + esc(t.id) + '">下载</button>';
      else if (t.status === 'failed') action += '<button class="btn-link" type="button" data-task-retry="' + esc(t.id) + '">重试</button>';
      action += '<button class="btn-link danger" type="button" data-task-delete="' + esc(t.id) + '">删除</button>';
      html += '<tr><td><div class="task-name" title="' + esc(t.fileName) + '">' + esc(t.fileName) + '</div><div class="task-scope" title="' + esc(t.scope) + '">' + esc(t.scope) + '</div></td>' +
        '<td>' + t.count + '</td><td>' + esc(t.createdAtText) + '</td><td>' + taskStatusTag(t) + '</td><td><div class="task-actions">' + action + '</div></td></tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
  }

  function openTaskList() {
    renderTaskList();
    document.getElementById('modal-export-tasks').classList.add('show');
  }

  function closeTaskList() {
    document.getElementById('modal-export-tasks').classList.remove('show');
  }

  function retryTask(id) {
    var tasks = loadTasks();
    var t = tasks.filter(function(item) { return item.id === id; })[0];
    if (!t || t.status !== 'failed') return;
    t.status = 'queued'; t.progress = 0; t.createdAt = Date.now();
    saveTasks(tasks);
    ensureTaskTimer();
    renderTaskList();
  }

  var pendingDeleteId = null;

  function askDeleteTask(id) {
    var t = loadTasks().filter(function(item) { return item.id === id; })[0];
    if (!t) return;
    pendingDeleteId = id;
    var tip = (t.status === 'queued' || t.status === 'packaging')
      ? '该任务正在处理中，删除将取消打包。'
      : '删除后该任务记录将移除，已下载的文件不受影响。';
    document.getElementById('deleteTaskText').textContent = '确定删除导出任务「' + t.fileName + '」？' + tip;
    document.getElementById('modal-task-delete').classList.add('show');
  }

  function closeDeleteConfirm() {
    document.getElementById('modal-task-delete').classList.remove('show');
    pendingDeleteId = null;
  }

  function confirmDeleteTask() {
    if (!pendingDeleteId) return;
    var tasks = loadTasks().filter(function(item) { return item.id !== pendingDeleteId; });
    saveTasks(tasks);
    closeDeleteConfirm();
    renderTaskBadge();
    renderTaskList();
    showToast('已删除导出任务');
  }

  /* 示意 SVG 转 PNG，供 xlsx 内嵌（ExcelJS 仅支持 jpeg/png/gif） */
  function rasterizeSvg(svg) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        try {
          var c = document.createElement('canvas');
          c.width = 96; c.height = 96;
          c.getContext('2d').drawImage(img, 0, 0, 96, 96);
          resolve(c.toDataURL('image/png'));
        } catch (err) { resolve(null); }
      };
      img.onerror = function() { resolve(null); };
      img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
    });
  }

  /* 由任务快照构建 xlsx（表头冻结加粗、照片内嵌），返回 buffer Promise */
  function buildXlsx(headers, values, withPhotos) {
    var workbook = new ExcelJS.Workbook();
    var ws = workbook.addWorksheet('隐患记录');
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    var headerRow = ws.addRow(headers);
    headerRow.font = { bold: true };
    headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE6F4FF' } };
    headerRow.alignment = { vertical: 'middle' };
    ws.columns.forEach(function(col, i) {
      col.width = headers[i] === '隐患描述' ? 42 : (headers[i].indexOf('照片') >= 0 ? 14 : 16);
    });
    var photoColHazard = headers.indexOf('隐患照片');
    var photoColReform = headers.indexOf('整改照片');
    var reformTimeCol = headers.indexOf('整改时间');
    var tasks = [];
    values.forEach(function(vals, i) {
      var dataRow = ws.addRow(vals);
      dataRow.alignment = { vertical: 'middle', wrapText: true };
      if (!withPhotos) return;
      dataRow.height = 72;
      tasks.push(rasterizeSvg(svgOf('hazard')).then(function(png) {
        if (png) ws.addImage(workbook.addImage({ base64: png, extension: 'png' }), { tl: { col: photoColHazard, row: i + 1 }, ext: { width: 72, height: 72 } });
      }));
      /* 已发生整改（整改时间非「—」）才内嵌整改图 */
      if (reformTimeCol >= 0 && vals[reformTimeCol] !== '—') {
        tasks.push(rasterizeSvg(svgOf('reform')).then(function(png) {
          if (png) ws.addImage(workbook.addImage({ base64: png, extension: 'png' }), { tl: { col: photoColReform, row: i + 1 }, ext: { width: 72, height: 72 } });
        }));
      }
    });
    return Promise.all(tasks).then(function() { return workbook.xlsx.writeBuffer(); });
  }

  function triggerDownload(buffer, fileName) {
    var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  function timeText(d) {
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /* 导出统一生成打包任务（不同步下载），完成后到导出记录下载 */
  function doExport() {
    var rows = exportFilterRows();
    if (!rows.length) { showToast('当前范围暂无隐患记录'); return; }
    var withPhotos = document.getElementById('exPhotos').checked;
    var headers = EXPORT_HEADERS.filter(function(h) {
      return withPhotos || (h !== '隐患照片' && h !== '整改照片');
    });
    var values = rows.map(function(row) { return exportRowValues(row, withPhotos); });
    var d = new Date();
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    var stamp = '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
    var task = {
      id: 'EX' + d.getTime(),
      fileName: '隐患记录_' + root.name + '_' + stamp + '.xlsx',
      scope: scopeSummary(),
      count: rows.length,
      withPhotos: withPhotos,
      headers: headers,
      values: values,
      status: 'queued',
      progress: 0,
      createdAt: d.getTime(),
      createdAtText: timeText(d),
      downloaded: false
    };
    var tasks = loadTasks();
    tasks.unshift(task);
    saveTasks(tasks);
    ensureTaskTimer();
    renderTaskBadge();
    closeExport();
    if (document.getElementById('modal-export-tasks').classList.contains('show')) renderTaskList();
    showToast('已提交打包任务，完成后可在「导出记录」下载');
  }

  function downloadTask(id) {
    var tasks = loadTasks();
    var t = tasks.filter(function(item) { return item.id === id; })[0];
    if (!t || t.status !== 'completed') return;
    buildXlsx(t.headers, t.values, t.withPhotos).then(function(buffer) {
      triggerDownload(buffer, t.fileName);
      t.downloaded = true;
      saveTasks(tasks);
      renderTaskBadge();
      renderTaskList();
      showToast('已开始下载');
    }).catch(function() {
      showToast('下载失败，请重试');
    });
  }

  function bind() {
    document.getElementById('objectTree').addEventListener('click', function(event) {
      var toggle = event.target.closest('[data-toggle]');
      if (toggle) {
        event.stopPropagation();
        var toggled = findNode(toggle.getAttribute('data-toggle'));
        toggled.open = toggled.open === false;
        renderTree();
        return;
      }
      var nodeEl = event.target.closest('.tree-node');
      if (!nodeEl) return;
      state.selectedId = nodeEl.getAttribute('data-id');
      state.page = 1;
      renderTree();
      renderList();
    });
    document.getElementById('treeSearchInput').addEventListener('input', function(event) {
      state.keyword = event.target.value;
      renderTree();
    });
    document.getElementById('btnQuery').addEventListener('click', applyQuery);
    document.getElementById('btnReset').addEventListener('click', resetQuery);
    document.getElementById('recordTable').addEventListener('click', function(event) {
      var viewBtn = event.target.closest('[data-view]');
      if (viewBtn) { openDetail(viewBtn.getAttribute('data-view')); return; }
      var transferBtn = event.target.closest('[data-transfer]');
      if (transferBtn) { openTransfer(transferBtn.getAttribute('data-transfer')); }
    });
    var nameBubble = document.getElementById('nameBubble');
    var recordTable = document.getElementById('recordTable');
    function hideNameBubble() { nameBubble.classList.remove('show'); }
    function placeNameBubble(cell) {
      nameBubble.textContent = cell.textContent;
      nameBubble.classList.add('show');
      var rect = cell.getBoundingClientRect();
      nameBubble.style.left = rect.left + 'px';
      nameBubble.style.top = (rect.bottom + 6) + 'px';
      var bubbleRect = nameBubble.getBoundingClientRect();
      if (bubbleRect.right > window.innerWidth - 8) {
        nameBubble.style.left = Math.max(8, window.innerWidth - bubbleRect.width - 8) + 'px';
      }
      if (bubbleRect.bottom > window.innerHeight - 8) {
        nameBubble.style.top = Math.max(8, rect.top - bubbleRect.height - 6) + 'px';
      }
    }
    recordTable.addEventListener('mouseover', function(event) {
      var clip = event.target.closest('.cell-clip');
      if (!clip || clip.scrollWidth <= clip.clientWidth + 1) {
        hideNameBubble();
        return;
      }
      placeNameBubble(clip);
    });
    recordTable.addEventListener('mouseout', function(event) {
      var clip = event.target.closest('.cell-clip');
      if (!clip) return;
      var next = event.relatedTarget && event.relatedTarget.closest ? event.relatedTarget.closest('.cell-clip') : null;
      if (next !== clip) hideNameBubble();
    });
    recordTable.addEventListener('scroll', hideNameBubble);
    document.getElementById('btnCloseDetail').addEventListener('click', closeDetail);
    document.getElementById('btnFootClose').addEventListener('click', closeDetail);
    document.getElementById('modal-hazard-detail').addEventListener('click', function(event) {
      if (event.target.id === 'modal-hazard-detail') closeDetail();
    });
    document.getElementById('btnCloseTransfer').addEventListener('click', closeTransfer);
    document.getElementById('btnCancelTransfer').addEventListener('click', closeTransfer);
    document.getElementById('btnConfirmTransfer').addEventListener('click', confirmTransfer);
    document.getElementById('modal-hazard-transfer').addEventListener('click', function(event) {
      if (event.target.id === 'modal-hazard-transfer') closeTransfer();
    });
    document.getElementById('tfReason').addEventListener('input', function(event) {
      document.getElementById('tfReasonCount').textContent = String(event.target.value.length);
    });
    document.getElementById('tfTargetTrigger').addEventListener('click', function(event) {
      event.stopPropagation();
      toggleTfPicker();
    });
    document.getElementById('tfTargetTags').addEventListener('click', function(event) {
      if (event.target.closest('[data-clear]')) {
        event.stopPropagation();
        selectTfUser(tfTargetName, false);
      }
    });
    document.getElementById('tfTargetPanel').addEventListener('click', function(event) {
      event.stopPropagation();
      var dept = event.target.closest('[data-dept]');
      if (dept) {
        tfBrowse = dept.getAttribute('data-dept');
        renderTfTree();
        renderTfUsers();
      }
    });
    document.getElementById('tfTargetPanel').addEventListener('change', function(event) {
      var input = event.target.closest('input[data-name]');
      if (input) selectTfUser(input.getAttribute('data-name'), input.checked);
    });
    document.getElementById('tfTargetPanel').addEventListener('input', function(event) {
      if (event.target.id === 'tfDeptSearch') renderTfTree();
    });
    document.addEventListener('click', function() { closeTfPanel(); });
    document.getElementById('btnExport').addEventListener('click', openExport);
    document.getElementById('btnCloseExport').addEventListener('click', closeExport);
    document.getElementById('btnCancelExport').addEventListener('click', closeExport);
    document.getElementById('btnDoExport').addEventListener('click', doExport);
    document.getElementById('modal-hazard-export').addEventListener('click', function(event) {
      if (event.target.id === 'modal-hazard-export') closeExport();
    });
    ['exLevel', 'exMethod', 'exPerson', 'exReviewer', 'exSource'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', updateExportCount);
    });
    document.getElementById('exPhotos').addEventListener('change', function(event) {
      document.getElementById('exPhotosText').textContent = event.target.checked ? '是' : '否';
    });
    document.getElementById('btnTaskList').addEventListener('click', openTaskList);
    document.getElementById('btnCloseTasks').addEventListener('click', closeTaskList);
    document.getElementById('btnFootCloseTasks').addEventListener('click', closeTaskList);
    document.getElementById('modal-export-tasks').addEventListener('click', function(event) {
      if (event.target.id === 'modal-export-tasks') closeTaskList();
    });
    document.getElementById('taskListBody').addEventListener('click', function(event) {
      var dl = event.target.closest('[data-task-download]');
      if (dl) { downloadTask(dl.getAttribute('data-task-download')); return; }
      var retry = event.target.closest('[data-task-retry]');
      if (retry) { retryTask(retry.getAttribute('data-task-retry')); return; }
      var del = event.target.closest('[data-task-delete]');
      if (del) askDeleteTask(del.getAttribute('data-task-delete'));
    });
    document.getElementById('btnCloseDelete').addEventListener('click', closeDeleteConfirm);
    document.getElementById('btnCancelDelete').addEventListener('click', closeDeleteConfirm);
    document.getElementById('btnConfirmDelete').addEventListener('click', confirmDeleteTask);
    document.getElementById('modal-task-delete').addEventListener('click', function(event) {
      if (event.target.id === 'modal-task-delete') closeDeleteConfirm();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Escape') return;
      closeDeleteConfirm();
      closeDetail();
      closeTransfer();
      closeExport();
      closeTaskList();
    });
    window.addEventListener('resize', syncTableScroll);
  }

  function keyplaceDomains() {
    var list = [];
    try {
      var stored = localStorage.getItem('sa_domain_data');
      if (stored) list = JSON.parse(stored);
    } catch (err) {}
    if (!list.length && typeof DOMAIN_TABLE_DATA !== 'undefined') list = DOMAIN_TABLE_DATA;
    return (list || []).filter(function(domain) { return domain.mode === 'special' && String(domain.status) === '1'; });
  }

  /* 与检查记录 / 安全管控对象同源：挂入本企业关联的全部重点场所 */
  function attachKeyplaces() {
    if (typeof loadKeyPlaceData !== 'function' || typeof keyPlaceMatchesEnterprise !== 'function') return;
    var list = [];
    try {
      var stored = localStorage.getItem('sa_domain_data');
      if (stored) list = JSON.parse(stored);
    } catch (err) {}
    if (!list.length && typeof DOMAIN_TABLE_DATA !== 'undefined') list = DOMAIN_TABLE_DATA;
    var store = loadKeyPlaceData(list);
    var entName = root.name;
    var statuses = ['待整改', '整改中', '待验收', '已整改', '已逾期'];
    var foundAts = ['2026-10-27', '2026-10-22', '2026-10-18', '2026-10-11', '2026-09-28'];
    var deadlines = ['2026-11-03', '2026-11-01', '2026-10-30', '2026-10-20', '2026-10-05'];
    var seq = 0;
    keyplaceDomains().forEach(function(domain) {
      var places = (store[domain.id] || []).filter(function(place) {
        return keyPlaceMatchesEnterprise(place, entName);
      });
      if (!places.length) return;
      var group = { id: 'domain-' + domain.id, type: 'domain', name: domain.name, domainId: domain.id, children: [] };
      places.forEach(function(place) {
        group.children.push({ id: place.id, type: 'keyplace', name: place.place_name, domainId: domain.id });
        var status = statuses[seq % statuses.length];
        hazards.push({
          id: 'hkp-' + place.id,
          objectId: place.id,
          objectName: place.place_name,
          desc: place.place_name + '现场存在待闭环隐患',
          hazardType: seq % 2 ? '设备设施' : '现场环境',
          level: seq % 3 === 0 ? '重大隐患' : '一般隐患',
          method: seq % 2 ? '限期整改' : '立即整改',
          person: seq % 2 ? '王五' : '李四',
          status: status,
          overdue: status === '已逾期',
          foundAt: foundAts[seq % foundAts.length],
          deadline: deadlines[seq % deadlines.length],
          source: seq % 2 ? '日常自查' : '政府检查'
        });
        seq += 1;
      });
      root.children.push(group);
    });
  }

  function init() {
    if (!projectMode) {
      var profile = window.getEnterpriseProfile ? getEnterpriseProfile() : null;
      if (profile && profile.name) root.name = profile.name;
      hazards.forEach(function(row) {
        if (row.objectId === 'enterprise') row.objectName = root.name;
      });
      attachKeyplaces();
    }
    indexNodes(root);
    bind();
    renderTree();
    renderList();
    renderTaskBadge();
    if (loadTasks().some(taskActive)) ensureTaskTimer();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
