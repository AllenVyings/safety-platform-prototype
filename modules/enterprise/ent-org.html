<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>企业组织架构管理 - 企业端</title>

<style>
/* .page-container 由 framework.css 提供 */
.main-layout{display:flex;gap: var(--spacing-md);margin-top: var(--spacing-md)}

/* 左侧树 */
.tree-panel{width:260px;background:var(--bg-primary);border-radius: var(--radius-lg);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
.tree-header{padding: var(--spacing-sm) var(--spacing-md);border-bottom:1px solid var(--border-light);font-size: var(--font-size-md);font-weight:600;color:var(--text-primary)}
.tree-search{padding: var(--spacing-sm) var(--spacing-md);border-bottom:1px solid var(--border-light)}
.tree-search input{width:100%;padding:var(--spacing-xs) var(--spacing-sm);border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);outline:none}
.tree-search input:focus{border-color:var(--primary)}
.tree-body{flex:1;overflow-y:auto;padding: var(--spacing-sm) 0}
.tree-node{display:flex;align-items:center;padding:var(--spacing-sm) var(--spacing-md);cursor:pointer;transition:background var(--duration-normal);gap: var(--spacing-xs);line-height:1.6}
.tree-node:hover{background:var(--bg-section-alt)}
.tree-node.active{background:var(--primary-light);color:var(--primary)}
.tree-toggle{width:var(--spacing-md);height:var(--spacing-md);display:flex;align-items:center;justify-content:center;font-size: var(--font-size-xs);color:var(--text-tertiary);cursor:pointer;flex-shrink:0}
.tree-node-label{font-size: var(--font-size-sm);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-children{padding-left: var(--spacing-lg);display:block}

/* 右侧内容 */
.content-panel{flex:1;background:var(--bg-primary);border-radius: var(--radius-lg);box-shadow:0 1px 3px rgba(0,0,0,.06);padding:var(--spacing-lg);overflow:auto}
.content-header{display:flex;justify-content:space-between;align-items:center;margin-bottom: var(--spacing-lg)}
.content-title{font-size: var(--font-size-lg);font-weight:600;color:var(--text-primary)}

/* 查询区 */
.query-bar{display:flex;gap:var(--spacing-sm);margin-bottom: var(--spacing-md);flex-wrap:wrap}
.query-bar input,.query-bar select{padding:var(--spacing-xs) var(--spacing-sm);border:1px solid var(--border);border-radius: var(--radius-md);font-size: var(--font-size-sm);outline:none}
.query-bar input:focus,.query-bar select:focus{border-color:var(--primary)}
.query-bar input{min-width:180px}

/* 表格 - .table-basic 由 framework.css 提供，仅添加页面特有样式 */
.ellipsis-col{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}

/* 分页 - .pagination 由 framework.css 提供 */

/* 按钮 - .btn, .btn-primary, .btn-default, .btn-link, .btn-danger 由 framework.css 提供 */
.btn-sm{padding:var(--spacing-xs) var(--spacing-sm);font-size: var(--font-size-xs)}

/* 弹窗 - .modal-* 由 framework.css 提供 */
.modal-dialog{background:var(--bg-primary);border-radius: var(--radius-lg);width:520px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 var(--spacing-sm) 24px rgba(0,0,0,.12)}

/* 表单 - .form-group, .form-input 由 framework.css 提供 */
.form-group label .required{color:var(--danger);margin-left: 2px}
.duplicate-error{color:var(--danger);font-size: var(--font-size-xs);margin-top: var(--spacing-xs);display:none}
.form-group.has-duplicate .duplicate-error{display:block}

/* Toast */
#_toast{position:fixed;top:var(--spacing-lg);left:50%;transform:translateX(-50%);padding:var(--spacing-sm) var(--spacing-lg);background:var(--text-primary);color:var(--bg-primary);border-radius: var(--radius-md);font-size: var(--font-size-md);z-index:99999;opacity:0;transition:opacity var(--duration-normal);pointer-events:none}

/* 标签 - .tag, .tag-success, .tag-gray 由 framework.css 提供 */
</style>
</head>
<body>
<div class="page-container" data-module="enterprise/ent-org">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">企业端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">组织架构</span>
  </div>

  <div class="main-layout">
    <!-- 左侧部门树 -->
    <div class="tree-panel">
      <div class="tree-header">🏢 企业组织架构</div>
      <div class="tree-search">
        <input type="text" placeholder="搜索部门..." id="treeSearchInput">
      </div>
      <div class="tree-body" id="orgTree"></div>
    </div>

    <!-- 右侧部门列表 -->
    <div class="content-panel">
      <div class="content-header">
        <div class="content-title">部门管理</div>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增部门</button>
      </div>

      <div class="query-bar">
        <input type="text" placeholder="部门名称" id="searchName">
        <select id="searchStatus">
          <option value="">全部状态</option>
          <option value="normal">正常</option>
          <option value="disabled">停用</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="searchDept()">🔍 搜索</button>
        <button class="btn btn-default btn-sm" onclick="showToast('重置')">重置</button>
      </div>

      <div class="table-scroll">
        <table class="table-basic">
          <thead>
            <tr>
              <th>部门名称</th>
              <th>上级部门</th>
              <th>负责人</th>
              <th>人员数量</th>
              <th>状态</th>
              <th class="action-col">操作</th>
            </tr>
          </thead>
          <tbody id="deptTableBody">
            <tr>
              <td>安全部</td>
              <td>公司总部</td>
              <td>王五</td>
              <td><a class="btn-link" onclick="goToUserMgmt('安全部')">5</a></td>
              <td><span class="tag tag-success">正常</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="openEditModal()">编辑</button>
                <button class="btn-link danger" onclick="deleteDept('dept-1','安全部')">删除</button>
              </td>
            </tr>
            <tr>
              <td>技术部</td>
              <td>公司总部</td>
              <td>李四</td>
              <td><a class="btn-link" onclick="goToUserMgmt('技术部')">8</a></td>
              <td><span class="tag tag-success">正常</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="openEditModal()">编辑</button>
                <button class="btn-link danger" onclick="deleteDept('dept-1','技术部')">删除</button>
              </td>
            </tr>
            <tr>
              <td>工程部</td>
              <td>公司总部</td>
              <td>赵六</td>
              <td><a class="btn-link" onclick="goToUserMgmt('工程部')">12</a></td>
              <td><span class="tag tag-gray">停用</span></td>
              <td class="action-col">
                <button class="btn-link" onclick="openEditModal()">编辑</button>
                <button class="btn-link danger" onclick="deleteDept('dept-3','工程部')">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <span class="pg-info">共 3 条</span>
        <select class="pg-size">
          <option value="10" selected>10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="pg" disabled>上一页</button>
        <button class="pg active">1</button>
        <button class="pg" disabled>下一页</button>
        <span class="pg-jump">前往 <input class="pg-jump-input" type="number" min="1" max="1" value="1"> 页</span>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑部门弹窗 -->
<div class="modal-overlay" id="deptModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增部门</span>
      <button class="modal-close" onclick="closeModal('deptModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group" id="fg-deptName">
        <label>部门名称 <span class="required">*</span></label>
        <input type="text" placeholder="请输入部门名称" id="deptName">
        <div class="duplicate-error">该部门名称已存在</div>
      </div>
      <div class="form-group">
        <label>上级部门</label>
        <select id="parentDept">
          <option value="">无（一级部门）</option>
          <option value="1">安全部</option>
          <option value="2">技术部</option>
          <option value="3">工程部</option>
        </select>
      </div>
      <div class="form-group">
        <label>负责人</label>
        <input type="text" placeholder="请输入负责人姓名">
      </div>
      <div class="form-group">
        <label>状态</label>
        <select>
          <option value="normal">正常</option>
          <option value="disabled">停用</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('deptModal')">取消</button>
      <button class="btn btn-primary" onclick="checkDuplicateName();if(!document.getElementById('fg-deptName').classList.contains('has-duplicate')){showToast('保存成功');closeModal('deptModal')}">确定</button>
    </div>
  </div>
</div>

<script>
// 模拟企业部门数据
const deptData = [
  {
    id: 'root',
    name: 'XX建筑工程有限公司',
    type: 'company',
    expanded: true,
    children: [
      {
        id: 'dept-1',
        name: '安全部',
        type: 'dept',
        expanded: false,
        children: [
          { id: 'sub-1', name: '安全一组', type: 'sub-dept' },
          { id: 'sub-2', name: '安全二组', type: 'sub-dept' }
        ]
      },
      {
        id: 'dept-2',
        name: '技术部',
        type: 'dept',
        expanded: false,
        children: [
          { id: 'sub-3', name: '技术一组', type: 'sub-dept' }
        ]
      },
      {
        id: 'dept-3',
        name: '工程部',
        type: 'dept',
        expanded: false,
        children: []
      },
      {
        id: 'dept-4',
        name: '财务部',
        type: 'dept',
        expanded: false,
        children: []
      }
    ]
  }
];

let selectedDeptId = 'root';

function renderDeptTree() {
  const container = document.getElementById('orgTree');
  container.innerHTML = deptData.map(node => renderTreeNode(node, 0)).join('');
}

function renderTreeNode(node, level) {
  const isSelected = node.id === selectedDeptId;
  const hasChildren = node.children && node.children.length > 0;
  const indent = level * 16;
  
  let icon = '🏢';
  if (node.type === 'dept') icon = '📁';
  if (node.type === 'sub-dept') icon = '📂';
  
  let html = '<div class="tree-node ' + (isSelected ? 'active' : '') + '" style="padding-left' + (16 + indent) + 'px" onclick="selectDept(\'' + node.id + '\')">';
  if (hasChildren) {
    html += '<span class="tree-toggle" onclick="event.stopPropagation();toggleDept(\'' + node.id + '\')">' + (node.expanded ? '▼' : '▶') + '</span>';
  } else {
    html += '<span class="tree-toggle"></span>';
  }
  html += '<span class="tree-node-label">' + icon + ' ' + node.name + '</span>';
  html += '</div>';
  
  if (hasChildren && node.expanded) {
    html += '<div class="tree-children">';
    html += node.children.map(child => renderTreeNode(child, level + 1)).join('');
    html += '</div>';
  }
  
  return html;
}

function toggleDept(nodeId) {
  function toggle(nodes) {
    for (const node of nodes) {
      if (node.id === nodeId) {
        node.expanded = !node.expanded;
        return true;
      }
      if (node.children && toggle(node.children)) return true;
    }
    return false;
  }
  toggle(deptData);
  renderDeptTree();
}

function selectDept(nodeId) {
  selectedDeptId = nodeId;
  renderDeptTree();
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = '新增部门';
  document.getElementById('deptModal').style.display = 'flex';
}

function openEditModal() {
  document.getElementById('modalTitle').textContent = '编辑部门';
  document.getElementById('deptModal').style.display = 'flex';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function showToast(msg) {
  var el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(function() { el.style.opacity = '0'; }, 2500);
}

// 初始化
renderDeptTree();

// ===== 跳转用户管理 =====
window.goToUserMgmt = function(deptName) {
  console.log('跳转用户管理，部门：' + deptName);
  showToast('跳转至用户管理 — ' + deptName);
};

// ===== 树搜索过滤 =====
document.getElementById('treeSearchInput').addEventListener('input', function(e) {
  var keyword = e.target.value.trim().toLowerCase();
  var allNodes = document.querySelectorAll('#orgTree .tree-node');
  allNodes.forEach(function(node) {
    var label = node.querySelector('.tree-node-label');
    if (!label) return;
    var text = label.textContent.toLowerCase();
    if (!keyword) {
      node.style.display = '';
    } else {
      node.style.display = text.indexOf(keyword) !== -1 ? '' : 'none';
    }
  });
  if (keyword) {
    allNodes.forEach(function(node) {
      if (node.style.display !== 'none') {
        var parent = node.parentElement;
        while (parent && parent.id !== 'orgTree') {
          if (parent.classList && parent.classList.contains('tree-node')) {
            parent.style.display = '';
          }
          if (parent.classList && parent.classList.contains('tree-children')) {
            parent.style.display = '';
          }
          parent = parent.parentElement;
        }
      }
    });
  }
});

// ===== 同级重名校验 =====
window.checkDuplicateName = function() {
  var nameInput = document.getElementById('deptName');
  var fg = document.getElementById('fg-deptName');
  var name = nameInput.value.trim();
  var parentSel = document.getElementById('parentDept');
  var parentId = parentSel ? parentSel.value : '';

  if (!name) { fg.classList.remove('has-duplicate'); return; }

  function findSiblings(nodes, pid) {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].id === pid) return nodes[i].children || [];
      if (nodes[i].children) {
        var found = findSiblings(nodes[i].children, pid);
        if (found) return found;
      }
    }
    return null;
  }

  var searchIn = parentId ? (findSiblings(deptData, parentId) || deptData[0].children) : deptData[0].children;
  var duplicate = false;
  if (searchIn) {
    for (var j = 0; j < searchIn.length; j++) {
      if (searchIn[j].name === name) { duplicate = true; break; }
    }
  }

  if (duplicate) {
    fg.classList.add('has-duplicate');
  } else {
    fg.classList.remove('has-duplicate');
  }
};

document.getElementById('deptName').addEventListener('input', function() { checkDuplicateName(); });
document.getElementById('parentDept').addEventListener('change', function() { checkDuplicateName(); });

// ===== 删除前校验 =====
window.deleteDept = function(deptId, deptName) {
  function findNode(nodes, id) {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].id === id) return nodes[i];
      if (nodes[i].children) {
        var found = findNode(nodes[i].children, id);
        if (found) return found;
      }
    }
    return null;
  }

  var node = findNode(deptData, deptId);
  if (node && node.children && node.children.length > 0) {
    showToast('该部门存在下级部门，不可删除');
    return;
  }

  var userCounts = { 'dept-1': 5, 'dept-2': 8, 'dept-3': 12, 'dept-4': 3 };
  var userCount = userCounts[deptId] || 0;
  if (userCount > 0) {
    showToast('该部门存在关联人员，请先转移人员');
    return;
  }

  if (confirm('确认删除部门"' + deptName + '"？')) {
    showToast('部门已删除');
  }
};
</script>
<script>
(function() { 'use strict'; const CONFIG = { moduleId: 'ent-org', moduleName: '企业组织架构管理' }; let state = { initialized: false }; function init() { if (state.initialized) return; console.log('[' + CONFIG.moduleId + '] 模块初始化'); state.initialized = true; } if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); } window.destroyModule = function() { console.log('[' + CONFIG.moduleId + '] 模块销毁'); state.initialized = false; }; })();
</script>
<script src="../../js/annotations.js"></script>
</body>
</html>
