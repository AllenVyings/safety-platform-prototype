<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管控档案 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    .page { padding: 20px 24px; background: var(--bg-page); min-height: 100vh; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--bg-primary);
      padding: var(--spacing-md) 20px;
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .page-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .page-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    /* 统计卡 */
    .stats-row { margin-bottom: 16px; }

    /* 分屏布局 */
    .split-view { display: flex; gap: 16px; }

    /* 左树 */
    .tree-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-primary);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      align-self: flex-start;
      overflow: hidden;
    }
    .tree-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-section);
    }
    .tree-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .tree-toolbar { display: flex; gap: 6px; }
    .icon-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--border-card);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
    .tree-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-section);
    }
    .tree-search input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border-card);
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .tree-body {
      max-height: 620px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .tree-node {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
      font-size: 13px;
    }
    .tree-node:hover { background: var(--bg-section); }
    .tree-node.active {
      background: #e6f4ff;
      color: var(--primary);
      font-weight: 500;
    }
    .tree-node.level-1 { padding-left: 12px; font-weight: 500; }
    .tree-node.level-2 { padding-left: 32px; }
    .tree-node.level-3 { padding-left: 52px; }
    .tree-toggle {
      width: 16px;
      display: inline-block;
      text-align: center;
      color: #999;
      font-size: 10px;
      transition: transform 0.15s;
      margin-right: 0;
    }
    .tree-toggle.expanded { transform: rotate(90deg); }
    .tree-toggle.leaf { visibility: hidden; }
    .tree-icon { margin-right: 6px; font-size: 14px; }
    .tree-count {
      margin-left: auto;
      font-size: 11px;
      color: #999;
      background: #f5f5f5;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .tree-children.collapsed { display: none; }

    /* 右侧详情 */
    .detail-panel {
      flex: 1;
      background: var(--bg-primary);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
      min-width: 0;
    }
    .detail-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .detail-breadcrumb {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .detail-body { padding: 16px 20px; }

    /* 筛选栏 */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md) 20px;border:1px solid var(--border-section);margin-bottom:var(--spacing-md)}
    .filter-card .filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:transparent}
    .filter-card .filter-item{display:flex;align-items:center;gap:6px}
    .filter-card .filter-bar select,.filter-card .filter-bar input{width:240px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box}
    .filter-bar select,
    .filter-bar input {
      padding: 6px 10px;
      border: 1px solid var(--border-card);
      border-radius: 4px;
      font-size: 13px;
      background: #fff;
    }
    .filter-bar input[type="search"] { width: 200px; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border-section); }
    th { background: var(--bg-section); color: var(--text-secondary); font-weight: 500; }
    tbody tr:hover { background: var(--bg-section); }

    /* 对象名称超长截断 */
    .obj-name {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* 对象类型标签 */
    .type-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 500;
    }
    .type-tag.enterprise { background: #e6f4ff; color: #1890ff; }
    .type-tag.project { background: #fff7e6; color: #fa8c16; }
    .type-tag.keyplace { background: #f9f0ff; color: #722ed1; }

    /* 安全码状态 */
    .code-cell {
      display: inline-flex;
      align-items: center;
      cursor: help;
    }
    .qrcode-icon {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
    }
    .code-cell.green .qrcode-icon { color: var(--success); }
    .code-cell.yellow .qrcode-icon { color: var(--warning); }
    .code-cell.red .qrcode-icon { color: var(--danger); }

    /* 监管责任人 */
    .resp-unconfig { color: #ff4d4f; font-size: 13px; }

    /* 操作链接 */
    .action-link { color: var(--primary); font-size: 13px; cursor: pointer; }
    .action-link:hover { text-decoration: underline; }

    /* 分页 */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--border-section);
      font-size: 13px;
      color: var(--text-secondary);
    }
    .pagination .pages { display: flex; gap: 4px; }
    .pagination .page-btn {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border-card);
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .pagination .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pagination .page-btn:hover:not(.active) { color: var(--primary); border-color: var(--primary); }

    /* ===== 详情弹窗 ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45); z-index: 9998;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-dialog {
      background: var(--bg-primary); border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18); width: 780px; max-height: 88vh;
      display: flex; flex-direction: column; animation: modalIn 0.25s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--border-section);
    }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .modal-close {
      width: 28px; height: 28px; border: none; background: transparent;
      font-size: 20px; color: var(--text-tertiary); cursor: pointer;
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--bg-section); color: var(--text-primary); }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 24px; border-top: 1px solid var(--border-section);
    }

    /* 详情分区 */
    .detail-section { margin-bottom: 24px; }
    .detail-section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 12px; padding-bottom: 6px;
      border-bottom: 2px solid var(--primary); display: inline-block;
    }
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    .info-item {
      display: flex; padding: 8px 0; border-bottom: 1px solid var(--border-section);
    }
    .info-label {
      width: 90px; flex-shrink: 0; color: var(--text-secondary); font-size: 13px;
    }
    .info-value { flex: 1; font-size: 13px; color: var(--text-primary); min-width: 0; overflow-wrap: break-word; }

    /* 安全码大码色 */
    .code-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 6px; font-size: 14px; font-weight: 600;
    }
    .code-badge.green { background: var(--success-light); color: var(--success); border: 1px solid #b7eb8f; }
    .code-badge.yellow { background: var(--warning-light); color: var(--warning); border: 1px solid #ffe58f; }
    .code-badge.red { background: var(--danger-light); color: var(--danger); border: 1px solid #ffccc7; }

    /* 变更历史小时间轴 */
    .change-history { margin-top: 12px; padding-left: 16px; border-left: 2px solid var(--border-section); }
    .change-item { position: relative; padding: 0 0 14px 16px; font-size: 13px; }
    .change-item:last-child { padding-bottom: 0; }
    .change-item::before {
      content: ''; position: absolute; left: -22px; top: 5px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--primary); border: 2px solid var(--bg-primary);
      box-shadow: 0 0 0 2px #e6f4ff;
    }
    .change-item.warn::before { background: var(--warning); box-shadow: 0 0 0 2px var(--warning-light); }
    .change-item.error::before { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-light); }
    .change-item.done::before { background: var(--success); box-shadow: 0 0 0 2px var(--success-light); }
    .change-time { color: var(--text-tertiary); font-size: 12px; }
    .change-text { color: var(--text-primary); margin-top: 2px; }

    /* 子表 */
    .sub-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .sub-table th { background: var(--bg-section); padding: 8px 12px; font-size: 12px; font-weight: 500; color: var(--text-secondary); text-align: left; border-bottom: 1px solid var(--border-section); }
    .sub-table td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--border-section); color: var(--text-primary); }
    .sub-table tbody tr:hover { background: var(--bg-section); }
    .sub-table .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; }
    .sub-table .tag-green { background: var(--success-light); color: var(--success); }
    .sub-table .tag-yellow { background: var(--warning-light); color: var(--warning); }
    .sub-table .tag-red { background: var(--danger-light); color: var(--danger); }
    .sub-table .tag-blue { background: var(--primary-light); color: var(--primary); }
    .sub-table .tag-gray { background: #f5f5f5; color: #999; }
    .sub-table .empty-row td { text-align: center; color: var(--text-tertiary); padding: 24px 0; }

    /* 行展开 */
    .expand-toggle {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 12px;
      margin-right: 4px;
      transition: transform 0.15s;
      display: inline-block;
      width: 16px;
      text-align: center;
    }
    .expand-toggle:hover { color: var(--primary); }
    .expand-toggle.expanded { transform: rotate(90deg); }
    tr.archive-row { cursor: pointer; }
    tr.archive-row:hover { background: var(--bg-section); }
    tr.sub-row { display: none; }
    tr.sub-row.show { display: table-row; }
    tr.sub-row td { padding: 0; background: #fafafa; }
    .sub-row-content { padding: 8px 12px 8px 48px; }
    .sub-row-content .sub-table { margin-top: 0; }

    /* 重点场所状态标签 */
    .status-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 12px;
    }
    .status-tag.enabled { background: var(--success-light); color: var(--success); }
    .status-tag.disabled { background: var(--bg-secondary); color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div class="page-container" data-module="government/control-archive">
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">政府端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">管控档案</span>
    </div>
  <div class="page">
    <div class="page-header">
      <div>
        <div class="page-title">管控档案</div>
        <div class="page-subtitle">以领域为入口向下钻取管控对象信息</div>
      </div>
    </div>

    <!-- 统计卡 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">管控对象总数</div>
          <div class="stat-value">486</div>
        </div>
        <div class="stat-indicator" style="background: var(--primary);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">企业</div>
          <div class="stat-value">126</div>
        </div>
        <div class="stat-indicator" style="background: var(--primary);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">项目</div>
          <div class="stat-value">238</div>
        </div>
        <div class="stat-indicator" style="background: var(--warning);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">重点场所</div>
          <div class="stat-value">122</div>
        </div>
        <div class="stat-indicator" style="background: var(--accent);"></div>
      </div>
    </div>

    <div class="split-view">
      <!-- 左树 -->
      <div class="tree-panel">
        <div class="tree-header">
          <div class="tree-title">行业 / 领域</div>
          <div class="tree-toolbar">
            <button class="icon-btn" title="展开全部" onclick="expandAll()">⊞</button>
            <button class="icon-btn" title="折叠全部" onclick="collapseAll()">⊟</button>
          </div>
        </div>
        <div class="tree-search">
          <input type="search" placeholder="搜索行业 / 领域">
        </div>
        <div class="tree-body" id="treeBody">
          <!-- 由 JS 渲染 -->
        </div>
      </div>

      <!-- 右侧详情 -->
      <div class="detail-panel">
        <div class="detail-header">
          <div>
            <div class="detail-title" id="detailTitle">
              <span>📊</span>
              <span>全部管控档案</span>
              <span class="type-tag enterprise" id="detailCount">486 条</span>
            </div>
            <div class="detail-breadcrumb" id="detailBreadcrumb">XX 区应急管理局 / 全部行业 / 全部领域</div>
          </div>
        </div>

        <div class="detail-body">
          <!-- 筛选 -->
          <div class="filter-card"><div class="filter-bar">
            <select id="filterType">
              <option value="">全部对象类型</option>
              <option value="enterprise">企业</option>
              <option value="project">项目</option>
              <option value="keyplace">重点场所</option>
            </select>
            <select id="filterCode">
              <option value="">全部安全码状态</option>
              <option value="green">绿码</option>
              <option value="yellow">黄码</option>
              <option value="red">红码</option>
            </select>
            <input type="search" id="filterSearch" placeholder="搜索对象名称">
            <button class="btn btn-primary" onclick="applyFilters()">查询</button>
            <button class="btn" onclick="resetFilters()">重置</button>
          </div></div>

          <!-- 主表格 -->
          <table>
            <thead id="archiveThead">
              <tr>
                <th>对象名称</th>
                <th>对象类型</th>
                <th>安全码状态</th>
                <th>监管责任人</th>
                <th>上次检查日期</th>
                <th style="width: 80px;">操作</th>
              </tr>
            </thead>
            <tbody id="archiveTbody">
              <!-- 由 JS 渲染 -->
            </tbody>
          </table>

          <!-- 分页 -->
          <div class="pagination">
            <span>共 486 条，当前显示 1 - 10 条</span>
            <div class="pages">
              <button class="page-btn">‹</button>
              <button class="page-btn active">1</button>
              <button class="page-btn">2</button>
              <button class="page-btn">3</button>
              <button class="page-btn">...</button>
              <button class="page-btn">49</button>
              <button class="page-btn">›</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 查看详情弹窗 ===== -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">管控档案详情</span>
        <button class="modal-close" onclick="closeDetail()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 由 JS 动态渲染 -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeDetail()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>'"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
    var QR_ICON_SVG='<svg class="qrcode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="14"/><line x1="21" y1="14" x2="21" y2="14"/><line x1="14" y1="21" x2="14" y2="21"/><line x1="21" y1="21" x2="21" y2="21"/><line x1="17" y1="14" x2="17" y2="17"/><line x1="14" y1="17" x2="17" y2="17"/><line x1="17" y1="20" x2="20" y2="20"/><line x1="20" y1="17" x2="20" y2="20"/></svg>';
    function getCodeLabel(cs) { return cs === 'red' ? '红码' : cs === 'yellow' ? '黄码' : '绿码'; }
    /* ==================== 树数据 ==================== */
    const TREE_DATA = [
      {
        id: 'root', name: 'XX 区应急管理局', icon: '🏛', count: 486, level: 1, expanded: true,
        children: [
          {
            id: 'chem', name: '危险化学品', icon: '⚗️', count: 128, level: 2, expanded: true,
            children: [
              { id: 'chem-storage', name: '危化品储存', icon: '📦', count: 42, level: 3 },
              { id: 'chem-prod', name: '危化品生产', icon: '🏭', count: 36, level: 3 },
              { id: 'chem-trans', name: '危化品运输', icon: '🚛', count: 28, level: 3 },
              { id: 'chem-use', name: '危化品使用', icon: '⚗️', count: 22, level: 3 }
            ]
          },
          {
            id: 'fire', name: '消防安全', icon: '🔥', count: 86, level: 2, expanded: false,
            children: [
              { id: 'fire-facility', name: '消防设施', icon: '🚒', count: 48, level: 3 },
              { id: 'fire-exit', name: '疏散通道', icon: '🚪', count: 22, level: 3 },
              { id: 'fire-electrical', name: '电气消防', icon: '⚡', count: 16, level: 3 }
            ]
          },
          {
            id: 'industrial', name: '工贸行业', icon: '🏭', count: 96, level: 2, expanded: false,
            children: [
              { id: 'industrial-special', name: '特种设备', icon: '⚙️', count: 38, level: 3 },
              { id: 'industrial-confined', name: '有限空间', icon: '🕳️', count: 26, level: 3 },
              { id: 'industrial-hot', name: '动火作业', icon: '🔥', count: 32, level: 3 }
            ]
          },
          {
            id: 'construction', name: '建筑施工', icon: '🏗️', count: 98, level: 2, expanded: false,
            children: [
              { id: 'construction-site', name: '施工现场', icon: '🚧', count: 52, level: 3 },
              { id: 'construction-equip', name: '施工机械', icon: '🏗️', count: 46, level: 3 }
            ]
          },
          {

    /* ==================== 渲染左树 ==================== */
    function renderTree() {
      const html = TREE_DATA.map(n => renderTreeNode(n)).join('');
      document.getElementById('treeBody').innerHTML = html;
      bindTreeEvents();
    }

    function renderTreeNode(node, parentMode) {
      const hasChildren = node.children && node.children.length > 0;
      const toggleClass = hasChildren ? (node.expanded ? 'expanded' : '') : 'leaf';
      const childrenClass = node.expanded ? '' : 'collapsed';
      const mode = node.mode || parentMode || 'default';
      let html = `
        <div class="tree-node level-${node.level}" data-id="${node.id}" data-name="${escapeHtml(node.name)}" data-mode="${mode}">
          <span class="tree-toggle ${toggleClass}">▶</span>
          <span class="tree-icon">${node.icon}</span>
          <span>${escapeHtml(node.name)}</span>
          <span class="tree-count">${node.count}</span>
        </div>
      `;
      if (hasChildren) {
        html += `<div class="tree-children ${childrenClass}">`;
        node.children.forEach(c => { html += renderTreeNode(c, mode); });
        html += `</div>`;
      }
      return html;
    }

    function bindTreeEvents() {
      document.querySelectorAll('.tree-toggle').forEach(t => {
        t.addEventListener('click', (e) => {
          e.stopPropagation();
          if (t.classList.contains('leaf')) return;
          t.classList.toggle('expanded');
          const children = t.closest('.tree-node').nextElementSibling;
          if (children && children.classList.contains('tree-children')) {
            children.classList.toggle('collapsed');
          }
        });
      });
      document.querySelectorAll('.tree-node').forEach(n => {
        n.addEventListener('click', () => {
          document.querySelectorAll('.tree-node').forEach(x => x.classList.remove('active'));
          n.classList.add('active');
          const name = n.dataset.name;
          const count = n.querySelector('.tree-count').textContent;
          // Build breadcrumb path
          const path = [];
          let cur = n;
          while (cur) {
            if (cur.classList && cur.classList.contains('tree-node')) {
              path.unshift(cur.dataset.name);
            }
            const parent = cur.parentElement;
            if (parent && parent.classList.contains('tree-children')) {
              cur = parent.previousElementSibling;
            } else {
              break;
            }
          }
          const bcText = path.length <= 1
            ? 'XX 区应急管理局 / 全部行业'
            : 'XX 区应急管理局 / ' + path.slice(1).join(' / ');
          document.querySelector('#detailTitle span:nth-child(2)').textContent = name;
          document.getElementById('detailBreadcrumb').textContent = bcText;
          document.getElementById('detailCount').textContent = count + ' 条';
          currentMode = n.dataset.mode || 'default';
          applyFilters();
        });
      });
    }

    function expandAll() {
      document.querySelectorAll('.tree-toggle').forEach(t => {
        if (!t.classList.contains('leaf')) t.classList.add('expanded');
      });
      document.querySelectorAll('.tree-children').forEach(c => c.classList.remove('collapsed'));
    }
    function collapseAll() {
      document.querySelectorAll('.tree-toggle').forEach(t => t.classList.remove('expanded'));
      document.querySelectorAll('.tree-children').forEach(c => c.classList.add('collapsed'));
    }

      const tbody = document.getElementById('archiveTbody');
      let html = '';
      data.forEach(row => {
        const statusCls = row.status === '启用' ? 'enabled' : 'disabled';
        const enterpriseHtml = row.enterprise
          ? escapeHtml(row.enterprise)
          : '<span style="color: var(--text-tertiary);">—</span>';
        html += `
          <tr>
            <td><span class="action-link" onclick="viewDetail('${escapeHtml(row.id)}')">${escapeHtml(row.name)}</span></td>
            <td><span class="type-tag keyplace">${escapeHtml(row.domain)}</span></td>
            <td>${escapeHtml(row.address)}</td>
            <td>${enterpriseHtml}</td>
            <td><span class="code-cell ${row.codeStatus}">${QR_ICON_SVG}${escapeHtml(row.codeName)}</span></td>
            <td><span class="status-tag ${statusCls}">${escapeHtml(row.status)}</span></td>
            <td><span class="action-link" onclick="viewDetail('${escapeHtml(row.id)}')">查看详情</span></td>
          </tr>`;
      });
      tbody.innerHTML = html;
    }

    function viewDetail(id) {
      const row = ARCHIVE_DATA.find(r => r.id === id);
      const detail = DETAIL_MAP[id];
      if (!row) return;

      document.getElementById('modalTitle').textContent = row.name + ' - 管控档案详情';

      let html = '';

      // ---- 1. 基础信息 ----
      html += '<div class="detail-section">';
      html += '<div class="section-title">基础信息</div>';
      html += '<div class="info-grid">';
      html += infoItem('对象名称', row.name);
      html += infoItem('对象类型', '<span class="type-tag ' + row.type + '">' + row.typeName + '</span>');
      if (detail) {
        html += infoItem('编码', detail.code);
        html += infoItem('地址', detail.address);
      }
      html += infoItem('监管责任人', row.responsible || '<span class="resp-unconfig">未配置</span>');
      html += infoItem('上次检查日期', row.lastCheck);
      html += '</div></div>';

      if (detail) {
        // ---- 2. 安全码信息 ----
        html += '<div class="detail-section">';
        html += '<div class="section-title">安全码信息</div>';
        html += '<div style="margin-bottom: 8px;"><span class="code-badge ' + row.codeStatus + '">';
        html += QR_ICON_SVG;
        html += '当前：' + row.codeName + '</span></div>';
        html += '<div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">码色变更历史</div>';
        html += '<div class="change-history">';
        detail.codeHistory.forEach(c => {
          html += '<div class="change-item ' + (c.type || '') + '">';
          html += '<div class="change-time">' + c.time + '</div>';
          html += '<div class="change-text">' + c.text + '</div>';
          html += '</div>';
        });
        html += '</div></div>';

        // ---- 3. 检查记录 ----
        html += '<div class="detail-section">';
        html += '<div class="section-title">检查记录</div>';
        if (detail.inspections.length === 0) {
          html += '<div style="color: var(--text-tertiary); font-size: 13px; padding: 12px 0;">暂无检查记录</div>';
        } else {
          html += '<table class="sub-table"><thead><tr><th>检查日期</th><th>检查类型</th><th>检查结果</th><th>检查人</th></tr></thead><tbody>';
          detail.inspections.forEach(ins => {
            const resCls = ins.result === '合格' ? 'tag-green' : (ins.result === '不合格' ? 'tag-red' : 'tag-yellow');
            html += '<tr><td>' + ins.date + '</td><td>' + ins.type + '</td>';
            html += '<td><span class="tag ' + resCls + '">' + ins.result + '</span></td>';
            html += '<td>' + ins.inspector + '</td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';

        // ---- 4. 隐患记录 ----
        html += '<div class="detail-section">';
        html += '<div class="section-title">隐患记录</div>';
        if (detail.hazards.length === 0) {
          html += '<div style="color: var(--text-tertiary); font-size: 13px; padding: 12px 0;">暂无隐患记录</div>';
        } else {
          html += '<table class="sub-table"><thead><tr><th>隐患编号</th><th>隐患描述</th><th>隐患等级</th><th>状态</th></tr></thead><tbody>';
          detail.hazards.forEach(h => {
            const lvlCls = h.level === '重大隐患' ? 'tag-red' : 'tag-yellow';
            const stCls = h.status === '已整改' ? 'tag-green' : (h.status === '已超期' ? 'tag-red' : (h.status === '待复核' ? 'tag-yellow' : 'tag-blue'));
            html += '<tr><td>' + h.id + '</td><td>' + h.desc + '</td>';
            html += '<td><span class="tag ' + lvlCls + '">' + h.level + '</span></td>';
            html += '<td><span class="tag ' + stCls + '">' + h.status + '</span></td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';

        // ---- 5. 关联对象 ----
        html += '<div class="detail-section">';
        html += '<div class="section-title">关联对象</div>';
        if (detail.children.length === 0) {
          html += '<div style="color: var(--text-tertiary); font-size: 13px; padding: 12px 0;">暂无关联对象</div>';
        } else {
          html += '<table class="sub-table"><thead><tr><th>对象名称</th><th>对象类型</th><th>安全码</th></tr></thead><tbody>';
          detail.children.forEach(c => {
            const codeDotCls = c.code === '绿码' ? 'green' : (c.code === '红码' ? 'red' : 'yellow');
            html += '<tr><td>' + c.name + '</td><td>' + c.type + '</td>';
            html += '<td><span class="code-cell ' + codeDotCls + '">' + QR_ICON_SVG + c.code + '</span></td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';
      }

      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('detailModal').classList.add('show');
    }

    function infoItem(label, value) {
      return '<div class="info-item"><span class="info-label">' + label + '</span><span class="info-value">' + value + '</span></div>';
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
    }

    // 点击遮罩关闭弹窗
    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    /* ==================== 筛选逻辑 ==================== */
    function applyFilters() {
      const typeVal = document.getElementById('filterType').value;
      const codeVal = document.getElementById('filterCode').value;
      const searchVal = document.getElementById('filterSearch').value.trim().toLowerCase();

      if (currentMode === 'keyplace') {
        let filtered = KEYPLACE_DATA;
        if (codeVal) {
          filtered = filtered.filter(r => r.codeStatus === codeVal);
        }
        if (searchVal) {
          filtered = filtered.filter(r => r.name.toLowerCase().includes(searchVal));
        }
        renderKeyplaceRows(filtered);
      } else {
        let filtered = ARCHIVE_DATA;
        if (typeVal) {
          filtered = filtered.filter(r => r.type === typeVal);
        }
        if (codeVal) {
          filtered = filtered.filter(r => r.codeStatus === codeVal);
        }
        if (searchVal) {
          filtered = filtered.filter(r => r.name.toLowerCase().includes(searchVal));
        }
        renderArchiveRows(filtered);
      }
    }

    function resetFilters() {
      document.getElementById('filterType').value = '';
      document.getElementById('filterCode').value = '';
      document.getElementById('filterSearch').value = '';
      if (currentMode === 'keyplace') {
        renderKeyplaceRows(KEYPLACE_DATA);
      } else {
        renderArchiveRows(ARCHIVE_DATA);
      }
    }

    /* ==================== 初始化 ==================== */
    document.addEventListener('DOMContentLoaded', () => {
      renderTree();
      renderArchiveRows(ARCHIVE_DATA);
    });
  </script>
  <script src="../../js/annotations.js"></script>
</body>
</html>
