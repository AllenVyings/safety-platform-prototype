<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管控档案 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ===== 左树面板 ===== */
    .tree-panel {
      width: 280px; flex-shrink: 0;
      background: var(--bg-primary); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .tree-header {
      padding: var(--spacing-md) 14px;
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-section);
    }
    .tree-title { font-size: var(--font-size-md); font-weight: 600; color: var(--text-primary); }
    .tree-toolbar { display: flex; gap: var(--spacing-xs); }
    .icon-btn {
      width: 24px; height: 24px;
      border: 1px solid var(--border-card); border-radius: var(--radius-sm);
      background: #fff; cursor: pointer; font-size: var(--font-size-xs);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-secondary);
    }
    .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
    .tree-search-box {
      padding: var(--spacing-sm-plus) var(--spacing-md);
      border-bottom: 1px solid var(--border-section);
    }
    .tree-search-box input {
      width: 100%; padding: var(--spacing-xs) 10px;
      border: 1px solid var(--border-card); border-radius: var(--radius-sm);
      font-size: var(--font-size-sm); box-sizing: border-box;
    }
    .tree-body {
      flex: 1; overflow-y: auto;
      padding: var(--spacing-sm) 0;
    }
    .tree-node {
      display: flex; align-items: center;
      padding: var(--spacing-sm) var(--spacing-md); cursor: pointer;
      transition: all var(--duration-fast); user-select: none; font-size: var(--font-size-sm);
    }
    .tree-node:hover { background: var(--bg-hover); }
    .tree-node.active { background: var(--primary-light); color: var(--primary); }
    .tree-toggle {
      width: 20px; display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-xs); color: var(--text-secondary); cursor: pointer;
      transition: transform var(--duration-normal); flex-shrink: 0;
    }
    .tree-toggle.expanded { transform: rotate(90deg); }
    .tree-toggle.leaf { visibility: hidden; }
    .tree-node-icon { margin: 0 6px; font-size: var(--font-size-md); flex-shrink: 0; }
    .tree-node-label {
      font-size: var(--font-size-sm); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .tree-count {
      margin-left: auto; font-size: 11px; color: var(--text-secondary);
      background: var(--bg-section); padding: 1px 6px; border-radius: var(--radius-lg); flex-shrink: 0;
    }
    .tree-children.collapsed { display: none; }

    /* ===== 右面板 ===== */
    .detail-panel {
      flex: 1; display: flex; flex-direction: column;
      gap: var(--spacing-md); overflow: hidden; min-width: 0;
    }
    .card {
      background: var(--bg-primary); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); flex-shrink: 0;
    }
    .detail-header {
      padding: var(--spacing-md-plus) 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .detail-title {
      font-size: var(--font-size-lg); font-weight: 600; color: var(--text-primary);
      display: flex; align-items: center; gap: var(--spacing-sm-plus);
    }
    .detail-breadcrumb {
      font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: var(--spacing-xs);
    }

    /* ===== 筛选卡片 ===== */
    .detail-panel .stats-row { margin-bottom: 0; }
    .filter-card {
      background: var(--bg-primary); border-radius: var(--radius-lg);
      padding: 30px; border: 1px solid var(--border-section);
      box-shadow: var(--shadow-sm);
    }
    .filter-card .filter-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 20px 30px;
      background: transparent; padding: 0; border: none; margin-bottom: 0;
    }
    .filter-card .filter-item { display: flex; align-items: center; gap: var(--spacing-xs); }
    .filter-card .filter-bar select,
    .filter-card .filter-bar input {
      width: 240px; height: 32px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-size: var(--font-size-sm); box-sizing: border-box;
    }
    .filter-card .filter-bar select:focus,
    .filter-card .filter-bar input:focus {
      border-color: var(--primary); outline: none;
    }

    /* ===== 表格卡片 ===== */
    .table-card {
      flex: 1; display: flex; flex-direction: column;
      background: var(--bg-primary); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-header); overflow: hidden;
    }
    .table-container { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: var(--spacing-sm-plus) var(--spacing-md); text-align: left; font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-section); }
    th { background: var(--bg-section); color: var(--text-secondary); font-weight: 500; }
    tbody tr:hover { background: var(--bg-section); }

    /* ===== 对象名称截断 ===== */
    .obj-name {
      max-width: 220px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      color: var(--text-primary); font-weight: 500;
    }

    /* ===== 对象类型标签 ===== */
    .type-tag {
      display: inline-block; padding: 2px 10px; border-radius: var(--radius-sm);
      font-size: var(--font-size-xs); font-weight: 500;
    }
    .type-tag.enterprise { background: #e6f4ff; color: #1890ff; }
    .type-tag.project { background: #fff7e6; color: #fa8c16; }
    .type-tag.keyplace { background: #f9f0ff; color: #722ed1; }

    /* ===== 安全码状态 ===== */
    .code-cell { display: inline-flex; align-items: center; cursor: help; }
    .qrcode-icon { width: 20px; height: 20px; color: var(--text-secondary); }
    .code-cell.green .qrcode-icon { color: var(--success); }
    .code-cell.yellow .qrcode-icon { color: var(--warning); }
    .code-cell.red .qrcode-icon { color: var(--danger); }

    /* ===== 监管责任人 ===== */
    .resp-unconfig { color: #ff4d4f; font-size: var(--font-size-sm); }

    /* ===== 操作链接 ===== */
    .action-link { color: var(--primary); font-size: var(--font-size-sm); cursor: pointer; }
    .action-link:hover { text-decoration: underline; }

    /* ===== 详情弹窗 ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45); z-index: 9998;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-dialog {
      background: var(--bg-primary); border-radius: var(--radius-xl);
      box-shadow: 0 8px 40px rgba(0,0,0,0.18); width: 780px; max-height: 88vh;
      display: flex; flex-direction: column; animation: modalIn 0.25s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(calc(-1 * var(--spacing-md))); } to { opacity: 1; transform: translateY(0); } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--border-section);
    }
    .modal-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--text-primary); }
    .modal-close {
      width: 28px; height: 28px; border: none; background: transparent;
      font-size: 20px; color: var(--text-tertiary); cursor: pointer;
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--bg-section); color: var(--text-primary); }
    .modal-body { padding: var(--spacing-md) var(--spacing-lg); overflow-y: auto; flex: 1; }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: var(--spacing-sm);
      padding: var(--spacing-md) var(--spacing-lg); border-top: 1px solid var(--border-section);
    }

    /* 详情分区 */
    .detail-section { margin-bottom: var(--spacing-lg); }
    .detail-section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: var(--font-size-md); font-weight: 600; color: var(--text-primary);
      margin-bottom: var(--spacing-md); padding-bottom: 6px;
      border-bottom: 2px solid var(--primary); display: inline-block;
    }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .info-item {
      display: flex; padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--border-section);
    }
    .info-label { width: 90px; flex-shrink: 0; color: var(--text-secondary); font-size: var(--font-size-sm); }
    .info-value { flex: 1; font-size: var(--font-size-sm); color: var(--text-primary); min-width: 0; overflow-wrap: break-word; }

    /* 安全码大码色 */
    .code-badge {
      display: inline-flex; align-items: center; gap: var(--spacing-sm);
      padding: var(--spacing-xs) 16px; border-radius: var(--radius-md); font-size: var(--font-size-md); font-weight: 600;
    }
    .code-badge.green { background: var(--success-light); color: var(--success); border: 1px solid #b7eb8f; }
    .code-badge.yellow { background: var(--warning-light); color: var(--warning); border: 1px solid #ffe58f; }
    .code-badge.red { background: var(--danger-light); color: var(--danger); border: 1px solid #ffccc7; }

    /* 变更历史时间轴 */
    .change-history { margin-top: var(--spacing-md); padding-left: var(--spacing-md); border-left: 2px solid var(--border-section); }
    .change-item { position: relative; padding: 0 0 var(--spacing-md-plus) var(--spacing-md); font-size: var(--font-size-sm); }
    .change-item:last-child { padding-bottom: 0; }
    .change-item::before {
      content: ''; position: absolute; left: -22px; top: 5px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--primary); border: 2px solid var(--bg-primary);
      box-shadow: 0 0 0 2px #e6f4ff;
    }
    .change-item.warn::before { background: var(--warning); box-shadow: 0 0 0 2px var(--warning-light); }
    .change-item.error::before { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-light); }
    .change-item.done::before { background: var(--success); box-shadow: 0 0 0 2px var(--success-light); }
    .change-time { color: var(--text-tertiary); font-size: var(--font-size-xs); }
    .change-text { color: var(--text-primary); margin-top: 2px; }

    /* 子表 */
    .sub-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .sub-table th { background: var(--bg-section); padding: var(--spacing-sm) var(--spacing-md); font-size: var(--font-size-xs); font-weight: 500; color: var(--text-secondary); text-align: left; border-bottom: 1px solid var(--border-section); }
    .sub-table td { padding: var(--spacing-sm) var(--spacing-md); font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-section); color: var(--text-primary); }
    .sub-table tbody tr:hover { background: var(--bg-section); }
    .sub-table .tag { display: inline-block; padding: 1px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
    .sub-table .tag-green { background: var(--success-light); color: var(--success); }
    .sub-table .tag-yellow { background: var(--warning-light); color: var(--warning); }
    .sub-table .tag-red { background: var(--danger-light); color: var(--danger); }
    .sub-table .tag-blue { background: var(--primary-light); color: var(--primary); }
    .sub-table .tag-gray { background: #f5f5f5; color: #999; }
    .sub-table .empty-row td { text-align: center; color: var(--text-tertiary); padding: var(--spacing-lg) 0; }

    /* 行展开 */
    .expand-toggle {
      cursor: pointer; color: var(--text-secondary); font-size: var(--font-size-xs);
      margin-right: var(--spacing-xs); transition: transform var(--duration-fast);
      display: inline-block; width: 16px; text-align: center;
    }
    .expand-toggle:hover { color: var(--primary); }
    .expand-toggle.expanded { transform: rotate(90deg); }
    tr.archive-row { cursor: pointer; }
    tr.archive-row:hover { background: var(--bg-section); }
    tr.sub-row { display: none; }
    tr.sub-row.show { display: table-row; }
    tr.sub-row td { padding: 0; background: #fafafa; }
    .sub-row-content { padding: var(--spacing-sm) var(--spacing-md) var(--spacing-sm) 48px; }
    .sub-row-content .sub-table { margin-top: 0; }

    /* 重点场所状态标签 */
    .status-tag { display: inline-block; padding: 2px 10px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
    .status-tag.enabled { background: var(--success-light); color: var(--success); }
    .status-tag.disabled { background: var(--bg-secondary); color: var(--text-tertiary); }
  </style>
</head>
<body>
  <script src="../../js/domain-data.js"></script>
  <script src="../../js/pagination.js"></script>
  <div class="page-container" data-module="government/control-archive">

    <!-- 主布局：左树 + 右内容 -->
    <div class="main-layout" style="display:flex;gap:var(--spacing-md);height:calc(100vh - 80px)">

      <!-- ===== 左侧领域导航树 ===== -->
      <div class="tree-panel">
        <div class="tree-header">
          <div class="tree-title">领域导航</div>
          <div class="tree-toolbar">
            <button class="icon-btn" title="展开全部" onclick="expandAll()">⊞</button>
            <button class="icon-btn" title="折叠全部" onclick="collapseAll()">⊟</button>
          </div>
        </div>
        <div class="tree-search-box">
          <input type="search" placeholder="搜索领域...">
        </div>
        <div class="tree-body" id="treeBody">
          <!-- 由 JS 渲染 -->
        </div>
      </div>

      <!-- ===== 右侧内容区 ===== -->
      <div class="detail-panel">
        <!-- 详情头部 -->
        <div class="card">
          <div class="detail-header">
          <div>
            <div class="detail-title" id="detailTitle">
              <span>📊</span>
              <span>全部管控档案</span>
              <span class="type-tag enterprise" id="detailCount">486 条</span>
            </div>
            <div class="detail-breadcrumb" id="detailBreadcrumb">南山区应急管理局 / 全部领域</div>
          </div>
        </div>
        </div>

        <!-- 统计卡片（色条版） -->
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">管控对象总数</div>
              <div class="stat-value" id="statTotal">486</div>
            </div>
            <div class="stat-indicator" style="background:var(--primary)"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">企业</div>
              <div class="stat-value" id="statEnterprise">126</div>
            </div>
            <div class="stat-indicator" style="background:var(--primary)"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">项目</div>
              <div class="stat-value" id="statProject">238</div>
            </div>
            <div class="stat-indicator" style="background:var(--warning)"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-label">重点场所</div>
              <div class="stat-value" id="statKeyplace">122</div>
            </div>
            <div class="stat-indicator" style="background:var(--accent)"></div>
          </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-card">
          <div class="filter-bar">
            <div class="filter-item">
              <label>对象类型：</label>
              <select id="filterType">
                <option value="">全部</option>
                <option value="enterprise">企业</option>
                <option value="project">项目</option>
                <option value="keyplace">重点场所</option>
              </select>
            </div>
            <div class="filter-item">
              <label>安全码状态：</label>
              <select id="filterCode">
                <option value="">全部</option>
                <option value="green">绿码</option>
                <option value="yellow">黄码</option>
                <option value="red">红码</option>
              </select>
            </div>
            <div class="filter-item">
              <label>关键词：</label>
              <input type="search" id="filterSearch" placeholder="搜索对象名称">
            </div>
            <div style="display:flex;gap:20px">
              <button class="btn btn-primary" onclick="applyFilters()">查询</button>
              <button class="btn btn-default" onclick="resetFilters()">重置</button>
            </div>
          </div>
        </div>

        <!-- 表格卡片 -->
        <div class="table-card">
          <div class="table-container">
            <table>
              <thead id="archiveThead">
                <tr>
                  <th>对象名称</th>
                  <th>对象类型</th>
                  <th>安全码状态</th>
                  <th>监管责任人</th>
                  <th>上次检查日期</th>
                  <th style="width:80px">操作</th>
                </tr>
              </thead>
              <tbody id="archiveTbody">
                <!-- 由 JS 渲染 -->
              </tbody>
            </table>
          </div>
          <div class="pagination" id="paginationBar"></div>
        </div>

      </div><!-- /detail-panel -->
    </div><!-- /main-layout -->
  </div><!-- /page-container -->

  <!-- ===== 查看详情弹窗 ===== -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">管控档案详情</span>
        <button class="modal-close" onclick="closeDetail()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 由 JS 动态渲染 -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeDetail()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>'"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;',"'" :'&#39;','"':'&quot;'}[c]; }); }
    var QR_ICON_SVG='<svg class="qrcode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="14"/><line x1="21" y1="14" x2="21" y2="14"/><line x1="14" y1="21" x2="14" y2="21"/><line x1="21" y1="21" x2="21" y2="21"/><line x1="17" y1="14" x2="17" y2="17"/><line x1="14" y1="17" x2="17" y2="17"/><line x1="17" y1="20" x2="20" y2="20"/><line x1="20" y1="17" x2="20" y2="20"/></svg>';
    function getCodeLabel(cs) { return cs === 'red' ? '红码' : cs === 'yellow' ? '黄码' : '绿码'; }

    /* ==================== 领域导航树数据（与领域监管共享 domain-data.js）==================== */
    var CATEGORY_ORDER = ['公共场所类', '建设工程类', '交通运输类', '危险化学品类', '工业制造类', '城市运行类', '其他类'];
    var CATEGORY_ICON = {
      '公共场所类': '📂', '建设工程类': '📂', '交通运输类': '📂',
      '危险化学品类': '📂', '工业制造类': '📂', '城市运行类': '📂', '其他类': '📂'
    };
    // 以下领域小类选中时切换为"重点场所"专用视图
    var KEYPLACE_DOMAINS = new Set([
      'COMM_001', 'COMM_004', 'OTH_001', 'OTH_002'
    ]);

    function buildTreeData() {
      var root = { name: '南山区应急管理局', icon: '🏢', count: 0, level: 1, expanded: true, id: 'root', children: [] };
      var catMap = {};
      CATEGORY_ORDER.forEach(function(cat) {
        var node = { name: cat, icon: CATEGORY_ICON[cat] || '📂', count: 0, level: 2, expanded: false, id: 'cat-' + cat, children: [] };
        catMap[cat] = node;
        root.children.push(node);
      });
      DOMAIN_TABLE_DATA.forEach(function(d) {
        var cat = catMap[d.industryName];
        if (cat) {
          cat.children.push({
            name: d.name, icon: '🏷️', count: 0, level: 3,
            id: d.id, domainId: d.id
          });
        }
      });
      // 计算各节点管控对象数
      ARCHIVE_DATA.forEach(function(a) {
        var domain = DOMAIN_TABLE_DATA.find(function(d) { return d.id === a.domainId; });
        if (!domain) return;
        var cat = catMap[domain.industryName];
        if (!cat) return;
        cat.count++;
        root.count++;
        var domNode = cat.children.find(function(c) { return c.domainId === a.domainId; });
        if (domNode) domNode.count++;
      });
      return [root];
    }
    var TREE_DATA; // 延迟到 ARCHIVE_DATA 之后初始化（TDZ）

    /* ==================== 档案数据（只读，3 类对象） ==================== */
    const ARCHIVE_DATA = [
      {
        id: 'E001', type: 'enterprise', typeName: '企业', domainId: 'CHEM_002',
        name: '深圳市XX化工有限公司',
        codeStatus: 'green', codeName: '绿码',
        responsible: '陈志远',
        lastCheck: '2026-06-05'
      },
      {
        id: 'E002', type: 'enterprise', typeName: '企业', domainId: 'CHEM_001',
        name: 'YY油气运输集团有限公司',
        codeStatus: 'yellow', codeName: '黄码',
        responsible: '刘建国',
        lastCheck: '2026-05-28'
      },
      {
        id: 'E003', type: 'enterprise', typeName: '企业', domainId: 'COMM_016',
        name: 'ZZ工贸实业有限公司',
        codeStatus: 'green', codeName: '绿码',
        responsible: '',
        lastCheck: '2026-06-01'

    /* ==================== 渲染左树 ==================== */
    function renderTree() {
      const html = TREE_DATA.map(n => renderTreeNode(n)).join('');
      document.getElementById('treeBody').innerHTML = html;
      bindTreeEvents();
    }

    function renderTreeNode(node, parentMode) {
      const hasChildren = node.children && node.children.length > 0;
      const toggleClass = hasChildren ? (node.expanded ? 'expanded' : '') : 'leaf';
      const childrenClass = node.expanded ? '' : 'collapsed';
      const mode = node.mode || parentMode || 'default';
      const domainIdAttr = node.domainId ? ` data-domain-id="${node.domainId}"` : '';
      const indent = 12 + (node.level - 1) * 16;
      let html = `
        <div class="tree-node level-${node.level}" data-id="${node.id}" data-name="${escapeHtml(node.name)}" data-mode="${mode}"${domainIdAttr} style="padding-left:${indent}px">
          <span class="tree-toggle ${toggleClass}">▶</span>
          <span class="tree-node-icon">${node.icon}</span>
          <span class="tree-node-label">${escapeHtml(node.name)}</span>
          <span class="tree-count">${node.count}</span>
        </div>
      `;
      if (hasChildren) {
        html += `<div class="tree-children ${childrenClass}">`;
        node.children.forEach(c => { html += renderTreeNode(c, mode); });
        html += `</div>`;
      }
      return html;
    }

    function bindTreeEvents() {
      document.querySelectorAll('.tree-toggle').forEach(t => {
        t.addEventListener('click', (e) => {
          e.stopPropagation();
          if (t.classList.contains('leaf')) return;
          t.classList.toggle('expanded');
          const children = t.closest('.tree-node').nextElementSibling;
          if (children && children.classList.contains('tree-children')) {
            children.classList.toggle('collapsed');
          }
        });
      });
      document.querySelectorAll('.tree-node').forEach(n => {
        n.addEventListener('click', () => {
          document.querySelectorAll('.tree-node').forEach(x => x.classList.remove('active'));
          n.classList.add('active');
          const name = n.dataset.name;
          const count = n.querySelector('.tree-count').textContent;
          const nodeId = n.dataset.id;
          // Build breadcrumb path
          const path = [];
          let cur = n;
          while (cur) {
            if (cur.classList && cur.classList.contains('tree-node')) {
              path.unshift(cur.dataset.name);
            }
            const parent = cur.parentElement;
            if (parent && parent.classList.contains('tree-children')) {
              cur = parent.previousElementSibling;
            } else {
              break;
            }
          }
          let bcText = '南山区应急管理局';
          if (path.length === 2) bcText += ' / ' + path[1];
          else if (path.length >= 3) bcText += ' / ' + path[1] + ' / ' + path[2];
          document.querySelector('#detailTitle span:nth-child(2)').textContent = name;
          document.getElementById('detailBreadcrumb').textContent = bcText;
          document.getElementById('detailCount').textContent = count + ' 条';
          // Update filter state based on clicked node level
          if (nodeId === 'root') {
            currentCategory = '';
            currentDomainId = '';
            currentDomainName = '';
            currentMode = 'default';
          } else if (n.classList.contains('level-2')) {
            currentCategory = name;
            currentDomainId = '';
            currentDomainName = '';
            currentMode = 'default';
            // 点击大类节点时自动展开子树
            const toggle = n.querySelector('.tree-toggle');
            const children = n.nextElementSibling;
            if (toggle && children && children.classList.contains('tree-children')) {
              if (children.classList.contains('collapsed')) {
                toggle.classList.add('expanded');
                children.classList.remove('collapsed');
              }
            }
          } else if (n.classList.contains('level-3')) {
            currentCategory = '';
            currentDomainId = n.dataset.domainId || '';
            currentDomainName = name;
            currentMode = KEYPLACE_DOMAINS.has(currentDomainId) ? 'keyplace' : 'default';
          }
          applyFilters();
        });
      });
    }

      pg._lastKeyplaceData = data;
      var state = pg.getState();
      var start = (state.page - 1) * state.size;
      var end = Math.min(start + state.size, data.length);
      var pageData = data.slice(start, end);
      const tbody = document.getElementById('archiveTbody');
      let html = '';
      pageData.forEach(row => {
        const statusCls = row.status === '启用' ? 'enabled' : 'disabled';
        const enterpriseHtml = row.enterprise
          ? escapeHtml(row.enterprise)
          : '<span style="color: var(--text-tertiary);">—</span>';
        html += `
          <tr>
            <td><span class="action-link" onclick="viewDetail('${escapeHtml(row.id)}')">${escapeHtml(row.name)}</span></td>
            <td><span class="type-tag keyplace">${escapeHtml(row.domain)}</span></td>
            <td>${escapeHtml(row.address)}</td>
            <td>${enterpriseHtml}</td>
            <td><span class="code-cell ${row.codeStatus}">${QR_ICON_SVG}${escapeHtml(row.codeName)}</span></td>
            <td><span class="status-tag ${statusCls}">${escapeHtml(row.status)}</span></td>
            <td><span class="action-link" onclick="viewDetail('${escapeHtml(row.id)}')">查看详情</span></td>
          </tr>`;
      });
      tbody.innerHTML = html;
      
      updateStats(data);
    }
    /* ==================== 动态统计卡 ==================== */
    function updateStats(data) {
      var total = data.length;
      var ent = data.filter(function(r) { return r.type === 'enterprise'; }).length;
      var proj = data.filter(function(r) { return r.type === 'project'; }).length;
      var kp = data.filter(function(r) { return r.type === 'keyplace'; }).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statEnterprise').textContent = ent;
      document.getElementById('statProject').textContent = proj;
      document.getElementById('statKeyplace').textContent = kp;
    }

    /* ==================== 详情弹窗 ==================== */
    function viewDetail(id) {
      const row = ARCHIVE_DATA.find(r => r.id === id);
      const detail = DETAIL_MAP[id];
      if (!row) return;

      document.getElementById('modalTitle').textContent = row.name + ' - 管控档案详情';

      let html = '';

      // 1. 基础信息
      html += '<div class="detail-section">';
      html += '<div class="section-title">基础信息</div>';
      html += '<div class="info-grid">';
      html += infoItem('对象名称', row.name);
      html += infoItem('对象类型', '<span class="type-tag ' + row.type + '">' + row.typeName + '</span>');
      if (detail) {
        html += infoItem('编码', detail.code);
        html += infoItem('地址', detail.address);
      }
      html += infoItem('监管责任人', row.responsible || '<span class="resp-unconfig">未配置</span>');
      html += infoItem('上次检查日期', row.lastCheck);
      html += '</div></div>';

      if (detail) {
        // 2. 安全码信息
        html += '<div class="detail-section">';
        html += '<div class="section-title">安全码信息</div>';
        html += '<div style="margin-bottom: 8px;"><span class="code-badge ' + row.codeStatus + '">';
        html += QR_ICON_SVG;
        html += '当前：' + row.codeName + '</span></div>';
        html += '<div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">码色变更历史</div>';
        html += '<div class="change-history">';
        detail.codeHistory.forEach(c => {
          html += '<div class="change-item ' + (c.type || '') + '">';
          html += '<div class="change-time">' + c.time + '</div>';
          html += '<div class="change-text">' + c.text + '</div>';
          html += '</div>';
        });
        html += '</div></div>';

        // 3. 检查记录
        html += '<div class="detail-section">';
        html += '<div class="section-title">检查记录</div>';
        if (detail.inspections.length === 0) {
          html += '<div style="color: var(--text-tertiary); font-size: 13px; padding: 12px 0;">暂无检查记录</div>';
        } else {
          html += '<table class="sub-table"><thead><tr><th>检查日期</th><th>检查类型</th><th>检查结果</th><th>检查人</th></tr></thead><tbody>';
          detail.inspections.forEach(ins => {
            const resCls = ins.result === '合格' ? 'tag-green' : (ins.result === '不合格' ? 'tag-red' : 'tag-yellow');
            html += '<tr><td>' + ins.date + '</td><td>' + ins.type + '</td>';
            html += '<td><span class="tag ' + resCls + '">' + ins.result + '</span></td>';
            html += '<td>' + ins.inspector + '</td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';

        // 4. 隐患记录
        html += '<div class="detail-section">';
        html += '<div class="section-title">隐患记录</div>';
        if (detail.hazards.length === 0) {
          html += '<div style="color: var(--text-tertiary); font-size: 13px; padding: 12px 0;">暂无隐患记录</div>';
        } else {
          html += '<table class="sub-table"><thead><tr><th>隐患编号</th><th>隐患描述</th><th>隐患等级</th><th>状态</th></tr></thead><tbody>';
          detail.hazards.forEach(h => {
            const lvlCls = h.level === '重大隐患' ? 'tag-red' : 'tag-yellow';
            const stCls = h.status === '已整改' ? 'tag-green' : (h.status === '已超期' ? 'tag-red' : (h.status === '待复核' ? 'tag-yellow' : 'tag-blue'));
            html += '<tr><td>' + h.id + '</td><td>' + h.desc + '</td>';
            html += '<td><span class="tag ' + lvlCls + '">' + h.level + '</span></td>';
            html += '<td><span class="tag ' + stCls + '">' + h.status + '</span></td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';

        // 5. 关联对象
        html += '<div class="detail-section">';
        html += '<div class="section-title">关联对象</div>';
        if (detail.children.length === 0) {
          html += '<div style="color: var(--text-tertiary); font-size: 13px; padding: 12px 0;">暂无关联对象</div>';
        } else {
          html += '<table class="sub-table"><thead><tr><th>对象名称</th><th>对象类型</th><th>安全码</th></tr></thead><tbody>';
          detail.children.forEach(c => {
            const codeDotCls = c.code === '绿码' ? 'green' : (c.code === '红码' ? 'red' : 'yellow');
            html += '<tr><td>' + c.name + '</td><td>' + c.type + '</td>';
            html += '<td><span class="code-cell ' + codeDotCls + '">' + QR_ICON_SVG + c.code + '</span></td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';
      }

      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('detailModal').classList.add('show');
    }

    function infoItem(label, value) {
      return '<div class="info-item"><span class="info-label">' + label + '</span><span class="info-value">' + value + '</span></div>';
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
    }

    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    /* ==================== 筛选逻辑 ==================== */
    function applyFilters() {
      const typeVal = document.getElementById('filterType').value;
      const codeVal = document.getElementById('filterCode').value;
      const searchVal = document.getElementById('filterSearch').value.trim().toLowerCase();

      if (currentMode === 'keyplace') {
        let filtered = KEYPLACE_DATA;
        if (currentDomainName) {
          filtered = filtered.filter(r => r.domain === currentDomainName);
        }
        if (codeVal) {
          filtered = filtered.filter(r => r.codeStatus === codeVal);
        }
        if (searchVal) {
          filtered = filtered.filter(r => r.name.toLowerCase().includes(searchVal));
        }
        renderKeyplaceRows(filtered);
      } else {
        let filtered = ARCHIVE_DATA;
        if (currentCategory) {
          filtered = filtered.filter(r => {
            var domain = DOMAIN_TABLE_DATA.find(function(d) { return d.id === r.domainId; });
            return domain && domain.industryName === currentCategory;
          });
        }
        if (currentDomainId) {
          filtered = filtered.filter(r => r.domainId === currentDomainId);
        }
        if (typeVal) {
          filtered = filtered.filter(r => r.type === typeVal);
        }
        if (codeVal) {
          filtered = filtered.filter(r => r.codeStatus === codeVal);
        }
        if (searchVal) {
          filtered = filtered.filter(r => r.name.toLowerCase().includes(searchVal));
        }
        renderArchiveRows(filtered);
      }
    }

    function resetFilters() {
      document.getElementById('filterType').value = '';
      document.getElementById('filterCode').value = '';
      document.getElementById('filterSearch').value = '';
      if (currentMode === 'keyplace') {
        renderKeyplaceRows(currentDomainName ? KEYPLACE_DATA.filter(r => r.domain === currentDomainName) : KEYPLACE_DATA);
      } else {
        let data = ARCHIVE_DATA;
        if (currentCategory) {
          data = data.filter(r => {
            var domain = DOMAIN_TABLE_DATA.find(function(d) { return d.id === r.domainId; });
            return domain && domain.industryName === currentCategory;
          });
        }
        if (currentDomainId) {
          data = data.filter(r => r.domainId === currentDomainId);
        }
        renderArchiveRows(data);
      }
    }

    /* ==================== 分页初始化 ==================== */
    var pg = new Pagination('paginationBar', {
      total: ARCHIVE_DATA.length,
      size: 10,
      sizeOptions: [10, 20, 50],
      onChange: function(page, size) {
        if (currentMode === 'keyplace') {
          renderKeyplacePage(pg._lastKeyplaceData);
        } else {
          renderPage(pg._lastData);
        }
      }
    });

    /* ==================== 初始化 ==================== */
    document.addEventListener('DOMContentLoaded', () => {
      renderTree();
      renderArchiveRows(ARCHIVE_DATA);
    });
  </script>
  <script src="../../js/annotations.js"></script>
</body>
</html>
