<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一键巡查 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ========== 页面背景 ========== */
    .page-container { 
      padding: var(--spacing-lg); 
      background: var(--bg-page);
      min-height: 100vh;
    }
    
    /* ========== 页面标题栏 ========== */
    .page-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: var(--spacing-md);
      background: var(--bg-primary);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .page-title { font-size: var(--font-size-lg); font-weight: 600; }
    
    /* ========== 统计卡片 ========== */
    .stat-cards { display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-md); }
    .stat-card { 
      flex: 1; 
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); 
      border: 1px solid var(--border-light); 
      border-radius: var(--radius-lg); 
      padding: var(--spacing-md) var(--spacing-lg); 
      display: flex; 
      align-items: center; 
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .stat-card:hover { 
      background: linear-gradient(135deg, #f1f5f9 0%, #e8ecf0 100%);
      box-shadow: var(--shadow-md);
    }
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-label { font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 4px; }
    
    /* ========== 筛选栏 ========== */
    .filter-bar { 
      display: flex; 
      gap: var(--spacing-sm); 
      margin-bottom: var(--spacing-md); 
      align-items: center; 
      flex-wrap: wrap;
      background: var(--bg-section);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
    }
    .filter-item select, .filter-item input { 
      padding: 6px 10px; 
      border: 1px solid var(--border); 
      border-radius: var(--radius-md); 
      font-size: var(--font-size-sm); 
      background: var(--bg-primary);
    }
    .filter-item select:focus, .filter-item input:focus {
      border-color: var(--primary);
      outline: none;
    }
    
    /* ========== 表格容器 ========== */
    .table-wrap { 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      box-shadow: var(--shadow-card);
    }
    .table-scroll { overflow-x: auto; }
    .table-scroll table { width: 100%; min-width: 900px; border-collapse: collapse; }
    .table-scroll thead tr { background: var(--bg-section); }
    .table-scroll th { padding: 12px var(--spacing-md); text-align: left; font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border-light); }
    .table-scroll td { padding: 12px var(--spacing-md); font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-light); }
    .table-scroll tbody tr:nth-child(even) { background: var(--bg-section-alt); }
    .table-scroll tbody tr:hover td { background: var(--bg-hover); }
    .ellipsis-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .action-col { position: sticky; right: 0; background: var(--bg-primary); z-index: 10; white-space: nowrap; }
    .table-scroll tbody tr:nth-child(even) .action-col { background: var(--bg-section-alt); }
    .table-scroll tbody tr:hover .action-col { background: var(--bg-hover); }
    
    /* ========== 分页 ========== */
    .pagination-wrap { 
      display: flex; 
      align-items: center; 
      justify-content: flex-end; 
      gap: 4px; 
      padding: 12px var(--spacing-md);
      background: var(--bg-section);
      border-top: 1px solid var(--border-light);
    }
    .pg-btn { padding: 6px 12px; border: 1px solid var(--border); background: var(--bg-primary); border-radius: var(--radius-md); cursor: pointer; font-size: var(--font-size-sm); transition: all 0.2s; }
    .pg-btn:hover { border-color: var(--primary); color: var(--primary); }
    .pg-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    /* ========== 标签样式 ========== */
    .tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; }
    .tag-green { background: var(--success-light); color: var(--success); }
    .tag-gray { background: var(--bg-section-alt); color: var(--text-secondary); }
    .tag-orange { background: var(--warning-light); color: var(--warning); }
    .tag-red { background: var(--error-light); color: var(--error); }
    .tag-blue { background: var(--info-light); color: var(--info); }
    
    /* ========== 状态标签 ========== */
    .status-tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; }
    .status-pending { background: var(--warning-light); color: var(--warning); }
    .status-done { background: var(--success-light); color: var(--success); }
    .status-overdue { background: var(--error-light); color: var(--error); }
  </style>
</head>
<body>
  <div class="module-page page-container" data-module="gov-quick-check">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item current">政府端</span>
    </div>
    
    <!-- 页面标题栏已隐藏 -->
    
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-value" style="color: var(--primary);">28</div><div class="stat-label">本月巡查次数</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--success);">23</div><div class="stat-label">已完成</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--warning);">3</div><div class="stat-label">待巡查</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--error);">2</div><div class="stat-label">超期未巡查</div></div>
    </div>
    
    <div class="filter-bar">
      <div class="filter-item"><label>状态：</label><select id="filterStatus"><option>全部</option><option>待巡查</option><option>已完成</option><option>超期</option></select></div>
      <div class="filter-item"><label>领域小类：</label><select id="filterDomain"><option>全部</option><option>充换电设施</option><option>农贸市场</option><option>危险化学品</option></select></div>
      <div class="filter-item"><label>时间：</label><input type="date" id="filterDate"></div>
      <div class="filter-item"><input type="text" id="searchInput" placeholder="搜索企业名称"></div>
      <button class="btn btn-default" onclick="resetFilter()">重置</button>
      <div style="flex: 1;"></div>
      <button class="btn btn-primary" onclick="addCheck()">+ 新建巡查</button>
    </div>
    
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>巡查编号</th>
              <th>企业名称</th>
              <th>领域小类</th>
              <th>计划日期</th>
              <th>巡查人员</th>
              <th>状态</th>
              <th class="action-col">操作</th>
            </tr>
          </thead>
          <tbody id="checkTableBody">
            <tr>
              <td>PC20260402001</td>
              <td class="ellipsis-col" title="创安电子科技有限公司">创安电子科技有限公司</td>
              <td>充换电设施</td>
              <td>2026-04-02</td>
              <td>张三</td>
              <td><span class="status-tag status-pending">待巡查</span></td>
              <td class="action-col"><button class="btn-link" onclick="startCheck('PC20260402001')">开始巡查</button><button class="btn-link" onclick="viewCheck('PC20260402001')">详情</button></td>
            </tr>
            <tr>
              <td>PC20260401001</td>
              <td class="ellipsis-col" title="深圳港物流有限公司">深圳港物流有限公司</td>
              <td>工业制造</td>
              <td>2026-04-01</td>
              <td>李四</td>
              <td><span class="status-tag status-done">已完成</span></td>
              <td class="action-col"><button class="btn-link" onclick="viewResult('PC20260401001')">查看结果</button><button class="btn-link" onclick="viewCheck('PC20260401001')">详情</button></td>
            </tr>
            <tr>
              <td>PC20260331002</td>
              <td class="ellipsis-col" title="安达运输公司">安达运输公司</td>
              <td>交通运输</td>
              <td>2026-03-31</td>
              <td>王五</td>
              <td><span class="status-tag status-overdue">超期</span></td>
              <td class="action-col"><button class="btn-link" onclick="startCheck('PC20260331002')">立即巡查</button><button class="btn-link" onclick="viewCheck('PC20260331002')">详情</button></td>
            </tr>
            <tr>
              <td>PC20260330001</td>
              <td class="ellipsis-col" title="新兴化工有限公司">新兴化工有限公司</td>
              <td>危险化学品</td>
              <td>2026-03-30</td>
              <td>张三</td>
              <td><span class="status-tag status-done">已完成</span></td>
              <td class="action-col"><button class="btn-link" onclick="viewResult('PC20260330001')">查看结果</button><button class="btn-link" onclick="viewCheck('PC20260330001')">详情</button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="pagination-wrap">
        <button class="pg-btn" onclick="prevPage()">上一页</button>
        <button class="pg-btn active">1</button>
        <button class="pg-btn" onclick="goPage(2)">2</button>
        <button class="pg-btn" onclick="goPage(3)">3</button>
        <button class="pg-btn" onclick="nextPage()">下一页</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      
      const CONFIG = {
        moduleId: 'gov-quick-check',
        moduleName: '一键巡查'
      };
      
      let state = {
        initialized: false,
        currentPage: 1
      };
      
      function init() {
        if (state.initialized) return;
        console.log(`[${CONFIG.moduleId}] 模块初始化`);
        state.initialized = true;
      }
      
      // 开始巡查
      window.startCheck = function(id) {
        console.log('开始巡查：' + id);
        alert('开始巡查：' + id);
      };
      
      // 查看结果
      window.viewResult = function(id) {
        console.log('查看巡查结果：' + id);
        alert('查看巡查结果：' + id);
      };
      
      // 查看详情
      window.viewCheck = function(id) {
        console.log('查看巡查详情：' + id);
        alert('查看巡查详情：' + id);
      };
      
      // 新建巡查
      window.addCheck = function() {
        console.log('新建巡查');
        alert('打开新建巡查弹窗');
      };
      
      // 重置筛选
      window.resetFilter = function() {
        document.getElementById('filterStatus').value = '全部';
        document.getElementById('filterDomain').value = '全部';
        document.getElementById('filterDate').value = '';
        document.getElementById('searchInput').value = '';
        console.log('重置筛选条件');
      };
      
      // 分页
      window.prevPage = function() {
        if (state.currentPage > 1) {
          state.currentPage--;
          console.log('切换到第' + state.currentPage + '页');
        }
      };
      
      window.nextPage = function() {
        state.currentPage++;
        console.log('切换到第' + state.currentPage + '页');
      };
      
      window.goPage = function(page) {
        state.currentPage = page;
        console.log('切换到第' + page + '页');
      };
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      window.destroyModule = function() {
        console.log(`[${CONFIG.moduleId}] 模块销毁`);
        state.initialized = false;
      };
    })();
  </script>
<script src="../../js/annotations.js"></script>
</body>
</html>
