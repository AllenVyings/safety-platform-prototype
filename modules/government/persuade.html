<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劝导路口 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    .persuade-page {
      padding: 20px 24px;
      background: var(--bg-page);
      min-height: 100vh;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--bg-primary);
      padding: var(--spacing-md) 20px;
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title .badge {
      font-size: 11px;
      padding: 2px 8px;
      background: var(--warning-bg, #fff7e6);
      color: var(--warning, #fa8c16);
      border: 1px solid var(--warning-border, #ffd591);
      border-radius: 10px;
      font-weight: 500;
    }

    .placeholder-card {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: 80px 40px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .placeholder-icon {
      font-size: 72px;
      margin-bottom: 24px;
      opacity: 0.5;
    }
    .placeholder-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .placeholder-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .placeholder-features {
      max-width: 560px;
      margin: 0 auto;
      background: var(--bg-section, #fafafa);
      border-radius: 8px;
      padding: 24px 32px;
      text-align: left;
    }
    .placeholder-features h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 12px;
    }
    .placeholder-features ul {
      margin: 0;
      padding-left: 20px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.9;
    }
    .placeholder-features li::marker {
      color: var(--primary);
    }
    .placeholder-meta {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-tertiary, #999);
    }
  </style>
</head>
<body>
  <div class="persuade-page">
    <div class="page-header">
      <div class="page-title">
        劝导路口
        <span class="badge">待设计</span>
      </div>
    </div>

    <div class="placeholder-card">
      <div class="placeholder-icon">🚧</div>
      <div class="placeholder-title">功能建设中</div>
      <div class="placeholder-desc">
        "劝导路口" 模块本期暂不整理，待后续需求细化后再纳入设计。<br>
        当前页面为占位页，菜单已置灰，暂不开放访问。
      </div>

      <div class="placeholder-features">
        <h4>预计功能范围（仅供参考）</h4>
        <ul>
          <li>劝导路口基础信息管理（位置、责任单位、联系人）</li>
          <li>路口劝导员排班与履职记录</li>
          <li>违规行为统计与趋势分析</li>
          <li>与道路交通安全管理联动</li>
        </ul>
      </div>

      <div class="placeholder-meta">
        模块状态：暂缓 | 计划阶段：二期 | PRD 章节：§6.2.11
      </div>
    </div>
  </div>
</body>
</html>
