<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应急预案 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ========== 页面级布局：禁止外层滚动，填满 iframe ========== */
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; }
    .page-container[data-module="government/emergency-plan"] {
      height: 100vh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    .page-container[data-module="government/emergency-plan"] > .page-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 var(--spacing-lg) var(--spacing-lg);
    }

    /* ========== 页面标题栏 ========== */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
      background: var(--bg-primary);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-header);
    }
    .page-title { font-size: var(--font-size-xl); font-weight: 600; }
    .page-subtitle { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 4px; }
    .header-actions { display: flex; gap: var(--spacing-sm); }

    /* ========== 统计卡片 ========== */
    .stats-row { grid-template-columns: repeat(3, 1fr); }

    /* ========== 筛选栏 ========== */
    .filter-bar {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md) 20px;border:1px solid var(--border-section);margin-bottom:var(--spacing-md)}
    .filter-card .filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:transparent}
    .filter-card .filter-item{display:flex;align-items:center;gap:6px}
    .filter-card .filter-bar select,.filter-card .filter-bar input{width:240px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box}
    .filter-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    .filter-item label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .filter-item select,
    .filter-item input[type="text"] {
      width: 240px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .filter-item select:focus,
    .filter-item input[type="text"]:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: var(--shadow-input-focus);
    }
    .filter-item input[type="text"]::placeholder {
      color: var(--text-placeholder);
    }

    /* ========== 表格容器 ========== */
    .table-wrap {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .table-toolbar {
      padding: var(--spacing-sm) var(--spacing-md);
      border-bottom: 1px solid var(--border-section);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-toolbar h3 { margin: 0; font-size: var(--font-size-md); font-weight: 600; color: var(--text-primary); }

    .table-scroll { overflow-x: auto; }
    .table-scroll table { width: 100%; min-width: 1000px; border-collapse: collapse; }
    .table-scroll thead tr { background: var(--bg-section); }
    .table-scroll th { padding: 12px var(--spacing-md); text-align: left; font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border-light); }
    .table-scroll td { padding: 12px var(--spacing-md); font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-light); }
    .table-scroll tbody tr:nth-child(even) { background: var(--bg-table-stripe); }
    .table-scroll tbody tr:hover td { background: var(--bg-hover); }

    /* ========== 标签样式 ========== */
    .tag { display: inline-block; padding: 2px var(--spacing-sm); border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
    /* 状态标签：草稿=灰、已发布=绿、已归档=蓝 */
    .tag-draft { background: var(--bg-section-alt); color: var(--text-secondary); }
    .tag-published { background: var(--success-light); color: var(--success); }
    .tag-archived { background: var(--info-light); color: var(--info); }
    /* 预案类型标签：综合=蓝、专项=橙、现场处置=紫 */
    .tag-comprehensive { background: var(--info-light); color: var(--info); }
    .tag-special { background: var(--warning-light); color: var(--warning); }
    .tag-on-site { background: #f9f0ff; color: #722ed1; }
    /* 级别标签 */
    .tag-district { background: #e6f7ff; color: #096dd9; }
    .tag-street { background: var(--warning-light); color: var(--warning); }

    /* ========== 操作链接 ========== */
    .btn-link { padding: 0; border: none; background: none; color: var(--primary); cursor: pointer; font-size: var(--font-size-sm); }
    .btn-link:hover { text-decoration: underline; }
    .btn-link + .btn-link { margin-left: 12px; }
    .btn-link.danger { color: var(--danger); }

    /* 预案名称可点击 */
    .plan-name-link { color: var(--primary); cursor: pointer; }
    .plan-name-link:hover { text-decoration: underline; }

    /* ========== 弹窗 ========== */
    .modal-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9998; display: none; }
    .modal-container.show { display: flex; align-items: center; justify-content: center; }
    .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); }
    .modal-dialog { position: relative; background: var(--bg-primary); border-radius: var(--radius-lg); box-shadow: var(--shadow-elevated); max-height: 90vh; display: flex; flex-direction: column; animation: modalSlideIn 0.3s ease-out; }
    @keyframes modalSlideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--border-light); background: var(--bg-section); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .modal-title { font-size: var(--font-size-lg); font-weight: 500; color: var(--text-primary); }
    .modal-close { width: 32px; height: 32px; border: none; background: transparent; font-size: var(--font-size-xxl); color: var(--text-tertiary); cursor: pointer; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; transition: background-color var(--duration-fast), color var(--duration-fast); }
    .modal-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .modal-body { padding: var(--spacing-lg); overflow-y: auto; flex: 1; }
    .modal-footer { display: flex; justify-content: flex-end; gap: var(--spacing-sm); padding: var(--spacing-md) var(--spacing-lg); border-top: 1px solid var(--border-light); background: var(--bg-section); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

    /* ========== 详情行 ========== */
    .detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { width: 100px; flex-shrink: 0; color: var(--text-secondary); font-size: var(--font-size-sm); }
    .detail-value { flex: 1; font-size: var(--font-size-sm); color: var(--text-primary); min-width: 0; overflow-wrap: break-word; }

    /* ========== 评审提醒条 ========== */
    .review-alert {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--warning-light);
      border: 1px solid #ffe58f;
      border-radius: var(--radius-lg);
      margin-bottom: var(--spacing-md);
      font-size: var(--font-size-sm);
      color: var(--warning);
    }
    .review-alert-icon { flex-shrink: 0; }

    /* ========== Toast ========== */
    .toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: var(--spacing-sm); }
    .toast { padding: 12px 20px; border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: 0 4px 16px rgba(0,0,0,0.12); font-size: var(--font-size-sm); color: var(--text-primary); animation: toastIn 0.3s ease; display: flex; align-items: center; gap: var(--spacing-sm); border-left: 4px solid var(--primary); max-width: 420px; }
    .toast.success { border-left-color: var(--success); }
    .toast.warning { border-left-color: var(--warning); }
    .toast.out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="page-container" data-module="government/emergency-plan">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">政府端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item">应急资源</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">应急预案</span>
    </div>

    <div class="page-content">
      <!-- 页面标题 -->
      <div class="page-header">
        <div>
          <div class="page-title">应急预案</div>
          <div class="page-subtitle">管理本单位的应急预案文件与评审周期</div>
        </div>
        <div class="header-actions">
          <button class="btn btn-default" onclick="exportPlans()">导出</button>
          <button class="btn btn-primary" onclick="openAddModal()">+ 新增预案</button>
        </div>
      </div>

      <!-- 统计卡片：3 张 -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">预案总数</div>
            <div class="stat-value" id="statTotal">0</div>
          </div>
          <div class="stat-indicator" style="background: var(--primary);"></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">已发布</div>
            <div class="stat-value" id="statPublished">0</div>
          </div>
          <div class="stat-indicator" style="background: var(--success);"></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">待评审</div>
            <div class="stat-value" id="statReviewDue">0</div>
          </div>
          <div class="stat-indicator" style="background: var(--warning);"></div>
        </div>
      </div>

      <!-- 评审提醒条（BR-GOV-EM-01：到期前30天提醒） -->
      <div class="review-alert" id="reviewAlert" style="display:none;">
        <span class="review-alert-icon">&#x26A0;</span>
        <span id="reviewAlertText"></span>
      </div>

      <!-- 筛选区 -->
      <div class="filter-card"><div class="filter-bar">
        <div class="filter-item">
          <label>预案类型：</label>
          <select id="filterType" onchange="applyFilter()">
            <option value="">全部</option>
            <option value="COMPREHENSIVE">综合预案</option>
            <option value="SPECIAL">专项预案</option>
            <option value="ON_SITE">现场处置方案</option>
          </select>
        </div>
        <div class="filter-item">
          <label>级别：</label>
          <select id="filterLevel" onchange="applyFilter()">
            <option value="">全部</option>
            <option value="DISTRICT">区级</option>
            <option value="STREET">街道级</option>
          </select>
        </div>
        <div class="filter-item">
          <label>状态：</label>
          <select id="filterStatus" onchange="applyFilter()">
            <option value="">全部</option>
            <option value="DRAFT">草稿</option>
            <option value="PUBLISHED">已发布</option>
            <option value="ARCHIVED">已归档</option>
          </select>
        </div>
        <div class="filter-item">
          <label>关键词：</label>
          <input type="text" id="filterKeyword" placeholder="搜索预案名称、编号" oninput="applyFilter()">
        </div>
        <button class="btn btn-primary" onclick="applyFilter()">查询</button>
        <button class="btn btn-default" onclick="resetFilter()">重置</button>
      </div></div>

      <!-- 表格 -->
      <div class="table-wrap">
        <div class="table-toolbar">
          <h3 id="tableTitle">预案列表</h3>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>预案名称</th>
                <th width="100">预案类型</th>
                <th width="80">级别</th>
                <th width="140">编制单位</th>
                <th width="70">版本</th>
                <th width="80">状态</th>
                <th width="110">下次评审日期</th>
                <th width="160">操作</th>
              </tr>
            </thead>
            <tbody id="planTableBody">
              <!-- 动态渲染 -->
            </tbody>
          </table>
        </div>
        <div class="pagination" id="paginationBar"></div>
      </div>
    </div>
  </div>

  <!-- ========== 新增/编辑预案弹窗 ========== -->
  <div class="modal-container" id="modal-add-plan">
    <div class="modal-overlay" onclick="closeModal('modal-add-plan')"></div>
    <div class="modal-dialog" style="width: 600px;">
      <div class="modal-header">
        <span class="modal-title" id="addPlanTitle">新增预案</span>
        <button class="modal-close" onclick="closeModal('modal-add-plan')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="planForm" onsubmit="return false;">
          <input type="hidden" id="planFormId" value="">
          <div class="form-group">
            <label class="form-label">预案名称 <span style="color:var(--danger)">*</span></label>
            <input class="form-input" id="planFormName" placeholder="请输入预案名称" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">预案类型 <span style="color:var(--danger)">*</span></label>
              <select class="form-select" id="planFormType" required>
                <option value="">请选择</option>
                <option value="COMPREHENSIVE">综合预案</option>
                <option value="SPECIAL">专项预案</option>
                <option value="ON_SITE">现场处置方案</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">级别 <span style="color:var(--danger)">*</span></label>
              <select class="form-select" id="planFormLevel" required>
                <option value="">请选择</option>
                <option value="DISTRICT">区级</option>
                <option value="STREET">街道级</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">适用领域 <span style="color:var(--danger)">*</span></label>
            <div class="checkbox-group" id="planFormDomains">
              <label class="checkbox-item"><input type="checkbox" value="危化品"> 危化品</label>
              <label class="checkbox-item"><input type="checkbox" value="消防"> 消防</label>
              <label class="checkbox-item"><input type="checkbox" value="建筑"> 建筑</label>
              <label class="checkbox-item"><input type="checkbox" value="交通"> 交通</label>
              <label class="checkbox-item"><input type="checkbox" value="食品"> 食品</label>
              <label class="checkbox-item"><input type="checkbox" value="自然灾害"> 自然灾害</label>
              <label class="checkbox-item"><input type="checkbox" value="特种设备"> 特种设备</label>
              <label class="checkbox-item"><input type="checkbox" value="其他"> 其他</label>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">编制单位 <span style="color:var(--danger)">*</span></label>
              <input class="form-input" id="planFormOrg" placeholder="请输入编制单位" required>
            </div>
            <div class="form-group">
              <label class="form-label">预案版本</label>
              <input class="form-input" id="planFormVersion" placeholder="如 V1.0">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">预案文件</label>
            <div style="border:1px dashed var(--border);border-radius:var(--radius-md);padding:24px;text-align:center;color:var(--text-tertiary);cursor:pointer;" onclick="showToast('文件上传功能演示','warning')">
              <div style="font-size:24px;margin-bottom:4px;">&#x1F4E4;</div>
              <div style="font-size:var(--font-size-sm);">点击或拖拽上传预案文件（PDF/Word）</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">备注</label>
            <textarea class="form-textarea" id="planFormRemark" rows="3" placeholder="请输入备注信息"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('modal-add-plan')">取消</button>
        <button class="btn btn-primary" onclick="savePlan()">保存</button>
      </div>
    </div>
  </div>

  <!-- ========== 预案详情弹窗 ========== -->
  <div class="modal-container" id="modal-detail-plan">
    <div class="modal-overlay" onclick="closeModal('modal-detail-plan')"></div>
    <div class="modal-dialog" style="width: 700px;">
      <div class="modal-header">
        <span class="modal-title">预案详情</span>
        <button class="modal-close" onclick="closeModal('modal-detail-plan')">&times;</button>
      </div>
      <div class="modal-body" id="detailPlanBody">
        <!-- 动态渲染 -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('modal-detail-plan')">关闭</button>
      </div>
    </div>
  </div>

  <!-- ========== 发布确认弹窗 ========== -->
  <div class="modal-container" id="modal-publish">
    <div class="modal-overlay" onclick="closeModal('modal-publish')"></div>
    <div class="modal-dialog" style="width: 480px;">
      <div class="modal-header">
        <span class="modal-title">发布预案</span>
        <button class="modal-close" onclick="closeModal('modal-publish')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: var(--font-size-md); color: var(--text-primary);">确认发布预案「<span id="publishPlanName"></span>」？</p>
        <p style="font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 8px;">发布后预案将进入生效状态，相关人员将收到通知。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('modal-publish')">取消</button>
        <button class="btn btn-primary" onclick="confirmPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <!-- ========== 归档确认弹窗 ========== -->
  <div class="modal-container" id="modal-archive">
    <div class="modal-overlay" onclick="closeModal('modal-archive')"></div>
    <div class="modal-dialog" style="width: 480px;">
      <div class="modal-header">
        <span class="modal-title">归档预案</span>
        <button class="modal-close" onclick="closeModal('modal-archive')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: var(--font-size-md); color: var(--text-primary);">确认归档预案「<span id="archivePlanName"></span>」？</p>
        <p style="font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 8px;">归档后预案将不再生效，如需重新使用需重新发布。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('modal-archive')">取消</button>
        <button class="btn btn-primary" onclick="confirmArchive()">确认归档</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      var CONFIG = {
        moduleId: 'emergency-plan',
        moduleName: '应急预案'
      };

      /* ========== HTML 转义（防 XSS） ========== */
      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      /* ========== 状态 ========== */
      var state = {
        initialized: false,
        currentPage: 1,
        currentPlanId: null
      };

      /* ========== 枚举映射 ========== */
      var PLAN_TYPE_MAP = {
        COMPREHENSIVE: { label: '综合预案', cls: 'tag-comprehensive' },
        SPECIAL:       { label: '专项预案', cls: 'tag-special' },
        ON_SITE:       { label: '现场处置', cls: 'tag-on-site' }
      };

      var LEVEL_MAP = {
        DISTRICT: { label: '区级', cls: 'tag-district' },
        STREET:   { label: '街道级', cls: 'tag-street' }
      };

      var STATUS_MAP = {
        DRAFT:     { label: '草稿',   cls: 'tag-draft' },
        PUBLISHED: { label: '已发布', cls: 'tag-published' },
        ARCHIVED:  { label: '已归档', cls: 'tag-archived' }
      };

      /* ========== 模拟数据（至少 8 条） ========== */
      var planList = [
        {
          planId: 'EP-2024-001', planName: 'XX区危险化学品事故综合应急预案',
          planType: 'COMPREHENSIVE', level: 'DISTRICT', responsibleOrg: '应急指挥科',
          version: 'V3.2', status: 'PUBLISHED', publishDate: '2024-08-15', reviewDate: '2025-08-15'
        },
        {
          planId: 'EP-2024-002', planName: '烟花爆竹爆炸事故专项应急预案',
          planType: 'SPECIAL', level: 'DISTRICT', responsibleOrg: '安全监督科',

      /* ========== 统计计算 ========== */
      function computeStats(data) {
        var total = data.length;
        var published = 0;
        var reviewDue = 0;
        var now = new Date();
        var thirtyDaysLater = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);

        for (var i = 0; i < data.length; i++) {
          var p = data[i];
          if (p.status === 'PUBLISHED') published++;
          // BR-GOV-EM-01：已发布预案每年至少评审一次，到期前30天提醒
          if (p.status === 'PUBLISHED' && p.reviewDate) {
            var reviewDt = new Date(p.reviewDate);
            if (reviewDt <= thirtyDaysLater) reviewDue++;
          }
        }

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPublished').textContent = published;
        document.getElementById('statReviewDue').textContent = reviewDue;

        // 评审提醒条
        var alertEl = document.getElementById('reviewAlert');
        var alertTextEl = document.getElementById('reviewAlertText');
        if (reviewDue > 0) {
          alertEl.style.display = 'flex';
          alertTextEl.textContent = '有 ' + reviewDue + ' 份已发布预案即将到达评审日期（30天内），请及时安排评审。';
        } else {
          alertEl.style.display = 'none';
        }
      }

      /* ========== 筛选逻辑 ========== */
      function getFilteredData() {
        var filterType = document.getElementById('filterType').value;
        var filterLevel = document.getElementById('filterLevel').value;
        var filterStatus = document.getElementById('filterStatus').value;
        var keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

        var result = [];
        for (var i = 0; i < planList.length; i++) {
          var p = planList[i];
          if (filterType && p.planType !== filterType) continue;
          if (filterLevel && p.level !== filterLevel) continue;
          if (filterStatus && p.status !== filterStatus) continue;
          if (keyword && p.planName.toLowerCase().indexOf(keyword) < 0 && p.planId.toLowerCase().indexOf(keyword) < 0) continue;
          result.push(p);
        }
        return result;
      }

      /* ========== 表格渲染 ========== */
      function renderTable(data) {
        var tbody = document.getElementById('planTableBody');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-tertiary);">暂无预案数据</td></tr>';
          document.getElementById('tableTitle').textContent = '预案列表（0 条）';
          return;
        }

        document.getElementById('tableTitle').textContent = '预案列表（' + data.length + ' 条）';

        var html = '';
        for (var i = 0; i < data.length; i++) {
          var p = data[i];
          var typeInfo = PLAN_TYPE_MAP[p.planType] || { label: p.planType, cls: 'tag-draft' };
          var levelInfo = LEVEL_MAP[p.level] || { label: p.level, cls: '' };
          var statusInfo = STATUS_MAP[p.status] || { label: p.status, cls: 'tag-draft' };

          html += '<tr>';
          html += '<td><span class="plan-name-link" onclick="viewPlan(\'' + escapeHtml(p.planId) + '\')">' + escapeHtml(p.planName) + '</span></td>';
          html += '<td><span class="tag ' + typeInfo.cls + '">' + escapeHtml(typeInfo.label) + '</span></td>';
          html += '<td><span class="tag ' + levelInfo.cls + '">' + escapeHtml(levelInfo.label) + '</span></td>';
          html += '<td>' + escapeHtml(p.responsibleOrg) + '</td>';
          html += '<td>' + escapeHtml(p.version) + '</td>';
          html += '<td><span class="tag ' + statusInfo.cls + '">' + escapeHtml(statusInfo.label) + '</span></td>';
          html += '<td>' + escapeHtml(p.reviewDate || '—') + '</td>';
          html += '<td>' + getActionButtons(p) + '</td>';
          html += '</tr>';
        }
        tbody.innerHTML = html;
      }

      function getActionButtons(p) {
        var btns = '';
        btns += '<button class="btn-link" onclick="viewPlan(\'' + escapeHtml(p.planId) + '\')">查看</button>';

        if (p.status === 'DRAFT') {
          btns += '<button class="btn-link" onclick="editPlan(\'' + escapeHtml(p.planId) + '\')">编辑</button>';
          btns += '<button class="btn-link" onclick="publishPlan(\'' + escapeHtml(p.planId) + '\')">发布</button>';
        } else if (p.status === 'PUBLISHED') {
          btns += '<button class="btn-link" onclick="editPlan(\'' + escapeHtml(p.planId) + '\')">编辑</button>';
          btns += '<button class="btn-link" onclick="archivePlan(\'' + escapeHtml(p.planId) + '\')">归档</button>';
        } else if (p.status === 'ARCHIVED') {
          // 已归档：仅查看
        }
        return btns;
      }

      /* ========== 筛选/重置 ========== */
      window.applyFilter = function() {
        var data = getFilteredData();
        renderTable(data);
        computeStats(data);
        if (typeof pg !== 'undefined' && pg) {
          pg.setTotal(data.length);
          pg.setPage(1);
        }
      };

      window.resetFilter = function() {
        document.getElementById('filterType').value = '';
        document.getElementById('filterLevel').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterKeyword').value = '';
        applyFilter();
      };

      /* ========== 弹窗控制 ========== */
      window.openModal = function(id) {
        document.getElementById(id).classList.add('show');
      };
      window.closeModal = function(id) {
        document.getElementById(id).classList.remove('show');
      };

      /* ========== Toast ========== */
      window.showToast = function(msg, type) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' ' + type : '');
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(function() { toast.classList.add('out'); }, 2500);
        setTimeout(function() { toast.remove(); }, 2800);
      };

      /* ========== 查看预案详情 ========== */
      window.viewPlan = function(planId) {
        var p = getPlanById(planId);
        if (!p) return;
        renderPlanDetail(p);
        openModal('modal-detail-plan');
      };

      function getPlanById(planId) {
        for (var i = 0; i < planList.length; i++) {
          if (planList[i].planId === planId) return planList[i];
        }
        return null;
      }

      function renderPlanDetail(p) {
        var typeInfo = PLAN_TYPE_MAP[p.planType] || { label: p.planType, cls: 'tag-draft' };
        var levelInfo = LEVEL_MAP[p.level] || { label: p.level, cls: '' };
        var statusInfo = STATUS_MAP[p.status] || { label: p.status, cls: 'tag-draft' };

        var html = '';
        html += '<div class="info-section">';
        html += '<div class="info-section-title">基本信息</div>';
        html += '<div class="info-grid">';
        html += '<div class="info-item"><span class="info-label">预案编号</span><span class="info-value">' + escapeHtml(p.planId) + '</span></div>';
        html += '<div class="info-item"><span class="info-label">预案名称</span><span class="info-value">' + escapeHtml(p.planName) + '</span></div>';
        html += '<div class="info-item"><span class="info-label">预案类型</span><span class="info-value"><span class="tag ' + typeInfo.cls + '">' + escapeHtml(typeInfo.label) + '</span></span></div>';
        html += '<div class="info-item"><span class="info-label">级别</span><span class="info-value"><span class="tag ' + levelInfo.cls + '">' + escapeHtml(levelInfo.label) + '</span></span></div>';
        html += '<div class="info-item"><span class="info-label">编制单位</span><span class="info-value">' + escapeHtml(p.responsibleOrg) + '</span></div>';
        html += '<div class="info-item"><span class="info-label">版本</span><span class="info-value">' + escapeHtml(p.version) + '</span></div>';
        html += '<div class="info-item"><span class="info-label">状态</span><span class="info-value"><span class="tag ' + statusInfo.cls + '">' + escapeHtml(statusInfo.label) + '</span></span></div>';
        html += '<div class="info-item"><span class="info-label">发布日期</span><span class="info-value">' + escapeHtml(p.publishDate || '—') + '</span></div>';
        html += '<div class="info-item"><span class="info-label">下次评审日期</span><span class="info-value">' + escapeHtml(p.reviewDate || '—') + '</span></div>';
        html += '</div></div>';

        // 审批记录时间线
        html += '<div class="info-section">';
        html += '<div class="info-section-title">审批记录</div>';
        html += '<div style="padding:8px 0;">';
        var timeline = [];
        timeline.push({ time: '2024-01-10 09:00', action: '创建预案', user: '张三', result: '' });
        if (p.status !== 'DRAFT') {
          timeline.push({ time: p.publishDate ? p.publishDate + ' 14:30' : '2024-03-15 14:30', action: '提交审批', user: '李四', result: '' });
          timeline.push({ time: p.publishDate ? p.publishDate + ' 16:00' : '2024-03-15 16:00', action: '审批通过', user: '王五', result: '同意' });
        }
        if (p.status === 'ARCHIVED') {
          timeline.push({ time: '2024-12-01 10:00', action: '预案归档', user: '赵六', result: '' });
        }
        for (var t = 0; t < timeline.length; t++) {
          var item = timeline[t];
          var isLast = t === timeline.length - 1;
          html += '<div style="display:flex;gap:12px;position:relative;">';
          html += '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:20px;">';
          html += '<div style="width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:4px;flex-shrink:0;"></div>';
          if (!isLast) html += '<div style="width:1px;flex:1;background:var(--border-light);margin-top:4px;"></div>';
          html += '</div>';
          html += '<div style="flex:1;padding-bottom:' + (isLast ? '0' : '16px') + ';min-width:0;">';
          html += '<div style="font-size:var(--font-size-sm);color:var(--text-primary);font-weight:500;">' + escapeHtml(item.action) + (item.result ? '（' + escapeHtml(item.result) + '）' : '') + '</div>';
          html += '<div style="font-size:var(--font-size-xs);color:var(--text-tertiary);margin-top:2px;">' + escapeHtml(item.user) + ' · ' + escapeHtml(item.time) + '</div>';
          html += '</div></div>';
        }
        html += '</div></div>';

        document.getElementById('detailPlanBody').innerHTML = html;
      }

      /* ========== 编辑预案 ========== */
      window.editPlan = function(planId) {
        var p = getPlanById(planId);
        if (!p) return;
        document.getElementById('addPlanTitle').textContent = '编辑预案';
        document.getElementById('planFormId').value = p.planId;
        document.getElementById('planFormName').value = p.planName;
        document.getElementById('planFormType').value = p.planType;
        document.getElementById('planFormLevel').value = p.level;
        document.getElementById('planFormOrg').value = p.responsibleOrg;
        document.getElementById('planFormVersion').value = p.version;
        document.getElementById('planFormRemark').value = '';
        var cbs = document.querySelectorAll('#planFormDomains input[type="checkbox"]');
        for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
        openModal('modal-add-plan');
      };

      /* ========== 发布预案 ========== */
      window.publishPlan = function(planId) {
        var p = getPlanById(planId);
        if (!p) return;
        state.currentPlanId = planId;
        document.getElementById('publishPlanName').textContent = p.planName;
        openModal('modal-publish');
      };

      window.confirmPublish = function() {
        var p = getPlanById(state.currentPlanId);
        if (p) {
          p.status = 'PUBLISHED';
          p.publishDate = new Date().toISOString().slice(0, 10);
        }
        closeModal('modal-publish');
        showToast('预案已发布：' + (p ? p.planId : ''), 'success');
        applyFilter();
      };

      /* ========== 归档预案 ========== */
      window.archivePlan = function(planId) {
        var p = getPlanById(planId);
        if (!p) return;
        state.currentPlanId = planId;
        document.getElementById('archivePlanName').textContent = p.planName;
        openModal('modal-archive');
      };

      window.confirmArchive = function() {
        var p = getPlanById(state.currentPlanId);
        if (p) {
          p.status = 'ARCHIVED';
        }
        closeModal('modal-archive');
        showToast('预案已归档：' + (p ? p.planId : ''), 'success');
        applyFilter();
      };

      /* ========== 新增预案 ========== */
      window.openAddModal = function() {
        document.getElementById('addPlanTitle').textContent = '新增预案';
        document.getElementById('planFormId').value = '';
        document.getElementById('planFormName').value = '';
        document.getElementById('planFormType').value = '';
        document.getElementById('planFormLevel').value = '';
        document.getElementById('planFormOrg').value = '';
        document.getElementById('planFormVersion').value = '';
        document.getElementById('planFormRemark').value = '';
        var cbs = document.querySelectorAll('#planFormDomains input[type="checkbox"]');
        for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
        openModal('modal-add-plan');
      };

      /* ========== 保存预案（新增/编辑） ========== */
      window.savePlan = function() {
        var name = document.getElementById('planFormName').value.trim();
        var type = document.getElementById('planFormType').value;
        var level = document.getElementById('planFormLevel').value;
        var org = document.getElementById('planFormOrg').value.trim();
        if (!name) { showToast('请输入预案名称', 'warning'); return; }
        if (!type) { showToast('请选择预案类型', 'warning'); return; }
        if (!level) { showToast('请选择级别', 'warning'); return; }
        if (!org) { showToast('请输入编制单位', 'warning'); return; }
        var editId = document.getElementById('planFormId').value;
        var version = document.getElementById('planFormVersion').value.trim() || 'V1.0';
        var remark = document.getElementById('planFormRemark').value.trim();
        if (editId) {
          var p = getPlanById(editId);
          if (p) {
            p.planName = name; p.planType = type; p.level = level;
            p.responsibleOrg = org; p.version = version;
          }
          closeModal('modal-add-plan');
          showToast('预案已更新：' + name, 'success');
        } else {
          var newId = 'EP-' + new Date().getFullYear() + '-' + String(planList.length + 1).padStart(3, '0');
          planList.unshift({
            planId: newId, planName: name, planType: type, level: level,
            responsibleOrg: org, version: version, status: 'DRAFT',
            publishDate: '', reviewDate: ''
          });
          closeModal('modal-add-plan');
          showToast('预案已创建：' + name, 'success');
        }
        applyFilter();
      };

      /* ========== 导出 ========== */
      window.exportPlans = function() {
        showToast('预案列表导出中，完成后将自动下载');
      };

      /* ========== 面包屑推送 ========== */
      function pushBreadcrumb() {
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({
              type: 'breadcrumb',
              moduleId: CONFIG.moduleId,
              moduleName: CONFIG.moduleName,
              path: [
                { label: '政府端' },
                { label: '应急资源' },
                { label: '应急预案' }
              ]
            }, '*');
          }
        } catch (e) { /* iframe 跨域忽略 */ }
      }

      /* ========== 初始化 ========== */
      var pg = null;

      function init() {
        if (state.initialized) return;
        state.initialized = true;

        // 初始渲染
        var data = getFilteredData();
        renderTable(data);
        computeStats(data);

        // 分页（默认每页 10 条）
        pg = new Pagination('paginationBar', {
          total: data.length,
          size: 10,
          onChange: function(page, size) {
            state.currentPage = page;
          }
        });

        // 面包屑
        pushBreadcrumb();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      window.destroyModule = function() {
        state.initialized = false;
      };
    })();
  </script>
  <script src="../../js/pagination.js"></script>
  <script src="../../js/annotations.js"></script>
</body>
