<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
html, body { height: 100%; margin: 0; overflow: hidden; }

/* 整页弹性布局：列表卡占满剩余视口 */
.module-page.page-container {
  height: 100%; min-height: 0; box-sizing: border-box;
  display: flex; flex-direction: column; overflow: hidden;
}
#view-list { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ========== 筛选卡 ========== */
.filter-card {
  flex-shrink: 0;
  background: #ffffff; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); padding: 16px 20px; margin-bottom: 16px;
}
.filter-card .filter-bar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  margin: 0; padding: 0; background: transparent; border: none; border-radius: 0;
}
.filter-item { display: flex; align-items: center; gap: 6px; }
.filter-item label { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); white-space: nowrap; }
.filter-bar select, .filter-bar input[type="text"], .filter-bar input[type="date"] {
  height: 32px; padding: 0 10px; border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: var(--font-size-sm); box-sizing: border-box; background: transparent;
}
.filter-bar select, .filter-bar input[type="text"] { width: 240px; }
.filter-bar input[type="date"] { width: 150px; }
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); outline: none; }
.filter-actions { display: flex; gap: 8px; margin-left: 4px; }
.date-sep { color: var(--text-secondary); font-size: 12px; }

/* ========== 领域小类 左右两栏选择器 ========== */
.dp { position: relative; }
.dp-trigger {
  width: 240px; height: 32px; padding: 0 10px; box-sizing: border-box;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: transparent; color: var(--text-primary); font-size: var(--font-size-sm);
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  cursor: pointer; transition: border-color .2s;
}
.dp-trigger:hover, .dp.open .dp-trigger { border-color: var(--primary); outline: none; }
.dp-value-clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-caret { width: 12px; height: 12px; flex-shrink: 0; color: var(--text-tertiary); transition: transform .2s; }
.dp.open .dp-caret { transform: rotate(180deg); }
.dp-panel {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 300;
  background: var(--bg-primary); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: 0 4px 16px rgba(0,0,0,.12); overflow: hidden;
}
.dp.open .dp-panel { display: flex; }
.dp-col { max-height: 264px; overflow-y: auto; }
.dp-col-left { width: 132px; flex-shrink: 0; border-right: 1px solid var(--border-light); background: var(--bg-section, #f5f7fa); }
.dp-col-right { min-width: 280px; }
.dp-item {
  padding: 8px 12px; font-size: var(--font-size-sm); color: var(--text-primary);
  cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.dp-item:hover { background: var(--bg-hover); }
.dp-item.active { color: var(--primary); font-weight: 600; background: var(--primary-light); }
.dp-item .dp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-item .dp-sub { font-size: 12px; color: var(--text-tertiary); font-weight: 400; flex-shrink: 0; }
.dp-item-all { color: var(--text-secondary); }

/* ========== 列表卡 ========== */
.cr-list-card {
  flex: 1; min-height: 0;
  background: var(--bg-primary); border: 1px solid var(--border-section); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); overflow: hidden; display: flex; flex-direction: column;
}
.cr-list-header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border-light);
}
.cr-list-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cr-bar { width: 4px; height: 16px; border-radius: 2px; background: var(--primary); flex-shrink: 0; }
.cr-list-title-text { font-size: var(--font-size-md); font-weight: 600; white-space: nowrap; }
.cr-list-sub { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-list-actions { display: flex; gap: 8px; flex-shrink: 0; }
.cr-list-actions .btn { display: inline-flex; align-items: center; gap: 6px; }
.cr-list-actions .btn svg { width: 14px; height: 14px; }
.cr-table-scroll {
  flex: 1; min-height: 0; overflow: auto;
  margin: 12px 20px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-page-solid);
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.cr-list-card > .pagination { flex-shrink: 0; }
.cr-table { width: 100%; min-width: 1200px; border-collapse: separate; border-spacing: 0; }
.cr-table thead th {
  position: sticky; top: 0; z-index: 2; background: #f0f2f5;
  text-align: left; padding: 12px 16px; font-size: var(--font-size-sm); font-weight: 600;
  color: var(--text-primary); border-bottom: 1px solid var(--border-light); white-space: nowrap;
}
.cr-table thead th:first-child { width: 60px; text-align: center; }
.cr-table thead th:nth-child(2) { width: 50px; text-align: center; }
.cr-table tbody td {
  padding: 12px 16px; height: 48px; box-sizing: border-box; font-size: var(--font-size-sm);
  color: var(--text-primary); border-bottom: 1px solid var(--border-light); vertical-align: middle;
  background: var(--bg-primary);
}
.cr-table tbody td:first-child { text-align: center; color: var(--text-secondary); }
.cr-table tbody td:nth-child(2) { text-align: center; }
.cr-table tbody tr:hover td { background: var(--bg-hover); }
.cr-cell-clip { display: block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-action-col { white-space: nowrap; }
.cr-empty-row td { text-align: center; padding: 56px 16px !important; color: var(--text-tertiary); }
.hz-count { color: var(--text-primary); font-weight: 600; }
.hz-count.zero { color: var(--text-tertiary); font-weight: 400; }

/* ========== 复选框样式 ========== */
.cr-checkbox { width: 16px; height: 16px; cursor: pointer; }
.cr-checkbox-all { width: 16px; height: 16px; cursor: pointer; }

/* ========== 标签 ========== */
.tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
.tag-green { background: var(--success-light); color: var(--success); }
.tag-gray { background: var(--bg-section-alt); color: var(--text-secondary); }
.tag-orange { background: var(--warning-light); color: var(--warning); }
.tag-red { background: var(--danger-light); color: var(--danger); }
.tag-blue { background: var(--info-light); color: var(--info); }
.tag-yellow { background: #fadb14; color: #8c6900; }

/* ========== 链接按钮 / Toast ========== */
.btn-link { padding: 0; border: none; background: none; color: var(--primary); cursor: pointer; font-size: var(--font-size-sm); }
.btn-link:hover { text-decoration: underline; }
.toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius-md); background: var(--bg-primary);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); font-size: var(--font-size-sm);
  color: var(--text-primary); border-left: 4px solid var(--primary);
  animation: toastIn .3s ease; max-width: 420px;
}
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ========== 整页详情 ========== */
.cr-detail { display: none; }
.cr-detail.show { display: block; flex: 1; min-height: 0; overflow-y: auto; }
.cr-detail-top {
  display: flex; align-items: center; gap: 16px; background: var(--bg-primary);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 20px; margin-bottom: 16px;
}
.cr-detail-title { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-lg); font-weight: 600; min-width: 0; }
.cr-detail-card {
  background: var(--bg-primary); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  padding: 20px 24px; margin-bottom: 16px;
}
.cr-section-title { font-size: 15px; font-weight: 600; margin: 0 0 16px; padding-left: 10px; border-left: 3px solid var(--primary); line-height: 1.4; }
.cr-kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; row-gap: 12px; }
.cr-kv { display: flex; gap: 8px; font-size: 14px; line-height: 1.6; min-width: 0; }
.cr-kv.full { grid-column: 1 / -1; }
.cr-kv-label { flex: 0 0 128px; color: var(--text-secondary); text-align: right; }
.cr-kv-value { flex: 1; min-width: 0; color: var(--text-primary); word-break: break-word; }
.cr-photo-row { display: flex; gap: 16px; margin-top: 12px; }
.cr-photo-box { width: 96px; }
.cr-photo-box img { width: 96px; height: 96px; border-radius: var(--radius-md); border: 1px solid var(--border-light); display: block; }
.cr-photo-caption { margin-top: 4px; font-size: 12px; color: var(--text-tertiary); text-align: center; }

/* ========== 隐患明细块 ========== */
.cr-hazard-block { border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; }
.cr-hazard-block:last-child { margin-bottom: 0; }
.cr-hazard-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; }
.cr-hazard-head .id { color: var(--text-secondary); font-weight: 500; font-size: 13px; }
.cr-empty-hazard { color: var(--text-tertiary); font-size: 14px; padding: 8px 0; }

@media (max-width: 1100px) {
  .cr-kv-grid { grid-template-columns: 1fr; }
  .cr-kv-label { flex-basis: 100px; }
}

        { id:'CR2026040602', enterprise:'深圳港物流有限公司', object:'深圳港物流有限公司', objectType:'企业', domain:'危险边坡', domainKey:'chem-storage', checkType:'政府巡查', checkTime:'2026-04-06 15:30', checklist:'边坡安全巡查表', hazards:[] },
        { id:'CR2026040802', enterprise:'创安电子科技有限公司', object:'创安电子科技有限公司', objectType:'企业', domain:'电动自行车充电场所', domainKey:'charging', checkType:'企业自查', checkTime:'2026-04-08 10:20', checklist:'充电设施每日巡检表', hazards:[
          { id:'HD2026041301', desc:'充电桩接地保护失效，存在触电风险', level:'一般隐患', type:'电气', status:'待整改' },
          { id:'HD2026041302', desc:'充电区域未配置消防沙箱和灭火毯', level:'重大隐患', type:'消防安全', status:'待复核' }
        ]},
        { id:'CR2026041002', enterprise:'粤海街道商业广场', object:'粤海街道商业广场', objectType:'重点场所', domain:'商业综合体', domainKey:'market', checkType:'政府巡查', checkTime:'2026-04-10 11:15', checklist:'消防安全检查表', hazards:[
          { id:'HD2026041401', desc:'商场疏散通道被商户货物占用，宽度不足', level:'一般隐患', type:'消防安全', status:'已超期' }
        ]}
      ];

      function pad2(n) { return n < 10 ? '0' + n : String(n); }

      function esc(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function creditCode(seed) {
        var text = D.hash(seed).toString(36).toUpperCase();
        while (text.length < 8) text = '0' + text;
        return '91440300MA' + text.slice(0, 8);
      }

      function buildHazard(raw, check) {
        var hazard = Object.assign({}, raw);
        var seed = raw.id;
        var hasReform = raw.status === '待复核' || raw.status === '已整改' || raw.status === '已超期';
        var hasReview = raw.status === '已整改' || raw.status === '已超期';
        var baseDate = check.checkTime.slice(0, 10);
        hazard.type = raw.type || D.pick(seed + 't', HAZARD_TYPES);
        hazard.hasReform = hasReform;
        hazard.hasReview = hasReview;
        hazard.overdue = raw.status === '已超期' ? '已超期' : '未超期';
        hazard.method = raw.level === '重大隐患' ? '立即整改' : D.pick(seed + 'm', ['立即整改', '限期整改（3天）', '限期整改（7天）']);
        hazard.rectifyPerson = hasReform ? D.pick(seed + 'p', ENT_USERS) : '—';
        hazard.rectifyTime = hasReform ? D.addDays(baseDate, D.int(seed, 1, 3)) + ' ' + pad2(D.int(seed + 'h', 9, 17)) + ':' + pad2(D.int(seed + 'mi', 0, 59)) : '—';
        hazard.rectifyFeedback = hasReform ? '已按检查要求完成整改，现场复查符合要求。' : '—';
        hazard.rectifyBasis = '《中华人民共和国安全生产法》第三十六条';
        hazard.reviewer = hasReform ? (check.checkType === '企业自查' ? ENT_REVIEWER : D.pick(seed + 'rv', GOV_REVIEWERS)) : '—';
        hazard.reviewResult = raw.status === '已整改' ? '同意' : (raw.status === '已超期' ? '不同意' : '—');
        hazard.reviewOpinion = hazard.reviewResult === '同意'
          ? '已按要求整改，隐患消除，同意闭环。'
          : (hazard.reviewResult === '不同意' ? '现场整改不到位，退回重新整改。' : '—');
        hazard.reviewTime = hasReview ? D.addDays(baseDate, D.int(seed + 'x', 3, 6)) + ' ' + pad2(D.int(seed + 'rh', 9, 17)) + ':' + pad2(D.int(seed + 'rm', 0, 59)) : '—';
        hazard.hazardPhoto = D.photoSvg('hazard', seed);
        hazard.reformPhoto = hasReform ? D.photoSvg('reform', seed) : null;
        return hazard;
      }

      var DOMAIN_NAME_META = {};
      (window.DOMAIN_TABLE_DATA || []).forEach(function (d) { DOMAIN_NAME_META[d.name] = d; });

      function buildCheck(raw) {
        var record = Object.assign({}, raw);
        record.region = D.regionParts(D.pick(raw.id, REGION_POOL));
        record.creditCode = creditCode(raw.id);
        var domainMeta = DOMAIN_NAME_META[raw.domain];
        record.domainBig = domainMeta ? domainMeta.industryName : D.bigDomain(raw.domain);
        record.checker = raw.checkType === '政府巡查'
          ? D.pick(raw.id + 'c', GOV_CHECKERS)
          : D.pick(raw.id + 'e', ENT_USERS) + '（企业安全员）';
        record.codeState = D.codeState(raw.id);
        record.photo = D.photoSvg('check', raw.id);
        record.hazards = (raw.hazards || []).map(function (hazard) { return buildHazard(hazard, record); });
        return record;
      }

      var checkRecords = RAW_CHECKS.map(buildCheck);

      /* ========== 筛选 ========== */
      /* 领域小类选择状态：{ type:'all' } | { type:'industry', industry } | { type:'domain', name } */
      var domainFilter = { type: 'all', industry: null, name: null };

      function readPageFilters() {
        return {
          checkType: document.getElementById('filterCheckType').value,
          domain: domainFilter,
          dateStart: document.getElementById('filterDateStart').value,
          dateEnd: document.getElementById('filterDateEnd').value,
          keyword: document.getElementById('filterKeyword').value.trim().toLowerCase()
        };
      }

      function checkText(record) {
        var parts = [record.enterprise, record.object, record.checker, record.checklist, record.domain];
        record.hazards.forEach(function (hazard) { parts.push(hazard.desc); });
        return parts.join(' ').toLowerCase();
      }

      function getFilteredData() {
        var filters = readPageFilters();
        return checkRecords.filter(function (record) {
          if (filters.checkType !== '全部' && record.checkType !== filters.checkType) return false;
          if (filters.domain.type === 'industry' && record.domainBig !== filters.domain.industry) return false;
          if (filters.domain.type === 'domain' && record.domain !== filters.domain.name) return false;
          var date = record.checkTime.slice(0, 10);
          if (filters.dateStart && date < filters.dateStart) return false;
          if (filters.dateEnd && date > filters.dateEnd) return false;
          if (filters.keyword && checkText(record).indexOf(filters.keyword) < 0) return false;
          return true;
        });
      }

      function typeClass(type) {
        return type === '政府巡查' ? 'tag-blue' : 'tag-green';
      }

      function levelClass(level) {
        return level === '重大隐患' ? 'tag-red' : 'tag-yellow';
      }

      function statusClass(status) {
        if (status === '待整改') return 'tag-blue';
        if (status === '待复核') return 'tag-orange';
        if (status === '已整改') return 'tag-green';
        if (status === '已超期') return 'tag-red';
        return 'tag-gray';
      }

      function renderTable() {
        var tbody = document.getElementById('recordTableBody');
        var data = state.filtered;
        if (!data.length) {
          tbody.innerHTML = '<tr class="cr-empty-row"><td colspan="10">暂无检查记录</td></tr>';
          return;
        }
        var start = (state.currentPage - 1) * state.pageSize;
        var rows = data.slice(start, start + state.pageSize);
        var html = '';
        rows.forEach(function (record, index) {
          var count = record.hazards.length;
          var rowNum = start + index + 1;
          html += '<tr>' +
            '<td><input type="checkbox" class="cr-checkbox" data-id="' + esc(record.id) + '"></td>' +
            '<td>' + rowNum + '</td>' +
            '<td>' + esc(record.checkTime) + '</td>' +
            '<td><span class="cr-cell-clip" title="' + esc(record.enterprise) + '">' + esc(record.enterprise) + '</span></td>' +
            '<td><span class="cr-cell-clip" title="' + esc(record.object) + '">' + esc(record.object) + '</span></td>' +
            '<td><span class="cr-cell-clip" title="' + esc(record.checklist) + '">' + esc(record.checklist) + '</span></td>' +
            '<td>' + esc(record.checker) + '</td>' +
            '<td><span class="tag ' + typeClass(record.checkType) + '">' + esc(record.checkType) + '</span></td>' +
            '<td><span class="hz-count' + (count ? '' : ' zero') + '">' + count + '</span></td>' +
            '<td class="cr-action-col"><button class="btn-link" type="button" data-view="' + esc(record.id) + '">查看</button></td>' +
          '</tr>';
        });
        tbody.innerHTML = html;
      }

      var pg = null;

      function applyFilter(resetPage) {
        if (resetPage) state.currentPage = 1;
        state.filtered = getFilteredData();
        document.getElementById('listSubtitle').textContent = '共 ' + state.filtered.length + ' 条检查记录';
        if (pg) pg.setTotal(state.filtered.length);
        var maxPage = Math.ceil(state.filtered.length / state.pageSize) || 1;
        if (state.currentPage > maxPage) state.currentPage = maxPage;
        renderTable();
        if (pg) pg.setPage(state.currentPage);
      }

      /* ========== 详情 ========== */
      function findRecord(id) {
        for (var i = 0; i < checkRecords.length; i++) {
          if (checkRecords[i].id === id) return checkRecords[i];
        }
        return null;
      }

      function kv(label, valueHtml, full) {
        return '<div class="cr-kv' + (full ? ' full' : '') + '"><span class="cr-kv-label">' + esc(label) + '：</span><span class="cr-kv-value">' + valueHtml + '</span></div>';
      }

      function photoBox(svg, caption) {
        if (!svg) return '';
        return '<div class="cr-photo-box"><img alt="' + esc(caption) + '" src="data:image/svg+xml,' + encodeURIComponent(svg) + '"><div class="cr-photo-caption">' + esc(caption) + '</div></div>';
      }

      function renderHazardBlock(hazard, index) {
        var html = '<div class="cr-hazard-block">';
        html += '<div class="cr-hazard-head">隐患 ' + (index + 1) +
          ' <span class="id">' + esc(hazard.id) + '</span>' +
          '<span class="tag ' + levelClass(hazard.level) + '">' + esc(hazard.level) + '</span>' +
          '<span class="tag ' + statusClass(hazard.status) + '">' + esc(hazard.status) + '</span></div>';
        html += '<div class="cr-kv-grid">';
        html += kv('隐患描述', esc(hazard.desc), true);
        html += kv('隐患类型', esc(hazard.type));
        html += kv('整改是否超期', '<span class="tag ' + (hazard.overdue === '已超期' ? 'tag-red' : 'tag-gray') + '">' + esc(hazard.overdue) + '</span>');
        html += kv('整改方式', esc(hazard.method));
        html += kv('整改隐患整改人', esc(hazard.rectifyPerson));
        html += kv('整改时间', esc(hazard.rectifyTime));
        html += kv('整改反馈', esc(hazard.rectifyFeedback), true);
        html += kv('整改依据', esc(hazard.rectifyBasis), true);
        html += kv('复核人', esc(hazard.reviewer));
        html += kv('复核结果', hazard.reviewResult === '—' ? '—' : '<span class="tag ' + (hazard.reviewResult === '同意' ? 'tag-green' : 'tag-red') + '">' + esc(hazard.reviewResult) + '</span>');
        html += kv('复核时间', esc(hazard.reviewTime));
        html += kv('复核意见', esc(hazard.reviewOpinion), true);
        html += '</div>';
        html += '<div class="cr-photo-row">' + photoBox(hazard.hazardPhoto, '隐患照片') + photoBox(hazard.reformPhoto, '整改照片') + '</div>';
        html += '</div>';
        return html;
      }

      function renderDetail(record) {
        document.getElementById('detailTitle').textContent = '检查记录详情 · ' + record.id;
        document.getElementById('detailTypeTag').innerHTML = '<span class="tag ' + typeClass(record.checkType) + '">' + esc(record.checkType) + '</span>';

        var html = '';
        html += '<div class="cr-detail-card"><div class="cr-section-title">检查信息</div><div class="cr-kv-grid">';
        html += kv('企业名称', esc(record.enterprise));
        html += kv('统一社会信用代码', esc(record.creditCode));
        html += kv('领域大类', esc(record.domainBig));
        html += kv('领域小类', esc(record.domain));
        html += kv('所属街道', esc(record.region.street));
        html += kv('所属社区', esc(record.region.community));
        html += kv('所属网格', esc(record.region.grid));
        html += kv('管控对象', esc(record.object));
        html += kv('管控对象类型', esc(record.objectType));
        html += kv('检查表名称', esc(record.checklist));
        html += kv('检查时间', esc(record.checkTime));
        html += kv('检查人', esc(record.checker));
        html += kv('检查分类', '<span class="tag ' + typeClass(record.checkType) + '">' + esc(record.checkType) + '</span>');
        html += kv('安全码状态', '<span class="tag ' + (record.codeState === '绿码' ? 'tag-green' : record.codeState === '黄码' ? 'tag-yellow' : record.codeState === '红码' ? 'tag-red' : 'tag-gray') + '">' + esc(record.codeState) + '</span>');
        html += kv('隐患数', '<span class="hz-count' + (record.hazards.length ? '' : ' zero') + '">' + record.hazards.length + '</span>');
        html += '</div><div class="cr-photo-row">' + photoBox(record.photo, '检查照片') + '</div></div>';

        html += '<div class="cr-detail-card"><div class="cr-section-title">隐患信息</div>';
        if (!record.hazards.length) {
          html += '<div class="cr-empty-hazard">本次检查未发现隐患。</div>';
        } else {
          record.hazards.forEach(function (hazard, index) { html += renderHazardBlock(hazard, index); });
        }
        html += '</div>';
        document.getElementById('detailBody').innerHTML = html;
      }

      function openDetail(id) {
        var record = findRecord(id);
        if (!record) return;
        state.detailId = id;
        renderDetail(record);
        document.getElementById('view-list').style.display = 'none';
        document.getElementById('view-detail').classList.add('show');
        window.scrollTo(0, 0);
      }

      function closeDetail() {
        state.detailId = null;
        document.getElementById('view-detail').classList.remove('show');
        document.getElementById('view-list').style.display = '';
        applyFilter(false);
      }

      /* ========== 导出 ========== */
      var EXPORT_FILTER_DEFS = [
        { id: 'checkType', label: '检查分类', options: ['政府巡查', '企业自查'] },
        { id: 'domainBig', label: '领域大类', options: ['公共场所类', '建设工程类', '危险化学品类', '交通运输类', '其他类'] },
        { id: 'street', label: '所属街道', options: ['南山街道', '粤海街道', '沙河街道', '南头街道', '招商街道'] },
        { id: 'enterprise', label: '企业名称', type: 'text', placeholder: '按包含匹配' },
        { id: 'creditCode', label: '统一社会信用代码', type: 'text', placeholder: '支持部分匹配' },
        { id: 'object', label: '管控对象名称', type: 'text', placeholder: '按包含匹配' },
        { id: 'checker', label: '检查人', type: 'text', placeholder: '姓名 / 单位' },
        { id: 'checkDate', label: '检查时间', type: 'dateRange' },
        { id: 'codeState', label: '安全码状态', options: ['绿码', '黄码', '红码', '灰码'] }
      ];

      function exportFilterRecords(filters) {
        return getFilteredData().filter(function (record) {
          if (filters.checkType && record.checkType !== filters.checkType) return false;
          if (filters.domainBig && record.domainBig !== filters.domainBig) return false;
          if (filters.street && record.region.street !== filters.street) return false;
          if (filters.enterprise && record.enterprise.indexOf(filters.enterprise) < 0) return false;
          if (filters.creditCode && record.creditCode.indexOf(filters.creditCode) < 0) return false;
          if (filters.object && record.object.indexOf(filters.object) < 0) return false;
          if (filters.checker && record.checker.indexOf(filters.checker) < 0) return false;
          if (filters.codeState && record.codeState !== filters.codeState) return false;
          var date = record.checkTime.slice(0, 10);
          if (filters.checkDateStart && date < filters.checkDateStart) return false;
          if (filters.checkDateEnd && date > filters.checkDateEnd) return false;
          return true;
        });
      }

      function exportHeaders(withPhotos) {
        var headers = ['企业名称', '领域大类', '领域小类', '所属街道', '所属社区', '所属网格', '管控对象', '检查表名称', '检查时间'];
        if (withPhotos) headers.push('检查照片');
        headers = headers.concat(['检查人', '检查分类', '隐患描述', '隐患等级', '整改隐患整改人', '整改时间']);
        if (withPhotos) headers.push('整改照片');
        headers = headers.concat(['整改反馈', '整改依据', '复核人', '复核结果', '复核意见', '复核时间']);
        return headers;
      }

      function exportBaseValues(record) {
        return [
          record.enterprise, record.domainBig, record.domain,
          record.region.street, record.region.community, record.region.grid,
          record.object, record.checklist, record.checkTime
        ];
      }

      function exportRowValues(record, hazard, withPhotos) {
        var values = exportBaseValues(record);
        if (withPhotos) values.push('');
        values = values.concat([record.checker, record.checkType]);
        if (hazard) {
          values = values.concat([hazard.desc, hazard.level, hazard.rectifyPerson, hazard.rectifyTime]);
          if (withPhotos) values.push('');
          values = values.concat([hazard.rectifyFeedback, hazard.rectifyBasis, hazard.reviewer, hazard.reviewResult, hazard.reviewOpinion, hazard.reviewTime]);
        } else {
          values = values.concat(['—', '—', '—', '—']);
          if (withPhotos) values.push('');
          values = values.concat(['—', '—', '—', '—', '—', '—']);
        }
        return values;
      }

      function exportScopeSummary(filters) {
        var page = readPageFilters();
        var parts = [];
        if (page.checkType !== '全部') parts.push('检查分类=' + page.checkType);
        if (page.domain.type === 'industry') parts.push('领域大类=' + page.domain.industry);
        if (page.domain.type === 'domain') parts.push('领域小类=' + page.domain.name);
        if (page.dateStart || page.dateEnd) parts.push('检查时间 ' + (page.dateStart || '…') + ' 至 ' + (page.dateEnd || '…'));
        if (page.keyword) parts.push('关键词「' + page.keyword + '」');
        if (filters.checkType) parts.push('检查分类=' + filters.checkType);
        if (filters.domainBig) parts.push('领域大类=' + filters.domainBig);
        if (filters.street) parts.push('所属街道=' + filters.street);
        if (filters.enterprise) parts.push('企业含「' + filters.enterprise + '」');
        if (filters.creditCode) parts.push('信用代码含「' + filters.creditCode + '」');
        if (filters.object) parts.push('对象含「' + filters.object + '」');
        if (filters.checker) parts.push('检查人含「' + filters.checker + '」');
        if (filters.codeState) parts.push('码色=' + filters.codeState);
        if (filters.checkDateStart || filters.checkDateEnd) parts.push('检查时间 ' + (filters.checkDateStart || '…') + ' 至 ' + (filters.checkDateEnd || '…'));
        return parts.length ? parts.join('；') : '全部检查记录';
      }

      function initExport() {
        if (!window.ExportCenter) return;
        window.ExportCenter.init({
          moduleKey: 'gov-check-task',
          moduleName: '检查记录',
          exportTitle: '导出检查记录',
          filePrefix: '检查记录',
          entryButtonId: 'btnEcEntry',
          filters: EXPORT_FILTER_DEFS,
          scopeSummary: exportScopeSummary,
          photoTip: '开启后内嵌检查照片 / 整改照片列',
          emptyText: '暂无可导出检查记录',
          getData: function (filters, withPhotos) {
            var records = exportFilterRecords(filters);
            var headers = exportHeaders(withPhotos);
            var values = [];
            var photoSvgs = [];
            records.forEach(function (record) {
              var list = record.hazards.length ? record.hazards : [null];
              list.forEach(function (hazard) {
                values.push(exportRowValues(record, hazard, withPhotos));
                var arr = headers.map(function () { return null; });
                if (withPhotos) {
                  var checkPhotoIndex = headers.indexOf('检查照片');
                  var reformPhotoIndex = headers.indexOf('整改照片');
                  if (checkPhotoIndex >= 0) arr[checkPhotoIndex] = record.photo;
                  if (reformPhotoIndex >= 0 && hazard && hazard.reformPhoto) arr[reformPhotoIndex] = hazard.reformPhoto;
                }
                photoSvgs.push(arr);
              });
            });
            return { headers: headers, values: values, photoSvgs: photoSvgs };
          }
        });
      }

      /* ========== Toast / 事件 / 初始化 ========== */
      window.showToast = function (message) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function () { toast.classList.add('out'); }, 2400);
        setTimeout(function () { toast.remove(); }, 2750);
      };

      function bind() {
        document.getElementById('btnQuery').addEventListener('click', function () { applyFilter(true); });
        document.getElementById('btnReset').addEventListener('click', function () {
          document.getElementById('filterCheckType').value = '全部';
          resetDomainPicker();
          document.getElementById('filterDateStart').value = '';
          document.getElementById('filterDateEnd').value = '';
          document.getElementById('filterKeyword').value = '';
          applyFilter(true);
        });
        document.getElementById('recordTableBody').addEventListener('click', function (event) {
          var view = event.target.closest('[data-view]');
          if (view) openDetail(view.getAttribute('data-view'));
        });
        document.getElementById('btnBackList').addEventListener('click', closeDetail);
      }

      /* ========== 领域小类 左右两栏选择器（数据源：js/domain-data.js 领域小类管理公共数据） ========== */
      var dpBrowse = null; // 左栏当前浏览的大类（null = 全部大类）

      function domainGroups() {
        var groups = [];
        var map = {};
        (window.DOMAIN_TABLE_DATA || []).forEach(function (d) {
          if (!map[d.industryName]) {
            map[d.industryName] = [];
            groups.push({ industry: d.industryName, list: map[d.industryName] });
          }
          map[d.industryName].push(d);
        });
        return groups;
      }

      function dpLabel() {
        if (domainFilter.type === 'industry') return domainFilter.industry + '（全部）';
        if (domainFilter.type === 'domain') return domainFilter.name;
        return '全部';
      }

      function dpSyncTrigger() {
        document.getElementById('dpValue').textContent = dpLabel();
      }

      function dpSetActive(list, match) {
        var items = list.querySelectorAll('.dp-item');
        items.forEach(function (el) {
          el.classList.toggle('active', match(el));
        });
      }

      function dpRenderLeft() {
        var groups = domainGroups();
        var html = '<div class="dp-item dp-item-all" data-industry="">'
          + '<span class="dp-name">全部大类</span>'
          + '<span class="dp-sub">' + (window.DOMAIN_TABLE_DATA || []).length + '</span></div>';
        groups.forEach(function (g) {
          html += '<div class="dp-item" data-industry="' + esc(g.industry) + '" title="' + esc(g.industry) + '">'
            + '<span class="dp-name">' + esc(g.industry) + '</span>'
            + '<span class="dp-sub">' + g.list.length + '</span></div>';
        });
        var col = document.getElementById('dpColIndustry');
        col.innerHTML = html;
        dpSetActive(col, function (el) {
          return el.getAttribute('data-industry') === (dpBrowse || '');
        });
      }

      function dpRenderRight() {
        var col = document.getElementById('dpColDomain');
        var html = '';
        if (dpBrowse) {
          var group = domainGroups().filter(function (g) { return g.industry === dpBrowse; })[0];
          html += '<div class="dp-item dp-item-all" data-scope="industry" data-industry="' + esc(dpBrowse) + '">'
            + '<span class="dp-name">全部「' + esc(dpBrowse) + '」</span><span class="dp-sub">大类</span></div>';
          (group ? group.list : []).forEach(function (d) {
            html += '<div class="dp-item" data-scope="domain" data-name="' + esc(d.name) + '" title="' + esc(d.name) + '">'
              + '<span class="dp-name">' + esc(d.name) + '</span>'
              + '<span class="dp-sub">' + esc((DOMAIN_NAME_META[d.name] && DOMAIN_NAME_META[d.name].mode === 'basic' ? '基础' : DOMAIN_NAME_META[d.name].mode === 'project' ? '项目' : DOMAIN_NAME_META[d.name].mode === 'special' ? '重点' : '其他')) + '</span></div>';
          });
        } else {
          (window.DOMAIN_TABLE_DATA || []).forEach(function (d) {
            html += '<div class="dp-item" data-scope="domain" data-name="' + esc(d.name) + '" title="' + esc(d.name) + '">'
              + '<span class="dp-name">' + esc(d.name) + '</span>'
              + '<span class="dp-sub">' + esc(d.industryName) + '</span></div>';
          });
        }
        col.innerHTML = html;
        dpSetActive(col, function (el) {
          if (domainFilter.type === 'industry' && el.getAttribute('data-scope') === 'industry') {
            return el.getAttribute('data-industry') === domainFilter.industry;
          }
          if (domainFilter.type === 'domain') {
            return el.getAttribute('data-name') === domainFilter.name;
          }
          return false;
        });
      }

      function dpOpenPanel(open) {
        var dp = document.getElementById('domainPicker');
        dp.classList.toggle('open', open);
        if (open) { dpRenderLeft(); dpRenderRight(); }
      }

      function resetDomainPicker() {
        domainFilter = { type: 'all', industry: null, name: null };
        dpBrowse = null;
        dpSyncTrigger();
        dpOpenPanel(false);
      }

      function initDomainPicker() {
        var dp = document.getElementById('domainPicker');
        document.getElementById('dpTrigger').addEventListener('click', function (event) {
          event.stopPropagation();
          dpOpenPanel(!dp.classList.contains('open'));
        });
        document.getElementById('dpColIndustry').addEventListener('click', function (event) {
          var item = event.target.closest('.dp-item');
          if (!item) return;
          var industry = item.getAttribute('data-industry');
          dpBrowse = industry || null;
          dpRenderLeft();
          dpRenderRight();
        });
        document.getElementById('dpColDomain').addEventListener('click', function (event) {
          var item = event.target.closest('.dp-item');
          if (!item) return;
          var scope = item.getAttribute('data-scope');
          if (scope === 'industry') {
            domainFilter = { type: 'industry', industry: item.getAttribute('data-industry'), name: null };
          } else {
            domainFilter = { type: 'domain', industry: null, name: item.getAttribute('data-name') };
          }
          dpSyncTrigger();
          dpOpenPanel(false);
        });
        document.addEventListener('click', function (event) {
          if (!dp.contains(event.target)) dpOpenPanel(false);
        });
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') dpOpenPanel(false);
        });
        dpSyncTrigger();
      }

      function pushBreadcrumb() {
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({
              type: 'breadcrumb',
              moduleId: CONFIG.moduleId,
              moduleName: CONFIG.moduleName,
              path: [{ label: '政府端' }, { label: '检查记录管理' }]
            }, '*');
          }
        } catch (err) { /* iframe 跨域忽略 */ }
      }

      function toggleAllCheckboxes(checkbox) {
        var checkboxes = document.querySelectorAll('.cr-checkbox');
        for (var i = 0; i < checkboxes.length; i++) {
          checkboxes[i].checked = checkbox.checked;
        }
      }

      function init() {
        if (state.initialized) return;
        state.initialized = true;
        initDomainPicker();
        pg = new Pagination('paginationBar', {
          total: 0,
          size: state.pageSize,
          onChange: function (page, size) {
            state.currentPage = page;
            state.pageSize = size;
            renderTable();
          }
        });
        bind();
        applyFilter(true);
        initExport();
        pushBreadcrumb();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      window.destroyModule = function () { state.initialized = false; };
    })();
  </script>
  <script src="../../js/annotations.js"></script>
</body>
</html>
