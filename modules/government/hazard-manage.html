<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐患管理 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
/* ========== 页面标题栏 ========== */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-md);
  background: var(--bg-primary);
  padding: var(--spacing-md) var(--spacing-lg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.page-title { font-size: var(--font-size-lg); font-weight: 600; }

/* ========== 统计卡片 ========== */
.stats-row { grid-template-columns: repeat(5, 1fr); }

/* ========== 分屏视图 ========== */
.split-view {
  display: flex;
  gap: 20px;
  height: calc(100vh - 300px);
  min-height: 400px;
}

/* ========== 左侧树形面板 ========== */
.tree-panel {
  width: 280px;
  flex-shrink: 0;
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
}
.tree-header {
  padding: var(--spacing-md);
  border-bottom: 1px solid var(--border-section);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-section);
}
.tree-title { font-size: var(--font-size-md); font-weight: 600; }
.tree-body { flex: 1; overflow-y: auto; padding: var(--spacing-sm) 0; }

/* ========== 右侧列表面板 ========== */
.detail-panel {
  flex: 1;
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
}
.detail-header {
  padding: var(--spacing-md) 20px;
  border-bottom: 1px solid var(--border-section);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-section);
}
.detail-title { font-size: var(--font-size-lg); font-weight: 600; }
.detail-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* ========== 树节点样式 ========== */
.tree-node {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  margin: 0 4px;
  transition: all var(--duration-fast);
  user-select: none;
}
.tree-node:hover { background: var(--bg-hover); }
.tree-node.active { background: var(--primary-light); color: var(--primary); }
.tree-toggle {
  width: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.tree-toggle.expanded { transform: rotate(90deg); }
.tree-toggle.leaf { visibility: hidden; }
.tree-node-icon { margin: 0 6px; font-size: 14px; flex-shrink: 0; }
.tree-node-label {
  font-size: var(--font-size-sm);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-children { display: none; padding-left: 16px; }
.tree-children.show { display: block; }

/* ========== 筛选栏 ========== */
.filter-bar {
  display: flex;
  gap: var(--spacing-sm);
  align-items: center;
  flex-wrap: wrap;
}
.filter-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md) 20px;border:1px solid var(--border-section);margin-bottom:var(--spacing-md)}
.filter-card .filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:transparent}
.filter-card .filter-item{display:flex;align-items:center;gap:6px}
.filter-card .filter-bar select,.filter-card .filter-bar input{width:240px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box}
.filter-item select, .filter-item input {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  background: var(--bg-primary);
}
.filter-item select:focus, .filter-item input:focus {
  border-color: var(--primary);
  outline: none;
}

/* ========== 表格容器 ========== */
.table-wrap {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.table-scroll { overflow-x: auto; }
.table-scroll table { width: 100%; min-width: 1000px; border-collapse: collapse; }
.table-scroll thead tr { background: var(--bg-section); }
.table-scroll th { padding: 12px var(--spacing-md); text-align: left; font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border-light); }
.table-scroll td { padding: 12px var(--spacing-md); font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-light); }
.table-scroll tbody tr:nth-child(even) { background: var(--bg-section-alt); }
.table-scroll tbody tr:hover td { background: var(--bg-hover); }
.ellipsis-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.action-col .btn-link { margin-right: 4px; }
.action-col .btn-link:last-child { margin-right: 0; }

/* ========== 标签样式 ========== */
.tag { display: inline-block; padding: 2px var(--spacing-sm); border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
.tag-green { background: var(--success-light); color: var(--success); }
.tag-gray { background: var(--bg-section-alt); color: var(--text-secondary); }
.tag-orange { background: var(--warning-light); color: var(--warning); }
.tag-red { background: var(--danger-light); color: var(--danger); }
.tag-blue { background: var(--info-light); color: var(--info); }
.tag-info { background: var(--info-light); color: var(--info); }
.tag-warning { background: var(--warning-light); color: var(--warning); }
.tag-error { background: var(--danger-light); color: var(--danger); }
.tag-yellow { background: var(--warning-light); color: var(--warning); }

/* ========== 弹窗 ========== */
.modal-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9998; display: none; }
.modal-container.show { display: flex; align-items: center; justify-content: center; }
.modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); }
.modal-dialog { position: relative; background: var(--bg-primary); border-radius: var(--radius-lg); box-shadow: var(--shadow-elevated); max-height: 90vh; display: flex; flex-direction: column; animation: modalSlideIn 0.3s ease-out; }
@keyframes modalSlideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--border-light); }
.modal-title { font-size: var(--font-size-lg); font-weight: 500; color: var(--text-primary); }
.modal-close { width: 32px; height: 32px; border: none; background: transparent; font-size: var(--font-size-xxl); color: var(--text-tertiary); cursor: pointer; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; transition: background-color var(--duration-fast), color var(--duration-fast); }
.modal-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.modal-body { padding: var(--spacing-lg); overflow-y: auto; flex: 1; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--spacing-sm); padding: var(--spacing-md) var(--spacing-lg); border-top: 1px solid var(--border-light); }

/* ========== 链接按钮 ========== */
.btn-link { padding: var(--spacing-xs) var(--spacing-sm); border: none; background: none; color: var(--primary); cursor: pointer; font-size: var(--font-size-sm); }
.btn-link:hover { text-decoration: underline; }
.btn-link.danger { color: var(--danger); }

/* ========== Toast ========== */
.toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: var(--spacing-sm); }
.toast { padding: 12px 20px; border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: 0 4px 16px rgba(0,0,0,0.12); font-size: var(--font-size-sm); color: var(--text-primary); animation: toastIn 0.3s ease; display: flex; align-items: center; gap: var(--spacing-sm); border-left: 4px solid var(--primary); max-width: 420px; }
.toast.out { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ========== 详情行 ========== */
.detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.detail-row:last-child { border-bottom: none; }
.detail-label { width: 100px; flex-shrink: 0; color: var(--text-secondary); font-size: var(--font-size-sm); }
.detail-value { flex: 1; font-size: var(--font-size-sm); color: var(--text-primary); min-width: 0; overflow-wrap: break-word; }

/* ========== 详情分区标题 ========== */
.detail-section-title { font-size: var(--font-size-md); font-weight: 600; color: var(--text-primary); margin: var(--spacing-lg) 0 var(--spacing-sm) 0; padding-bottom: var(--spacing-xs); border-bottom: 2px solid var(--primary); display: inline-block; }
.detail-section-title:first-child { margin-top: 0; }

/* ========== 时间轴（4节点） ========== */
.timeline { padding: var(--spacing-sm) 0 var(--spacing-sm) var(--spacing-md); border-left: 2px solid var(--border); margin-left: 6px; }
.timeline-item { position: relative; padding: 0 0 var(--spacing-md) var(--spacing-md); }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -21px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg-primary); box-shadow: 0 0 0 2px var(--primary-light); }
.timeline-item.done::before { background: var(--success); box-shadow: 0 0 0 2px var(--success-light); }
.timeline-item.warn::before { background: var(--warning); box-shadow: 0 0 0 2px var(--warning-light); }
.timeline-item.error::before { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-light); }
.timeline-item.current::before { background: var(--info); box-shadow: 0 0 0 2px var(--info-light); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--info-light); } 50% { box-shadow: 0 0 0 6px var(--info-light); } }
.timeline-time { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-bottom: 2px; }
.timeline-content { font-size: var(--font-size-sm); color: var(--text-primary); }
.timeline-tag { display: inline-block; padding: 1px 6px; border-radius: var(--radius-sm); font-size: 11px; margin-right: 4px; }

/* ========== 树搜索 ========== */
.tree-search {
  padding: var(--spacing-sm) var(--spacing-md);
  border-bottom: 1px solid var(--border-section);
}
.tree-search input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  background: var(--bg-primary);
}
.tree-search input:focus {
  border-color: var(--primary);
  outline: none;
}

/* ========== 空状态 ========== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: var(--font-size-md); }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="module-page page-container" data-module="government/hazard-manage">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item current">政府端</span>
    </div>

    <!-- 页面标题 -->
    <div class="page-header">
      <h1 class="page-title">隐患管理</h1>
      <div style="display: flex; gap: var(--spacing-sm);">
        <button class="btn btn-default" onclick="exportReport()">导出报表</button>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">隐患总数</div>
          <div class="stat-value" style="color: var(--primary);" id="statTotal">42</div>
        </div>
        <div class="stat-indicator" style="background: var(--primary);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">待整改</div>
          <div class="stat-value" style="color: var(--primary);" id="statPending">12</div>
        </div>
        <div class="stat-indicator" style="background: var(--primary);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">待复核</div>
          <div class="stat-value" style="color: var(--warning);" id="statReview">8</div>
        </div>
        <div class="stat-indicator" style="background: var(--warning);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">已整改</div>
          <div class="stat-value" style="color: var(--success);" id="statDone">18</div>
        </div>
        <div class="stat-indicator" style="background: var(--success);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-body">
          <div class="stat-label">已超期</div>
          <div class="stat-value" style="color: var(--danger);" id="statOverdue">2</div>
        </div>
        <div class="stat-indicator" style="background: var(--danger);"></div>
      </div>
    </div>

    <!-- 左树右列布局 -->
    <div class="split-view">
      <!-- 左侧树形面板 -->
      <div class="tree-panel">
        <div class="tree-header">
          <span class="tree-title">行业领域</span>
          <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
            <button class="btn btn-link" onclick="expandAll()" style="font-size: var(--font-size-xs);">展开</button>
            <button class="btn btn-link" onclick="collapseAll()" style="font-size: var(--font-size-xs);">收起</button>
          </div>
        </div>
        <div class="tree-search">
          <input type="text" id="treeSearchInput" placeholder="搜索行业/领域" oninput="filterTree(this.value)">
        </div>
        <div class="tree-body" id="hazardTree"></div>
      </div>

      <!-- 右侧列表面板 -->
      <div class="detail-panel">
        <div class="detail-header">
          <span class="detail-title" id="detailTitle">全部隐患</span>
        </div>
        <div class="detail-body">
          <!-- 筛选栏 -->
          <div class="filter-card"><div class="filter-bar">
            <div class="filter-item"><label>隐患状态：</label><select id="filterStatus" onchange="applyFilter()"><option>全部</option><option>待整改</option><option>待复核</option><option>已整改</option><option>已超期</option></select></div>
            <div class="filter-item"><label>隐患等级：</label><select id="filterLevel" onchange="applyFilter()"><option>全部</option><option>一般隐患</option><option>重大隐患</option></select></div>
            <div class="filter-item"><label>隐患来源：</label><select id="filterSource" onchange="applyFilter()"><option>全部</option><option>政府检查</option><option>企业自查</option><option>群众举报</option></select></div>
            <div class="filter-item"><input type="text" id="searchInput" placeholder="搜索管控对象名称" oninput="applyFilter()"></div>
            <button class="btn btn-default" onclick="resetFilter()">重置</button>
          </div></div>

          <!-- 隐患表格 -->
          <div class="table-wrap">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>隐患编号</th>
                    <th>管控对象</th>
                    <th>隐患描述</th>
                    <th>隐患等级</th>
                    <th>隐患来源</th>
                    <th>发现日期</th>
                    <th>整改期限</th>
                    <th>状态</th>
                    <th class="action-col">操作</th>
                  </tr>
                </thead>
                <tbody id="hazardTableBody">
                  <!-- 动态渲染 -->
                </tbody>
              </table>
            </div>
            <div class="pagination" id="paginationBar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 隐患详情弹窗 ========== -->
  <div class="modal-container" id="modal-hazard-detail">
    <div class="modal-overlay" onclick="closeModal('modal-hazard-detail')"></div>
    <div class="modal-dialog" style="width: 680px;">
      <div class="modal-header">
        <span class="modal-title">隐患详情</span>
        <button class="modal-close" onclick="closeModal('modal-hazard-detail')">&times;</button>
      </div>
      <div class="modal-body" id="hazardDetailBody">
        <!-- 动态渲染 -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('modal-hazard-detail')">关闭</button>
      </div>
    </div>
  </div>

  <!-- ========== 督办弹窗 ========== -->
  <div class="modal-container" id="modal-supervise">
    <div class="modal-overlay" onclick="closeModal('modal-supervise')"></div>
    <div class="modal-dialog" style="width: 520px;">
      <div class="modal-header">
        <span class="modal-title">督办意见</span>
        <button class="modal-close" onclick="closeModal('modal-supervise')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="superviseForm" class="modal-form">
          <div class="form-group">
            <label class="form-label"><span style="color: var(--danger);">*</span> 督办意见</label>
            <textarea class="form-input form-textarea" id="superviseOpinion" rows="5" placeholder="请填写督办意见，提交后将通知企业方加速整改" required style="resize: vertical;"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('modal-supervise')">取消</button>
        <button class="btn btn-primary" onclick="submitSupervise()">提交督办</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      var CONFIG = {
        moduleId: 'gov-hazard-manage',
        moduleName: '隐患管理'
      };

      var state = {
        initialized: false,
        currentPage: 1,
        currentHazardId: null,
        selectedTreeNode: null,   // 当前选中的树节点 key
        selectedTreeLabel: '全部隐患'
      };

      // ========== 左侧树数据 ==========
      var TREE_DATA = {
        key: 'root',
        name: '南山区应急管理局',
        icon: '\u{1F3E2}',
        children: [
          { key: 'public', name: '公共场所', icon: '\u{1F3EA}', children: [
            { key: 'charging', name: '充换电设施', icon: '\u{26A1}' },
            { key: 'market', name: '农贸市场', icon: '\u{1F6D2}' }
          ]},
          { key: 'construction', name: '建设工程', icon: '\u{1F3D7}', children: [
            { key: 'building', name: '建筑施工现场', icon: '\u{1F3D7}' },
            { key: 'railway', name: '轨道交通施工', icon: '\u{1F685}' }
          ]},
          { key: 'chemical', name: '危险化学品', icon: '\u{2622}', children: [
            { key: 'chem-storage', name: '危险化学品仓储', icon: '\u{1F4E6}' },
            { key: 'gas-station', name: '加油站', icon: '\u{26FD}' }
          ]},
          { key: 'industry', name: '工业制造业', icon: '\u{1F3ED}', children: [
            { key: 'melting', name: '高温熔融企业', icon: '\u{1F525}' },
            { key: 'trade', name: '工贸企业', icon: '\u{1F3ED}' }
          ]},
          { key: 'urban', name: '城市运行', icon: '\u{1F30D}', children: [
            { key: 'gas', name: '城镇燃气', icon: '\u{1F525}' },
            { key: 'fire', name: '消防安全', icon: '\u{1F692}' }
          ]}
        ]
      };

      // ========== 隐患模拟数据 ==========
      var hazardList = [
        {
          id: 'HD2026040201', target: '创安电子科技有限公司', desc: '电动车充电区消防器材过期，灭火器压力不足',
          level: '一般隐患', source: '政府检查', foundDate: '2026-04-02', deadline: '2026-04-09',
          status: '待整改', domain: 'charging', category: 'public',
          rectifyReq: '限期更换所有过期消防器材，确保灭火器压力正常',
          timeline: [
            { time: '2026-04-02 09:30', content: '隐患提交', tag: '提交', type: 'done' },
            { time: '', content: '隐患整改', tag: '整改', type: '' },
            { time: '', content: '隐患复核', tag: '复核', type: '' },
            { time: '', content: '已完成', tag: '完成', type: '' }
          ]
        },
        {
          id: 'HD2026040101', target: '深圳港物流有限公司', desc: '危化品仓库通风设备故障，部分排风扇无法启动',
          level: '重大隐患', source: '政府检查', foundDate: '2026-04-01', deadline: '2026-04-05',
          status: '待复核', domain: 'chem-storage', category: 'chemical',
          rectifyReq: '立即停用故障通风设备，3日内完成全部排风扇更换',
          timeline: [
            { time: '2026-04-01 14:00', content: '隐患提交', tag: '提交', type: 'done' },

      // ========== 统计数据 ==========
      function computeStats(data) {
        var total = data.length;
        var pending = 0, review = 0, done = 0, overdue = 0;
        for (var i = 0; i < data.length; i++) {
          if (data[i].status === '待整改') pending++;
          else if (data[i].status === '待复核') review++;
          else if (data[i].status === '已整改') done++;
          else if (data[i].status === '已超期') overdue++;
        }
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPending').textContent = pending;
        document.getElementById('statReview').textContent = review;
        document.getElementById('statDone').textContent = done;
        document.getElementById('statOverdue').textContent = overdue;
      }

      // ========== 树渲染 ==========
      function renderTree() {
        var container = document.getElementById('hazardTree');
        container.innerHTML = renderTreeNodes([TREE_DATA], 0);
        bindTreeEvents();
      }

      function renderTreeNodes(nodes, level) {
        var html = '';
        for (var i = 0; i < nodes.length; i++) {
          var node = nodes[i];
          var hasChildren = node.children && node.children.length > 0;
          var icon = node.icon || '\u{1F4C1}';
          html += '<div class="tree-node" data-key="' + node.key + '" style="padding-left: ' + (12 + level * 20) + 'px">';
          html += '<span class="tree-toggle ' + (hasChildren ? '' : 'leaf') + '" data-key="' + node.key + '">▶</span>';
          html += '<span class="tree-node-icon">' + icon + '</span>';
          html += '<span class="tree-node-label">' + node.name + '</span>';
          html += '</div>';
          if (hasChildren) {
            html += '<div class="tree-children" data-parent="' + node.key + '">';
            html += renderTreeNodes(node.children, level + 1);
            html += '</div>';
          }
        }
        return html;
      }

      function bindTreeEvents() {
        // 点击节点选中
        var treeNodes = document.querySelectorAll('#hazardTree .tree-node');
        for (var i = 0; i < treeNodes.length; i++) {
          treeNodes[i].addEventListener('click', function(e) {
            if (!e.target.classList.contains('tree-toggle')) {
              selectTreeNode(this.getAttribute('data-key'));
            }
          });
        }
        // 点击展开/收起
        var toggles = document.querySelectorAll('#hazardTree .tree-toggle:not(.leaf)');
        for (var i = 0; i < toggles.length; i++) {
          toggles[i].addEventListener('click', function(e) {
            e.stopPropagation();
            toggleTreeNode(this.getAttribute('data-key'));
          });
        }
      }

      function toggleTreeNode(key) {
        var toggle = document.querySelector('#hazardTree .tree-toggle[data-key="' + key + '"]');
        var children = document.querySelector('#hazardTree .tree-children[data-parent="' + key + '"]');
        if (toggle && children) {
          toggle.classList.toggle('expanded');
          children.classList.toggle('show');
        }
      }

      function selectTreeNode(key) {
        // 清除所有选中
        var nodes = document.querySelectorAll('#hazardTree .tree-node');
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].classList.remove('active');
        }
        // 设置当前选中
        var el = document.querySelector('#hazardTree .tree-node[data-key="' + key + '"]');
        if (el) el.classList.add('active');

        state.selectedTreeNode = key;
        state.selectedTreeLabel = getTreeNodeName(key);
        document.getElementById('detailTitle').textContent = state.selectedTreeLabel;
        applyFilter();
      }

      function getTreeNodeName(key) {
        if (key === 'root') return TREE_DATA.name + ' - 全部隐患';
        return findTreeNodeName(TREE_DATA.children, key);
      }

      function findTreeNodeName(nodes, key) {
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i].key === key) return nodes[i].name;
          if (nodes[i].children) {
            var found = findTreeNodeName(nodes[i].children, key);
            if (found) return found;
          }
        }
        return '全部隐患';
      }

      // 获取选中树节点对应的隐患过滤 key 列表
      function getSelectedDomainKeys() {
        var key = state.selectedTreeNode;
        if (!key || key === 'root') return null; // 全部
        var keys = [];
        collectChildKeys(TREE_DATA, key, keys);
        return keys;
      }

      function collectChildKeys(node, targetKey, result) {
        if (node.key === targetKey) {
          result.push(node.key);
          if (node.children) {
            for (var i = 0; i < node.children.length; i++) {
              collectAllKeys(node.children[i], result);
            }
          }
          return true;
        }
        if (node.children) {
          for (var i = 0; i < node.children.length; i++) {
            if (collectChildKeys(node.children[i], targetKey, result)) return true;
          }
        }
        return false;
      }

      function collectAllKeys(node, result) {
        result.push(node.key);
        if (node.children) {
          for (var i = 0; i < node.children.length; i++) {
            collectAllKeys(node.children[i], result);
          }
        }
      }

      function expandAll() {
        var toggles = document.querySelectorAll('#hazardTree .tree-toggle:not(.leaf)');
        var children = document.querySelectorAll('#hazardTree .tree-children');
        for (var i = 0; i < toggles.length; i++) toggles[i].classList.add('expanded');
        for (var i = 0; i < children.length; i++) children[i].classList.add('show');
      }

      function collapseAll() {
        var toggles = document.querySelectorAll('#hazardTree .tree-toggle');
        var children = document.querySelectorAll('#hazardTree .tree-children');
        for (var i = 0; i < toggles.length; i++) toggles[i].classList.remove('expanded');
        for (var i = 0; i < children.length; i++) children[i].classList.remove('show');
      }

      function filterTree(keyword) {
        keyword = keyword.trim().toLowerCase();
        var nodes = document.querySelectorAll('#hazardTree .tree-node');
        for (var i = 0; i < nodes.length; i++) {
          var label = nodes[i].querySelector('.tree-node-label');
          if (!label) continue;
          if (!keyword) {
            nodes[i].style.display = '';
          } else {
            var text = label.textContent.toLowerCase();
            nodes[i].style.display = text.indexOf(keyword) >= 0 ? '' : 'none';
          }
        }
      }

      // ========== 筛选与表格渲染 ==========
      function getFilteredData() {
        var domainKeys = getSelectedDomainKeys();
        var filterStatus = document.getElementById('filterStatus').value;
        var filterLevel = document.getElementById('filterLevel').value;
        var filterSource = document.getElementById('filterSource').value;
        var search = document.getElementById('searchInput').value.trim().toLowerCase();

        var result = [];
        for (var i = 0; i < hazardList.length; i++) {
          var h = hazardList[i];
          // 树过滤
          if (domainKeys && domainKeys.indexOf(h.domain) < 0 && domainKeys.indexOf(h.category) < 0) continue;
          // 状态筛选
          if (filterStatus !== '全部' && h.status !== filterStatus) continue;
          // 等级筛选
          if (filterLevel !== '全部' && h.level !== filterLevel) continue;
          // 来源筛选
          if (filterSource !== '全部' && h.source !== filterSource) continue;
          // 搜索
          if (search && h.target.toLowerCase().indexOf(search) < 0) continue;
          result.push(h);
        }
        return result;
      }

      function renderTable(data) {
        var tbody = document.getElementById('hazardTableBody');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: var(--text-tertiary);">暂无隐患数据</td></tr>';
          return;
        }
        var html = '';
        for (var i = 0; i < data.length; i++) {
          var h = data[i];
          html += '<tr>';
          html += '<td>' + h.id + '</td>';
          html += '<td class="ellipsis-col" title="' + h.target + '">' + h.target + '</td>';
          html += '<td class="ellipsis-col" title="' + h.desc + '">' + h.desc + '</td>';
          html += '<td><span class="tag ' + getLevelClass(h.level) + '">' + h.level + '</span></td>';
          html += '<td><span class="tag ' + getSourceClass(h.source) + '">' + h.source + '</span></td>';
          html += '<td>' + h.foundDate + '</td>';
          html += '<td>' + h.deadline + '</td>';
          html += '<td><span class="tag ' + getStatusClass(h.status, h.overdueCycles) + '">' + h.status + '</span></td>';
          html += '<td class="action-col">' + getActionButtons(h) + '</td>';
          html += '</tr>';
        }
        tbody.innerHTML = html;
      }

      function getLevelClass(level) {
        if (level === '重大隐患') return 'tag-red';
        if (level === '一般隐患') return 'tag-orange';
        return 'tag-gray';
      }

      function getSourceClass(source) {
        if (source === '政府检查') return 'tag-blue';
        if (source === '企业自查') return 'tag-green';
        if (source === '群众举报') return 'tag-orange';
        return 'tag-gray';
      }

      var DOMAIN_LABELS = { 'charging': '充换电设施', 'market': '农贸市场', 'construction': '建筑施工现场', 'rail': '轨道交通施工', 'chem-storage': '危险化学品仓储', 'gas-station': '加油站', 'melting': '高温熔融企业', 'trade': '工贸企业', 'gas': '城镇燃气', 'fire': '消防安全' };

      function getStatusClass(status, overdueCycles) {
        if (status === '待整改') return 'tag-blue';
        if (status === '待复核') return 'tag-orange';
        if (status === '已整改') return 'tag-green';
        if (status === '已超期') {
          return (overdueCycles >= 2) ? 'tag-red' : 'tag-yellow';
        }
        return 'tag-gray';
      }

      function getActionButtons(h) {
        var btns = '<button class="btn-link" onclick="viewHazard(\'' + h.id + '\')">查看</button>';
        if (h.status === '待整改') {
          btns += '<button class="btn-link" onclick="superviseHazard(\'' + h.id + '\')">督办</button>';
        } else if (h.status === '待复核') {
          btns += '<button class="btn-link" onclick="urgeHazard(\'' + h.id + '\')">催办</button>';
        } else if (h.status === '已超期') {
          btns += '<button class="btn-link danger" onclick="superviseHazard(\'' + h.id + '\')">督办</button>';
        }
        // 已整改只有查看按钮
        return btns;
      }

      window.applyFilter = function() {
        var data = getFilteredData();
        renderTable(data);
        computeStats(data);
        if (typeof pg !== 'undefined') {
          pg.setTotal(data.length);
          pg.setPage(1);
        }
      };

      window.resetFilter = function() {
        document.getElementById('filterStatus').value = '全部';
        document.getElementById('filterLevel').value = '全部';
        document.getElementById('filterSource').value = '全部';
        document.getElementById('searchInput').value = '';
        applyFilter();
      };

      // ========== 弹窗控制 ==========
      window.openModal = function(id) {
        document.getElementById(id).classList.add('show');
      };
      window.closeModal = function(id) {
        document.getElementById(id).classList.remove('show');
      };

      // ========== Toast ==========
      window.showToast = function(msg) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(function() { toast.classList.add('out'); }, 2500);
        setTimeout(function() { toast.remove(); }, 2800);
      };

      // ========== 查看隐患详情 ==========
      window.viewHazard = function(id) {
        var h = getHazardById(id);
        if (!h) return;
        renderHazardDetail(h);
        openModal('modal-hazard-detail');
      };

      function getHazardById(id) {
        for (var i = 0; i < hazardList.length; i++) {
          if (hazardList[i].id === id) return hazardList[i];
        }
        return null;
      }

      function renderHazardDetail(h) {
        var html = '';
        // 基础信息区
        html += '<div class="detail-section-title">基础信息</div>';
        html += '<div class="detail-row"><span class="detail-label">隐患编号</span><span class="detail-value">' + h.id + '</span></div>';
        html += '<div class="detail-row"><span class="detail-label">管控对象</span><span class="detail-value">' + h.target + '</span></div>';
        html += '<div class="detail-row"><span class="detail-label">隐患描述</span><span class="detail-value">' + h.desc + '</span></div>';
        html += '<div class="detail-row"><span class="detail-label">隐患等级</span><span class="detail-value"><span class="tag ' + getLevelClass(h.level) + '">' + h.level + '</span></span></div>';
        html += '<div class="detail-row"><span class="detail-label">隐患来源</span><span class="detail-value"><span class="tag ' + getSourceClass(h.source) + '">' + h.source + '</span></span></div>';
        html += '<div class="detail-row"><span class="detail-label">所属领域小类</span><span class="detail-value">' + (DOMAIN_LABELS[h.domain] || h.domain) + '</span></div>';
        html += '<div class="detail-row"><span class="detail-label">发现日期</span><span class="detail-value">' + h.foundDate + '</span></div>';
        html += '<div class="detail-row"><span class="detail-label">整改期限</span><span class="detail-value">' + h.deadline + '</span></div>';

        // 处理记录时间轴（4节点）
        html += '<div class="detail-section-title">处理记录</div>';
        html += '<div class="timeline">';
        var stageLabels = ['隐患提交', '隐患整改', '隐患复核', '已完成'];
        for (var i = 0; i < stageLabels.length; i++) {
          var tl = h.timeline[i];
          var type = tl.type || '';
          var time = tl.time || '—';
          var content = tl.content || stageLabels[i];
          var tag = tl.tag || '';
          html += '<div class="timeline-item ' + type + '">';
          html += '<div class="timeline-time">' + time + '</div>';
          html += '<div class="timeline-content"><span class="timeline-tag tag tag-blue">' + tag + '</span>' + content + '</div>';
          html += '</div>';
        }
        html += '</div>';

        document.getElementById('hazardDetailBody').innerHTML = html;
      }

      // ========== 督办 ==========
      window.superviseHazard = function(id) {
        state.currentHazardId = id;
        document.getElementById('superviseOpinion').value = '';
        openModal('modal-supervise');
      };

      window.submitSupervise = function() {
        var opinion = document.getElementById('superviseOpinion').value;
        if (!opinion.trim()) { showToast('请填写督办意见'); return; }
        closeModal('modal-supervise');
        showToast('督办意见已提交，系统已通知企业方');
      };

      // ========== 催办 ==========
      window.urgeHazard = function(id) {
        showToast('催办通知已发送，系统已通知企业方加速整改');
      };

      // ========== 导出报表 ==========
      window.exportReport = function() {
        showToast('隐患报表导出中，完成后将自动下载');
      };

      // ========== 面包屑推送 ==========
      function pushBreadcrumb() {
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({
              type: 'breadcrumb',
              moduleId: CONFIG.moduleId,
              moduleName: CONFIG.moduleName,
              path: [
                { label: '政府端' },
                { label: '隐患管理' }
              ]
            }, '*');
          }
        } catch (e) { /* iframe 跨域忽略 */ }
      }

      // ========== 初始化 ==========
      var pg = null;

      function init() {
        if (state.initialized) return;
        console.log('[' + CONFIG.moduleId + '] 模块初始化');
        state.initialized = true;

        // 渲染树
        renderTree();

        // 默认选中根节点并展开第一级
        expandAll();
        selectTreeNode('root');

        // 初始化分页
        pg = new Pagination('paginationBar', {
          total: hazardList.length,
          onChange: function(page, size) {
            state.currentPage = page;
          }
        });

        // 初始渲染
        applyFilter();

        // 面包屑
        pushBreadcrumb();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      window.destroyModule = function() {
        console.log('[' + CONFIG.moduleId + '] 模块销毁');
        state.initialized = false;
      };
    })();
  </script>
