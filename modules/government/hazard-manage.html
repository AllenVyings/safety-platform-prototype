<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐患记录管理 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
/* ========== 页面布局 ========== */
html, body { height: auto; min-height: 100%; }
.hz-layout { display: flex; gap: 20px; align-items: flex-start; }
.hz-tree-panel {
  width: 280px; flex-shrink: 0; background: var(--bg-primary);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; position: sticky; top: 16px;
  max-height: calc(100vh - 140px); overflow: hidden;
}
.hz-tree-head {
  padding: 14px 16px; border-bottom: 1px solid var(--border-light);
  display: flex; justify-content: space-between; align-items: center;
}
.hz-tree-title { font-size: var(--font-size-md); font-weight: 600; }
.hz-tree-tools { display: flex; gap: 8px; }
.hz-tree-tools button { border: none; background: none; color: var(--primary); font-size: 12px; cursor: pointer; padding: 0; }
.hz-tree-search { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
.hz-tree-search input {
  width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: var(--font-size-sm); box-sizing: border-box;
}
.hz-tree-search input:focus { border-color: var(--primary); outline: none; }
.hz-tree-body { flex: 1; overflow-y: auto; padding: 6px 0 10px; }
.hz-tree-node {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  margin: 0 4px; border-radius: var(--radius-sm); cursor: pointer;
  user-select: none; font-size: var(--font-size-sm); color: var(--text-primary);
}
.hz-tree-node:hover { background: var(--bg-hover); }
.hz-tree-node.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.hz-tree-toggle {
  width: 16px; height: 16px; flex-shrink: 0; display: flex;
  align-items: center; justify-content: center; color: var(--text-tertiary);
  transition: transform .2s;
}
.hz-tree-toggle.open { transform: rotate(90deg); }
.hz-tree-toggle.leaf { visibility: hidden; }
.hz-tree-toggle svg { width: 12px; height: 12px; }
.hz-tree-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
.hz-tree-icon svg { width: 15px; height: 15px; }
.hz-tree-node.active .hz-tree-icon { color: var(--primary); }
.hz-tree-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hz-tree-children { display: none; }
.hz-tree-children.open { display: block; }

.hz-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* ========== 筛选卡 ========== */
.filter-card {
  background: var(--bg-primary); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); padding: 16px 20px;
}
.filter-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.filter-item { display: flex; align-items: center; gap: 6px; }
.filter-item label { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); white-space: nowrap; }
.filter-bar select, .filter-bar input[type="text"] {
  width: 240px; height: 32px; padding: 0 10px; border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: var(--font-size-sm); box-sizing: border-box; background: var(--bg-primary);
}
.filter-bar select:focus, .filter-bar input[type="text"]:focus { border-color: var(--primary); outline: none; }
.filter-actions { display: flex; gap: 8px; margin-left: 4px; }

/* ========== 统计卡 ========== */
.hz-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.hz-stat {
  position: relative; background: var(--bg-primary); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); padding: 16px 20px; overflow: hidden; cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.hz-stat:hover { transform: translateY(-1px); box-shadow: var(--shadow-elevated); }
.hz-stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
.hz-stat.c-warning::before { background: var(--warning); }
.hz-stat.c-success::before { background: var(--success); }
.hz-stat.c-danger::before { background: var(--danger); }
.hz-stat-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.hz-stat-value { font-size: 24px; font-weight: 700; line-height: 1.1; }

/* ========== 列表卡 ========== */
.hz-list-card {
  background: var(--bg-primary); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); overflow: hidden; display: flex; flex-direction: column;
}
.hz-list-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border-light);
}
.hz-list-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hz-bar { width: 4px; height: 16px; border-radius: 2px; background: var(--primary); flex-shrink: 0; }
.hz-list-title-text { font-size: var(--font-size-md); font-weight: 600; white-space: nowrap; }
.hz-list-sub { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hz-list-actions { display: flex; gap: 8px; flex-shrink: 0; }
.hz-list-actions .btn { display: inline-flex; align-items: center; gap: 6px; }
.hz-list-actions .btn svg { width: 14px; height: 14px; }
.hz-table-scroll { overflow: auto; max-height: calc(100vh - 400px); min-height: 280px; }
.hz-table { width: 100%; min-width: 1040px; border-collapse: separate; border-spacing: 0; }
.hz-table thead th {
  position: sticky; top: 0; z-index: 2; background: var(--bg-table-header, #f5f7fa);
  text-align: left; padding: 12px 16px; font-size: var(--font-size-sm); font-weight: 600;
  color: var(--text-primary); border-bottom: 1px solid var(--border-light); white-space: nowrap;
}
.hz-table tbody td {
  padding: 12px 16px; height: 48px; box-sizing: border-box; font-size: var(--font-size-sm);
  color: var(--text-primary); border-bottom: 1px solid var(--border-light); vertical-align: middle;
}
.hz-table tbody tr:hover td { background: var(--bg-hover); }
.hz-cell-clip { display: block; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hz-action-col { white-space: nowrap; }
.hz-action-col .btn-link { margin-right: 8px; }
.hz-action-col .btn-link:last-child { margin-right: 0; }
.hz-empty-row td { text-align: center; padding: 48px 16px !important; color: var(--text-tertiary); }

/* ========== 标签 ========== */
.tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
.tag-green { background: var(--success-light); color: var(--success); }
.tag-gray { background: var(--bg-section-alt); color: var(--text-secondary); }
.tag-orange { background: var(--warning-light); color: var(--warning); }
.tag-red { background: var(--danger-light); color: var(--danger); }
.tag-blue { background: var(--info-light); color: var(--info); }
.tag-yellow { background: #fadb14; color: #8c6900; }

/* ========== 链接按钮 ========== */
.btn-link { padding: 0; border: none; background: none; color: var(--primary); cursor: pointer; font-size: var(--font-size-sm); }
.btn-link:hover { text-decoration: underline; }
.btn-link.danger { color: var(--danger); }

/* ========== Toast ========== */
.toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius-md); background: var(--bg-primary);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); font-size: var(--font-size-sm);
  color: var(--text-primary); border-left: 4px solid var(--primary);
  animation: toastIn .3s ease; max-width: 420px;
}
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ========== 弹窗 ========== */
.modal-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9998; display: none; }
.modal-container.show { display: flex; align-items: center; justify-content: center; }
.modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); }
.modal-dialog {
  position: relative; background: var(--bg-primary); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-elevated); max-height: 90vh; display: flex; flex-direction: column;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-light); }
.modal-title { font-size: var(--font-size-lg); font-weight: 600; }
.modal-close { background: none; border: none; font-size: 24px; line-height: 1; color: var(--text-tertiary); cursor: pointer; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-light); }
.modal-form .form-group { margin-bottom: 16px; }
.modal-form .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.modal-form .form-input, .modal-form .form-select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-md);
  font-size: 14px; box-sizing: border-box; background: var(--bg-primary);
}
.modal-form .form-input:focus, .modal-form .form-select:focus { border-color: var(--primary); outline: none; }
.required { color: var(--danger); }

/* ========== 整页详情 ========== */
.hz-detail { display: none; }
.hz-detail.show { display: block; }
.hz-detail-top {
  display: flex; align-items: center; gap: 16px; background: var(--bg-primary);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 20px; margin-bottom: 16px;
}
.hz-detail-title { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-lg); font-weight: 600; min-width: 0; }
.hz-detail-actions { margin-left: auto; display: flex; gap: 8px; }
.hz-detail-card {
  background: var(--bg-primary); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  padding: 20px 24px; margin-bottom: 16px;
}
.hz-section-title { font-size: 15px; font-weight: 600; margin: 0 0 16px; padding-left: 10px; border-left: 3px solid var(--primary); line-height: 1.4; }
.hz-kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; row-gap: 12px; }
.hz-kv { display: flex; gap: 8px; font-size: 14px; line-height: 1.6; min-width: 0; }
.hz-kv.full { grid-column: 1 / -1; }
.hz-kv-label { flex: 0 0 128px; color: var(--text-secondary); text-align: right; }
.hz-kv-value { flex: 1; min-width: 0; color: var(--text-primary); word-break: break-word; }
.hz-photo-row { display: flex; gap: 16px; margin-top: 12px; }
.hz-photo-box { width: 96px; }
.hz-photo-box img { width: 96px; height: 96px; border-radius: var(--radius-md); border: 1px solid var(--border-light); display: block; }
.hz-photo-caption { margin-top: 4px; font-size: 12px; color: var(--text-tertiary); text-align: center; }
.hz-timeline { padding-left: 20px; border-left: 2px solid var(--border); margin-left: 6px; }
.hz-tl-item { position: relative; padding: 0 0 18px 14px; }
.hz-tl-item:last-child { padding-bottom: 0; }
.hz-tl-item::before {
  content: ''; position: absolute; left: -21px; top: 4px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--text-tertiary); border: 2px solid var(--bg-primary);
  box-shadow: 0 0 0 2px var(--border-light);
}
.hz-tl-item.done::before { background: var(--success); box-shadow: 0 0 0 2px var(--success-light); }
.hz-tl-item.current::before { background: var(--info); box-shadow: 0 0 0 2px var(--info-light); }
.hz-tl-item.error::before { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-light); }
.hz-tl-time { font-size: 12px; color: var(--text-tertiary); margin-bottom: 2px; }
.hz-tl-content { font-size: 14px; color: var(--text-primary); }
.hz-tl-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; margin-right: 6px; background: var(--primary-light); color: var(--primary); }

@media (max-width: 1100px) {
  .hz-layout { flex-direction: column; }
  .hz-tree-panel { width: 100%; position: static; max-height: 320px; }
  .hz-stats { grid-template-columns: repeat(2, 1fr); }
  .hz-kv-grid { grid-template-columns: 1fr; }
  .hz-kv-label { flex-basis: 96px; }
}
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="module-page page-container" data-module="government/hazard-manage">
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item">政府端</span>
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-item current">隐患记录管理</span>
    </div>

    <!-- ========== 列表视图 ========== -->
    <div id="view-list">
      <div class="hz-layout">
        <aside class="hz-tree-panel">
          <div class="hz-tree-head">
            <span class="hz-tree-title">行业领域</span>
            <div class="hz-tree-tools">
              <button type="button" id="btnExpandAll">展开</button>
              <button type="button" id="btnCollapseAll">收起</button>
            </div>
          </div>
          <div class="hz-tree-search">
            <input type="text" id="treeSearchInput" placeholder="搜索行业/领域">
          </div>
          <div class="hz-tree-body" id="hazardTree"></div>
        </aside>

        <section class="hz-main">
          <div class="filter-card">
            <div class="filter-bar">
              <div class="filter-item">
                <label>隐患状态：</label>
                <select id="filterStatus">
                  <option>全部</option><option>待整改</option><option>待复核</option><option>已整改</option><option>已超期</option>
                </select>
              </div>
              <div class="filter-item">
                <label>隐患等级：</label>
                <select id="filterLevel">
                  <option>全部</option><option>一般隐患</option><option>重大隐患</option>
                </select>
              </div>
              <div class="filter-item">
                <label>隐患来源：</label>
                <select id="filterSource">
                  <option>全部</option><option>政府巡查</option><option>企业自查</option><option>群众举报</option>
                </select>
              </div>
              <div class="filter-item">
                <label>关键词：</label>
                <input type="text" id="filterKeyword" placeholder="搜索管控对象、企业名称">
              </div>
              <div class="filter-actions">
                <button class="btn btn-primary" type="button" id="btnQuery">查询</button>
                <button class="btn btn-default" type="button" id="btnReset">重置</button>
              </div>
            </div>
          </div>

          <div class="hz-stats" id="statsRow">
            <div class="hz-stat" data-status="全部">
              <div class="hz-stat-label">隐患总数</div>
              <div class="hz-stat-value" style="color: var(--primary);" id="statTotal">0</div>
            </div>
            <div class="hz-stat" data-status="待整改">
              <div class="hz-stat-label">待整改</div>
              <div class="hz-stat-value" style="color: var(--info);" id="statPending">0</div>
            </div>
            <div class="hz-stat c-warning" data-status="待复核">
              <div class="hz-stat-label">待复核</div>
              <div class="hz-stat-value" style="color: var(--warning);" id="statReview">0</div>
            </div>
            <div class="hz-stat c-success" data-status="已整改">
              <div class="hz-stat-label">已整改</div>
              <div class="hz-stat-value" style="color: var(--success);" id="statDone">0</div>
            </div>
            <div class="hz-stat c-danger" data-status="已超期">
              <div class="hz-stat-label">已超期</div>
              <div class="hz-stat-value" style="color: var(--danger);" id="statOverdue">0</div>
            </div>
          </div>

          <div class="hz-list-card">
            <div class="hz-list-head">
              <div class="hz-list-title">
                <span class="hz-bar"></span>
                <span class="hz-list-title-text">隐患记录</span>
                <span class="hz-list-sub" id="listSubtitle">南山区应急管理局 - 全部隐患</span>
              </div>
              <div class="hz-list-actions">
                <button class="btn btn-default" type="button" id="btnEcEntry">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  导出记录
                </button>
              </div>
            </div>
            <div class="hz-table-scroll">
              <table class="hz-table">
                <thead>
                  <tr>
                    <th>隐患编号</th>
                    <th>管控对象</th>
                    <th>隐患描述</th>
                    <th>隐患等级</th>
                    <th>隐患来源</th>
                    <th>发现日期</th>
                    <th>整改期限</th>
                    <th>状态</th>
                    <th class="hz-action-col">操作</th>
                  </tr>
                </thead>
                <tbody id="hazardTableBody"></tbody>
              </table>
            </div>
            <div class="pagination" id="paginationBar"></div>
          </div>
        </section>
      </div>
    </div>

    <!-- ========== 整页详情 ========== -->
    <div class="hz-detail" id="view-detail">
      <div class="hz-detail-top">
        <button class="btn btn-default" type="button" id="btnBackList">← 返回列表</button>
        <div class="hz-detail-title">
          <span class="hz-bar"></span>
          <span id="detailTitle">隐患详情</span>
          <span id="detailStatusTag"></span>
        </div>
        <div class="hz-detail-actions" id="detailActions"></div>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- ========== 督办弹窗 ========== -->
  <div class="modal-container" id="modal-supervise">
    <div class="modal-overlay" data-close="modal-supervise"></div>
    <div class="modal-dialog" style="width: 520px;">
      <div class="modal-header">
        <span class="modal-title">督办意见</span>
        <button class="modal-close" type="button" data-close="modal-supervise">&times;</button>
      </div>
      <div class="modal-body">
        <form class="modal-form" id="superviseForm">
          <div class="form-group">
            <label class="form-label"><span class="required">*</span> 督办意见</label>
            <textarea class="form-input" id="superviseOpinion" rows="5" placeholder="请填写督办意见，提交后将通知企业方加速整改" style="resize: vertical;"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" type="button" data-close="modal-supervise">取消</button>
        <button class="btn btn-primary" type="button" id="btnSubmitSupervise">提交督办</button>
      </div>
    </div>
  </div>

  <!-- ========== 复核弹窗 ========== -->
  <div class="modal-container" id="modal-review">
    <div class="modal-overlay" data-close="modal-review"></div>
    <div class="modal-dialog" style="width: 520px;">
      <div class="modal-header">
        <span class="modal-title">隐患复核</span>
        <button class="modal-close" type="button" data-close="modal-review">&times;</button>
      </div>
      <div class="modal-body">
        <form class="modal-form" id="reviewForm">
          <div class="form-group">
            <label class="form-label"><span class="required">*</span> 复核结果</label>
            <select class="form-select" id="reviewResult">
              <option value="">请选择复核结果</option>
              <option>同意</option>
              <option>不同意</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label"><span class="required">*</span> 复核意见</label>
            <textarea class="form-input" id="reviewOpinion" rows="4" placeholder="请填写复核意见（必填，最多 200 字）" maxlength="200" style="resize: vertical;"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" type="button" data-close="modal-review">取消</button>
        <button class="btn btn-primary" type="button" id="btnSubmitReview">提交复核</button>
      </div>
    </div>
  </div>

  <script src="../../js/pagination.js"></script>
  <script src="../../js/vendor/exceljs.min.js"></script>
  <script src="../../js/shared/gov-export-data.js"></script>
  <script src="../../js/shared/export-center.js"></script>
  <script>
    (function () {
      'use strict';

      var CONFIG = { moduleId: 'gov-hazard-manage', moduleName: '隐患记录管理' };
      var D = window.GovExportData;

      var state = {
        initialized: false,
        currentPage: 1,
        pageSize: 10,
        selectedTreeNode: 'root',
        selectedTreeLabel: '南山区应急管理局 - 全部隐患',
        treeKeyword: '',
        currentHazardId: null,
        detailId: null,
        filtered: []

            '<td><span class="hz-cell-clip" title="' + esc(item.desc) + '">' + esc(item.desc) + '</span></td>' +
            '<td><span class="tag ' + levelClass(item.level) + '">' + esc(item.level) + '</span></td>' +
            '<td><span class="tag ' + sourceClass(item.source) + '">' + esc(item.source) + '</span></td>' +
            '<td>' + esc(item.foundDate) + '</td>' +
            '<td>' + esc(item.deadline) + '</td>' +
            '<td><span class="tag ' + statusClass(item.status) + '">' + esc(item.status) + '</span></td>' +
            '<td class="hz-action-col">' + actionButtons(item) + '</td>' +
          '</tr>';
        });
        tbody.innerHTML = html;
      }

      var pg = null;

      function applyFilter(resetPage) {
        if (resetPage) state.currentPage = 1;
        state.filtered = getFilteredData();
        computeStats(getTreeScopedData());
        document.getElementById('listSubtitle').textContent = state.selectedTreeLabel;
        if (pg) pg.setTotal(state.filtered.length);
        var maxPage = Math.ceil(state.filtered.length / state.pageSize) || 1;
        if (state.currentPage > maxPage) state.currentPage = maxPage;
        renderTable();
        if (pg) pg.setPage(state.currentPage);
      }

      /* ========== 详情 ========== */
      function findHazard(id) {
        for (var i = 0; i < hazardList.length; i++) {
          if (hazardList[i].id === id) return hazardList[i];
        }
        return null;
      }

      function kv(label, valueHtml, full) {
        return '<div class="hz-kv' + (full ? ' full' : '') + '"><span class="hz-kv-label">' + esc(label) + '：</span><span class="hz-kv-value">' + valueHtml + '</span></div>';
      }

      function photoBox(svg, caption) {
        if (!svg) return '';
        return '<div class="hz-photo-box"><img alt="' + esc(caption) + '" src="data:image/svg+xml,' + encodeURIComponent(svg) + '"><div class="hz-photo-caption">' + esc(caption) + '</div></div>';
      }

      function renderDetail(item) {
        document.getElementById('detailTitle').textContent = '隐患详情 · ' + item.id;
        document.getElementById('detailStatusTag').innerHTML = '<span class="tag ' + statusClass(item.status) + '">' + esc(item.status) + '</span>';
        var actions = '';
        if (item.status === '待整改' || item.status === '已超期') {
          actions += '<button class="btn btn-primary" type="button" data-supervise="' + esc(item.id) + '">督办</button>';
        } else if (item.status === '待复核') {
          actions += '<button class="btn btn-default" type="button" data-urge="' + esc(item.id) + '">催办</button>';
          actions += '<button class="btn btn-primary" type="button" data-review="' + esc(item.id) + '">复核</button>';
        }
        document.getElementById('detailActions').innerHTML = actions;

        var html = '';
        html += '<div class="hz-detail-card"><div class="hz-section-title">基础信息</div><div class="hz-kv-grid">';
        html += kv('隐患编号', esc(item.id));
        html += kv('状态', '<span class="tag ' + statusClass(item.status) + '">' + esc(item.status) + '</span>');
        html += kv('隐患来源', '<span class="tag ' + sourceClass(item.source) + '">' + esc(item.source) + '</span>');
        html += kv('管控对象', esc(item.target));
        html += kv('企业名称', esc(item.enterprise));
        html += kv('统一社会信用代码', esc(item.creditCode));
        html += kv('领域大类', esc(item.domainBig));
        html += kv('领域小类', esc(item.domain));
        html += kv('所属街道', esc(item.region.street));
        html += kv('所属社区', esc(item.region.community));
        html += kv('所属网格', esc(item.region.grid));
        html += kv('检查表名称', esc(item.checklist));
        html += kv('检查内容', esc(item.checkContent));
        html += kv('检查时间', esc(item.checkTime));
        html += kv('检查人', esc(item.checker));
        html += kv('检查分类', esc(item.checkType));
        html += kv('隐患类型', esc(item.hazardType));
        html += kv('隐患等级', '<span class="tag ' + levelClass(item.level) + '">' + esc(item.level) + '</span>');
        html += kv('发现日期', esc(item.foundDate));
        html += kv('整改期限', esc(item.deadline));
        html += kv('整改是否超期', '<span class="tag ' + (item.overdue === '已超期' ? 'tag-red' : 'tag-gray') + '">' + esc(item.overdue) + '</span>');
        html += '</div></div>';

        html += '<div class="hz-detail-card"><div class="hz-section-title">隐患信息</div><div class="hz-kv-grid">';
        html += kv('隐患描述', esc(item.desc), true);
        html += kv('整改要求', esc(item.rectifyReq), true);
        html += '</div><div class="hz-photo-row">' + photoBox(item.hazardPhoto, '隐患照片') + '</div></div>';

        html += '<div class="hz-detail-card"><div class="hz-section-title">整改信息</div><div class="hz-kv-grid">';
        html += kv('整改方式', esc(item.method));
        html += kv('整改人', esc(item.rectifyPerson));
        html += kv('整改时间', esc(item.rectifyTime));
        html += kv('整改反馈', esc(item.rectifyFeedback), true);
        html += kv('整改依据', esc(item.rectifyBasis), true);
        html += '</div><div class="hz-photo-row">' + photoBox(item.reformPhoto, '整改照片') + '</div></div>';

        html += '<div class="hz-detail-card"><div class="hz-section-title">复核信息</div><div class="hz-kv-grid">';
        html += kv('复核人', esc(item.reviewer));
        html += kv('复核结果', item.reviewResult === '—' ? '—' : '<span class="tag ' + (item.reviewResult === '同意' ? 'tag-green' : 'tag-red') + '">' + esc(item.reviewResult) + '</span>');
        html += kv('复核时间', esc(item.reviewTime));
        html += kv('复核意见', esc(item.reviewOpinion), true);
        html += '</div></div>';

        html += '<div class="hz-detail-card"><div class="hz-section-title">处理时间线</div><div class="hz-timeline">';
        item.timeline.forEach(function (node) {
          html += '<div class="hz-tl-item ' + (node.type || '') + '">' +
            '<div class="hz-tl-time">' + esc(node.time || '—') + '</div>' +
            '<div class="hz-tl-content"><span class="hz-tl-tag">' + esc(node.tag) + '</span>' + esc(node.content) + '</div></div>';
        });
        html += '</div></div>';
        document.getElementById('detailBody').innerHTML = html;
      }

      function openDetail(id) {
        var item = findHazard(id);
        if (!item) return;
        state.detailId = id;
        renderDetail(item);
        document.getElementById('view-list').style.display = 'none';
        document.getElementById('view-detail').classList.add('show');
        window.scrollTo(0, 0);
      }

      function closeDetail() {
        state.detailId = null;
        document.getElementById('view-detail').classList.remove('show');
        document.getElementById('view-list').style.display = '';
        applyFilter(false);
      }

      /* ========== 督办 / 催办 / 复核 ========== */
      function openModal(id) { document.getElementById(id).classList.add('show'); }
      function closeModal(id) { document.getElementById(id).classList.remove('show'); }

      function superviseHazard(id) {
        state.currentHazardId = id;
        document.getElementById('superviseOpinion').value = '';
        openModal('modal-supervise');
      }

      function submitSupervise() {
        var opinion = document.getElementById('superviseOpinion').value.trim();
        if (!opinion) { showToast('请填写督办意见'); return; }
        var item = findHazard(state.currentHazardId);
        if (item) {
          item.timeline.unshift({ time: nowText(), content: '督办：' + opinion, tag: '督办', type: 'warn' });
        }
        closeModal('modal-supervise');
        showToast('督办意见已提交，系统已通知企业方');
        if (state.detailId) renderDetail(item);
      }

      function urgeHazard(id) {
        var item = findHazard(id);
        if (item) {
          item.timeline.unshift({ time: nowText(), content: '催办：已发送催办通知，提醒复核方尽快处理', tag: '催办', type: 'warn' });
        }
        showToast('催办通知已发送，系统已通知复核方');
        if (state.detailId) renderDetail(item);
      }

      function openReview(id) {
        state.currentHazardId = id;
        document.getElementById('reviewResult').value = '';
        document.getElementById('reviewOpinion').value = '';
        openModal('modal-review');
      }

      function submitReview() {
        var item = findHazard(state.currentHazardId);
        if (!item) return;
        var result = document.getElementById('reviewResult').value;
        var opinion = document.getElementById('reviewOpinion').value.trim();
        if (!result) { showToast('请选择复核结果'); return; }
        if (!opinion) { showToast('请填写复核意见'); return; }
        item.reviewResult = result;
        item.reviewOpinion = opinion;
        item.reviewTime = nowText();
        item.status = result === '同意' ? '已整改' : '待整改';
        item.overdue = '未超期';
        item.baseStatus = item.status;
        item.timeline = buildTimeline(item);
        closeModal('modal-review');
        showToast(result === '同意' ? '复核通过，隐患已闭环' : '复核不通过，已退回重新整改');
        if (state.detailId) {
          renderDetail(item);
        } else {
          applyFilter(false);
        }
      }

      function nowText() {
        var d = new Date();
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      }

      /* ========== Toast ========== */
      window.showToast = function (message) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function () { toast.classList.add('out'); }, 2400);
        setTimeout(function () { toast.remove(); }, 2750);
      };

      /* ========== 导出 ========== */
      var EXPORT_FILTER_DEFS = [
        { id: 'checkType', label: '检查分类', options: ['政府巡查', '企业自查'] },
        { id: 'method', label: '整改方式', options: ['立即整改', '限期整改（3天）', '限期整改（7天）'] },
        { id: 'rectifier', label: '整改人', options: ENT_USERS },
        { id: 'reviewer', label: '复核人', options: GOV_REVIEWERS.concat([ENT_REVIEWER]) },
        { id: 'overdue', label: '整改是否超期', options: ['已超期', '未超期'] },
        { id: 'checkDate', label: '检查时间', type: 'dateRange' },
        { id: 'enterprise', label: '企业名称', type: 'text', placeholder: '按包含匹配' },
        { id: 'creditCode', label: '统一社会信用代码', type: 'text', placeholder: '支持部分匹配' },
        { id: 'checker', label: '检查人', type: 'text', placeholder: '姓名 / 单位' },
        { id: 'desc', label: '隐患描述', type: 'text', placeholder: '按包含匹配' }
      ];

      function exportFilterRows(filters) {
        return getFilteredData().filter(function (item) {
          if (filters.checkType && item.checkType !== filters.checkType) return false;
          if (filters.method && item.method !== filters.method) return false;
          if (filters.rectifier && item.rectifyPerson !== filters.rectifier) return false;
          if (filters.reviewer && item.reviewer !== filters.reviewer) return false;
          if (filters.overdue && item.overdue !== filters.overdue) return false;
          var checkDate = item.checkTime.slice(0, 10);
          if (filters.checkDateStart && checkDate < filters.checkDateStart) return false;
          if (filters.checkDateEnd && checkDate > filters.checkDateEnd) return false;
          if (filters.enterprise && item.enterprise.indexOf(filters.enterprise) < 0) return false;
          if (filters.creditCode && item.creditCode.indexOf(filters.creditCode) < 0) return false;
          if (filters.checker && item.checker.indexOf(filters.checker) < 0) return false;
          if (filters.desc && item.desc.indexOf(filters.desc) < 0) return false;
          return true;
        });
      }

      function exportHeaders(withPhotos) {
        var headers = ['企业名称', '领域大类', '领域小类', '所属街道', '所属社区', '所属网格', '管控对象', '检查表名称', '检查内容', '检查时间', '检查人', '检查分类', '隐患类型', '隐患描述', '隐患等级'];
        if (withPhotos) headers.push('隐患照片');
        headers = headers.concat(['整改方式', '整改隐患整改人', '整改时间']);
        if (withPhotos) headers.push('整改照片');
        headers = headers.concat(['整改反馈', '整改依据', '复核人', '复核结果', '复核意见', '复核时间', '状态', '整改是否超期']);
        return headers;
      }

      function exportRowValues(item, withPhotos) {
        var values = [
          item.enterprise, item.domainBig, item.domain,
          item.region.street, item.region.community, item.region.grid,
          item.target, item.checklist, item.checkContent, item.checkTime,
          item.checker, item.checkType, item.hazardType, item.desc, item.level
        ];
        if (withPhotos) values.push('');
        values = values.concat([item.method, item.rectifyPerson, item.rectifyTime]);
        if (withPhotos) values.push('');
        values = values.concat([
          item.rectifyFeedback, item.rectifyBasis,
          item.reviewer, item.reviewResult, item.reviewOpinion, item.reviewTime,
          item.status === '已超期' ? item.baseStatus : item.status,
          item.overdue
        ]);
        return values;
      }

      function exportScopeSummary(filters) {
        var parts = [state.selectedTreeLabel];
        var page = readPageFilters();
        if (page.status !== '全部') parts.push('状态=' + page.status);
        if (page.level !== '全部') parts.push('等级=' + page.level);
        if (page.source !== '全部') parts.push('来源=' + page.source);
        if (page.keyword) parts.push('关键词「' + page.keyword + '」');
        var extra = [];
        if (filters.checkType) extra.push('检查分类=' + filters.checkType);
        if (filters.method) extra.push('整改方式=' + filters.method);
        if (filters.rectifier) extra.push('整改人=' + filters.rectifier);
        if (filters.reviewer) extra.push('复核人=' + filters.reviewer);
        if (filters.overdue) extra.push(filters.overdue);
        if (filters.checkDateStart || filters.checkDateEnd) {
          extra.push('检查时间 ' + (filters.checkDateStart || '…') + ' 至 ' + (filters.checkDateEnd || '…'));
        }
        if (filters.enterprise) extra.push('企业含「' + filters.enterprise + '」');
        if (filters.creditCode) extra.push('信用代码含「' + filters.creditCode + '」');
        if (filters.checker) extra.push('检查人含「' + filters.checker + '」');
        if (filters.desc) extra.push('描述含「' + filters.desc + '」');
        if (extra.length) parts.push('补充：' + extra.join('；'));
        return parts.join('；');
      }

      function initExport() {
        if (!window.ExportCenter) return;
        window.ExportCenter.init({
          moduleKey: 'gov-hazard-manage',
          moduleName: '隐患记录',
          exportTitle: '导出隐患记录',
          filePrefix: '隐患记录',
          entryButtonId: 'btnEcEntry',
          filters: EXPORT_FILTER_DEFS,
          scopeSummary: exportScopeSummary,
          photoTip: '开启后内嵌隐患照片 / 整改照片列',
          emptyText: '暂无可导出隐患记录',
          getData: function (filters, withPhotos) {
            var rows = exportFilterRows(filters);
            var headers = exportHeaders(withPhotos);
            var values = rows.map(function (item) { return exportRowValues(item, withPhotos); });
            var photoSvgs = rows.map(function (item) {
              var arr = headers.map(function () { return null; });
              if (!withPhotos) return arr;
              var hazardIndex = headers.indexOf('隐患照片');
              var reformIndex = headers.indexOf('整改照片');
              if (hazardIndex >= 0) arr[hazardIndex] = item.hazardPhoto;
              if (reformIndex >= 0 && item.reformPhoto) arr[reformIndex] = item.reformPhoto;
              return arr;
            });
            return { headers: headers, values: values, photoSvgs: photoSvgs };
          }
        });
      }

      /* ========== 事件绑定 ========== */
      function bind() {
        document.getElementById('hazardTree').addEventListener('click', function (event) {
          var toggle = event.target.closest('.hz-tree-toggle');
          if (toggle && !toggle.classList.contains('leaf')) {
            var toggleKey = toggle.getAttribute('data-toggle');
            TREE_OPEN[toggleKey] = !TREE_OPEN[toggleKey];
            renderTree();
            return;
          }
          var node = event.target.closest('.hz-tree-node');
          if (!node) return;
          state.selectedTreeNode = node.getAttribute('data-key');
          state.selectedTreeLabel = selectedNodeName(state.selectedTreeNode);
          renderTree();
          applyFilter(true);
        });

        document.getElementById('treeSearchInput').addEventListener('input', function () {
          state.treeKeyword = this.value.trim().toLowerCase();
          renderTree();
        });

        document.getElementById('btnExpandAll').addEventListener('click', function () {
          TREE_OPEN.root = true;
          TREE_DATA.children.forEach(function (node) { TREE_OPEN[node.key] = true; });
          renderTree();
        });

        document.getElementById('btnCollapseAll').addEventListener('click', function () {
          TREE_DATA.children.forEach(function (node) { TREE_OPEN[node.key] = false; });
          renderTree();
        });

        document.getElementById('btnQuery').addEventListener('click', function () { applyFilter(true); });
        document.getElementById('btnReset').addEventListener('click', function () {
          document.getElementById('filterStatus').value = '全部';
          document.getElementById('filterLevel').value = '全部';
          document.getElementById('filterSource').value = '全部';
          document.getElementById('filterKeyword').value = '';
          applyFilter(true);
        });

        document.getElementById('statsRow').addEventListener('click', function (event) {
          var card = event.target.closest('.hz-stat');
          if (!card) return;
          var status = card.getAttribute('data-status');
          document.getElementById('filterStatus').value = status === '全部' ? '全部' : status;
          applyFilter(true);
        });

        document.getElementById('hazardTableBody').addEventListener('click', function (event) {
          var view = event.target.closest('[data-view]');
          if (view) { openDetail(view.getAttribute('data-view')); return; }
          var supervise = event.target.closest('[data-supervise]');
          if (supervise) { superviseHazard(supervise.getAttribute('data-supervise')); return; }
          var urge = event.target.closest('[data-urge]');
          if (urge) { urgeHazard(urge.getAttribute('data-urge')); return; }
          var review = event.target.closest('[data-review]');
          if (review) { openReview(review.getAttribute('data-review')); }
        });

        document.getElementById('detailBody').addEventListener('click', function (event) {
          var supervise = event.target.closest('[data-supervise]');
          if (supervise) { superviseHazard(supervise.getAttribute('data-supervise')); return; }
          var urge = event.target.closest('[data-urge]');
          if (urge) { urgeHazard(urge.getAttribute('data-urge')); return; }
          var review = event.target.closest('[data-review]');
          if (review) { openReview(review.getAttribute('data-review')); }
        });

        document.getElementById('btnBackList').addEventListener('click', closeDetail);
        document.getElementById('detailActions').addEventListener('click', function (event) {
          var supervise = event.target.closest('[data-supervise]');
          if (supervise) { superviseHazard(supervise.getAttribute('data-supervise')); return; }
          var urge = event.target.closest('[data-urge]');
          if (urge) { urgeHazard(urge.getAttribute('data-urge')); return; }
          var review = event.target.closest('[data-review]');
          if (review) { openReview(review.getAttribute('data-review')); }
        });

        document.querySelectorAll('[data-close]').forEach(function (btn) {
          btn.addEventListener('click', function () { closeModal(btn.getAttribute('data-close')); });
        });

        document.getElementById('btnSubmitSupervise').addEventListener('click', submitSupervise);
        document.getElementById('btnSubmitReview').addEventListener('click', submitReview);
      }

      /* ========== 面包屑 / 初始化 ========== */
      function pushBreadcrumb() {
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({
              type: 'breadcrumb',
              moduleId: CONFIG.moduleId,
              moduleName: CONFIG.moduleName,
              path: [{ label: '政府端' }, { label: '隐患记录管理' }]
            }, '*');
          }
        } catch (err) { /* iframe 跨域忽略 */ }
      }

      function init() {
        if (state.initialized) return;
        state.initialized = true;
        TREE_DATA.children.forEach(function (node) { if (TREE_OPEN[node.key] == null) TREE_OPEN[node.key] = true; });
        renderTree();
        state.selectedTreeLabel = selectedNodeName('root');
        pg = new Pagination('paginationBar', {
          total: 0,
          size: state.pageSize,
          onChange: function (page, size) {
            state.currentPage = page;
            state.pageSize = size;
            renderTable();
          }
        });
        bind();
        applyFilter(true);
        initExport();
        pushBreadcrumb();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      window.destroyModule = function () {
        state.initialized = false;
      };
    })();
  </script>
  <script src="../../js/annotations.js"></script>
</body>
</html>
