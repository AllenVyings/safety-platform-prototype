<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目信息管理 - 政府端</title>

<style>
.breadcrumb-item:hover{color:var(--primary)}
.main-layout{display:flex;flex-direction:row;gap:var(--spacing-md);margin-top:var(--spacing-md);height:calc(100vh - 80px)}
.tree-panel{width:280px;flex-shrink:0;background:var(--bg-primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden}
.tree-search{position:relative;padding:12px;border-bottom:1px solid var(--border-light)}
.tree-search input{width:100%;height:32px;padding:var(--spacing-sm) 28px var(--spacing-sm) 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;box-sizing:border-box}
.tree-search input:focus{border-color:var(--primary)}
.tree-search .search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:var(--font-size-md);color:var(--text-tertiary);pointer-events:none}
.tree-tabs{display:flex;border-bottom:1px solid var(--border-light)}
.tree-tab{flex:1;padding:10px 0;text-align:center;font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;background:none;border:none}
.tree-tab:hover{color:var(--primary)}
.tree-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tree-content{flex:1;overflow-y:auto;padding:12px}
.tree-node{display:flex;align-items:center;padding:6px var(--spacing-sm);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;font-size:var(--font-size-sm);color:var(--text-primary)}
.tree-node:hover{background:var(--bg-page-solid)}
.tree-node.active{background:var(--primary-light);color:var(--primary)}
.tree-node .arrow{margin-right:var(--spacing-xs);font-size:10px;color:var(--text-tertiary);transition:transform .2s;width:12px;text-align:center}
.tree-node .arrow.expanded{transform:rotate(90deg)}
.tree-node .node-icon{margin-right:6px;font-size:var(--font-size-md)}
.tree-node .node-count{margin-left:auto;font-size:11px;color:var(--text-tertiary);background:var(--bg-secondary);padding:1px 6px;border-radius:10px}
.tree-node.active .node-count{background:var(--primary);color:var(--bg-primary)}
.tree-children{padding-left:20px;display:block}
.right-content{flex:1;display:flex;flex-direction:column;gap:var(--spacing-md);overflow:hidden}
.right-content .table-card{flex:1;display:flex;flex-direction:column}
.right-content .table-container{flex:1;overflow:auto}
.stats-row{grid-template-columns:repeat(5,1fr)}

.query-bar{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md) 20px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.query-bar .q-item{display:flex;align-items:center;gap:6px}
.query-bar label{font-size:var(--font-size-sm);color:var(--text-secondary);white-space:nowrap}
.query-bar select,.query-bar input{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);outline:none;transition:border-color .2s;width:240px;height:32px;box-sizing:border-box}
.query-bar select:focus,.query-bar input:focus{border-color:var(--primary)}

.btn{padding:5px 14px;border-radius:var(--radius-md);font-size:var(--font-size-sm);cursor:pointer;transition:all var(--duration-normal);border:1px solid transparent}
.btn-default{background:var(--bg-primary);color:var(--text-primary);border-color:var(--border)}
.btn-default:hover{color:var(--primary);border-color:var(--primary)}
.btn-primary{background:var(--primary);color:var(--bg-primary);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-link{background:none;border:none;padding:2px 6px;color:var(--primary);cursor:pointer;font-size:var(--font-size-sm)}
.btn-link:hover{color:var(--primary-hover)}
.btn-link.btn-sm{font-size:var(--font-size-xs);padding:1px var(--spacing-xs)}
.btn-danger{padding:var(--spacing-xs) 15px;border:1px solid var(--danger-light);color:var(--danger);background:var(--bg-primary);border-radius:var(--radius-md);cursor:pointer;font-size:var(--font-size-md);transition:all var(--duration-normal)}
.btn-danger:hover{background:var(--danger-light);border-color:var(--danger)}
.table-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md);flex:1;overflow:hidden}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);min-width:1100px}
thead th{background:var(--bg-tertiary);padding:10px 12px;text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-light);white-space:nowrap;position:relative}
tbody td{padding:10px 12px;border-bottom:1px solid var(--bg-secondary);color:var(--text-primary);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover{background:var(--bg-section)}
tbody tr:last-child td{border-bottom:none}
/* 列宽固定 */
thead th:nth-child(1),tbody td:nth-child(1){width:50px;max-width:50px;text-align:center}
thead th:nth-child(2),tbody td:nth-child(2){width:180px;max-width:180px}
thead th:nth-child(3),tbody td:nth-child(3){width:120px;max-width:120px}
thead th:nth-child(4),tbody td:nth-child(4){width:120px;max-width:120px}
thead th:nth-child(5),tbody td:nth-child(5){width:100px;max-width:100px}
thead th:nth-child(6),tbody td:nth-child(6){width:80px;max-width:80px;text-align:center}
thead th:nth-child(7),tbody td:nth-child(7){width:100px;max-width:100px}
thead th:nth-child(8),tbody td:nth-child(8){width:80px;max-width:80px;text-align:center}
thead th:nth-child(9),tbody td:nth-child(9){width:120px;max-width:120px}
/* 操作列 */
.action-col{position:sticky;right:0;z-index:10;background:var(--bg-primary);box-shadow:-2px 0 4px rgba(0,0,0,.04)}
.action-col .btn-link:last-child{margin-right:0}
/* 分页 - .pagination 由 framework.css 提供, JS 分页由 pagination.js 驱动 */
/* 标签 */
/* .tag 由 framework.css 提供 */
.tag-success{background:var(--success-light);color:var(--success)}
.tag-warning{background:var(--warning-light);color:var(--warning)}
.tag-error{background:var(--danger-light);color:var(--danger)}
.tag-info{background:var(--primary-light);color:var(--primary)}
.tag-default{background:var(--bg-secondary);color:var(--text-tertiary)}
/* PRD §10.4.1 语义标签 */
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-green{background:var(--success-light);color:var(--success)}
.tag-orange{background:var(--warning-light);color:var(--warning)}
.tag-red{background:var(--danger-light);color:var(--danger)}
.tag-gray{background:var(--bg-secondary);color:var(--text-tertiary)}
.tag-yellow{background:#fef3cd;color:#b7791f}
/* 弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-dialog{background:var(--bg-primary);border-radius:10px;width:900px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-md) 20px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.modal-title{font-size:var(--font-size-lg);font-weight:600;color:var(--text-primary)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);cursor:pointer;font-size:var(--font-size-md);color:var(--text-tertiary);transition:all .2s}
.modal-close:hover{background:var(--bg-secondary);color:var(--text-secondary)}
.modal-body{padding:20px var(--spacing-lg);overflow-y:auto;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-light);flex-shrink:0}
.modal-tabs{display:flex;border-bottom:1px solid var(--border-light);padding:0 20px;background:var(--bg-primary)}
.modal-tab{padding:10px 20px;font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:all .2s;font-weight:400}
.modal-tab:hover{color:var(--primary)}
.modal-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.modal-tab-panel{display:none}
.modal-tab-panel.active{display:block}
/* 表单 */
.form-section{margin-bottom:var(--spacing-md);background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--spacing-md);box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.form-section-title{font-size:var(--font-size-md);font-weight:600;color:var(--text-primary);padding:0 0 12px;margin-bottom:12px;border-bottom:2px solid var(--primary)}
.form-row{display:flex;flex-wrap:wrap;gap:var(--spacing-md);margin-bottom:14px}
.form-row:last-child{margin-bottom:0}
.form-group{display:flex!important;flex-direction:row!important;align-items:center!important;flex:1;min-width:0;max-width:calc(50% - 8px)}
.form-group .form-label{flex-shrink:0;width:80px;margin-bottom:0!important;margin-right:10px;text-align:right;font-size:var(--font-size-sm);color:var(--text-primary)}
.form-label .required{color:var(--danger);margin-right:2px}
.form-group .form-input,.form-group .form-select{flex:1;height:36px;padding:var(--spacing-sm) 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:var(--font-size-sm);box-sizing:border-box}
.form-group .form-input:focus,.form-group .form-select:focus{border-color:var(--primary)}
.form-group textarea.form-input{height:auto;min-height:80px;padding:10px 12px}
.form-group select.form-select{cursor:pointer;background:var(--bg-primary)}
.form-group .form-input:disabled,.form-group .form-select:disabled{background:var(--bg-secondary);color:var(--text-tertiary);cursor:not-allowed}
/* 详情 */
.detail-row{display:flex;border-bottom:1px solid var(--border-light);line-height:44px;align-items:flex-start}
.detail-row:last-child{border-bottom:none}
.detail-label{width:120px;flex-shrink:0;color:var(--text-secondary);font-size:var(--font-size-sm);padding-left:var(--spacing-xs);line-height:44px;font-weight:500}
.detail-value{flex:1;color:var(--text-primary);font-size:var(--font-size-md);padding-right:var(--spacing-sm);word-break:break-all;line-height:22px;padding-top:11px;padding-bottom:11px;white-space:normal}
.detail-section-title{padding:0 var(--spacing-xs) 12px;margin-bottom:12px;border-bottom:2px solid var(--primary);font-size:var(--font-size-md);font-weight:600;color:var(--text-primary)}
.detail-section{margin-bottom:20px;background:var(--bg-section);border-radius:var(--radius-lg);padding:var(--spacing-md)}
.detail-section:last-child{margin-bottom:0}
/* 四方责任体 */
.party-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg-secondary)}
.party-row:last-child{border-bottom:none}
.party-label{width:80px;flex-shrink:0;font-size:var(--font-size-sm);color:var(--text-primary);font-weight:500}
.party-inputs{display:flex;gap:12px;flex:1}
.party-inputs .form-group{flex:1;min-width:120px;margin-bottom:0;flex-direction:column;align-items:stretch}
.party-inputs .form-group .form-label{width:auto;text-align:left;margin-bottom:5px;margin-right:0}
.party-inputs .form-group .form-input,.party-inputs .form-group .form-select{width:100%}
/* 分包操作 */
.subcontract-btns{display:flex;gap:var(--spacing-sm);margin-top:var(--spacing-sm)}
.subcontract-btns .btn{font-size:var(--font-size-xs);padding:var(--spacing-xs) 10px}
/* Toast */
#_toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px var(--spacing-lg);background:var(--text-primary);color:var(--bg-primary);border-radius:var(--radius-md);font-size:var(--font-size-md);z-index:99999;opacity:0;transition:opacity var(--duration-normal);pointer-events:none}
.no-data td{text-align:center;color:var(--border);padding:40px 0}
/* 安全码列样式（与重点场所管理统一） */
.code-cell{display:inline-flex;align-items:center;cursor:help}
.qrcode-icon{width:20px;height:20px;color:var(--text-secondary)}
.code-cell.red .qrcode-icon{color:var(--danger)}
.code-cell.yellow .qrcode-icon{color:var(--warning)}
.code-cell.green .qrcode-icon{color:var(--success)}
/* 辖区提示 */
.region-tag{display:inline-flex;align-items:center;padding:2px var(--spacing-sm);background:var(--primary-light);color:var(--primary);border-radius:var(--radius-sm);font-size:var(--font-size-xs);margin-left:8px}
</style>
</head>
<body>
<script src="../../js/pagination.js"></script>
<script src="../../js/utils.js"></script>
<div class="page-container" data-module="government/project-manage">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-prefix">当前位置：</span>
    <span class="breadcrumb-item">政府端</span>
    <span class="breadcrumb-separator">&gt;</span>
    <span class="breadcrumb-item current">项目信息管理</span>
    <span class="region-tag">辖区：南山区</span>
    <span class="region-tag" style="margin-left:8px;background:var(--info-light,#e8f4fd);color:var(--info,var(--primary))">角色：<select id="roleSwitch" onchange="switchRole(this.value)" style="border:none;background:transparent;font-size:12px;color:inherit;cursor:pointer"><option value="领导">领导</option><option value="监管人员">监管人员</option></select></span>
  </div>
  <div class="main-layout">
    <!-- 左侧树形区域 -->
    <div class="tree-panel">
      <div class="tree-search">
        <input type="text" id="treeSearchInput" placeholder="搜索街道/领域" onkeyup="filterTree()">
        <span class="search-icon">&#128269;</span>
      </div>
      <div class="tree-tabs">
        <button class="tree-tab active" id="tabStreet" onclick="switchTreeTab('street')">按街道筛选</button>
        <button class="tree-tab" id="tabDomain" onclick="switchTreeTab('domain')">按领域筛选</button>
      </div>
      <div class="tree-content" id="treeContent">
        <!-- 树形内容由JS渲染 -->
      </div>
    </div>
    <!-- 右侧内容区 -->
    <div class="right-content">
    <!-- 统计卡片 -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">辖区项目总数</div><div class="stat-value" id="statTotal">0</div></div><div class="stat-indicator" style="background:var(--primary)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">在建项目</div><div class="stat-value" id="statBuilding">0</div></div><div class="stat-indicator" style="background:var(--success)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">停工项目</div><div class="stat-value" id="statStopped">0</div></div><div class="stat-indicator" style="background:var(--warning)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">竣工项目</div><div class="stat-value" id="statCompleted">0</div></div><div class="stat-indicator" style="background:var(--text-tertiary)"></div></div>
      <div class="stat-card"><div class="stat-card-body"><div class="stat-label">运营项目</div><div class="stat-value" id="statOperation">0</div></div><div class="stat-indicator" style="background:var(--primary)"></div></div>
    </div>
    <!-- 查询条件 -->
    <div class="query-bar">
      <div class="q-item"><label>项目类别：</label>
        <select id="filterType"><option value="">全部</option><option value="1">在建项目</option><option value="2">运营项目</option></select>
      </div>
      <div class="q-item"><label>项目状态：</label>
        <select id="filterStatus"><option value="">全部</option><option value="1">未开工</option><option value="2">在建</option><option value="3">停工</option><option value="4">竣工</option></select>
      </div>
      <div class="q-item"><label>领域小类：</label>
        <select id="filterDomain"><option value="">全部</option></select>
      </div>
      <div class="q-item"><label>搜索：</label>
        <input id="filterKeyword" placeholder="搜索项目名称/编号..." style="width:240px">
      </div>
      <button class="btn btn-primary" onclick="renderTable()">查询</button>
      <button class="btn btn-default" onclick="resetFilters()">重置</button>
      <div style="flex:1"></div>
      <button class="btn btn-default" style="position:relative;margin-right:8px;" onclick="openApprovalList()">📋 审批列表<span style="position:absolute;top:-6px;right:-8px;background:#fa8c16;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center;line-height:14px;">2</span></button>
      <button class="btn btn-primary" onclick="openAddModal()">+ 新增项目</button>
    </div>
    <!-- 项目列表 -->
    <div class="table-card">
      <div class="table-container table-wrap">
        <table>
          <thead><tr>
            <th class="col-index">序号</th><th>项目名称</th><th>项目编号</th><th>领域小类</th><th>项目小类</th>
            <th>项目状态</th><th>所属区域</th><th>安全码</th><th>创建时间</th><th class="action-col">操作</th>
          </tr></thead>
          <tbody id="projectTableBody"><tr><td colspan="10" class="no-data">加载中...</td></tr></tbody>
        </table>
      </div>
      <div class="pagination" id="paginationBar"></div>
    </div>
    </div><!-- /right-content -->
  </div>
</div>

<!-- 新增/编辑项目弹窗 -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增项目</span>
      <div class="modal-close" onclick="closeModal('modal-edit')">&times;</div>
    </div>
    <div class="modal-body" style="padding:0">
      <div class="modal-tabs">
        <button class="modal-tab active" id="mTab0" onclick="switchModalTab(0)">基础信息</button>
        <button class="modal-tab" id="mTab1" onclick="switchModalTab(1)">四方责任体</button>
        <button class="modal-tab" id="mTab2" onclick="switchModalTab(2)">账号信息</button>
      </div>
      <div style="padding:20px 24px">
      <!-- Tab 0: 基础信息 -->
      <div class="modal-tab-panel active" id="tabPanel0">
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目类别</label>
            <select class="form-select" id="fProjectCategory" onchange="onProjectCategoryChange()">
              <option value="">请选择项目类别</option><option value="1">在建项目</option><option value="2">运营项目</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目编号</label><input class="form-input" id="fProjectNo" type="text" placeholder="请输入施工许可证号"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目名称</label><input class="form-input" id="fProjectName" type="text" placeholder="请输入项目全称"></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>领域小类</label>
            <select class="form-select" id="fDomain" onchange="onDomainChange()"><option value="">请选择领域小类</option></select>
          </div>
        </div>
        <div class="form-row" id="projectTypeRow">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目小类</label>
            <select class="form-select" id="fProjectType"><option value="">请先选择领域小类</option></select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目状态</label>
            <select class="form-select" id="fProjectStatus">
              <option value="">请选择项目状态</option><option value="1">未开工</option><option value="2">在建</option><option value="3">停工</option><option value="4">竣工</option>
            </select>
          </div>
        </div>
        <div class="form-row" id="operationStatusRow" style="display:none">
          <div class="form-group"><label class="form-label"><span class="required">*</span>项目状态</label>
            <select class="form-select" id="fOperationStatus">
              <option value="">请选择项目状态</option><option value="1">正常运营</option><option value="2">暂停运营</option><option value="3">关闭</option>
            </select>
          </div>
          <div class="form-group"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属区划</label>
            <select class="form-select" id="fRegion" disabled>
              <option value="440305" selected>南山区</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label"><span class="required">*</span>所属街道</label>
            <select class="form-select" id="fStreet" onchange="onStreetChange()"><option value="">请选择街道</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">所属社区</label>
            <select class="form-select" id="fCommunity"><option value="">请选择社区（选填）</option></select>
          </div>
          <div class="form-group" style="flex:1;min-width:300px"><label class="form-label"><span class="required">*</span>详细地址</label><input class="form-input" id="fAddress" type="text" placeholder="请输入具体施工地址"></div>
        </div>
        <div class="form-row" id="supervisionGroupRow">
          <div class="form-group"><label class="form-label">所属督导组</label>

function renderTable(){
  var typeVal = document.getElementById('filterType').value;
  var statusVal = document.getElementById('filterStatus').value;
  var domainVal = document.getElementById('filterDomain').value;
  var kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
  var rows = filteredProjects.filter(function(p){
    if(p.regionCode !== GOV_REGION_CODE) return false;
    if(typeVal && p.projectCategory !== typeVal) return false;
    if(statusVal && p.projectStatus !== statusVal) return false;
    if(domainVal && p.domainId !== domainVal) return false;
    if(kw && !(p.projectName.toLowerCase().includes(kw) || p.projectNo.toLowerCase().includes(kw))) return false;
    return true;
  });
  var start = (pg.page - 1) * pg.size;
  var pageRows = rows.slice(start, start + pg.size);
  var tbody = document.getElementById('projectTableBody');
  if(pageRows.length === 0){
    tbody.innerHTML = '<tr><td colspan="10" class="no-data">暂无数据</td></tr>';
    pg.setTotal(rows.length);
    return;
  }
  tbody.innerHTML = pageRows.map(function(p, idx){
    var statusCls, statusName;
    if(p.projectCategory === '2'){
      statusCls = operationStatusTagMap[p.projectStatus] || 'tag-default';
      statusName = operationStatusMap[p.projectStatus] || '—';
    }else{
      statusCls = statusTagMap[p.projectStatus] || 'tag-default';
      statusName = statusMap[p.projectStatus] || '—';
    }
    var seq = start + idx + 1;
    var areaText = (p.streetName||'') + (p.communityName ? ' / ' + p.communityName : '');
    return '<tr>' +
      '<td>' + seq + '</td>' +
      '<td title="' + p.projectName + '">' + p.projectName + '</td>' +
      '<td title="' + p.projectNo + '">' + p.projectNo + '</td>' +
      '<td>' + (p.domainName||'') + '</td>' +
      '<td>' + (p.projectCategory === '2' ? '<span class="tag tag-info">运营</span>' : (p.projectType||'')) + '</td>' +
      '<td><span class="tag ' + statusCls + '">' + statusName + '</span></td>' +
      '<td title="' + areaText + '">' + areaText + '</td>' +
      '<td style="text-align:center"><span class="code-cell ' + (p.codeState||'green') + '" title="' + ((p.codeState||'green')==='red'?'红码':(p.codeState||'green')==='yellow'?'黄码':'绿码') + '">' + QR_ICON_SVG + '</span></td>' +
      '<td>' + (p.createTime||'') + '</td>' +
      '<td class="action-col" style="white-space:nowrap"><button class="btn btn-link" onclick="viewDetail(\'' + p.id + '\')">查看</button> <button class="btn btn-link" onclick="openEditModal(\'' + p.id + '\')">编辑</button>' + (currentUserRole === '领导' ? ' <button class="btn btn-link" style="color:var(--danger)" onclick="deleteProject(\'' + p.id + '\')">删除</button> <button class="btn btn-link" onclick="resetPwd(\'' + p.id + '\')">重置密码</button>' : '') + '</td>' +
      '</tr>';
  }).join('');
  pg.setTotal(rows.length);
}

function saveProject(){
  var projectCategory = document.getElementById('fProjectCategory').value;
  var projectNo = document.getElementById('fProjectNo').value.trim();
  var projectName = document.getElementById('fProjectName').value.trim();
  var domainId = document.getElementById('fDomain').value;

  var communityCode = document.getElementById('fCommunity').value;

  if(!projectCategory || !projectNo || !projectName || !domainId || !projectStatus || !address || !loginAccount){
    showToast('请填写所有必填项'); return;
  }
  // BR-08: 项目编号唯一性校验
  var dupNo = allProjects.find(function(x){return x.projectNo === projectNo && (!currentEditProject || x.id !== currentEditProject.id);});

    var dupAcc = allProjects.find(function(x){return x.loginAccount === loginAccount;});
    if(dupAcc){ showToast('登录账号已存在，请更换'); return; }
  }
  if(projectCategory !== '2' && !projectType){
    showToast('请选择项目小类'); return;
  }
  var domain = domainList.find(function(d){return d.id === domainId;});
  var regionName = GOV_REGION_NAME;
  var streetName = streetCode && streetData[streetCode] ? streetData[streetCode].name : '';
  var communityName = communityCode && streetData[streetCode] && streetData[streetCode].communities[communityCode] ? streetData[streetCode].communities[communityCode] : '';
  var parties;

    var opName = document.getElementById('fOperatorName').value.trim();

    ];
    for(var i = 1; i <= _subcontractCount; i++){

        parties.push({
          partyType:4,partyTypeName:'分包单位',

          creditCode:document.getElementById('fSubCredit_' + i).value.trim(),
          contactName:document.getElementById('fSubContact_' + i).value.trim(),
          contactPhone:document.getElementById('fSubPhone_' + i).value.trim()
        });

    }
  }
  if(currentEditProject){
    currentEditProject.projectCategory = projectCategory;
    currentEditProject.projectNo = projectNo;
    currentEditProject.projectName = projectName;
    currentEditProject.domainId = domainId;
    currentEditProject.domainName = domain ? domain.name : '';

    currentEditProject.regionCode = regionCode;
    currentEditProject.regionName = regionName;
    currentEditProject.streetCode = streetCode;
    currentEditProject.streetName = streetName;
    currentEditProject.communityCode = communityCode;

    currentEditProject.description = document.getElementById('fDescription').value.trim();
    currentEditProject.parties = parties;
    showToast('项目信息已更新');
  }else{
    var newProject = {
      id: _pidGen(),
      projectCategory: projectCategory,
      projectNo: projectNo,
      projectName: projectName,
      domainId: domainId,
      domainCode: domainId === 'd1' ? 'CONS-BUILD' : domainId === 'd2' ? 'CONS-CIVIL' : domainId === 'd3' ? 'CONS-TRANS' : 'CONS-CIVIL',

      regionName: regionName,
      streetCode: streetCode,
      streetName: streetName,
      communityCode: communityCode,

function calcTreeCounts(data, getCount){
  data.forEach(function(node){
    if(node.children && node.children.length > 0){
      calcTreeCounts(node.children, getCount);
      node.count = node.children.reduce(function(sum, child){return sum + child.count;}, 0);
    }else if(getCount){
      node.count = getCount(node.code);
    }
  });
}

function renderTree(nodes, level, parentExpanded){
  if(!parentExpanded && level > 0) return '';
  var html = '<div class="tree-children" style="' + (level === 0 ? '' : 'padding-left:var(--spacing-md)') + '">';
  nodes.forEach(function(node){
    var hasChildren = node.children && node.children.length > 0;
    var isExpanded = node.expanded || false;
    var isActive = selectedTreeNode && selectedTreeNode.code === node.code;
    html += '<div class="tree-node ' + (isActive ? 'active' : '') + '" onclick="onTreeNodeClick(\'' + node.code + '\', \'' + node.name + '\', ' + level + ', event)" data-code="' + node.code + '">';
    html += '<span class="arrow ' + (isExpanded ? 'expanded' : '') + '" style="' + (hasChildren ? '' : 'visibility:hidden') + '" onclick="toggleTreeNode(\'' + node.code + '\', event)">▶</span>';
    html += '<span class="node-icon">' + (node.icon || (level === 0 ? '📁' : (level === 1 ? '📂' : '📄'))) + '</span>';
    html += '<span>' + node.name + '</span>';
    html += '<span class="node-count">' + node.count + '</span>';
    html += '</div>';
    if(hasChildren){
      html += renderTree(node.children, level + 1, isExpanded);
    }
  });
  html += '</div>';
  return html;
}

function toggleTreeNode(code, event){
  event.stopPropagation();
  var data = currentTreeTab === 'street' ? streetTreeData : domainTreeData;
  var node = findTreeNode(data, code);
  if(node){
    node.expanded = !node.expanded;
    refreshTree();
  }
}

function findTreeNode(nodes, code){
  for(var i = 0; i < nodes.length; i++){
    if(nodes[i].code === code) return nodes[i];
    if(nodes[i].children){
      var found = findTreeNode(nodes[i].children, code);
      if(found) return found;
    }
  }
  return null;
}

function onTreeNodeClick(code, name, level, event){
  event.stopPropagation();
  selectedTreeNode = {type: currentTreeTab, code: code, name: name, level: level};
  refreshTree();
  applyTreeFilter();
}

function applyTreeFilter(){
  if(!selectedTreeNode){
    filteredProjects = allProjects.slice();
  }else if(selectedTreeNode.type === 'street'){
    var codes = getTreeNodeDescendants(streetTreeData, selectedTreeNode.code);
    filteredProjects = allProjects.filter(function(p){
      return codes.indexOf(p.regionCode) >= 0 || codes.indexOf(p.streetCode) >= 0 || codes.indexOf(p.communityCode) >= 0;
    });
  }else{
    filteredProjects = allProjects.filter(function(p){
      return p.domainCode === selectedTreeNode.code || (p.domainCode && p.domainCode.indexOf(selectedTreeNode.code) === 0);
    });
  }
  pg.setPage(1);
  updateStats();
  renderTable();
}

function getTreeNodeDescendants(nodes, code){
  var result = [code];
  var node = findTreeNode(nodes, code);
  if(node && node.children){
    node.children.forEach(function(child){
      result = result.concat(getTreeNodeDescendants(nodes, child.code));
    });
  }
  return result;
}

function filterTree(){
  var keyword = document.getElementById('treeSearchInput').value.trim().toLowerCase();
  refreshTree(keyword);
}

function switchTreeTab(tab){
  currentTreeTab = tab;
  selectedTreeNode = null;
  document.getElementById('tabStreet').classList.toggle('active', tab === 'street');
  document.getElementById('tabDomain').classList.toggle('active', tab === 'domain');
  document.getElementById('treeSearchInput').value = '';
  refreshTree();
  filteredProjects = allProjects.slice();
  pg.setPage(1);
  updateStats();
  renderTable();
}

function refreshTree(keyword){
  var data = currentTreeTab === 'street' ? streetTreeData : domainTreeData;
  if(keyword){
    data = filterTreeData(JSON.parse(JSON.stringify(data)), keyword);
  }
  document.getElementById('treeContent').innerHTML = renderTree(data, 0, true);
}

function filterTreeData(nodes, keyword){
  var result = [];
  for(var i = 0; i < nodes.length; i++){
    var node = nodes[i];
    var match = node.name.toLowerCase().indexOf(keyword) !== -1;
    if(node.children){
      var filteredChildren = filterTreeData(node.children, keyword);
      if(filteredChildren.length > 0){
        match = true;
        node.children = filteredChildren;
      }
    }
    if(match){
      result.push(node);
    }
  }
  return result;
}

function initTree(){
  calcTreeCounts(streetTreeData, function(code){
    return allProjects.filter(function(p){return p.regionCode === code || p.streetCode === code || p.communityCode === code;}).length;
  });
  calcTreeCounts(domainTreeData, function(code){
    return allProjects.filter(function(p){return p.domainCode === code || (p.domainCode && p.domainCode.indexOf(code) === 0);}).length;
  });
  refreshTree();
}

// ==================== 初始化 ====================
initDomainSelect();
initStreetSelect();
initTree();
updateStats();
renderTable();
</script>
