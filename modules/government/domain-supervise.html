<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>领域监管管理 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
    /* ========== 页面背景 ========== */
    .page-container { 
      padding: var(--spacing-lg); 
      background: var(--bg-page);
      min-height: 100vh;
    }
    
    /* ========== 页面标题栏 ========== */
    .page-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: var(--spacing-md);
      background: var(--bg-primary);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .page-title { font-size: var(--font-size-lg); font-weight: 600; }
    
    /* ========== 分屏视图 ========== */
    .split-view { display: flex; gap: var(--spacing-lg); height: calc(100vh - 180px); }
    
    /* ========== 左侧面板 ========== */
    .left-panel { 
      width: 300px; 
      flex-shrink: 0; 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      box-shadow: var(--shadow-card);
    }
    .panel-header { padding: var(--spacing-md); border-bottom: 1px solid var(--border-light); background: var(--bg-section); }
    .panel-title { font-size: var(--font-size-base); font-weight: 600; }
    .panel-body { flex: 1; overflow-y: auto; padding: 8px 0; }
    
    /* ========== 右侧面板 ========== */
    .right-panel { 
      flex: 1; 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      box-shadow: var(--shadow-card);
    }
    
    /* ========== 列表项 ========== */
    .list-item { display: flex; align-items: center; padding: 10px var(--spacing-md); cursor: pointer; transition: all 0.15s; }
    .list-item:hover { background: var(--bg-hover); }
    .list-item.active { background: var(--bg-active); }
    .list-item-name { flex: 1; font-size: var(--font-size-sm); }
    .list-item-count { font-size: 12px; color: var(--text-tertiary); background: var(--bg-section-alt); padding: 2px 8px; border-radius: 10px; }
    
    /* ========== 统计行 ========== */
    .stat-row { display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-md); }
    .stat-box { 
      flex: 1; 
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); 
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg); 
      padding: var(--spacing-md); 
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-value { font-size: 28px; font-weight: 600; color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    
    /* ========== 表格 ========== */
    .table-wrap { flex: 1; overflow: auto; }
    .table-scroll { overflow-x: auto; }
    .table-scroll table { width: 100%; min-width: 800px; border-collapse: collapse; }
    .table-scroll th { padding: 12px var(--spacing-md); text-align: left; font-size: var(--font-size-sm); font-weight: 600; background: var(--bg-section); color: var(--text-primary); border-bottom: 1px solid var(--border-light); }
    .table-scroll td { padding: 12px var(--spacing-md); font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-light); }
    .table-scroll tbody tr:nth-child(even) { background: var(--bg-section-alt); }
    .table-scroll tbody tr:hover td { background: var(--bg-hover); }
    .ellipsis-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .action-col { position: sticky; right: 0; background: var(--bg-primary); z-index: 10; white-space: nowrap; }
    .table-scroll tbody tr:nth-child(even) .action-col { background: var(--bg-section-alt); }
    .table-scroll tbody tr:hover .action-col { background: var(--bg-hover); }
    .btn-link { padding: 4px 8px; border: none; background: none; color: var(--primary); cursor: pointer; font-size: var(--font-size-sm); }
    .btn-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="module-page page-container" data-module="gov-domain-supervise">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item current">政府端</span>
    </div>
    
    <!-- 页面标题栏已隐藏 -->
    
    <div class="split-view">
      <div class="left-panel">
        <div class="panel-header"><span class="panel-title">领域小类列表</span></div>
        <div class="panel-body" id="domainList">
          <div class="list-item active" data-domain="充换电设施" onclick="selectDomain(this)"><span class="list-item-name">充换电设施</span><span class="list-item-count">12</span></div>
          <div class="list-item" data-domain="农贸市场" onclick="selectDomain(this)"><span class="list-item-name">农贸市场</span><span class="list-item-count">8</span></div>
          <div class="list-item" data-domain="危险化学品仓储" onclick="selectDomain(this)"><span class="list-item-name">危险化学品仓储</span><span class="list-item-count">5</span></div>
          <div class="list-item" data-domain="建筑施工现场" onclick="selectDomain(this)"><span class="list-item-name">建筑施工现场</span><span class="list-item-count">15</span></div>
          <div class="list-item" data-domain="工贸企业" onclick="selectDomain(this)"><span class="list-item-name">工贸企业</span><span class="list-item-count">23</span></div>
        </div>
      </div>
      
      <div class="right-panel">
        <div style="padding: var(--spacing-lg); border-bottom: 1px solid var(--border-light);">
          <div class="stat-row">
            <div class="stat-box"><div class="stat-value" id="statTotal">12</div><div class="stat-label">企业总数</div></div>
            <div class="stat-box"><div class="stat-value" id="statPlace">156</div><div class="stat-label">场所码</div></div>
            <div class="stat-box"><div class="stat-value" id="statHazard">45</div><div class="stat-label">危险源码</div></div>
            <div class="stat-box"><div class="stat-value" id="statCoverage">98%</div><div class="stat-label">监管覆盖率</div></div>
          </div>
        </div>
        
        <div class="table-wrap">
          <div class="table-scroll">
            <table>
              <thead><tr><th>企业名称</th><th>场所码</th><th>危险源码</th><th>监管单位</th><th>覆盖率</th><th class="action-col">操作</th></tr></thead>
              <tbody id="enterpriseTableBody">
                <tr><td class="ellipsis-col" title="创安电子科技有限公司">创安电子科技有限公司</td><td>3</td><td>1</td><td>南山区应急管理局</td><td>100%</td><td class="action-col"><button class="btn-link" onclick="viewDetail('创安电子科技有限公司')">查看详情</button><button class="btn-link" onclick="configDomain('创安电子科技有限公司')">配置</button></td></tr>
                <tr><td class="ellipsis-col" title="深圳港物流有限公司">深圳港物流有限公司</td><td>5</td><td>2</td><td>南山区应急管理局</td><td>95%</td><td class="action-col"><button class="btn-link" onclick="viewDetail('深圳港物流有限公司')">查看详情</button><button class="btn-link" onclick="configDomain('深圳港物流有限公司')">配置</button></td></tr>
                <tr><td class="ellipsis-col" title="安达运输公司">安达运输公司</td><td>2</td><td>0</td><td>福田区应急管理局</td><td>100%</td><td class="action-col"><button class="btn-link" onclick="viewDetail('安达运输公司')">查看详情</button><button class="btn-link" onclick="configDomain('安达运输公司')">配置</button></td></tr>
                <tr><td class="ellipsis-col" title="新兴化工有限公司">新兴化工有限公司</td><td>4</td><td>3</td><td>深圳市应急管理局</td><td>92%</td><td class="action-col"><button class="btn-link" onclick="viewDetail('新兴化工有限公司')">查看详情</button><button class="btn-link" onclick="configDomain('新兴化工有限公司')">配置</button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      
      const CONFIG = {
        moduleId: 'gov-domain-supervise',
        moduleName: '领域监管管理'
      };
      
      let state = {
        initialized: false,
        currentDomain: '充换电设施'
      };
      
      function init() {
        if (state.initialized) return;
        console.log(`[${CONFIG.moduleId}] 模块初始化`);
        state.initialized = true;
      }
      
      // 选择领域
      window.selectDomain = function(el) {
        document.querySelectorAll('.list-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        state.currentDomain = el.dataset.domain;
        console.log('选中领域：' + state.currentDomain);
      };
      
      // 查看详情
      window.viewDetail = function(name) {
        console.log('查看详情：' + name);
        alert('查看详情：' + name);
      };
      
      // 配置
      window.configDomain = function(name) {
        console.log('配置领域：' + name);
        alert('配置领域：' + name);
      };
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      window.destroyModule = function() {
        console.log(`[${CONFIG.moduleId}] 模块销毁`);
        state.initialized = false;
      };
    })();
  </script>
<script src="../../js/annotations.js"></script>
</body>
</html>
