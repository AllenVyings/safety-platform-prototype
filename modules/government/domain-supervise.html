  // 节点checkbox切换（联动子项）
  window.onRefNodeToggle = function(cb) {
    var nodeId = cb.getAttribute('data-node');
    var children = document.getElementById('refc_' + nodeId);
    if (!children) return;
    var childItems = children.querySelectorAll('.ref-tree-checkbox[data-item]');
    var isChecked = cb.checked;
    childItems.forEach(function(childCb) {
      var itemId = childCb.getAttribute('data-item');
      if (isChecked) {
        refSelected[itemId] = true;
      } else {
        delete refSelected[itemId];
      }
      childCb.checked = isChecked;
      childCb.removeAttribute('data-indeterminate');
    });
    // 递归处理子节点
    var childNodes = children.querySelectorAll('.ref-tree-checkbox[data-node]');
    childNodes.forEach(function(childCb) {
      childCb.checked = isChecked;
      childCb.removeAttribute('data-indeterminate');
      onRefNodeToggle(childCb);
    });
    // 更新父节点的半选状态
    updateRefAncestors(cb);
    updateRefStats();
  };

  // 单项切换
  window.onRefItemToggle = function(cb) {
    var itemId = cb.getAttribute('data-item');
    if (cb.checked) {
      refSelected[itemId] = true;
    } else {
      delete refSelected[itemId];
    }
    updateRefAncestors(cb);
    updateRefStats();
  };

  // 更新父节点状态
  function updateRefAncestors(cb) {
    var node = cb.closest('.ref-tree-children');
    while (node) {
      var parentCb = node.parentElement.querySelector(':scope > .ref-tree-node > .ref-tree-checkbox, :scope > .ref-tree-node .ref-tree-checkbox');
      if (!parentCb) {
        // 尝试找兄弟节点的checkbox
        var siblings = node.previousElementSibling;
        if (siblings && siblings.querySelector) {
          parentCb = siblings.querySelector('.ref-tree-checkbox[data-node]');
        }
      }
      if (!parentCb || !parentCb.getAttribute('data-node')) break;
      var parentId = parentCb.getAttribute('data-node');
      var parentChildren = document.getElementById('refc_' + parentId);
      if (!parentChildren) break;
      var allItems = parentChildren.querySelectorAll('.ref-tree-checkbox[data-item]');
      var checkedCount = 0;
      allItems.forEach(function(c) { if (c.checked) checkedCount++; });
      if (checkedCount === 0) {
        parentCb.checked = false;
        parentCb.removeAttribute('data-indeterminate');
      } else if (checkedCount === allItems.length) {
        parentCb.checked = true;
        parentCb.removeAttribute('data-indeterminate');
      } else {
        parentCb.checked = false;
        parentCb.setAttribute('data-indeterminate', '1');
      }
      node = parentChildren.parentElement ? parentChildren.parentElement.closest('.ref-tree-children') : null;
    }
  }

  function updateRefStats() {
    var selectedIds = Object.keys(refSelected);
    var tableSet = {};
    var tableItemCount = 0;
    var uncatCount = 0;
    CHECKLIST_LIB_DATA.forEach(function(cat) {
      cat.domains.forEach(function(domain) {
        domain.tables.forEach(function(table) {
          if (table.enabled === false || table.status === '停用') return;
          var hasSelected = false;
          var tableTotalItems = table.items.length;
          table.items.forEach(function(it) {
            if (refSelected[it.id]) hasSelected = true;
          });
          if (hasSelected) {
            tableSet[table.name] = true;
            tableItemCount += tableTotalItems;
          }
        });
        (domain.uncatItems || []).forEach(function(it) {
          if (refSelected[it.id]) uncatCount++;
        });
      });
    });
    (CHECKLIB_UNCAT_ITEMS || []).forEach(function(it) {
      if (refSelected[it.id]) uncatCount++;
    });
    var tableCount = Object.keys(tableSet).length;
    var total = tableItemCount + uncatCount;
    var el = document.getElementById('refStats');
    if (el) {
      el.innerHTML = '已选择：<strong>' + tableCount + '</strong> 个检查表（共 ' + tableItemCount + ' 项）+ ' + uncatCount + ' 条独立检查项 = 合计 <strong>' + total + '</strong> 项';
    }
  }

  // ========== 检查表编辑 ==========
  // 解析周期字符串为 {n, unit, m}（兼容 "每月" 与 "每1月检查1次" 两种格式）
  function parseCycle(cycle) {
    var m = /^每(\d+)?(日|周|月|季度)检查(\d+)次$/.exec(cycle || '');
    if (m) return { n: parseInt(m[1] || '1', 10), unit: m[2], m: parseInt(m[3], 10) };
    var u = /^每(日|周|月|季度)$/.exec(cycle || '');
    return u ? { n: 1, unit: u[1], m: 1 } : { n: 1, unit: '月', m: 1 };
  }

  window.editChecklist = function(domainId, idx) {
    if (!draftConfig || !draftConfig.checklists || !draftConfig.checklists[idx]) return;
    var cl = draftConfig.checklists[idx];
    var d = DOMAIN_SUMMARY.find(function(x) { return x.id === domainId; });
    var objects = OBJECT_DETAILS[domainId] || (d ? generateObjects(d) : []);
    // 设置弹窗标题
    document.getElementById('clModalTitle').textContent = '编辑检查表配置';
    var isSystemCl = (cl.checklistType === 'system');
    // 设置字段只读态（系统检查表名称/周期/内容只读）
    applyClTypeReadOnly(isSystemCl);
    // 编辑模式下隐藏检查库引用按钮（系统表和自定义表均不允许引用）
    var btnRef = document.getElementById('btnRefLib');
    if (btnRef) btnRef.style.display = 'none';
    // 设置名称
    var nameInput = document.getElementById('clName');
    if (nameInput) {
      nameInput.value = cl.name || '';
    }
    // 设置周期（系统检查表只读；兼容 "每月" / "每1月检查1次" 两种格式回显）
    var parsed = parseCycle(cl.frequency || cl.cycle);
    document.getElementById('clCycleN').value = parsed.n;
    document.getElementById('clCycleUnit').value = parsed.unit;
    document.getElementById('clCycleM').value = parsed.m;
    // 节假日开关（不在只读清单内，始终可编辑）；检查项（系统检查表内容只读，已由 applyClTypeReadOnly 处理）
    document.getElementById('clSkipHoliday').classList.toggle('active', !!cl.skipHoliday);
    // 加载检查项数据（兼容数组和旧字符串格式）
    var checkItems = [];
    if (Array.isArray(cl.items)) {
      checkItems = cl.items.map(function(it, i) { return { id: it.id || ('item_' + i), num: i + 1, name: it.name || '', contents: it.contents || [] }; });
      clCheckItemCounter = checkItems.length;
    } else if (typeof cl.items === 'string' && cl.items) {
      // 旧文本格式：按行解析
      cl.items.split('\n').forEach(function(line) {
        if (line.trim()) checkItems.push({ id: 'item_' + (checkItems.length + 1), num: checkItems.length + 1, name: line.trim().replace(/^-\s*/, ''), contents: [] });
      });
      clCheckItemCounter = checkItems.length;
    }
    setModalCheckItems(checkItems);
    renderCheckitemList(checkItems);
    // 存储全部管控对象供穿梭框使用
    window._clAllObjects = objects.map(function(o) { return { name: o.name, type: o.type }; });
    // 加载责任分配数据（编辑模式回显）
    // objectPersons 存在=用户实际配置过；不存在=未配置，回显时显示"-"
    var assignedObjs = cl.assignedObjects || [];
    var objectPersons = cl.objectPersons || {};
    var selDepts = cl.selectedDepts || [];
    // 不再回退使用 cl.person（预填默认值），未配置时人员为空
    clAssignData = {
      dept: cl.dept || '',
      objects: assignedObjs.slice(),
      persons: objectPersons,
      selectedDepts: selDepts.slice()
    };
    renderAssignResult();
    document.getElementById('modal-checklist').dataset.domainId = domainId;
    document.getElementById('modal-checklist').dataset.editIdx = idx;
    openModal('modal-checklist');
  };

  // ========== BR-GOV-DS-18 草稿态 ==========

  var draftBaseline = null;

  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  // 深度相等（键序无关）——避免对象键序差异产生假草稿条目
  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return a !== a && b !== b;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)) {
      if (a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) { if (!deepEqual(a[i], b[i])) return false; }
      return true;
    }
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (var j = 0; j < ka.length; j++) {
      var k = ka[j];
      if (!Object.prototype.hasOwnProperty.call(b, k) || !deepEqual(a[k], b[k])) return false;
    }
    return true;
  }

  function draftHasChanges() {
    return !!(draftConfig && draftBaseline) && !deepEqual(draftConfig, draftBaseline);
  }

  // 调试/测试：草稿状态查询（暴露到 window 供 Playwright 测试）
  window.getDraftStatus = function() {
    return {
      hasBaseline: !!draftBaseline,
      hasConfig: !!draftConfig,
      hasChanges: draftHasChanges(),
      conflictCount: computeDraftEntries().filter(function(e) { return e.conflict; }).length
    };
  };

  // 草稿变更后重渲染配置页（三板块 + 草稿列表同步刷新）
  function afterDraftChange() {

  // ⓪ 责任科室下拉变更（行内 onchange 回调须挂 window）
  window.onDraftDeptChange = function(value) {

  function describeChecklistDiff(a, b) {
    var parts = [];
    if (a.name !== b.name) parts.push('名称');
    if ((a.frequency || a.cycle) !== (b.frequency || b.cycle)) parts.push('检查频次');
    var pa = Array.isArray(a.person) ? a.person.join('、') : (a.person || '');
    var pb = Array.isArray(b.person) ? b.person.join('、') : (b.person || '');
    if (pa !== pb) parts.push('责任人');
    if ((a.assignedObjects || []).length !== (b.assignedObjects || []).length) parts.push('分配对象数');
    if ((a.enabled !== false) !== (b.enabled !== false)) parts.push('状态');
    var sa = !(a.scan && a.scan.enabled === false), sb = !(b.scan && b.scan.enabled === false);
    if (sa !== sb) parts.push('扫码责任');
    return parts.length ? '（' + parts.join('、') + '变更）' : '';
  }

  function describeHazardDiff(a, b) {
    var parts = [];
    if (a.type !== b.type) parts.push('隐患类型');
    if (a.responder !== b.responder) parts.push('整改责任人');
    if (String(a.deadline) !== String(b.deadline)) parts.push('整改期限');
    if (a.reviewer !== b.reviewer) parts.push('复核方');
    if (a.reviewPerson !== b.reviewPerson) parts.push('复核人');
    if ((a.enabled !== false) !== (b.enabled !== false)) parts.push('状态');
    return '（' + parts.join('、') + '变更）';
  }

  // 计算草稿条目（与基线 diff）+ 冲突检测（冲突条目黄色警告边框 + 原因）
  function computeDraftEntries() {
    var entries = [];
    if (!draftConfig || !draftBaseline) return entries;
    var total = configState.objects.length;
    var b = draftBaseline, c = draftConfig;
    // ⓪ 责任科室
    if ((b.dept || '') !== (c.dept || '')) {
      entries.push({ type: 'dept', desc: '⓪ 责任科室：' + (b.dept || '本单位') + ' → ' + (c.dept || '本单位'), conflict: null, action: 'revert' });
    }
    // ① 检查表（按索引 diff）
    var bl = b.checklists || [], cl = c.checklists || [];
    var min = Math.min(bl.length, cl.length);
    var i;
    for (i = 0; i < min; i++) {
      if (!deepEqual(bl[i], cl[i])) {
        entries.push({ type: 'checklist-edit', targetIdx: i, desc: '修改检查表《' + cl[i].name + '》' + describeChecklistDiff(bl[i], cl[i]), conflict: null, action: 'revert' });
      }
    }
    for (i = min; i < cl.length; i++) {
      entries.push({ type: 'checklist-add', targetIdx: i, desc: '新增检查表《' + cl[i].name + '》（' + (cl[i].assignedObjects || []).length + '/' + total + ' 个对象）', conflict: null, action: 'revert' });
    }
    for (i = min; i < bl.length; i++) {
      entries.push({ type: 'checklist-delete', targetIdx: i, desc: '删除检查表《' + bl[i].name + '》', conflict: null, action: 'revert' });
    }
    // ② 隐患责任
    if (!deepEqual(b.hazard || null, c.hazard || null)) {
      if (!b.hazard && c.hazard) entries.push({ type: 'hazard', desc: '新增隐患责任（' + (c.hazard.type || '未选类型') + '）', conflict: null, action: 'revert' });
      else if (b.hazard && !c.hazard) entries.push({ type: 'hazard', desc: '删除隐患责任（' + (b.hazard.type || '') + '）', conflict: null, action: 'revert' });
      else entries.push({ type: 'hazard', desc: '修改隐患责任' + describeHazardDiff(b.hazard, c.hazard), conflict: null, action: 'revert' });
    }
    // 冲突检测：系统检查表须分配全部对象（BR-16）；责任人须属于责任科室人员池
    var pool = c.dept && PERSON_BY_DEPT[c.dept] ? PERSON_BY_DEPT[c.dept] : null;
    cl.forEach(function(item, idx) {
      var reasons = [];
      if (item.checklistType === 'system' && (item.assignedObjects || []).length < total) {
        reasons.push('BR-16：系统检查表须分配全部管控对象（已选 ' + (item.assignedObjects || []).length + '/' + total + '）');
      }
      if (pool) {
        var persons = Array.isArray(item.person) ? item.person : (item.person ? [item.person] : []);
        var outsiders = persons.filter(function(p) { return pool.indexOf(p) < 0; });
        if (outsiders.length) reasons.push('责任人「' + outsiders.join('、') + '」不属于责任科室「' + c.dept + '」');
      }
      if (!reasons.length) return;
      var reason = reasons.join('；');
      var host = entries.filter(function(e) { return (e.type === 'checklist-edit' || e.type === 'checklist-add') && e.targetIdx === idx; })[0];
      if (host) host.conflict = reason;
      else entries.push({ type: 'checklist-conflict', targetIdx: idx, desc: '检查表《' + item.name + '》存在配置冲突', conflict: reason, action: 'handle' });
    });
    // 冲突检测：复核方=政府复核必须指定复核人
    if (c.hazard && c.hazard.reviewer === '政府复核' && !c.hazard.reviewPerson) {
      var hEntry = entries.filter(function(e) { return e.type === 'hazard'; })[0];
      if (hEntry) hEntry.conflict = '复核方为「政府复核」时必须指定复核人';
    }
    return entries;
  }

  // 撤销单条草稿（恢复该变更对应的基线状态）
  window.revertDraft = function(idx) {
    if (!draftConfig || !draftBaseline) return;
    var e = computeDraftEntries()[idx];
    if (!e) return;
    var baseCl = draftBaseline.checklists || [];
    if (e.type === 'dept') draftConfig.dept = draftBaseline.dept;
    else if (e.type === 'checklist-edit') draftConfig.checklists[e.targetIdx] = deepClone(baseCl[e.targetIdx]);
    else if (e.type === 'checklist-add') draftConfig.checklists.splice(e.targetIdx, 1);
    else if (e.type === 'checklist-delete') draftConfig.checklists.splice(e.targetIdx, 0, deepClone(baseCl[e.targetIdx]));
    else if (e.type === 'hazard') draftConfig.hazard = deepClone(draftBaseline.hazard || null);
    afterDraftChange();
  };

  window.openDomainConfig = function(domainId) {

    if (configState.domainId === domainId) return;
    if (configState.domainId && draftHasChanges() && !window.confirm('当前配置未保存，是否放弃？')) return;
    if (configState.domainId) { draftBaseline = null; draftConfig = null; }
    // 选中并展开树中对应节点
    expandToNode(domainId);
    selectNode(domainId);
    var toggle = document.querySelector('.tree-node[data-id="' + domainId + '"] .tree-toggle');
    if (toggle && !toggle.classList.contains('leaf')) {
      toggle.classList.add('expanded');
      var next = document.querySelector('.tree-node[data-id="' + domainId + '"]').nextElementSibling;
      if (next) next.classList.add('show');
    }
    configState.domainId = domainId;
    configState.objects = (OBJECT_DETAILS[domainId] || generateObjects(d)).map(function(o) { return o; });
    configState.targetConfigDept = d.dept || '';
    // BR-GOV-DS-18：进入配置页建立草稿基线，所有变更先写入 draftConfig，保存配置统一提交 / 取消全部丢弃
    draftBaseline = deepClone(CONFIG_DATA[domainId] || { checklists: [], hazard: null });
    if (draftBaseline.dept === undefined) draftBaseline.dept = d.dept || '';
    // 基线形态归一化（person 统一数组、scan 统一对象），避免无变更编辑产生假草稿条目
    var allObjNames = configState.objects.map(function(o) { return o.name; });
    (draftBaseline.checklists || []).forEach(function(c) {
      c.person = Array.isArray(c.person) ? c.person : (c.person ? [c.person] : []);
      c.scan = c.scan || { enabled: true };
      c.assignedPersons = c.assignedPersons || [];
      c.skipHoliday = !!c.skipHoliday;
      c.items = Array.isArray(c.items) ? c.items : [];
      // scope → assignedObjects 归一化（BR-GOV-DS-04：检查表配置下沉到管控对象级别，无"全部/指定"概念）
      if (!c.assignedObjects || c.assignedObjects.length === 0) {
        if (c.scope === '全部') {
          c.assignedObjects = allObjNames.slice();
        }
        // scope 为"指定(N个)"时保留旧值，无 assignedObjects 时保持空数组待手动配置
      }
      delete c.scope; // 旧字段不再使用
    });
    draftConfig = deepClone(draftBaseline);

    // 切换到任务配置tab
    currentTab = 'tab-config';
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.textContent === '任务配置');

    document.getElementById('tab-config').classList.add('active');
    renderConfig();
  };

    if (cfg && cfg.checklists && cfg.checklists.length) {
      html += '<div class="table-scroll"><table><thead><tr>';
      html += '<th>检查表名称</th><th>检查表来源</th><th>检查频次</th><th>已分配对象数</th><th>扫码责任</th><th>状态</th><th class="action-col">操作</th>';
      html += '</tr></thead><tbody>';
      cfg.checklists.forEach(function(c, idx) {
        var typeTag = c.checklistType === 'custom' ? '<span class="tag tag-orange">[自定义]</span>' : '<span class="tag tag-blue">[系统]</span>';
        var assignedCount = c.assignedObjects ? c.assignedObjects.length : 0;
        // 扫码责任列：科室级=XX科室（科室级），有人员=科室+人员，无人员=科室名
        var scanRespText = '';
        if (c.checklistType === 'system') {
          // 系统检查表扫码责任默认显示责任科室，不附加具体人员
          var isDeptLevel = c.selectedDepts && c.selectedDepts.indexOf('__dept_level__') >= 0;
          if (isDeptLevel) {
            scanRespText = c.dept + '（科室级）';
          } else {
            scanRespText = c.dept;
          }
        } else {
          var isDeptLevel = c.selectedDepts && c.selectedDepts.indexOf('__dept_level__') >= 0;
          if (isDeptLevel) {
            scanRespText = c.dept + '（科室级）';
          } else if (c.person && c.person.length > 0) {
            scanRespText = Array.isArray(c.person) ? c.person.join('、') : c.person;
          } else {
            scanRespText = c.dept;
          }
        }
        var scanTag = '<span class="tag tag-green">' + scanRespText + '</span>';
        html += '<tr><td>' + c.name + '</td>';
        html += '<td>' + typeTag + '</td>';
        html += '<td>' + (c.frequency || c.cycle || '—') + '</td>';
        html += '<td><a class="btn-link" onclick="viewAssignedObjects(\'' + d.id + '\',' + idx + ')">' + assignedCount + '/' + total + '</a></td>';
        html += '<td>' + scanTag + '</td>';
        html += '<td><label class="toggle-switch"><input type="checkbox"' + (c.enabled !== false ? ' checked' : '') + ' onchange="toggleConfig(\'checklist\',\'' + d.id + '\',' + idx + ',this.checked)"><span class="toggle-slider"></span></label></td>';
        // 系统检查表不可删除
        var actionBtns = '<button class="btn-link" onclick="editChecklist(\'' + d.id + '\',' + idx + ')">编辑</button>';
        if (c.checklistType !== 'system') actionBtns += '<button class="btn-link danger" onclick="deleteConfig(\'checklist\',\'' + d.id + '\',' + idx + ')">删除</button>';
        html += '<td class="action-col">' + actionBtns + '</td></tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="empty-state" style="padding:20px;"><div class="empty-text">暂无检查表配置，请点击"+ 新增检查表"手动创建</div></div>';
    }
    document.getElementById('configChecklistBlock').innerHTML = html;
  }

  function renderConfigHazardBlock(d) {
    var cfg = draftConfig || CONFIG_DATA[d.id];
    var html = '';
    if (cfg && cfg.hazard) {
      var h = cfg.hazard;
      html += '<div class="table-scroll"><table><thead><tr><th>隐患类型</th><th>整改责任人</th><th>整改期限</th><th>复核方</th><th>状态</th><th class="action-col">操作</th></tr></thead><tbody>';
      html += '<tr><td>' + h.type + '</td><td>' + (h.responder || '—') + '</td><td>' + (h.deadline || '—') + '天</td>';
      html += '<td>' + (h.reviewer || '—') + (h.reviewPerson ? '（' + h.reviewPerson + '）' : '') + '</td>';
      html += '<td><label class="toggle-switch"><input type="checkbox"' + (h.enabled !== false ? ' checked' : '') + ' onchange="toggleConfig(\'hazard\',\'' + d.id + '\',0,this.checked)"><span class="toggle-slider"></span></label></td>';
      html += '<td class="action-col"><button class="btn-link" onclick="openHazardEditModal(\'' + d.id + '\')">编辑</button><button class="btn-link danger" onclick="deleteConfig(\'hazard\',\'' + d.id + '\',0)">删除</button></td></tr>';
      html += '</tbody></table></div>';
    } else {
      html += '<div class="empty-state" style="padding:20px;"><div class="empty-text">未配置隐患责任</div></div>';
      html += '<div style="margin-top:8px;"><button class="btn btn-primary btn-sm" onclick="openHazardEditModal(\'' + d.id + '\')">+ 新增隐患责任</button></div>';
    }
    document.getElementById('configHazardBlock').innerHTML = html;
  }

  // 已分配对象数点击 → 弹窗查看该检查表已分配的管控对象列表
  window.viewAssignedObjects = function(domainId, idx) {
    var cfg = CONFIG_DATA[domainId];
    var c = cfg && cfg.checklists && cfg.checklists[idx];
    if (!c) return;
    document.getElementById('objectsTitle').textContent = c.name + ' — 已分配管控对象';
    var html = '';
    (c.assignedObjects || []).forEach(function(n, i) {
      html += '<div style="padding:6px 0;font-size:var(--font-size-sm);border-bottom:1px solid var(--border-light);">' + (i + 1) + '. ' + n + '</div>';
    });
    if (!html) html = '<div style="padding:16px;text-align:center;color:var(--text-secondary);">暂未分配管控对象</div>';
    document.getElementById('objectsBody').innerHTML = html;
    openModal('modal-objects');
  };



  window.saveDomainConfig = function() {
    var d = DOMAIN_SUMMARY.find(function(x) { return x.id === configState.domainId; });
    if (!d || !draftConfig) return;
    // BR-GOV-DS-18：草稿存在冲突时拦截保存
    var conflicts = computeDraftEntries().filter(function(e) { return e.conflict; });
    if (conflicts.length) { showToast('存在 ' + conflicts.length + ' 条冲突，请处理后再保存'); return; }
    CONFIG_DATA[d.id] = deepClone(draftConfig);
    d.dept = draftConfig.dept || '';
    draftBaseline = null; draftConfig = null;
    showToast('配置已保存');
    renderOverview();
  };

  // 面包屑推送
  try {
    window.parent.postMessage({ type: 'setBreadcrumb', items: ['政府端', '领域监管'] }, '*');
  } catch(e) {}
})();
</script>
  </div>
</body>
</html>
