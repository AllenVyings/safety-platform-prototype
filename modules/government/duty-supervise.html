<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常履职监督 - 政府端</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/framework.css">
  <style>
/* ========== 页面标题栏 ========== */
    .page-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: var(--spacing-md);
      background: var(--bg-primary);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .page-title { font-size: var(--font-size-lg); font-weight: 600; }
    
    /* ========== 统计卡片 ========== */
.stat-card {
      flex: 1;
      background: linear-gradient(135deg, var(--bg-section-alt) 0%, var(--bg-section) 100%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md) var(--spacing-lg);
      box-shadow: var(--shadow-sm);
      transition: all var(--duration-normal);
    }
    .stat-card:hover {
      background: linear-gradient(135deg, var(--bg-section) 0%, var(--bg-tertiary) 100%);
      box-shadow: var(--shadow-md);
    }
    .stat-value { font-size: var(--font-size-xxxl); font-weight: 600; }
    .stat-label { font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: var(--spacing-xs); }
    
    /* ========== 筛选栏 ========== */
    .filter-bar { 
      display: flex; 
      gap: var(--spacing-sm); 
      margin-bottom: var(--spacing-md); 
      align-items: center; 
      flex-wrap: wrap;
      background: var(--bg-section);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
    }
    .filter-item select, .filter-item input { 
      padding: 6px 10px; 
      border: 1px solid var(--border); 
      border-radius: var(--radius-md); 
      font-size: var(--font-size-sm); 
      background: var(--bg-primary);
    }
    .filter-item select:focus, .filter-item input:focus {
      border-color: var(--primary);
      outline: none;
    }
    
    /* ========== 表格容器 ========== */
    .table-wrap { 
      background: var(--bg-primary); 
      border-radius: var(--radius-lg); 
      overflow: hidden; 
      box-shadow: var(--shadow-card);
    }
    .table-scroll { overflow-x: auto; }
    .table-scroll table { width: 100%; min-width: 900px; border-collapse: collapse; }
    .table-scroll thead tr { background: var(--bg-section); }
    .table-scroll th { padding: 12px var(--spacing-md); text-align: left; font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border-light); }
    .table-scroll td { padding: 12px var(--spacing-md); font-size: var(--font-size-sm); border-bottom: 1px solid var(--border-light); }
    .table-scroll tbody tr:nth-child(even) { background: var(--bg-section-alt); }
    .table-scroll tbody tr:hover td { background: var(--bg-hover); }
    .ellipsis-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .action-col { width: 200px; }
    .action-col .btn-link { margin-right: 4px; }
    .action-col .btn-link:last-child { margin-right: 0; }
    
    /* ========== 进度条 ========== */
    .progress-bar { height: 8px; background: var(--bg-section-alt); border-radius: var(--radius-sm); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: var(--radius-sm); transition: width var(--duration-normal); }
    
    /* 分页 - .pagination 由 framework.css 提供 */
    
    /* ========== 标签样式 ========== */
    .tag { display: inline-block; padding: 2px var(--spacing-sm); border-radius: var(--radius-sm); font-size: var(--font-size-xs); }
    .tag-green { background: var(--success-light); color: var(--success); }
    .tag-gray { background: var(--bg-section-alt); color: var(--text-secondary); }
    .tag-orange { background: var(--warning-light); color: var(--warning); }
    .tag-red { background: var(--error-light); color: var(--error); }
    .tag-blue { background: var(--info-light); color: var(--info); }

    /* ========== 弹窗 ========== */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--bg-primary); border-radius: var(--radius-lg); box-shadow: 0 8px 32px rgba(0,0,0,0.18); width: 600px; max-height: 80vh; overflow: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--border-light); }
    .modal-title { font-size: var(--font-size-lg); font-weight: 600; }
    .modal-close { background: none; border: none; font-size: var(--font-size-xl); cursor: pointer; color: var(--text-tertiary); }
    .modal-body { padding: var(--spacing-lg); }
    .modal-footer { display: flex; justify-content: flex-end; gap: var(--spacing-sm); padding: var(--spacing-md) var(--spacing-lg); border-top: 1px solid var(--border-light); }
    .form-group { margin-bottom: var(--spacing-md); }
    .form-label { display: block; font-size: var(--font-size-sm); font-weight: 500; margin-bottom: 6px; color: var(--text-primary); }
    .form-control { width: 100%; padding: var(--spacing-sm) 12px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: var(--font-size-sm); }
    .form-control:focus { border-color: var(--primary); outline: none; }
    .required { color: var(--danger); }
    .btn { padding: 6px var(--spacing-md); border-radius: var(--radius-md); font-size: var(--font-size-sm); cursor: pointer; border: 1px solid var(--border-light); background: var(--bg-primary); }
    .btn-primary { background: var(--primary); color: var(--bg-primary); border-color: var(--primary); }
    .btn-link { padding: var(--spacing-xs) var(--spacing-sm); border: none; background: none; color: var(--primary); cursor: pointer; font-size: var(--font-size-sm); }
    .btn-link:hover { text-decoration: underline; }

    /* ========== 详情时间线 ========== */
    .timeline { position: relative; padding-left: 20px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--border-light); }
    .timeline-item { position: relative; padding-bottom: 16px; padding-left: 16px; }
    .timeline-item::before { content: ''; position: absolute; left: -18px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg-primary); box-shadow: 0 0 0 2px var(--primary); }
    .timeline-item.done::before { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
    .timeline-item.pending::before { background: var(--border); box-shadow: 0 0 0 2px var(--border); }
    .timeline-time { font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 2px; }
    .timeline-desc { font-size: var(--font-size-sm); color: var(--text-primary); }

    /* ========== 检查记录列表 ========== */
    .check-record { display: flex; align-items: center; padding: var(--spacing-sm) var(--spacing-sm); background: var(--bg-section); border-radius: var(--radius-md); border: 1px solid var(--border-section); margin-bottom: var(--spacing-sm); }
    .check-record-info { flex: 1; min-width: 0; }
    .check-record-title { font-size: var(--font-size-sm); color: var(--text-primary); margin-bottom: 2px; }
    .check-record-meta { font-size: var(--font-size-xs); color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="module-page page-container" data-module="gov-duty-supervise">
    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-prefix">当前位置：</span>
      <span class="breadcrumb-item current">政府端</span>
    </div>
    
    <div class="page-header" style="display: none;"></div>
    
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-value" style="color: var(--primary);">15</div><div class="stat-label">监管单位总数</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--success);">12</div><div class="stat-label">履职正常</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--warning);">2</div><div class="stat-label">履职滞后</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--error);">1</div><div class="stat-label">履职异常</div></div>
    </div>
    
    <div class="filter-bar">
      <div class="filter-item"><label>监管单位：</label><select id="filterDept"><option>全部</option><option>危化品监管科</option><option>基础安全监管科</option><option>综合协调科</option></select></div>
      <div class="filter-item"><label>履职状态：</label><select id="filterStatus"><option>全部</option><option>正常</option><option>滞后</option><option>异常</option></select></div>
      <div class="filter-item"><label>时间范围：</label><select id="filterTime"><option>本月</option><option>本季度</option><option>本年</option></select></div>
      <button class="btn btn-default" onclick="resetFilter()">重置</button>
      <div style="flex: 1;"></div>
      <button class="btn btn-primary" onclick="startSupervise()">+ 发起督查</button>
    </div>
    
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>监管单位</th>
              <th>负责领域</th>
              <th>本月检查次数</th>
              <th>隐患发现数</th>
              <th>整改完成率</th>
              <th>履职进度</th>
              <th>状态</th>
              <th class="action-col">操作</th>
            </tr>
          </thead>
          <tbody id="dutyTableBody">
            <tr>
              <td>危化品监管科</td>
              <td class="ellipsis-col" title="危险化学品、充换电设施">危险化学品、充换电设施</td>
              <td>28</td>
              <td>5</td>
              <td>100%</td>
              <td>
                <div class="progress-bar"><div class="progress-fill" style="width: 100%; background: var(--success);"></div></div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">100%</div>
              </td>
              <td><span class="tag tag-green">正常</span></td>
              <td class="action-col"><button class="btn-link" onclick="viewDetail('危化品监管科')">查看详情</button></td>
            </tr>
            <tr>
              <td>基础安全监管科</td>
              <td class="ellipsis-col" title="工业制造、建筑施工">工业制造、建筑施工</td>
              <td>22</td>
              <td>8</td>
              <td>87.5%</td>
              <td>
                <div class="progress-bar"><div class="progress-fill" style="width: 95%; background: var(--success);"></div></div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">95%</div>
              </td>
              <td><span class="tag tag-green">正常</span></td>
              <td class="action-col"><button class="btn-link" onclick="viewDetail('基础安全监管科')">查看详情</button></td>
            </tr>
            <tr>
              <td>综合协调科</td>
              <td class="ellipsis-col" title="公共场所、农贸市场">公共场所、农贸市场</td>
              <td>15</td>
              <td>3</td>
              <td>66.7%</td>
              <td>
                <div class="progress-bar"><div class="progress-fill" style="width: 70%; background: var(--warning);"></div></div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">70%</div>
              </td>
              <td><span class="tag tag-orange">滞后</span></td>
              <td class="action-col"><button class="btn-link" onclick="viewDetail('综合协调科')">查看详情</button><button class="btn-link" onclick="urgeAction('综合协调科')">催办</button></td>
            </tr>
            <tr>
              <td>执法监督科</td>
              <td class="ellipsis-col" title="交通运输、其他">交通运输、其他</td>
              <td>8</td>
              <td>12</td>
              <td>50%</td>
              <td>
                <div class="progress-bar"><div class="progress-fill" style="width: 40%; background: var(--error);"></div></div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">40%</div>
              </td>
              <td><span class="tag tag-red">异常</span></td>
              <td class="action-col"><button class="btn-link" onclick="viewDetail('执法监督科')">查看详情</button><button class="btn-link" onclick="superviseAction('执法监督科')">督办</button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="pg-info">共 15 条</span>
        <select class="pg-size">
          <option value="10" selected>10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="pg" disabled>上一页</button>
        <button class="pg active">1</button>
        <button class="pg">2</button>
        <button class="pg">下一页</button>
        <span class="pg-jump">前往 <input class="pg-jump-input" type="number" min="1" max="2" value="1"> 页</span>
      </div>
    </div>
  </div>

  <!-- 督办意见弹窗 -->
  <div class="modal-overlay" id="modal-supervise">
    <div class="modal" style="width:520px;">
      <div class="modal-header"><span class="modal-title">发起督办</span><button class="modal-close" onclick="closeModal('modal-supervise')">&times;</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">督办对象</label><input class="form-control" id="superviseDept" readonly></div>
        <div class="form-group"><label class="form-label"><span class="required">*</span> 督办意见</label><textarea class="form-control" id="superviseOpinion" rows="4" placeholder="请输入督办意见，说明需要整改的问题和要求"></textarea></div>
        <div class="form-group"><label class="form-label">整改期限</label><input type="date" class="form-control" id="superviseDeadline"></div>
      </div>
      <div class="modal-footer"><button class="btn" onclick="closeModal('modal-supervise')">取消</button><button class="btn btn-primary" onclick="submitSupervise()">提交督办</button></div>
    </div>
  </div>

  <!-- 发起督查弹窗 -->
  <div class="modal-overlay" id="modal-inspect">
    <div class="modal" style="width:560px;">
      <div class="modal-header"><span class="modal-title">发起督查</span><button class="modal-close" onclick="closeModal('modal-inspect')">&times;</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label"><span class="required">*</span> 督查类型</label><select class="form-control" id="inspectType"><option value="">请选择督查类型</option><option>日常督查</option><option>专项督查</option><option>联合督查</option></select></div>
        <div class="form-group"><label class="form-label"><span class="required">*</span> 督查内容</label><textarea class="form-control" id="inspectContent" rows="3" placeholder="请输入督查内容说明"></textarea></div>
        <div class="form-group"><label class="form-label"><span class="required">*</span> 督查对象</label><select class="form-control" id="inspectTarget"><option value="">请选择督查对象</option><option>危化品监管科</option><option>基础安全监管科</option><option>综合协调科</option><option>执法监督科</option></select></div>
        <div class="form-group"><label class="form-label">督查时间</label><input type="date" class="form-control" id="inspectDate"></div>
      </div>
      <div class="modal-footer"><button class="btn" onclick="closeModal('modal-inspect')">取消</button><button class="btn btn-primary" onclick="submitInspect()">发起督查</button></div>
    </div>
  </div>

  <!-- 履职详情弹窗 -->
  <div class="modal-overlay" id="modal-duty-detail">
    <div class="modal" style="width:680px;">
      <div class="modal-header"><span class="modal-title" id="dutyDetailTitle">履职详情</span><button class="modal-close" onclick="closeModal('modal-duty-detail')">&times;</button></div>
      <div class="modal-body" id="dutyDetailBody">
      </div>
      <div class="modal-footer"><button class="btn" onclick="closeModal('modal-duty-detail')">关闭</button></div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const CONFIG = {
        moduleId: 'gov-duty-supervise',
        moduleName: '日常履职监督'
      };

      let state = {
        initialized: false,
        currentPage: 1
      };

      var dutyData = {
        '危化品监管科': { dept: '危化品监管科', domain: '危险化学品、充换电设施', checks: 28, hazards: 5, rate: '100%', progress: 100, status: '正常' },
        '基础安全监管科': { dept: '基础安全监管科', domain: '工业制造、建筑施工', checks: 22, hazards: 8, rate: '87.5%', progress: 95, status: '正常' },
        '综合协调科': { dept: '综合协调科', domain: '公共场所、农贸市场', checks: 15, hazards: 3, rate: '66.7%', progress: 70, status: '滞后' },
        '执法监督科': { dept: '执法监督科', domain: '交通运输、其他', checks: 8, hazards: 12, rate: '50%', progress: 40, status: '异常' }
      };

      function init() {
        if (state.initialized) return;
        console.log('[' + CONFIG.moduleId + '] 模块初始化');
        state.initialized = true;
      }

      function showToast(msg) {
        var t = document.createElement('div');
        t.textContent = msg;
        Object.assign(t.style, { position:'fixed', top:'24px', left:'50%', transform:'translateX(-50%)', padding:'8px 24px', background:'var(--primary)', color:'var(--bg-primary)', borderRadius:'var(--radius-md)', fontSize:'var(--font-size-md)', zIndex:'9999', boxShadow:'0 2px 8px rgba(0,0,0,0.15)' });
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 2000);
      }

      window.openModal = function(id) { document.getElementById(id).classList.add('show'); };
      window.closeModal = function(id) { document.getElementById(id).classList.remove('show'); };

      // 查看详情：弹出履职详情弹窗
      window.viewDetail = function(dept) {
        var d = dutyData[dept];
        if (!d) return;
        document.getElementById('dutyDetailTitle').textContent = dept + ' - 履职详情';
        var progressColor = d.progress >= 90 ? 'var(--success)' : d.progress >= 60 ? 'var(--warning)' : 'var(--error)';
        var statusClass = d.status === '正常' ? 'tag-green' : d.status === '滞后' ? 'tag-orange' : 'tag-red';
        document.getElementById('dutyDetailBody').innerHTML =
          '<div style="display:flex;gap: var(--spacing-md);margin-bottom: var(--spacing-md);">' +
            '<div style="flex:1;background:var(--bg-section);border-radius: var(--radius-lg);padding:12px;text-align:center;"><div style="font-size: var(--font-size-xxl);font-weight:600;color:var(--primary);">' + d.checks + '</div><div style="font-size:var(--font-size-xs);color:var(--text-secondary);">本月检查次数</div></div>' +
            '<div style="flex:1;background:var(--bg-section);border-radius: var(--radius-lg);padding:12px;text-align:center;"><div style="font-size: var(--font-size-xxl);font-weight:600;color:var(--error);">' + d.hazards + '</div><div style="font-size:var(--font-size-xs);color:var(--text-secondary);">隐患发现数</div></div>' +
            '<div style="flex:1;background:var(--bg-section);border-radius: var(--radius-lg);padding:12px;text-align:center;"><div style="font-size: var(--font-size-xxl);font-weight:600;">' + d.rate + '</div><div style="font-size:var(--font-size-xs);color:var(--text-secondary);">整改完成率</div></div>' +
            '<div style="flex:1;background:var(--bg-section);border-radius: var(--radius-lg);padding:12px;text-align:center;"><span class="tag ' + statusClass + '">' + d.status + '</span><div style="font-size:var(--font-size-xs);color:var(--text-secondary);margin-top: var(--spacing-xs);">履职状态</div></div>' +
          '</div>' +
          '<div style="font-size:var(--font-size-md);font-weight:600;margin-bottom: var(--spacing-sm);">履职进度</div>' +
          '<div class="timeline">' +
            '<div class="timeline-item done"><div class="timeline-time">2026-05-28</div><div class="timeline-desc">完成月度巡查计划制定</div></div>' +
            '<div class="timeline-item done"><div class="timeline-time">2026-05-25</div><div class="timeline-desc">完成' + d.domain.split('、')[0] + '领域专项检查</div></div>' +
            '<div class="timeline-item done"><div class="timeline-time">2026-05-20</div><div class="timeline-desc">隐患整改复查通过</div></div>' +
            '<div class="timeline-item pending"><div class="timeline-time">2026-06-05（计划）</div><div class="timeline-desc">提交本月履职报告</div></div>' +
          '</div>' +
          '<div style="font-size:var(--font-size-md);font-weight:600;margin:16px 0 8px;">近期检查记录</div>' +
          '<div class="check-record"><div class="check-record-info"><div class="check-record-title">南山区充换电设施安全检查</div><div class="check-record-meta">2026-05-27 · 发现隐患2项 · 已整改1项</div></div><span class="tag tag-orange">整改中</span></div>' +
          '<div class="check-record"><div class="check-record-info"><div class="check-record-title">农贸市场消防安全检查</div><div class="check-record-meta">2026-05-22 · 发现隐患0项</div></div><span class="tag tag-green">已完成</span></div>' +
          '<div class="check-record"><div class="check-record-info"><div class="check-record-title">危化品仓储日常巡查</div><div class="check-record-meta">2026-05-18 · 发现隐患3项 · 已整改3项</div></div><span class="tag tag-green">已完成</span></div>';
        openModal('modal-duty-detail');
      };

      // 催办
      window.urgeAction = function(dept) {
        if (confirm('确定要向「' + dept + '」发送催办通知吗？')) {
          showToast('已发送催办通知至：' + dept);
        }
      };

      // 督办：弹出督办意见弹窗
      window.superviseAction = function(dept) {
        document.getElementById('superviseDept').value = dept;
        document.getElementById('superviseOpinion').value = '';
        document.getElementById('superviseDeadline').value = '';
        openModal('modal-supervise');
      };

      // 提交督办
      window.submitSupervise = function() {
        var opinion = document.getElementById('superviseOpinion').value.trim();
        if (!opinion) {
          showToast('请填写督办意见');
          return;
        }
        var dept = document.getElementById('superviseDept').value;
        closeModal('modal-supervise');
        showToast('已向 ' + dept + ' 发起督办');
      };

      // 发起督查：弹出督查流程弹窗
      window.startSupervise = function() {
        document.getElementById('inspectType').value = '';
        document.getElementById('inspectContent').value = '';
        document.getElementById('inspectTarget').value = '';
        document.getElementById('inspectDate').value = '';
        openModal('modal-inspect');
      };

      // 提交督查
      window.submitInspect = function() {
        var type = document.getElementById('inspectType').value;
        var content = document.getElementById('inspectContent').value.trim();
        var target = document.getElementById('inspectTarget').value;
        if (!type) { showToast('请选择督查类型'); return; }
        if (!content) { showToast('请填写督查内容'); return; }
        if (!target) { showToast('请选择督查对象'); return; }
        closeModal('modal-inspect');
        showToast('已向 ' + target + ' 发起' + type);
      };

      // 重置筛选
      window.resetFilter = function() {
        document.getElementById('filterDept').value = '全部';
        document.getElementById('filterStatus').value = '全部';
        document.getElementById('filterTime').value = '本月';
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      window.destroyModule = function() {
        state.initialized = false;
      };
    })();
  </script>
<script src="../../js/annotations.js"></script>
</body>
</html>
