<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深圳港集团安全综合管理系统 V2.0</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css?v=2.0">
  <link rel="stylesheet" href="css/framework.css?v=2.0">

  <!-- 配置 -->
  <script src="config/menus.js?v=2.0"></script>

  <!-- 核心 -->
  <script src="js/app.js?v=2.0"></script>

  <style>
    body { opacity: 0; transition: opacity 0.3s; }
    body.loaded { opacity: 1; }

    .item-badge {
      font-size: 10px;
      padding: 1px 6px;
      background: var(--primary);
      color: var(--text-inverse);
      border-radius: var(--radius-full);
      margin-left: auto;
    }

    .header-entry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px 4px 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.85);
      font-size: var(--font-size-13);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: var(--font-family);
    }
    .header-entry-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }
    .header-entry-btn:active {
      transform: scale(0.97);
    }
    .header-entry-icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-size: var(--font-size-14);
      flex-shrink: 0;
    }
    .header-entry-btn.entry-monitor .header-entry-icon {
      background: rgba(35, 102, 236, 0.35);
    }
    .header-entry-btn.entry-emergency .header-entry-icon {
      background: rgba(233, 84, 32, 0.35);
    }
    .header-entry-btn.entry-monitor:hover .header-entry-icon {
      background: rgba(35, 102, 236, 0.55);
    }
    .header-entry-btn.entry-emergency:hover .header-entry-icon {
      background: rgba(233, 84, 32, 0.55);
    }
    .header-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶部栏 -->
    <header class="top-header">
      <div class="top-header-left">
        <div class="top-header-logo">
          <div class="logo-icon">⚓</div>
          <span>深圳港集团安全综合管理系统</span>
        </div>
      </div>
      <div class="top-header-right">
        <button class="header-entry-btn entry-monitor" onclick="App.navigate('dashboard')">
          <span class="header-entry-icon">&#128200;</span>监控预警系统
        </button>
        <button class="header-entry-btn entry-emergency" onclick="App.navigate('emergency-personnel')">
          <span class="header-entry-icon">&#127909;</span>应急视频会议
        </button>
        <div class="header-divider"></div>
        <div class="header-user">
          <div class="header-user-avatar">管</div>
          <span>管理员</span>
        </div>
        <button class="header-btn" onclick="if(confirm('确认退出系统？')){console.log('退出登录')}">退出</button>
      </div>
    </header>

    <!-- 主体 -->
    <div class="app-body">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <nav class="sidebar-menu" id="sidebarMenu"></nav>
      </aside>

      <!-- 内容区 -->
      <main class="main-content">
        <div class="content-breadcrumb" id="breadcrumb">
          <span class="breadcrumb-current">系统首页</span>
        </div>
        <div class="content-wrapper" style="padding:0; overflow:hidden;">
          <iframe id="contentFrame" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
