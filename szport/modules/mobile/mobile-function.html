<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>功能中心 - 深圳港集团安全综合管理系统</title>
  <link rel="stylesheet" href="../../css/variables.css?v=2.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--bg-dark-primary);
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 20px 20px;
    }
    .simulator-label { color: var(--text-inverse); font-size: 14px; margin-bottom: 16px; opacity: 0.7; letter-spacing: 1px; }
    .phone-frame {
      width: 375px; height: 740px; background: var(--bg-gray-lighter);
      border-radius: 32px; box-shadow: 0 0 0 8px var(--bg-dark-secondary), 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .phone-statusbar {
      height: 44px; background: var(--brand); display: flex; align-items: flex-end;
      justify-content: space-between; padding: 0 24px 8px; color: var(--text-inverse);
      font-size: 12px; flex-shrink: 0;
    }
    .mobile-header {
      background: linear-gradient(135deg, var(--brand) 0%, var(--primary) 100%);
      padding: 12px 16px 20px; color: var(--text-inverse); flex-shrink: 0;
    }
    .mobile-header-title { font-size: 17px; font-weight: 600; }
    .mobile-content {
      flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 60px 0; -webkit-overflow-scrolling: touch;
    }
    .func-group { margin: 12px; }
    .func-group:first-child { margin-top: -12px; position: relative; z-index: 1; }
    .func-group-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 10px; padding-left: 2px;
    }
    .func-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
      background: var(--bg-card); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .func-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 4px; cursor: pointer; text-decoration: none; color: inherit;
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .func-item:nth-child(4n) { border-right: none; }
    .func-item:nth-last-child(-n+4) { border-bottom: none; }
    .func-item:active { background: var(--bg-hover); }
    .func-icon {
      width: 40px; height: 40px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; font-size: 20px;
    }
    .func-icon.blue { background: rgba(35,102,236,0.1); }
    .func-icon.orange { background: rgba(233,124,0,0.1); }
    .func-icon.red { background: rgba(209,0,0,0.1); }
    .func-icon.green { background: rgba(0,177,94,0.1); }
    .func-icon.purple { background: rgba(114,46,209,0.1); }
    .func-icon.teal { background: rgba(0,137,123,0.1); }
    .func-label { font-size: 11px; color: var(--text-secondary); text-align: center; line-height: 1.3; }
    .mobile-tabbar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 56px;
      background: var(--bg-card); border-top: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-around;
      flex-shrink: 0; z-index: 10;
    }
    .tabbar-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: pointer; padding: 4px 12px; text-decoration: none; color: inherit;
    }
    .tabbar-item .tabbar-icon { font-size: 20px; color: var(--text-description); }
    .tabbar-item .tabbar-label { font-size: 10px; color: var(--text-description); }
    .tabbar-item.active .tabbar-icon { color: var(--primary); }
    .tabbar-item.active .tabbar-label { color: var(--primary); font-weight: 600; }
  </style>
</head>
