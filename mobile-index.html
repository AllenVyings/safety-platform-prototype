<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端-企业侧原型预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .nav-panel { width: 240px; background: rgba(255,255,255,0.95); border-radius: 0 16px 16px 0; padding: 24px 16px; overflow-y: auto; flex-shrink: 0; box-shadow: 2px 0 12px rgba(0,0,0,0.1); }
    .nav-title { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #1677ff; }
    .nav-section { margin-bottom: 16px; }
    .nav-section-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-left: 8px; }
    .nav-item { display: block; padding: 8px 12px; font-size: 13px; color: #333; border-radius: 8px; cursor: pointer; transition: all 0.15s; text-decoration: none; }
    .nav-item:hover { background: #e6f7ff; color: #1677ff; }
    .nav-item.active { background: #1677ff; color: #fff; }

    .phone-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .phone-frame { width: 375px; height: 812px; background: #000; border-radius: 44px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 2px #333; position: relative; }
    .phone-screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #f5f6fa; position: relative; display: flex; flex-direction: column; }

    .status-bar { height: 44px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600; color: #1a1a1a; flex-shrink: 0; }
    .status-bar-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    .phone-content { flex: 1; overflow: hidden; }
    .phone-content iframe { width: 100%; height: 100%; border: none; }

    .tab-bar { height: 80px; background: #fff; border-top: 1px solid #f0f0f0; display: flex; align-items: flex-start; padding-top: 6px; position: relative; flex-shrink: 0; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 0; }
    .tab-icon { font-size: 22px; line-height: 1; }
    .tab-label { font-size: 10px; color: #999; margin-top: 2px; }
    .tab-item.active .tab-label { color: #1677ff; font-weight: 600; }

    .scan-btn { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; background: linear-gradient(135deg, #1677ff, #4096ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; box-shadow: 0 4px 12px rgba(22,119,255,0.4); cursor: pointer; border: 3px solid #fff; }
    .home-indicator { width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; margin: 0 auto; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); }

    .info-panel { width: 240px; background: rgba(255,255,255,0.95); border-radius: 16px 0 0 16px; padding: 24px 16px; flex-shrink: 0; box-shadow: -2px 0 12px rgba(0,0,0,0.1); }
    .info-title { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; }
    .info-section { margin-bottom: 16px; }
    .info-section h4 { font-size: 12px; color: #999; margin-bottom: 6px; }
    .info-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .info-row-label { color: #666; }
    .info-row-value { color: #1a1a1a; font-weight: 500; }
  </style>
</head>
<body>
  <div class="nav-panel">
    <div class="nav-title">移动端-企业侧</div>
    <div class="nav-section">
      <div class="nav-section-label">Tab 页面</div>
      <a class="nav-item active" onclick="navigateTo('enterprise-code')">🏠 企业码首页</a>
      <a class="nav-item" onclick="navigateTo('control-list')">📋 管控列表</a>
      <a class="nav-item" onclick="navigateTo('workbench')">⚡ 工作台</a>
      <a class="nav-item" onclick="navigateTo('task-list')">📌 任务管理</a>
      <a class="nav-item" onclick="navigateTo('profile')">👤 我的中心</a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">码首页</div>
      <a class="nav-item" onclick="navigateTo('place-code')">📍 场所码首页</a>
      <a class="nav-item" onclick="navigateTo('hazard-code')">⚡ 危险源码首页</a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">二级页面</div>
      <a class="nav-item" onclick="navigateTo('check-list')">📋 码上排查-检查表选择</a>
      <a class="nav-item" onclick="navigateTo('check-execute')">📝 码上排查执行</a>
      <a class="nav-item" onclick="navigateTo('hazard-detail')">🔧 隐患详情</a>
      <a class="nav-item" onclick="navigateTo('check-detail')">📄 检查详情</a>
      <a class="nav-item" onclick="navigateTo('code-change')">🔄 变码记录</a>
      <a class="nav-item" onclick="navigateTo('scan')">📷 扫一扫</a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">其他</div>
      <a class="nav-item" onclick="navigateTo('login')">🔑 登录</a>
    </div>
  </div>

  <div class="phone-wrapper">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-bar-right"><span>📶</span><span>🔋</span></div>
        </div>
        <div class="phone-content">
          <iframe id="mobileFrame" src="modules/mobile/enterprise-code.html"></iframe>
        </div>
        <div class="tab-bar">
          <div class="tab-item active" onclick="switchTab(0,'enterprise-code')"><span class="tab-icon">🏠</span><span class="tab-label">首页</span></div>
          <div class="tab-item" onclick="switchTab(1,'control-list')"><span class="tab-icon">📋</span><span class="tab-label">管控</span></div>
          <div class="tab-item" onclick="switchTab(2,'workbench')"><span class="tab-icon">⚡</span><span class="tab-label">工作台</span></div>
          <div class="tab-item" onclick="switchTab(3,'task-list')"><span class="tab-icon">📌</span><span class="tab-label">任务</span></div>
          <div class="tab-item" onclick="switchTab(4,'profile')"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
          <div class="scan-btn" onclick="navigateTo('scan')">📷</div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="info-panel">
    <div class="info-title">当前页面</div>
    <div class="info-section">
      <h4>PRD 章节</h4>
      <div class="info-row"><span class="info-row-label">章节</span><span class="info-row-value" id="infoSection">6.5.2</span></div>
      <div class="info-row"><span class="info-row-label">页面</span><span class="info-row-value" id="infoPage">企业码首页</span></div>
    </div>
    <div class="info-section">
      <h4>模拟数据</h4>
      <div class="info-row"><span class="info-row-label">企业</span><span class="info-row-value">创安电子科技</span></div>
      <div class="info-row"><span class="info-row-label">安全码</span><span class="info-row-value" style="color:#52c41a">绿色</span></div>
      <div class="info-row"><span class="info-row-label">场所</span><span class="info-row-value">5个</span></div>
      <div class="info-row"><span class="info-row-label">危险源</span><span class="info-row-value">2个</span></div>
    </div>
    <div class="info-section">
      <h4>操作提示</h4>
      <div style="font-size:12px;color:#666;line-height:1.6;">
        左侧导航切换页面<br>
        底部Tab切换主模块<br>
        📷按钮进入扫一扫<br>
        页面内元素可点击
      </div>
    </div>
  </div>

  <script>
    var tabs = document.querySelectorAll('.tab-item');
    var navItems = document.querySelectorAll('.nav-item');
    var frame = document.getElementById('mobileFrame');
    var pageInfo = {
      'enterprise-code':{section:'6.5.2',name:'企业码首页'},
      'place-code':{section:'6.5.3',name:'场所码首页'},
      'hazard-code':{section:'6.5.4',name:'危险源码首页'},
      'control-list':{section:'6.5.5',name:'管控列表'},
      'workbench':{section:'6.5.6',name:'工作台'},
      'task-list':{section:'6.5.7',name:'任务管理'},
      'profile':{section:'6.5.8',name:'我的中心'},
      'check-execute':{section:'6.5.2.3',name:'码上排查执行'},
      'check-list':{section:'6.5.2.3',name:'检查表选择'},
      'hazard-detail':{section:'6.5.6.5.3',name:'隐患详情'},
      'check-detail':{section:'6.5.6.4.5',name:'检查详情'},
      'code-change':{section:'6.5.2.4',name:'变码记录'},
      'scan':{section:'6.5.2.2',name:'扫一扫'},
      'login':{section:'6.5.1',name:'登录'}
    };
    var tabModules = ['enterprise-code','control-list','workbench','task-list','profile'];

    function switchTab(idx, mod) {
      tabs.forEach(function(t){t.classList.remove('active');});
      tabs[idx].classList.add('active');
      navigateTo(mod);
    }
    var currentModule = 'enterprise-code';
    var previousModule = '';
    function navigateTo(mod) {
      previousModule = currentModule;
      currentModule = mod;
      try { localStorage.setItem('checkListSource', previousModule); } catch(e) {}
      frame.src = 'modules/mobile/' + mod + '.html';
      var info = pageInfo[mod] || {};
      document.getElementById('infoSection').textContent = info.section || '-';
      document.getElementById('infoPage').textContent = info.name || mod;
      navItems.forEach(function(n){
        n.classList.remove('active');
        if(n.getAttribute('onclick') && n.getAttribute('onclick').indexOf(mod) > -1) n.classList.add('active');
      });
      var ti = tabModules.indexOf(mod);
      if(ti >= 0){ tabs.forEach(function(t){t.classList.remove('active');}); tabs[ti].classList.add('active'); }
    }
  </script>
</body>
</html>
